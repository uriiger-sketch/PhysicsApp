// ══════════════════════════════════════════════
// RENDER ENGINE
// ══════════════════════════════════════════════
function render(){
  // Preserve sidebar scroll position
  var _sidebarEl=document.getElementById('sidebar-nav');
  var _sidebarScroll=_sidebarEl?_sidebarEl.scrollTop:0;
  const ch=getChapters().find(c=>c.id===state.chapter);
  const sec=ch&&ch.sections?ch.sections.find(s=>s.id===state.section):null;
  const content=CONTENT[`${state.chapter}.${state.section}`];
  document.getElementById('app').innerHTML=buildPage(ch,sec,content);
  // Restore sidebar scroll position
  var _sidebarElNew=document.getElementById('sidebar-nav');
  if(_sidebarElNew)_sidebarElNew.scrollTop=_sidebarScroll;
  // boot KaTeX auto-render
  var _katexTries=0;
  function _bootUI(){
    attachEvents();
    if(state.tab==='theory') setTimeout(initTheoryAnims,60);
    if(state.tab==='sim'){
      const c2=CONTENT[`${state.chapter}.${state.section}`];
      if(c2&&c2.sim) setTimeout(function(){
        initSim('sim-canvas',c2.sim.type);
        showSimTooltip(c2.sim.desc);
      },60);
    }
  }
  function _tryKatex(){
    if(window.renderMathInElement){
      try{ renderMathInElement(document.getElementById('app'),{
        delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
        throwOnError:false,strict:false
      }); }catch(e){}
      _bootUI();
    } else if(_katexTries++<10){
      setTimeout(_tryKatex,40);
    } else { _bootUI(); }
  }
  setTimeout(_tryKatex,15);
}

function buildPage(ch,sec,content){
  const sidebar=buildSidebar();
  const main=buildMain(ch,sec,content);
  const allSecs=MECH_CHAPTERS.reduce(function(a,c){return a+c.sections.length;},0)+OPTICS_CHAPTERS.reduce(function(a,c){return a+c.sections.length;},0);
  const doneSecs=Object.keys(state.completed).filter(function(k){return k.endsWith('.quiz');}).length;
  const pct=Math.round(doneSecs/allSecs*100);
  const subjIcon=state.subject==='optics'?'🔆':'⚛️';
  const subjName=state.subject==='optics'?'אופטיקה':'מכניקה ניוטונית';
  return `
  <div class="header">
    <button class="hamburger-btn" id="hamburger-btn" onclick="openDrawer()" aria-label="נושאים">☰</button>
    <div class="header-title">${subjIcon} ${subjName}</div>
    <div class="header-progress">
      <div class="progress-bar-wrap" title="${pct}% הושלם"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      <span class="xp-badge" id="xp-badge-el">⭐ ${state.xp} XP</span>
      <span class="done-badge">${doneSecs}/${allSecs} ✓</span>
      <button class="theme-btn" onclick="toggleTheme()" title="עצב כהה/בהיר (Shift+D)">🌙</button>
      <button class="theme-btn" onclick="openFormulaPanel()" title="נוסחאות (Shift+F)" style="font-size:.9rem">📐</button>
      <button class="theme-btn" onclick="printSummary()" title="הדפס סיכום" style="font-size:.9rem">🖨</button>
    </div>
  </div>
  <div class="layout">
    <div class="sidebar" id="sidebar-nav">${sidebar}</div>
    <div class="main" id="main-content">${main}</div>
  </div>`;
}
window.switchSubject=function(subj){
  stopSim('sim-canvas');
  state.subject=subj;
  var chs=getChapters();
  state.chapter=chs[0].id;
  state.section=chs[0].sections[0].id;
  state.tab='theory';
  saveState();
  closeDrawer();
  render();
};
function buildSidebar(){
  var subjectTabs=`<div class="subject-tabs">
    <button class="subject-tab${state.subject==='mechanics'?' active':''}" onclick="switchSubject('mechanics')">⚛️ מכניקה</button>
    <button class="subject-tab${state.subject==='optics'?' active':''}" onclick="switchSubject('optics')">🔆 אופטיקה</button>
  </div>`;
  return subjectTabs+getChapters().map(function(ch){
    return `<div class="sidebar-chapter">${ch.icon} ${ch.title}</div>`+
    ch.sections.map(function(sec){
      const quizDone=isCompleted(ch.id,sec.id,'quiz');
      const theoryDone=isCompleted(ch.id,sec.id,'theory');
      const simDone=isCompleted(ch.id,sec.id,'sim');
      const anyDone=theoryDone||simDone;
      const active=state.chapter===ch.id&&state.section===sec.id;
      const dotCls=quizDone?'done':active?'active':anyDone?'partial':'';
      return `<button class="sec-btn${active?' active':''}" onclick="navigate('${ch.id}','${sec.id}')">
        <span class="sec-dot${dotCls?' '+dotCls:''}"></span>${sec.title}</button>`;
    }).join('');
  }).join('');
}

function buildMain(ch,sec,content){
  if(!content)return `<div class="locked-sec"><div class="lock-icon">🔧</div><p>תוכן לנושא זה בפיתוח.<br>נסה נושא אחר.</p></div>`;
  const quizDone=isQuizDone(state.chapter,state.section);
  const badgeTxt={theory:['badge-theory','📚 תיאוריה'],sim:['badge-sim','🔬 סימולציה'],quiz:['badge-quiz','🎯 חידון'],problem:['badge-problem','📝 בעיה']};
  const tabs=`<div class="tabs">
    <button class="tab${state.tab==='theory'?' active':''}" onclick="setTab('theory')">📚 תיאוריה <span class="kbd-hint">1</span></button>
    <button class="tab${state.tab==='sim'?' active':''}" onclick="setTab('sim')">🔬 סימולציה <span class="kbd-hint">2</span></button>
    <button class="tab${state.tab==='quiz'?' active':''}" onclick="setTab('quiz')">🎯 חידון <span class="kbd-hint">3</span></button>
    <button class="tab${state.tab==='problem'?' active':''}${!quizDone?' locked':''}" onclick="${quizDone?"setTab('problem')":'void(0)'}" title="${quizDone?'':'השלם חידון תחילה'}">📝 בעיה${!quizDone?' 🔒':''} <span class="kbd-hint">4</span></button>
  </div>`;
  let body='';
  if(state.tab==='theory')body=buildTheory(content.theory);
  else if(state.tab==='sim')body=buildSim(content.sim);
  else if(state.tab==='quiz')body=buildExample(content.example)+buildQuiz(content.quiz);
  else if(state.tab==='problem')body=quizDone?buildProblem(content.problem):`<div class="locked-sec"><div class="lock-icon">🔒</div><p>השלם את החידון תחילה!</p></div>`;
  return `<div class="sec-header${state.tab==='sim'?' sec-header--sim':''}">
    <span class="sec-badge ${badgeTxt[state.tab]?badgeTxt[state.tab][0]:'badge-theory'}">${badgeTxt[state.tab]?badgeTxt[state.tab][1]:''}</span>
    <div class="sec-title">${(sec&&sec.title)||''}</div>
    <div class="sec-desc">${(sec&&sec.sub)||''}</div>
  </div>${tabs}<div class="fade-in">${body}</div>`;
}
function buildTheory(th){
  if(!th)return '';
  let html=`<div class="theory-card"><h3>${th.title}</h3>${th.html}</div>`;
  if(th.enrich){
    html+=`<div class="enrich-card"><div class="enrich-title">${th.enrich.title}</div>${th.enrich.html}</div>`;
  }
  if(!isCompleted(state.chapter,state.section,'theory')){
    html+=`<button class="btn btn-primary" onclick="finishTheory()" style="margin-top:14px;width:100%">✅ הבנתי — קדימה לסימולציה →</button>`;
  }else{
    html+=`<div class="theory-done-msg">✅ תיאוריה הושלמה
      <button class="btn btn-primary" onclick="setTab('sim')" style="margin-right:auto;padding:5px 14px;font-size:.85rem">🔬 לסימולציה</button>
    </div>`;
  }
  return html;
}
function rng(id,min,max,val,step,lbl,unit){
  if(unit===undefined)unit='';
  const decimals=step<1?2:0;
  return `<div class="range-wrap"><label>${lbl}:</label><input id="inp-${id}" type="range" min="${min}" max="${max}" value="${val}" step="${step}" oninput="document.getElementById('rv-${id}').textContent=parseFloat(this.value).toFixed(${decimals})+'${unit}'"><span class="range-val" id="rv-${id}">${typeof val==='number'?val.toFixed(decimals):val}${unit}</span></div>`;
}function btn(id,lbl,cls){if(cls===undefined)cls='btn-primary';return `<button class="btn ${cls}" id="btn-${id}">${lbl}</button>`;}

function buildQuiz(qs){
  if(!qs||!qs.length)return'';
  const st=getQS(state.chapter,state.section);
  if(st.done){
    const ok=st.ans.filter(function(a,i){return a===qs[i].correct;}).length;
    const perfect=ok===qs.length;
    var nextSec=null;
    var _chs=getChapters();
    var chIdx=_chs.findIndex(function(c){return c.id===state.chapter;});
    if(chIdx>=0){
      var secIdx=_chs[chIdx].sections.findIndex(function(s){return s.id===state.section;});
      if(secIdx>=0&&secIdx<_chs[chIdx].sections.length-1){
        nextSec={ch:state.chapter,sec:_chs[chIdx].sections[secIdx+1].id,title:_chs[chIdx].sections[secIdx+1].title};
      } else if(chIdx<_chs.length-1&&_chs[chIdx+1].sections.length>0){
        nextSec={ch:_chs[chIdx+1].id,sec:_chs[chIdx+1].sections[0].id,title:_chs[chIdx+1].sections[0].title};
      }
    }
    const nextBtn=nextSec?`<button class="next-section-btn" onclick="navigate('${nextSec.ch}','${nextSec.sec}')">▶ הנושא הבא: ${nextSec.title}</button>`:'<div style="color:var(--green);text-align:center;margin-top:12px;font-weight:700">🎓 סיימת את כל הנושאים!</div>';
    return`<div class="done-banner">
      <div class="big-icon trophy-anim">${perfect?'🏆':'⭐'}</div>
      <h2>${perfect?'מושלם!':'חידון הושלם!'}</h2>
      <p>${ok}/${qs.length} תשובות נכונות${perfect?' — ניקוד מלא!':''}</p>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="resetQuiz()">🔄 נסה שוב</button>
        <button class="btn btn-secondary" onclick="setTab('problem')">📝 בעיה לפתרון</button>
      </div>
      ${nextBtn}
    </div>`;
  }
  const qi=st.cur;const q=qs[qi];const ans=st.ans[qi]!==undefined;
  const prog=`<div class="quiz-progress">${qs.map((_,i)=>`<div class="qp-dot${i<qi?(st.ans[i]===qs[i].correct?' done':' wrong'):i===qi?' active':''}"></div>`).join('')}</div>`;
  const lets=['א','ב','ג','ד'];
  const opts=q.opts.map((o,oi)=>{let cls='';if(ans){if(oi===q.correct)cls='correct';else if(oi===st.ans[qi])cls='wrong';}
    return`<button class="quiz-opt${cls?' '+cls:''}"${ans?' disabled':''} onclick="answerQuiz(${oi})"><span class="quiz-opt-letter">${lets[oi]}</span>${o}</button>`;
  }).join('');
  // Hint button (if question has a hint and not answered yet, costs 5 XP)
  var hintKey=state.chapter+'.'+state.section+'.'+qi;
  var hintShown=window._quizHints&&window._quizHints[hintKey];
  var hintHTML='';
  if(q.hint&&!ans&&!hintShown){
    hintHTML='<button class="quiz-hint-btn" onclick="showQuizHint('+qi+')">💡 רמז (−5 XP)</button>';
  }
  if(q.hint&&hintShown){
    hintHTML='<div class="quiz-hint-box">💡 '+q.hint+'</div>';
  }
  const fb=ans?`<div class="quiz-feedback${st.ans[qi]===q.correct?' fb-ok':' fb-err'}">
    <div style="font-size:1rem;margin-bottom:4px">${st.ans[qi]===q.correct?'✅ נכון!':'❌ לא נכון.'}</div>
    <div style="font-size:.88rem;color:var(--muted)">${q.explain||''}</div>
    ${q.formula&&st.ans[qi]!==q.correct?`<div style="margin-top:8px;padding:6px 10px;background:rgba(0,0,0,.2);border-radius:6px;font-family:monospace;color:var(--accent);font-size:.9rem">${q.formula}</div>`:''}
  </div>`:'';
  const nxt=ans?(qi<qs.length-1?`<button class="btn btn-primary" onclick="nextQ()" style="margin-top:12px">הבאה ← <kbd style="font-size:.75em;opacity:.6">Enter</kbd></button>`:`<button class="btn btn-green" onclick="finishQuiz()" style="margin-top:12px">סיום החידון ✓</button>`):'';
  return`<div class="quiz-card">${prog}<div class="quiz-q"><span class="quiz-q-num">${qi+1}</span>${q.q}</div><div class="quiz-opts">${opts}</div>${hintHTML}${fb}${nxt}</div>`;
}
function buildProblem(prob){
  if(!prob)return'';
  const ps=getPS(state.chapter,state.section);
  if(ps.done)return`<div class="done-banner"><div class="big-icon trophy-anim">🎓</div><h2>בעיה הושלמה!</h2><p>כל השלבים נפתרו!</p><button class="btn btn-secondary" onclick="resetProblem()" style="margin-top:14px">🔄 פתור שוב</button></div>`;
  const steps=prob.steps.map((st2,si)=>{
    const locked=si>ps.idx,solved=ps.solved[si],inp=ps.inputs[si]||'',fb=ps.feedback[si],hint=ps.hints[si];
    return`<div class="step-card${locked?' locked-step':''}${solved?' solved':''}">
      <div class="step-hdr"><div class="step-num${solved?' done':''}">${solved?'✓':si+1}</div><div class="step-q">${st2.q}</div></div>
      ${!solved?`${hint?`<div class="hint-box">💡 ${st2.hint}</div>`:''}
        <div class="step-inp-row">
          <input class="step-inp${fb==='correct'?' ok':fb?' err':''}" type="text" id="si${si}" value="${inp}" placeholder="תשובה..." oninput="upInp(${si},this.value)" onkeydown="if(event.key==='Enter')chkStep(${si})" ${locked?'disabled':''}>
          ${st2.unit?`<span class="unit-lbl">${st2.unit}</span>`:''}
          ${!locked&&!hint?`<button class="hint-btn" onclick="showHint(${si})">💡 רמז</button>`:''}
          ${!locked?`<button class="btn btn-primary" style="padding:7px 14px" onclick="chkStep(${si})">בדוק</button>`:''}
        </div>
        ${fb&&fb!=='correct'?`<div class="step-fb err">${fb}</div>`:''}`
      :`<div class="step-fb ok">✅ ${st2.explain}</div>`}
    </div>`;
  }).join('');
  return`<div class="problem-card"><div class="problem-text"><b>${prob.title}:</b> ${prob.text}</div><div class="problem-steps">${steps}</div></div>`;
}

window.restartSim=function(){
  var c=CONTENT[state.chapter+'.'+state.section];

};
window.answerQuiz=(oi)=>{const st=getQS(state.chapter,state.section);if(st.ans[st.cur]!==undefined)return;st.ans[st.cur]=oi;render();};
window.nextQ=()=>{getQS(state.chapter,state.section).cur++;render();};
window.finishQuiz=()=>{getQS(state.chapter,state.section).done=true;markCompleted(state.chapter,state.section,'quiz',100);};
window.resetQuiz=function(){state.quizState[state.chapter+'.'+state.section]={cur:0,ans:[],done:false};render();};
// Keyboard: Enter advances quiz
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'||e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(state.tab==='quiz'){
    var st=getQS(state.chapter,state.section);
    var c=CONTENT[state.chapter+'.'+state.section];
    if(!c||!c.quiz)return;
    var qs=c.quiz;
    if(st.done)return;
    if(st.ans[st.cur]!==undefined&&st.cur<qs.length-1){window.nextQ();}
    else if(st.ans[st.cur]!==undefined&&st.cur===qs.length-1){window.finishQuiz();}
  }
}, false);;
window.upInp=(si,v)=>{getPS(state.chapter,state.section).inputs[si]=v;};
window.showHint=(si)=>{const ps=getPS(state.chapter,state.section);ps.hints[si]=true;state.xp=Math.max(0,state.xp-5);render();};
window.chkStep=(si)=>{
  const ps=getPS(state.chapter,state.section);
  const content=CONTENT[`${state.chapter}.${state.section}`];
  const step=content.problem.steps[si];
  const inp=(ps.inputs[si]||'').trim();
  if(step.tolerance===-1){
    const ok=inp.toUpperCase()===step.answer.toUpperCase();
    if(ok){ps.solved[si]=true;ps.feedback[si]='correct';ps.idx=Math.max(ps.idx,si+1);if(ps.idx>=content.problem.steps.length){ps.done=true;markCompleted(state.chapter,state.section,'problem',150);}else render();}
    else{ps.feedback[si]='❌ לא נכון. נסה שוב.';render();}return;
  }
  const num=parseFloat(inp.replace(',','.').replace(/[^0-9.\-]/g,''));
  const ans=parseFloat(step.answer);
  const tol=step.tolerance||0;
  const ok=isNaN(ans)?inp.toLowerCase().includes(step.answer.toLowerCase()):Math.abs(num-ans)<=Math.max(tol,Math.abs(ans)*.04+.01);
  if(ok){ps.solved[si]=true;ps.feedback[si]='correct';ps.idx=Math.max(ps.idx,si+1);if(ps.idx>=content.problem.steps.length){ps.done=true;markCompleted(state.chapter,state.section,'problem',150);}else render();}
  else{ps.attempts=(ps.attempts||0)+1;if(ps.attempts>=3){ps.feedback[si]=`❌ נסיון ${ps.attempts}. רמז: ${step.hint}`;ps.hints[si]=true;}else ps.feedback[si]=`❌ לא מדויק (נסיון ${ps.attempts}/3). נסה שוב.`;render();}
};
window.resetProblem=()=>{state.problemState[`${state.chapter}.${state.section}`]={idx:0,inputs:[],solved:[],hints:[],feedback:[],done:false,attempts:0};render();};

function logToSheets(username, role, action){
  var row={
    time: new Date().toISOString(),
    user: username,
    role: role,
    action: action
  };
  // Always save to localStorage first (works offline too)
  try{
    var logs=JSON.parse(localStorage.getItem('phys_login_log')||'[]');

    localStorage.setItem('phys_login_log',JSON.stringify(logs));
  }catch(e){}

  // Send to Google Sheets if endpoint configured and online
  if(SHEETS_ENDPOINT && navigator.onLine){
    // IMPORTANT: use text/plain to avoid CORS preflight — Apps Script handles it fine
    fetch(SHEETS_ENDPOINT,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(row)
    }).catch(function(){}); // silent fail if offline / network error
  }
}

function buildFormulaPanelHTML(){

      ch.rows.map(function(r){

function openFormulaPanel(){
  var p=document.getElementById('formula-panel');
  var o=document.getElementById('formula-overlay');
  if(!p){
    p=document.createElement('div');
    p.id='formula-panel'; p.className='formula-panel';
    p.innerHTML=buildFormulaPanelHTML();
    document.body.appendChild(p);
    o=document.createElement('div');
    o.id='formula-overlay'; o.className='formula-overlay';
    o.onclick=closeFormulaPanel;
    document.body.appendChild(o);
    // Create FAB if missing
    if(!document.getElementById('formula-fab')){
      var fab=document.createElement('button');
      fab.id='formula-fab'; fab.className='formula-fab';
      fab.title='נוסחאות'; fab.textContent='📐';
      fab.onclick=openFormulaPanel;
      document.body.appendChild(fab);
    }
  }
  p.classList.add('open');
  o.classList.add('open');
  document.body.style.overflow='hidden';
}
window.openFormulaPanel=openFormulaPanel;
function closeFormulaPanel(){
  var p=document.getElementById('formula-panel');
  var o=document.getElementById('formula-overlay');

// XP SOUND (Web Audio API — subtle reward beep)
// ══════════════════════════════════════════════════════════════════
function playXPSound(){
  try{
    var ctx2=new(window.AudioContext||window.webkitAudioContext)();
    var osc=ctx2.createOscillator();
    var gain=ctx2.createGain();
    osc.connect(gain); gain.connect(ctx2.destination);
    osc.frequency.setValueAtTime(523,ctx2.currentTime);
    osc.frequency.setValueAtTime(659,ctx2.currentTime+0.1);
    osc.frequency.setValueAtTime(784,ctx2.currentTime+0.2);
    gain.gain.setValueAtTime(0.18,ctx2.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx2.currentTime+0.45);
    osc.start(ctx2.currentTime); osc.stop(ctx2.currentTime+0.45);
  }catch(e){}
}

// ══════════════════════════════════════════════════════════════════
// CHAPTER SUMMARY — shown when all sections in chapter are quiz-done
// ══════════════════════════════════════════════════════════════════
function getChapterSummary(chId){
  var ch=getChapters().find(function(c){return c.id===chId;});
  if(!ch) return null;
  var allDone=ch.sections.every(function(s){return isCompleted(chId,s.id,'quiz');});
  if(!allDone) return null;
  var totalXP=ch.sections.reduce(function(a,s){
    return a+(isCompleted(chId,s.id,'theory')?20:0)+
           (isCompleted(chId,s.id,'sim')?30:0)+
           (isCompleted(chId,s.id,'quiz')?50:0);
  },0);
  return {chapter:ch,totalXP:totalXP,sections:ch.sections.length};
}

function buildChapterSummaryHTML(chId){
  var info=getChapterSummary(chId);
  if(!info) return '';
  // Key formulas for chapter
  var chFormulas=FORMULA_DATA.find(function(d){
    return d.ch.includes(info.chapter.title.split(':')[1].trim().split(' ')[0]);
  });
  var fRows=chFormulas?chFormulas.rows.slice(0,4).map(function(r){
    return '<div class="summary-formula-row"><b>'+r.f+'</b> — '+r.d+'</div>';
  }).join(''):'';
  return '<div class="chapter-summary">'+
    '<div style="font-size:2.5rem">🎓</div>'+
    '<h2>פרק הושלם!</h2>'+
    '<p style="color:var(--muted);font-size:.9rem">'+info.chapter.title+'</p>'+
    '<div class="summary-stats">'+
      '<div class="stat-chip"><div class="val">'+info.sections+'</div><div class="lbl">נושאים</div></div>'+
      '<div class="stat-chip"><div class="val">'+info.totalXP+'</div><div class="lbl">XP שנצברו</div></div>'+
    '</div>'+
    (fRows?'<div class="summary-formulas"><div style="font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:6px">נוסחאות מפתח</div>'+fRows+'</div>':'')+
    '<button class="btn btn-primary" onclick="this.parentElement.style.display=\'none\'">המשך ←</button>'+
  '</div>';
}

// Inject chapter summary after quiz completion if chapter done
var _lastChapterSummaryShown='';
function maybeShowChapterSummary(){
  var chId=state.chapter;
  if(chId===_lastChapterSummaryShown) return;
  var summary=getChapterSummary(chId);
  if(!summary) return;
  _lastChapterSummaryShown=chId;
  setTimeout(function(){
    var main=document.getElementById('main-content');
    if(!main) return;
    var div=document.createElement('div');
    div.innerHTML=buildChapterSummaryHTML(chId);
    main.insertBefore(div.firstChild,main.firstChild);
    main.scrollTop=0;
    playXPSound();
  },400);
}

// ONBOARDING — 3-step first-visit overlay
// ══════════════════════════════════════════════════════════════════
var _onboardStep=0;
var ONBOARD_STEPS=[
  {icon:'⚛️',title:'ברוך הבא!',text:'משחק הלמידה של מכניקה ניוטונית — כל נושא כולל תיאוריה, סימולציה ואינטראקטיבית, ובחן עצמך בחידון.'},
  {icon:'📚',title:'תיאוריה → סימולציה → חידון',text:'בכל נושא עבור לפי הסדר: קרא את התיאוריה, שחק בסימולציה, ואז ענה על שאלות החידון. לחץ "✅ הבנתי" כדי לעבור הלאה.'},
  {icon:'⭐',title:'צבור XP והתקדם',text:'כל שלב שתסיים מעניק XP. ה-XP שלך נשמר אוטומטית. לחיצת Shift+F פותחת את לוח הנוסחאות המהיר.'},
];
function showOnboarding(){
  if(document.getElementById('onboard-overlay')) return;
  var ov=document.createElement('div');
  ov.id='onboard-overlay'; ov.className='onboard-overlay';
  document.body.appendChild(ov);
  _onboardStep=0;
  renderOnboard();
}
function renderOnboard(){
  var ov=document.getElementById('onboard-overlay');
  if(!ov) return;
  var s=ONBOARD_STEPS[_onboardStep];
  var dots=ONBOARD_STEPS.map(function(_,i){
    return '<div class="onboard-step'+(_onboardStep===i?' active':'')+'"></div>';
  }).join('');
  var isLast=_onboardStep===ONBOARD_STEPS.length-1;
  ov.innerHTML='<div class="onboard-card">'+
    '<div class="onboard-icon">'+s.icon+'</div>'+
    '<h2>'+s.title+'</h2>'+
    '<p>'+s.text+'</p>'+
    '<div class="onboard-steps">'+dots+'</div>'+
    '<div class="onboard-nav">'+
      (isLast?
        '<button class="btn btn-primary" onclick="closeOnboarding()">🚀 בואו נתחיל!</button>':
        '<button class="btn btn-primary" onclick="nextOnboard()">הבא ←</button>')+
    '</div>'+
  '</div>';
}
window.nextOnboard=function(){
  _onboardStep=Math.min(_onboardStep+1,ONBOARD_STEPS.length-1);
  renderOnboard();
};
function closeOnboarding(){
  var ov=document.getElementById('onboard-overlay');
  if(ov) ov.remove();
  localStorage.setItem('phys_onboarded','1');
}

// ══════════════════════════════════════════════════════════════════
// KEYBOARD SHORTCUTS
// ══════════════════════════════════════════════════════════════════
document.addEventListener('keydown',function(e){
  var tag=e.target.tagName;
  var editable=tag==='INPUT'||tag==='TEXTAREA'||e.target.isContentEditable;
  if(editable&&!e.shiftKey) return;
  switch(e.key){
    // 1/2/3/4 → switch tabs
    case '1': if(!editable){e.preventDefault();setTab('theory');} break;
    case '2': if(!editable){e.preventDefault();setTab('sim');} break;
    case '3': if(!editable){e.preventDefault();setTab('quiz');} break;
    case '4': if(!editable&&isQuizDone(state.chapter,state.section)){e.preventDefault();setTab('problem');} break;
    // ArrowLeft/Right → prev/next section
    case 'ArrowRight':
    case 'ArrowLeft':{
      if(editable) break;
      e.preventDefault();
      var _chs2=getChapters();
      var chIdx=_chs2.findIndex(function(c){return c.id===state.chapter;});
      if(chIdx<0) break;
      var secIdx=_chs2[chIdx].sections.findIndex(function(s){return s.id===state.section;});
      if(e.key==='ArrowRight'){
        if(secIdx>0) navigate(state.chapter,_chs2[chIdx].sections[secIdx-1].id);
        else if(chIdx>0){var pc=_chs2[chIdx-1];navigate(pc.id,pc.sections[pc.sections.length-1].id);}
      } else {
        if(secIdx<_chs2[chIdx].sections.length-1) navigate(state.chapter,_chs2[chIdx].sections[secIdx+1].id);
        else if(chIdx<_chs2.length-1) navigate(_chs2[chIdx+1].id,_chs2[chIdx+1].sections[0].id);
      }
      break;
    }
    // Escape → close panels
    case 'Escape': closeDrawer(); closeFormulaPanel(); break;
    // Shift+F → formula panel
    case 'F': if(e.shiftKey){e.preventDefault();openFormulaPanel();} break;
    // Shift+D → toggle theme
    case 'D': if(e.shiftKey){e.preventDefault();window.toggleTheme();} break;
  }
},false);

function celebrateSection(){
  // Brief confetti burst using canvas overlay
  var ov=document.createElement('canvas');
  ov.style.cssText='position:fixed;inset:0;z-index:9980;pointer-events:none;';
  ov.width=window.innerWidth; ov.height=window.innerHeight;
  document.body.appendChild(ov);
  var ctx3=ov.getContext('2d');
  var particles=[];
  var cols=['#34d399','#60a5fa','#fbbf24','#f87171','#a78bfa'];
  for(var _i=0;_i<60;_i++){
    particles.push({
      x:Math.random()*ov.width, y:ov.height*0.3+Math.random()*ov.height*0.4,
      vx:(Math.random()-0.5)*5, vy:-Math.random()*8-2,
      size:4+Math.random()*6, col:cols[Math.floor(Math.random()*cols.length)],
      alpha:1, rot:Math.random()*Math.PI*2, rotV:(Math.random()-0.5)*0.2
    });
  }
  var _start=null;
  function _animConf(ts){
    if(!_start) _start=ts;
    var elapsed=(ts-_start)/1000;
    ctx3.clearRect(0,0,ov.width,ov.height);
    var alive=false;
    particles.forEach(function(p){
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.25; p.rot+=p.rotV;
      p.alpha=Math.max(0,1-elapsed/1.2);
      if(p.alpha>0) alive=true;
      ctx3.save(); ctx3.globalAlpha=p.alpha; ctx3.translate(p.x,p.y);
      ctx3.rotate(p.rot); ctx3.fillStyle=p.col;
      ctx3.fillRect(-p.size/2,-p.size/2,p.size,p.size);
      ctx3.restore();
    });
    if(alive) requestAnimationFrame(_animConf);
    else ov.remove();
  }
  requestAnimationFrame(_animConf);
}
