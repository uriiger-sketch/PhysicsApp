// SIMULATION REGISTRY
// ══════════════════════════════════════════════

// ── DPR-aware canvas setup ─────────────────────
function setupCanvas(canvas, H){
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.offsetWidth || canvas.parentElement && canvas.parentElement.offsetWidth || 720;
  const cssH = H;
  canvas.style.height = cssH + 'px';
  canvas.width  = cssW * dpr;
  canvas.height = cssH * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  return { ctx, W: cssW, H: cssH, dpr };
}

// ── Pointer helpers: dpr-safe canvas coords + drag→slider sync ──
function simPointerXY(canvas,dpr,evt){
  var r=canvas.getBoundingClientRect();
  var scl=(canvas.width/dpr)/r.width;
  return {x:((evt.touches?evt.touches[0].clientX:evt.clientX)-r.left)*scl,
          y:((evt.touches?evt.touches[0].clientY:evt.clientY)-r.top)*scl};
}
function simSyncSlider(id,val,dec){
  var el=document.getElementById('inp-'+id);if(!el)return;
  var lo=parseFloat(el.min),hi=parseFloat(el.max);
  el.value=Math.max(lo,Math.min(hi,val)).toFixed(dec);
  el.dispatchEvent(new Event('input'));
}

// ── Shared drawing helpers ─────────────────────
function simArrow(ctx, x1,y1, x2,y2, color, lw, hw){
  if(lw===undefined)lw=2.5; if(hw===undefined)hw=11;
  if(Math.hypot(x2-x1,y2-y1)<4) return;
  ctx.save();
  ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=lw;
  ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  const ang=Math.atan2(y2-y1,x2-x1);
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-Math.cos(ang-0.4)*hw, y2-Math.sin(ang-0.4)*hw);
  ctx.lineTo(x2-Math.cos(ang+0.4)*hw, y2-Math.sin(ang+0.4)*hw);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function simBg(ctx,W,H){
  var g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#060d1c');g.addColorStop(0.5,'#040e18');g.addColorStop(1,'#030c15');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.strokeStyle='rgba(30,58,92,.12)';ctx.lineWidth=0.5;
  var gs=32;
  for(var xi=0;xi<W;xi+=gs){ctx.beginPath();ctx.moveTo(xi,0);ctx.lineTo(xi,H);ctx.stroke();}
  for(var yi=0;yi<H;yi+=gs){ctx.beginPath();ctx.moveTo(0,yi);ctx.lineTo(W,yi);ctx.stroke();}
  ctx.restore();
}
function simText(ctx,txt,x,y,col,sz,align,bold){
  if(col===undefined)col='#64748b'; if(sz===undefined)sz=11; if(align===undefined)align='center'; if(bold===undefined)bold=false;
  ctx.save(); ctx.fillStyle=col; ctx.font=(bold?'bold ':'')+sz+'px Heebo';
  ctx.textAlign=align; ctx.fillText(txt,x,y); ctx.restore();
}
function simCircle(ctx,x,y,r,fill,stroke,lw){
  if(lw===undefined)lw=2;
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=fill; ctx.fill();
  if(stroke){ctx.strokeStyle=stroke; ctx.lineWidth=lw; ctx.stroke();}
}
function simGround(ctx,W,y,col){
  if(col===undefined)col='#1e3a52';
  ctx.save();
  ctx.strokeStyle=col; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  ctx.strokeStyle='rgba(30,58,82,.5)'; ctx.lineWidth=1;
  for(let x=0;x<W;x+=16){ ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+10,y+7); ctx.stroke(); }
  ctx.restore();
}
function drawBox(ctx,x,y,w,h,fill,stroke,lw,radius){
  if(fill===undefined)fill='#1e3a52'; if(stroke===undefined)stroke='#3b82f6'; if(lw===undefined)lw=2; if(radius===undefined)radius=5;
  ctx.save(); ctx.beginPath();
  ctx.roundRect(x,y,w,h,radius);
  ctx.fillStyle=fill; ctx.fill();
  ctx.strokeStyle=stroke; ctx.lineWidth=lw; ctx.stroke();
  ctx.restore();
}

// ── stop/init ──────────────────────────────────
const _simStop={};
const _simGen={};
function stopSim(id){_simStop[id]=true;}
function initSim(id,type){
  stopSim(id);
  const canvas=document.getElementById(id);
  if(!canvas)return;

// CH1 SIM 1: POSITION-TIME
function simPositionTime(canvas){
  const H=440; const {ctx,W,dpr}=setupCanvas(canvas,H);
  const AXISY=110;
  const GL=66, GR=W-36;
  const GT=190, GB=H-28;
  const XRANGE=20;
  const SCALE=(GR-GL)/XRANGE;
  let ballX=W/2, drag=false, startT=null;
  let hist=[];
  const id=canvas.id;

  const getXm=function(){ return (ballX-GL)/SCALE-XRANGE/2; };
  const toCanvasX=function(xm){ return GL+(xm+XRANGE/2)*SCALE; };

  function drawAxis(){
    ctx.save();
    ctx.fillStyle='rgba(248,113,113,.07)'; ctx.fillRect(GL,AXISY-50,(GR-GL)/2,100);
    ctx.fillStyle='rgba(52,211,153,.07)';  ctx.fillRect(GL+(GR-GL)/2,AXISY-50,(GR-GL)/2,100);
    ctx.restore();
    for(var v=-10;v<=10;v++){
      var px=toCanvasX(v); var major=(v%5===0);
      ctx.save(); ctx.strokeStyle=v===0?'#2d5275':major?'#1a3245':'#0e1e2e';
      ctx.lineWidth=v===0?1.5:major?0.8:0.4; ctx.globalAlpha=v===0?1:major?0.6:0.25;
      ctx.beginPath(); ctx.moveTo(px,AXISY-50); ctx.lineTo(px,AXISY+50); ctx.stroke(); ctx.restore();
    }
    for(var v=-10;v<=10;v+=5){
      var px=toCanvasX(v);
      ctx.save(); ctx.strokeStyle='#3d6480'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(px,AXISY-14); ctx.lineTo(px,AXISY+14); ctx.stroke(); ctx.restore();
      simText(ctx,v===0?'0':(v>0?'+'+v:String(v)),px,AXISY+28,v===0?'#94a3b8':'#4a7595',11);
    }
    ctx.save(); ctx.strokeStyle='#2d5275'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(GL-4,AXISY); ctx.lineTo(GR+4,AXISY); ctx.stroke(); ctx.restore();
    simArrow(ctx,GR-4,AXISY,GR+14,AXISY,'#2d5275',2.5,10);
    simText(ctx,'x (m)',GR+18,AXISY+4,'#4a7595',11,'left');
    ctx.save(); ctx.strokeStyle='rgba(255,255,255,.2)'; ctx.lineWidth=1; ctx.setLineDash([3,6]);
    ctx.beginPath(); ctx.moveTo(toCanvasX(0),AXISY-58); ctx.lineTo(toCanvasX(0),AXISY+58); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
    simText(ctx,'O',toCanvasX(0),AXISY+44,'#64748b',10);
    simText(ctx,'שלילי',GL+32,AXISY-56,'#f87171',10);
    simText(ctx,'חיובי',GR-32,AXISY-56,'#34d399',10);
  }

  function drawBall(){
    var xm=getXm();
    var bx=Math.max(GL+18,Math.min(GR-18,toCanvasX(Math.max(-10,Math.min(10,xm)))));
    var col=xm>0?'#34d399':xm<0?'#f87171':'#94a3b8';
    var ox=toCanvasX(0);
    if(Math.abs(xm)>0.4){
      simArrow(ctx,ox,AXISY-64,bx,AXISY-64,col,2.5,10);
      ctx.save(); ctx.fillStyle='rgba(8,18,36,.85)'; ctx.strokeStyle=col; ctx.lineWidth=1;
      ctx.beginPath(); ctx.roundRect((ox+bx)/2-40,AXISY-82,80,16,4); ctx.fill(); ctx.stroke();
      simText(ctx,'Δx='+(xm>=0?'+':'')+xm.toFixed(2)+'m',(ox+bx)/2,AXISY-71,col,9,'center'); ctx.restore();
    }
    ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=1; ctx.globalAlpha=0.4; ctx.setLineDash([2,4]);
    ctx.beginPath(); ctx.moveTo(bx,AXISY-20); ctx.lineTo(bx,AXISY); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
    ctx.save(); ctx.shadowColor=col; ctx.shadowBlur=18;
    var g2=ctx.createRadialGradient(bx-5,AXISY-5,2,bx,AXISY,18);
    g2.addColorStop(0,'#bfdbfe'); g2.addColorStop(0.5,'#3b82f6'); g2.addColorStop(1,'#1e3a8a');
    simCircle(ctx,bx,AXISY,18,g2,'#60a5fa',2); ctx.restore();
    ctx.save(); ctx.fillStyle='rgba(8,18,36,.9)'; ctx.strokeStyle=col; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.roundRect(bx-50,AXISY-110,100,26,5); ctx.fill(); ctx.stroke();
    simText(ctx,'x='+(xm>=0?'+':'')+xm.toFixed(3)+'m',bx,AXISY-93,col,12,'center'); ctx.restore();
  }

  function drawGraph(){
    var gW=GR-GL, gH=GB-GT, midG=(GT+GB)/2;
    ctx.save();
    var gbg=ctx.createLinearGradient(GL,GT,GL,GB);
    gbg.addColorStop(0,'rgba(12,26,50,.7)'); gbg.addColorStop(1,'rgba(6,14,28,.9)');
    ctx.fillStyle=gbg; ctx.fillRect(GL,GT,gW,gH); ctx.restore();
    for(var xv=-10;xv<=10;xv+=5){
      var py=midG-(xv/10)*gH/2;
      ctx.save(); ctx.strokeStyle=xv===0?'#1e3a52':'#0c1c30';
      ctx.lineWidth=xv===0?1.2:0.6; ctx.setLineDash(xv===0?[]:[3,6]);
      ctx.beginPath(); ctx.moveTo(GL,py); ctx.lineTo(GR,py); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
      simText(ctx,xv===0?'0':(xv>0?'+'+xv:String(xv)),GL-5,py+4,'#2d5060',9,'right');
    }
    ctx.save(); ctx.strokeStyle='#1a3a5c'; ctx.lineWidth=1.5; ctx.strokeRect(GL,GT,gW,gH); ctx.restore();
    simText(ctx,'x(t)',GL+14,GT+14,'#4a7595',10,'left');
    simText(ctx,'t→',GR-2,GB+16,'#4a7595',10,'right');
    if(hist.length>3){
      var tMax=Math.max(5,(hist[hist.length-1]||{t:5}).t+0.5);
      var toGx=function(tv){ return GL+(tv/tMax)*gW; };
      var toGy=function(xv){ return midG-(xv/10)*gH/2; };
      ctx.save(); ctx.lineWidth=2.5; ctx.lineJoin='round'; ctx.lineCap='round';
      var grd=ctx.createLinearGradient(GL,0,GR,0);
      grd.addColorStop(0,'#6366f1'); grd.addColorStop(0.5,'#3b82f6'); grd.addColorStop(1,'#34d399');
      ctx.strokeStyle=grd; ctx.beginPath();
      for(var i=0;i<hist.length;i++){
        var px=toGx(hist[i].t), py=toGy(hist[i].x);
        if(py<GT||py>GB) continue;
        i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
      }
      ctx.stroke(); ctx.restore();
      var last=hist[hist.length-1];
      var lx=toGx(last.t), ly=toGy(last.x);
      if(ly>=GT&&ly<=GB) simCircle(ctx,lx,ly,5,'#60a5fa','',0);
    }
  }

  function draw(ts){
    if(_simStop[id])return;
    if(drag&&startT!==null){ hist.push({t:(ts-startT)/1000, x:getXm()}); if(hist.length>1200)hist.shift(); }
    simBg(ctx,W,H);
    drawAxis(); drawBall(); drawGraph();
    ctx.save(); ctx.fillStyle='rgba(8,18,36,.7)'; ctx.strokeStyle='#1a3252'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.roundRect(GL,GT-22,GR-GL,16,3); ctx.fill(); ctx.stroke();
    simText(ctx,'גרור את הכדור — הגרף מתעד x(t)',W/2,GT-11,'#334e68',9,'center'); ctx.restore();
    requestAnimationFrame(draw);
  }
  function getXE(e){ var r=canvas.getBoundingClientRect(); return ((e.touches?e.touches[0].clientX:e.clientX)-r.left)*(canvas.width/r.width)/dpr; }
  canvas.addEventListener('mousedown',function(e){drag=true;ballX=getXE(e);startT=performance.now();hist=[];});
  canvas.addEventListener('mousemove',function(e){if(drag)ballX=getXE(e);});
  canvas.addEventListener('mouseup',function(){drag=false;});
  canvas.addEventListener('touchstart',function(e){e.preventDefault();drag=true;ballX=getXE(e);startT=performance.now();hist=[];},{passive:false});
  canvas.addEventListener('touchmove',function(e){e.preventDefault();if(drag)ballX=getXE(e);},{passive:false});
  canvas.addEventListener('touchend',function(){drag=false;});
  var rb=document.getElementById('btn-pt-reset'); if(rb)rb.addEventListener('click',function(){hist=[];ballX=W/2;});
  requestAnimationFrame(draw);
}

function simConstVelocity(canvas){
  const H=430; const {ctx,W,dpr}=setupCanvas(canvas,H);

    if(_simStop[id])return;

      ctx.beginPath(); ctx.moveTo(px,AXISY-12); ctx.lineTo(px,AXISY+12); ctx.stroke(); ctx.restore();
      simText(ctx,v===0?'0':(v>0?'+'+v:String(v)),px,AXISY+26,'#4a7595',11);
    }
    ctx.save(); ctx.strokeStyle='#2d5275'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(GL-4,AXISY); ctx.lineTo(GR+4,AXISY); ctx.stroke(); ctx.restore();

    ctx.save(); ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=1; ctx.setLineDash([3,6]);
    ctx.beginPath(); ctx.moveTo(toXpx(0),AXISY-48); ctx.lineTo(toXpx(0),AXISY+48); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
    // Ball
    var bx=Math.max(GL+18,Math.min(GR-18,toXpx(Math.max(-10,Math.min(10,xm)))));
    var arLen=vel*18; var arCol=vel>0?'#34d399':vel<0?'#f87171':'#94a3b8';
    if(Math.abs(arLen)>5) simArrow(ctx,bx,AXISY-30,bx+arLen,AXISY-30,arCol,3,12);
    simText(ctx,'v='+(vel>=0?'+':'')+vel.toFixed(2)+' m/s',bx+arLen/2,AXISY-44,arCol,11,'center');
    ctx.save(); ctx.fillStyle='rgba(251,191,36,.1)'; ctx.strokeStyle='rgba(251,191,36,.4)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.roundRect(bx-24,AXISY+20,48,16,4); ctx.fill(); ctx.stroke();
    simText(ctx,'a=0',bx,AXISY+31,'#fbbf24',9,'center'); ctx.restore();
    ctx.save(); ctx.shadowColor='rgba(59,130,246,.7)'; ctx.shadowBlur=16;
    var g2=ctx.createRadialGradient(bx-4,AXISY-4,2,bx,AXISY,18);
    g2.addColorStop(0,'#bfdbfe'); g2.addColorStop(0.5,'#3b82f6'); g2.addColorStop(1,'#1e3a8a');
    simCircle(ctx,bx,AXISY,18,g2,'#60a5fa',2); ctx.restore();
    ctx.save(); ctx.fillStyle='rgba(8,18,36,.88)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.roundRect(bx-48,AXISY-104,96,24,5); ctx.fill(); ctx.stroke();
    simText(ctx,'x='+(xm>=0?'+':'')+xm.toFixed(2)+'m',bx,AXISY-88,'#93c5fd',11,'center'); ctx.restore();
    // Graph
    var gW=GR-GL, gH=GB-GT, midG=(GT+GB)/2;
    ctx.save();
    var gbg=ctx.createLinearGradient(GL,GT,GL,GB);
    gbg.addColorStop(0,'rgba(12,26,50,.7)'); gbg.addColorStop(1,'rgba(6,14,28,.9)');
    ctx.fillStyle=gbg; ctx.fillRect(GL,GT,gW,gH); ctx.restore();
    for(var xv=-10;xv<=10;xv+=5){
      var py=midG-(xv/10)*gH/2;
      ctx.save(); ctx.strokeStyle=xv===0?'#1e3a52':'#0c1c30'; ctx.lineWidth=xv===0?1.2:0.6;
      ctx.setLineDash(xv===0?[]:[3,6]); ctx.beginPath(); ctx.moveTo(GL,py); ctx.lineTo(GR,py); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
      simText(ctx,xv===0?'0':(xv>0?'+'+xv:String(xv)),GL-5,py+4,'#2d5060',9,'right');
    }
    ctx.save(); ctx.strokeStyle='#1a3a5c'; ctx.lineWidth=1.5; ctx.strokeRect(GL,GT,gW,gH); ctx.restore();
    simText(ctx,'x(t)',GL+14,GT+14,'#4a7595',10,'left');
    simText(ctx,'t→',GR-2,GB+16,'#4a7595',10,'right');
    if(hist.length>3){
      var tSpan=Math.max(12,t+1);
      var toGx=function(tv){return GL+(tv/tSpan)*gW;};
      var toGy2=function(xv2){return midG-(xv2/10)*gH/2;};
      ctx.save(); ctx.globalAlpha=0.12; ctx.fillStyle=vel>=0?'#34d399':'#f87171';
      ctx.beginPath(); ctx.moveTo(toGx(hist[0].t),toGy2(0));
      for(var i=0;i<hist.length;i++) ctx.lineTo(toGx(hist[i].t),toGy2(hist[i].x));
      ctx.lineTo(toGx(hist[hist.length-1].t),toGy2(0)); ctx.closePath(); ctx.fill(); ctx.globalAlpha=1; ctx.restore();
      ctx.save(); ctx.lineWidth=2.5; ctx.lineJoin='round'; ctx.strokeStyle=vel>=0?'#3b82f6':'#a78bfa'; ctx.beginPath();
      for(var i=0;i<hist.length;i++){
        var px=toGx(hist[i].t), py2=toGy2(hist[i].x);
        if(py2<GT||py2>GB)continue;
        i===0?ctx.moveTo(px,py2):ctx.lineTo(px,py2);
      }
      ctx.stroke(); ctx.restore();
      if(hist.length>60){
        var n=hist.length, p1=hist[Math.floor(n*0.25)], p2=hist[Math.floor(n*0.75)];
        if(p1&&p2&&(p2.t-p1.t)>0.1){
          var slope=(p2.x-p1.x)/(p2.t-p1.t);
          var mx=(toGx(p1.t)+toGx(p2.t))/2, my=(toGy2(p1.x)+toGy2(p2.x))/2;
          ctx.save(); ctx.fillStyle='rgba(8,18,36,.9)'; ctx.strokeStyle='#fbbf24'; ctx.lineWidth=1;
          ctx.beginPath(); ctx.roundRect(mx-52,my-14,104,20,4); ctx.fill(); ctx.stroke();
          simText(ctx,'שיפוע='+slope.toFixed(2)+' m/s',mx,my+1,'#fbbf24',9,'center'); ctx.restore();
        }
      }
    }
    simText(ctx,'t='+t.toFixed(1)+'s | x='+xm.toFixed(2)+'m | v='+vel.toFixed(2)+'m/s | a=0',W/2,GB+16,'#334e68',9,'center');
    requestAnimationFrame(draw);
  }
  var rb=document.getElementById('btn-cv-reset'); if(rb)rb.addEventListener('click',function(){t=0;hist=[];});
  requestAnimationFrame(draw);
}

// CH1 SIM 3: AVG vs INSTANT VELOCITY
function simAvgInstant(canvas){
  const H=420; const {ctx,W,dpr}=setupCanvas(canvas,H);
  const GL=62, GR=W-22, GT=20, GB=H-44;
  const TMax=5; const id=canvas.id;
  var A=1.5;
  var xAt=function(tv){return A*tv*tv;};
  var vInstAt=function(tv){return 2*A*tv;};
  var toGx=function(tv){return GL+(tv/TMax)*(GR-GL);};
  var toGy=function(xv){return GB-(xv/xAt(TMax))*(GB-GT)*0.9;};
  var t0=1.2, dt=2.0, dragging=null, autoShrink=true, pT=null;
  function getA(){var el=document.getElementById('inp-ai-a');return el?parseFloat(el.value)||1.5:A;}
  function draw(ts){
    if(_simStop[id])return;
    if(!pT)pT=ts; var elapsed=Math.min((ts-pT)/1000,.05); pT=ts;
    A=getA();
    if(autoShrink){dt=Math.max(0.025,dt-elapsed*0.32); if(dt<0.04)dt=2.2;}
    var t1=Math.min(TMax-0.01,t0+dt);
    var x0v=xAt(t0), x1v=xAt(t1);
    var vavg=(x1v-x0v)/Math.max(dt,0.0001);
    var vinst=vInstAt(t0);
    var converged=(dt<0.08);
    simBg(ctx,W,H);
    // Graph bg
    ctx.save();
    var gbg=ctx.createLinearGradient(GL,GT,GL,GB);
    gbg.addColorStop(0,'rgba(12,26,50,.7)'); gbg.addColorStop(1,'rgba(6,14,28,.9)');
    ctx.fillStyle=gbg; ctx.fillRect(GL,GT,GR-GL,GB-GT); ctx.restore();
    // Grid
    for(var tv=0;tv<=TMax;tv++){var px=toGx(tv); ctx.save(); ctx.strokeStyle='#0c1c30'; ctx.lineWidth=0.5; ctx.setLineDash([2,8]); ctx.beginPath(); ctx.moveTo(px,GT); ctx.lineTo(px,GB); ctx.stroke(); ctx.setLineDash([]); ctx.restore();}
    for(var xv=0;xv<=Math.floor(xAt(TMax));xv+=3){var py=toGy(xv); if(py<GT||py>GB)continue; ctx.save(); ctx.strokeStyle='#0c1c30'; ctx.lineWidth=0.5; ctx.setLineDash([2,8]); ctx.beginPath(); ctx.moveTo(GL,py); ctx.lineTo(GR,py); ctx.stroke(); ctx.setLineDash([]); ctx.restore(); simText(ctx,xv,GL-6,py+4,'#2d5060',9,'right');}
    // Axes
    ctx.save(); ctx.strokeStyle='#2d5275'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(GL,GT); ctx.lineTo(GL,GB); ctx.lineTo(GR,GB); ctx.stroke(); ctx.restore();
    simArrow(ctx,GL,GT+2,GL,GT-2,'#2d5275',1.5,7); simArrow(ctx,GR-2,GB,GR+2,GB,'#2d5275',1.5,7);
    for(var tv=0;tv<=TMax;tv++){var px=toGx(tv); ctx.save(); ctx.strokeStyle='#3d6480'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(px,GB-6); ctx.lineTo(px,GB+6); ctx.stroke(); ctx.restore(); simText(ctx,tv,px,GB+17,'#4a7595',10);}
    ctx.save(); ctx.strokeStyle='#1a3a5c'; ctx.lineWidth=1.5; ctx.strokeRect(GL,GT,GR-GL,GB-GT); ctx.restore();
    simText(ctx,'t (s) →',GR+4,GB+5,'#4a7595',9,'left'); simText(ctx,'x (m) ↑',GL+6,GT+9,'#4a7595',8,'left');
    simText(ctx,'x='+A.toFixed(1)+'t²',GL+52,GT+14,'#818cf8',9,'center');
    // Shaded Δt
    ctx.save(); ctx.fillStyle='rgba(251,191,36,.07)'; ctx.fillRect(toGx(t0),GT,Math.max(toGx(t1)-toGx(t0),2),GB-GT); ctx.restore();
    // Δt bracket
    ctx.save(); ctx.strokeStyle='#fbbf24'; ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.moveTo(toGx(t0),GB+4); ctx.lineTo(toGx(t1),GB+4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(toGx(t0),GB+1); ctx.lineTo(toGx(t0),GB+9); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(toGx(t1),GB+1); ctx.lineTo(toGx(t1),GB+9); ctx.stroke(); ctx.restore();
    simText(ctx,'Δt='+dt.toFixed(4)+'s',(toGx(t0)+toGx(t1))/2,GB+26,'#fbbf24',9,'center');
    // Parabola fill+curve

    for(var i=0;i<=300;i++){var tv2=i/300*TMax; var py=toGy(xAt(tv2)); if(py<GT||py>GB)continue; ctx.lineTo(toGx(tv2),py);}

    ctx.save(); ctx.shadowColor='#34d399'; ctx.shadowBlur=10; simCircle(ctx,p0c.px,p0c.py,7,'#34d399','#a7f3d0',2); ctx.restore();
    if(dt>0.12){ctx.save(); ctx.shadowColor='#f59e0b'; ctx.shadowBlur=8; simCircle(ctx,p1c.px,p1c.py,7,'#f59e0b','#fde68a',2); ctx.restore();}
    // Drop lines
    ctx.save(); ctx.strokeStyle='rgba(52,211,153,.25)'; ctx.lineWidth=1; ctx.setLineDash([2,5]);
    ctx.beginPath(); ctx.moveTo(p0c.px,p0c.py); ctx.lineTo(p0c.px,GB); ctx.stroke();
    if(dt>0.1){ctx.strokeStyle='rgba(245,158,11,.25)'; ctx.beginPath(); ctx.moveTo(p1c.px,p1c.py); ctx.lineTo(p1c.px,GB); ctx.stroke();}
    ctx.setLineDash([]); ctx.restore();

    simText(ctx,'v_avg=Dx/Dt='+vavg.toFixed(3)+' m/s (מיתר צהוב)',GL+117,infoY+17,'#fbbf24',9,'center');
    simText(ctx,'v_inst=dx/dt='+vinst.toFixed(3)+' m/s (משיק ירוק)',GL+117,infoY+34,'#34d399',9,'center');
    simText(ctx,'|v_avg-v_inst|='+Math.abs(vavg-vinst).toFixed(4),GL+117,infoY+50,'#94a3b8',8,'center');
    if(converged){
      ctx.save(); ctx.fillStyle='rgba(52,211,153,.12)'; ctx.strokeStyle='#34d399'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.roundRect(GL+2,infoY+56,230,28,4); ctx.fill(); ctx.stroke(); ctx.restore();
      simText(ctx,'v_avg -> v_inst כאשר Dt -> 0',GL+117,infoY+68,'#34d399',10,'center');
      simText(ctx,'זוהי הגדרת הנגזרת dx/dt !',GL+117,infoY+82,'#a7f3d0',9,'center');

// CH1 SIM 4: ACCELERATION
function simAcceleration(canvas){
  const H=470; const {ctx,W,dpr}=setupCanvas(canvas,H);

  function draw(ts){

    ctx.beginPath(); ctx.moveTo(midDrag,10); ctx.lineTo(midDrag,56); ctx.stroke(); ctx.restore();
    var acol=acc>0?'#ef4444':acc<0?'#818cf8':'#94a3b8';

    for(var v=-10;v<=10;v+=5){

      ctx.beginPath(); ctx.moveTo(px,AXISY-11); ctx.lineTo(px,AXISY+11); ctx.stroke(); ctx.restore();
      simText(ctx,v===0?'0':(v>0?'+'+v:String(v)),px,AXISY+23,'#4a7595',10);
    }
    ctx.save(); ctx.strokeStyle='#2d5275'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(GL-4,AXISY); ctx.lineTo(GR+4,AXISY); ctx.stroke(); ctx.restore();
    simArrow(ctx,GR-4,AXISY,GR+14,AXISY,'#2d5275',2.5,10);
    simText(ctx,'x (m)',GR+18,AXISY+4,'#4a7595',11,'left');
    // Ball
    var bx=Math.max(GL+22,Math.min(GR-22,ballX));
    var arVLen=Math.sign(vel)*Math.min(Math.abs(vel)*5,72);
    var arALen=acc*8;
    if(Math.abs(arVLen)>4) simArrow(ctx,bx,AXISY-30,bx+arVLen,AXISY-30,'#34d399',3,11);
    if(Math.abs(arALen)>3) simArrow(ctx,bx,AXISY+30,bx+arALen,AXISY+30,acol,3,10);
    ctx.save(); ctx.shadowColor='rgba(99,102,241,.7)'; ctx.shadowBlur=14;
    drawBox(ctx,bx-21,AXISY-17,42,34,'#1e3a52','#6366f1',2.5); ctx.restore();
    simText(ctx,vel.toFixed(1),bx,AXISY+4,'#c4b5fd',10,'center');
    // Dual graphs

    ctx.save(); var gbg=ctx.createLinearGradient(gl,GT,gl,GB); gbg.addColorStop(0,'rgba(12,26,50,.7)'); gbg.addColorStop(1,'rgba(6,14,28,.9)'); ctx.fillStyle=gbg; ctx.fillRect(gl,GT,gr-gl,gH); ctx.restore();
    var vMax=Math.max(14,Math.max.apply(null,hist.map(function(h){return Math.abs(h.v);}).concat([1]))*1.2);
    var midV=(GT+GB)/2;
    ctx.save(); ctx.strokeStyle='#1a3a5c'; ctx.lineWidth=1.5; ctx.strokeRect(gl,GT,gr-gl,gH); ctx.restore();
    ctx.save(); ctx.strokeStyle='#1e3a52'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(gl,midV); ctx.lineTo(gr,midV); ctx.stroke(); ctx.restore();
    if(hist.length>3){
      var tSpan=Math.max(8,t);
      var toVx=function(tv){return gl+(tv/tSpan)*(gr-gl);};
      var toVy=function(vv){return midV-(vv/vMax)*(GB-GT)/2;};
      ctx.save(); ctx.fillStyle='rgba(52,211,153,.1)'; ctx.beginPath(); ctx.moveTo(toVx(hist[0].t),midV); hist.forEach(function(p){ctx.lineTo(toVx(p.t),toVy(p.v));}); ctx.lineTo(toVx(hist[hist.length-1].t),midV); ctx.closePath(); ctx.fill(); ctx.restore();
      ctx.save(); ctx.strokeStyle='#34d399'; ctx.lineWidth=2.5; ctx.lineJoin='round'; ctx.beginPath(); hist.forEach(function(p,i){var px=toVx(p.t),py=toVy(p.v); i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);}); ctx.stroke(); ctx.restore();
      simCircle(ctx,toVx(hist[hist.length-1].t),toVy(hist[hist.length-1].v),5,'#34d399');
    }
        simText(ctx,'v (m/s) ↑',gl+3,GT+8,'#34d399',7,'left');
    simText(ctx,'v(t)',gl+12,GT+20,'#34d399',9,'left'); simText(ctx,'שיפוע=a',gl+(gr-gl)/2,GB-3,'#334e68',8,'center'); simText(ctx,'שטח=Dx',gl+(gr-gl)*0.75,GT+13,'#a7f3d0',8,'center');
    simText(ctx,'t (s) →',gr-4,GB+3,'#3d6480',7,'right');
    // x(t)
    var gl2=GL+gW2+16, gr2=GR;
    ctx.save(); var gbg2=ctx.createLinearGradient(gl2,GT,gl2,GB); gbg2.addColorStop(0,'rgba(12,26,50,.7)'); gbg2.addColorStop(1,'rgba(6,14,28,.9)'); ctx.fillStyle=gbg2; ctx.fillRect(gl2,GT,gr2-gl2,gH); ctx.restore();
    var xMax=Math.max(12,Math.max.apply(null,hist.map(function(h){return Math.abs(h.x);}).concat([1]))*1.2);
    var midX=(GT+GB)/2;
    ctx.save(); ctx.strokeStyle='#1a3a5c'; ctx.lineWidth=1.5; ctx.strokeRect(gl2,GT,gr2-gl2,gH); ctx.restore();
    ctx.save(); ctx.strokeStyle='#1e3a52'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(gl2,midX); ctx.lineTo(gr2,midX); ctx.stroke(); ctx.restore();
    if(hist.length>3){
      var tSpan2=Math.max(8,t);
      var toQx=function(tv){return gl2+(tv/tSpan2)*(gr2-gl2);};
      var toQy=function(xv){return midX-(xv/xMax)*(GB-GT)/2;};
      ctx.save(); ctx.strokeStyle='#6366f1'; ctx.lineWidth=2.5; ctx.lineJoin='round'; ctx.beginPath(); hist.forEach(function(p,i){var px=toQx(p.t),py=toQy(p.x); i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);}); ctx.stroke(); ctx.restore();
      simCircle(ctx,toQx(hist[hist.length-1].t),toQy(hist[hist.length-1].x),5,'#818cf8');
    }
        simText(ctx,'x (m) ↑',gl2+3,GT+8,'#818cf8',7,'left');
    simText(ctx,'x(t)',gl2+12,GT+20,'#818cf8',9,'left'); simText(ctx,'פרבולה',gl2+(gr2-gl2)/2,GB-3,'#334e68',8,'center');
    simText(ctx,'t (s) →',gr2-4,GB+3,'#3d6480',7,'right');

// CH1 SIM 5: FREEFALL
function simFreefall(canvas){
  const H=480; const {ctx,W,dpr}=setupCanvas(canvas,H);
  const GND=H-46, WALLX=62, id=canvas.id;
  // All physics in METERS; toY converts meters to canvas pixels
  var v0=18, g=9.8;
  var ball=null, pT=null;

  // ball state: {ym (meters), vy (m/s, positive=up), t (s)}
  var hMaxM=function(){return v0*v0/(2*Math.max(g,0.01));};
  var yScale=function(){return (GND-26)/Math.max(hMaxM()+2,20);}; // px per meter
  var toY=function(ym){return GND-ym*yScale();};

  function getV0(){var el=document.getElementById('inp-v0');return el?parseFloat(el.value)||0:v0;}
  function getG() {var el=document.getElementById('inp-ff-g');return el?parseFloat(el.value)||9.8:g;}

  function draw(ts){
    if(_simStop[id])return;
    if(!pT)pT=ts; var dt=Math.min((ts-pT)/1000,.04); pT=ts;
    v0=getV0(); g=getG();
    // Physics update: purely in meters
    if(ball){
      ball.vy-=g*dt; // gravity decelerates upward velocity
      ball.ym+=ball.vy*dt;
      ball.t+=dt;
      if(ball.ym<=0){ball.ym=0;ball.vy=0;}
    }
    var hm=hMaxM(), ys=yScale();
    simBg(ctx,W,H);
    simGround(ctx,W,GND);
    simText(ctx,'y = 0 (קרקע)',W/2,GND+14,'#334e68',9,'center');
    // Y axis
    ctx.save(); ctx.strokeStyle='#2d5275'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(WALLX,GND+4); ctx.lineTo(WALLX,toY(hm+3)); ctx.stroke(); ctx.restore();
    simArrow(ctx,WALLX,toY(hm+3),WALLX,toY(hm+4),'#2d5275',2,8);
    simText(ctx,'y (m)',WALLX,toY(hm+4)-10,'#4a7595',11,'center');
    var maxH=Math.max(hm+2,20);
    var step=maxH>60?10:maxH>30?5:2;
    for(var m=0;m<=maxH;m+=step){
      var py=toY(m); if(py<16||py>GND+2)continue;
      ctx.save(); ctx.strokeStyle='#2a4d65'; ctx.lineWidth=m%10===0?1.5:1;
      ctx.beginPath(); ctx.moveTo(WALLX-7,py); ctx.lineTo(WALLX+7,py); ctx.stroke(); ctx.restore();
      simText(ctx,m,WALLX-10,py+4,'#3d6480',9,'right');
      if(m>0){ctx.save(); ctx.strokeStyle='#0c1c2e'; ctx.lineWidth=0.5; ctx.setLineDash([2,12]); ctx.beginPath(); ctx.moveTo(WALLX+9,py); ctx.lineTo(W-18,py); ctx.stroke(); ctx.setLineDash([]); ctx.restore();}
    }
    // h_max line
    if(hm>1){
      var hmPy=toY(hm);
      ctx.save(); ctx.strokeStyle='rgba(52,211,153,.45)'; ctx.lineWidth=1.5; ctx.setLineDash([5,5]);
      ctx.beginPath(); ctx.moveTo(WALLX+9,hmPy); ctx.lineTo(W-18,hmPy); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
      ctx.save(); ctx.fillStyle='rgba(8,20,38,.82)'; ctx.strokeStyle='rgba(52,211,153,.55)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.roundRect(WALLX+12,hmPy-12,118,16,4); ctx.fill(); ctx.stroke();
      simText(ctx,'h_max='+hm.toFixed(1)+'m',WALLX+71,hmPy-1,'#34d399',9,'center'); ctx.restore();
    }
    // Ball
    if(ball){
      var physV=ball.vy; // m/s (positive=up)
      var by=toY(ball.ym); // canvas y
      var bx=Math.floor(W/2);
      // Equal-time strobe: a ghost every 0.15s since launch — the growing gaps SHOW the acceleration
      var GDT=0.15;
      for(var gi=1;gi*GDT<ball.t&&gi<90;gi++){
        var gt=gi*GDT;
        var gym=Math.max(0,v0*gt-0.5*g*gt*gt);
        var gpy=toY(gym); if(gpy<16)continue;
        ctx.save(); ctx.globalAlpha=0.30;
        simCircle(ctx,bx,gpy,7,'rgba(99,102,241,.35)','rgba(129,140,248,.5)',1);
        ctx.restore();
      }
      if(ball.t>0.6) simText(ctx,'Δt קבוע — המרווח גדל!',bx-96,toY(hm*0.55),'#818cf8',8.5,'center');
      // Velocity arrow
      var arDir=physV>=0?-1:1, arLen=Math.min(Math.abs(physV)*3,64);
      if(arLen>5) simArrow(ctx,bx,by+(arDir>0?20:-20),bx,by+(arDir>0?20+arLen:-20-arLen),physV>0?'#34d399':'#f87171',3,12);
      // Ball
      ctx.save(); ctx.shadowColor='rgba(99,102,241,.8)'; ctx.shadowBlur=20;
      var grad=ctx.createRadialGradient(bx-6,by-6,2,bx,by,20);
      grad.addColorStop(0,'#c7d2fe'); grad.addColorStop(0.5,'#6366f1'); grad.addColorStop(1,'#1e1b4b');
      simCircle(ctx,bx,by,20,grad,'#818cf8',2.5); ctx.restore();
      // Apex
      if(Math.abs(physV)<1.2 && ball.ym>0.5){
        ctx.save(); ctx.fillStyle='rgba(251,191,36,.18)'; ctx.strokeStyle='#fbbf24'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.roundRect(bx-56,by-44,112,20,5); ctx.fill(); ctx.stroke();
        simText(ctx,'v = 0 - שיא!',bx,by-31,'#fbbf24',11,'center'); ctx.restore();
      }
      // Readout panel
      var panX=bx+28, panY=Math.max(18,by-40);
      if(panX+144>W) panX=bx-172;
      ctx.save(); ctx.fillStyle='rgba(6,14,28,.93)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.roundRect(panX,panY,144,84,7); ctx.fill(); ctx.stroke(); ctx.restore();
      simText(ctx,'t = '+ball.t.toFixed(2)+' s',panX+72,panY+17,'#94a3b8',11,'center');
      simText(ctx,'y = '+ball.ym.toFixed(2)+' m',panX+72,panY+35,'#22d3ee',13,'center');
      simText(ctx,'v = '+(physV>=0?'+':'')+physV.toFixed(2)+' m/s',panX+72,panY+53,'#f59e0b',12,'center');
      // Energy bar
      var Ek=0.5*physV*physV, Ep=g*ball.ym, Etot=Math.max(Ek+Ep,0.001);
      var ekF=Math.min(1,Ek/Etot);
      var bL=panX+4, bBarY=panY+64, bW=136;
      ctx.save(); ctx.strokeStyle='#1e3a52'; ctx.lineWidth=1; ctx.strokeRect(bL,bBarY,bW,10); ctx.restore();
      if(ekF>0.01){ctx.save(); ctx.fillStyle='#f59e0b'; ctx.fillRect(bL,bBarY,bW*ekF,10); ctx.restore();}
      if(ekF<0.99){ctx.save(); ctx.fillStyle='#34d399'; ctx.fillRect(bL+bW*ekF,bBarY,bW*(1-ekF),10); ctx.restore();}
      simText(ctx,'Ek',bL+bW*ekF*0.5,bBarY+8,ekF>0.2?'#111827':'#f59e0b',7,'center');
      simText(ctx,'Ep',bL+bW*ekF+bW*(1-ekF)*0.5,bBarY+8,(1-ekF)>0.2?'#111827':'#34d399',7,'center');
    } else {
      // Draw predicted parabola
      ctx.save(); ctx.strokeStyle='rgba(99,102,241,.3)'; ctx.lineWidth=2.5;
      ctx.setLineDash([5,6]); ctx.beginPath(); var _ps=false;
      for(var _pi=0;_pi<=120;_pi++){
        var _pt=_pi*0.04, _py2=v0*_pt-0.5*g*_pt*_pt;
        if(_py2<0) break;
        var _ppy=toY(_py2); if(_ppy<20) break;
        _ps?ctx.lineTo(W/2,_ppy):ctx.moveTo(W/2,_ppy); _ps=true;
      }
      ctx.stroke(); ctx.setLineDash([]); ctx.restore();
      simText(ctx,'לחץ "🎯 זרוק!" לזרוק את הכדור',W/2,Math.floor(GND*0.42),'#4a7090',13,'center',true);
    }
    // Footer
    var trise=v0/Math.max(g,0.01);
    ctx.save(); ctx.fillStyle='rgba(8,18,36,.75)'; ctx.strokeStyle='#1a3252'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.roundRect(4,H-20,W-8,16,3); ctx.fill(); ctx.stroke();
    simText(ctx,'t_עלייה=t_ירידה='+trise.toFixed(2)+'s | גלילאו: מסה לא משפיעה | g='+g.toFixed(1)+' m/s²',W/2,H-9,'#3d6480',9,'center'); ctx.restore();
    requestAnimationFrame(draw);
  }
  var throwBtn=document.getElementById('btn-throw');
  var v0Inp=document.getElementById('inp-v0');
  var gInp=document.getElementById('inp-ff-g');
  if(v0Inp){v0=parseFloat(v0Inp.value)||18; v0Inp.addEventListener('input',function(){v0=parseFloat(v0Inp.value)||18;});}
  if(gInp) {g=parseFloat(gInp.value)||9.8;  gInp.addEventListener('input',function(){g=parseFloat(gInp.value)||9.8;});}
  if(throwBtn)throwBtn.addEventListener('click',function(){v0=getV0();g=getG();ball={ym:0,vy:v0,t:0};});
  requestAnimationFrame(draw);
}


// ─────────────────────────────────────────────────────────────
// MULTI-FREEFALL: 3 masses fall under different g
// ─────────────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════
// CH4 SIM 1: MULTI-FREEFALL — Galileo experiment, any g, rich
// ═══════════════════════════════════════════════════════════════
function simMultiFreefall(canvas){
  const H=520; const {ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;
  let g=9.8, dropH=20, t=0, pT=null, phase='drop'; // phase: drop|bounce
  const PADY=46, GND_Y=H-50;
  const TRACK_H=GND_Y-PADY;

  const balls=[
    {m:0.05, col:'#3b82f6', sc:'#93c5fd', label:'50g'},
    {m:1,    col:'#f59e0b', sc:'#fde68a', label:'1 kg'},
    {m:10,   col:'#ef4444', sc:'#fca5a5', label:'10 kg'},
    {m:100,  col:'#a78bfa', sc:'#c4b5fd', label:'100 kg'},
  ];
  const xPos = balls.map((_,i)=>(i+1)*(W/(balls.length+1)));

  function getG()   { const e=document.getElementById('inp-g-mff');  return e?parseFloat(e.value):9.8; }
  function getH()   { const e=document.getElementById('inp-mff-h');  return e?parseFloat(e.value):20; }
  function reset()  { t=0; pT=null; phase='drop'; }

  const resetBtn=document.getElementById('btn-mff-reset');
  if(resetBtn) resetBtn.addEventListener('click', reset);

  function draw(ts){
    if(_simStop[id])return;
    if(!pT){ pT=ts; }
    const dt=Math.min((ts-pT)/1000,.04); pT=ts;
    g=getG(); dropH=getH();
    const tFall=Math.sqrt(2*dropH/g);
    t+=dt;
    if(t>tFall+0.6) reset();

    simBg(ctx,W,H);

    // ── Height ruler (left) ─────────────────────────────────
    const rulerX=36;
    ctx.save(); ctx.fillStyle='rgba(8,20,42,.7)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.roundRect(6,PADY-2,rulerX-8,TRACK_H+4,4); ctx.fill(); ctx.stroke(); ctx.restore();
    ctx.save(); ctx.strokeStyle='#2d5275'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(rulerX,PADY); ctx.lineTo(rulerX,GND_Y); ctx.stroke(); ctx.restore();
    // tick marks every 2m up to dropH
    const tickInterval = dropH<=10?1:dropH<=20?2:5;
    for(let hm=0; hm<=dropH; hm+=tickInterval){
      const py = GND_Y - (hm/dropH)*TRACK_H;
      const long = hm%5===0;
      ctx.save(); ctx.strokeStyle=long?'#60a5fa':'#2d5275'; ctx.lineWidth=long?1.5:0.8;
      ctx.beginPath(); ctx.moveTo(rulerX-( long?12:6), py); ctx.lineTo(rulerX, py); ctx.stroke(); ctx.restore();
      if(long||dropH<=10) simText(ctx,hm+'m', rulerX-16, py+4,'#60a5fa',8,'right');
    }

    // ── Ground ──────────────────────────────────────────────
    const gGrad=ctx.createLinearGradient(0,GND_Y,0,H);
    gGrad.addColorStop(0,'#0f2035'); gGrad.addColorStop(1,'#060d1a');
    ctx.fillStyle=gGrad; ctx.fillRect(0,GND_Y,W,H-GND_Y);
    ctx.save(); ctx.strokeStyle='rgba(30,58,82,.45)'; ctx.lineWidth=1;
    for(let x=0;x<W;x+=22){ ctx.beginPath(); ctx.moveTo(x,GND_Y); ctx.lineTo(x+14,GND_Y+10); ctx.stroke(); }
    ctx.restore();
    ctx.save(); ctx.strokeStyle='#2d5275'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,GND_Y); ctx.lineTo(W,GND_Y); ctx.stroke(); ctx.restore();

    // ── Physics ─────────────────────────────────────────────
    const inFlight = t<=tFall;
    const yFrac = inFlight ? Math.min(0.5*g*t*t/dropH, 1) : 1;
    const vCur  = inFlight ? g*t : g*tFall;
    const yCur  = inFlight ? 0.5*g*t*t : dropH;

    balls.forEach((b,i)=>{
      const cx=xPos[i];
      const r=Math.max(8, Math.min(16, 6+Math.log10(b.m+1)*8));
      const by = PADY + yFrac*TRACK_H;

      // Trail dots
      if(inFlight && t>0.1){
        for(let s=1; s<=5; s++){
          const tf=t-s*0.06;
          if(tf<0) continue;
          const yf=PADY+(0.5*g*tf*tf/dropH)*TRACK_H;
          ctx.save(); ctx.globalAlpha=0.06*(6-s);
          simCircle(ctx,cx,yf,r*0.7,b.col,b.sc,0);
          ctx.restore();
        }
      }

      // Shadow
      ctx.save(); ctx.globalAlpha=0.18+yFrac*0.15;
      const shadowR=r*(0.4+yFrac*0.7);
      ctx.fillStyle='rgba(0,0,0,.5)';
      ctx.beginPath(); ctx.ellipse(cx,GND_Y-2,shadowR,shadowR*0.35,0,0,Math.PI*2); ctx.fill();
      ctx.restore();

      // Ball
      ctx.save(); ctx.shadowColor=b.col+'66'; ctx.shadowBlur=12;
      const bg2=ctx.createRadialGradient(cx-r*0.3,by-r*0.3,r*0.1,cx,by,r);
      bg2.addColorStop(0,b.sc+'ee'); bg2.addColorStop(1,b.col+'bb');
      simCircle(ctx,cx,by,r,bg2,b.sc,1.5);
      ctx.restore();

      // Impact flash
      if(!inFlight && t-tFall<0.18){
        const alpha=(0.18-(t-tFall))/0.18;
        ctx.save(); ctx.globalAlpha=alpha*0.6;
        ctx.fillStyle=b.col;
        ctx.beginPath(); ctx.ellipse(cx,GND_Y-3,r*2.5,r*0.8,0,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }

      // Label
      simText(ctx,b.label,cx,by+r+12,b.sc,8.5,undefined,true);

      // Velocity arrow (during fall)
      if(inFlight && vCur>0.3){
        const aLen=Math.min(vCur*3.5,36);
        simArrow(ctx,cx,by+r+2,cx,by+r+2+aLen,b.col,2,8);
      }
    });

    // ── Info panel ──────────────────────────────────────────
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.93)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(W-202,PADY-2,192,108,7); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'g = '+g.toFixed(1)+' m/s²',W-106,PADY+15,'#fbbf24',13,undefined,true);
    simText(ctx,'h = '+dropH+' m',W-106,PADY+33,'#94a3b8',11,undefined,true);
    simText(ctx,'t_נפילה = √(2h/g)',W-106,PADY+51,'#94a3b8',9.5,undefined,true);
    simText(ctx,'= '+tFall.toFixed(3)+' s',W-106,PADY+67,'#22d3ee',12.5,undefined,true);
    simText(ctx,'v_פגיעה = √(2gh)',W-106,PADY+85,'#94a3b8',9.5,undefined,true);
    simText(ctx,'= '+(g*tFall).toFixed(2)+' m/s',W-106,PADY+101,'#34d399',11.5,undefined,true);

    // ── Current state ────────────────────────────────────────
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.9)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.roundRect(W/2-190,PADY-2,380,38,6); ctx.fill(); ctx.stroke(); ctx.restore();
    if(inFlight){
      simText(ctx,'y = ½gt² = '+yCur.toFixed(2)+' m   v = gt = '+vCur.toFixed(2)+' m/s',W/2,PADY+12,'#22d3ee',10.5,undefined,true);
      simText(ctx,'כולם נופלים ביחד! — a = g, ללא תלות במסה',W/2,PADY+28,'#34d399',10,undefined,true);
    } else {
      simText(ctx,'פגיעה! v = '+vCur.toFixed(2)+' m/s   (אחרי '+tFall.toFixed(2)+' s)',W/2,PADY+12,'#ef4444',10.5,undefined,true);
      simText(ctx,'גלילאו גליל (1638): כל הגופים נופלים אחת',W/2,PADY+28,'#fbbf24',10,undefined,true);
    }

    // Planet preset buttons hint
    simText(ctx,'ירח 1.6 | מאדים 3.7 | כדה"א 9.8 | צדק 24.8',W/2,H-12,'#1a3a52',8.5);

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}


function simVectors(canvas){
  const H=290; const {ctx,W}=setupCanvas(canvas,H);
  const id=canvas.id;
  const CX=W/2-40, CY=H/2+10;
  let vA={x:80,y:-50}, vB={x:40,y:70}, dragging=null;
  const COLORS={A:'#ef4444',B:'#3b82f6',R:'#34d399'};

  function draw(){
    if(_simStop[id])return;
    simBg(ctx,W,H);
    // grid dots
    for(let x=30;x<W;x+=30) for(let y=20;y<H;y+=30){
      ctx.save(); ctx.fillStyle='rgba(255,255,255,.04)';
      ctx.beginPath(); ctx.arc(x,y,1.2,0,Math.PI*2); ctx.fill(); ctx.restore();
    }
    const R={x:vA.x+vB.x,y:vA.y+vB.y};

    // parallelogram fill
    ctx.save(); ctx.fillStyle='rgba(52,211,153,.07)'; ctx.beginPath();
    ctx.moveTo(CX,CY); ctx.lineTo(CX+vA.x,CY+vA.y); ctx.lineTo(CX+R.x,CY+R.y); ctx.lineTo(CX+vB.x,CY+vB.y); ctx.closePath(); ctx.fill(); ctx.restore();

    // vectors A and B from origin
    simArrow(ctx,CX,CY,CX+vA.x,CY+vA.y,COLORS.A,3,13);
    simArrow(ctx,CX,CY,CX+vB.x,CY+vB.y,COLORS.B,3,13);
    // B from tip of A (head-to-tail)
    ctx.save(); ctx.setLineDash([5,4]); ctx.strokeStyle=COLORS.B; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(CX+vA.x,CY+vA.y); ctx.lineTo(CX+R.x,CY+R.y); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
    // A from tip of B
    ctx.save(); ctx.setLineDash([5,4]); ctx.strokeStyle=COLORS.A; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(CX+vB.x,CY+vB.y); ctx.lineTo(CX+R.x,CY+R.y); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
    // Resultant
    simArrow(ctx,CX,CY,CX+R.x,CY+R.y,COLORS.R,3.5,14);

    // labels
    const lA=Math.hypot(vA.x,vA.y)/40, lB=Math.hypot(vB.x,vB.y)/40, lR=Math.hypot(R.x,R.y)/40;
    const aA=Math.atan2(vA.y,vA.x)*180/Math.PI, aB=Math.atan2(vB.y,vB.x)*180/Math.PI;
    simText(ctx,`A |${lA.toFixed(1)}|`,CX+vA.x+14,CY+vA.y-6,COLORS.A,12,undefined,true);
    simText(ctx,`B |${lB.toFixed(1)}|`,CX+vB.x+14,CY+vB.y-6,COLORS.B,12,undefined,true);
    simText(ctx,`R=A+B |${lR.toFixed(1)}|`,CX+R.x+14,CY+R.y-6,COLORS.R,12,undefined,true);

    // info
    ctx.save(); ctx.fillStyle='rgba(10,24,44,.85)'; ctx.strokeStyle='#1e3a52'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.roundRect(10,8,W-20,30,6); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,`A=(${(vA.x/40).toFixed(1)},${(-vA.y/40).toFixed(1)})  B=(${(vB.x/40).toFixed(1)},${(-vB.y/40).toFixed(1)})  R=(${(R.x/40).toFixed(1)},${(-R.y/40).toFixed(1)})`,W/2,23,'#94a3b8',11,undefined,true);
    simText(ctx,'גרור ראשי החצים האדום והכחול',W/2,H-10,'#334e68',10);
    requestAnimationFrame(draw);
  }

  function getTip(v){ return {x:CX+v.x,y:CY+v.y}; }
  canvas.addEventListener('mousedown',e=>{
    const r=canvas.getBoundingClientRect(); const mx=e.clientX-r.left, my=e.clientY-r.top;
    const tA=getTip(vA), tB=getTip(vB);
    if(Math.hypot(mx-tA.x,my-tA.y)<18)dragging='A';
    else if(Math.hypot(mx-tB.x,my-tB.y)<18)dragging='B';
  });
  canvas.addEventListener('mousemove',e=>{
    if(!dragging)return; const r=canvas.getBoundingClientRect();
    const mx=e.clientX-r.left, my=e.clientY-r.top;
    const v={x:mx-CX,y:my-CY};
    if(dragging==='A')vA=v; else vB=v;
  });
  canvas.addEventListener('mouseup',()=>dragging=null);
  requestAnimationFrame(draw);
}

// ─────────────────────────────────────────────────────────────
// INERTIA (Newton 1): push block, friction slider
// ─────────────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════
// CH2 SIM 1: INERTIA (Newton's 1st Law) — surface with friction
// ═══════════════════════════════════════════════════════════════
function simInertia(canvas){
  // SECTION: forces.inertia — חוק ניוטון הראשון: עקרון ההתמדה
  // PEDAGOGY: Two-mode demo. Mode A: spacecraft in vacuum — no forces, constant velocity FOREVER.
  // Mode B: block on surface with friction — loses speed. Student compares both to understand inertia.
  // Key: objects don't "need a force to keep moving" — they need a force to CHANGE motion.
  const H=480; const {ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;
  const g=9.8;
  let pT=null, t=0;
  var mode='space'; // 'space' | 'surface'
  var vel=0, pos=0;
  var trail=[];
  var spaceVel=0, spacePos=0, spaceTrail=[];
  var surfVel=0, surfPos=0, surfTrail=[];
  var thrust=false, thrustTimer=0;
  var launched=false;

  function getFriction(){var e=document.getElementById('inp-friction'); return e?parseFloat(e.value):0.3;}
  function getMass(){var e=document.getElementById('inp-mass-in'); return e?parseFloat(e.value):5;}
  function getMode(){
    var space=document.getElementById('inp-mode-space');
    var surf=document.getElementById('inp-mode-surf');
    if(space&&space.checked)return 'space';
    if(surf&&surf.checked)return 'surface';
    return mode;
  }

  var pushR=document.getElementById('btn-push-right');
  var pushL=document.getElementById('btn-push-left');
  if(pushR)pushR.addEventListener('click',function(){
    var m=getMass();
    spaceVel+=20/m; surfVel+=20/m;
    thrust=true; thrustTimer=0.4; launched=true;
  });
  if(pushL)pushL.addEventListener('click',function(){
    var m=getMass();
    spaceVel-=20/m; surfVel-=20/m;
    thrust=true; thrustTimer=0.4; launched=true;
  });

  // Layout: two strips, top=space, bottom=surface
  const SPACE_Y=H*0.25;
  const SURF_Y=H*0.70;
  const STRIP_H=80;

  function draw(ts){
    if(_simStop[id])return;
    if(!pT)pT=ts; var dt=Math.min((ts-pT)/1000,.04); pT=ts;
    t+=dt;
    if(thrustTimer>0)thrustTimer-=dt; else thrust=false;
    var mu=getFriction(), m=getMass();

    // Space: NO force, constant velocity
    spacePos+=spaceVel*dt*50;
    if(spacePos>W+60)spacePos=-60;
    if(spacePos<-60)spacePos=W+60;
    spaceTrail.push({x:spacePos,v:spaceVel});
    if(spaceTrail.length>100)spaceTrail.shift();

    // Surface: friction decelerates
    var fric=0;
    if(Math.abs(surfVel)>0.02) fric=-Math.sign(surfVel)*mu*m*g;
    else if(launched) fric=0;
    surfVel+=fric/m*dt;
    if(Math.abs(surfVel)<0.03&&Math.abs(fric)>0)surfVel=0;
    surfPos+=surfVel*dt*50;
    if(surfPos>W+60)surfPos=-60;
    if(surfPos<-60)surfPos=W+60;
    surfTrail.push({x:surfPos,v:surfVel});
    if(surfTrail.length>100)surfTrail.shift();

    simBg(ctx,W,H);

    // ── TOP: Space strip ──────────────────────────────────
    // Stars background
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.6)'; ctx.fillRect(0,SPACE_Y-STRIP_H/2,W,STRIP_H+4); ctx.restore();
    for(var si=0;si<30;si++){
      var sx=((si*137.5)%W), sy=SPACE_Y-STRIP_H/2+((si*71.3)%STRIP_H);
      var ss=0.5+((si*23.7)%1.5);
      ctx.save(); ctx.fillStyle='rgba(255,255,255,'+( 0.3+((si*17)%0.5)+')'); ctx.beginPath(); ctx.arc(sx,sy,ss,0,Math.PI*2); ctx.fill(); ctx.restore();
    }
    ctx.save(); ctx.strokeStyle='rgba(30,58,82,.5)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,SPACE_Y-STRIP_H/2); ctx.lineTo(W,SPACE_Y-STRIP_H/2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,SPACE_Y+STRIP_H/2+4); ctx.lineTo(W,SPACE_Y+STRIP_H/2+4); ctx.stroke();
    ctx.restore();
    // Space label
    simText(ctx,'חלל ריק — אין כוחות',W/2,SPACE_Y-STRIP_H/2+10,'#94a3b8',8,undefined,true);
    // Space trail
    for(var ti=1;ti<spaceTrail.length;ti++){
      ctx.save(); ctx.globalAlpha=(ti/spaceTrail.length)*0.3;
      ctx.fillStyle=spaceVel>0?'#60a5fa':'#f87171';
      ctx.fillRect(spaceTrail[ti].x-3,SPACE_Y-4,6,8); ctx.restore();
    }
    // Spacecraft
    var sVis=Math.abs(spaceVel);
    var sCol=sVis>0.1?'#60a5fa':'#475569';
    ctx.save(); ctx.shadowColor=sVis>0.1?sCol:'transparent'; ctx.shadowBlur=sVis>0.1?16:0;
    // Rocket shape
    var rx=spacePos, ry=SPACE_Y;
    ctx.fillStyle=sCol+'cc'; ctx.strokeStyle=sCol; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(rx+18,ry); ctx.lineTo(rx-12,ry-12); ctx.lineTo(rx-12,ry+12); ctx.closePath(); ctx.fill(); ctx.stroke();
    // Engine flare if moving
    if(sVis>0.1&&!thrust){
      ctx.fillStyle='rgba(251,191,36,.7)';
      ctx.beginPath(); ctx.moveTo(rx-12,ry-5); ctx.lineTo(rx-26,ry); ctx.lineTo(rx-12,ry+5); ctx.closePath(); ctx.fill();
    }
    if(thrust){
      ctx.fillStyle='rgba(239,68,68,.8)';
      ctx.beginPath(); ctx.moveTo(rx-12,ry-8); ctx.lineTo(rx-36,ry); ctx.lineTo(rx-12,ry+8); ctx.closePath(); ctx.fill();
    }
    ctx.shadowBlur=0; ctx.restore();
    // Velocity label
    simText(ctx,'v='+spaceVel.toFixed(1)+' m/s',rx,ry-22,sVis>0.1?'#22d3ee':'#64748b',9,undefined,true);
    if(launched&&Math.abs(spaceVel)>0.1) simText(ctx,'↔ נע בקצב קבוע לנצח!',W/2,SPACE_Y+STRIP_H/2-8,'#34d399',9,undefined,true);

    // ── BOTTOM: Surface strip ────────────────────────────
    var sfY=SURF_Y;
    ctx.save(); ctx.fillStyle='#0f2035'; ctx.fillRect(0,sfY+30,W,STRIP_H-26); ctx.restore();
    ctx.save(); ctx.strokeStyle='#2d5275'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,sfY+30); ctx.lineTo(W,sfY+30); ctx.stroke(); ctx.restore();
    // Texture by friction amount
    var texD=Math.max(4,Math.round(8*(1-getFriction())))+Math.round(getFriction()*16);
    for(var xi=0;xi<W;xi+=texD){
      ctx.save(); ctx.strokeStyle='rgba(45,82,117,'+( getFriction()*0.6)+')'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(xi,sfY+30); ctx.lineTo(xi-4,sfY+36); ctx.stroke(); ctx.restore();
    }
    simText(ctx,'משטח — חיכוך μ='+getFriction().toFixed(2),W/2,sfY-STRIP_H/2+18,'#64748b',8,undefined,true);
    // Surface trail
    for(var ti2=1;ti2<surfTrail.length;ti2++){
      ctx.save(); ctx.globalAlpha=(ti2/surfTrail.length)*0.25;

      'לחץ "דחוף" לשגר שני גופים יחד ← השווה!';

}
function simNewton2(canvas){
  const H=520; const {ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;
  const FLY=H-68;
  let pos=W/2, vel=0, drag=false, pT=null;
  let vHist=[], aHist=[], simTime=0;
  const g=9.8;

  function getF()   { const e=document.getElementById('inp-n2-F');   return e?parseFloat(e.value):20; }
  function getMass(){ const e=document.getElementById('inp-mass');    return e?parseFloat(e.value):5; }
  function getMu()  { const e=document.getElementById('inp-n2-mu');   return e?parseFloat(e.value):0; }

  function resetSim(){ pos=W/2; vel=0; vHist=[]; aHist=[]; simTime=0; }

  // Drag top bar to override F
  let dragF=null;
  canvas.addEventListener('mousedown',e=>{
    const r=canvas.getBoundingClientRect();
    const cy=(e.clientY-r.top)/dpr;
    if(cy<60){ drag=true; dragF=null; }
  });
  canvas.addEventListener('mousemove',e=>{
    if(!drag)return;
    const r=canvas.getBoundingClientRect();
    const cx=(e.clientX-r.left)/dpr;
    dragF=Math.max(-60,Math.min(60,(cx-W/2)/1.4));
  });
  canvas.addEventListener('mouseup',()=>{ drag=false; dragF=null; });
  canvas.addEventListener('mouseleave',()=>{ drag=false; dragF=null; });
  canvas.addEventListener('dblclick',resetSim);

  const resetBtn=document.getElementById('btn-n2-reset');
  if(resetBtn) resetBtn.addEventListener('click',resetSim);

  function draw(ts){
    if(_simStop[id])return;
    if(!pT)pT=ts; const dt=Math.min((ts-pT)/1000,.04); pT=ts;
    const mass=getMass(), mu=getMu();
    const F_slider=getF();
    const F=dragF!==null?dragF:F_slider;
    const N=mass*g;
    const fric_max=mu*N;
    // Kinetic friction opposes motion
    let f_fric=0;
    if(Math.abs(vel)>0.02) f_fric=-Math.sign(vel)*fric_max;
    else if(Math.abs(F)>fric_max) f_fric=-Math.sign(F)*fric_max;
    else f_fric=-F; // static: cancels applied force
    const netF=F+f_fric;
    const a=netF/mass;
    vel+=a*dt; vel=Math.max(-35,Math.min(35,vel));
    // Stop if static friction holds
    if(Math.abs(vel)<0.02&&Math.abs(netF)<0.02) vel=0;
    pos+=vel*dt*22;
    var atWall=false;
    if(pos>W-48){ pos=W-48; vel=0; atWall=true; dragF=null; }
    if(pos<48){   pos=48;   vel=0; atWall=true; dragF=null; }
    simTime+=dt;
    vHist.push(vel);
    // Don't record false spike acceleration on wall hits
    aHist.push(atWall?0:a);
    if(vHist.length>260){ vHist.shift(); aHist.shift(); }

    simBg(ctx,W,H);

    // ─── Top drag banner ─────────────────────────────────────
    ctx.save(); ctx.fillStyle='rgba(8,20,42,.88)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(10,6,W-20,52,7); ctx.fill(); ctx.stroke(); ctx.restore();
    // Force arrow in banner
    const fPx=Math.abs(F)*1.1, fDir=F>=0?1:-1;
    simArrow(ctx,W/2,32,W/2+fDir*fPx,32,F>=0?'#ef4444':'#3b82f6',3.5,13);
    simText(ctx,(drag?'🖱 גרור':'← גרור לשנות F →'),W/2,50,'#334e68',8,undefined,true);
    simText(ctx,'F = '+(F>=0?'+':'')+F.toFixed(1)+' N',W/2,20,'#fbbf24',11.5,undefined,true);

    // ─── Floor ───────────────────────────────────────────────
    const flrG=ctx.createLinearGradient(0,FLY,0,H);
    flrG.addColorStop(0,'#0f2035'); flrG.addColorStop(1,'#060d1a');
    ctx.fillStyle=flrG; ctx.fillRect(0,FLY,W,H-FLY);
    ctx.save(); ctx.strokeStyle='rgba(30,58,82,.45)'; ctx.lineWidth=1;
    for(let x=0;x<W;x+=22){ ctx.beginPath(); ctx.moveTo(x,FLY); ctx.lineTo(x+14,FLY+10); ctx.stroke(); }
    ctx.restore();
    ctx.save(); ctx.strokeStyle='#2d5275'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,FLY); ctx.lineTo(W,FLY); ctx.stroke(); ctx.restore();
    simText(ctx,mu>0.01?'משטח עם חיכוך μ='+mu.toFixed(2):'משטח חלק (μ=0)',W/2,FLY+15,'#1a3a52',8.5);

    // ─── Block ───────────────────────────────────────────────
    const bW=Math.max(46,mass*6.5), bH=Math.max(32,mass*4.8);
    const bTop=FLY-bH, bCY=FLY-bH/2;
    const bGrad=ctx.createLinearGradient(pos-bW/2,bTop,pos-bW/2,FLY);
    bGrad.addColorStop(0,'rgba(99,102,241,.88)'); bGrad.addColorStop(1,'rgba(67,56,202,.58)');
    ctx.save(); ctx.shadowColor='rgba(99,102,241,.55)'; ctx.shadowBlur=18;
    drawBox(ctx,pos-bW/2,bTop,bW,bH,bGrad,'#818cf8',2.5,6); ctx.restore();
    simText(ctx,mass.toFixed(1)+' kg',pos,bCY+5,'#c7d2fe',12.5,undefined,true);

    // Applied force arrow (hide on wall contact to avoid confusion)
    if(Math.abs(F)>0.3&&!atWall){
      const fLen=Math.min(Math.abs(F)*1.15,82);
      const sx=F>0?pos-bW/2-4:pos+bW/2+4;
      simArrow(ctx,sx,bCY,sx+Math.sign(F)*fLen,bCY,'#ef4444',3.5,13);
      simText(ctx,'F='+Math.abs(F).toFixed(1)+'N',sx+Math.sign(F)*(fLen+14),bCY-1,'#fca5a5',10,undefined,true);
    }

    // Friction arrow (if any)
    if(Math.abs(f_fric)>0.3&&mu>0.001){
      const frLen=Math.min(Math.abs(f_fric)*1.1,68);
      const frSide=f_fric>0?pos-bW/2-4:pos+bW/2+4;
      simArrow(ctx,frSide,bCY+12,frSide+Math.sign(f_fric)*frLen,bCY+12,'#a78bfa',2.5,10);
      simText(ctx,'f='+Math.abs(f_fric).toFixed(1)+'N',frSide+Math.sign(f_fric)*(frLen+12),bCY+12,'#c4b5fd',9,undefined,true);
    }

    // Normal force arrow (up from top)
    if(N>0.1){
      const nLen=Math.min(N*0.38,56);
      simArrow(ctx,pos,bTop,pos,bTop-nLen,'#34d399',2.5,10);
      simText(ctx,'N='+N.toFixed(0)+'N',pos+6,bTop-nLen-6,'#34d399',9,'left');
    }

    // Weight arrow (down from bottom)
    const wLen=Math.min(mass*g*0.38,56);
    simArrow(ctx,pos,FLY,pos,FLY+Math.min(wLen,H-FLY-8),'#ef4444',2,9);
    simText(ctx,'W='+( mass*g).toFixed(0)+'N',pos+6,FLY+Math.min(wLen,28)+6,'#fca5a5',9,'left');

    // Acceleration arrow (above box)
    const accY=bTop-36;
    if(Math.abs(a)>0.04){
      const aLen=Math.min(Math.abs(a)*18,80);
      simArrow(ctx,pos,accY,pos+Math.sign(a)*aLen,accY,'#22d3ee',3.5,13);
    }
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.88)'; ctx.strokeStyle='#22d3ee'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.roundRect(pos-72,accY-16,144,20,4); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'a='+(a>=0?'+':'')+a.toFixed(3)+' m/s²',pos,accY-3,'#22d3ee',11.5,undefined,true);

    // Velocity arrow (further above)
    if(Math.abs(vel)>0.08){
      const vLen=Math.min(Math.abs(vel)*9,68);
      simArrow(ctx,pos,bTop-60,pos+Math.sign(vel)*vLen,bTop-60,'#34d399',2.5,10);
    }
    simText(ctx,'v='+(vel>=0?'+':'')+vel.toFixed(2)+' m/s',pos,bTop-72,'#34d399',10.5,undefined,true);

    // ─── Info panel (right) ──────────────────────────────────
    const ipX=W-174, ipY=66, ipW=164, ipH=108;
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.93)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(ipX,ipY,ipW,ipH,7); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'F  = '+F.toFixed(1)+' N',ipX+ipW/2,ipY+17,'#ef4444',11,undefined,true);
    simText(ctx,'m  = '+mass.toFixed(1)+' kg',ipX+ipW/2,ipY+33,'#a78bfa',11,undefined,true);
    simText(ctx,'N  = '+N.toFixed(1)+' N',ipX+ipW/2,ipY+49,'#34d399',11,undefined,true);
    simText(ctx,'ΣF = '+netF.toFixed(2)+' N',ipX+ipW/2,ipY+65,'#f59e0b',11,undefined,true);
    simText(ctx,'a  = '+a.toFixed(3)+' m/s²',ipX+ipW/2,ipY+81,'#22d3ee',11.5,undefined,true);
    simText(ctx,'p  = '+(mass*vel).toFixed(2)+' kg·m/s',ipX+ipW/2,ipY+97,'#fbbf24',10,undefined,true);

    // ─── Dual graphs (bottom) ────────────────────────────────
    const gY=H-64, gH=56, gL=12, gR=W-12, gW=(gR-gL)/2-3;

    // v(t) graph
    const vMax=Math.max(1,...vHist.map(Math.abs));
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.88)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.roundRect(gL,gY,gW,gH,5); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'v(t)',gL+18,gY+10,'#34d399',8,'left');
    // zero line
    ctx.save(); ctx.strokeStyle='#1e3a52'; ctx.lineWidth=0.8; ctx.setLineDash([2,4]);
    ctx.beginPath(); ctx.moveTo(gL+2,gY+gH/2); ctx.lineTo(gL+gW-2,gY+gH/2); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
    if(vHist.length>2){
      ctx.save(); ctx.strokeStyle='#34d399'; ctx.lineWidth=1.8; ctx.lineJoin='round'; ctx.beginPath();
      vHist.forEach((v,i)=>{
        const px=gL+2+(i/(vHist.length-1))*(gW-4);
        const py=gY+gH/2-(v/vMax)*(gH/2-4);
        i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
      });
      ctx.stroke(); ctx.restore();
    }
    simText(ctx,vel.toFixed(2)+' m/s',gL+gW-4,gY+gH-4,'#34d399',7.5,'right');

    // a(t) graph
    // Fixed scale prevents wall spikes from collapsing graph
    const curMass=getMass(), curF=getF(), curMu=getMu();
    const aMax=Math.max(Math.abs(curF/curMass)+curMu*9.8+0.5, 0.5);
    const g2L=gR-gW, g2R=gR;
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.88)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.roundRect(g2L,gY,gW,gH,5); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'a(t)',g2L+18,gY+10,'#22d3ee',8,'left');
    ctx.save(); ctx.strokeStyle='#1e3a52'; ctx.lineWidth=0.8; ctx.setLineDash([2,4]);
    ctx.beginPath(); ctx.moveTo(g2L+2,gY+gH/2); ctx.lineTo(g2R-2,gY+gH/2); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
    if(aHist.length>2){
      ctx.save(); ctx.strokeStyle='#22d3ee'; ctx.lineWidth=1.8; ctx.lineJoin='round'; ctx.beginPath();
      aHist.forEach((av,i)=>{
        const px=g2L+2+(i/(aHist.length-1))*(gW-4);
        const py=gY+gH/2-(av/aMax)*(gH/2-4);
        i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
      });
      ctx.stroke(); ctx.restore();
    }
    simText(ctx,a.toFixed(3)+' m/s²',g2R-4,gY+gH-4,'#22d3ee',7.5,'right');
    simText(ctx,'לחיצה כפולה = אפס',W/2,gY-4,'#1a3a52',7.5);

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}

function simIncline(canvas){
  const H=540; const {ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;
  const g=9.8;
  let s=0, vel=0, pT=null;
  let atwoodMode=false;
  let y1=80, y2=80, velAt=0, pTAt=null;

  function getTheta(){ const e=document.getElementById('inp-inc-theta'); return e?parseFloat(e.value):30; }
  function getMu()   { const e=document.getElementById('inp-inc-mu');    return e?parseFloat(e.value):0; }
  function getMass() { const e=document.getElementById('inp-inc-m');  return e?parseFloat(e.value):3; }
  // ── Direct manipulation: grab the ramp surface and tilt it ──
  var dragRamp=false;
  function _rampHit(p){var cxi=W*0.14,cyi=H-72,LEN=Math.min(W*0.70,320);
    var d=Math.hypot(p.x-cxi,p.y-cyi);var a=Math.atan2(cyi-p.y,p.x-cxi)*180/Math.PI;
    return d>28&&d<LEN+28&&a>-6&&a<86;}
  function _rDn(e){var p=simPointerXY(canvas,(window.devicePixelRatio||1),e);
    if(_rampHit(p)){dragRamp=true;canvas.style.cursor='grabbing';e.preventDefault();}}
  function _rMv(e){var p=simPointerXY(canvas,(window.devicePixelRatio||1),e);
    if(dragRamp){var cxi=W*0.14,cyi=H-72;
      simSyncSlider('inc-theta',Math.atan2(cyi-p.y,p.x-cxi)*180/Math.PI,0);e.preventDefault();
    } else canvas.style.cursor=_rampHit(p)?'grab':'';}
  function _rUp(){dragRamp=false;canvas.style.cursor='';}
  canvas.addEventListener('mousedown',_rDn);canvas.addEventListener('touchstart',_rDn,{passive:false});
  canvas.addEventListener('mousemove',_rMv);canvas.addEventListener('touchmove',_rMv,{passive:false});
  canvas.addEventListener('mouseup',_rUp);canvas.addEventListener('touchend',_rUp);
  function getM1()   { const e=document.getElementById('inp-inc-m1');    return e?parseFloat(e.value):3; }
  function getM2()   { const e=document.getElementById('inp-inc-m2');    return e?parseFloat(e.value):5; }

  function resetIncline(){ s=0; vel=0; }
  function resetAtwood() {
    var CEIL_Y2=28, maxY2=H-90;
    y1=(CEIL_Y2+18+maxY2)/2; y2=(CEIL_Y2+18+maxY2)/2;
    velAt=0; pTAt=null;
  }

  // ── INCLINE ──────────────────────────────────────────────
  function drawIncline(ts){
    if(!pT)pT=ts; const dt=Math.min((ts-pT)/1000,.04); pT=ts;
    const theta=getTheta(), mu=getMu(), m=getMass();
    const th=theta*Math.PI/180;
    const sinT=Math.sin(th), cosT=Math.cos(th);
    const N_=m*g*cosT;
    const a=g*(sinT-mu*cosT);
    if(a>0.001){ vel+=a*dt; s+=vel*dt; }
    else if(a<-0.001&&vel>0){ vel+=a*dt; if(vel<0)vel=0; s+=Math.max(0,vel)*dt; }
    const CX=W*0.14, CY=H-72;
    const INCLINE_LEN=Math.min(W*0.70,320);
    const topX=CX+INCLINE_LEN*cosT, topY=CY-INCLINE_LEN*sinT;
    const maxS=(INCLINE_LEN-36)/g*0.92;
    if(s>maxS){ s=0; vel=0; }

    simBg(ctx,W,H);

    // Ground fill
    const flrG=ctx.createLinearGradient(0,CY,0,H);
    flrG.addColorStop(0,'#0f2035'); flrG.addColorStop(1,'#060d1a');
    ctx.fillStyle=flrG; ctx.fillRect(0,CY,W,H-CY);
    ctx.save(); ctx.strokeStyle='#2d5275'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,CY); ctx.lineTo(W,CY); ctx.stroke(); ctx.restore();

    // Incline fill
    const incGrad=ctx.createLinearGradient(CX,CY,topX,topY);
    incGrad.addColorStop(0,'rgba(10,30,60,.95)'); incGrad.addColorStop(1,'rgba(16,44,88,.68)');
    ctx.save(); ctx.fillStyle=incGrad; ctx.strokeStyle='#2d5275'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(CX,CY); ctx.lineTo(topX,topY); ctx.lineTo(topX,CY); ctx.closePath();
    ctx.fill(); ctx.stroke(); ctx.restore();

    // Surface hatching
    ctx.save(); ctx.strokeStyle='rgba(30,58,82,.55)'; ctx.lineWidth=1;
    for(let d=18;d<INCLINE_LEN-12;d+=20){
      const hx=CX+d*cosT, hy=CY-d*sinT;
      ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(hx+sinT*9,hy+cosT*9); ctx.stroke();
    }
    ctx.restore();

    // Angle arc
    ctx.save(); ctx.strokeStyle='#f59e0b'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(CX,CY,52,-th,0,true); ctx.stroke(); ctx.restore();
    simText(ctx,theta+'°',CX+62,CY-18,'#fbbf24',13);

    // Block
    const bS=36;
    const bDist=s*60+bS/2+6;
    const bCX=CX+Math.min(bDist,INCLINE_LEN-bS/2-6)*cosT;
    const bCY=CY-Math.min(bDist,INCLINE_LEN-bS/2-6)*sinT;

    // Velocity arrow along slope
    if(vel>0.1){
      const vLen=Math.min(vel*22,62);
      simArrow(ctx,bCX+cosT*(bS/2+4),bCY-sinT*(bS/2+4),
                   bCX+cosT*(bS/2+4+vLen),bCY-sinT*(bS/2+4+vLen),'#22d3ee',2.5,10);
      simText(ctx,'v='+vel.toFixed(2)+'m/s',bCX+cosT*(bS/2+vLen+18),bCY-sinT*(bS/2+vLen+18)-8,'#22d3ee',9,undefined,true);
    }

    // Block (rotated)
    ctx.save(); ctx.translate(bCX,bCY); ctx.rotate(-th);
    const bGrad=ctx.createLinearGradient(-bS/2,-bS/2,bS/2,bS/2);
    bGrad.addColorStop(0,'rgba(124,58,237,.9)'); bGrad.addColorStop(1,'rgba(91,33,182,.58)');
    ctx.shadowColor='rgba(167,139,250,.55)'; ctx.shadowBlur=16;
    ctx.fillStyle=bGrad; ctx.strokeStyle='#a78bfa'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.roundRect(-bS/2,-bS/2,bS,bS,5); ctx.fill(); ctx.stroke();
    ctx.shadowBlur=0;
    ctx.fillStyle='#ede9fe'; ctx.font='bold 11px Heebo'; ctx.textAlign='center';
    ctx.fillText(getMass().toFixed(1)+'kg',0,4);
    ctx.restore();

    // FBD arrows — all vectors from block center
    const SCALE=3.4;
    const W_mag=getMass()*g, N_mag=getMass()*g*cosT;
    const Wpar=getMass()*g*sinT, Fr_mag=getMu()*N_mag;

    // Weight (straight down)
    const wLen=W_mag*SCALE*0.40;
    simArrow(ctx,bCX,bCY,bCX,bCY+wLen,'#ef4444',3,12);
    simText(ctx,'W='+W_mag.toFixed(0)+'N',bCX+5,bCY+wLen+14,'#fca5a5',9.5,'left');

    // Normal (perpendicular to slope)
    const nLen=N_mag*SCALE*0.40;
    const nEX=bCX-nLen*sinT, nEY=bCY-nLen*cosT;
    simArrow(ctx,bCX,bCY,nEX,nEY,'#34d399',3,12);
    simText(ctx,'N='+N_mag.toFixed(1)+'N',nEX-5,nEY-10,'#34d399',9.5,'right');

    // W parallel (down-slope component)
    const wpLen=Wpar*SCALE*0.40;
    const wpEX=bCX-wpLen*cosT, wpEY=bCY+wpLen*sinT;
    simArrow(ctx,bCX,bCY,wpEX,wpEY,'#fbbf24',2.5,10);
    simText(ctx,'W∥='+Wpar.toFixed(1)+'N',wpEX-8,wpEY+14,'#fbbf24',9,'center');

    // Friction arrow (up-slope, only when moving)
    if(getMu()>0.01&&vel>0.05){
      const frLen=Fr_mag*SCALE*0.40;
      const frEX=bCX+frLen*cosT, frEY=bCY-frLen*sinT;
      simArrow(ctx,bCX,bCY,frEX,frEY,'#a78bfa',2.5,10);
      simText(ctx,'f='+Fr_mag.toFixed(1)+'N',frEX+5,frEY-14,'#a78bfa',9,'left');
    }

    // Info panel
    const m_inf=getMass(), mu2=getMu(), th2=getTheta();
    const a_num=g*(Math.sin(th2*Math.PI/180)-mu2*Math.cos(th2*Math.PI/180));
    const panX=topX+16, panY=Math.max(topY-4,8);
    const panW=Math.min(W-panX-8,206), panH=130;
    if(panX+panW<W-4){
      ctx.save(); ctx.fillStyle='rgba(6,14,28,.93)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.roundRect(panX,panY,panW,panH,7); ctx.fill(); ctx.stroke(); ctx.restore();
      simText(ctx,'θ = '+th2+'°   m = '+m_inf.toFixed(1)+' kg',panX+panW/2,panY+16,'#94a3b8',9.5,undefined,true);
      simText(ctx,'N = mg·cosθ = '+N_mag.toFixed(1)+' N',panX+panW/2,panY+33,'#34d399',10,undefined,true);
      simText(ctx,'W∥= mg·sinθ = '+Wpar.toFixed(1)+' N',panX+panW/2,panY+50,'#fbbf24',10,undefined,true);
      simText(ctx,'f  = μN      = '+Fr_mag.toFixed(1)+' N',panX+panW/2,panY+67,'#a78bfa',10,undefined,true);
      simText(ctx,'a = g(sinθ-μcosθ)',panX+panW/2,panY+86,'#22d3ee',10,undefined,true);
      simText(ctx,'= '+a_num.toFixed(4)+' m/s²',panX+panW/2,panY+103,'#22d3ee',13,undefined,true);
      simText(ctx,'v = '+vel.toFixed(3)+' m/s',panX+panW/2,panY+120,'#94a3b8',9,undefined,true);
    } else {
      ctx.save(); ctx.fillStyle='rgba(6,14,28,.93)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.roundRect(W-216,CY+10,206,90,7); ctx.fill(); ctx.stroke(); ctx.restore();
      simText(ctx,'a='+a_num.toFixed(3)+' m/s²  v='+vel.toFixed(2)+' m/s',W-113,CY+26,'#22d3ee',10,undefined,true);
      simText(ctx,'N='+N_mag.toFixed(1)+'  W∥='+Wpar.toFixed(1)+'  f='+Fr_mag.toFixed(1)+' N',W-113,CY+44,'#94a3b8',9.5,undefined,true);
    }

    // Status bar
    const sb=a_num<=0.002?'גוף בשיווי משקל — ΣF=0':'שנה θ, μ, m — FBD מתעדכן בזמן אמת';
    const sbc=a_num<=0.002?'#34d399':'#334e68';
    simText(ctx,sb,W/2,H-12,sbc,8.5);
  }

  // ── ATWOOD MACHINE ────────────────────────────────────────
  function drawAtwood(ts){
    if(!pTAt)pTAt=ts; const dt=Math.min((ts-pTAt)/1000,.04); pTAt=ts;
    const m1=getM1(), m2=getM2();
    const a_at=(m2-m1)*g/(m1+m2);
    const T_at=2*m1*m2*g/(m1+m2);
    velAt+=a_at*dt;
    // m2 heavier → y2 increases (goes down), y1 decreases (goes up)
    y1-=velAt*dt*44; y2+=velAt*dt*44;
    const CEIL_Y=28, PX=W/2;
    const maxY=H-90;
    // Soft boundary — clamp and reverse velocity instead of hard reset
    if(y1<CEIL_Y+18){ y1=CEIL_Y+18; velAt=Math.max(0,velAt); }
    if(y2>maxY){ y2=maxY; velAt=Math.min(0,velAt); }
    // Full reset only when slider changes handled by resetAtwood call
    if(y2>maxY+4||y1<CEIL_Y+14){ resetAtwood(); return; }

    simBg(ctx,W,H);

    // Ceiling
    ctx.save(); ctx.fillStyle='rgba(15,45,80,.95)'; ctx.strokeStyle='#3d6480'; ctx.lineWidth=1.5;
    ctx.fillRect(PX-55,0,110,CEIL_Y);
    for(let x=PX-52;x<PX+52;x+=12){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x-8,CEIL_Y); ctx.stroke(); }
    ctx.restore();

    // Pulley
    ctx.save(); ctx.strokeStyle='#60a5fa'; ctx.lineWidth=3.5;
    ctx.beginPath(); ctx.arc(PX,CEIL_Y+2,16,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle='#3b82f6'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(PX,CEIL_Y+2,8,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='#1e3a52'; ctx.beginPath(); ctx.arc(PX,CEIL_Y+2,4,0,Math.PI*2); ctx.fill(); ctx.restore();

    // Ropes
    const rx1=PX-14, rx2=PX+14;
    ctx.save(); ctx.strokeStyle='#94a3b8'; ctx.lineWidth=3.5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(rx1,CEIL_Y+10); ctx.lineTo(rx1,y1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(rx2,CEIL_Y+10); ctx.lineTo(rx2,y2); ctx.stroke();
    ctx.restore();

    // Masses
    const bW1=Math.max(50,m1*9.5), bH1=Math.max(40,m1*7.5);
    const bW2=Math.max(50,m2*9.5), bH2=Math.max(40,m2*7.5);
    const x1L=rx1-bW1/2, x2L=rx2-bW2/2;

    // Mass 1 (left, lighter if a_at>0)
    const g1=ctx.createLinearGradient(x1L,y1,x1L,y1+bH1);
    g1.addColorStop(0,'rgba(37,99,235,.88)'); g1.addColorStop(1,'rgba(29,78,216,.58)');
    ctx.save(); ctx.shadowColor='rgba(59,130,246,.45)'; ctx.shadowBlur=16;
    drawBox(ctx,x1L,y1,bW1,bH1,g1,'#60a5fa',2.5,6); ctx.restore();
    simText(ctx,'m₁',x1L+bW1/2,y1+bH1/2-2,'#bfdbfe',13,undefined,true);
    simText(ctx,m1.toFixed(1)+' kg',x1L+bW1/2,y1+bH1/2+14,'#93c5fd',10,undefined,true);

    // Mass 2 (right, heavier if a_at>0)
    const g2=ctx.createLinearGradient(x2L,y2,x2L,y2+bH2);
    g2.addColorStop(0,'rgba(185,28,28,.88)'); g2.addColorStop(1,'rgba(153,27,27,.58)');
    ctx.save(); ctx.shadowColor='rgba(239,68,68,.45)'; ctx.shadowBlur=16;
    drawBox(ctx,x2L,y2,bW2,bH2,g2,'#ef4444',2.5,6); ctx.restore();
    simText(ctx,'m₂',x2L+bW2/2,y2+bH2/2-2,'#fecaca',13,undefined,true);
    simText(ctx,m2.toFixed(1)+' kg',x2L+bW2/2,y2+bH2/2+14,'#fca5a5',10,undefined,true);

    // Force arrows
    const scale=0.55;
    const T_len=Math.min(T_at*scale,80);
    const W1_len=Math.min(m1*g*scale,80);
    const W2_len=Math.min(m2*g*scale,80);

    // Tension (up) on both
    simArrow(ctx,x1L+bW1/2,y1,x1L+bW1/2,y1-T_len,'#34d399',3,12);
    simText(ctx,'T='+T_at.toFixed(1)+'N',x1L+bW1/2-5,y1-T_len-7,'#34d399',9.5,'right');
    simArrow(ctx,x2L+bW2/2,y2,x2L+bW2/2,y2-T_len,'#34d399',3,12);
    simText(ctx,'T='+T_at.toFixed(1)+'N',x2L+bW2/2+5,y2-T_len-7,'#34d399',9.5,'left');

    // Weight (down)
    simArrow(ctx,x1L+bW1/2,y1+bH1,x1L+bW1/2,Math.min(y1+bH1+W1_len,H-6),'#ef4444',2.5,10);
    simText(ctx,'W₁='+(m1*g).toFixed(0)+'N',x1L+bW1/2-5,Math.min(y1+bH1+W1_len+13,H-4),'#fca5a5',9.5,'right');
    simArrow(ctx,x2L+bW2/2,y2+bH2,x2L+bW2/2,Math.min(y2+bH2+W2_len,H-6),'#ef4444',2.5,10);
    simText(ctx,'W₂='+(m2*g).toFixed(0)+'N',x2L+bW2/2+5,Math.min(y2+bH2+W2_len+13,H-4),'#fca5a5',9.5,'left');

    // Acceleration arrows (on sides)
    if(Math.abs(a_at)>0.05){
      const aLen=Math.min(Math.abs(a_at)*20,52);
      const dir1=(a_at>0)?1:-1; // m1: if a_at>0 m2 goes down → m1 goes UP
      const dir2=-dir1;
      simArrow(ctx,x1L-20,y1+bH1/2,x1L-20,y1+bH1/2-dir1*aLen,'#22d3ee',2.5,10);
      simText(ctx,'a',x1L-22,y1+bH1/2-dir1*(aLen+8),'#22d3ee',9,'right');
      simArrow(ctx,x2L+bW2+20,y2+bH2/2,x2L+bW2+20,y2+bH2/2-dir2*aLen,'#22d3ee',2.5,10);
      simText(ctx,'a',x2L+bW2+22,y2+bH2/2-dir2*(aLen+8),'#22d3ee',9,'left');
    }

    // Info panel
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.93)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(W/2-150,H-110,300,100,7); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'a = (m₂-m₁)g/(m₁+m₂)',W/2,H-94,'#94a3b8',9.5,undefined,true);
    simText(ctx,'= '+(m2-m1>=0?'+':'')+(m2-m1).toFixed(1)+'×9.8/'+( m1+m2).toFixed(1)+' = '+a_at.toFixed(3)+' m/s²',W/2,H-78,'#22d3ee',11,undefined,true);
    simText(ctx,'T = 2m₁m₂g/(m₁+m₂) = '+T_at.toFixed(2)+' N',W/2,H-58,'#34d399',11,undefined,true);
    const dir=a_at>0.02?'m₂ יורד  →  m₁ עולה':a_at<-0.02?'m₁ יורד  →  m₂ עולה':'שיווי משקל — m₁=m₂';
    simText(ctx,dir,W/2,H-36,Math.abs(a_at)>0.02?'#fbbf24':'#34d399',11,undefined,true);
    simText(ctx,'שנה m₁,m₂ — אפס = חזור להתחלה',W/2,H-14,'#334e68',8);
  }

  function draw(ts){
    if(_simStop[id])return;
    if(atwoodMode) drawAtwood(ts);
    else drawIncline(ts);
    requestAnimationFrame(draw);
  }

  // Mode + reset buttons
  const atwBtn=document.getElementById('btn-inc-atwood');
  const resetBtn=document.getElementById('btn-inc-reset');
  if(atwBtn) atwBtn.addEventListener('click',()=>{
    atwoodMode=!atwoodMode;
    atwBtn.textContent=atwoodMode?'↩ מדרון':'⚖️ מכונת אטווד';
    pT=null; pTAt=null;
    resetIncline(); resetAtwood();
    // Toggle slider visibility
    ['inc-theta','inc-mu','inc-mass'].forEach(sid=>{
      const e=document.getElementById('inp-'+sid);
      if(e){ const w=e.closest('.range-wrap'); if(w)w.style.display=atwoodMode?'none':'flex'; }
    });
    ['inc-m1','inc-m2'].forEach(sid=>{
      const e=document.getElementById('inp-'+sid);
      if(e){ const w=e.closest('.range-wrap'); if(w)w.style.display=atwoodMode?'flex':'none'; }
    });
  });
  if(resetBtn) resetBtn.addEventListener('click',()=>{ resetIncline(); resetAtwood(); pT=null; pTAt=null; });

  // Hide Atwood sliders initially
  setTimeout(()=>{
    ['inc-m1','inc-m2'].forEach(sid=>{
      const e=document.getElementById('inp-'+sid);
      if(e){ const w=e.closest('.range-wrap'); if(w)w.style.display='none'; }
    });
  },80);

  requestAnimationFrame(draw);
}


function simTension(canvas){
  // SECTION: forces.tension — מתיחות — כוח בחוט
  // PEDAGOGY: Interactive Atwood machine. Student changes masses, watches them accelerate,
  // sees T calculated live. Also shows elevator mode. Core concept: T = m(g+a) NOT just mg.
  // Student can see that tension is NOT equal to weight when there's acceleration.
  const H=500; const {ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;
  const g=9.8;
  let pT=null, t=0;
  var mode='atwood'; // 'atwood' | 'elevator'
  var m1=3, m2=5; // atwood masses
  var pos1=120, pos2=120; // y positions of masses from pulley
  var vel=0; // atwood velocity (positive = m2 going down)
  var running=false;
  var mEl=3, aEl=0; // elevator mass and accel
  var boxY=220, boxVel=0;

  function getM1(){var e=document.getElementById('inp-ten-m1'); return e?parseFloat(e.value):m1;}
  function getM2(){var e=document.getElementById('inp-ten-m2'); return e?parseFloat(e.value):m2;}
  function getAcc(){var e=document.getElementById('inp-ten-ea'); return e?parseFloat(e.value):aEl;}
  function getMEl(){var e=document.getElementById('inp-ten-el'); return e?parseFloat(e.value):mEl;}
  function getModeSel(){
    var e=document.getElementById('inp-ten-mode');
    return e?e.value:'atwood';
  }

  var launchBtn=document.getElementById('btn-ten-launch');
  var resetBtn=document.getElementById('btn-ten-reset');
  if(launchBtn)launchBtn.addEventListener('click',function(){running=!running;if(!running)resetAtwood();});
  if(resetBtn)resetBtn.addEventListener('click',function(){resetAtwood();boxY=220;boxVel=0;});

  function resetAtwood(){pos1=110;pos2=110;vel=0;running=false;if(launchBtn)launchBtn.textContent='▶ שחרר!';}

  resetAtwood();

  // Pulley position
  const PUL_X=W*0.50, PUL_Y=62, PUL_R=22;
  const LEFT_X=PUL_X-PUL_R-4, RIGHT_X=PUL_X+PUL_R+4;
  const CEIL_Y=30;
  // Elevator
  const ELV_X=W*0.55, ELV_CEIL=30;

  function draw(ts){
    if(_simStop[id])return;
    if(!pT)pT=ts; var dt=Math.min((ts-pT)/1000,.04); pT=ts;
    t+=dt;
    m1=getM1(); m2=getM2(); mEl=getMEl(); aEl=getAcc();
    var currentMode=getModeSel();

    // Atwood physics
    if(running){
      var a=(m2-m1)/(m1+m2)*g;
      var T=2*m1*m2/(m1+m2)*g;
      vel+=a*dt;
      pos2+=vel*dt*55; pos1-=vel*dt*55;
      var maxPos=H-100, minPos=80;
      if(pos2>maxPos||pos1>maxPos){running=false;}
      pos2=Math.min(pos2,maxPos); pos1=Math.min(pos1,maxPos);
      pos2=Math.max(pos2,minPos); pos1=Math.max(pos1,minPos);
    }
    // Elevator physics
    boxVel+=aEl*dt; boxY+=boxVel*dt*36;
    boxY=Math.max(ELV_CEIL+50,Math.min(H-60,boxY));

    var a_atw=(m2-m1)/(m1+m2)*g;
    var T_atw=2*m1*m2/(m1+m2)*g;
    var T_el=mEl*(g+aEl);

    simBg(ctx,W,H);

    // ── LEFT: ATWOOD MACHINE ────────────────────────────────
    // Ceiling
    ctx.save(); ctx.fillStyle='#1e3a52'; ctx.fillRect(PUL_X-40,CEIL_Y,80,12); ctx.restore();
    for(var xi=PUL_X-40;xi<PUL_X+40;xi+=10){
      ctx.save(); ctx.strokeStyle='#0f2035'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(xi,CEIL_Y); ctx.lineTo(xi-7,CEIL_Y-7); ctx.stroke(); ctx.restore();
    }
    // Pulley axle
    ctx.save(); ctx.strokeStyle='#94a3b8'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(PUL_X,CEIL_Y+12); ctx.lineTo(PUL_X,PUL_Y-PUL_R); ctx.stroke(); ctx.restore();
    // Pulley
    ctx.save(); ctx.fillStyle='rgba(30,58,82,.9)'; ctx.strokeStyle='#60a5fa'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(PUL_X,PUL_Y,PUL_R,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.restore();
    ctx.save(); ctx.fillStyle='#0f2035';
    ctx.beginPath(); ctx.arc(PUL_X,PUL_Y,PUL_R*0.38,0,Math.PI*2); ctx.fill(); ctx.restore();
    // Groove marking
    ctx.save(); ctx.strokeStyle='rgba(96,165,250,.3)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(PUL_X,PUL_Y,PUL_R-4,0,Math.PI*2); ctx.stroke(); ctx.restore();

    // Ropes
    ctx.save(); ctx.strokeStyle='#94a3b8'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(LEFT_X,PUL_Y); ctx.lineTo(LEFT_X,PUL_Y+pos1-PUL_R); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(RIGHT_X,PUL_Y); ctx.lineTo(RIGHT_X,PUL_Y+pos2-PUL_R); ctx.stroke();
    ctx.restore();
    // Rope tension coloring
    var tNorm=Math.min(1,T_atw/(Math.max(m1,m2)*g*1.2));
    ctx.save(); ctx.strokeStyle='rgba('+Math.round(34+221*tNorm)+','+Math.round(211-150*tNorm)+','+Math.round(238-200*tNorm)+',0.5)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(LEFT_X+1,PUL_Y); ctx.lineTo(LEFT_X+1,PUL_Y+pos1-PUL_R);
    ctx.moveTo(RIGHT_X+1,PUL_Y); ctx.lineTo(RIGHT_X+1,PUL_Y+pos2-PUL_R); ctx.stroke(); ctx.restore();

    // Mass 1 (left)
    var bW=Math.max(36,m1*10), bH=36;
    var m1Y=PUL_Y+pos1;
    ctx.save(); ctx.shadowColor='#60a5fa'; ctx.shadowBlur=running?12:0;
    ctx.fillStyle='rgba(59,130,246,.85)'; ctx.strokeStyle='#60a5fa'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.roundRect(LEFT_X-bW/2,m1Y,bW,bH,4); ctx.fill(); ctx.stroke();
    ctx.shadowBlur=0; ctx.restore();
    simText(ctx,'m₁='+m1+' kg',LEFT_X,m1Y+bH/2+4,'#bfdbfe',9.5,undefined,true);
    // T arrow up on m1
    var t1len=Math.min(50,T_atw*2);
    simArrow(ctx,LEFT_X,m1Y,LEFT_X,m1Y-t1len,'#22d3ee',2.5,10);
    // W arrow down on m1
    simArrow(ctx,LEFT_X,m1Y+bH,LEFT_X,m1Y+bH+Math.min(40,m1*g*1.5),'#fbbf24',2,8);

    // Mass 2 (right)
    var bW2=Math.max(36,m2*10);
    var m2Y=PUL_Y+pos2;
    ctx.save(); ctx.shadowColor='#f87171'; ctx.shadowBlur=running?12:0;
    ctx.fillStyle='rgba(239,68,68,.85)'; ctx.strokeStyle='#f87171'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.roundRect(RIGHT_X-bW2/2,m2Y,bW2,bH,4); ctx.fill(); ctx.stroke();
    ctx.shadowBlur=0; ctx.restore();
    simText(ctx,'m₂='+m2+' kg',RIGHT_X,m2Y+bH/2+4,'#fca5a5',9.5,undefined,true);
    var t2len=Math.min(50,T_atw*2);
    simArrow(ctx,RIGHT_X,m2Y,RIGHT_X,m2Y-t2len,'#22d3ee',2.5,10);
    simArrow(ctx,RIGHT_X,m2Y+bH,RIGHT_X,m2Y+bH+Math.min(40,m2*g*1.5),'#fbbf24',2,8);

    // T label between pulleys
    simText(ctx,'T='+T_atw.toFixed(1)+'N',PUL_X,PUL_Y+2,'#22d3ee',9.5,undefined,true);

    // ── RIGHT: ELEVATOR ──────────────────────────────────────
    var EVX=W*0.75;
    // Ceiling
    ctx.save(); ctx.fillStyle='#1e3a52'; ctx.fillRect(EVX-30,CEIL_Y,60,12); ctx.restore();
    // Rope
    ctx.save(); ctx.strokeStyle='#94a3b8'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(EVX,CEIL_Y+12); ctx.lineTo(EVX,boxY-20); ctx.stroke(); ctx.restore();
    // Elevator box
    var eW=52, eH=44;
    ctx.save();
    var eCol=aEl>0.1?'#34d399':aEl<-0.1?'#f87171':'#60a5fa';
    ctx.fillStyle=eCol+'88'; ctx.strokeStyle=eCol; ctx.lineWidth=2;
    // Elevator shaft outline
    ctx.strokeStyle='rgba(30,58,82,.4)'; ctx.setLineDash([4,6]);
    ctx.strokeRect(EVX-30,CEIL_Y+14,60,H-CEIL_Y-50); ctx.setLineDash([]); ctx.restore();
    ctx.save(); ctx.fillStyle=eCol+'cc'; ctx.strokeStyle=eCol; ctx.lineWidth=2;
    ctx.beginPath(); ctx.roundRect(EVX-eW/2,boxY-eH/2,eW,eH,5); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,mEl+'kg',EVX,boxY+4,'#f0f9ff',9.5,undefined,true);
    // T and W on elevator
    var tel=Math.min(52,T_el*1.2);
    var well=Math.min(42,mEl*g*1.2);
    simArrow(ctx,EVX,boxY-eH/2,EVX,boxY-eH/2-tel,'#22d3ee',2.5,10);
    simText(ctx,'T',EVX+8,boxY-eH/2-tel/2,'#22d3ee',8,'left');
    simArrow(ctx,EVX,boxY+eH/2,EVX,boxY+eH/2+well,'#fbbf24',2,8);
    simText(ctx,'W',EVX+8,boxY+eH/2+well/2,'#fbbf24',8,'left');
    // Accel arrow
    if(Math.abs(aEl)>0.1){
      var alen=Math.min(36,Math.abs(aEl)*8);
      simArrow(ctx,EVX-eW/2-8,boxY,EVX-eW/2-8,boxY+(aEl>0?-1:1)*alen,eCol,2,8);
      simText(ctx,'a='+aEl.toFixed(1),EVX-eW/2-26,boxY,eCol,7.5,undefined,true);
    }
    // Elevator T value
    simText(ctx,'T='+T_el.toFixed(1)+'N',EVX,boxY+eH/2+well+14,'#22d3ee',9,undefined,true);
    simText(ctx,aEl>0.1?'עולה: T>W':aEl<-0.1?'יורד: T<W':'נייח: T=W',EVX,boxY+eH/2+well+26,eCol,8,undefined,true);

    // ── Formula panel ─────────────────────────────────────
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.92)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(8,6,W-16,46,6); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'מתיחות — מכונת אטווד (שמאל) | מעלית (ימין)',W/2,18,'#22d3ee',10,undefined,true);
    simText(ctx,'מכונת אטווד: T = 2m₁m₂g/(m₁+m₂) = '+T_atw.toFixed(1)+'N  |  a = (m₂-m₁)g/(m₁+m₂) = '+a_atw.toFixed(2)+' m/s²',W/2,32,'#94a3b8',8.5,undefined,true);
    simText(ctx,'מעלית: T = m(g+a) = '+mEl+'×(9.8+('+aEl.toFixed(1)+')) = '+T_el.toFixed(1)+' N',W/2,44,'#60a5fa',8.5,undefined,true);

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}
