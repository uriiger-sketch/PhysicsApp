    ctx.fillStyle='rgba(255,255,80,0.9)';ctx.fillText('צהוב',(rX+gX)/2,rY+5);
    ctx.fillStyle='rgba(80,255,255,0.9)';ctx.fillText('ציאן',(gX+bX)/2,(gY+bY)/2);
    ctx.fillStyle='rgba(255,80,255,0.9)';ctx.fillText('ורוד',(rX+bX)/2,(rY+bY)/2);
    ctx.fillStyle='rgba(255,255,255,0.9)';ctx.fillText('לבן',(rX+gX+bX)/3,(rY+gY+bY)/3+4);
    ctx.restore();
    // Info box
    ctx.save();ctx.fillStyle='rgba(10,22,40,0.9)';ctx.strokeStyle='#1e293b';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(10,H-74,W-20,60,6);ctx.fill();ctx.stroke();
    ctx.textAlign='center';ctx.font='11px Heebo';
    ctx.fillStyle='#ff6464';ctx.fillText('R: '+Math.round(rv*100)+'%',W*0.22,H-53);
    ctx.fillStyle='#64ff64';ctx.fillText('G: '+Math.round(gv*100)+'%',W*0.5,H-53);
    ctx.fillStyle='#6496ff';ctx.fillText('B: '+Math.round(bv*100)+'%',W*0.78,H-53);
    var sumR=Math.min(255,ri),sumG=Math.min(255,gi),sumB=Math.min(255,bi);
    ctx.fillStyle='rgb('+sumR+','+sumG+','+sumB+')';
    ctx.fillText('צבע מרכז RGB('+sumR+','+sumG+','+sumB+')',W/2,H-33);
    ctx.fillStyle='#64748b';ctx.font='9px Heebo';
    ctx.fillText('R+G=צהוב  |  G+B=ציאן  |  R+B=ורוד  |  R+G+B=לבן',W/2,H-16);
    ctx.restore();
    requestAnimationFrame(draw);
  }
  function poll(){if(_simStop[id])return;requestAnimationFrame(draw);}poll();
}

// ─────────────────────────────────────────────────────────────
// FIBER OPTICS sim — TIR bouncing in curved fiber
// ─────────────────────────────────────────────────────────────
function simOptFiber(canvas,id){
  var _g=(_simGen[id]=(_simGen[id]||0)+1);
  var R=setupCanvas(canvas,460);var ctx=R.ctx,W=R.W,H=R.H;
  var animT=0,last=null;
  function gN1(){var e=document.getElementById('inp-fib-n1');return e?parseFloat(e.value):1.50;}
  function gN2(){var e=document.getElementById('inp-fib-n2');return e?parseFloat(e.value):1.46;}
  function gAng(){var e=document.getElementById('inp-fib-ang');return e?parseFloat(e.value)*Math.PI/180:20*Math.PI/180;}
  // ── Direct manipulation: grab the entry ray and change the launch angle ──
  var dragRay=false;
  function _fHit(p){var enx=W*0.05,eny=H*0.42;var d=Math.hypot(p.x-enx,p.y-eny);
    return p.x<enx+16&&d>12&&d<120;}
  function _fDn(e){var p=simPointerXY(canvas,R.dpr,e);
    if(_fHit(p)){dragRay=true;canvas.style.cursor='grabbing';e.preventDefault();}}
  function _fMv(e){var p=simPointerXY(canvas,R.dpr,e);
    if(dragRay){var enx=W*0.05,eny=H*0.42;
      simSyncSlider('fib-ang',Math.atan2(p.y-eny,enx-p.x)*180/Math.PI,0);e.preventDefault();
    } else canvas.style.cursor=_fHit(p)?'grab':'';}
  function _fUp(){dragRay=false;canvas.style.cursor='';}
  canvas.addEventListener('mousedown',_fDn);canvas.addEventListener('touchstart',_fDn,{passive:false});
  canvas.addEventListener('mousemove',_fMv);canvas.addEventListener('touchmove',_fMv,{passive:false});
  canvas.addEventListener('mouseup',_fUp);canvas.addEventListener('touchend',_fUp);
  function draw(ts){
    if(_simGen[id]!==_g)return;if(_simStop[id])return;
    var dt=last?Math.min((ts-last)/1000,0.05):0.016;last=ts;animT+=dt;
    var n1=gN1(),n2=gN2(),inAng=gAng();
    ctx.fillStyle='#080e1a';ctx.fillRect(0,0,W,H);
    var thetaC=Math.asin(Math.min(1,n2/n1));
    var NA=Math.sqrt(Math.max(0,n1*n1-n2*n2));
    var maxInAng=Math.asin(Math.min(1,NA));
    var tir=inAng<=maxInAng;
    // === FIBER SHAPE: bent S-curve ===
    var fiberY=H*0.42,fiberR=H*0.32,fiberW=22;
    var x0=W*0.05,x1=W*0.5,x2=W*0.95;
    // Draw fiber cladding (outer) then core
    function drawFiber(yw,col){
      ctx.save();ctx.beginPath();
      ctx.moveTo(x0,fiberY-yw/2);
      ctx.bezierCurveTo(x1*0.5,fiberY-yw/2,x1*0.5,fiberY-fiberR-yw/2,x1,fiberY-fiberR);
      ctx.bezierCurveTo(x1+(x2-x1)*0.5,fiberY-fiberR+yw/2,x1+(x2-x1)*0.5,fiberY+yw/2,x2,fiberY+yw/2);
      ctx.lineTo(x2,fiberY-yw/2);
      ctx.bezierCurveTo(x1+(x2-x1)*0.5,fiberY-yw/2,x1+(x2-x1)*0.5,fiberY-fiberR-yw/2,x1,fiberY-fiberR-yw);
      ctx.bezierCurveTo(x1*0.5,fiberY-fiberR-yw*1.5,x1*0.5,fiberY+yw/2,x0,fiberY+yw/2);
      ctx.closePath();ctx.fillStyle=col;ctx.fill();ctx.restore();
    }
    drawFiber(fiberW+10,'rgba(30,58,138,0.5)');// cladding
    drawFiber(fiberW,'rgba(37,99,235,0.25)');  // core
    // Fiber outline
    ctx.save();ctx.strokeStyle='#3b82f6';ctx.lineWidth=1.5;
    var drawCurve=function(offsetY){
      ctx.beginPath();
      ctx.moveTo(x0,fiberY+offsetY);
      ctx.bezierCurveTo(x1*0.5,fiberY+offsetY,x1*0.5,fiberY-fiberR+offsetY,x1,fiberY-fiberR+offsetY);
      ctx.bezierCurveTo(x1+(x2-x1)*0.5,fiberY-fiberR+offsetY,x1+(x2-x1)*0.5,fiberY+offsetY,x2,fiberY+offsetY);
      ctx.stroke();
    };
    drawCurve(-fiberW/2);drawCurve(fiberW/2);ctx.restore();
    // === BOUNCING LIGHT RAY (simplified parametric) ===
    var thR=Math.asin(Math.min(0.99,Math.sin(inAng)/n1)); // refraction angle inside the core
    var phase=animT*(0.35+thR*1.5);
    var nBounce=Math.max(5,Math.round(5+Math.tan(thR)*46));
    // Cubic bezier helper: evaluate one coordinate component
    function cubBez(t,p0,p1,p2,p3){var u=1-t;return u*u*u*p0+3*u*u*t*p1+3*u*t*t*p2+t*t*t*p3;}
    // Fiber centerline S-curve: two bezier segments
    function midPt(tf){
      if(tf<=0.5){var t=tf*2;return{x:cubBez(t,x0,x1*0.5,x1*0.5,x1),y:cubBez(t,fiberY,fiberY,fiberY-fiberR,fiberY-fiberR)};}
      var t=(tf-0.5)*2;return{x:cubBez(t,x1,x1+(x2-x1)*0.5,x1+(x2-x1)*0.5,x2),y:cubBez(t,fiberY-fiberR,fiberY-fiberR,fiberY,fiberY)};
    }
    ctx.save();
    if(tir){optGlow(ctx,'#fbbf24',10);}
    ctx.strokeStyle=tir?'#fbbf24':'rgba(251,191,36,0.3)';ctx.lineWidth=2;ctx.lineCap='round';
    ctx.beginPath();
    for(var i=0;i<nBounce;i++){
      var tf=Math.min(0.999,(i+(phase%1))/nBounce);
      var mp=midPt(tf);
      var zig=((i+Math.floor(phase))%2===0)?1:-1;
      var bx=mp.x,by=mp.y+zig*(fiberW*0.38);
      if(i===0)ctx.moveTo(bx,by);else ctx.lineTo(bx,by);
    }
    ctx.stroke();
    if(tir)optNoGlow(ctx);
    ctx.restore();
    if(!tir){
      // Refracted rays leaking out through the cladding at the first bounces
      ctx.save();ctx.strokeStyle='rgba(248,113,113,0.8)';ctx.lineWidth=1.6;
      for(var li=1;li<=3;li++){
        var mpL=midPt(Math.min(0.999,li/nBounce));
        var zigL=((li+Math.floor(phase))%2===0)?1:-1;
        ctx.globalAlpha=1-li*0.22;
        ctx.beginPath();ctx.moveTo(mpL.x,mpL.y+zigL*(fiberW*0.5));
        ctx.lineTo(mpL.x+16,mpL.y+zigL*(fiberW*0.5)+zigL*26);ctx.stroke();
      }
      ctx.restore();
      optLabel(ctx,'האור בורח למעטפת!',W*0.32,fiberY+fiberW+42,'#f87171',9);
    }
    // === INCIDENT RAY (entering) ===
    var entX=W*0.05,entY=fiberY;
    ctx.save();ctx.strokeStyle='#fbbf24';ctx.lineWidth=3;ctx.lineCap='round';
    ctx.beginPath();
    var srcX=entX-60*Math.cos(inAng),srcY=entY-60*Math.sin(-inAng);
    ctx.moveTo(srcX,srcY);ctx.lineTo(entX,entY);ctx.stroke();
    ctx.restore();
    // === EXITING RAY (right side) ===
    if(tir){
      ctx.save();optGlow(ctx,'#fbbf24',12);ctx.strokeStyle='#fbbf24';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(x2,fiberY);ctx.lineTo(x2+60,fiberY);ctx.stroke();
      optNoGlow(ctx);ctx.restore();
      optLabel(ctx,'אור יוצא',x2+55,fiberY-12,'#fbbf24',9);
    }
    // === LABELS ===
    optLabel(ctx,'ליבה n₁='+n1.toFixed(2),W*0.5,fiberY-fiberR-fiberW/2-10,'#93c5fd',9);
    optLabel(ctx,'מעטה n₂='+n2.toFixed(2),W*0.5,fiberY+fiberW/2+22,'#475569',8);
    // Critical angle display
    var tcDeg=(thetaC*180/Math.PI).toFixed(1);
    var maxDeg=(maxInAng*180/Math.PI).toFixed(1);
    var inDeg=(inAng*180/Math.PI).toFixed(0);
    // Status
    ctx.save();ctx.fillStyle=tir?'#22c55e':'#ef4444';ctx.font='bold 11px Heebo';ctx.textAlign='center';
    ctx.fillText(tir?'✓ TIR — אור נלכד בסיב':'✗ אור דולף — זווית גדולה מדי',W/2,H*0.12);ctx.restore();
    optInfoBox(ctx,10,H-70,W-20,['n₁='+n1.toFixed(2)+', n₂='+n2.toFixed(2),'θ_קריטי='+tcDeg+'°, NA='+NA.toFixed(3),'זווית כניסה מקס׳: '+maxDeg+'°','זווית כניסה נוכחית: '+inDeg+'° — '+(tir?'נלכד':'דולף!')]);
    requestAnimationFrame(draw);
  }
  function poll(){if(_simStop[id])return;requestAnimationFrame(draw);}poll();
}

// ─────────────────────────────────────────────────────────────
// TELESCOPE sim — two-lens ray diagram
// ─────────────────────────────────────────────────────────────
function simOptTelescope(canvas,id){
  var _g=(_simGen[id]=(_simGen[id]||0)+1);
  var R=setupCanvas(canvas,460);var ctx=R.ctx,W=R.W,H=R.H;
  var animT=0,last=null;
  function gFo(){var e=document.getElementById('inp-tel-fo');return e?parseFloat(e.value):150;}
  function gFe(){var e=document.getElementById('inp-tel-fe');return e?parseFloat(e.value):25;}
  // ── Direct manipulation: slide the lenses to set fₒ and fₑ ──
  var dragLens=null,touchedT=false,_geo={};
  function _tDn(e){var p=simPointerXY(canvas,R.dpr,e);
    if(_geo.L1x!==undefined&&Math.abs(p.x-_geo.L1x)<24&&Math.abs(p.y-_geo.ax)<70)dragLens='obj';
    else if(_geo.L3x!==undefined&&Math.abs(p.x-_geo.L3x)<24&&Math.abs(p.y-_geo.ax)<60)dragLens='eye';
    if(dragLens){touchedT=true;canvas.style.cursor='grabbing';e.preventDefault();}}
  function _tMv(e){var p=simPointerXY(canvas,R.dpr,e);
    if(dragLens==='obj'&&_geo.scale){
      simSyncSlider('tel-fo',(p.x-_geo.margin)/(_geo.scale*0.3),0);e.preventDefault();
    } else if(dragLens==='eye'&&_geo.scale){
      simSyncSlider('tel-fe',(p.x-_geo.L2x)/_geo.scale,0);e.preventDefault();
    } else {
      var hov=(_geo.L1x!==undefined&&Math.abs(p.x-_geo.L1x)<24&&Math.abs(p.y-_geo.ax)<70)||
              (_geo.L3x!==undefined&&Math.abs(p.x-_geo.L3x)<24&&Math.abs(p.y-_geo.ax)<60);
      canvas.style.cursor=hov?'grab':'';
    }}
  function _tUp(){dragLens=null;canvas.style.cursor='';}
  canvas.addEventListener('mousedown',_tDn);canvas.addEventListener('touchstart',_tDn,{passive:false});
  canvas.addEventListener('mousemove',_tMv);canvas.addEventListener('touchmove',_tMv,{passive:false});
  canvas.addEventListener('mouseup',_tUp);canvas.addEventListener('touchend',_tUp);
  function draw(ts){
    if(_simGen[id]!==_g)return;if(_simStop[id])return;
    var dt=last?Math.min((ts-last)/1000,0.05):0.016;last=ts;animT+=dt;
    var fo=gFo(),fe=gFe();
    ctx.fillStyle='#0a1628';ctx.fillRect(0,0,W,H);
    var ax=H/2,margin=W*0.05;
    // Fit the whole train (0.3·fo lead-in + fo + fe + eye) inside the canvas
    var scale=(W-margin*2-70)/(fo*1.3+fe);
    // Objective lens position
    var L1x=margin+fo*scale*0.3;// put obj lens at 30% of fo from left (far object)
    var L2x=L1x+fo*scale;// intermediate image at fo from L1
    var L3x=L2x+fe*scale;// eyepiece at fe from image
    _geo={L1x:L1x,L2x:L2x,L3x:L3x,ax:ax,scale:scale,margin:margin};
    // Draw principal axis
    optDash(ctx,10,ax,W-10,ax,'#1e293b',0.5);
    if(!touchedT&&animT<9){
      optLabel(ctx,'✋ גרור את העדשות — שנה fₒ ו-fₑ',W/2,H-14,'#fbbf24',10);
    }
    // === OBJECT (far left, arrow pointing up) ===
    var objH=28,objX=margin*0.6;
    ctx.save();ctx.strokeStyle='#fbbf24';ctx.lineWidth=2;ctx.shadowColor='#fbbf24';ctx.shadowBlur=6;
    ctx.beginPath();ctx.moveTo(objX,ax);ctx.lineTo(objX,ax-objH);ctx.stroke();
    ctx.fillStyle='#fbbf24';
    ctx.beginPath();ctx.moveTo(objX,ax-objH);ctx.lineTo(objX-5,ax-objH+9);ctx.lineTo(objX+5,ax-objH+9);
    ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.restore();
    optLabel(ctx,'עצם',objX,ax+12,'#fbbf24',8);
    // === OBJECTIVE LENS ===
    optLensShape(ctx,L1x,ax,8,70,'#3b82f6','rgba(59,130,246,0.08)');
    optLabel(ctx,'אובייקטיב',L1x,ax+44,'#93c5fd',8);
    optLabel(ctx,'fₒ='+fo+'mm',L1x,ax+56,'#60a5fa',8);
    // === INTERMEDIATE IMAGE (inverted, at the shared focal plane) ===
    var imgTip=objH*0.6; // tip below axis = inverted
    ctx.save();ctx.strokeStyle='#f97316';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(L2x,ax);ctx.lineTo(L2x,ax+imgTip);ctx.stroke();
    ctx.setLineDash([]);ctx.restore();
    optLabel(ctx,'תמונת ביניים',L2x,ax+imgTip+12,'#f97316',8);
    optLabel(ctx,'↕ הפוכה',L2x,ax+imgTip+23,'#f97316',8);
    // === EYEPIECE LENS ===
    optLensShape(ctx,L3x,ax,6,52,'#7c3aed','rgba(124,58,237,0.08)');
    optLabel(ctx,'עדשת עין',L3x,ax-36,'#a78bfa',8);
    optLabel(ctx,'fₑ='+fe+'mm',L3x,ax-25,'#8b5cf6',8);
    // === EYE (output) ===
    var eyeX=Math.min(W-margin*0.5,L3x+fe*scale*0.8);
    ctx.save();ctx.strokeStyle='#e2e8f0';ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(eyeX,ax,18,10,0,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#1d4ed8';ctx.beginPath();ctx.arc(eyeX,ax,6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(eyeX,ax,3,0,Math.PI*2);ctx.fill();
    ctx.restore();
    // === RAYS: far object → parallel bundle at angle θ into the objective ===
    var thSlope=imgTip/(L2x-L1x); // all incoming rays converge on the intermediate tip
    ctx.save();
    [[-24,'rgba(251,191,36,0.4)'],[0,'rgba(251,191,36,0.8)'],[24,'rgba(251,191,36,0.4)']].forEach(function(rr){
      var off=rr[0];ctx.strokeStyle=rr[1];ctx.lineWidth=1.4;
      ctx.beginPath();
      ctx.moveTo(objX,ax+off-thSlope*(L1x-objX));
      ctx.lineTo(L1x,ax+off);
      ctx.lineTo(L2x,ax+imgTip);
      ctx.stroke();
    });
    ctx.restore();
    // === Through the eyepiece: exit bundle parallel at a STEEPER angle (ratio = fo/fe = M) ===
    var exitSlope=-imgTip/(L3x-L2x);
    var exX=Math.min(W-12,eyeX+12);
    ctx.save();
    [[-14,'rgba(167,139,250,0.45)'],[0,'rgba(167,139,250,0.85)'],[12,'rgba(167,139,250,0.45)']].forEach(function(rr){
      var hy=rr[0];ctx.strokeStyle=rr[1];ctx.lineWidth=1.4;
      ctx.beginPath();
      ctx.moveTo(L2x,ax+imgTip);
      ctx.lineTo(L3x,ax+hy);
      ctx.lineTo(exX,ax+hy+exitSlope*(exX-L3x));
      ctx.stroke();
    });
    ctx.restore();
    // === ANIMATED PHOTON along the central ray: object → objective → tip → eyepiece → eye ===
    var pPath=[
      {x:objX,y:ax-thSlope*(L1x-objX)},
      {x:L1x,y:ax},
      {x:L2x,y:ax+imgTip},
      {x:L3x,y:ax},
      {x:exX,y:ax+exitSlope*(exX-L3x)}
    ];
    var pSegs=[],pTot=0;
    for(var pi=1;pi<pPath.length;pi++){var pl=Math.hypot(pPath[pi].x-pPath[pi-1].x,pPath[pi].y-pPath[pi-1].y);pSegs.push(pl);pTot+=pl;}
    var pProg=((animT*0.22)%1)*pTot;
    for(var pi=0;pi<pSegs.length;pi++){
      if(pProg<=pSegs[pi]){
        var pf=pProg/Math.max(1e-6,pSegs[pi]);
        ctx.save();ctx.fillStyle='#fbbf24';optGlow(ctx,'#fbbf24',12);
        ctx.beginPath();ctx.arc(pPath[pi].x+(pPath[pi+1].x-pPath[pi].x)*pf,pPath[pi].y+(pPath[pi+1].y-pPath[pi].y)*pf,3.5,0,Math.PI*2);ctx.fill();
        optNoGlow(ctx);ctx.restore();break;
      }
      pProg-=pSegs[pi];
    }
    // === MAGNIFICATION DISPLAY ===
    var M=fo/fe;
    ctx.save();ctx.fillStyle='rgba(10,22,40,0.9)';ctx.strokeStyle='#1e293b';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(10,10,W-20,38,6);ctx.fill();ctx.stroke();
    ctx.fillStyle='#34d399';ctx.font='bold 13px Heebo';ctx.textAlign='center';
    ctx.fillText('הגדלה: M = fₒ/fₑ = '+fo+'/'+fe+' = '+M.toFixed(1)+'×  |  אורך הצינור: '+(fo+fe)+'mm',W/2,32);
    ctx.restore();
    // Length scale bar
    ctx.save();ctx.strokeStyle='#334155';ctx.lineWidth=1;
    var scaleBarLen=fe*scale;
    ctx.beginPath();ctx.moveTo(L3x,ax+60);ctx.lineTo(L3x+scaleBarLen,ax+60);ctx.stroke();
    ctx.beginPath();ctx.moveTo(L3x,ax+55);ctx.lineTo(L3x,ax+65);ctx.stroke();
    ctx.beginPath();ctx.moveTo(L3x+scaleBarLen,ax+55);ctx.lineTo(L3x+scaleBarLen,ax+65);ctx.stroke();
    ctx.fillStyle='#64748b';ctx.font='8px Heebo';ctx.textAlign='center';
    ctx.fillText('fₑ='+fe+'mm',L3x+scaleBarLen/2,ax+74);ctx.restore();
    optInfoBox(ctx,10,H-64,W-20,['fₒ='+fo+'mm, fₑ='+fe+'mm','הגדלה M='+M.toFixed(1)+'×  (הפוכה)','אורך כולל: '+(fo+fe)+'mm','לטלסקופ: M גדולה = fₒ ארוך ו-fₑ קצר']);
    requestAnimationFrame(draw);
  }
  function poll(){if(_simStop[id])return;requestAnimationFrame(draw);}poll();
}

// ─────────────────────────────────────────────────────────────
// THIN FILM INTERFERENCE sim — soap film rainbow
// ─────────────────────────────────────────────────────────────
function simOptThinFilm(canvas,id){
  var _g=(_simGen[id]=(_simGen[id]||0)+1);
  var R=setupCanvas(canvas,500);var ctx=R.ctx,W=R.W,H=R.H;
  var animT=0,last=null;
  function getT(){var e=document.getElementById('inp-tf-thick');return e?parseFloat(e.value):300;}
  function getN(){var e=document.getElementById('inp-tf-n');return e?parseFloat(e.value):1.33;}
  // ── Direct manipulation: drag on the film — down = thicker ──
  var dragFilm=false,touchedF=false;
  function _fHit(p){return Math.abs(p.x-R.W*0.44)<70&&p.y>R.H*0.07&&p.y<R.H*0.72;}
  function _tfDn(e){var p=simPointerXY(canvas,R.dpr,e);
    if(_fHit(p)){dragFilm=true;touchedF=true;canvas.style.cursor='grabbing';
      simSyncSlider('tf-thick',50+(p.y-R.H*0.07)/(R.H*0.65)*550,0);e.preventDefault();}}
  function _tfMv(e){var p=simPointerXY(canvas,R.dpr,e);
    if(dragFilm){simSyncSlider('tf-thick',50+(p.y-R.H*0.07)/(R.H*0.65)*550,0);e.preventDefault();}
    else canvas.style.cursor=_fHit(p)?'ns-resize':'';}
  function _tfUp(){dragFilm=false;canvas.style.cursor='';}
  canvas.addEventListener('mousedown',_tfDn);canvas.addEventListener('touchstart',_tfDn,{passive:false});
  canvas.addEventListener('mousemove',_tfMv);canvas.addEventListener('touchmove',_tfMv,{passive:false});
  canvas.addEventListener('mouseup',_tfUp);canvas.addEventListener('touchend',_tfUp);
  // Reflected intensity: I ∝ sin²(2πnt/λ) (one phase flip at first surface)
  function iRefl(wl,t,n){var ph=2*Math.PI*n*t/wl;return Math.pow(Math.sin(ph),2);}
  // Get dominant reflected color RGB
  function reflRGB(t,n){
    var rr=0,gg=0,bb=0,tot=0;
    for(var wl=380;wl<=700;wl+=8){
      var I=iRefl(wl,t,n);
      var hex=wavelengthToHex(wl);
      rr+=parseInt(hex.slice(1,3),16)*I;
      gg+=parseInt(hex.slice(3,5),16)*I;
      bb+=parseInt(hex.slice(5,7),16)*I;
      tot+=I;
    }
    if(tot<0.01)return [20,20,20];
    return [Math.round(rr/tot),Math.round(gg/tot),Math.round(bb/tot)];
  }
  function draw(ts){
    if(_simGen[id]!==_g)return;if(_simStop[id])return;
    var dt=last?Math.min((ts-last)/1000,0.05):0.016;last=ts;animT+=dt;
    var t0=getT(),n=getN();
    ctx.fillStyle='#08101e';ctx.fillRect(0,0,W,H);
    var filmX=W*0.44,filmW=16;
    var fTop=H*0.07,fBot=H*0.72;
    // === FILM with gradient thickness from top (thin) to bottom (thick) ===
    // Shows rainbow of colors: different thicknesses → different constructive λ
    // Cache the spectral gradient — rebuilding 33 stops × 40 wavelengths per frame is wasteful
    var gKey=t0+'_'+n;
    if(draw._gKey!==gKey){
      var gf=ctx.createLinearGradient(0,fTop,0,fBot);
      var nS=32;
      for(var si=0;si<=nS;si++){
        var tLocal=t0*(0.2+1.6*si/nS);
        var rgb=reflRGB(tLocal,n);
        gf.addColorStop(si/nS,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0.92)');
      }
      draw._gKey=gKey;draw._grad=gf;
    }
    var gfilm=draw._grad;
    if(!touchedF&&animT<9){
      ctx.save();ctx.fillStyle='#fbbf24';ctx.font='bold 10px Heebo';ctx.textAlign='center';
      ctx.fillText('✋ גרור על הקרום — למטה = עבה יותר',W*0.44,H*0.78);ctx.restore();
    }
    // Film shadow/depth effect
    var filmGlow=ctx.createLinearGradient(filmX-filmW/2-5,0,filmX+filmW/2+5,0);
    filmGlow.addColorStop(0,'rgba(0,0,0,0)');
    filmGlow.addColorStop(0.2,'rgba(255,255,255,0.08)');
    filmGlow.addColorStop(0.5,'rgba(255,255,255,0.2)');
    filmGlow.addColorStop(0.8,'rgba(255,255,255,0.08)');
    filmGlow.addColorStop(1,'rgba(0,0,0,0)');
    // Draw film
    ctx.fillStyle=gfilm;
    ctx.fillRect(filmX-filmW/2,fTop,filmW,fBot-fTop);
    ctx.fillStyle=filmGlow;
    ctx.fillRect(filmX-filmW/2,fTop,filmW,fBot-fTop);
    ctx.strokeStyle='rgba(148,163,184,0.3)';ctx.lineWidth=0.5;
    ctx.strokeRect(filmX-filmW/2,fTop,filmW,fBot-fTop);
    // Film label
    optLabel(ctx,'קרום דק',filmX,fBot+14,'#94a3b8',8);
    optLabel(ctx,'n='+n.toFixed(2),filmX,fBot+26,'#64748b',7);
    // === INCIDENT WHITE LIGHT (animated photons from left) ===
    var incY=H*0.22,incAng=Math.PI/6;
    var bLen=W*0.32;
    var incX0=filmX-filmW/2-bLen*Math.cos(incAng),incY0=incY+bLen*Math.sin(incAng);
    // Rainbow gradient beam
    var bGrad=ctx.createLinearGradient(incX0,incY0,filmX-filmW/2,incY);
    bGrad.addColorStop(0,'rgba(255,80,80,0.8)');
    bGrad.addColorStop(0.25,'rgba(255,200,50,0.8)');
    bGrad.addColorStop(0.5,'rgba(80,255,80,0.8)');
    bGrad.addColorStop(0.75,'rgba(50,130,255,0.8)');
    bGrad.addColorStop(1,'rgba(255,255,255,0.9)');
    ctx.save();ctx.strokeStyle=bGrad;ctx.lineWidth=7;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(incX0,incY0);ctx.lineTo(filmX-filmW/2,incY);ctx.stroke();
    ctx.restore();
    optLabel(ctx,'אור לבן',incX0-8,incY0-12,'#e2e8f0',9);
    // === REFLECTED BEAM (current t) ===
    var rgb0=reflRGB(t0,n);
    var rCol='rgb('+rgb0[0]+','+rgb0[1]+','+rgb0[2]+')';
    var pulse=0.75+0.25*Math.sin(animT*2.8);
    ctx.save();optGlow(ctx,rCol,14*pulse);ctx.strokeStyle=rCol;ctx.lineWidth=6;ctx.lineCap='round';
    var refX1=filmX-filmW/2,refY1=incY;
    var refX0=refX1-bLen*Math.cos(incAng),refY0=refY1-bLen*Math.sin(incAng);
    ctx.beginPath();ctx.moveTo(refX1,refY1);ctx.lineTo(refX0,refY0);ctx.stroke();
    optNoGlow(ctx);ctx.restore();
    // Reflected color swatch
    ctx.save();ctx.fillStyle=rCol;ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(refX0-28,refY0-36,56,16,4);ctx.fill();ctx.stroke();ctx.restore();
    optLabel(ctx,'מוחזר',refX0-5,refY0-40,'#e2e8f0',8);
    // === TRANSMITTED BEAM ===
    ctx.save();ctx.strokeStyle='rgba(200,220,240,0.5)';ctx.lineWidth=4;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(filmX+filmW/2,incY);ctx.lineTo(filmX+filmW/2+bLen*Math.cos(incAng),incY);ctx.stroke();
    ctx.restore();
    optLabel(ctx,'מועבר',filmX+filmW/2+bLen*0.5,incY-10,'#64748b',8);
    // === SPECTRUM BAR (right side) ===
    var sX=W*0.62,sY=H*0.08,sW=W*0.33,sH=H*0.1;
    optLabel(ctx,'ספקטרום מוחזר',sX+sW/2,sY-10,'#94a3b8',9);
    for(var xi=0;xi<sW;xi++){
      var wl=380+320*(xi/sW);
      var I=iRefl(wl,t0,n);
      var hex=wavelengthToHex(wl);
      var rr=parseInt(hex.slice(1,3),16),gg=parseInt(hex.slice(3,5),16),bb=parseInt(hex.slice(5,7),16);
      ctx.fillStyle='rgba('+rr+','+gg+','+bb+','+Math.max(0.05,I).toFixed(2)+')';
      ctx.fillRect(sX+xi,sY,1,sH);
    }
    ctx.strokeStyle='#334155';ctx.lineWidth=1;ctx.strokeRect(sX,sY,sW,sH);
    optLabel(ctx,'380',sX,sY+sH+10,'#475569',7);
    optLabel(ctx,'700nm',sX+sW,sY+sH+10,'#475569',7);
    // === INTENSITY GRAPH ===
    var gX=W*0.62,gY=H*0.24,gW=W*0.33,gH=H*0.22;
    ctx.fillStyle='rgba(10,20,38,0.7)';ctx.fillRect(gX,gY,gW,gH);
    ctx.strokeStyle='#1e293b';ctx.lineWidth=1;ctx.strokeRect(gX,gY,gW,gH);
    optLabel(ctx,'I_מוחזר(λ)',gX+gW/2,gY-8,'#94a3b8',8);
    ctx.save();ctx.strokeStyle='rgba(148,210,255,0.9)';ctx.lineWidth=2;
    ctx.beginPath();
    for(var xi2=0;xi2<gW;xi2++){
      var wl2=380+320*(xi2/gW);
      var I2=iRefl(wl2,t0,n);
      var py=gY+gH*(1-I2);
      if(xi2===0)ctx.moveTo(gX+xi2,py);else ctx.lineTo(gX+xi2,py);
    }
    ctx.stroke();ctx.restore();
    // Mark peak wavelengths
    for(var m=0;m<=4;m++){
      var lpeak=4*n*t0/(2*m+1);
      if(lpeak>=385&&lpeak<=695){
        var xi3=(lpeak-380)/320*gW;
        ctx.save();ctx.strokeStyle='rgba(251,191,36,0.7)';ctx.lineWidth=1;ctx.setLineDash([2,3]);
        ctx.beginPath();ctx.moveTo(gX+xi3,gY);ctx.lineTo(gX+xi3,gY+gH);ctx.stroke();ctx.setLineDash([]);ctx.restore();
        optLabel(ctx,Math.round(lpeak)+'nm',gX+xi3,gY+gH+10,'#fbbf24',7);
      }
    }
    // Current t marker on film
    var tFrac=(t0-t0*0.2)/(t0*1.6-t0*0.2);// normalized position
    var markerY=fTop+(fBot-fTop)*Math.min(1,Math.max(0,tFrac));
    ctx.save();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(filmX-filmW/2-8,markerY);ctx.lineTo(filmX+filmW/2+8,markerY);ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='7px Heebo';ctx.textAlign='right';
    ctx.fillText('t='+t0+'nm',filmX-filmW/2-10,markerY+3);ctx.restore();
    // Info box
    // Live condition readout — makes the single phase flip explicit
    optInfoBox(ctx,10,H-86,W-20,[
      't='+t0+'nm,  n='+n.toFixed(2)+',  2nt='+(2*n*t0).toFixed(0)+'nm',
      'היפוך פאזה π במשטח העליון בלבד ⇒ בנייה כאשר 2nt=(m+½)λ',
      'בנייה: λ(m=0)='+(4*n*t0).toFixed(0)+'nm,  λ(m=1)='+(4*n*t0/3).toFixed(0)+'nm',
      'הרס (λ מוחזר חלש): λ='+(2*n*t0).toFixed(0)+'nm,  '+(n*t0).toFixed(0)+'nm']);
    requestAnimationFrame(draw);
  }
  function poll(){if(_simStop[id])return;requestAnimationFrame(draw);}poll();
}

// ─────────────────────────────────────────────────────────────
// DIFFRACTION GRATING sim
// ─────────────────────────────────────────────────────────────
function simOptGrating(canvas,id){
  var _g=(_simGen[id]=(_simGen[id]||0)+1);
  var R=setupCanvas(canvas,480);var ctx=R.ctx,W=R.W,H=R.H;
  var animT=0,last=null;
  function getD(){var e=document.getElementById('inp-gr-d');return e?parseFloat(e.value)*1000:1500;}// μm→nm
  function getLam(){var e=document.getElementById('inp-gr-lambda');return e?parseFloat(e.value):550;}
  var whiteMode=false;
  var wBtn=document.getElementById('btn-gr-white');
  if(wBtn)wBtn.addEventListener('click',function(){whiteMode=!whiteMode;wBtn.textContent=whiteMode?'🔦 אור חד-גוני':'🌈 אור לבן';});
  function draw(ts){
    if(_simGen[id]!==_g)return;if(_simStop[id])return;
    var dt=last?Math.min((ts-last)/1000,0.05):0.016;last=ts;animT+=dt;
    var dNm=getD(),lambda=getLam();
    ctx.fillStyle='#080e1a';ctx.fillRect(0,0,W,H);
    var ax=H/2;
    var grX=W*0.28,scrX=W*0.85;
    var scrH=H*0.85,scrTop=(H-scrH)/2;
    // === GRATING (vertical lines) ===
    ctx.save();ctx.strokeStyle='#475569';ctx.lineWidth=1;
    for(var i=0;i<8;i++){
      var lx=grX-6+i*3;
      ctx.beginPath();ctx.moveTo(lx,H*0.1);ctx.lineTo(lx,H*0.9);ctx.stroke();
    }
    ctx.strokeStyle='#64748b';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(grX,H*0.08);ctx.lineTo(grX,H*0.92);ctx.stroke();
    ctx.restore();
    optLabel(ctx,'סריג',grX,H*0.08-8,'#94a3b8',9);
    optLabel(ctx,'d='+( dNm/1000).toFixed(2)+'μm',grX,H*0.92+14,'#64748b',8);
    // === INCIDENT BEAM ===
    ctx.save();var lHex=wavelengthToHex(lambda);
    optGlow(ctx,lHex,8);ctx.strokeStyle=lHex;ctx.lineWidth=4;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(W*0.05,ax);ctx.lineTo(grX,ax);ctx.stroke();
    optNoGlow(ctx);ctx.restore();
    optLabel(ctx,'λ='+lambda+'nm',W*0.15,ax-12,lHex,9);
    // === SCREEN ===
    ctx.save();ctx.fillStyle='rgba(30,41,59,0.8)';ctx.fillRect(scrX,scrTop,10,scrH);
    ctx.strokeStyle='#334155';ctx.lineWidth=1;ctx.strokeRect(scrX,scrTop,10,scrH);ctx.restore();
    optLabel(ctx,'מסך',scrX+5,scrTop-8,'#64748b',8);
    // === DIFFRACTED ORDERS ===
    var orders=[-2,-1,0,1,2];
    var lRGB=wavelengthToRGB(lambda).match(/\d+/g);
    if(whiteMode){
      // Spectroscopy: white light — every order m≠0 disperses into a full spectrum
      orders.forEach(function(m){
        if(m===0)return;
        for(var wl2=410;wl2<=690;wl2+=20){
          var sinT2=m*wl2/dNm;
          if(Math.abs(sinT2)>0.96)continue;
          var th2b=Math.asin(sinT2);
          var hitY2=ax+(scrX-grX)*Math.tan(th2b);
          if(hitY2<scrTop||hitY2>scrTop+scrH)continue;
          ctx.save();ctx.strokeStyle=wavelengthToHex(wl2);ctx.globalAlpha=0.5;ctx.lineWidth=1.6;
          ctx.beginPath();ctx.moveTo(grX,ax);ctx.lineTo(scrX,hitY2);ctx.stroke();
          ctx.globalAlpha=0.95;ctx.fillStyle=wavelengthToHex(wl2);
          ctx.fillRect(scrX,hitY2-2,9,4);
          ctx.restore();
        }
        var sinL=m*545/dNm;
        if(Math.abs(sinL)<=0.95){
          optLabel(ctx,'m='+m,scrX+24,ax+(scrX-grX)*Math.tan(Math.asin(sinL)),'#e2e8f0',8);
        }
      });
      // central order stays white — all wavelengths overlap at θ=0
      ctx.save();ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.lineWidth=3;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(grX,ax);ctx.lineTo(scrX,ax);ctx.stroke();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(scrX+2,ax,5,0,Math.PI*2);ctx.fill();ctx.restore();
      optLabel(ctx,'m=0 (לבן)',scrX+32,ax,'#e2e8f0',8);
    } else
    orders.forEach(function(m){
      var sinTh=m*lambda/dNm;
      if(Math.abs(sinTh)>0.96)return;// beyond 90°, not observable
      var th=Math.asin(sinTh);
      // Direction from grating center
      var dx=scrX-grX,dy=dx*Math.tan(th);
      var hitY=ax+dy;
      if(hitY<scrTop||hitY>scrTop+scrH)return;
      // Draw the beam
      var alpha=m===0?0.9:0.8;
      ctx.save();
      if(m!==0){optGlow(ctx,'rgb('+lRGB[0]+','+lRGB[1]+','+lRGB[2]+')',m===0?4:8);}
      ctx.strokeStyle=m===0?'rgba(255,255,255,0.85)':'rgba('+lRGB[0]+','+lRGB[1]+','+lRGB[2]+','+alpha+')';
      ctx.lineWidth=m===0?3:2.5;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(grX,ax);ctx.lineTo(scrX,hitY);ctx.stroke();
      if(m!==0)optNoGlow(ctx);
      ctx.restore();
      // Angle label near grating
      var labelX=grX+50,labelY=ax+Math.tan(th)*50;
      optLabel(ctx,'m='+m,(m===0?grX+65:labelX),labelY+(m>=0?-10:10),(m===0?'#e2e8f0':'rgb('+lRGB[0]+','+lRGB[1]+','+lRGB[2]+')'),8);
      // Bright dot on screen + intensity bar
      var intensity=m===0?0.9:0.7;
      ctx.save();optGlow(ctx,m===0?'#fff':'rgb('+lRGB[0]+','+lRGB[1]+','+lRGB[2]+')',10*intensity);
      ctx.fillStyle=m===0?'rgba(255,255,255,0.95)':'rgba('+lRGB[0]+','+lRGB[1]+','+lRGB[2]+',0.95)';
      ctx.beginPath();ctx.arc(scrX+2,hitY,5,0,Math.PI*2);ctx.fill();
      optNoGlow(ctx);ctx.restore();
      // Angle readout on right side of screen
      if(m!==0){
        ctx.fillStyle='rgba('+lRGB[0]+','+lRGB[1]+','+lRGB[2]+',0.8)';
        ctx.font='8px Heebo';ctx.textAlign='left';
        ctx.fillText('m='+m+': θ='+(th*180/Math.PI).toFixed(1)+'°',scrX+16,hitY+3);
      }
    });
    // === ANGLE ARC at grating ===
    var sinTh1=lambda/dNm;
    if(Math.abs(sinTh1)<=1){
      var th1=Math.asin(sinTh1);
      optAngleArc(ctx,grX,ax,40,0,-th1,'#fbbf24',0.6);
      optLabel(ctx,'θ₁='+(th1*180/Math.PI).toFixed(1)+'°',grX+55,ax-th1/2*100,'#fbbf24',8);
    }
    // === d·sinθ=mλ formula display ===
    ctx.save();ctx.fillStyle='rgba(10,18,32,0.9)';ctx.strokeStyle='#1e293b';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(10,10,W*0.55,32,6);ctx.fill();ctx.stroke();
    ctx.fillStyle='#94a3b8';ctx.font='11px Heebo';ctx.textAlign='center';
    ctx.fillText('d·sinθ = mλ   →   sinθ₁ = λ/d = '+lambda+'/'+dNm.toFixed(0)+'nm = '+(lambda/dNm).toFixed(3),W*0.28,30);
    ctx.restore();
    optInfoBox(ctx,10,H-70,W-20,['d='+( dNm/1000).toFixed(2)+'μm, λ='+lambda+'nm','m=±1: θ='+(Math.abs(sinTh1)<=1?(Math.asin(sinTh1)*180/Math.PI).toFixed(1)+'°':'לא קיים'),'m=±2: sinθ='+(2*lambda/dNm).toFixed(3)+(2*lambda/dNm<=1?' (קיים)':' (מעל 90° — לא קיים)'),'אדום נסטה יותר מכחול — הפוך מפריזמה']);
    requestAnimationFrame(draw);
  }
  function poll(){if(_simStop[id])return;requestAnimationFrame(draw);}poll();
}

// ─── shared helpers ───────────────────────────
function arrow(ctx,x1,y1,x2,y2,col,lw,hw){
  if(lw===undefined)lw=2; if(hw===undefined)hw=10;
  ctx.save();ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=lw;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  const ang=Math.atan2(y2-y1,x2-x1);
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-Math.cos(ang-0.38)*hw,y2-Math.sin(ang-0.38)*hw);
  ctx.lineTo(x2-Math.cos(ang+0.38)*hw,y2-Math.sin(ang+0.38)*hw);
  ctx.closePath();ctx.fill();ctx.restore();
}
function bg(ctx,W,H){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#080e1a');g.addColorStop(1,'#030c15');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // subtle grid
  ctx.save();ctx.strokeStyle='rgba(30,58,92,.18)';ctx.lineWidth=0.5;
  var gs=28;
  for(var xi=0;xi<W;xi+=gs){ctx.beginPath();ctx.moveTo(xi,0);ctx.lineTo(xi,H);ctx.stroke();}
  for(var yi=0;yi<H;yi+=gs){ctx.beginPath();ctx.moveTo(0,yi);ctx.lineTo(W,yi);ctx.stroke();}
  ctx.restore();
}
function label(ctx,txt,x,y,col,sz,align){
  if(col===undefined)col='#64748b'; if(sz===undefined)sz=11; if(align===undefined)align='center';
  ctx.save();ctx.fillStyle=col;ctx.font=`${sz}px Heebo`;ctx.textAlign=align;ctx.fillText(txt,x,y);ctx.restore();
}
function circle(ctx,x,y,r,fill,stroke,lw){
  if(stroke===undefined)stroke=''; if(lw===undefined)lw=2;
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}
}
function drawAxis(ctx,ax1,ay,ax2,ticks,W,unit){
  if(unit===undefined)unit='m';
  ctx.save();
  // axis line + arrow
  ctx.strokeStyle='#1e3a52';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(ax1,ay);ctx.lineTo(ax2,ay);ctx.stroke();
  arrow(ctx,ax2-18,ay,ax2+2,ay,'#2d5275',1.5,8);
  // ticks + labels
  ctx.fillStyle='#3d6480';ctx.font='11px Heebo';ctx.textAlign='center';
  ticks.forEach(({v,px})=>{
    ctx.beginPath();ctx.strokeStyle='#1e3a52';ctx.lineWidth=1;
    ctx.moveTo(px,ay-5);ctx.lineTo(px,ay+5);ctx.stroke();
    ctx.fillText(v,px,ay+16);
  });
  ctx.fillStyle='#4a7595';ctx.font='12px Heebo';ctx.textAlign='left';
  ctx.fillText(`x (${unit})`,ax2+8,ay+4);
  ctx.restore();
}
function initTheoryAnims(){
  // Cancel any leftover animation loops from previous section
  Object.keys(_anim).forEach(function(id){
    if(_anim[id]&&_anim[id].raf) cancelAnimationFrame(_anim[id].raf);
    delete _anim[id];
  });

// CH1 ANIM 4: מהירות ממוצעת ורגעית
runAnim('anim-avgv',(canvas,ctx,W,H,t)=>{
  bg(ctx,W,H);
  const GL=48,GR=W-14,GT=10,GB=H-26;
  const TMax=4.5, A=1.3;
  const xAt=tv=>A*tv*tv, vInstAt=tv=>2*A*tv;
  const toGx=tv=>GL+(tv/TMax)*(GR-GL);
  const toGy=xv=>GB-(xv/xAt(TMax))*(GB-GT)*0.88;
  // Graph bg
  ctx.save();
  const gbg=ctx.createLinearGradient(GL,GT,GL,GB);
  gbg.addColorStop(0,'rgba(12,26,50,.75)'); gbg.addColorStop(1,'rgba(6,14,28,.9)');
  ctx.fillStyle=gbg; ctx.fillRect(GL,GT,GR-GL,GB-GT); ctx.restore();
  // Grid
  for(let tv=0;tv<=TMax;tv++){const px=toGx(tv);ctx.save();ctx.strokeStyle='#0c1c30';ctx.lineWidth=0.5;ctx.setLineDash([2,8]);ctx.beginPath();ctx.moveTo(px,GT);ctx.lineTo(px,GB);ctx.stroke();ctx.setLineDash([]);ctx.restore();}
  for(let xv=0;xv<=Math.floor(xAt(TMax));xv+=3){const py=toGy(xv);if(py<GT||py>GB)continue;ctx.save();ctx.strokeStyle='#0c1c30';ctx.lineWidth=0.5;ctx.setLineDash([2,8]);ctx.beginPath();ctx.moveTo(GL,py);ctx.lineTo(GR,py);ctx.stroke();ctx.setLineDash([]);ctx.restore();label(ctx,xv,GL-5,py+3,'#2d5060',7,'right');}
  // Axes
  ctx.save(); ctx.strokeStyle='#2d5275'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(GL,GT); ctx.lineTo(GL,GB); ctx.lineTo(GR,GB); ctx.stroke(); ctx.restore();
  arrow(ctx,GL,GT+1,GL,GT-1,'#2d5275',1.5,6); arrow(ctx,GR-1,GB,GR+1,GB,'#2d5275',1.5,6);
  for(let tv=0;tv<=TMax;tv++){const px=toGx(tv);ctx.save();ctx.strokeStyle='#3d6480';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(px,GB-5);ctx.lineTo(px,GB+5);ctx.stroke();ctx.restore();label(ctx,tv,px,GB+14,'#4a7595',8);}
  ctx.save(); ctx.strokeStyle='#1a3a5c'; ctx.lineWidth=1.5; ctx.strokeRect(GL,GT,GR-GL,GB-GT); ctx.restore();
  label(ctx,'t (s) →',GR+2,GB+4,'#4a7595',7,'left'); label(ctx,'x='+A+'t²',GL+36,GT+11,'#818cf8',8,'center');
  label(ctx,'x (m) ↑',GL-2,GT+8,'#4a7595',7,'right');
  // Parabola
  ctx.save(); ctx.fillStyle='rgba(99,102,241,.06)'; ctx.beginPath(); ctx.moveTo(toGx(0),GB);
  for(let i=0;i<=300;i++){const tv=i/300*TMax;const py=toGy(xAt(tv));if(py<GT||py>GB)continue;ctx.lineTo(toGx(tv),py);}
  ctx.lineTo(GR,GB); ctx.closePath(); ctx.fill(); ctx.restore();
  ctx.save(); ctx.strokeStyle='#4f46e5'; ctx.lineWidth=3; ctx.lineJoin='round'; ctx.beginPath();
  let started=false;
  for(let i=0;i<=400;i++){const tv=i/400*TMax;const py=toGy(xAt(tv));if(py<GT||py>GB){started=false;continue;}started?ctx.lineTo(toGx(tv),py):ctx.moveTo(toGx(tv),py);started=true;}
  ctx.stroke(); ctx.restore();
  // Animated Δt
  const t0=1.5+0.7*Math.sin(t*0.28);
  const cycle=t%7; const dt=cycle<5?2*Math.pow(0.02,cycle/5):0.018;
  const t1=Math.min(TMax-0.01,t0+dt);
  const x0v=xAt(t0),x1v=xAt(t1);
  const vavg=(x1v-x0v)/Math.max(dt,0.0001), vinst=vInstAt(t0);
  const converged=(dt<0.07);
  ctx.save(); ctx.fillStyle='rgba(251,191,36,.07)'; ctx.fillRect(toGx(t0),GT,Math.max(toGx(t1)-toGx(t0),2),GB-GT); ctx.restore();
  // Bracket
  ctx.save(); ctx.strokeStyle='#fbbf24'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(toGx(t0),GB+3); ctx.lineTo(toGx(t1),GB+3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(toGx(t0),GB+1); ctx.lineTo(toGx(t0),GB+7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(toGx(t1),GB+1); ctx.lineTo(toGx(t1),GB+7); ctx.stroke(); ctx.restore();
  label(ctx,'Δt='+dt.toFixed(4)+'s',(toGx(t0)+toGx(t1))/2,GB+18,'#fbbf24',7,'center');
  const p0={px:toGx(t0),py:toGy(x0v)}, p1={px:toGx(t1),py:toGy(x1v)};
  const sdx=p1.px-p0.px,sdy=p1.py-p0.py,sLen=Math.hypot(sdx,sdy)||1,ext=44;
  ctx.save(); ctx.strokeStyle=converged?'rgba(245,158,11,.3)':'#f59e0b'; ctx.lineWidth=converged?1.5:2.5; ctx.setLineDash([6,4]);
  ctx.beginPath(); ctx.moveTo(p0.px-sdx/sLen*ext,p0.py-sdy/sLen*ext); ctx.lineTo(p1.px+sdx/sLen*ext,p1.py+sdy/sLen*ext); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
  const tScl=(GR-GL)/TMax, yScl=-(GB-GT)*0.88/xAt(TMax);
  const tAng=Math.atan2(vinst*yScl,tScl), tExt=54;
  ctx.save(); ctx.strokeStyle='#34d399'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(p0.px-Math.cos(tAng)*tExt,p0.py-Math.sin(tAng)*tExt); ctx.lineTo(p0.px+Math.cos(tAng)*tExt,p0.py+Math.sin(tAng)*tExt); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.shadowColor='#34d399'; ctx.shadowBlur=8; circle(ctx,p0.px,p0.py,6,'#34d399','#a7f3d0',1.5); ctx.restore();
  if(dt>0.1){ctx.save(); ctx.shadowColor='#f59e0b'; ctx.shadowBlur=6; circle(ctx,p1.px,p1.py,6,'#f59e0b','#fde68a',1.5); ctx.restore();}
  // Info panel
  ctx.save(); ctx.fillStyle='rgba(6,14,28,.92)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(GL+2,GT+1,218,converged?66:50,5); ctx.fill(); ctx.stroke(); ctx.restore();
  label(ctx,'v_avg='+vavg.toFixed(3)+' m/s (צהוב)',GL+111,GT+13,'#fbbf24',8,'center');
  label(ctx,'v_inst='+vinst.toFixed(3)+' m/s (ירוק)',GL+111,GT+26,'#34d399',8,'center');
  label(ctx,'|Δv|='+Math.abs(vavg-vinst).toFixed(4),GL+111,GT+38,'#94a3b8',7,'center');
  if(converged){ctx.save();ctx.fillStyle='rgba(52,211,153,.12)';ctx.strokeStyle='#34d399';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(GL+2,GT+44,218,20,4);ctx.fill();ctx.stroke();ctx.restore();label(ctx,'Δt→0 : v_avg→v_inst (הנגזרת!)',GL+111,GT+56,'#34d399',8,'center');}
  label(ctx,'Δt מתכווץ אוט׳ | P0 (ירוק) | P1 (צהוב)',W/2,H-5,'#334e68',7,'center');
});

// CH1 ANIM 5: תאוצה
runAnim('anim-accel',(canvas,ctx,W,H,t)=>{
  bg(ctx,W,H);
  const a=4, v0a=0, PERIOD=4;
  const tt=t%PERIOD;
  const xv=v0a*tt+0.5*a*tt*tt, vv=v0a+a*tt;
  const XMAX=0.5*a*PERIOD*PERIOD;

runAnim('anim-fall',(canvas,ctx,W,H,t)=>{

  const tt=t%PERIOD, phase=Math.min(tt,Ttotal);
  const yM=Math.max(0,v0f*phase-0.5*g*phase*phase);
  const hMax=v0f*v0f/(2*g);
  const groundY=H-18, ceilY=24;
  const toY=ym=>groundY-(ym/hMax)*(groundY-ceilY)*0.9;
  // Ground
  ctx.save(); ctx.strokeStyle='#2d5275'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(12,groundY); ctx.lineTo(W-12,groundY); ctx.stroke();
  for(let i=0;i<W-16;i+=16){ctx.strokeStyle='#0d1e30';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(12+i,groundY);ctx.lineTo(12+i+10,groundY+7);ctx.stroke();}
  ctx.restore();
  // h_max dashed
  ctx.save(); ctx.strokeStyle='rgba(52,211,153,.4)'; ctx.lineWidth=1.2; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(28,toY(hMax)); ctx.lineTo(W-28,toY(hMax)); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
  label(ctx,'h_max='+hMax.toFixed(1)+'m',W-32,toY(hMax)-5,'#34d399',8,'right');
  // y axis
  ctx.save(); ctx.strokeStyle='#2d5275'; ctx.lineWidth=1.5;

  const balls=[
    {col:'#3b82f6',bx:Math.floor(W*0.28),r:8,lbl:'0.05kg'},

    {col:'#ef4444',bx:Math.floor(W*0.76),r:14,lbl:'20kg'},

  const vy=v0f-g*phase;
  balls.forEach(b=>{
    const by=toY(yM);

    for(let i=1;i<10;i++){const tp=Math.max(0,phase-i*0.07);const yg=Math.max(0,v0f*tp-0.5*g*tp*tp);const gpy=toY(yg);if(gpy<ceilY)continue;ctx.save();ctx.globalAlpha=(10-i)/14;circle(ctx,b.bx,gpy,b.r,'rgba(255,255,255,.05)');ctx.restore();}
    ctx.save(); ctx.shadowColor=b.col; ctx.shadowBlur=8;

    if(Math.abs(vy)>0.8){const arLen=Math.min(Math.abs(vy)*2.5,28);const yd=vy>0?-arLen:arLen;arrow(ctx,b.bx,by+(vy>0?-b.r-1:b.r+1),b.bx,by+(vy>0?-b.r-1:b.r+1)+yd,vy>0?'#34d399':'#f87171',1.8,6);}
  });
  if(Math.abs(vy)<1.6){label(ctx,'v=0 שיא! כל המסות יחד',W/2,toY(hMax)+14,'#fbbf24',10);}

  ctx.save(); ctx.fillStyle='rgba(8,18,36,.82)'; ctx.fillRect(0,0,W,18); ctx.restore();
  const rising=phase<Tpeak;
  label(ctx,'t='+phase.toFixed(2)+'s y='+yM.toFixed(1)+'m v='+vy.toFixed(1)+'m/s ('+(rising?'↑':'↓')+')',W/2,12,'#94a3b8',8);

runAnim('anim-inertia',(canvas,ctx,W,H,t)=>{
  bg(ctx,W,H);
  const FLY=H-18;
  // Three states cycling: moving constant, then gets push, constant again
  const PERIOD=8, tt=t%PERIOD;
  const v0=45;
  let bx, phase;
  if(tt<3.5){ bx=(tt*v0)%(W+80)-40; phase=0; }
  else if(tt<4.5){ bx=(3.5*v0)%(W+80)-40+(tt-3.5)*v0*0.5; phase=1; }
  else { bx=(3.5*v0)%(W+80)-40+(1*v0*0.5)+(tt-4.5)*v0; phase=2; }
  // wrap
  if(bx>W+40)bx-=(W+80);

  ctx.save(); ctx.strokeStyle='#2d5275'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(0,FLY); ctx.lineTo(W,FLY); ctx.stroke(); ctx.restore();
  // Frictionless surface markers
  ctx.save(); ctx.strokeStyle='rgba(52,211,153,.15)'; ctx.lineWidth=1;
  for(let x=0;x<W;x+=24){ ctx.beginPath(); ctx.moveTo(x,FLY); ctx.lineTo(x+15,FLY+8); ctx.stroke(); }
  ctx.restore();
  label(ctx,'משטח חלק — ללא חיכוך',W/2,FLY+11,'#1a3a52',8);

  // Ghost trail
  const ghostXs=[bx-22,bx-44,bx-66,bx-88];
  ghostXs.forEach((gx,i)=>{
    ctx.save(); ctx.globalAlpha=0.06+i*0.02;
    ctx.fillStyle='#3b82f6'; ctx.beginPath(); ctx.roundRect(gx-15,FLY-30,30,30,3); ctx.fill(); ctx.restore();
  });

  // Box
  ctx.save(); ctx.shadowColor='rgba(59,130,246,.5)'; ctx.shadowBlur=10;
  ctx.fillStyle='rgba(37,99,235,.8)'; ctx.strokeStyle='#60a5fa'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(bx-18,FLY-32,36,32,4); ctx.fill(); ctx.stroke(); ctx.restore();

  // Velocity arrow
  const cv=phase===1?v0*0.5:v0;
  arrow(ctx,bx,FLY-38,bx+Math.min(cv*0.7,55),FLY-38,'#34d399',2.5,9);
  label(ctx,'v='+cv.toFixed(0)+' (קבועה)',bx+Math.min(cv*0.35,28),FLY-48,'#34d399',8);

  // No force label
  ctx.save(); ctx.fillStyle='rgba(6,14,28,.8)'; ctx.strokeStyle='rgba(52,211,153,.4)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(W/2-110,4,220,18,4); ctx.fill(); ctx.stroke(); ctx.restore();
  label(ctx,'ΣF = 0 → v = קבועה (חוק ראשון ✓)',W/2,14,'#34d399',8.5);
  label(ctx,'גוף שאין עליו כוח נשאר בתנועה אחידה',W/2,H-5,'#334e68',7.5);
});

runAnim('anim-n2',(canvas,ctx,W,H,t)=>{
  bg(ctx,W,H);
  // Three blocks same mass m=4kg, three different forces → a∝F
  var g=9.8, m=4;
  var configs=[
    {F:8,  col:'#3b82f6', label:'F=8N → a=2 m/s²'},
    {F:16, col:'#f59e0b', label:'F=16N → a=4 m/s²'},
    {F:32, col:'#ef4444', label:'F=32N → a=8 m/s²'},
  ];
  var rowH=H/3;
  var CYCLE=3.5; // seconds per cycle
  var tc=t%CYCLE;

  configs.forEach(function(c,i){
    var a=c.F/m;
    var rowY=(i+0.5)*rowH;
    var bH=18, bW=24;
    // Ground line for each row
    ctx.save();ctx.strokeStyle='rgba(30,58,82,.5)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(6,rowY+bH/2+2);ctx.lineTo(W-6,rowY+bH/2+2);ctx.stroke();ctx.restore();

    // Block position: starts left, accelerates right, wraps smoothly
    var xMax=W-bW/2-8;
    var xStart=bW/2+8;
    var dist=0.5*a*tc*tc*3.2;  // px displacement (3.2 = visual scale)
    var bx=xStart+dist%(xMax-xStart);
    if(bx>xMax) bx=xMax;

    // Block
    ctx.save();ctx.fillStyle=c.col+'44';ctx.strokeStyle=c.col;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.roundRect(bx-bW/2,rowY-bH/2,bW,bH,3);ctx.fill();ctx.stroke();ctx.restore();

    // Force arrow pushing block from LEFT → RIGHT (F is rightward)
    var arLen=Math.min(c.F*1.2,60);
    arrow(ctx,bx-bW/2-arLen,rowY,bx-bW/2-2,rowY,c.col,2.5,8);

    // Acceleration arrow above block (rightward, proportional)
    var accLen=Math.min(a*6,50);
    arrow(ctx,bx,rowY-bH/2-12,bx+accLen,rowY-bH/2-12,'#22d3ee',2,7);

    // Labels
    label(ctx,'F='+c.F+'N',bx-bW/2-arLen/2,rowY-9,c.col,7.5,'center');
    label(ctx,'a='+a.toFixed(0)+'m/s²',bx+accLen/2,rowY-bH/2-22,'#22d3ee',7.5,'center');
    label(ctx,'m='+m+'kg',bx,rowY+4,'#fff',7,'center');
  });

  // Header
  ctx.save();ctx.fillStyle='rgba(6,14,28,.85)';ctx.strokeStyle='rgba(251,191,36,.3)';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(6,2,W-12,14,3);ctx.fill();ctx.stroke();ctx.restore();
  label(ctx,'F = ma — מסה קבועה: F×2 → a×2',W/2,11,'#fbbf24',7.5,'center');
});

runAnim('anim-force-intro',(canvas,ctx,W,H,t)=>{
  bg(ctx,W,H);
  const PERIOD=5, tt=t%PERIOD;
  const phase=tt/PERIOD;
  // 3 phases: rest(0-0.15), push(0.15-0.7), slide(0.7-1.0)
  const m=4, F=28, mu=0.15, g=9.8;
  const a_push=F/m - mu*g;
  const t_push=(PERIOD*0.55);
  const v_end=a_push*t_push;
  const x_push=0.5*a_push*t_push*t_push;

  let bx, bv, inPush=false, inSlide=false;
  const scl=0.55;
  if(tt<PERIOD*0.15){ bx=W*0.18; bv=0; }
  else if(tt<PERIOD*0.7){
    const tp=tt-PERIOD*0.15; inPush=true;
    bx=W*0.18+0.5*a_push*tp*tp*scl;
    bv=a_push*tp;
  } else {
    const ts2=tt-PERIOD*0.7; inSlide=true;
    const a_slide=-mu*g;
    bx=W*0.18+x_push*scl+v_end*ts2*scl+0.5*a_slide*ts2*ts2*scl;
    bv=Math.max(0,v_end+a_slide*ts2);
  }
  bx=Math.min(W-38,Math.max(28,bx));

  const FLY=H-20;
  // Floor
  ctx.save(); ctx.strokeStyle='#2d5275'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(18,FLY); ctx.lineTo(W-18,FLY); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.strokeStyle='rgba(30,58,82,.5)'; ctx.lineWidth=0.8;
  for(let x=18;x<W-18;x+=16){ ctx.beginPath(); ctx.moveTo(x,FLY); ctx.lineTo(x+10,FLY+8); ctx.stroke(); }
  ctx.restore();

  // Box
  const bS=32;
  ctx.save(); ctx.shadowColor='rgba(59,130,246,.5)'; ctx.shadowBlur=10;
  ctx.fillStyle='rgba(37,99,235,.8)'; ctx.strokeStyle='#60a5fa'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(bx-bS/2,FLY-bS,bS,bS,4); ctx.fill(); ctx.stroke(); ctx.restore();
  label(ctx,m+'kg',bx,FLY-bS/2+4,'#bfdbfe',9);

  // Force arrow
  if(inPush){
    arrow(ctx,bx-bS/2-8-F*1.4,FLY-bS/2,bx-bS/2-8,FLY-bS/2,'#f59e0b',3,11);
    label(ctx,'F='+F+'N',bx-bS/2-F*0.7-8,FLY-bS/2-13,'#fbbf24',9);
  }
  // Friction
  if((inPush||inSlide)&&bv>0.1){
    const fLen=mu*g*m*1.1;
    arrow(ctx,bx+bS/2+3+fLen,FLY-bS*0.3,bx+bS/2+3,FLY-bS*0.3,'#a78bfa',2.5,9);
    label(ctx,'f',bx+bS/2+fLen+10,FLY-bS*0.3,'#c4b5fd',9,'left');
  }
  // Velocity arrow
  if(bv>0.2){
    const vLen=Math.min(bv*11,52);
    arrow(ctx,bx,FLY-bS-10,bx+vLen,FLY-bS-10,'#34d399',2.5,9);
    label(ctx,'v='+bv.toFixed(1),bx+vLen+4,FLY-bS-10,'#34d399',8,'left');
  }

  // Phase label
  const phaseText=inPush?'כוח פועל → תאוצה':inSlide&&bv>0.1?'כוח הוסר → חיכוך מאט':bv<0.1&&(inSlide||tt>PERIOD*0.7)?'v=0, ΣF=0 → מנוחה':'ΣF=0 → מנוחה (חוק ראשון)';
  const phaseCol=inPush?'#f59e0b':inSlide&&bv>0.1?'#a78bfa':'#34d399';
  ctx.save(); ctx.fillStyle='rgba(6,14,28,.85)'; ctx.strokeStyle=phaseCol+'66'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(W/2-140,4,280,18,4); ctx.fill(); ctx.stroke(); ctx.restore();
  label(ctx,phaseText,W/2,14,phaseCol,8.5);

  // Formula
  label(ctx,'a = F/m = '+F+'/'+m+' = '+(F/m).toFixed(1)+' m/s²  |  ΣF=ma',W/2,H-6,'#334e68',8);
});

// CH2 ANIM: חוק ניוטון הראשון — אינרציה (block, no friction)

runAnim('anim-n2apps',(canvas,ctx,W,H,t)=>{
  bg(ctx,W,H);
  // Alternating scenes: incline (0) and Atwood (1), 5s each
  var CYCLE=5.0, tt=t%(CYCLE*2);
  var scene=tt<CYCLE?0:1;
  var st=scene===0?tt:tt-CYCLE;

  // Scene label
  var sceneName=scene===0?'גוף על מדרון — a = g·sinθ':'מכונת אטווד — a = (m₁−m₂)g/(m₁+m₂)';
  ctx.save();ctx.fillStyle='rgba(6,14,28,.9)';ctx.strokeStyle='rgba(96,165,250,.35)';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(6,3,W-12,16,3);ctx.fill();ctx.stroke();ctx.restore();
  label(ctx,sceneName,W/2,12,'#94a3b8',7.5,'center');

  if(scene===0){
    // ── INCLINE SCENE
    var ang=30*Math.PI/180, g=9.8, m=3;
    var cosA=Math.cos(ang), sinA=Math.sin(ang);
    var a_inc=g*sinA;
    var ORIG_X=14, ORIG_Y=H-14;
    var incLen=W*0.88;
    var topX=ORIG_X+incLen*cosA, topY=ORIG_Y-incLen*sinA;

    // Incline
    var incG=ctx.createLinearGradient(ORIG_X,ORIG_Y,topX,topY);
    incG.addColorStop(0,'rgba(10,28,58,.95)');incG.addColorStop(1,'rgba(20,50,90,.7)');
    ctx.save();ctx.fillStyle=incG;ctx.strokeStyle='#2d5275';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(ORIG_X,ORIG_Y);ctx.lineTo(topX,topY);ctx.lineTo(topX,ORIG_Y);ctx.closePath();
    ctx.fill();ctx.stroke();ctx.restore();

    // Ground
    ctx.save();ctx.strokeStyle='#1e4060';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(6,ORIG_Y);ctx.lineTo(W-6,ORIG_Y);ctx.stroke();ctx.restore();

    // Angle arc
    ctx.save();ctx.strokeStyle='#f59e0b';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(ORIG_X,ORIG_Y,36,-ang,0,true);ctx.stroke();ctx.restore();
    label(ctx,'30°',ORIG_X+44,ORIG_Y-14,'#fbbf24',8.5);

    // Block position along incline — slides down with a_inc, resets
    var tFall=st%(2.8);  // cycle every 2.8s
    var sDist=Math.min(0.5*a_inc*tFall*tFall, incLen*0.72);
    var bS=22;
    var bDist=incLen*0.88-sDist-bS/2;
    var bCX=ORIG_X+Math.max(bS/2,bDist)*cosA;
    var bCY=ORIG_Y-Math.max(bS/2,bDist)*sinA;

    // Block (rotated)
    ctx.save();ctx.translate(bCX,bCY);ctx.rotate(-ang);
    ctx.fillStyle='rgba(37,99,235,.88)';ctx.strokeStyle='#60a5fa';ctx.lineWidth=1.8;
    ctx.beginPath();ctx.roundRect(-bS/2,-bS/2,bS,bS,3);ctx.fill();ctx.stroke();
    ctx.fillStyle='#bfdbfe';ctx.font='bold 7px Heebo,sans-serif';ctx.textAlign='center';
    ctx.fillText(m+'kg',0,3);ctx.restore();

    // FBD arrows from block center
    var FSCALE=0.8;
    var N_mag=m*g*cosA, W_mag=m*g, Wp_mag=m*g*sinA;
    // W (down)
    arrow(ctx,bCX,bCY,bCX,bCY+W_mag*FSCALE,'#ef4444',2,8);
    label(ctx,'W='+(W_mag).toFixed(0)+'N',bCX+5,bCY+W_mag*FSCALE*0.5,'#fca5a5',7,'left');
    // N (perpendicular to slope)
    var nEX=bCX-sinA*N_mag*FSCALE, nEY=bCY-cosA*N_mag*FSCALE;
    arrow(ctx,bCX,bCY,nEX,nEY,'#34d399',2,8);
    label(ctx,'N',nEX-5,nEY-6,'#34d399',7.5,'right');
    // Acceleration arrow (down-slope)
    var accPx=a_inc*FSCALE*1.8;
    arrow(ctx,bCX,bCY,bCX+cosA*accPx,bCY-sinA*accPx,'#fbbf24',2.5,9);

    // Info
    var velNow=a_inc*Math.min(tFall,2.8);
    var panX=topX+6, panW=W-panX-4;
    if(panW>70){
      ctx.save();ctx.fillStyle='rgba(6,14,28,.9)';ctx.strokeStyle='#1e3a52';ctx.lineWidth=1;
      ctx.beginPath();ctx.roundRect(panX,20,panW,90,4);ctx.fill();ctx.stroke();ctx.restore();
      label(ctx,'a=g·sin30°',panX+panW/2,34,'#94a3b8',7.5,'center');
      label(ctx,a_inc.toFixed(2)+' m/s²',panX+panW/2,48,'#22d3ee',9.5,'center');
      label(ctx,'N=mg·cos30°',panX+panW/2,62,'#94a3b8',7.5,'center');
      label(ctx,N_mag.toFixed(1)+' N',panX+panW/2,76,'#34d399',8.5,'center');
      label(ctx,'v='+velNow.toFixed(2)+' m/s',panX+panW/2,90,'#60a5fa',7.5,'center');
    }

  } else {
    // ── ATWOOD SCENE
    var m1=4, m2=2.5, g=9.8;
    var a_at=(m1-m2)*g/(m1+m2);   // m1 heavier, drops
    var T_at=2*m1*m2*g/(m1+m2);
    var CX=W/2, CEIL_Y=22, PR=13;
    var bW=34, bH=26;
    // Travel range: from just below pulley to near bottom, shared between two masses
    var RopeTop=CEIL_Y+PR+4;
    var RopeBot=H-bH-12;
    var RopeLen=RopeBot-RopeTop;  // total usable rope pixels
    // Both masses start at midpoint, then m1 descends, m2 ascends
    var tFall2=st%(RopeLen/(a_at*22+0.01));  // time to traverse
    var drop=Math.min(0.5*a_at*tFall2*tFall2*22, RopeLen/2);
    var y1=RopeTop+RopeLen/2+drop;   // m1 goes DOWN from mid
    var y2=RopeTop+RopeLen/2-drop;   // m2 goes UP from mid

    // Ceiling fixture
    ctx.save();ctx.fillStyle='rgba(15,40,70,.9)';ctx.fillRect(CX-30,0,60,CEIL_Y);
    for(var xi=CX-28;xi<CX+28;xi+=10){
      ctx.strokeStyle='#2d5275';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(xi,0);ctx.lineTo(xi-6,CEIL_Y);ctx.stroke();
    }
    ctx.restore();

    // Pulley
    ctx.save();ctx.strokeStyle='#60a5fa';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(CX,CEIL_Y+PR,PR,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#1e3a52';ctx.beginPath();ctx.arc(CX,CEIL_Y+PR,PR*0.4,0,Math.PI*2);ctx.fill();ctx.restore();

    // Ropes (from pulley edge to top of each mass)
    var rx1=CX-PR+2, rx2=CX+PR-2;
    ctx.save();ctx.strokeStyle='#94a3b8';ctx.lineWidth=2.5;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(rx1,CEIL_Y+PR);ctx.lineTo(rx1,y1);ctx.stroke();
    ctx.beginPath();ctx.moveTo(rx2,CEIL_Y+PR);ctx.lineTo(rx2,y2);ctx.stroke();
    ctx.restore();

    // Mass 1 (blue, descends)
    var x1L=rx1-bW/2;
    ctx.save();ctx.fillStyle='rgba(37,99,235,.85)';ctx.strokeStyle='#60a5fa';ctx.lineWidth=1.8;
    ctx.beginPath();ctx.roundRect(x1L,y1,bW,bH,4);ctx.fill();ctx.stroke();ctx.restore();
    label(ctx,'m₁='+m1,rx1,y1+bH/2+3,'#bfdbfe',7.5,'center');
    // T arrow up, W arrow down (clamped to canvas)
    var tLen=Math.min(T_at*0.45,38);
    var w1Len=Math.min(m1*g*0.45,38);
    if(y1-tLen>CEIL_Y+PR+2) arrow(ctx,rx1,y1,rx1,y1-tLen,'#34d399',2,7);
    label(ctx,'T',rx1-10,y1-tLen/2,'#34d399',7,'right');
    if(y1+bH+w1Len<H-2) arrow(ctx,rx1,y1+bH,rx1,y1+bH+w1Len,'#ef4444',2,7);
    label(ctx,'W₁',rx1-8,y1+bH+w1Len/2+2,'#fca5a5',7,'right');
    // Acceleration arrow (right side, downward for m1)
    var aLen2=Math.min(a_at*10,24);
    arrow(ctx,x1L-14,y1+bH/2,x1L-14,y1+bH/2+aLen2,'#fbbf24',2,7);

    // Mass 2 (red, ascends)
    var x2L=rx2-bW/2;
    ctx.save();ctx.fillStyle='rgba(185,28,28,.85)';ctx.strokeStyle='#f87171';ctx.lineWidth=1.8;
    ctx.beginPath();ctx.roundRect(x2L,y2,bW,bH,4);ctx.fill();ctx.stroke();ctx.restore();
    label(ctx,'m₂='+m2,rx2,y2+bH/2+3,'#fecaca',7.5,'center');
    if(y2-tLen>CEIL_Y+PR+2) arrow(ctx,rx2,y2,rx2,y2-tLen,'#34d399',2,7);
    label(ctx,'T',rx2+4,y2-tLen/2,'#34d399',7,'left');
    var w2Len=Math.min(m2*g*0.45,30);
    if(y2+bH+w2Len<H-2) arrow(ctx,rx2,y2+bH,rx2,y2+bH+w2Len,'#ef4444',1.8,6);
    // Acceleration arrow (right side, upward for m2)
    arrow(ctx,x2L+bW+14,y2+bH/2,x2L+bW+14,y2+bH/2-aLen2,'#fbbf24',2,7);

    // Info panel (left or right of masses)
    var panX=rx2+bW/2+22, panW=W-panX-4;
    if(panW<65){panX=4; panW=rx1-bW/2-8;}
    ctx.save();ctx.fillStyle='rgba(6,14,28,.9)';ctx.strokeStyle='#1e3a52';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(panX,H*0.28,panW,88,4);ctx.fill();ctx.stroke();ctx.restore();
    label(ctx,'a='+a_at.toFixed(2)+' m/s²',panX+panW/2,H*0.28+16,'#22d3ee',8.5,'center');
    label(ctx,'T='+T_at.toFixed(1)+' N',panX+panW/2,H*0.28+32,'#34d399',8,'center');
    var vNow2=a_at*Math.min(tFall2,3);
    label(ctx,'v='+vNow2.toFixed(2)+' m/s',panX+panW/2,H*0.28+48,'#60a5fa',7.5,'center');
    label(ctx,'m₁ יורד',panX+panW/2,H*0.28+64,'#bfdbfe',7,'center');
    label(ctx,'m₂ עולה',panX+panW/2,H*0.28+76,'#fecaca',7,'center');
  }
});

runAnim('anim-n3',(canvas,ctx,W,H,t)=>{
  bg(ctx,W,H);
  const PERIOD=5, tt=t%PERIOD;
  const ay=H/2+2;
  const mA=3, mB=6;
  const FMag=20;
  // Animate separation
  let xA=W/2-30, xB=W/2+30;
  if(tt>1){
    const tc=tt-1; const a_sys=FMag/(mA+mB);
    const aA_actual=FMag/mA, aB_actual=FMag/mB;
    xA=W/2-30-0.5*(FMag/mA)*tc*tc*5;
    xB=W/2+30+0.5*(FMag/mB)*tc*tc*5;
  }
  xA=Math.max(18,xA); xB=Math.min(W-18,xB);

  const bWA=32, bWB=42, bH=36;
  // Floor
  ctx.save(); ctx.strokeStyle='#2d5275'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(14,ay+bH/2+2); ctx.lineTo(W-14,ay+bH/2+2); ctx.stroke(); ctx.restore();
  // friction marks
  ctx.save(); ctx.strokeStyle='rgba(30,58,82,.4)'; ctx.lineWidth=0.8;
  for(let x=14;x<W-14;x+=18){ ctx.beginPath(); ctx.moveTo(x,ay+bH/2+2); ctx.lineTo(x+11,ay+bH/2+10); ctx.stroke(); }
  ctx.restore();

  // Block A
  ctx.save(); ctx.shadowColor='rgba(239,68,68,.5)'; ctx.shadowBlur=8;
  ctx.fillStyle='rgba(153,27,27,.75)'; ctx.strokeStyle='#ef4444'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(xA-bWA/2,ay-bH/2,bWA,bH,4); ctx.fill(); ctx.stroke(); ctx.restore();
  label(ctx,'A:'+mA+'kg',xA,ay+3,'#fca5a5',9);

  // Block B
  ctx.save(); ctx.shadowColor='rgba(59,130,246,.5)'; ctx.shadowBlur=8;
  ctx.fillStyle='rgba(29,78,216,.75)'; ctx.strokeStyle='#3b82f6'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(xB-bWB/2,ay-bH/2,bWB,bH,4); ctx.fill(); ctx.stroke(); ctx.restore();
  label(ctx,'B:'+mB+'kg',xB,ay+3,'#93c5fd',9);

  // Contact forces
  const contactX=(xA+bWA/2+xB-bWB/2)/2;
  if(tt>0.8&&tt<1.2){
    // compression phase
    ctx.save(); ctx.fillStyle='rgba(251,191,36,.3)'; ctx.beginPath(); ctx.arc(contactX,ay,14,0,Math.PI*2); ctx.fill(); ctx.restore();
    label(ctx,'מגע!',contactX,ay-20,'#fbbf24',9);
  }
  if(tt>1){
    const fLen=Math.min(FMag*1.3,50);
    arrow(ctx,xA+bWA/2,ay-10,xA+bWA/2+fLen,ay-10,'#3b82f6',3,10);
    label(ctx,'F_AB=+'+FMag+'N',xA+bWA/2+fLen/2,ay-20,'#93c5fd',8);
    arrow(ctx,xB-bWB/2,ay+10,xB-bWB/2-fLen,ay+10,'#ef4444',3,10);
    label(ctx,'F_BA=-'+FMag+'N',xB-bWB/2-fLen/2,ay+22,'#fca5a5',8);
  }

  // Acceleration labels
  if(tt>1){
    const tc=tt-1;
    const aA=(FMag/mA).toFixed(1), aB=(FMag/mB).toFixed(1);
    label(ctx,'aₐ='+aA+' m/s² ←',xA,ay-bH/2-10,'#fca5a5',8);
    label(ctx,'a_b='+aB+' m/s² →',xB,ay-bH/2-10,'#93c5fd',8);
  }

  ctx.save(); ctx.fillStyle='rgba(6,14,28,.88)'; ctx.strokeStyle='rgba(251,191,36,.4)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(W/2-145,4,290,18,4); ctx.fill(); ctx.stroke(); ctx.restore();
  label(ctx,'F_AB = -F_BA  |  |כוח| שווה, כיוון הפוך (חוק שלישי)',W/2,14,'#fbbf24',8.5);
  label(ctx,'שים לב: כוחות פ"ת על גופים שונים!',W/2,H-5,'#334e68',8);
});

// CH2 ANIM: חיבור וקטורים (vector addition)

runAnim('anim-vecadd',(canvas,ctx,W,H,t)=>{
  bg(ctx,W,H);
  const cx=W*0.38, cy=H*0.52;
  // Animated angle between vectors
  const theta=t*0.5; // slowly rotating B
  const magA=62, magB=44;
  const angA=0; // A points right
  const angB=theta;
  const Ax=magA*Math.cos(angA), Ay=-magA*Math.sin(angA);
  const Bx=magB*Math.cos(angB), By=-magB*Math.sin(angB);
  const Rx=Ax+Bx, Ry=Ay+By;
  const Rmag=Math.sqrt(Rx*Rx+Ry*Ry);

  // Grid dots
  ctx.save(); ctx.fillStyle='rgba(30,58,82,.4)';
  for(let gx=16;gx<W;gx+=28) for(let gy=14;gy<H;gy+=28){
    ctx.beginPath(); ctx.arc(gx,gy,1.5,0,Math.PI*2); ctx.fill();
  }ctx.restore();

  // Origin
  circle(ctx,cx,cy,4,'#334e68','#475569',1);

  // Vector A
  arrow(ctx,cx,cy,cx+Ax,cy+Ay,'#3b82f6',3,12);
  ctx.save(); ctx.fillStyle='rgba(6,14,28,.88)'; ctx.strokeStyle='#3b82f6'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(cx+Ax/2-22,cy+Ay/2-10,44,16,3); ctx.fill(); ctx.stroke(); ctx.restore();
  label(ctx,'A='+magA.toFixed(0),cx+Ax/2,cy+Ay/2+2,'#93c5fd',8.5);

  // Vector B (from tip of A — head-to-tail)
  arrow(ctx,cx+Ax,cy+Ay,cx+Ax+Bx,cy+Ay+By,'#f59e0b',3,12);
  ctx.save(); ctx.fillStyle='rgba(6,14,28,.88)'; ctx.strokeStyle='#f59e0b'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(cx+Ax+Bx/2-22,cy+Ay+By/2-10,44,16,3); ctx.fill(); ctx.stroke(); ctx.restore();
  label(ctx,'B='+magB.toFixed(0),cx+Ax+Bx/2,cy+Ay+By/2+2,'#fde68a',8.5);

  // Resultant R
  ctx.save(); ctx.shadowColor='rgba(52,211,153,.6)'; ctx.shadowBlur=10;
  arrow(ctx,cx,cy,cx+Rx,cy+Ry,'#34d399',3.5,14); ctx.restore();
  ctx.save(); ctx.fillStyle='rgba(6,14,28,.92)'; ctx.strokeStyle='#34d399'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect(cx+Rx/2-32,cy+Ry/2-11,64,18,4); ctx.fill(); ctx.stroke(); ctx.restore();
  label(ctx,'R='+Rmag.toFixed(1),cx+Rx/2,cy+Ry/2+2,'#34d399',9.5);

  // Component dashes from tip
  ctx.save(); ctx.strokeStyle='rgba(52,211,153,.3)'; ctx.lineWidth=1; ctx.setLineDash([3,5]);
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Rx,cy); ctx.lineTo(cx+Rx,cy+Ry); ctx.stroke();
  ctx.setLineDash([]); ctx.restore();
  label(ctx,'Rx='+Rx.toFixed(1),cx+Rx/2,cy+12,'rgba(52,211,153,.6)',8);
  label(ctx,'Ry='+Math.abs(Ry).toFixed(1),cx+Rx+6,cy+Ry/2,'rgba(52,211,153,.6)',8,'left');

  // Angle indicator
  ctx.save(); ctx.strokeStyle='rgba(251,191,36,.5)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(cx,cy,22,Math.atan2(Ry,Rx),0,Ry>0); ctx.stroke(); ctx.restore();
  const Ra=Math.atan2(-Ry,Rx)*180/Math.PI;
  label(ctx,(Ra>=0?Ra:-Ra).toFixed(0)+'°',cx+28,cy-8,'#fbbf24',8);

  // Formula panel right
  ctx.save(); ctx.fillStyle='rgba(6,14,28,.88)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(W*0.72,H*0.08,W*0.26,H*0.5,7); ctx.fill(); ctx.stroke(); ctx.restore();
  const px=W*0.85, py=H*0.18;
  label(ctx,'חיבור וקטורי',px,py,'#94a3b8',9);
  label(ctx,'Rx=Ax+Bx',px,py+16,'#34d399',8.5);
  label(ctx,'='+Ax.toFixed(1)+'+'+Bx.toFixed(1),px,py+30,'#34d399',8);
  label(ctx,'='+Rx.toFixed(1),px,py+44,'#34d399',9);
  label(ctx,'Ry=Ay+By',px,py+64,'#34d399',8.5);
  label(ctx,'='+Ay.toFixed(1)+'+'+By.toFixed(1),px,py+78,'#34d399',8);
  label(ctx,'='+Ry.toFixed(1),px,py+92,'#34d399',9);

// ── ANIM 1: Gravity — Galileo's experiment, W=mg, g on planets
runAnim('anim-gravity',(canvas,ctx,W,H,t)=>{
  bg(ctx,W,H);
  const g=9.8, PERIOD=2.4;
  const tt=t%PERIOD;
  const tFall=PERIOD*0.72;
  const yMax=H*0.72;
  const GND=H-18, topY=22;
  const yFrac=tt<tFall?Math.min(0.5*g*tt*tt/(0.5*g*tFall*tFall),1):1;
  const bouncing=tt>=tFall;
  const bounceFrac=bouncing?(tt-tFall)/(PERIOD-tFall):0;

  // Ground line
  ctx.save();ctx.strokeStyle='#1e4060';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(10,GND);ctx.lineTo(W-10,GND);ctx.stroke();ctx.restore();

  // Hatching
  ctx.save();ctx.strokeStyle='rgba(30,64,96,.35)';ctx.lineWidth=0.8;
  for(let x=10;x<W-10;x+=12){ctx.beginPath();ctx.moveTo(x,GND);ctx.lineTo(x+7,GND+6);ctx.stroke();}
  ctx.restore();

  const balls=[
    {m:0.5, col:'#3b82f6', x:W*0.18, r:10, lbl:'0.5 kg'},
    {m:2,   col:'#f59e0b', x:W*0.50, r:13, lbl:'2 kg'},
    {m:10,  col:'#ef4444', x:W*0.82, r:16, lbl:'10 kg'},
  ];

  balls.forEach(b=>{
    let by;
    if(!bouncing){
      by = topY+b.r + (GND-topY-b.r*2)*yFrac;
    } else {
      // tiny bounce
      const bf=Math.sin(bounceFrac*Math.PI)*0.12;
      by = GND - b.r - (GND-topY-b.r*2)*bf;
    }
    // ghost trails
    for(let i=1;i<=4;i++){
      const gf=Math.max(0,yFrac-i*0.1);
      const gy=topY+b.r+(GND-topY-b.r*2)*gf;
      if(gy>=by-2)continue;
      ctx.save();ctx.globalAlpha=(4-i)*0.05;
      ctx.beginPath();ctx.arc(b.x,gy,b.r,0,Math.PI*2);ctx.fillStyle=b.col;ctx.fill();ctx.restore();
    }
    // glow
    ctx.save();
    const grad=ctx.createRadialGradient(b.x-b.r*0.3,by-b.r*0.3,b.r*0.1,b.x,by,b.r);
    grad.addColorStop(0,'#fff8');grad.addColorStop(0.35,b.col+'dd');grad.addColorStop(1,b.col+'44');
    ctx.beginPath();ctx.arc(b.x,by,b.r,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();
    ctx.strokeStyle=b.col;ctx.lineWidth=1.5;ctx.stroke();ctx.restore();
    // label
    label(ctx,b.lbl,b.x,GND+12,b.col,8);
    // velocity arrow
    const vy=g*(tt<tFall?tt:tFall);
    if(vy>1&&!bouncing){
      const aLen=Math.min(vy*1.4,22);
      arrow(ctx,b.x,by+b.r+2,b.x,by+b.r+2+aLen,b.col,1.8,6);
    }
  });

  // "a=g for all" banner
  ctx.save();ctx.fillStyle='rgba(6,14,28,.9)';ctx.strokeStyle='rgba(251,191,36,.4)';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(W/2-130,2,260,16,4);ctx.fill();ctx.stroke();ctx.restore();
  label(ctx,'a = g = 9.8 m/s² — לכל המסות! (גלילאו)',W/2,12,'#fbbf24',8.5);

  // W = mg labels on top
  balls.forEach(b=>{
    const W_kg=(b.m*9.8).toFixed(1);
    label(ctx,'W='+W_kg+'N',b.x,topY+3,b.col,7.5);
  });
});


// ── ANIM 2: Spring / Hooke's Law — F=-kx with live F(x) graph
runAnim('anim-spring-force',(canvas,ctx,W,H,t)=>{
  bg(ctx,W,H);
  const k=3.0, amp=Math.min(W*0.22, 65);
  const x=amp*Math.cos(t*1.7);           // px displacement from eq
  const x_m=x/100;                        // metres
  const F_N=-k*x_m;                       // signed Hooke force (N)
  const absF=Math.abs(F_N);               // magnitude
  const absx=Math.abs(x_m);              // magnitude of displacement

  // Layout: spring scene left 58%, graph right 40%
  const wallX=16, eqX=W*0.44, mx=eqX+x;
  const my=Math.round(H*0.45);            // spring centre — lower so labels fit above
  const mr=Math.min(H*0.13, 20);          // mass radius

  // ── Equilibrium dashed line ──────────────────────────────
  ctx.save();ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=1;ctx.setLineDash([4,5]);
  ctx.beginPath();ctx.moveTo(eqX,my-H*0.30);ctx.lineTo(eqX,my+H*0.22);
  ctx.stroke();ctx.setLineDash([]);ctx.restore();
  label(ctx,'x=0',eqX,my-H*0.30-7,'#1e4060',7.5,'center');

  // ── Wall ─────────────────────────────────────────────────
  ctx.save();ctx.fillStyle='#162236';ctx.fillRect(0,my-H*0.32,wallX,H*0.64);
  ctx.strokeStyle='#2d5275';ctx.lineWidth=1;
  for(let y=my-H*0.28;y<my+H*0.28;y+=12){
    ctx.beginPath();ctx.moveTo(wallX,y);ctx.lineTo(wallX-8,y+8);ctx.stroke();
  }
  ctx.restore();

  // ── Spring coil ──────────────────────────────────────────
  const stretch=x/amp;
  const springCol=stretch>0?`rgba(239,68,68,${0.55+0.45*Math.abs(stretch)})`
                           :`rgba(52,211,153,${0.55+0.45*Math.abs(stretch)})`;
  const segs=16, sLen=Math.max(10,mx-wallX-mr-4), dxs=sLen/segs;
  const coilH=Math.min(H*0.11, 12);
  ctx.save();ctx.strokeStyle=springCol;ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(wallX,my);
  for(let i=0;i<segs;i++) ctx.lineTo(wallX+(i+0.5)*dxs, my+(i%2===0?coilH:-coilH));
  ctx.lineTo(mx-mr,my);ctx.stroke();ctx.restore();

  // ── Mass circle ──────────────────────────────────────────
  const grad=ctx.createRadialGradient(mx-mr*0.3,my-mr*0.3,mr*0.1,mx,my,mr);
  grad.addColorStop(0,'#fde68a');grad.addColorStop(1,'#d97706');
  ctx.save();ctx.shadowColor='rgba(251,191,36,.7)';ctx.shadowBlur=14;
  circle(ctx,mx,my,mr,grad,'#fbbf24',2.5);ctx.restore();
  // Mass label "m" inside
  ctx.save();ctx.fillStyle='#1a0a00';
  ctx.font='bold '+Math.round(mr*0.75)+'px Heebo,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('m',mx,my);ctx.restore();

  // ── x displacement arrow below mass ──────────────────────
  if(Math.abs(x)>4){
    const col2=x>0?'#a78bfa':'#22d3ee';
    arrow(ctx,eqX,my+mr+10,mx,my+mr+10,col2,1.8,7);
    label(ctx,'x='+(x_m>=0?'+':'')+x_m.toFixed(3)+'m',(eqX+mx)/2,my+mr+22,col2,7.5,'center');
  }

  // ── |F| arrow — always pointing TOWARD equilibrium ───────
  // The arrow shows the RESTORING force magnitude |F|=k|x|
  if(absF>0.03){
    const towardEq = x>0?-1:1; // arrow direction always toward x=0
    const arrowLen=Math.min(absF*30, amp*0.85);
    const col3='#fbbf24';
    arrow(ctx,mx+towardEq*(mr+2),my,mx+towardEq*(mr+2+arrowLen),my,col3,2.5,9);
    label(ctx,'|F|='+absF.toFixed(2)+'N',
          mx+towardEq*(mr+2+arrowLen+6),my-2,col3,8.5,
          towardEq>0?'left':'right');
  }

  // ── |F|(x) graph — right panel ───────────────────────────
  // Graph shows |F| = k|x|: always positive, linear through origin
  // x-axis: |x| from 0 to amp/100, y-axis: |F| = k|x| from 0 upward
  const gL=W*0.61, gR=W-6, gT=H*0.04, gB=H*0.92;
  const gW=gR-gL, gH=gB-gT;
  ctx.save();ctx.fillStyle='rgba(6,14,28,.90)';ctx.strokeStyle='#1e4060';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(gL,gT,gW,gH,5);ctx.fill();ctx.stroke();ctx.restore();

  // Axes: origin at bottom-left of graph data area
  const gOX=gL+10, gOY=gB-10; // origin
  const gDataW=gW-18, gDataH=gH-22;
  ctx.save();ctx.strokeStyle='#2d5275';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(gOX,gT+8);ctx.lineTo(gOX,gOY);ctx.stroke(); // F axis (up)
  ctx.beginPath();ctx.moveTo(gOX,gOY);ctx.lineTo(gR-6,gOY);ctx.stroke(); // x axis (right)
  ctx.restore();
  // Axis arrow heads
  arrow(ctx,gOX,gT+12,gOX,gT+4,'#3d6480',1,6);
  arrow(ctx,gR-10,gOY,gR-4,gOY,'#3d6480',1,6);
  label(ctx,'|x| (m) →',gR-5,gOY+9,'#3d6480',7,'right');
  label(ctx,'|F| (N) ↑',gOX+4,gT+12,'#3d6480',7,'left');

  // |F| = k|x| reference line (positive slope, from origin to top-right)
  const xMax=amp/100, fMax=k*xMax;
  const xSc=gDataW/xMax, fSc=gDataH/fMax;
  ctx.save();ctx.strokeStyle='rgba(34,211,153,.4)';ctx.lineWidth=1.5;ctx.setLineDash([3,4]);
  ctx.beginPath();ctx.moveTo(gOX,gOY);ctx.lineTo(gOX+xMax*xSc, gOY-fMax*fSc);
  ctx.stroke();ctx.setLineDash([]);ctx.restore();
  label(ctx,'|F|=k|x|',gOX+xMax*xSc*0.55,gOY-fMax*fSc*0.6,'#22d3ee',7.5,'left');

  // Current dot at (|x|, |F|) — always in positive quadrant
  const dotX=Math.min(gOX+absx*xSc, gR-6);
  const dotY=Math.max(gT+6, gOY-absF*fSc);
  circle(ctx,dotX,dotY,6,'#fbbf24');

  // k label and formula at bottom of graph
  label(ctx,'שיפוע = k = '+k+' N/m',gOX+gDataW/2,gB-2,'#64748b',7,'center');

  // ── Footer formula bar (left side) ───────────────────────
  ctx.save();ctx.fillStyle='rgba(6,14,28,.88)';ctx.strokeStyle='#1e4060';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(6,H-15,gL-10,13,3);ctx.fill();ctx.stroke();ctx.restore();

  const _showAbs=window._springForceModeAbs;
  const footerTxt=_showAbs
    ?'|F| = k|x| = '+k+'×'+absx.toFixed(3)+' = '+absF.toFixed(3)+' N'
    :'F = −kx = −('+k+')×'+x_m.toFixed(3)+' = '+F_N.toFixed(3)+' N';
  label(ctx,footerTxt,(gL-10)/2+6,H-6,'#22d3ee',7.5,'center');
});

// ── ANIM 3: Static Friction — f(F) graph + moving block
runAnim('anim-static-frict',(canvas,ctx,W,H,t)=>{
  bg(ctx,W,H);
  const mu_s=0.58,mu_k=0.40,m=5,g=9.8,N=m*g;
  const fs_max=mu_s*N, fk=mu_k*N;
  const PERIOD=5.5, tt=t%PERIOD;
  const Fapp=Math.min((tt/PERIOD)*2.3*fs_max, 2.3*fs_max);
  const moving=Fapp>fs_max;
  const f_act=moving?fk:Fapp;

  // Block scene (upper half)
  const GND=H*0.54, bH=28, bW=52;
  let bx=W*0.48+(moving?(Fapp-fs_max)*0.55:0);
  bx=Math.min(bx,W-bW/2-10);

  ctx.save();ctx.fillStyle='#0f1e30';ctx.fillRect(10,GND,W-20,8);ctx.restore();
  ctx.save();ctx.strokeStyle='rgba(30,58,82,.4)';ctx.lineWidth=0.8;
  for(let x=10;x<W-10;x+=13){ctx.beginPath();ctx.moveTo(x,GND);ctx.lineTo(x+8,GND+6);ctx.stroke();}
  ctx.restore();
  ctx.save();ctx.strokeStyle='#2d5275';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(10,GND);ctx.lineTo(W-10,GND);ctx.stroke();ctx.restore();

  const bTop=GND-bH;
  ctx.save();
  const bGrad=ctx.createLinearGradient(bx-bW/2,bTop,bx-bW/2,GND);
  bGrad.addColorStop(0,moving?'rgba(185,28,28,.9)':'rgba(29,78,216,.9)');
  bGrad.addColorStop(1,moving?'rgba(153,27,27,.5)':'rgba(23,62,172,.5)');
  ctx.beginPath();ctx.roundRect(bx-bW/2,bTop,bW,bH,4);ctx.fillStyle=bGrad;ctx.fill();
  ctx.strokeStyle=moving?'#ef4444':'#60a5fa';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();
  label(ctx,m+'kg',bx,GND-bH/2+5,'#e0f2fe',8.5);

  // F arrow (applied)
  if(Fapp>0.5){
    const fLen=Math.min(Fapp*0.7,62);
    arrow(ctx,bx-bW/2-4-fLen,GND-bH/2,bx-bW/2-4,GND-bH/2,'#f59e0b',2.5,9);
    label(ctx,'F='+Fapp.toFixed(0)+'N',bx-bW/2-fLen/2-4,GND-bH/2-11,'#fbbf24',8,'center');
  }
  // friction arrow
  if(f_act>0.5){
    const fLen=Math.min(f_act*0.7,52);
    arrow(ctx,bx+bW/2+4+fLen,GND-bH/2,bx+bW/2+4,GND-bH/2,'#a78bfa',2.5,9);
    label(ctx,'f='+f_act.toFixed(0)+'N',bx+bW/2+fLen/2+4,GND-bH/2-11,'#c4b5fd',8,'center');
  }

  // f(F) graph (lower half)
  const gL=14,gR=W-14,gT=H*0.60,gB=H-14;
  const gW=gR-gL,gH=gB-gT;
  const Fmax=2.4*fs_max;
  const toX=v=>gL+8+(v/Fmax)*(gW-16);
  const toY=v=>gB-8-(v/(fs_max*1.15))*(gH-16);

  ctx.save();ctx.fillStyle='rgba(6,14,28,.88)';ctx.strokeStyle='#1e4060';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(gL,gT,gW,gH,5);ctx.fill();ctx.stroke();ctx.restore();

  // Axes
  ctx.save();ctx.strokeStyle='#2d5275';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(gL+8,gB-8);ctx.lineTo(gR-4,gB-8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(gL+8,gT+4);ctx.lineTo(gL+8,gB-8);ctx.stroke();ctx.restore();
  label(ctx,'F (N) →',gR-4,gB-2,'#4a7090',7.5,'right');
  label(ctx,'f (N) ↑',gL+10,gT+9,'#4a7090',7.5,'left');

  // fs_max line
  ctx.save();ctx.strokeStyle='rgba(96,165,250,.2)';ctx.lineWidth=0.8;ctx.setLineDash([3,4]);
  ctx.beginPath();ctx.moveTo(toX(fs_max),gT+4);ctx.lineTo(toX(fs_max),gB-8);ctx.stroke();ctx.setLineDash([]);ctx.restore();
  label(ctx,'f_s_max',toX(fs_max)+2,gT+9,'#60a5fa',7,'left');

  // Static slope
  ctx.save();ctx.strokeStyle='#3b82f6';ctx.lineWidth=2.2;
  ctx.beginPath();ctx.moveTo(toX(0),toY(0));ctx.lineTo(toX(fs_max),toY(fs_max));ctx.stroke();ctx.restore();
  label(ctx,'f_s=F',toX(fs_max*0.4),toY(fs_max*0.4)-8,'#93c5fd',7.5);

  // Drop + kinetic
  ctx.save();ctx.strokeStyle='rgba(239,68,68,.5)';ctx.lineWidth=1.5;ctx.setLineDash([2,3]);
  ctx.beginPath();ctx.moveTo(toX(fs_max),toY(fs_max));ctx.lineTo(toX(fs_max),toY(fk));ctx.stroke();ctx.setLineDash([]);ctx.restore();
  ctx.save();ctx.strokeStyle='#ef4444';ctx.lineWidth=2.2;
  ctx.beginPath();ctx.moveTo(toX(fs_max),toY(fk));ctx.lineTo(toX(Fmax*0.94),toY(fk));ctx.stroke();ctx.restore();
  label(ctx,'f_k (קבוע)',toX(Fmax*0.72),toY(fk)-7,'#fca5a5',7.5);

  // Animated dot
  circle(ctx,toX(Math.min(Fapp,Fmax*0.93)),toY(f_act),5,'#fbbf24');

  // Status

// ── ANIM 4: Kinetic Friction — constant fk, linear v(t)
runAnim('anim-kinetic-frict',(canvas,ctx,W,H,t)=>{
  bg(ctx,W,H);
  const mu_k=0.38,m=4,g=9.8,fk=mu_k*m*g;
  const a=-fk/m, v0=11, tStop=v0/(-a);
  const PERIOD=tStop+1.4, tt=t%PERIOD;
  const v=Math.max(0,v0+a*tt);
  const dist_max=v0*v0/(2*(-a));
  const dist=tt<tStop?(v0*tt+0.5*a*tt*tt):dist_max;
  const xFrac=Math.min(dist/dist_max,1);
  const GND=H*0.52, bH=30, bW=54;
  const bx=16+bW/2+xFrac*(W-bW-32);

  // Ground
  ctx.save();ctx.fillStyle='#0f1e30';ctx.fillRect(10,GND,W-20,8);ctx.restore();
  ctx.save();ctx.strokeStyle='rgba(30,58,82,.4)';ctx.lineWidth=0.8;
  for(let x=10;x<W-10;x+=13){ctx.beginPath();ctx.moveTo(x,GND);ctx.lineTo(x+8,GND+6);ctx.stroke();}
  ctx.restore();
  ctx.save();ctx.strokeStyle='#2d5275';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(10,GND);ctx.lineTo(W-10,GND);ctx.stroke();ctx.restore();

  // Friction marks
  if(xFrac>0.03){
    ctx.save();ctx.strokeStyle='rgba(124,58,237,.3)';ctx.lineWidth=3;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(16+bW/2,GND-1);ctx.lineTo(bx,GND-1);ctx.stroke();ctx.restore();
  }

  // Block
  const bTop=GND-bH;
  const bGrad2=ctx.createLinearGradient(bx-bW/2,bTop,bx-bW/2,GND);
  bGrad2.addColorStop(0,'rgba(109,40,217,.9)');bGrad2.addColorStop(1,'rgba(91,33,182,.5)');
  ctx.save();ctx.beginPath();ctx.roundRect(bx-bW/2,bTop,bW,bH,4);ctx.fillStyle=bGrad2;ctx.fill();
  ctx.strokeStyle='#a78bfa';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();
  label(ctx,m+'kg',bx,GND-bH/2+5,'#ede9fe',8.5);

  // Velocity arrow
  if(v>0.3){
    const vLen=Math.min(v*3.5,65);
    arrow(ctx,bx+bW/2+4,GND-bH/2,bx+bW/2+4+vLen,GND-bH/2,'#34d399',2.5,9);
    label(ctx,v.toFixed(1)+'m/s',bx+bW/2+vLen+8,GND-bH/2,'#6ee7b7',8,'left');
  }
  // fk arrow
  arrow(ctx,bx-bW/2-4,GND-bH/2,bx-bW/2-4-fk*0.65,GND-bH/2,'#ef4444',2.5,9);
  label(ctx,'f_k='+fk.toFixed(0)+'N',bx-bW/2-fk*0.65-8,GND-bH/2,'#fca5a5',8,'right');

  // v(t) graph
  const gL=14,gR=W-14,gT=H*0.62,gB=H-14;
  const gW=gR-gL,gH=gB-gT;
  ctx.save();ctx.fillStyle='rgba(6,14,28,.88)';ctx.strokeStyle='#1e4060';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(gL,gT,gW,gH,5);ctx.fill();ctx.stroke();ctx.restore();
  // Axes
  ctx.save();ctx.strokeStyle='#2d5275';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(gL+8,gB-8);ctx.lineTo(gR-4,gB-8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(gL+8,gT+4);ctx.lineTo(gL+8,gB-8);ctx.stroke();ctx.restore();
  label(ctx,'t (s) →',gR-4,gB-2,'#4a7090',7.5,'right');
  label(ctx,'v (m/s) ↑',gL+10,gT+9,'#4a7090',7.5,'left');
  // Theoretical line
  ctx.save();ctx.strokeStyle='rgba(52,211,153,.3)';ctx.lineWidth=1.5;
  ctx.beginPath();
  for(let s=0;s<=100;s++){
    const st=(s/100)*tStop;
    const sv=Math.max(0,v0+a*st);
    const px=gL+8+(s/100)*(gW-12);
    const py=gB-8-(sv/v0)*(gH-12);
    s===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
  }
  ctx.lineTo(gL+8+(gW-12),gB-8);ctx.stroke();ctx.restore();
  // Current dot
  const curT=Math.min(tt,tStop);
  const curPx=gL+8+(curT/tStop)*(gW-12);
  const curPy=gB-8-(v/v0)*(gH-12);
  circle(ctx,curPx,Math.max(gT+5,curPy),5,'#fbbf24');
  label(ctx,'v='+v.toFixed(1)+'m/s  a='+a.toFixed(2)+'m/s²',W/2,gT+11,'#22d3ee',8);
  label(ctx,v<0.2?'נעצר — כל E_k הפכה לחום!':'חיכוך קינטי קבוע ← ירידה לינארית ב-v',W/2,H*0.59,v<0.2?'#f87171':'#94a3b8',8);
});

// ── ANIM 5: Combined Friction — static→kinetic transition diagram
runAnim('anim-friction-comb',(canvas,ctx,W,H,t)=>{
  bg(ctx,W,H);
  const mu_s=0.60,mu_k=0.42,m=5,g=9.8,N=m*g;
  const fs_max=mu_s*N,fk=mu_k*N;
  const PERIOD=6.5,tt=t%PERIOD;
  const Fapp=Math.min((tt/PERIOD)*2.5*fs_max,2.5*fs_max);
  const moving=Fapp>fs_max;

  const Fmax=2.6*fs_max;

  // Block scene (small, upper portion)
  const GND=H*0.45,bH=26,bW=48;
  let bx=W*0.48+(moving?(Fapp-fs_max)*0.45:0);

  ctx.save();ctx.fillStyle='#0f1e30';ctx.fillRect(10,GND,W-20,6);ctx.restore();
  ctx.save();ctx.strokeStyle='#2d5275';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(10,GND);ctx.lineTo(W-10,GND);ctx.stroke();ctx.restore();
  const bGrad3=ctx.createLinearGradient(bx-bW/2,GND-bH,bx-bW/2,GND);
  bGrad3.addColorStop(0,moving?'rgba(185,28,28,.9)':'rgba(29,78,216,.9)');
  bGrad3.addColorStop(1,moving?'rgba(153,27,27,.5)':'rgba(23,62,172,.5)');
  ctx.save();ctx.beginPath();ctx.roundRect(bx-bW/2,GND-bH,bW,bH,3);
  ctx.fillStyle=bGrad3;ctx.fill();ctx.strokeStyle=moving?'#ef4444':'#60a5fa';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();
  if(Fapp>0.5){
    const fLen=Math.min(Fapp*0.55,56);
    arrow(ctx,bx-bW/2-4-fLen,GND-bH/2,bx-bW/2-4,GND-bH/2,'#f59e0b',2.5,8);
    label(ctx,'F='+Fapp.toFixed(0),bx-bW/2-fLen/2-4,GND-bH/2-10,'#fbbf24',7.5,'center');
  }
  if(f_act>0.5){
    const fLen2=Math.min(f_act*0.55,50);
    arrow(ctx,bx+bW/2+4+fLen2,GND-bH/2,bx+bW/2+4,GND-bH/2,'#a78bfa',2.5,8);
    label(ctx,'f='+f_act.toFixed(0),bx+bW/2+fLen2/2+4,GND-bH/2-10,'#c4b5fd',7.5,'center');
  }

  // Main f(F) graph (lower portion)
  const gL=14,gR=W-14,gT=H*0.51,gB=H-12;
  const gW=gR-gL,gH=gB-gT;
  const toX=v=>gL+10+(v/Fmax)*(gW-20);
  const toY=v=>gB-8-(v/(fs_max*1.2))*(gH-16);

  ctx.save();ctx.fillStyle='rgba(6,14,28,.9)';ctx.strokeStyle='#1e4060';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(gL,gT,gW,gH,5);ctx.fill();ctx.stroke();ctx.restore();

  // Region shading
  ctx.save();ctx.fillStyle='rgba(37,99,235,.07)';
  ctx.fillRect(toX(0),toY(fs_max),toX(fs_max)-toX(0),gB-8-toY(fs_max));ctx.restore();
  ctx.save();ctx.fillStyle='rgba(239,68,68,.07)';
  ctx.fillRect(toX(fs_max),gT+4,gR-14-toX(fs_max),gB-8-gT-4);ctx.restore();

  // Axes
  ctx.save();ctx.strokeStyle='#2d5275';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(gL+10,gB-8);ctx.lineTo(gR-4,gB-8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(gL+10,gT+4);ctx.lineTo(gL+10,gB-8);ctx.stroke();ctx.restore();
  label(ctx,'F (N) מופעל →',gR-5,gB-1,'#4a7090',7,'right');
  label(ctx,'f (N) ↑',gL+12,gT+10,'#4a7090',7,'left');

  // fs_max vertical dashed line
  ctx.save();ctx.strokeStyle='rgba(96,165,250,.25)';ctx.lineWidth=0.8;ctx.setLineDash([3,4]);
  ctx.beginPath();ctx.moveTo(toX(fs_max),gT+4);ctx.lineTo(toX(fs_max),gB-8);ctx.stroke();ctx.setLineDash([]);ctx.restore();

  // Static slope: f=F
  ctx.save();ctx.strokeStyle='#3b82f6';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(toX(0),toY(0));ctx.lineTo(toX(fs_max),toY(fs_max));ctx.stroke();ctx.restore();
  label(ctx,'f_s = F',toX(fs_max*0.38),toY(fs_max*0.38)-9,'#93c5fd',7.5);

  // Drop
  ctx.save();ctx.strokeStyle='rgba(239,68,68,.55)';ctx.lineWidth=1.5;ctx.setLineDash([2,3]);
  ctx.beginPath();ctx.moveTo(toX(fs_max),toY(fs_max));ctx.lineTo(toX(fs_max),toY(fk));ctx.stroke();ctx.setLineDash([]);ctx.restore();

  // Kinetic plateau
  ctx.save();ctx.strokeStyle='#ef4444';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(toX(fs_max),toY(fk));ctx.lineTo(toX(Fmax*0.96),toY(fk));ctx.stroke();ctx.restore();

  // Labels
  label(ctx,'fs_max',toX(fs_max)+2,toY(fs_max)-7,'#60a5fa',7,'left');
  label(ctx,'fk (קבוע)',toX(Fmax*0.72),toY(fk)-7,'#fca5a5',7.5);
