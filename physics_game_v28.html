  const stateStr=moving?'נע — f_k='+fk.toFixed(0)+'N (קבוע)':Fapp>=fs_max*0.95?'בסף!':'שיווי משקל — f_s='+f_act.toFixed(0)+'N';
  ctx.save();ctx.fillStyle='rgba(6,14,28,.88)';ctx.strokeStyle=stateCol+'44';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(W/2-120,H*0.47,240,14,4);ctx.fill();ctx.stroke();ctx.restore();
  label(ctx,stateStr,W/2,H*0.47+9.5,stateCol,8.5);
});

// ── ANIM 6: Momentum Conservation — elastic collision
runAnim('anim-mcons',(canvas,ctx,W,H,t)=>{
  bg(ctx,W,H);
  const PERIOD=7, tt=t%PERIOD;
  const m1=3, m2=2;
  const v1i=20, v2i=-14;
  const p_total=m1*v1i+m2*v2i;
  const v1f=((m1-m2)*v1i+2*m2*v2i)/(m1+m2);
  const v2f=(2*m1*v1i+(m2-m1)*v2i)/(m1+m2);
  const tC=2.2;
  const r1=14, r2=11;
  const ay=H*0.46;
  const GND=ay+Math.max(r1,r2)+6;

  let x1,x2,v1c,v2c;
  if(tt<tC){
    x1=32+v1i*tt*1.1;
    x2=W-32+v2i*tt*1.1;
    v1c=v1i; v2c=v2i;
  } else {
    const dt2=tt-tC;
    x1=32+v1i*tC*1.1+v1f*dt2*1.1;
    x2=W-32+v2i*tC*1.1+v2f*dt2*1.1;
    v1c=v1f; v2c=v2f;
  }
  x1=Math.max(r1+8,Math.min(W-r1-8,x1));
  x2=Math.max(r2+8,Math.min(W-r2-8,x2));

  const collided=tt>=tC;
  const flashAlpha=(tt>=tC&&tt<tC+0.4)?((0.4-(tt-tC))/0.4):0;

  // Ground
  ctx.save();ctx.strokeStyle='#1e4060';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(12,GND);ctx.lineTo(W-12,GND);ctx.stroke();
  ctx.strokeStyle='rgba(30,64,96,.3)';ctx.lineWidth=0.7;
  for(let x=12;x<W-12;x+=10){ctx.beginPath();ctx.moveTo(x,GND);ctx.lineTo(x+6,GND+5);ctx.stroke();}
  ctx.restore();

  // ── Momentum bars panel (top)
  const barPanel={x:12,y:8,w:W-24,h:36};
  ctx.save();ctx.fillStyle='rgba(6,14,28,.88)';ctx.strokeStyle='#1e3a52';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(barPanel.x,barPanel.y,barPanel.w,barPanel.h,5);ctx.fill();ctx.stroke();ctx.restore();

  const pMax=Math.abs(m1*v1i)+Math.abs(m2*v2i);
  const p1=m1*v1c, p2=m2*v2c, pNow=p1+p2;
  const midX=barPanel.x+barPanel.w/2;
  const barScale=(barPanel.w*0.42)/pMax;

  // p1 bar (left of midX, extends right if positive)
  const bw1=Math.abs(p1)*barScale;
  ctx.save();ctx.fillStyle=p1>=0?'#3b82f6':'#818cf8';
  ctx.beginPath();ctx.roundRect(p1>=0?midX:midX-bw1,barPanel.y+6,bw1,10,2);ctx.fill();ctx.restore();

  // p2 bar
  const bw2=Math.abs(p2)*barScale;
  ctx.save();ctx.fillStyle=p2>=0?'#f59e0b':'#ef4444';
  ctx.beginPath();ctx.roundRect(p2>=0?midX:midX-bw2,barPanel.y+20,bw2,10,2);ctx.fill();ctx.restore();

  // p_total dashed marker
  const ptW=Math.abs(pNow)*barScale;
  ctx.save();ctx.strokeStyle='#fbbf24';ctx.lineWidth=1.5;ctx.setLineDash([3,3]);
  ctx.beginPath();
  const ptX=pNow>=0?midX:midX-ptW;
  ctx.moveTo(ptX,barPanel.y+3);ctx.lineTo(ptX+ptW,barPanel.y+3);
  ctx.stroke();ctx.setLineDash([]);ctx.restore();

  // Labels in bar panel
  label(ctx,'p₁='+p1.toFixed(1),midX-4,barPanel.y+14,'#93c5fd',7.5,'right');
  label(ctx,'p₂='+p2.toFixed(1),midX+4,barPanel.y+28,'#fcd34d',7.5,'left');
  label(ctx,'p_כולל='+pNow.toFixed(1)+' ✓',midX,barPanel.y+37,'#fbbf24',7.5,'center');

  // ── Ball 1 (blue)
  const g1=ctx.createRadialGradient(x1-r1*0.35,ay-r1*0.35,r1*0.08,x1,ay,r1);
  g1.addColorStop(0,'#bfdbfe');g1.addColorStop(1,'rgba(29,78,216,.85)');
  circle(ctx,x1,ay,r1,g1,'#60a5fa',2);
  label(ctx,'m₁='+m1+'kg',x1,ay+r1+10,'#93c5fd',7.5);
  if(Math.abs(v1c)>0.3){
    const al=v1c*2.2;
    arrow(ctx,x1,ay-r1-6,x1+al,ay-r1-6,'#34d399',2,7);
    label(ctx,v1c.toFixed(1)+'m/s',x1+al+(v1c>0?4:-4),ay-r1-6,'#6ee7b7',7.5,v1c>0?'left':'right');
  }

  // ── Ball 2 (red)
  const g2=ctx.createRadialGradient(x2-r2*0.35,ay-r2*0.35,r2*0.08,x2,ay,r2);
  g2.addColorStop(0,'#fecaca');g2.addColorStop(1,'rgba(185,28,28,.85)');
  circle(ctx,x2,ay,r2,g2,'#f87171',2);
  label(ctx,'m₂='+m2+'kg',x2,ay+r2+10,'#fca5a5',7.5);
  if(Math.abs(v2c)>0.3){
    const al2=v2c*2.2;
    arrow(ctx,x2,ay-r2-6,x2+al2,ay-r2-6,'#f59e0b',2,7);
    label(ctx,v2c.toFixed(1)+'m/s',x2+al2+(v2c>0?4:-4),ay-r2-6,'#fbbf24',7.5,v2c>0?'left':'right');
  }

  // Collision flash
  if(flashAlpha>0){
    ctx.save();ctx.globalAlpha=flashAlpha*0.65;
    const gf=ctx.createRadialGradient((x1+x2)/2,ay,0,(x1+x2)/2,ay,28);
    gf.addColorStop(0,'#fbbf24');gf.addColorStop(1,'transparent');
    ctx.fillStyle=gf;ctx.beginPath();ctx.arc((x1+x2)/2,ay,28,0,Math.PI*2);ctx.fill();ctx.restore();
  }

  // Status banner bottom
  ctx.save();ctx.fillStyle='rgba(6,14,28,.82)';ctx.strokeStyle=collided?'rgba(52,211,153,.4)':'rgba(30,64,96,.5)';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(12,H-26,W-24,20,4);ctx.fill();ctx.stroke();ctx.restore();
  label(ctx,collided?'אחרי התנגשות — p_כולל = '+pNow.toFixed(1)+' kg·m/s ✅ שמור!':'לפני התנגשות — p_כולל = '+pNow.toFixed(1)+' kg·m/s',W/2,H-13,collided?'#6ee7b7':'#94a3b8',7.5);
});

// ── CH3 ANIM: anim-tension — rope tension, T=m(g±a)
runAnim('anim-tension',(canvas,ctx,W,H,t)=>{
  bg(ctx,W,H);
  const PERIOD=6, tt=t%PERIOD;
  // Three scenarios cycling: static (a=0), accelerating up (a=+3), accelerating down (a=-3)
  const scene=Math.floor(tt/2)%3;
  const a_vals=[0, 3, -3];
  const a_lbls=['שיווי משקל (a=0)', 'מואץ מעלה (a=+3)', 'מואץ מטה (a=−3)'];
  const a_col=['#34d399','#60a5fa','#f87171'];
  const a=a_vals[scene], g=9.8, m=5;
  const T=m*(g+a);

  // Ceiling beam
  ctx.save();ctx.fillStyle='#1a3a52';ctx.strokeStyle='#2d5275';ctx.lineWidth=1.5;
  ctx.fillRect(W*0.3,8,W*0.4,10);ctx.strokeRect(W*0.3,8,W*0.4,10);ctx.restore();

  // Rope
  const ropeX=W/2, ropeTop=18, ropeLen=70;
  ctx.save();ctx.strokeStyle='#94a3b8';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(ropeX,ropeTop);ctx.lineTo(ropeX,ropeTop+ropeLen);ctx.stroke();ctx.restore();

  // Block
  const bW=44, bH=28, bX=ropeX-bW/2, bY=ropeTop+ropeLen;
  ctx.save();ctx.fillStyle='rgba(37,99,235,.85)';ctx.strokeStyle='#60a5fa';ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(bX,bY,bW,bH,5);ctx.fill();ctx.stroke();ctx.restore();
  label(ctx,m+' kg',ropeX,bY+bH/2+2,'#fff',9,'center');

  // Tension arrow (up from block top)
  const T_scale=0.018;
  arrow(ctx,ropeX,bY,ropeX,bY-T*T_scale*18,'#34d399',3,11);
  label(ctx,'T='+T.toFixed(1)+' N',ropeX+6,bY-T*T_scale*10,'#6ee7b7',9.5,'left');

  // Weight arrow (down from block bottom)
  const W_grav=m*g;
  arrow(ctx,ropeX,bY+bH,ropeX,bY+bH+W_grav*T_scale*16,'#ef4444',3,11);
  label(ctx,'W='+W_grav.toFixed(0)+' N',ropeX+6,bY+bH+W_grav*T_scale*9,'#fca5a5',9.5,'left');

  // Net force / acceleration arrow
  if(Math.abs(a)>0.1){
    const netF=m*a;
    const acol=a>0?'#fbbf24':'#f97316';
    arrow(ctx,ropeX-28,bY+bH/2,ropeX-28,bY+bH/2-(netF)*0.9,acol,2.5,10);
    label(ctx,'F_net='+netF.toFixed(0)+'N',ropeX-32,bY+bH/2-netF*0.45,'#fbbf24',8,'right');
  }

  // Info panel
  ctx.save();ctx.fillStyle='rgba(6,14,28,.9)';ctx.strokeStyle=a_col[scene]+'55';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(10,H-60,W-20,54,5);ctx.fill();ctx.stroke();ctx.restore();
  label(ctx,a_lbls[scene],W/2,H-46,a_col[scene],9,'center');
  label(ctx,'T = m(g + a) = '+m+'×('+g.toFixed(1)+(a>=0?'+':'')+a+') = '+T.toFixed(1)+' N',W/2,H-30,'#e2e8f0',9,'center');
  label(ctx,T>W_grav?'T > W — חוט מושך מעלה':T<W_grav?'T < W — כמו נפילה חופשית':'T = W — שיווי משקל',W/2,H-14,a_col[scene],8,'center');
});

// ── CH3 ANIM: anim-normal-force — N on flat and inclined surfaces
runAnim('anim-normal-force',(canvas,ctx,W,H,t)=>{
  bg(ctx,W,H);
  // Left: flat surface. Right: inclined surface with variable angle
  const ang_deg=20+25*Math.abs(Math.sin(t*0.4));
  const ang=ang_deg*Math.PI/180;
  const g=9.8, m=4;

  // ── LEFT: flat surface
  const LCX=W*0.25, GND_L=H-28;
  ctx.save();ctx.strokeStyle='#1e4060';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(12,GND_L);ctx.lineTo(W*0.46,GND_L);ctx.stroke();ctx.restore();
  // hatching
  ctx.save();ctx.strokeStyle='rgba(30,64,96,.3)';ctx.lineWidth=0.8;
  for(let x=12;x<W*0.46;x+=11){ctx.beginPath();ctx.moveTo(x,GND_L);ctx.lineTo(x+7,GND_L+5);ctx.stroke();}
  ctx.restore();

  const bW=30, bH=22;
  ctx.save();ctx.fillStyle='rgba(37,99,235,.85)';ctx.strokeStyle='#60a5fa';ctx.lineWidth=1.8;
  ctx.beginPath();ctx.roundRect(LCX-bW/2,GND_L-bH,bW,bH,4);ctx.fill();ctx.stroke();ctx.restore();
  label(ctx,m+'kg',LCX,GND_L-bH/2+2,'#fff',8,'center');

  // N arrow up
  const N_flat=m*g;
  // N acts upward from floor surface (bottom of block)
  arrow(ctx,LCX,GND_L,LCX,GND_L-bH-N_flat*0.6,'#34d399',2.5,9);
  label(ctx,'N=mg',LCX+4,GND_L-bH-N_flat*0.30,'#34d399',8,'left');
  label(ctx,N_flat.toFixed(0)+' N',LCX+4,GND_L-bH-N_flat*0.30+10,'#6ee7b7',8,'left');
  // W arrow down
  // W acts downward from block center
  arrow(ctx,LCX,GND_L-bH/2,LCX,GND_L-bH/2+N_flat*0.55,'#ef4444',2,8);
  label(ctx,'W=mg',LCX+4,GND_L-bH/2+N_flat*0.28,'#fca5a5',8,'left');
  // Label below
  label(ctx,'משטח אופקי',LCX,H-10,'#64748b',8,'center');
  label(ctx,'N = mg = '+N_flat.toFixed(0)+'N',LCX,H-20,'#34d399',8,'center');

  // ── RIGHT: inclined surface
  const RBX=W*0.56, GND_R=H-28;
  const incLen=W*0.38;
  const cosA=Math.cos(ang), sinA=Math.sin(ang);
  const topX=RBX+incLen*cosA, topY=GND_R-incLen*sinA;

  // Incline
  const incG=ctx.createLinearGradient(RBX,GND_R,topX,topY);
  incG.addColorStop(0,'rgba(10,28,58,.9)');incG.addColorStop(1,'rgba(20,50,90,.65)');
  ctx.save();ctx.fillStyle=incG;ctx.strokeStyle='#2d5275';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(RBX,GND_R);ctx.lineTo(topX,topY);ctx.lineTo(topX,GND_R);ctx.closePath();
  ctx.fill();ctx.stroke();ctx.restore();
  // Ground extension
  ctx.save();ctx.strokeStyle='#1e4060';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(RBX-4,GND_R);ctx.lineTo(W-8,GND_R);ctx.stroke();ctx.restore();

  // Angle arc
  ctx.save();ctx.strokeStyle='#fbbf24';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(RBX,GND_R,24,-ang,0,true);ctx.stroke();ctx.restore();
  label(ctx,ang_deg.toFixed(0)+'°',RBX+30,GND_R-11,'#fbbf24',8.5);

  // Block on incline
  const bDist=incLen*0.48;
  const bCX=RBX+bDist*cosA, bCY=GND_R-bDist*sinA;
  ctx.save();ctx.translate(bCX,bCY);ctx.rotate(-ang);
  ctx.fillStyle='rgba(239,68,68,.85)';ctx.strokeStyle='#f87171';ctx.lineWidth=1.8;
  ctx.beginPath();ctx.roundRect(-13,-11,26,22,4);ctx.fill();ctx.stroke();
  ctx.fillStyle='#fecaca';ctx.font='bold 7px Heebo';ctx.textAlign='center';ctx.fillText(m+'kg',0,3);
  ctx.restore();

  // N arrow (perpendicular to incline)
  const N_inc=m*g*cosA;
  const NX=-sinA*N_inc*0.45, NY=-cosA*N_inc*0.45;
  arrow(ctx,bCX,bCY,bCX+NX,bCY+NY,'#34d399',2.5,9);
  label(ctx,'N='+N_inc.toFixed(1)+'N',bCX+NX-2,bCY+NY-8,'#34d399',8,'right');
  // W arrow down
  arrow(ctx,bCX,bCY,bCX,bCY+m*g*0.38,'#ef4444',2,8);
  label(ctx,'W',bCX+4,bCY+m*g*0.20,'#fca5a5',8,'left');

  label(ctx,'מדרון θ='+ang_deg.toFixed(0)+'°',RBX+incLen*0.5,H-10,'#64748b',8,'center');
  label(ctx,'N = mg·cosθ = '+N_inc.toFixed(1)+' N',RBX+incLen*0.5,H-20,'#34d399',8,'center');
});

// ── CH3 ANIM: anim-force-types — four main forces on one object, cycling
runAnim('anim-force-types',(canvas,ctx,W,H,t)=>{
  bg(ctx,W,H);
  // Show block on surface with all 4 forces: W, N, F_applied, f_friction
  const GND=H-32;
  const g=9.8, m=4, mu=0.3, F_app=22;
  const N_f=m*g, f_k=mu*N_f;
  const a_net=(F_app-f_k)/m;

  // Ground
  ctx.save();ctx.strokeStyle='#1e4060';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(14,GND);ctx.lineTo(W-14,GND);ctx.stroke();ctx.restore();
  ctx.save();ctx.strokeStyle='rgba(30,64,96,.3)';ctx.lineWidth=0.7;
  for(let x=14;x<W-14;x+=11){ctx.beginPath();ctx.moveTo(x,GND);ctx.lineTo(x+7,GND+5);ctx.stroke();}
  ctx.restore();

  // Animate block position
  const PERIOD=5, tt=t%PERIOD;
  const bX_start=W*0.25, bW=40, bH=28;
  const dist=Math.min(0.5*a_net*tt*tt*18, W*0.42);
  const bCX=bX_start+dist;
  const bY=GND-bH;

  // Block
  const bg_block=ctx.createLinearGradient(bCX-bW/2,bY,bCX+bW/2,bY+bH);
  bg_block.addColorStop(0,'rgba(37,99,235,.88)');bg_block.addColorStop(1,'rgba(15,40,120,.75)');
  ctx.save();ctx.fillStyle=bg_block;ctx.strokeStyle='#60a5fa';ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(bCX-bW/2,bY,bW,bH,5);ctx.fill();ctx.stroke();ctx.restore();
  label(ctx,m+'kg',bCX,bY+bH/2+2,'#fff',8.5,'center');

  const FSCALE=1.8;

  // W — Weight (down)
  arrow(ctx,bCX,bY+bH,bCX,bY+bH+N_f*FSCALE*0.3,'#ef4444',2.5,10);
  label(ctx,'W=mg',bCX+4,bY+bH+N_f*FSCALE*0.16,'#fca5a5',8.5,'left');
  label(ctx,N_f.toFixed(0)+'N ↓',bCX+4,bY+bH+N_f*FSCALE*0.28,'#fca5a5',7.5,'left');

  // N — Normal force (up)
  arrow(ctx,bCX,bY,bCX,bY-N_f*FSCALE*0.3,'#34d399',2.5,10);
  label(ctx,'N=mg',bCX-4,bY-N_f*FSCALE*0.16,'#34d399',8.5,'right');
  label(ctx,N_f.toFixed(0)+'N ↑',bCX-4,bY-N_f*FSCALE*0.28,'#6ee7b7',7.5,'right');

  // F_applied (right)
  arrow(ctx,bCX+bW/2,bY+bH/2,bCX+bW/2+F_app*FSCALE,bY+bH/2,'#fbbf24',3,11);
  label(ctx,'F='+F_app+'N →',bCX+bW/2+F_app*FSCALE/2,bY+bH/2-12,'#fbbf24',8.5,'center');

  // Friction (left)
  arrow(ctx,bCX-bW/2,bY+bH/2,bCX-bW/2-f_k*FSCALE,bY+bH/2,'#a78bfa',2.5,10);
  label(ctx,'f=μN='+f_k.toFixed(0)+'N ←',bCX-bW/2-f_k*FSCALE/2,bY+bH/2-12,'#a78bfa',8,'center');

  // Net force label
  const net=F_app-f_k;
  arrow(ctx,bCX,bY-N_f*FSCALE*0.36,bCX+(net>0?1:-1)*Math.min(Math.abs(net)*FSCALE,50),bY-N_f*FSCALE*0.36,'#f59e0b',2,9);
  label(ctx,'ΣF='+net.toFixed(0)+'N → a='+a_net.toFixed(2)+' m/s²',bCX,bY-N_f*FSCALE*0.36-10,'#f59e0b',8.5,'center');

  // Legend panel
  ctx.save();ctx.fillStyle='rgba(6,14,28,.88)';ctx.strokeStyle='#1e3a52';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(8,6,W-16,20,4);ctx.fill();ctx.stroke();ctx.restore();
  label(ctx,'ארבעת הכוחות: W↓ כובד | N↑ נורמלי | F→ מופעל | f← חיכוך',W/2,17,'#94a3b8',8,'center');
});

// ── CH7 ANIM: Impulse — F·Δt = Δp, compare two scenarios
runAnim('anim-impulse',(canvas,ctx,W,H,t)=>{
  bg(ctx,W,H);
  const PERIOD=5, tt=t%PERIOD;
  // Two scenarios: large F short Δt vs small F long Δt — same Δp
  const scenarios=[
    {F:600, dt:0.1,  col:'#ef4444', lbl:'כוח גדול, זמן קצר'},
    {F:60,  dt:1.0,  col:'#3b82f6', lbl:'כוח קטן, זמן ארוך'},
  ];
  const J=60; // same impulse for both: F×dt=60
  const panel_h=H/2-4;

  scenarios.forEach((sc,idx)=>{
    const panelY=idx*(panel_h+4)+2;
    const bx=18, bw=W-36;

    // Panel bg
    ctx.save();ctx.fillStyle='rgba(6,14,28,.6)';ctx.strokeStyle=sc.col+'55';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(bx,panelY,bw,panel_h-2,5);ctx.fill();ctx.stroke();ctx.restore();

    // Label
    label(ctx,sc.lbl+' — F='+sc.F+'N, Δt='+sc.dt+'s',bx+bw/2,panelY+11,sc.col,8,'center');

    // F-t graph (force vs time)
    const graphX=bx+10, graphY=panelY+16, graphW=bw*0.46, graphH=panel_h-28;
    // Axes
    arrow(ctx,graphX,graphY+graphH,graphX+graphW,graphY+graphH,sc.col+'66',1,5);
    arrow(ctx,graphX,graphY+graphH,graphX,graphY,sc.col+'66',1,5);
    label(ctx,'t',graphX+graphW+4,graphY+graphH+2,sc.col+'88',7.5);
    label(ctx,'F',graphX-2,graphY-2,sc.col+'88',7.5);

    // Pulse rectangle (area = J = Δp)
    const pulseW=graphW*sc.dt*0.85;
    const pulseH=graphH*(sc.F/600)*0.85;
    ctx.save();ctx.fillStyle=sc.col+'33';
    ctx.fillRect(graphX+2,graphY+graphH-pulseH,pulseW,pulseH);
    ctx.strokeStyle=sc.col+'aa';ctx.lineWidth=1.8;
    ctx.strokeRect(graphX+2,graphY+graphH-pulseH,pulseW,pulseH);
    ctx.restore();

    // Shaded area label
    label(ctx,'J=F·Δt='+J+' N·s',graphX+2+pulseW/2,graphY+graphH-pulseH/2+3,sc.col,7.5,'center');

    // Δp bar (right side)
    const dpX=bx+bw*0.60, dpW=bw*0.35;
    label(ctx,'Δp = '+J+' kg·m/s',dpX+dpW/2,panelY+14,sc.col,7.5,'center');
    // Bar background
    ctx.save();ctx.fillStyle='rgba(15,30,55,.7)';
    ctx.beginPath();ctx.roundRect(dpX,panelY+18,dpW,12,3);ctx.fill();ctx.restore();
    // Animated fill
    const fillFrac=Math.min(tt/PERIOD*2*(idx===0?1:0.5),1);
    ctx.save();ctx.fillStyle=sc.col+'cc';
    ctx.beginPath();ctx.roundRect(dpX,panelY+18,dpW*fillFrac,12,3);ctx.fill();ctx.restore();

    // Ball with momentum arrow
    const ballY=panelY+panel_h-20;
    const v=J/2; // p/m, m=2kg assumed
    const ballX=dpX+14+fillFrac*(dpW-28);
    circle(ctx,ballX,ballY,9,sc.col+'bb',sc.col,1.8);
    if(fillFrac>0.05){
      arrow(ctx,ballX,ballY,ballX+v*fillFrac*0.35,ballY,sc.col,2,7);
    }
  });

  // Shared result banner
  ctx.save();ctx.fillStyle='rgba(6,14,28,.9)';ctx.strokeStyle='rgba(251,191,36,.4)';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(W/2-100,H/2-10,200,18,4);ctx.fill();ctx.stroke();ctx.restore();
  label(ctx,'שניהם: Δp = J = 60 kg·m/s — שווה!',W/2,H/2+2,'#fbbf24',8,'center');
});

// ── CH7 ANIM: Rocket propulsion — conservation of momentum
runAnim('anim-rocket',(canvas,ctx,W,H,t)=>{
  bg(ctx,W,H);
  const PERIOD=5, tt=t%PERIOD;
  const phase=tt/PERIOD;

  // Rocket moves right, gas jet left
  const rocketX=W*0.25+phase*(W*0.52);
  const rocketY=H*0.42;

  // Stars background
  ctx.save();ctx.fillStyle='rgba(255,255,255,.6)';
  [[W*0.08,H*0.15],[W*0.25,H*0.08],[W*0.55,H*0.12],[W*0.72,H*0.25],[W*0.88,H*0.10],
   [W*0.15,H*0.32],[W*0.42,H*0.28],[W*0.78,H*0.38],[W*0.92,H*0.55]].forEach(([sx,sy])=>{
    ctx.beginPath();ctx.arc(sx,sy,1.2,0,Math.PI*2);ctx.fill();
  });
  ctx.restore();

  // Gas trail (particles ejected left)
  const nGas=12;
  for(let i=0;i<nGas;i++){
    const gx=rocketX-32-i*14-phase*8;
    const gy=rocketY+(Math.sin(i*2.3+t*4)*6);
    const alpha=(1-i/nGas)*0.7;
    const r=4-i*0.25;
    if(r>0.5){
      ctx.save();ctx.globalAlpha=alpha;
      const gc=ctx.createRadialGradient(gx,gy,0,gx,gy,r*2);
      gc.addColorStop(0,'#fbbf24');gc.addColorStop(0.5,'#ef4444');gc.addColorStop(1,'transparent');
      ctx.fillStyle=gc;ctx.beginPath();ctx.arc(gx,gy,r*2,0,Math.PI*2);ctx.fill();ctx.restore();
    }
  }

  // Rocket body
  ctx.save();
  // Main body
  ctx.fillStyle='#1e3a52';ctx.strokeStyle='#60a5fa';ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(rocketX-20,rocketY-10,40,22,5);ctx.fill();ctx.stroke();
  // Nose cone
  ctx.fillStyle='#3b82f6';ctx.beginPath();
  ctx.moveTo(rocketX+20,rocketY+1);ctx.lineTo(rocketX+36,rocketY+6);ctx.lineTo(rocketX+20,rocketY+12);
  ctx.closePath();ctx.fill();ctx.stroke();
  // Nozzle
  ctx.fillStyle='#374151';ctx.beginPath();
  ctx.moveTo(rocketX-20,rocketY+3);ctx.lineTo(rocketX-28,rocketY-2);ctx.lineTo(rocketX-28,rocketY+14);
  ctx.lineTo(rocketX-20,rocketY+9);ctx.closePath();ctx.fill();
  // Window
  ctx.fillStyle='rgba(147,197,253,.3)';ctx.strokeStyle='#60a5fa';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(rocketX+5,rocketY+6,5,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.restore();

  // Velocity arrow (rocket goes right)
  const vRocket=phase*60;
  arrow(ctx,rocketX+38,rocketY+4,rocketX+38+Math.min(vRocket,55),rocketY+4,'#34d399',2.5,9);
  label(ctx,'v_רקטה',rocketX+50,rocketY-6,'#34d399',8);

  // Gas velocity arrow (goes left)
  const vGas=80;
  arrow(ctx,rocketX-30,rocketY+8,rocketX-30-Math.min(vGas,65),rocketY+8,'#ef4444',2,8);
  label(ctx,'v_גז',rocketX-44,rocketY+20,'#f87171',8);

// ── CH7 ANIM: Collision types comparison e=1 vs e=0
runAnim('anim-collision-types',(canvas,ctx,W,H,t)=>{
  bg(ctx,W,H);
  // Three collision types in three rows — clear pedagogy
  // m1 approaches from left, m2 at rest
  var m1=3, m2=2, v1i=5, v2i=0;
  // Elastic (e=1)
  var v1f_e=((m1-m2)*v1i+2*m2*v2i)/(m1+m2);   // 1.0
  var v2f_e=(2*m1*v1i+(m2-m1)*v2i)/(m1+m2);    // 6.0
  // Perfectly inelastic (e=0)
  var vf_in=(m1*v1i+m2*v2i)/(m1+m2);           // 3.0
  // Semi-elastic (e=0.5)
  var e2=0.5;
  var v1f_s=((m1-e2*m2)*v1i+(1+e2)*m2*v2i)/(m1+m2);
  var v2f_s=((m2-e2*m1)*v2i+(1+e2)*m1*v1i)/(m1+m2);

  // Each row: approach → collide → separate, then pause, repeat
  var CYCLE=4.5; // seconds per cycle
  var tC=1.8;    // collision time within cycle
  var phase=(t%CYCLE);

  var r1=14, r2=11;
  var SCENE_W=W-32;
  // Start positions: m1 at left+r1+5, m2 at center+30
  var m1_start=r1+8, m2_pos=W*0.60;
  var SPX=3.5; // pixels per second scaling

  var rows=[
    {label:'התנגשות אלסטית (e=1) — Ek נשמרת',
     v1f:v1f_e, v2f:v2f_e, merged:false,
     col1:'#60a5fa', col2:'#34d399', ecol:'#34d399', y:H*0.22,
     ek_before:0.5*m1*v1i*v1i+0.5*m2*v2i*v2i,
     ek_after:0.5*m1*v1f_e*v1f_e+0.5*m2*v2f_e*v2f_e},
    {label:'התנגשות חצי-אלסטית (e=0.5)',
     v1f:v1f_s, v2f:v2f_s, merged:false,
     col1:'#f59e0b', col2:'#fb923c', ecol:'#f59e0b', y:H*0.50,
     ek_before:0.5*m1*v1i*v1i,
     ek_after:0.5*m1*v1f_s*v1f_s+0.5*m2*v2f_s*v2f_s},
    {label:'התנגשות לא-אלסטית מושלמת (e=0) — מתאחדים',
     v1f:vf_in, v2f:vf_in, merged:true,
     col1:'#f87171', col2:'#f87171', ecol:'#f87171', y:H*0.78,
     ek_before:0.5*m1*v1i*v1i,
     ek_after:0.5*(m1+m2)*vf_in*vf_in},
  ];

  rows.forEach(function(row){
    var rowY=row.y;
    var GND=rowY+r1+4;

    // Ground line
    ctx.save();ctx.strokeStyle='rgba(30,64,96,.6)';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(12,GND);ctx.lineTo(W-12,GND);ctx.stroke();ctx.restore();

    // Row label
    ctx.save();ctx.fillStyle='rgba(6,14,28,.85)';ctx.strokeStyle=row.ecol+'44';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(10,rowY-r1-20,W-20,15,3);ctx.fill();ctx.stroke();ctx.restore();
    label(ctx,row.label,W/2,rowY-r1-10,row.ecol,7.5,'center');

    // Compute positions
    var x1,x2,v1c,v2c;
    if(phase<tC){
      // Approach phase
      x1=m1_start+v1i*phase*SPX;
      x2=m2_pos;
      v1c=v1i; v2c=v2i;
    } else {
      // Post-collision phase
      var dt2=phase-tC;
      var cx=m1_start+v1i*tC*SPX; // collision x
      x1=cx+row.v1f*dt2*SPX;
      x2=m2_pos+row.v2f*dt2*SPX;
      v1c=row.v1f; v2c=row.v2f;
    }
    // Clamp to screen
    x1=Math.max(r1+4,Math.min(W-r1-4,x1));
    x2=Math.max(r2+4,Math.min(W-r2-4,x2));

    // Draw balls
    if(row.merged && phase>=tC){
      // Merged block
      var mx2=(x1+x2)/2;
      ctx.save();ctx.fillStyle='rgba(185,28,28,.7)';ctx.strokeStyle=row.col1;ctx.lineWidth=2;
      ctx.beginPath();ctx.roundRect(mx2-r1-r2,rowY-r1,r1*2+r2*2,r1*2,4);ctx.fill();ctx.stroke();ctx.restore();
      label(ctx,(m1+m2)+'kg',mx2,rowY+4,'#fff',7.5);
      if(Math.abs(v1c)>0.2){
        arrow(ctx,mx2,rowY-r1-8,mx2+v1c*3.5,rowY-r1-8,row.col1,2,7);
        label(ctx,'v='+v1c.toFixed(2),mx2+v1c*3.5+(v1c>0?4:-4),rowY-r1-8,row.col1,7.5,v1c>0?'left':'right');
      }
    } else {
      // Ball 1
      var g1=ctx.createRadialGradient(x1-r1*0.35,rowY-r1*0.35,r1*0.08,x1,rowY,r1);
      g1.addColorStop(0,'rgba(255,255,255,.45)');g1.addColorStop(1,row.col1+'bb');
      circle(ctx,x1,rowY,r1,g1,row.col1,2);
      label(ctx,m1+'kg',x1,rowY+4,'#fff',7);
      if(Math.abs(v1c)>0.2){
        arrow(ctx,x1,rowY-r1-7,x1+v1c*3.5,rowY-r1-7,row.col1,2,7);
        label(ctx,v1c.toFixed(1),x1+v1c*3.5+(v1c>0?4:-4),rowY-r1-8,row.col1,7.5,v1c>0?'left':'right');
      }
      // Ball 2
      var g2=ctx.createRadialGradient(x2-r2*0.35,rowY-r2*0.35,r2*0.08,x2,rowY,r2);
      g2.addColorStop(0,'rgba(255,255,255,.45)');g2.addColorStop(1,row.col2+'bb');
      circle(ctx,x2,rowY,r2,g2,row.col2,2);
      label(ctx,m2+'kg',x2,rowY+3,'#fff',7);
      if(Math.abs(v2c)>0.2){
        arrow(ctx,x2,rowY-r2-7,x2+v2c*3.5,rowY-r2-7,row.col2,2,7);
        label(ctx,v2c.toFixed(1),x2+v2c*3.5+(v2c>0?4:-4),rowY-r2-8,row.col2,7.5,v2c>0?'left':'right');
      }
    }

    // Collision flash
    var collX=m1_start+v1i*tC*SPX;
    if(phase>=tC && phase<tC+0.45){
      var al=(0.45-(phase-tC))/0.45;
      ctx.save();ctx.globalAlpha=al*0.6;ctx.fillStyle='#fbbf24';
      ctx.beginPath();ctx.arc(collX,rowY,24,0,Math.PI*2);ctx.fill();ctx.restore();
    }

    // Energy / momentum summary after collision
    if(phase>tC+0.5){
      var lostPct=Math.round((1-row.ek_after/row.ek_before)*100);
      var pB=(m1*v1i+m2*v2i), pA=row.merged?(m1+m2)*row.v1f:m1*row.v1f+m2*row.v2f;
      var pOK=Math.abs(pB-pA)<0.2;
      label(ctx,'p: '+pB.toFixed(1)+'→'+pA.toFixed(1)+' '+(pOK?'✅':' '),W*0.80,rowY-r1-2,'#22d3ee',7,'right');
      label(ctx,'Ek: -'+lostPct+'% '+(lostPct===0?'✅':''),W*0.80,rowY+r1+2,row.ecol,7,'right');
    }
  });

  // Header
  ctx.save();ctx.fillStyle='rgba(6,14,28,.88)';ctx.strokeStyle='#1e4060';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(6,4,W-12,18,3);ctx.fill();ctx.stroke();ctx.restore();
  label(ctx,'m₁='+m1+'kg מתנגש עם m₂='+m2+'kg נייח | v₁='+v1i+' m/s | e = מקדם ההשבה',W/2,13,'#64748b',7.5);
});

// ── CH6 ANIM 1: projectile arc (single trajectory, interactive)
runAnim('anim-projectile-arc',(canvas,ctx,W,H,t)=>{
  bg(ctx,W,H);
  const g=9.8, v0=22;
  // Angle cycles smoothly 20°→70°→20° every 6 s
  const PERIOD=6;
  const phase=(t%PERIOD)/PERIOD;
  const theta_deg=20+50*Math.abs(Math.sin(phase*Math.PI));
  const theta=theta_deg*Math.PI/180;
  const cosT=Math.cos(theta), sinT=Math.sin(theta);
  const totalT=2*v0*sinT/g;
  const R=v0*v0*Math.sin(2*theta)/g;
  const Hmax=v0*v0*sinT*sinT/(2*g);

  // Fixed layout: origin at lower-left, scale so max range fits nicely
  const ORIG_X=W*0.07, GND=H-28;
  // Scale: range R→(W*0.86), height Hmax→max available height
  const scaleX=(W*0.86)/Math.max(R,1);
  const availH=GND-36;
  const scaleY=availH/Math.max(Hmax,1)*0.88;
  const scale=Math.min(scaleX, scaleY); // uniform scale

  // Ground line
  ctx.save();
  ctx.strokeStyle='#1e4060'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(ORIG_X-8,GND); ctx.lineTo(ORIG_X+R*scale+30,GND); ctx.stroke();
  // hatching under ground
  ctx.strokeStyle='rgba(30,64,96,.4)'; ctx.lineWidth=1;
  for(var xi=ORIG_X-8;xi<ORIG_X+R*scale+30;xi+=14){
    ctx.beginPath(); ctx.moveTo(xi,GND); ctx.lineTo(xi+8,GND+8); ctx.stroke();
  }
  ctx.restore();

  // Dashed trajectory arc
  ctx.save(); ctx.strokeStyle='rgba(96,165,250,.28)'; ctx.lineWidth=2; ctx.setLineDash([5,6]);
  ctx.beginPath();
  for(var i=0;i<=80;i++){
    var ti=i/80*totalT;
    var px=ORIG_X+v0*cosT*ti*scale;
    var py=GND-(v0*sinT*ti-0.5*g*ti*ti)*scale;
    i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
  }
  ctx.stroke(); ctx.setLineDash([]); ctx.restore();

  // Trail dots
  var tNow=Math.min((t%PERIOD)/(PERIOD/(totalT)), totalT);
  for(var ti2=tNow-0.6;ti2<tNow;ti2+=0.08){
    if(ti2<0)continue;
    var tpa=Math.min(ti2,totalT);
    var trx=ORIG_X+v0*cosT*tpa*scale;
    var try2=GND-(v0*sinT*tpa-0.5*g*tpa*tpa)*scale;
    var alpha=(ti2-(tNow-0.6))/0.6*0.5;
    ctx.save(); ctx.globalAlpha=alpha; ctx.fillStyle='#fbbf24';
    ctx.beginPath(); ctx.arc(trx,try2,3,0,Math.PI*2); ctx.fill(); ctx.restore();
  }

  // Current ball
  var bx=ORIG_X+v0*cosT*tNow*scale;
  var by=GND-(v0*sinT*tNow-0.5*g*tNow*tNow)*scale;
  var vx2=v0*cosT, vy2=v0*sinT-g*tNow;

  // Ball glow
  var grd=ctx.createRadialGradient(bx,by,0,bx,by,12);
  grd.addColorStop(0,'rgba(250,204,21,.95)'); grd.addColorStop(1,'rgba(217,119,6,0)');
  ctx.save(); ctx.fillStyle=grd;
  ctx.beginPath(); ctx.arc(bx,by,12,0,Math.PI*2); ctx.fill(); ctx.restore();
  circle(ctx,bx,by,7,'#f59e0b','#fde68a',2);

  // Velocity vectors
  var VS=2.2;
  // Total v (green)
  arrow(ctx,bx,by,bx+vx2*VS,by-vy2*VS,'#34d399',2.5,9);
  // vx (blue, horizontal)
  if(Math.abs(vx2)>0.5){
    arrow(ctx,bx,by,bx+vx2*VS,by,'#60a5fa',1.8,7);
    label(ctx,'vx='+vx2.toFixed(1),bx+vx2*VS/2,by+13,'#60a5fa',8);
  }
  // vy (red, vertical)
  if(Math.abs(vy2)>0.5){
    arrow(ctx,bx,by,bx,by-vy2*VS,'#f87171',1.8,7);
    var vy_label_x=bx+(vy2>0?12:-12)*0;
    label(ctx,'vy='+vy2.toFixed(1),bx+14,by-vy2*VS/2,'#f87171',8,'left');
  }

  // Angle arc and label at origin
  ctx.save(); ctx.strokeStyle='#fbbf24'; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.arc(ORIG_X,GND,24,-theta,0,true); ctx.stroke(); ctx.restore();
  label(ctx,theta_deg.toFixed(0)+'°',ORIG_X+28,GND-10,'#fbbf24',9.5);

  // Launch arrow at origin
  arrow(ctx,ORIG_X,GND,ORIG_X+cosT*36,GND-sinT*36,'#fbbf24',2,8);

  // Height marker at apex
  var tApex=v0*sinT/g;
  var apexX=ORIG_X+v0*cosT*tApex*scale;
  var apexY=GND-Hmax*scale;
  if(apexX<W-24 && apexY>30){
    ctx.save(); ctx.strokeStyle='rgba(167,139,250,.5)'; ctx.lineWidth=1; ctx.setLineDash([3,4]);
    ctx.beginPath(); ctx.moveTo(apexX,apexY); ctx.lineTo(apexX,GND); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
    // H dimension arrows
    arrow(ctx,apexX+14,GND,apexX+14,apexY+4,'#a78bfa',1.5,6);
    label(ctx,'H='+Hmax.toFixed(1)+'m',apexX+22,apexY+Math.min(Hmax*scale/2,40),'#a78bfa',8.5,'left');
  }

  // Range marker at landing
  var landX=ORIG_X+R*scale;
  if(landX<W-10){
    ctx.save(); ctx.strokeStyle='rgba(248,113,133,.4)'; ctx.lineWidth=1; ctx.setLineDash([3,4]);
    ctx.beginPath(); ctx.moveTo(landX,GND-4); ctx.lineTo(landX,GND+12); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
    // R dimension arrow
    ctx.save(); ctx.strokeStyle='rgba(248,113,133,.6)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(ORIG_X,GND+18); ctx.lineTo(landX,GND+18); ctx.stroke(); ctx.restore();
    arrow(ctx,ORIG_X,GND+18,ORIG_X+8,GND+18,'rgba(248,113,133,.7)',1.5,5);
    arrow(ctx,landX,GND+18,landX-8,GND+18,'rgba(248,113,133,.7)',1.5,5);
    label(ctx,'R='+R.toFixed(1)+'m',(ORIG_X+landX)/2,GND+26,'#f87171',8);
  }

  // Info banner (top)
  ctx.save(); ctx.fillStyle='rgba(6,12,24,.88)'; ctx.strokeStyle='rgba(30,58,82,.8)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(6,6,W-12,28,4); ctx.fill(); ctx.stroke(); ctx.restore();
  var speed=Math.sqrt(vx2*vx2+vy2*vy2);
  label(ctx,'θ='+theta_deg.toFixed(0)+'°   v₀='+v0+' m/s   R='+R.toFixed(1)+'m   H='+Hmax.toFixed(1)+'m   |v|='+speed.toFixed(1)+'m/s',W/2,19,'#94a3b8',8.5);
});

// ── CH6 ANIM 2: range vs angle
runAnim('anim-projectile-range',(canvas,ctx,W,H,t)=>{
  bg(ctx,W,H);
  const g=9.8, v0=18;
  const R_max=v0*v0/g;
  const marginL=36, marginR=18, marginT=16, marginB=26;
  const GW=W-marginL-marginR, GH=H-marginT-marginB;

  // Axes
  arrow(ctx,marginL,marginT+GH,marginL+GW+8,marginT+GH,'#2d5275',1.5,7);
  arrow(ctx,marginL,marginT+GH,marginL,marginT-8,'#2d5275',1.5,7);
  label(ctx,'θ (°)',marginL+GW+4,marginT+GH+3,'#4a7595',9,'left');
  label(ctx,'R (m)',marginL-4,marginT-2,'#4a7595',9,'right');

  // Grid
  ctx.save();ctx.strokeStyle='rgba(30,64,96,.35)';ctx.lineWidth=0.6;ctx.setLineDash([3,5]);
  [0,30,45,60,90].forEach(deg=>{
    const px=marginL+deg/90*GW;
    ctx.beginPath();ctx.moveTo(px,marginT);ctx.lineTo(px,marginT+GH);ctx.stroke();
    label(ctx,deg+'°',px,marginT+GH+12,'#2d5275',8);
  });
  [0,0.25,0.5,0.75,1].forEach(f=>{
    const py=marginT+GH-f*GH;
    ctx.beginPath();ctx.moveTo(marginL,py);ctx.lineTo(marginL+GW,py);ctx.stroke();
    if(f>0) label(ctx,(f*R_max).toFixed(0),marginL-4,py+3,'#2d5275',7.5,'right');
  });
  ctx.restore();ctx.setLineDash([]);

  // R(θ) curve
  ctx.save();ctx.strokeStyle='#60a5fa';ctx.lineWidth=2.5;ctx.beginPath();
  for(let i=0;i<=90;i++){
    const th=i*Math.PI/180;
    const R=v0*v0*Math.sin(2*th)/g;
    const px=marginL+i/90*GW;
    const py=marginT+GH-R/R_max*GH;
    i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
  }
  ctx.stroke();ctx.restore();

  // Complementary-pair highlight
  const PERIOD=6;
  const th1_deg=10+35*((t%PERIOD)/PERIOD);
  const th2_deg=90-th1_deg;
  [th1_deg,th2_deg].forEach((deg,idx)=>{
    const th=deg*Math.PI/180;
    const R=v0*v0*Math.sin(2*th)/g;
    const px=marginL+deg/90*GW;
    const py=marginT+GH-R/R_max*GH;
    const col=idx===0?'#f59e0b':'#34d399';
    circle(ctx,px,py,5,col,col,2);
    ctx.save();ctx.strokeStyle=col+'80';ctx.lineWidth=1;ctx.setLineDash([3,4]);
    ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px,marginT+GH);ctx.stroke();
    ctx.setLineDash([]);ctx.restore();
    label(ctx,deg.toFixed(0)+'°',px,py-10,col,8.5);
  });

  // 45° marker
  const px45=marginL+45/90*GW;
  ctx.save();ctx.strokeStyle='rgba(167,139,250,.6)';ctx.lineWidth=1.5;ctx.setLineDash([4,5]);
  ctx.beginPath();ctx.moveTo(px45,marginT);ctx.lineTo(px45,marginT+GH);ctx.stroke();
  ctx.setLineDash([]);ctx.restore();
  label(ctx,'Rmax @ 45°',px45+4,marginT+12,'#a78bfa',8);

  // Title
  label(ctx,'R = v₀²·sin2θ / g',W/2,marginT+GH+22,'#64748b',8.5);
});

// ── CH6 ANIM 3: circular motion with velocity/acceleration vectors
runAnim('anim-circular',(canvas,ctx,W,H,t)=>{
  bg(ctx,W,H);
  const CX=W*0.46, CY=H*0.52;
  const R=Math.min(W,H)*0.28;
  const omega=0.8; // rad/s
  const angle=omega*t;
  const px=CX+R*Math.cos(angle);
  const py=CY+R*Math.sin(angle);
  const v=R*omega; // speed

  // Circle track
  ctx.save();ctx.strokeStyle='#1e3a52';ctx.lineWidth=2;
  ctx.setLineDash([6,6]);ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.stroke();
  ctx.setLineDash([]);ctx.restore();

  // Center dot
  circle(ctx,CX,CY,3,'#2d5275','#3b82f6',1.5);

  // Radius line
  ctx.save();ctx.strokeStyle='rgba(59,130,246,.3)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(CX,CY);ctx.lineTo(px,py);ctx.stroke();ctx.restore();
  label(ctx,'R',CX+(px-CX)*0.5+6,CY+(py-CY)*0.5,'#3b82f6',9);

  // Velocity vector (tangent)
  const vx_dir=-Math.sin(angle);
  const vy_dir=Math.cos(angle);
  const VSCALE=38;
  arrow(ctx,px,py,px+vx_dir*VSCALE,py+vy_dir*VSCALE,'#34d399',2.5,10);
  label(ctx,'v',px+vx_dir*VSCALE+5,py+vy_dir*VSCALE,'#34d399',10);

  // Centripetal acceleration (towards center)
  const ax_dir=CX-px, ay_dir=CY-py;
  const alen=Math.sqrt(ax_dir*ax_dir+ay_dir*ay_dir);
  const ASCALE=28;
  arrow(ctx,px,py,px+ax_dir/alen*ASCALE,py+ay_dir/alen*ASCALE,'#f87171',2.5,10);
  label(ctx,'ac',px+ax_dir/alen*ASCALE-10,py+ay_dir/alen*ASCALE-4,'#f87171',10);

  // Ball
  const grd=ctx.createRadialGradient(px-3,py-3,1,px,py,10);
  grd.addColorStop(0,'#fde68a');grd.addColorStop(1,'#d97706');
  circle(ctx,px,py,10,grd,'#fbbf24',2);

  // Info panel
  const ac=v*v/R;
  ctx.save();ctx.fillStyle='rgba(6,14,28,.88)';ctx.strokeStyle='#1e3a52';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(W-110,6,104,58,5);ctx.fill();ctx.stroke();ctx.restore();

runAnim('anim-circular-force',(canvas,ctx,W,H,t)=>{
  bg(ctx,W,H);
  const PERIOD=9;
  const tt=t%PERIOD;
  const scene=Math.floor(tt/3); // 0=string, 1=road, 2=satellite
  const tp=tt%3;

  const titles=['חוט מסתובב','כביש מעוקל','לוויין במסלול'];
  const cols=['#60a5fa','#34d399','#a78bfa'];
  const descs=['T מספק Fc = mv²/R','N − mg cos θ = mv²/R','כבידה מספקת Fc = GMm/R²'];

  // Title
  ctx.save();ctx.fillStyle='rgba(6,14,28,.85)';ctx.strokeStyle='#1e3a52';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(6,4,W-12,22,4);ctx.fill();ctx.stroke();ctx.restore();
  label(ctx,titles[scene]+' — '+descs[scene],W/2,16,cols[scene],8.5);

  const CX=W/2, CY=H*0.52, R=Math.min(W,H)*0.27;
  const omega=1.1;
  const angle=omega*tp;
  const px=CX+R*Math.cos(angle);
  const py=CY+R*Math.sin(angle);

  // Track
  ctx.save();ctx.strokeStyle='rgba(30,64,96,.5)';ctx.lineWidth=1.5;ctx.setLineDash([5,6]);
  ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.restore();

  if(scene===0){
    // String
    ctx.save();ctx.strokeStyle='#60a5fa';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(CX,CY);ctx.lineTo(px,py);ctx.stroke();ctx.restore();
    circle(ctx,CX,CY,4,'#1e3a52','#60a5fa',1.5);
    // Tension arrow toward center
    const dx=(CX-px),dy=(CY-py),d=Math.sqrt(dx*dx+dy*dy);
    arrow(ctx,px,py,px+dx/d*35,py+dy/d*35,'#60a5fa',2,9);
    label(ctx,'T',px+dx/d*42,py+dy/d*42,'#60a5fa',10);
  } else if(scene===1){
    // Road — car on curved road
    ctx.save();ctx.fillStyle='#1a3a26';
    ctx.beginPath();ctx.arc(CX,CY,R+10,0,Math.PI*2);ctx.arc(CX,CY,R-10,0,Math.PI*2,true);ctx.fill();ctx.restore();
    // Normal arrow up
    const nx=(px-CX)/R, ny=(py-CY)/R;
    arrow(ctx,px,py,px+nx*36,py+ny*36,'#34d399',2,9);
    label(ctx,'N',px+nx*44,py+ny*44,'#34d399',10);
    arrow(ctx,px,py,px,py+28,'#ef4444',2,9);
    label(ctx,'mg',px+10,py+22,'#ef4444',9);
    // Car box
    ctx.save();ctx.fillStyle='#0f2d1a';ctx.strokeStyle='#34d399';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.roundRect(px-9,py-9,18,14,3);ctx.fill();ctx.stroke();ctx.restore();
  } else {
    // Satellite
    // Earth
    const earthGrad=ctx.createRadialGradient(CX-4,CY-4,2,CX,CY,18);
    earthGrad.addColorStop(0,'#1e5a8a');earthGrad.addColorStop(1,'#0f3052');
    circle(ctx,CX,CY,18,earthGrad,'#2563eb',2);
    label(ctx,'🌍',CX,CY+5,'#fff',14,'center');
    // Gravity arrow toward Earth
    const dx2=(CX-px),dy2=(CY-py),d2=Math.sqrt(dx2*dx2+dy2*dy2);
    arrow(ctx,px,py,px+dx2/d2*32,py+dy2/d2*32,'#a78bfa',2,9);
    label(ctx,'Fg',px+dx2/d2*40,py+dy2/d2*40,'#a78bfa',10);
    // Satellite
    ctx.save();ctx.fillStyle='#312e81';ctx.strokeStyle='#818cf8';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.roundRect(px-8,py-5,16,10,2);ctx.fill();ctx.stroke();
    // Solar panels
    ctx.fillStyle='#1e3a52';ctx.strokeStyle='#60a5fa';ctx.lineWidth=1;
    ctx.fillRect(px-18,py-3,9,6);ctx.strokeRect(px-18,py-3,9,6);
    ctx.fillRect(px+9,py-3,9,6);ctx.strokeRect(px+9,py-3,9,6);
    ctx.restore();
  }

  // Ball/moving object
  const col=cols[scene];
  const grd2=ctx.createRadialGradient(px-2,py-2,1,px,py,8);
  grd2.addColorStop(0,'rgba(255,255,255,.5)');grd2.addColorStop(1,col+'80');
  if(scene===0) circle(ctx,px,py,8,col,'#fff',1.5);

  // Velocity arrow
  const vx_dir=-Math.sin(angle), vy_dir=Math.cos(angle);
  arrow(ctx,px,py,px+vx_dir*28,py+vy_dir*28,'#fbbf24',2,8);
  label(ctx,'v',px+vx_dir*36,py+vy_dir*36,'#fbbf24',9);
});

runAnim('anim-n2apps2',(canvas,ctx,W,H,t)=>{
  ctx.fillStyle='#030d1a'; ctx.fillRect(0,0,W,H);
  var g=9.8, m1=3, m2=5;
  var a=(m2-m1)/(m1+m2)*g;    // 2.45 m/s² — m2 descends
  var T=2*m1*m2*g/(m1+m2);    // 36.75 N
  var PX=W*0.50, CEIL_Y=18, PR=16;
  var bW1=36, bH1=28, bW2=46, bH2=36;

  // Rope parameters
  var RopeAttach=CEIL_Y+PR;
  var RopeBot=H-Math.max(bH1,bH2)-14;
  var RopeLen=RopeBot-RopeAttach;
  var rx1=PX-PR+3, rx2=PX+PR-3;

  // Physics: m2 descends. CYCLE based on RopeLen / a
  var HALF=Math.sqrt(2*RopeLen*0.5/a); // time to travel half rope
  var CYCLE=HALF*2;
  var tc=t%CYCLE;
  var drop; // pixels m2 has dropped below midpoint
  if(tc<HALF){
    drop=0.5*a*tc*tc*50;  // 50 = pixels per m/s²
  } else {
    var tr=tc-HALF;
    drop=0.5*a*HALF*HALF*50-0.5*a*tr*tr*50;
  }
  drop=Math.max(0,Math.min(RopeLen/2,drop));
  var y2=RopeAttach+RopeLen/2+drop;  // m2 top
  var y1=RopeAttach+RopeLen/2-drop;  // m1 top
  y1=Math.max(RopeAttach+2,y1);
  y2=Math.min(RopeBot,y2);

  // Ceiling
  ctx.save();ctx.fillStyle='#1e3a52';ctx.fillRect(PX-28,0,56,CEIL_Y);
  for(var xi=PX-26;xi<PX+26;xi+=10){
    ctx.strokeStyle='#2d5275';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(xi,0);ctx.lineTo(xi-6,CEIL_Y);ctx.stroke();
  }
  ctx.restore();

  // Pulley
  ctx.save();ctx.strokeStyle='#60a5fa';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(PX,CEIL_Y+PR,PR,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='#3b82f6';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(PX,CEIL_Y+PR,PR*0.45,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#0f2035';ctx.beginPath();ctx.arc(PX,CEIL_Y+PR,4,0,Math.PI*2);ctx.fill();ctx.restore();

  // Ropes
  ctx.save();ctx.strokeStyle='#94a3b8';ctx.lineWidth=2.5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(rx1,RopeAttach);ctx.lineTo(rx1,y1);ctx.stroke();
  ctx.beginPath();ctx.moveTo(rx2,RopeAttach);ctx.lineTo(rx2,y2);ctx.stroke();
  ctx.restore();

  // Mass 1 (m₁ = 3kg, blue, ascends when m2>m1)
  ctx.save();ctx.fillStyle='rgba(239,68,68,.85)';ctx.strokeStyle='#f87171';ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(rx1-bW1/2,y1,bW1,bH1,4);ctx.fill();ctx.stroke();ctx.restore();
  label(ctx,'m₁='+m1+'kg',rx1,y1+bH1/2+4,'#fecaca',8.5,'center');

  // Mass 2 (m₂ = 5kg, red, descends)
  ctx.save();ctx.fillStyle='rgba(59,130,246,.85)';ctx.strokeStyle='#60a5fa';ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(rx2-bW2/2,y2,bW2,bH2,4);ctx.fill();ctx.stroke();ctx.restore();
  label(ctx,'m₂='+m2+'kg',rx2,y2+bH2/2+4,'#bfdbfe',8.5,'center');

  // T arrows (upward from TOP of each mass, toward pulley)
  var tLen=Math.min(T*0.5,44);
  if(y1-tLen>=RopeAttach){
    arrow(ctx,rx1,y1,rx1,y1-tLen,'#34d399',2.5,10);
    label(ctx,'T='+T.toFixed(0)+'N',rx1-5,y1-tLen/2,'#34d399',8,'right');
  }
  if(y2-tLen>=RopeAttach){
    arrow(ctx,rx2,y2,rx2,y2-tLen,'#34d399',2.5,10);
    label(ctx,'T='+T.toFixed(0)+'N',rx2+5,y2-tLen/2,'#34d399',8,'left');
  }

  // Weight arrows (downward from BOTTOM of each mass, clamped)
  var w1Len=Math.min(m1*g*0.5,40);
  var w2Len=Math.min(m2*g*0.5,50);
  if(y1+bH1+w1Len<H-4) arrow(ctx,rx1,y1+bH1,rx1,y1+bH1+w1Len,'#fbbf24',2,9);
  label(ctx,'W₁='+(m1*g).toFixed(0)+'N',rx1-5,Math.min(y1+bH1+w1Len+10,H-4),'#fbbf24',7.5,'right');
  if(y2+bH2+w2Len<H-4) arrow(ctx,rx2,y2+bH2,rx2,y2+bH2+w2Len,'#fbbf24',2,9);
  label(ctx,'W₂='+(m2*g).toFixed(0)+'N',rx2+5,Math.min(y2+bH2+w2Len+10,H-4),'#fbbf24',7.5,'left');

  // Acceleration arrows (on outer sides of masses)
  var aLen=Math.min(a*8,30);
  if(aLen>4){
    // m1 goes UP: arrow upward on left
    arrow(ctx,rx1-bW1/2-12,y1+bH1/2,rx1-bW1/2-12,y1+bH1/2-aLen,'#22d3ee',2,8);
    label(ctx,'a',rx1-bW1/2-18,y1+bH1/2-aLen-4,'#22d3ee',8,'right');
    // m2 goes DOWN: arrow downward on right
    arrow(ctx,rx2+bW2/2+12,y2+bH2/2,rx2+bW2/2+12,y2+bH2/2+aLen,'#22d3ee',2,8);
  }

  // Formula banner at bottom
  ctx.save();ctx.fillStyle='rgba(6,14,28,.9)';ctx.strokeStyle='#1e4060';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(4,H-30,W-8,26,3);ctx.fill();ctx.stroke();ctx.restore();
  label(ctx,'a=(m₂-m₁)g/(m₁+m₂)='+a.toFixed(2)+' m/s²',W/2,H-18,'#22d3ee',8,'center');
  label(ctx,'T=2m₁m₂g/(m₁+m₂)='+T.toFixed(1)+' N',W/2,H-6,'#34d399',8,'center');
});

runAnim('anim-spring2',(canvas,ctx,W,H,t)=>{
  bg(ctx,W,H);
  // Series vs parallel spring oscillation — animated with live physics
  // Series: k_eff = k1*k2/(k1+k2) = 50 N/m → lower frequency
  // Parallel: k_eff = k1+k2 = 200 N/m → higher frequency
  var k1=100,k2=100,mMass=0.5;
  var kS=k1*k2/(k1+k2); // 50
  var kP=k1+k2;         // 200
  var ampPx=28;         // amplitude in pixels
  // Oscillation: x(t) = A*cos(ω*t), ω=sqrt(k/m)
  var omS=Math.sqrt(kS/mMass); // ~10 rad/s
  var omP=Math.sqrt(kP/mMass); // ~20 rad/s
  var xS=ampPx*Math.cos(omS*t); // series mass displacement (downward positive)
  var xP=ampPx*Math.cos(omP*t); // parallel mass displacement

  var CEIL_Y=14;
  var LX=W*0.26, RX=W*0.72;
  var LBW=44, RBW=44; // mass box widths

  // Ceiling fixtures
  ctx.save();ctx.fillStyle='#1e3a52';
  ctx.fillRect(LX-LBW/2,CEIL_Y-8,LBW,8);
  ctx.fillRect(RX-RBW/2,CEIL_Y-8,RBW,8);
  ctx.restore();
  // Hatch marks on ceiling
  ctx.save();ctx.strokeStyle='#2d5275';ctx.lineWidth=1;
  for(var xi=LX-LBW/2;xi<LX+LBW/2;xi+=8){ctx.beginPath();ctx.moveTo(xi,CEIL_Y-8);ctx.lineTo(xi+5,CEIL_Y-12);ctx.stroke();}
  for(var xi2=RX-RBW/2;xi2<RX+RBW/2;xi2+=8){ctx.beginPath();ctx.moveTo(xi2,CEIL_Y-8);ctx.lineTo(xi2+5,CEIL_Y-12);ctx.stroke();}
  ctx.restore();

  function drawSpringV(x,y1,y2,col,lw){
    if(lw===undefined)lw=2;
    var coils=8, len=y2-y1, amp2=9;
    ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(x,y1);
    for(var ci=0;ci<coils;ci++){
      var yc=y1+len*(ci+0.5)/coils;
      ctx.lineTo(x+(ci%2===0?amp2:-amp2),yc);
      ctx.lineTo(x,y1+len*(ci+1)/coils);
    }
    ctx.stroke();ctx.restore();
  }

  // ── LEFT: Series springs ──────────────────────────────────────
  var sEquil=CEIL_Y+90; // equilibrium of joined point between springs
  var mEquil=CEIL_Y+160; // equilibrium of mass
  // Spring 1: ceiling to midpoint (k1)
  var mid1Y=sEquil; // joined point fixed (massless join)
  var mass1Y=mEquil+xS;
  // Natural length split: both springs share displacement when in series
  var x1disp=xS/2, x2disp=xS/2; // each spring extends by half
  drawSpringV(LX,CEIL_Y,mid1Y+(x1disp<0?x1disp:0),x1disp>=0?'rgba(239,68,68,.7)':'rgba(52,211,153,.7)');

// ── OPTICS THEORY MINI-ANIMS ───────────────────────────────────────────────

// ─── shared optics mini-anim helpers ─────────────────────────────────────────
function oBg(ctx,W,H){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0a0e1a');g.addColorStop(1,'#0f172a');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function oRay(ctx,x1,y1,x2,y2,col,lw){
  lw=lw||2;
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw;
  ctx.shadowColor=col;ctx.shadowBlur=10;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  // arrowhead
  var a=Math.atan2(y2-y1,x2-x1),hs=lw*3+5;
  ctx.fillStyle=col;ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-hs*Math.cos(a-0.4),y2-hs*Math.sin(a-0.4));
  ctx.lineTo(x2-hs*Math.cos(a+0.4),y2-hs*Math.sin(a+0.4));
  ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;ctx.restore();
}
function oDash(ctx,x1,y1,x2,y2,col){
  ctx.save();ctx.strokeStyle=col||'#475569';ctx.lineWidth=1;
  ctx.globalAlpha=0.5;ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.setLineDash([]);ctx.restore();
}
function oLbl(ctx,txt,x,y,col,sz){
  ctx.save();ctx.fillStyle=col||'#94a3b8';
  ctx.font=(sz||10)+'px Heebo,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=3;
  ctx.fillText(txt,x,y);ctx.restore();
}
function oPhoton(ctx,x,y,col,r){
  r=r||4;
  ctx.save();ctx.fillStyle=col;
  ctx.shadowColor=col;ctx.shadowBlur=14;
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// ─── 1. EM Spectrum ──────────────────────────────────────────────────────────
runAnim('anim-em-spectrum',(canvas,ctx,W,H,t)=>{
  oBg(ctx,W,H);
  // Spectrum bar
  var barY=H*0.46,barH=22,barX=18,barW=W-36;
  var grad=ctx.createLinearGradient(barX,0,barX+barW,0);
  grad.addColorStop(0,'#9333ea');   // violet 380nm
  grad.addColorStop(0.15,'#6366f1'); // indigo
  grad.addColorStop(0.28,'#3b82f6'); // blue
  grad.addColorStop(0.42,'#22d3ee'); // cyan
  grad.addColorStop(0.55,'#22c55e'); // green
  grad.addColorStop(0.70,'#eab308'); // yellow
  grad.addColorStop(0.82,'#f97316'); // orange
  grad.addColorStop(1,'#ef4444');   // red 700nm
  ctx.save();ctx.shadowColor='rgba(255,255,200,.3)';ctx.shadowBlur=8;
  ctx.fillStyle=grad;
  var rr=barH/2;
  ctx.beginPath();ctx.moveTo(barX+rr,barY);ctx.arcTo(barX+barW,barY,barX+barW,barY+barH,rr);
  ctx.arcTo(barX+barW,barY+barH,barX,barY+barH,rr);ctx.arcTo(barX,barY+barH,barX,barY,rr);
  ctx.arcTo(barX,barY,barX+barW,barY,rr);ctx.closePath();ctx.fill();
  ctx.restore();
  // Moving cursor
  var phase=(t*0.25)%1;
  var cx2=barX+phase*barW;
  // wavelength in nm: 380+phase*320
  var wl=Math.round(380+phase*320);
  var curR,curG,curB;
  if(wl<440){curR=(440-wl)/60*255;curG=0;curB=255;}
  else if(wl<490){curR=0;curG=(wl-440)/50*255;curB=255;}
  else if(wl<510){curR=0;curG=255;curB=(510-wl)/20*255;}
  else if(wl<580){curR=(wl-510)/70*255;curG=255;curB=0;}
  else if(wl<645){curR=255;curG=(645-wl)/65*255;curB=0;}
  else{curR=255;curG=0;curB=0;}
  var curCol='rgb('+Math.round(curR)+','+Math.round(curG)+','+Math.round(curB)+')';
  // Cursor line
  ctx.save();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.globalAlpha=0.8;
  ctx.beginPath();ctx.moveTo(cx2,barY-2);ctx.lineTo(cx2,barY+barH+2);ctx.stroke();
  ctx.restore();
  // Animated wave above cursor
  var waveY=barY-35,waveW=50;
  ctx.save();ctx.strokeStyle=curCol;ctx.lineWidth=1.5;
  ctx.shadowColor=curCol;ctx.shadowBlur=6;
  ctx.beginPath();
  for(var ix=-waveW/2;ix<=waveW/2;ix++){
    var freq=0.5+phase*0.4; // shorter = higher freq
    var wy=waveY+Math.sin((ix/waveW)*Math.PI*2*freq*3+t*5)*10;
    if(ix===-waveW/2)ctx.moveTo(cx2+ix,wy);else ctx.lineTo(cx2+ix,wy);
  }
  ctx.stroke();ctx.restore();
  // Label
  oLbl(ctx,wl+'nm',cx2,barY-50,curCol,10);
  // Axis labels
  oLbl(ctx,'380nm',barX+12,barY+barH+12,'#9333ea',8);
  oLbl(ctx,'700nm',barX+barW-14,barY+barH+12,'#ef4444',8);
  oLbl(ctx,'ספקטרום האור הנראה',W/2,H-8,'#64748b',9);
});

// ─── 2. Refraction speed comparison ─────────────────────────────────────────
runAnim('anim-refr-speed',(canvas,ctx,W,H,t)=>{
  oBg(ctx,W,H);
  var materials=[
    {name:'חלל',n:1.0,col:'#60a5fa'},
    {name:'אוויר',n:1.0003,col:'#93c5fd'},
    {name:'מים',n:1.33,col:'#22d3ee'},
    {name:'זכוכית',n:1.5,col:'#a78bfa'},
    {name:'יהלום',n:2.42,col:'#f472b6'},
  ];
  var bx=14,bw=W-28,bH=16,gap=8,startY=18;
  materials.forEach(function(m,i){
    var y=startY+i*(bH+gap);
    var barLen=Math.round(bw/m.n);
    // Background track
    ctx.save();ctx.fillStyle='rgba(255,255,255,.04)';
    ctx.fillRect(bx,y,bw,bH);
    // Moving bar representing speed
    var maxLen=bw;
    var phase=(t*0.6/m.n)%1;
    var photonX=bx+phase*maxLen;
    // Bar fill
    var g=ctx.createLinearGradient(bx,0,bx+barLen,0);
    g.addColorStop(0,m.col+'44');g.addColorStop(1,m.col+'88');
    ctx.fillStyle=g;ctx.fillRect(bx,y,barLen,bH);

// ─── 5. Concave mirror image formation ──────────────────────────────────────
runAnim('anim-concave-mirror-t',(canvas,ctx,W,H,t)=>{
  oBg(ctx,W,H);
  var vx=W*0.8,cy=H/2,R=H*0.95,f=R/2;
  // Mirror arc: vertex at (vx,cy), center of curvature at (vx-R,cy)
  ctx.save();ctx.strokeStyle='#3b82f6';ctx.lineWidth=2.5;
  ctx.shadowColor='#3b82f6';ctx.shadowBlur=10;
  ctx.beginPath();
  for(var a2=-0.55;a2<=0.55;a2+=0.02){
    var px2=vx-R+R*Math.cos(a2),py2=cy+R*Math.sin(a2);
    if(a2===-0.55)ctx.moveTo(px2,py2);else ctx.lineTo(px2,py2);
  }
  ctx.stroke();ctx.shadowBlur=0;ctx.restore();
  oDash(ctx,8,cy,W-8,cy,'#334155');
  var fX=vx-f,cX=vx-R;
  ctx.save();ctx.strokeStyle='#f59e0b';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(fX,cy-5);ctx.lineTo(fX,cy+5);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cX,cy-5);ctx.lineTo(cX,cy+5);ctx.stroke();
  ctx.restore();
  oLbl(ctx,'F',fX,cy+12,'#f59e0b',9);
  oLbl(ctx,'C',cX,cy+12,'#94a3b8',9);
  // Object between C and F → real, inverted, ENLARGED image beyond C
  var dO=f*1.55,objX=vx-dO,objH=20;
  ctx.save();ctx.strokeStyle='#fbbf24';ctx.lineWidth=2;ctx.shadowColor='#fbbf24';ctx.shadowBlur=6;
  ctx.beginPath();ctx.moveTo(objX,cy);ctx.lineTo(objX,cy-objH);ctx.stroke();
  ctx.fillStyle='#fbbf24';ctx.beginPath();
  ctx.moveTo(objX,cy-objH);ctx.lineTo(objX-5,cy-objH+8);ctx.lineTo(objX+5,cy-objH+8);
  ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.restore();
  oLbl(ctx,'עצם',objX,cy+8,'#fbbf24',8);
  var dI=1/(1/f-1/dO),imgX=vx-dI,m=-(dI/dO),imgH=objH*Math.abs(m);
  // Image (inverted, enlarged, beyond C)
  ctx.save();ctx.strokeStyle='#34d399';ctx.lineWidth=2;ctx.shadowColor='#34d399';ctx.shadowBlur=6;
  ctx.beginPath();ctx.moveTo(imgX,cy);ctx.lineTo(imgX,cy+imgH);ctx.stroke();
  ctx.fillStyle='#34d399';ctx.beginPath();
  ctx.moveTo(imgX,cy+imgH);ctx.lineTo(imgX-5,cy+imgH-8);ctx.lineTo(imgX+5,cy+imgH-8);
  ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.restore();
  oLbl(ctx,'תמונה',imgX,cy+imgH+10,'#34d399',8);
  // Rays hit the actual arc surface
  var tipY=cy-objH;
  function hx(yy){var dy2=yy-cy;var s2=R*R-dy2*dy2;return s2>0?vx-R+Math.sqrt(s2):vx;}
  var h1=hx(tipY);
  // Ray 1: parallel → reflects through F → image tip
  oRay(ctx,objX,tipY,h1,tipY,'#f97316',1.5);
  oRay(ctx,h1,tipY,imgX,cy+imgH,'#f97316',1.5);
  // Ray 2: through F → exits parallel (passes through the image tip height)
  var s3=(cy-tipY)/(fX-objX);
  var hitY3=tipY+s3*(vx-objX);
  var h3=hx(hitY3);
  oRay(ctx,objX,tipY,h3,hitY3,'#a78bfa',1.5);
  oRay(ctx,h3,hitY3,imgX,hitY3,'#a78bfa',1.5);
  // Traveling photon on ray 1
  var LA=h1-objX,LB=Math.hypot(imgX-h1,cy+imgH-tipY),LT=LA+LB;
  var pp=(t*55)%LT;
  if(pp<LA)oPhoton(ctx,objX+pp,tipY,'#f97316',3);
  else{var f3=(pp-LA)/LB;oPhoton(ctx,h1+(imgX-h1)*f3,tipY+(cy+imgH-tipY)*f3,'#f97316',3);}
  oLbl(ctx,'עצם בין C ל-F → תמונה ממשית, הפוכה ומוגדלת',W/2,H-6,'#64748b',8);
  oLbl(ctx,'מראה קעורה — יצירת תמונה',W/2,8,'#e2e8f0',9);
});

// ─── 8. TIR ──────────────────────────────────────────────────────────────────
runAnim('anim-tir-theory',(canvas,ctx,W,H,t)=>{
  oBg(ctx,W,H);
  var iy=H*0.42,cx=W/2;
  // Dense medium below
  ctx.save();ctx.fillStyle='rgba(6,182,212,.12)';ctx.fillRect(0,iy,W,H-iy);ctx.restore();
  ctx.save();ctx.strokeStyle='#22d3ee';ctx.lineWidth=1.2;ctx.globalAlpha=0.5;

  oLbl(ctx,'אוויר (n=1)',cx,iy-12,'#60a5fa',8);
  // Critical angle θ_c = arcsin(1/1.33) ≈ 48.75°
  var tc=Math.asin(1/1.33);
  // Three scenarios side by side
  var scenarios=[
    {x:W*0.22,th:tc*0.6,col:'#34d399',l1:'θ<θ_c',l2:'שבירה'},
    {x:W*0.5,th:tc,col:'#fbbf24',l1:'θ=θ_c',l2:'90°'},
    {x:W*0.78,th:tc*1.3,col:'#f87171',l1:'θ>θ_c',l2:'החזרה!'},
  ];
  scenarios.forEach(function(sc){
    var L=38;
    oDash(ctx,sc.x,iy-42,sc.x,iy+8,'#334155');

    oRay(ctx,sc.x-L*Math.sin(sc.th),iy+L*Math.cos(sc.th),sc.x,iy,'#60a5fa',1.8);
    if(sc.th<tc+0.05){
      // Refracted ray above
      var th2=Math.asin(Math.sin(sc.th)*1.33);
      var exitLen=sc.th<tc?L:L*0.3;
      if(sc.th<=tc){
        oRay(ctx,sc.x,iy,sc.x+exitLen*Math.sin(th2),iy-exitLen*Math.cos(th2),'#f97316',1.5);
      }

    oLbl(ctx,sc.l2,sc.x,H-9,'#94a3b8',8);
    // Photon sliding along the incident ray
    var frp=(t*0.7+sc.x*0.01)%1;
    oPhoton(ctx,sc.x-L*Math.sin(sc.th)*(1-frp),iy+L*Math.cos(sc.th)*(1-frp),sc.col,2.5);
  });

});

// ─── 9. Enhanced Prism ───────────────────────────────────────────────────────
runAnim('anim-prism',(canvas,ctx,W,H,t)=>{
  oBg(ctx,W,H);
  // Prism
  var px=[W*0.29,W*0.71,W/2],py=[H*0.9,H*0.9,H*0.08];

  ctx.fillStyle=pg;ctx.strokeStyle='rgba(99,102,241,.6)';ctx.lineWidth=1.8;
  ctx.beginPath();ctx.moveTo(px[0],py[0]);ctx.lineTo(px[1],py[1]);ctx.lineTo(px[2],py[2]);
  ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
  // Incident white ray
  var entX=(px[0]+px[2])/2,entY=(py[0]+py[2])/2;
  oRay(ctx,16,H*0.5,entX,entY,'#f1f5f9',2);
  oLbl(ctx,'אור לבן',28,H*0.5-10,'#94a3b8',8);
  // Dispersed colors
  var cols=[
    {wl:400,spread:0.18},
    {wl:450,spread:0.12},
    {wl:500,spread:0.06},
    {wl:550,spread:0},
    {wl:600,spread:-0.06},
    {wl:640,spread:-0.11},
    {wl:680,spread:-0.16},
  ];
  // Exit point on right face
  var exitX=(px[1]+px[2])/2,exitY=(py[1]+py[2])/2;
  cols.forEach(function(c){
    var r,g,b;
    var wl=c.wl;
    if(wl<440){r=(440-wl)/60;g=0;b=1;}
    else if(wl<490){r=0;g=(wl-440)/50;b=1;}
    else if(wl<510){r=0;g=1;b=(510-wl)/20;}
    else if(wl<580){r=(wl-510)/70;g=1;b=0;}
    else if(wl<645){r=1;g=(645-wl)/65;b=0;}

    // Ray inside prism
    ctx.save();ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.shadowColor=col;ctx.shadowBlur=5;
    ctx.beginPath();ctx.moveTo(entX,entY);ctx.lineTo(exitX,exitY);ctx.stroke();ctx.restore();
    // Ray exiting
    var ang=0.9+c.spread;
    var len=60+Math.abs(c.spread)*50;
    var pulse=(t*0.5+c.spread*0.3)%1;
    var ex2=exitX+Math.cos(ang)*len,ey2=exitY+Math.sin(ang)*len;
    ctx.save();ctx.strokeStyle=col;ctx.lineWidth=1.8;ctx.shadowColor=col;ctx.shadowBlur=7;
    ctx.beginPath();ctx.moveTo(exitX,exitY);ctx.lineTo(ex2,ey2);ctx.stroke();
    // Photon on exit ray
    ctx.fillStyle=col;ctx.shadowBlur=12;
    var ppx=exitX+Math.cos(ang)*len*pulse,ppy=exitY+Math.sin(ang)*len*pulse;
    ctx.beginPath();ctx.arc(ppx,ppy,3,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });
  oLbl(ctx,'פיזור: n משתנה עם אורך גל',W/2,H-5,'#64748b',8);
});

// ─── 10. Convex lens image formation ─────────────────────────────────────────
runAnim('anim-convex-lens-t',(canvas,ctx,W,H,t)=>{
  oBg(ctx,W,H);
  var lx=W/2,cy=H/2,f=52;
  // Lens shape
  ctx.save();ctx.strokeStyle='#3b82f6';ctx.lineWidth=2.5;ctx.shadowColor='#3b82f6';ctx.shadowBlur=10;
  ctx.fillStyle='rgba(59,130,246,.08)';
  ctx.beginPath();
  var fw=14,fh=44;
  ctx.moveTo(lx,cy-fh);
  ctx.bezierCurveTo(lx+fw,cy-fh*0.7,lx+fw,cy+fh*0.7,lx,cy+fh);
  ctx.bezierCurveTo(lx-fw,cy+fh*0.7,lx-fw,cy-fh*0.7,lx,cy-fh);
  ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.restore();
  // Axes
  oDash(ctx,8,cy,W-8,cy,'#334155');
  oDash(ctx,lx,12,lx,H-12,'#334155');
  // Focal points
  ctx.save();ctx.strokeStyle='#f59e0b';ctx.lineWidth=1.5;
  [lx-f,lx+f].forEach(function(fx){
    ctx.beginPath();ctx.moveTo(fx,cy-6);ctx.lineTo(fx,cy+6);ctx.stroke();
    oLbl(ctx,'F',fx,cy+14,'#f59e0b',8);
  });ctx.restore();
  // Animated object — dₒ oscillates between 1.6f and 3f
  var objX=lx-f*(2.3+0.7*Math.sin(t*0.5));
  var objH=28;
  ctx.save();ctx.strokeStyle='#fbbf24';ctx.lineWidth=2;ctx.shadowColor='#fbbf24';ctx.shadowBlur=6;
  ctx.beginPath();ctx.moveTo(objX,cy);ctx.lineTo(objX,cy-objH);ctx.stroke();
  ctx.fillStyle='#fbbf24';ctx.beginPath();
  ctx.moveTo(objX,cy-objH);ctx.lineTo(objX-5,cy-objH+8);ctx.lineTo(objX+5,cy-objH+8);
  ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.restore();
  // Image
  var dO=lx-objX;
  var dI=1/(1/f-1/dO);
  if(dI>0&&dI<W){
    var imgX=lx+dI;
    var m=-(dI/dO);
    var imgH=objH*Math.abs(m);
    ctx.save();ctx.strokeStyle='#34d399';ctx.lineWidth=2;ctx.shadowColor='#34d399';ctx.shadowBlur=6;
    ctx.beginPath();ctx.moveTo(imgX,cy);ctx.lineTo(imgX,cy+imgH);ctx.stroke();
    ctx.fillStyle='#34d399';ctx.beginPath();
    ctx.moveTo(imgX,cy+imgH);ctx.lineTo(imgX-5,cy+imgH-8);ctx.lineTo(imgX+5,cy+imgH-8);
    ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.restore();
    oLbl(ctx,'תמונה',imgX,cy+imgH+10,'#34d399',8);
    oLbl(ctx,'הפוכה',imgX,cy+imgH+19,'#34d399',8);
    // 3 canonical rays
    var tipY=cy-objH;
    // Ray 1: parallel → through F
    oRay(ctx,objX,tipY,lx,tipY,'#f97316',1.5);
    oRay(ctx,lx,tipY,imgX,cy+imgH,'#f97316',1.5);
    // Ray 2: through center
    oRay(ctx,objX,tipY,imgX,cy+imgH,'#a78bfa',1.5);
    // Ray 3: through F then parallel
    oRay(ctx,objX,tipY,lx,cy,'#22d3ee',1.5);
    oRay(ctx,lx,cy,imgX,cy+imgH,'#22d3ee',1.5);
  }
  oLbl(ctx,'עדשה מרכזת — תמונה ממשית הפוכה',W/2,H-5,'#e2e8f0',9);
});

// ─── 11. Concave lens ────────────────────────────────────────────────────────
runAnim('anim-concave-lens-t',(canvas,ctx,W,H,t)=>{
  oBg(ctx,W,H);
  var lx=W/2,cy=H/2,f=52;
  // Diverging lens (biconcave)
  ctx.save();ctx.strokeStyle='#a78bfa';ctx.lineWidth=2.5;ctx.shadowColor='#a78bfa';ctx.shadowBlur=10;
  ctx.fillStyle='rgba(167,139,250,.06)';
  var fw=10,fh=40;
  ctx.beginPath();
  ctx.moveTo(lx,cy-fh);
  ctx.bezierCurveTo(lx-fw,cy-fh*0.7,lx-fw,cy+fh*0.7,lx,cy+fh);
  ctx.bezierCurveTo(lx-fw*2.2,cy+fh*0.6,lx-fw*2.2,cy-fh*0.6,lx,cy-fh);
  ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(lx,cy-fh);
  ctx.bezierCurveTo(lx+fw,cy-fh*0.7,lx+fw,cy+fh*0.7,lx,cy+fh);
  ctx.bezierCurveTo(lx+fw*2.2,cy+fh*0.6,lx+fw*2.2,cy-fh*0.6,lx,cy-fh);
  ctx.closePath();ctx.fill();ctx.stroke();
  ctx.shadowBlur=0;ctx.restore();
  oDash(ctx,8,cy,W-8,cy,'#334155');
  // Virtual focal points
  ctx.save();ctx.strokeStyle='#f59e0b';ctx.lineWidth=1.5;ctx.setLineDash([3,3]);
  [lx-f,lx+f].forEach(function(fx){
    ctx.beginPath();ctx.moveTo(fx,cy-6);ctx.lineTo(fx,cy+6);ctx.stroke();
    oLbl(ctx,'F',fx,cy+13,'#f59e0b',8);
  });ctx.setLineDash([]);ctx.restore();
  // Object
  var objX=lx-(52+34*(0.5+0.5*Math.sin(t*0.45))),objH=30;
  ctx.save();ctx.strokeStyle='#fbbf24';ctx.lineWidth=2;ctx.shadowColor='#fbbf24';ctx.shadowBlur=6;
  ctx.beginPath();ctx.moveTo(objX,cy);ctx.lineTo(objX,cy-objH);ctx.stroke();
  ctx.fillStyle='#fbbf24';ctx.beginPath();
  ctx.moveTo(objX,cy-objH);ctx.lineTo(objX-5,cy-objH+8);ctx.lineTo(objX+5,cy-objH+8);
  ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.restore();
  // Image (virtual, upright, smaller)
  var dO=lx-objX;
  var dI=-1/(1/f+1/dO);
  var m=-dI/dO;
  var imgX=lx+dI;
  var imgH=objH*Math.abs(m);
  // Dashed virtual image
  ctx.save();ctx.strokeStyle='rgba(34,211,238,.6)';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
  ctx.beginPath();ctx.moveTo(imgX,cy);ctx.lineTo(imgX,cy-imgH);ctx.stroke();
  ctx.fillStyle='rgba(34,211,238,.5)';ctx.beginPath();
  ctx.moveTo(imgX,cy-imgH);ctx.lineTo(imgX-4,cy-imgH+7);ctx.lineTo(imgX+4,cy-imgH+7);
  ctx.closePath();ctx.fill();ctx.setLineDash([]);ctx.restore();
  oLbl(ctx,'תמונה',imgX,cy-imgH-19,'#22d3ee',8);
  oLbl(ctx,'מדומה',imgX,cy-imgH-9,'#22d3ee',8);
  // Rays
  var tipY=cy-objH;
  oRay(ctx,objX,tipY,lx,tipY,'#f97316',1.5);
  // After lens diverges
  oDash(ctx,lx,tipY,lx-f,cy,'#f97316');
  var slope=(tipY-cy)/(-f);
  oRay(ctx,lx,tipY,W-8,tipY+slope*(W-8-lx),'#f97316',1.5);
  oRay(ctx,objX,tipY,lx,cy,'#a78bfa',1.5);
  oRay(ctx,lx,cy,W-8,cy,'#a78bfa',1.5);
  // Traveling photon: incident parallel ray, then the diverging exit ray
  var LA2=lx-objX,LB2=Math.hypot(W-8-lx,slope*(W-8-lx)),LT2=LA2+LB2;
  var pp2=(t*60)%LT2;
  if(pp2<LA2)oPhoton(ctx,objX+pp2,tipY,'#f97316',3);
  else{var fr2=(pp2-LA2)/LB2;oPhoton(ctx,lx+(W-8-lx)*fr2,tipY+slope*(W-8-lx)*fr2,'#f97316',3);}
  oLbl(ctx,'עדשה מפזרת — תמיד מדומה, ישרה, מוקטנת',W/2,H-5,'#e2e8f0',8);
});

// ─── 12. Eye focus ────────────────────────────────────────────────────────────
runAnim('anim-eye-focus-t',(canvas,ctx,W,H,t)=>{
  oBg(ctx,W,H);
  var scenarios=[
    {y:H*0.22,label:'ראייה תקינה',col:'#34d399',converge:0},
    {y:H*0.5, label:'קצר-ראייה',  col:'#f87171',converge:-14},
    {y:H*0.78,label:'רחוק-ראייה', col:'#60a5fa',converge:14},
  ];
  var eyeX=W-18,retX=W-6;
  var active=Math.floor(t/2.5)%3;
  scenarios.forEach(function(sc,si){
    var cy2=sc.y;
    var lensX=W*0.42;
    var retinaX=retX-2;
    var focalX=(sc.converge===0?retinaX:eyeX+sc.converge);
    var hot=si===active;
    ctx.save();ctx.globalAlpha=hot?1:0.45;
    ctx.strokeStyle=sc.col;ctx.lineWidth=1.5;ctx.shadowColor=sc.col;ctx.shadowBlur=hot?8:3;
    ctx.beginPath();ctx.ellipse(eyeX,cy2,14,10,0,0,Math.PI*2);ctx.stroke();
    // Retina line
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1;ctx.setLineDash([2,2]);
    ctx.beginPath();ctx.moveTo(retinaX,cy2-8);ctx.lineTo(retinaX,cy2+8);ctx.stroke();
    ctx.setLineDash([]);ctx.shadowBlur=0;
    // Rays: converge to the focal point, then continue to the retina plane
    [-8,0,8].forEach(function(dy){
      var startX=14,startY=cy2+dy;
      ctx.strokeStyle=sc.col;ctx.lineWidth=1;ctx.globalAlpha=(hot?0.85:0.35);
      ctx.beginPath();ctx.moveTo(startX,startY);
      ctx.lineTo(lensX,cy2+dy*0.4);
      var sl=(cy2-(cy2+dy*0.4))/(focalX-lensX);
      if(sc.converge<0){
        // myopia: focus before retina — rays cross, then diverge onto retina
        ctx.lineTo(focalX,cy2);
        ctx.lineTo(retinaX,cy2+sl*(retinaX-focalX));
      } else if(sc.converge>0){
        // hyperopia: rays reach the retina before converging
        ctx.lineTo(retinaX,cy2+dy*0.4+sl*(retinaX-lensX));
      } else {
        ctx.lineTo(retinaX,cy2);
      }
      ctx.stroke();
    });
    // Focus dot / blur disc on the retina
    ctx.globalAlpha=hot?1:0.5;
    if(sc.converge===0){
      ctx.fillStyle='#34d399';ctx.shadowColor='#34d399';ctx.shadowBlur=8;
      ctx.beginPath();ctx.arc(retinaX,cy2,3,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    } else {
      ctx.fillStyle=sc.col;ctx.beginPath();ctx.arc(focalX,cy2,2.5,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=(hot?0.4:0.2);
      ctx.beginPath();ctx.arc(retinaX,cy2,5.5,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
    oLbl(ctx,sc.label,lensX-20,cy2-14,sc.col,8);
    oLbl(ctx,sc.converge<0?'מוקד לפני הרשתית — טשטוש':sc.converge>0?'מוקד מאחורי הרשתית — טשטוש':'מוקד על הרשתית ✓',lensX+20,cy2+14,sc.col,8);
  });
  oLbl(ctx,'ליקויי ראייה ותיקון עם עדשות',W/2,H-4,'#475569',9);
});

// ─── 13. Interference ────────────────────────────────────────────────────────
runAnim('anim-interference-t',(canvas,ctx,W,H,t)=>{
  oBg(ctx,W,H);
  var cy=H/2,amp=18,waveL=50;
  // Wave 1 (blue)
  ctx.save();ctx.strokeStyle='#60a5fa';ctx.lineWidth=2;ctx.shadowColor='#60a5fa';ctx.shadowBlur=6;
  ctx.beginPath();
  for(var ix=0;ix<=W;ix++){
    var y=cy-amp*Math.sin(ix/waveL*Math.PI*2-t*4);
    if(ix===0)ctx.moveTo(ix,y);else ctx.lineTo(ix,y);
  }ctx.stroke();ctx.restore();
  // Wave 2 (purple) with phase shift
  var phi=(t*0.3)%(Math.PI*2);
  ctx.save();ctx.strokeStyle='#a78bfa';ctx.lineWidth=2;ctx.shadowColor='#a78bfa';ctx.shadowBlur=6;
  ctx.beginPath();
  for(var ix2=0;ix2<=W;ix2++){
    var y2=cy-amp*Math.sin(ix2/waveL*Math.PI*2-t*4+phi);
    if(ix2===0)ctx.moveTo(ix2,y2);else ctx.lineTo(ix2,y2);
  }ctx.stroke();ctx.restore();
  // Resultant
  var inPhase=phi<0.3||phi>Math.PI*2-0.3;
  var outPhase=Math.abs(phi-Math.PI)<0.3;
  var resCol=inPhase?'#34d399':outPhase?'#f87171':'#fbbf24';
  ctx.save();ctx.strokeStyle=resCol;ctx.lineWidth=2.8;ctx.shadowColor=resCol;ctx.shadowBlur=10;
  ctx.beginPath();
  for(var ix3=0;ix3<=W;ix3++){
    var y3=cy-amp*Math.sin(ix3/waveL*Math.PI*2-t*4)-amp*Math.sin(ix3/waveL*Math.PI*2-t*4+phi);
    if(ix3===0)ctx.moveTo(ix3,y3);else ctx.lineTo(ix3,y3);
  }ctx.stroke();ctx.restore();
  // Labels
  var phiDeg=Math.round(phi*180/Math.PI);
  oLbl(ctx,'גל 1',12,cy-32,'#60a5fa',9);
  oLbl(ctx,'גל 2',12,cy+14,'#a78bfa',9);
  oLbl(ctx,'סופרפוזיציה',12,cy-52,resCol,9);
  oLbl(ctx,'Δφ='+phiDeg+'°',W/2,H-6,'#64748b',9);
  var status=inPhase?'עצמות (Δφ=0°)':outPhase?'רסיסה (Δφ=180°)':'ביניים';
  oLbl(ctx,status,W/2,H-16,resCol,10);
});

// ─── 14. Young's double slit ─────────────────────────────────────────────────
runAnim('anim-youngs-t',(canvas,ctx,W,H,t)=>{
  oBg(ctx,W,H);
  var slitX=W*0.25,screenX=W-14,slitD=30,cy=H/2;
  // Source
  ctx.save();ctx.fillStyle='#fbbf24';ctx.shadowColor='#fbbf24';ctx.shadowBlur=14;
  ctx.beginPath();ctx.arc(14,cy,5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.restore();
  oLbl(ctx,'מקור',14,cy+14,'#fbbf24',8);
  // Barrier
  ctx.save();ctx.fillStyle='#1e293b';ctx.fillRect(slitX-4,0,8,cy-slitD);
  ctx.fillRect(slitX-4,cy+slitD,8,H-cy-slitD);ctx.restore();
  ctx.save();ctx.strokeStyle='#475569';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(slitX,0);ctx.lineTo(slitX,cy-slitD);ctx.stroke();
  ctx.beginPath();ctx.moveTo(slitX,cy+slitD);ctx.lineTo(slitX,H);ctx.stroke();
  ctx.restore();
  // Screen
  ctx.save();ctx.fillStyle='#1e293b';ctx.fillRect(screenX,0,8,H);ctx.restore();
  // Interference pattern on screen
  var lam=10,d=slitD*2;
  var L=screenX-slitX;
  for(var iy=0;iy<H;iy++){
    var y=iy-cy;
    var path1=Math.sqrt(L*L+(y-slitD)*(y-slitD));
    var path2=Math.sqrt(L*L+(y+slitD)*(y+slitD));
    var delta=path1-path2;
    var I=Math.pow(Math.cos(Math.PI*delta/lam),2);
    if(I>0.1){
      ctx.save();ctx.fillStyle='rgba(251,191,36,'+I.toFixed(2)+')';
      ctx.shadowColor='#fbbf24';ctx.shadowBlur=I*6;
      ctx.fillRect(screenX,iy,6,1);ctx.restore();
    }
  }
  // Waves from slits
  var numW=4;
  [cy-slitD,cy+slitD].forEach(function(sy,si){
    for(var w=1;w<=numW;w++){
      var r=(w*lam*1.8+(t*28)%( lam*1.8));
      ctx.save();ctx.strokeStyle='rgba(251,191,36,'+((numW-w+1)/numW*0.35).toFixed(2)+')';
      ctx.lineWidth=0.8;ctx.shadowColor='#fbbf24';ctx.shadowBlur=2;
      ctx.beginPath();ctx.arc(slitX,sy,r,0,Math.PI*2);ctx.stroke();
      ctx.restore();
    }
    oLbl(ctx,'S'+(si+1),slitX-14,sy,'#94a3b8',8);
  });
  oLbl(ctx,'ניסוי Young — התאבכות דו-סדקית',W/2,H-5,'#e2e8f0',9);
});

// ─── 15. Diffraction ─────────────────────────────────────────────────────────
runAnim('anim-diffraction-t',(canvas,ctx,W,H,t)=>{
  oBg(ctx,W,H);
  var slitX=W*0.3,slitHalf=16,screenX=W-12,cy=H/2;
  // Barrier
  ctx.save();ctx.fillStyle='#1e293b';
  ctx.fillRect(slitX-4,0,8,cy-slitHalf);
  ctx.fillRect(slitX-4,cy+slitHalf,8,H-cy-slitHalf);
  ctx.restore();
  ctx.save();ctx.strokeStyle='#475569';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(slitX,cy-slitHalf);ctx.lineTo(slitX,cy+slitHalf);ctx.stroke();
  ctx.restore();
  // Incoming plane wave
  var phase=(t*25)%40;
  for(var i=0;i<3;i++){
    var wx=slitX-20-i*22+phase;
    if(wx<4)continue;
    ctx.save();ctx.strokeStyle='rgba(96,165,250,.5)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(wx,0);ctx.lineTo(wx,H);ctx.stroke();
    ctx.restore();
  }
  // Huygens wavelets from slit
  var numW=5;
  for(var w=1;w<=numW;w++){
    var r=(w*14+(t*28)%(14));
    ctx.save();ctx.strokeStyle='rgba(251,191,36,'+((numW-w+1)/numW*0.4).toFixed(2)+')';
    ctx.lineWidth=0.9;ctx.shadowColor='#fbbf24';ctx.shadowBlur=2;
    ctx.beginPath();ctx.arc(slitX,cy,r,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }
  // Screen background, then diffraction pattern in a single pass
  ctx.save();ctx.fillStyle='#1e293b';ctx.fillRect(screenX,0,8,H);ctx.restore();
  for(var iy=0;iy<H;iy++){
    var y=iy-cy;
    var u=Math.PI*slitHalf*2*y/(10*(screenX-slitX));
    var I2=u!==0?Math.pow(Math.sin(u)/u,2):1;
    if(I2>0.05){
      ctx.save();ctx.fillStyle='rgba(251,191,36,'+I2.toFixed(2)+')';
      ctx.shadowColor='#fbbf24';ctx.shadowBlur=I2*5;
      ctx.fillRect(screenX,iy,6,1);ctx.restore();
    }
  }
  oLbl(ctx,'עקיפה — עיקול גלים סביב קצה',W/2,H-5,'#e2e8f0',9);
  oLbl(ctx,'סדק a='+Math.round(slitHalf*2)+'px',slitX-2,cy-slitHalf-8,'#94a3b8',8);
});

// ─── EM Spectrum full theory anim ───────────────────────────
runAnim('anim-emspec-full-t',function(canvas,ctx,W,H,t){

// ─── Polarization theory anim ───────────────────────────────
runAnim('anim-polar-t',function(canvas,ctx,W,H,t){
  oBg(ctx,W,H);
  var cy=H/2;
  var theta=(Math.sin(t*0.6)+1)*Math.PI/2; // oscillate 0..pi
  // Stage 1: unpolarized source
  var s1x=W*0.1;
  ctx.save();ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(s1x,cy,8,0,Math.PI*2);ctx.fill();ctx.restore();
  for(var i=0;i<6;i++){
    var ang=i*Math.PI/3+t*1.2;
    oRay(ctx,s1x,cy,s1x+Math.cos(ang)*16,cy+Math.sin(ang)*16,'rgba(251,191,36,0.5)',1.2);
  }
  // Beam to pol1
  oRay(ctx,s1x+10,cy,W*0.35-10,cy,'rgba(251,191,36,0.4)',8);
  // Polarizer 1
  var p1x=W*0.35;
  ctx.save();ctx.strokeStyle='#94a3b8';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p1x,cy,14,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='#22d3ee';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p1x,cy-12);ctx.lineTo(p1x,cy+12);ctx.stroke();ctx.restore();
  // Polarized beam
  oRay(ctx,p1x+16,cy,W*0.62-12,cy,'rgba(251,191,36,0.7)',5);
  // Analyzer 2 (rotating)
  var p2x=W*0.62;
  ctx.save();ctx.strokeStyle='#94a3b8';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p2x,cy,14,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='#f472b6';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(p2x+Math.cos(theta+Math.PI/2)*12,cy+Math.sin(theta+Math.PI/2)*12);
  ctx.lineTo(p2x+Math.cos(theta-Math.PI/2)*12,cy+Math.sin(theta-Math.PI/2)*12);ctx.stroke();ctx.restore();
  // Transmitted beam (dimmed by cos²θ)
  var I=Math.cos(theta)*Math.cos(theta);
  if(I>0.02){
    oRay(ctx,p2x+16,cy,W*0.88,cy,'rgba(251,191,36,'+I.toFixed(2)+')',I*6+1);
  }
  // Labels
  oLbl(ctx,'I=I₀cos²θ',W*0.75,H-8,'#f472b6',9);
  oLbl(ctx,'θ='+Math.round(theta*180/Math.PI)+'°',p2x,cy-22,'#f472b6',8);
});

// ─── Doppler theory anim ────────────────────────────────────
runAnim('anim-doppler-t',function(canvas,ctx,W,H,t){

// ─── Color Mix theory anim ───────────────────────────────────
runAnim('anim-color-mix-t',function(canvas,ctx,W,H,t){

  spot(gX,gY,0,220,0,pulse);

// ─── Fiber optics theory anim ────────────────────────────────
runAnim('anim-fiber-t',function(canvas,ctx,W,H,t){
  oBg(ctx,W,H);
  var fY=H*0.5,fw=14;
  // Simple straight fiber
  ctx.save();ctx.fillStyle='rgba(37,99,235,0.2)';ctx.fillRect(0,fY-fw/2,W,fw);
  ctx.strokeStyle='#3b82f6';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,fY-fw/2);ctx.lineTo(W,fY-fw/2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,fY+fw/2);ctx.lineTo(W,fY+fw/2);ctx.stroke();
  ctx.restore();
  // Bouncing ray
  var nBounce=10,speed=0.5;
  ctx.save();optGlow(ctx,'#fbbf24',8);ctx.strokeStyle='#fbbf24';ctx.lineWidth=2;
  ctx.beginPath();
  for(var i=0;i<=nBounce;i++){
    var px=i*W/nBounce;
    var zig=(i%2===0)?-1:1;
    var py=fY+zig*(fw*0.38);
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  // Animated photon dot along the path
  var progFrac=((t*speed)%1);
  var dotI=Math.floor(progFrac*nBounce);
  var dotFrac=progFrac*nBounce-dotI;
  var dx1=dotI*W/nBounce,dy1=fY+(dotI%2===0?-1:1)*(fw*0.38);
  var dx2=(dotI+1)*W/nBounce,dy2=fY+((dotI+1)%2===0?-1:1)*(fw*0.38);
  ctx.stroke();
  ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(dx1+(dx2-dx1)*dotFrac,dy1+(dy2-dy1)*dotFrac,4,0,Math.PI*2);ctx.fill();
  optNoGlow(ctx);ctx.restore();
  oLbl(ctx,'ליבה n₁',W*0.5,fY,'#93c5fd',8);
  oLbl(ctx,'TIR חוזר',W*0.75,fY-fw/2-10,'#fbbf24',8);
  oLbl(ctx,'מעטה n₂<n₁',W*0.5,fY+fw/2+14,'#475569',8);
});

// ─── Thin film theory anim ──────────────────────────────────
runAnim('anim-thin-film-t',function(canvas,ctx,W,H,t){
  oBg(ctx,W,H);
  var fX=W*0.48,fW=14,fTop=H*0.12,fBot=H*0.85;
  // Film with animated color (slowly cycling thickness)
  var tCycle=120+180*((Math.sin(t*0.35)+1)/2);// 120-300nm cycle
  var n=1.33;
  function iR(wl){return Math.pow(Math.sin(2*Math.PI*n*tCycle/wl),2);}
  var gfilm=ctx.createLinearGradient(0,fTop,0,fBot);
  for(var si=0;si<=20;si++){
    var tL=tCycle*(0.3+1.4*si/20);
    var rr=0,gg=0,bb=0,tot=0;
    for(var wl=380;wl<=700;wl+=12){
      var I=Math.pow(Math.sin(2*Math.PI*n*tL/wl),2);
      var h=wavelengthToHex(wl);
      rr+=parseInt(h.slice(1,3),16)*I;
      gg+=parseInt(h.slice(3,5),16)*I;
      bb+=parseInt(h.slice(5,7),16)*I;
      tot+=I;
    }
    if(tot<0.01){rr=20;gg=20;bb=20;}else{rr/=tot;gg/=tot;bb/=tot;}
    gfilm.addColorStop(si/20,'rgba('+Math.round(rr)+','+Math.round(gg)+','+Math.round(bb)+',0.9)');
  }
  ctx.fillStyle=gfilm;ctx.fillRect(fX-fW/2,fTop,fW,fBot-fTop);
  ctx.strokeStyle='rgba(148,163,184,0.3)';ctx.lineWidth=0.5;ctx.strokeRect(fX-fW/2,fTop,fW,fBot-fTop);
  // Incident ray
  oRay(ctx,fX-60,H*0.3+40,fX-fW/2,H*0.3,'rgba(255,255,200,0.8)',3);
  // Reflected ray (colored)
  var rgb0={r:0,g:0,b:0,tot:0};
  for(var wl2=380;wl2<=700;wl2+=12){
    var I2=iR(wl2);var h2=wavelengthToHex(wl2);
    rgb0.r+=parseInt(h2.slice(1,3),16)*I2;rgb0.g+=parseInt(h2.slice(3,5),16)*I2;
    rgb0.b+=parseInt(h2.slice(5,7),16)*I2;rgb0.tot+=I2;
  }
  if(rgb0.tot>0.01){rgb0.r/=rgb0.tot;rgb0.g/=rgb0.tot;rgb0.b/=rgb0.tot;}
  var rCol='rgb('+Math.round(rgb0.r)+','+Math.round(rgb0.g)+','+Math.round(rgb0.b)+')';
  ctx.save();optGlow(ctx,rCol,8);
  oRay(ctx,fX-fW/2,H*0.3,fX-60,H*0.3-40,rCol,3);
  optNoGlow(ctx);ctx.restore();
  oLbl(ctx,'קרום דק',fX,fBot+12,'#94a3b8',8);
  oLbl(ctx,'n='+n,fX,fBot+22,'#64748b',7);
  oLbl(ctx,'צבעים מהתאבכות',W/2,H-4,'#94a3b8',8);
});

// ─── Grating theory anim ────────────────────────────────────
runAnim('anim-grating-t',function(canvas,ctx,W,H,t){
  oBg(ctx,W,H);
  var gX=W*0.3,ax=H/2;
  // Animated wavelength cycling through spectrum
  var wl=380+320*((Math.sin(t*0.4)+1)/2);
  var lHex=wavelengthToHex(Math.round(wl));
  // Grating lines
  ctx.save();ctx.strokeStyle='#475569';ctx.lineWidth=1;
  for(var i=0;i<6;i++){ctx.beginPath();ctx.moveTo(gX-6+i*3,H*0.12);ctx.lineTo(gX-6+i*3,H*0.88);ctx.stroke();}
  ctx.restore();
  // Incident beam
  oRay(ctx,W*0.06,ax,gX,ax,lHex,3);
  // Orders m=0,±1
  var d=1500;// nm
  [[0,'#fff'],[1,lHex],[-1,lHex]].forEach(function(arr){
    var m=arr[0],col=arr[1];
    var sinTh=m*wl/d;
    if(Math.abs(sinTh)>0.9)return;
    var th=Math.asin(sinTh);
    var dx=(W*0.88-gX),dy=dx*Math.tan(th);
    if(Math.abs(ax+dy)<H*0.08||Math.abs(ax+dy)>H*0.92)return;
    ctx.save();if(m!==0)optGlow(ctx,col,6);
    oRay(ctx,gX,ax,W*0.88,ax+dy,m===0?'rgba(255,255,255,0.7)':col,m===0?2:2);
    if(m!==0)optNoGlow(ctx);
    ctx.restore();
    oLbl(ctx,'m='+m,W*0.88+8,ax+dy,col,8);
  });
  oLbl(ctx,'d·sinθ=mλ',W/2,H-6,'#94a3b8',8);
  oLbl(ctx,'λ='+Math.round(wl)+'nm',W*0.18,ax-12,lHex,9);
});
