  function poll(){if(_simStop[id])return;requestAnimationFrame(draw);}poll();
}

// ─── CONCAVE LENS — Enhanced ──────────────────────────────────────
function simOptConcaveLens(canvas){
  const H=400;const{ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;var f=95,cy=H/2,lx=W/2;
  function getObj(){var e=document.getElementById('inp-dcl-do');return e?parseFloat(e.value):2.2;}
  function getWl(){var e=document.getElementById('inp-dcl-wl');return e?parseFloat(e.value):550;}
  function getF(){var e=document.getElementById('inp-dcl-f');return e?parseFloat(e.value):95;}
  var animT=0;
  // ── Direct manipulation: drag the object arrow ──
  var dragObj=false,hasDragged=false;
  function _objX(){return lx-getObj()*f;}
  function _hit(p){var ox=_objX();return Math.abs(p.x-ox)<24&&p.y>cy-82&&p.y<cy+14;}
  function _dn(e){var p=simPointerXY(canvas,dpr,e);if(_hit(p)){dragObj=true;hasDragged=true;canvas.style.cursor='grabbing';e.preventDefault();}}
  function _mv(e){var p=simPointerXY(canvas,dpr,e);
    if(dragObj){simSyncSlider('dcl-do',(lx-p.x)/f,2);e.preventDefault();}
    else canvas.style.cursor=_hit(p)?'grab':'';}
  function _up(){dragObj=false;canvas.style.cursor='';}
  canvas.addEventListener('mousedown',_dn);canvas.addEventListener('touchstart',_dn,{passive:false});
  canvas.addEventListener('mousemove',_mv);canvas.addEventListener('touchmove',_mv,{passive:false});
  canvas.addEventListener('mouseup',_up);canvas.addEventListener('touchend',_up);
  function draw(){
    if(_simStop[id])return;
    animT+=0.025;
    f=getF();var doMult=getObj(),doPx=doMult*f;
    var wl=getWl(),wlHex=wavelengthToHex(wl);
    // Concave lens: f_eff = -f  →  di = -f*do/(do+f)  [always negative = virtual]
    var diVal=-f*doPx/(doPx+f);
    var m_mag=-diVal/doPx; // = f/(f+do) > 0, <1 (upright, smaller)
    var bgG=ctx.createLinearGradient(0,0,0,H);bgG.addColorStop(0,'#020810');bgG.addColorStop(1,'#030d1a');
    ctx.fillStyle=bgG;ctx.fillRect(0,0,W,H);
    optDash(ctx,18,cy,W-18,cy,'#1e3a5f',0.5);
    // Diverging lens shape
    optDivLensShape(ctx,lx,cy,14,160,'#8b5cf6','rgba(139,92,246,.06)');
    // Virtual focal points (both sides shown dashed)
    var F1x=lx-f,F2x=lx+f;
    ctx.save();ctx.strokeStyle='#f59e0b';ctx.lineWidth=1.5;ctx.setLineDash([3,4]);
    optGlow(ctx,'#f59e0b',5);
    [F1x,F2x].forEach(function(fx){
      ctx.beginPath();ctx.moveTo(fx,cy-8);ctx.lineTo(fx,cy+8);ctx.stroke();
    });
    optNoGlow(ctx);ctx.setLineDash([]);ctx.restore();
    optLabel(ctx,'F₁',F1x,cy+18,'#f59e0b',9);
    optLabel(ctx,'F₂',F2x,cy+18,'#f59e0b',9);
    // Object
    var objX=lx-doPx,objH=62;
    ctx.save();ctx.strokeStyle='#60a5fa';ctx.lineWidth=3;optGlow(ctx,'#60a5fa',8);
    ctx.beginPath();ctx.moveTo(objX,cy);ctx.lineTo(objX,cy-objH);ctx.stroke();
    ctx.fillStyle='#93c5fd';ctx.beginPath();ctx.moveTo(objX,cy-objH);ctx.lineTo(objX-8,cy-objH+15);ctx.lineTo(objX+8,cy-objH+15);ctx.closePath();ctx.fill();
    optNoGlow(ctx);ctx.restore();
    optLabel(ctx,'עצם',objX,cy+14,'#60a5fa',10);
    if(!hasDragged&&animT<7){
      optLabel(ctx,'✋ גרור את העצם',objX,cy-objH-24+Math.sin(animT*4)*3,'#fbbf24',10);
    }
    // Virtual image: same side as object (left), upright, smaller
    var imgX=lx+diVal; // diVal<0, so imgX < lx (on left)
    var imgTipY=cy-m_mag*objH; // upright: above axis like object
    ctx.save();var _ig3=ctx.createRadialGradient(imgX,(cy+imgTipY)/2,2,imgX,(cy+imgTipY)/2,Math.max(42,Math.abs(cy-imgTipY)));
    _ig3.addColorStop(0,'rgba(52,211,153,.18)');_ig3.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=_ig3;ctx.beginPath();ctx.arc(imgX,(cy+imgTipY)/2,Math.max(42,Math.abs(cy-imgTipY)),0,Math.PI*2);ctx.fill();ctx.restore();
    ctx.save();ctx.strokeStyle='rgba(52,211,153,.95)';ctx.lineWidth=4;ctx.setLineDash([6,4]);
    optGlow(ctx,'#34d399',12);
    ctx.beginPath();ctx.moveTo(imgX,cy);ctx.lineTo(imgX,imgTipY);ctx.stroke();
    ctx.fillStyle='rgba(52,211,153,.4)';ctx.beginPath();
    ctx.moveTo(imgX,imgTipY);ctx.lineTo(imgX-7,imgTipY+15);ctx.lineTo(imgX+7,imgTipY+15);ctx.closePath();ctx.fill();
    ctx.setLineDash([]);optNoGlow(ctx);ctx.restore();
    optLabel(ctx,'תמונה מדומה',imgX,cy+14,'#34d399',9);
    var objTipX=objX,objTipY=cy-objH;
    // RAY 1: parallel to axis → diverges from lens as if coming from F1
    // Incident: horizontal to lens at (lx, cy-objH)
    optRay(ctx,objTipX,objTipY,lx,objTipY,'rgba(251,191,36,.7)',1.8,false);
    // Exit: diverges as if from F1=(lx-f, cy). Direction: from F1 through (lx, cy-objH) onward
    // slope = (objTipY - cy)/(lx - F1x) = -objH/f (going up-right as we move right)
    var r1slope=(objTipY-cy)/(lx-F1x); // = -objH/f
    var r1endX=W-16;
    var r1endY=objTipY+r1slope*(r1endX-lx);
    optRay(ctx,lx,objTipY,r1endX,r1endY,'rgba(251,191,36,.7)',1.8,true);
    // Dashed backward extension from lens to virtual image (converges at F1 direction)
    optDash(ctx,lx,objTipY,imgX,imgTipY,'rgba(251,191,36,.35)');
    // RAY 2: center ray — through optical center (lx, cy), undeviated
    // slope from objTip to optical center: (cy - objTipY)/(lx - objTipX) = objH/doPx
    var r2slope=objH/doPx;
    optRay(ctx,objTipX,objTipY,lx,cy,'rgba(52,211,153,.7)',1.8,false);
    // After lens: continues with same slope to the right
    var r2endX=W-16;
    var r2endY=cy+r2slope*(r2endX-lx);
    optRay(ctx,lx,cy,r2endX,r2endY,'rgba(52,211,153,.7)',1.8,true);
    // Dashed backward extension: from (lx,cy) going left converges at virtual image
    optDash(ctx,lx,cy,imgX,imgTipY,'rgba(52,211,153,.3)');
    // RAY 3: aimed at F2=(lx+f, cy) → exits parallel to axis
    // Slope from objTip toward F2: (cy-objTipY)/(F2x-objTipX) = objH/(F2x-objTipX) = objH/(f+doPx)
    var r3slope=objH/(F2x-objTipX);
    var r3hitY=objTipY+r3slope*(lx-objTipX); // y at lens
    optRay(ctx,objTipX,objTipY,lx,r3hitY,'rgba(167,139,250,.65)',1.8,false);
    // Exits parallel to axis:
    optRay(ctx,lx,r3hitY,W-16,r3hitY,'rgba(167,139,250,.65)',1.8,true);
    optDash(ctx,lx,r3hitY,imgX,imgTipY,'rgba(167,139,250,.3)');
    var mStr=m_mag.toFixed(2);
    var _dl=wl<430?'UV':wl<470?'סגול':wl<500?'כחול':wl<560?'ירוק':wl<590?'צהוב':wl<625?'כתום':'אדום';
    ctx.save();ctx.fillStyle=wlHex;optGlow(ctx,wlHex,8);ctx.beginPath();ctx.arc(W-20,H-20,8,0,Math.PI*2);ctx.fill();optNoGlow(ctx);ctx.restore();
    optInfoBox(ctx,8,8,185,['dₒ='+Math.round(doPx)+'px','dᵢ='+Math.round(diVal)+'px','m=+'+mStr+' (ישרה, מוקטנת)','מדומה תמיד','λ='+Math.round(wl)+'nm '+_dl]);
    if(dragObj){
      var _mm='שים לב: בכל מרחק — מדומה, ישרה ומוקטנת! (עדשה מפזרת)';
      if(_mm){ctx.save();ctx.fillStyle='rgba(4,9,20,.88)';ctx.strokeStyle='#fbbf24';ctx.lineWidth=1;
        ctx.beginPath();ctx.roundRect(W/2-160,H-34,320,24,6);ctx.fill();ctx.stroke();ctx.restore();
        optLabel(ctx,_mm,W/2,H-21,'#fbbf24',10);}
    }
    // Animated photon along ray 1 (horizontal incident, left→right toward lens)
    var _ph=(animT*0.35)%1;
    var _pSX=objX,_pEX=lx;
    ctx.save();ctx.fillStyle=wlHex;optGlow(ctx,wlHex,14);
    ctx.beginPath();ctx.arc(_pSX+(_pEX-_pSX)*_ph,cy-objH,3.5,0,Math.PI*2);ctx.fill();
    optNoGlow(ctx);ctx.restore();
    requestAnimationFrame(draw);
  }
  function poll(){if(_simStop[id])return;requestAnimationFrame(draw);}poll();
}

// ─── EYE — Enhanced ───────────────────────────────────────────────
function simOptEye(canvas){
  const H=460;const{ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;var animT=0;var mode='normal';var glasses=false;
  window._eyeMode=function(m){mode=(m==='far')?'normal':m;};
  window._eyeGlasses=function(){glasses=!glasses;
    var b=document.getElementById('btn-eye-glasses');
    if(b)b.textContent=glasses?'❌ הסר משקפיים':'👓 הוסף משקפיים';};
  function getDist(){var e=document.getElementById('inp-eye-dist');return e?parseFloat(e.value):2;}
  // Geometry
  var cx=W*0.72,cy=H*0.46,Rx=118,Ry=92;
  var eyeFront=cx-Rx,retinaX=cx+Rx*0.72;
  function distToX(d){return eyeFront-90-(Math.log(d/0.25)/Math.log(24))*(eyeFront-150);}
  function xToDist(x){return 0.25*Math.pow(24,(eyeFront-90-x)/(eyeFront-150));}
  // ── Direct manipulation: drag the object closer/farther ──
  var dragObj=false,hasDragged=false;
  function _hit(p){var ox=distToX(getDist());return Math.abs(p.x-ox)<28&&p.y>cy-96&&p.y<cy+22;}
  function _dn(e){var p=simPointerXY(canvas,dpr,e);if(_hit(p)){dragObj=true;hasDragged=true;canvas.style.cursor='grabbing';e.preventDefault();}}
  function _mv(e){var p=simPointerXY(canvas,dpr,e);
    if(dragObj){simSyncSlider('eye-dist',xToDist(p.x),2);e.preventDefault();}
    else canvas.style.cursor=_hit(p)?'grab':'';}
  function _up(){dragObj=false;canvas.style.cursor='';}
  canvas.addEventListener('mousedown',_dn);canvas.addEventListener('touchstart',_dn,{passive:false});
  canvas.addEventListener('mousemove',_mv);canvas.addEventListener('touchmove',_mv,{passive:false});
  canvas.addEventListener('mouseup',_up);canvas.addEventListener('touchend',_up);
  function draw(ts){
    if(_simStop[id])return;
    animT+=0.025;
    // ── Optical model (diopters): eye supplies power in [offEff, offEff+4] beyond the relaxed-normal state.
    //    Myopia: range shifted +2D (too strong when relaxed → far blurry, near sharp).
    //    Hyperopia: range shifted −2D (can't add enough → near blurry, far sharp).
    //    Corrective glasses cancel the shift exactly (−2D diverging / +2D converging).
    var d0=getDist();
    var Ddem=1/d0;
    var off=mode==='myopia'?2:mode==='hyper'?-2:0;
    var offEff=glasses?0:off;
    var blur=Ddem<offEff?(offEff-Ddem):Ddem>offEff+4?(Ddem-offEff-4):0;
    var acc=Math.max(0,Math.min(4,Ddem-offEff));
    var focalShift=Ddem<offEff?-(offEff-Ddem)*16:Ddem>offEff+4?(Ddem-offEff-4)*16:0;
    focalShift=Math.max(-34,Math.min(34,focalShift));
    var focalX=retinaX+focalShift;
    var sharp=blur<0.05;
    // Background
    var bg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*0.7);
    bg.addColorStop(0,'#040e1e');bg.addColorStop(1,'#020810');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    // Distance axis
    ctx.save();ctx.strokeStyle='rgba(51,65,85,.5)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(40,cy+58);ctx.lineTo(eyeFront-20,cy+58);ctx.stroke();ctx.restore();
    [0.25,0.5,1,2,4,6].forEach(function(dm){
      var xm=distToX(dm);if(xm<44)return;
      ctx.save();ctx.strokeStyle='rgba(51,65,85,.6)';ctx.beginPath();ctx.moveTo(xm,cy+54);ctx.lineTo(xm,cy+62);ctx.stroke();ctx.restore();
      optLabel(ctx,dm+'m',xm,cy+72,'#475569',8);
    });
    // ── EYE ──────────────────────────────────────────────
    ctx.save();
    var sclG=ctx.createRadialGradient(cx,cy,0,cx,cy,Rx);
    sclG.addColorStop(0,'rgba(220,230,245,.13)');sclG.addColorStop(1,'rgba(180,200,230,.05)');
    ctx.fillStyle=sclG;ctx.strokeStyle='rgba(120,150,200,.4)';ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(cx,cy,Rx,Ry,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();
    // Retina (red arc, back inner surface)
    ctx.save();ctx.strokeStyle='rgba(248,113,113,.55)';ctx.lineWidth=4;
    optGlow(ctx,'#f87171',8);
    ctx.beginPath();ctx.arc(cx+Rx*0.30,cy,Ry*0.82,-Math.PI*0.42,Math.PI*0.42);ctx.stroke();
    optNoGlow(ctx);ctx.restore();
    optLabel(ctx,'רשתית',cx+Rx*0.95,cy-Ry*0.62,'#f87171',10);
    // Cornea
    ctx.save();ctx.strokeStyle='rgba(96,165,250,.9)';ctx.lineWidth=3.5;
    optGlow(ctx,'#60a5fa',12);
    ctx.beginPath();ctx.arc(eyeFront+52,cy,58,Math.PI*0.7,Math.PI*1.3);ctx.stroke();
    optNoGlow(ctx);ctx.restore();
    optLabel(ctx,'קרנית',eyeFront+4,cy-Ry-10,'#60a5fa',10);
    // Crystalline lens — thickness shows ACCOMMODATION live
    var lensX=eyeFront+42,lensW=9+acc*2.6,lensH=64;
    ctx.save();
    var lG=ctx.createRadialGradient(lensX,cy,0,lensX,cy,lensH/2);
    lG.addColorStop(0,'rgba(180,210,255,.45)');lG.addColorStop(1,'rgba(100,140,220,.12)');
    ctx.fillStyle=lG;ctx.strokeStyle='rgba(147,197,253,.85)';ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(lensX,cy,lensW,lensH/2,0,0,Math.PI*2);ctx.fill();
    optGlow(ctx,'#93c5fd',8);ctx.stroke();optNoGlow(ctx);ctx.restore();
    optLabel(ctx,'עדשה',lensX,cy+lensH/2+14,'#93c5fd',9);
    optLabel(ctx,'אקומודציה: '+acc.toFixed(1)+'D',lensX+4,cy-lensH/2-12,'#93c5fd',9);
    // ── CORRECTIVE GLASSES ───────────────────────────────
    var spectX=eyeFront-42;
    if(glasses&&mode==='myopia'){
      optDivLensShape(ctx,spectX,cy,12,124,'#22d3ee','rgba(34,211,238,.08)');
      optLabel(ctx,'עדשה מתקנת −2.0D',spectX,cy+80,'#22d3ee',9);
    } else if(glasses&&mode==='hyper'){
      optLensShape(ctx,spectX,cy,12,124,'#22d3ee','rgba(34,211,238,.08)');
      optLabel(ctx,'עדשה מתקנת +2.0D',spectX,cy+80,'#22d3ee',9);
    }
    // ── OBJECT (draggable arrow on the distance axis) ────
    var objX=distToX(d0),objH=64;
    ctx.save();ctx.strokeStyle='#a78bfa';ctx.lineWidth=3.5;optGlow(ctx,'#a78bfa',12);
    ctx.beginPath();ctx.moveTo(objX,cy+46);ctx.lineTo(objX,cy-objH);ctx.stroke();
    ctx.fillStyle='#c4b5fd';ctx.beginPath();
    ctx.moveTo(objX,cy-objH);ctx.lineTo(objX-9,cy-objH+17);ctx.lineTo(objX+9,cy-objH+17);ctx.closePath();ctx.fill();
    optNoGlow(ctx);ctx.restore();
    optLabel(ctx,'עצם',objX,cy+88,'#a78bfa',10);
    optLabel(ctx,d0.toFixed(2)+' m',objX,cy-objH-12,'#c4b5fd',9);
    if(!hasDragged&&animT<8){
      optLabel(ctx,'✋ גרור את העצם קרוב/רחוק',objX+10,cy-objH-28+Math.sin(animT*4)*3,'#fbbf24',10);
    }
    // ── RAYS: object tip → (glasses) → cornea → focus → retina ──
    var tipY=cy-objH+8;
    [-24,0,24].forEach(function(off2,ri){
      var eyeHitX=eyeFront+16,eyeHitY=cy+off2*0.55;
      var path=[{x:objX,y:tipY}];
      if(glasses&&mode!=='normal'){
        var sy=tipY+((eyeHitY-tipY)*((spectX-objX)/(eyeHitX-objX)));
        sy+= (mode==='myopia'?off2*0.22:-off2*0.22); // visible kink at the corrective lens
        path.push({x:spectX,y:sy});
      }
      path.push({x:eyeHitX,y:eyeHitY});
      path.push({x:focalX,y:cy});
      if(!sharp){
        var sl=(cy-eyeHitY)/(focalX-eyeHitX);
        path.push({x:retinaX,y:eyeHitY+sl*(retinaX-eyeHitX)});
      }
      ctx.save();ctx.strokeStyle='rgba(251,191,36,'+(ri===1?0.85:0.45)+')';ctx.lineWidth=ri===1?2:1.4;
      optGlow(ctx,'#fbbf24',4);
      ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);
      path.slice(1).forEach(function(p){ctx.lineTo(p.x,p.y);});ctx.stroke();
      optNoGlow(ctx);ctx.restore();
      // photon stream on the central ray
      if(ri===1){
        var segs=[],tot=0;
        for(var si=1;si<path.length;si++){var L2=Math.hypot(path[si].x-path[si-1].x,path[si].y-path[si-1].y);segs.push(L2);tot+=L2;}
        [0,0.5].forEach(function(po){
          var prog=((animT*0.5+po)%1)*tot;
          for(var si=0;si<segs.length;si++){
            if(prog<=segs[si]){
              var fr=prog/Math.max(1e-6,segs[si]);
              ctx.save();ctx.fillStyle='#fff7d6';optGlow(ctx,'#fbbf24',10);
              ctx.beginPath();ctx.arc(path[si].x+(path[si+1].x-path[si].x)*fr,path[si].y+(path[si+1].y-path[si].y)*fr,2.6,0,Math.PI*2);ctx.fill();
              optNoGlow(ctx);ctx.restore();break;
            }
            prog-=segs[si];
          }
        });
      }
    });
    // Focus marker + retina blur disc
    ctx.save();ctx.fillStyle=sharp?'#34d399':'#f87171';optGlow(ctx,sharp?'#34d399':'#f87171',16);
    ctx.beginPath();ctx.arc(focalX,cy,5,0,Math.PI*2);ctx.fill();optNoGlow(ctx);ctx.restore();
    if(!sharp){
      var blurR=Math.min(26,blur*10+5);
      ctx.save();ctx.fillStyle='rgba(248,113,113,.25)';optGlow(ctx,'#f87171',10);
      ctx.beginPath();ctx.arc(retinaX,cy,blurR,0,Math.PI*2);ctx.fill();optNoGlow(ctx);ctx.restore();
      optLabel(ctx,'טשטוש',retinaX,cy-blurR-10,'#f87171',9);
    } else {
      optLabel(ctx,'חד! ✓',retinaX+6,cy-16,'#34d399',10);
    }
    // ── INSET: what the eye actually sees ────────────────
    var ibx=12,iby=12,ibw=158,ibh=112;
    ctx.save();ctx.fillStyle='rgba(6,14,28,.92)';ctx.strokeStyle=sharp?'#34d399':'#f87171';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.roundRect(ibx,iby,ibw,ibh,8);ctx.fill();ctx.stroke();ctx.restore();
    optLabel(ctx,'👁 מה העין רואה',ibx+ibw/2,iby+15,'#94a3b8',9);
    var iaX=ibx+ibw/2,iaTop=iby+34,iaBot=iby+ibh-20;
    var passes=sharp?1:7;
    for(var bp=0;bp<passes;bp++){
      var ang=bp*Math.PI*2/7,rad=sharp?0:Math.min(14,blur*5);

      ctx.beginPath();ctx.moveTo(iaX+ox2,iaBot+oy2);ctx.lineTo(iaX+ox2,iaTop+oy2);ctx.stroke();
      ctx.fillStyle='#c4b5fd';ctx.beginPath();

      if(sharp)optNoGlow(ctx);

    }
    optLabel(ctx,sharp?'תמונה חדה ✓':'תמונה מטושטשת',ibx+ibw/2,iby+ibh-6,sharp?'#34d399':'#f87171',8.5);
    // ── Status + sharp-range readout ─────────────────────
    var modeName=mode==='myopia'?'קוצר ראייה':mode==='hyper'?'רוחק ראייה':'ראייה תקינה';
    var nearPt=1/(offEff+4),farPt=offEff>0.01?(1/offEff):Infinity;
    var rangeStr='טווח ראייה חדה: '+nearPt.toFixed(2)+'m עד '+(isFinite(farPt)?farPt.toFixed(2)+'m':'∞');
    ctx.save();ctx.fillStyle='rgba(4,9,20,.85)';ctx.beginPath();ctx.roundRect(W/2-190,H-56,380,44,6);ctx.fill();ctx.restore();
    optLabel(ctx,modeName+(glasses&&mode!=='normal'?' + משקפיים מתקנים':'')+(sharp?' — ממוקד על הרשתית ✓':' — טשטוש '+blur.toFixed(1)+'D'),W/2,H-42,sharp?'#34d399':'#f87171',11);
    optLabel(ctx,rangeStr,W/2,H-24,'#94a3b8',9);
    requestAnimationFrame(draw);
  }requestAnimationFrame(draw);
}

// ─── INTERFERENCE — Enhanced (real 2D wave sim) ────────────────────
function simOptInterference(canvas){
  const H=420;const{ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;var animT=0;
  function getVals(){
    var lE=document.getElementById('inp-int-lambda'),dE=document.getElementById('inp-int-d');
    return{lambda:lE?parseFloat(lE.value):500,d:dE?parseFloat(dE.value):5};
  }
  // ── Direct manipulation: drag the sources (d) or place the probe anywhere ──
  var probeP=null,dragI=null,touchedI=false;
  function _iDn(e){var p=simPointerXY(canvas,dpr,e);
    var v=getVals();var dd=v.d*10,sx=W*0.22,s1=H/2-dd/2,s2=H/2+dd/2;
    if(Math.hypot(p.x-sx,p.y-s1)<18||Math.hypot(p.x-sx,p.y-s2)<18)dragI='src';
    else if(p.x>sx+22)dragI='probe';
    if(dragI){touchedI=true;canvas.style.cursor='grabbing';
      if(dragI==='probe')probeP={x:Math.max(sx+26,Math.min(W-12,p.x)),y:Math.max(12,Math.min(H-12,p.y))};
      e.preventDefault();}}
  function _iMv(e){var p=simPointerXY(canvas,dpr,e);
    if(dragI==='probe'){var sx=W*0.22;probeP={x:Math.max(sx+26,Math.min(W-12,p.x)),y:Math.max(12,Math.min(H-12,p.y))};e.preventDefault();}
    else if(dragI==='src'){simSyncSlider('int-d',Math.abs(p.y-H/2)*2/10,2);e.preventDefault();}
    else{var v=getVals();var dd=v.d*10,sx=W*0.22,s1=H/2-dd/2,s2=H/2+dd/2;
      canvas.style.cursor=(Math.hypot(p.x-sx,p.y-s1)<18||Math.hypot(p.x-sx,p.y-s2)<18||(probeP&&Math.hypot(p.x-probeP.x,p.y-probeP.y)<22))?'grab':'';}}
  function _iUp(){dragI=null;canvas.style.cursor='';}
  canvas.addEventListener('mousedown',_iDn);canvas.addEventListener('touchstart',_iDn,{passive:false});
  canvas.addEventListener('mousemove',_iMv);canvas.addEventListener('touchmove',_iMv,{passive:false});
  canvas.addEventListener('mouseup',_iUp);canvas.addEventListener('touchend',_iUp);
  var off=document.createElement('canvas');var offCtx=off.getContext('2d');
  function draw(ts){
    if(_simStop[id])return;
    animT+=0.06;
    var v=getVals();var lam_nm=v.lambda,d_mm=v.d;
    var lam=10+(lam_nm-380)/320*70;var d=d_mm*10;// nm→px, mm→px
    var s1y=H/2-d/2,s2y=H/2+d/2,sx=W*0.22;
    var bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#020810');bg.addColorStop(1,'#030d1a');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    var k=2*Math.PI/lam;
    var visWL=lam_nm;// slider is in nm
    var rgb=wavelengthToRGB(visWL).match(/[\d.]+/g);var lr=parseFloat(rgb[0])/255,lg=parseFloat(rgb[1])/255,lb=parseFloat(rgb[2])/255;
    // Half-resolution wave-field render (4× fewer pixels), scaled up on draw
    var hw=Math.ceil(W/2),hh=Math.ceil(H/2);
    if(off.width!==hw||off.height!==hh){off.width=hw;off.height=hh;}
    var imgData=offCtx.createImageData(hw,hh);
    var sxh=sx/2,s1h=s1y/2,s2h=s2y/2,k2=k*2;
    for(var y=0;y<hh;y++){
      for(var x=Math.floor(sxh);x<hw;x++){
        var r1=Math.sqrt((x-sxh)*(x-sxh)+(y-s1h)*(y-s1h));
        var r2=Math.sqrt((x-sxh)*(x-sxh)+(y-s2h)*(y-s2h));
        var ph1=k2*r1-animT;var ph2=k2*r2-animT;
        var e1=Math.cos(ph1)/Math.max(1,r1*0.12);
        var e2=Math.cos(ph2)/Math.max(1,r2*0.12);
        var amp=Math.min(1,Math.max(0,(e1+e2+2)/4));
        var bright=Math.pow(amp,1.4);
        var idx=(y*hw+x)*4;
        imgData.data[idx]=Math.round(lr*bright*255);
        imgData.data[idx+1]=Math.round(lg*bright*255);
        imgData.data[idx+2]=Math.round(lb*bright*255);
        imgData.data[idx+3]=Math.round(bright*200);
      }
    }
    offCtx.putImageData(imgData,0,0);
    ctx.save();ctx.imageSmoothingEnabled=true;
    ctx.drawImage(off,0,0,hw,hh,0,0,W,H);ctx.restore();
    // Barrier
    ctx.save();ctx.fillStyle='rgba(15,28,46,.95)';
    ctx.fillRect(sx-4,0,8,s1y-15);ctx.fillRect(sx-4,s1y+15,8,s2y-s1y-30);ctx.fillRect(sx-4,s2y+15,8,H-s2y-15);
    ctx.restore();
    // Sources with animated ripples
    [s1y,s2y].forEach(function(sy,i){
      for(var r=0;r<80;r+=20){
        var rr=(r+animT*lam*0.3)%80;
        ctx.save();ctx.strokeStyle='rgba(251,191,36,'+(0.3*(1-rr/80)).toFixed(2)+')';ctx.lineWidth=1;
        ctx.beginPath();ctx.arc(sx,sy,rr,0,Math.PI);ctx.stroke();ctx.restore();
      }
      ctx.save();ctx.fillStyle='#fbbf24';optGlow(ctx,'#fbbf24',16);
      ctx.beginPath();ctx.arc(sx,sy,6,0,Math.PI*2);ctx.fill();optNoGlow(ctx);ctx.restore();
      optLabel(ctx,'S'+(i+1),sx-16,sy,'#fbbf24',10);
    });
    // ── Probe: local path difference in the 2D field ──
    if(probeP===null)probeP={x:sx+(W-sx)*0.5,y:H/2-34};
    var pr1=Math.hypot(probeP.x-sx,probeP.y-s1y);
    var pr2=Math.hypot(probeP.x-sx,probeP.y-s2y);
    var pmVal=Math.abs(pr2-pr1)/lam;
    var pmR=Math.round(pmVal);
    var pKind=Math.abs(pmVal-pmR)<0.12?'max':Math.abs(pmVal-(Math.floor(pmVal)+0.5))<0.12?'min':'mid';
    var pkCol=pKind==='max'?'#34d399':pKind==='min'?'#f87171':'#e2e8f0';
    ctx.save();ctx.setLineDash([5,5]);ctx.lineWidth=1.3;
    ctx.strokeStyle='rgba(251,191,36,.8)';
    ctx.beginPath();ctx.moveTo(sx,s1y);ctx.lineTo(probeP.x,probeP.y);ctx.stroke();
    ctx.strokeStyle='rgba(34,211,238,.8)';
    ctx.beginPath();ctx.moveTo(sx,s2y);ctx.lineTo(probeP.x,probeP.y);ctx.stroke();
    ctx.setLineDash([]);ctx.restore();
    ctx.save();ctx.fillStyle=pkCol;optGlow(ctx,pkCol,14);
    ctx.beginPath();ctx.arc(probeP.x,probeP.y,8,0,Math.PI*2);ctx.fill();optNoGlow(ctx);
    ctx.fillStyle='#0b1220';ctx.beginPath();ctx.arc(probeP.x,probeP.y,3.5,0,Math.PI*2);ctx.fill();ctx.restore();
    if(!touchedI&&animT<12)optLabel(ctx,'✋ לחץ בכל מקום בשדה — או גרור מקור',probeP.x,probeP.y-20+Math.sin(animT)*3,'#fbbf24',10);
    ctx.save();ctx.fillStyle='rgba(4,9,20,.9)';ctx.strokeStyle=pkCol;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.roundRect(W-232,H-64,224,56,7);ctx.fill();ctx.stroke();ctx.restore();
    optLabel(ctx,'Δ = |r₂−r₁| = '+pmVal.toFixed(2)+'λ',W-120,H-46,pkCol,10.5);
    optLabel(ctx,pKind==='max'?'התאבכות בונה (m='+pmR+') — נקודה בהירה':pKind==='min'?'התאבכות הורסת — נקודה כהה':'ביניים',W-120,H-25,pkCol,9);
    optInfoBox(ctx,8,8,152,['λ='+lam_nm+'nm','d='+d_mm+'mm (גרור מקור)']);
    requestAnimationFrame(draw);
  }requestAnimationFrame(draw);
}

// ─── YOUNG'S DOUBLE SLIT — Enhanced ──────────────────────────────
function simOptYoungs(canvas){
  const H=460;const{ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;var animT=0;
  var slitX=90,cy=H/2;
  function getVals(){
    var lE=document.getElementById('inp-ys-lambda'),dE=document.getElementById('inp-ys-d'),LE=document.getElementById('inp-ys-L');
    return{lambda:lE?parseFloat(lE.value):500,d:dE?parseFloat(dE.value):0.3,L:LE?parseFloat(LE.value):1};
  }
  function LtoX(L){return slitX+150+(L-0.5)/2.5*(W-70-(slitX+150));}
  function XtoL(x){return 0.5+2.5*(x-(slitX+150))/(W-70-(slitX+150));}
  function calc(){
    var v=getVals();
    var lam_m=v.lambda*1e-9,d_m=v.d*1e-3,L_m=v.L;
    var Dy_m=lam_m*L_m/d_m;
    var SCALE_PX=(H*0.17)/(500e-9*1.0/0.3e-3);
    return{v:v,lam_m:lam_m,d_m:d_m,L_m:L_m,Dy_m:Dy_m,S:SCALE_PX,
      DyPx:Math.max(6,Math.min(H*0.38,Dy_m*SCALE_PX)),
      scrX:LtoX(v.L),dScale:Math.max(14,Math.min(88,v.d*88))};
  }
  // ── Direct manipulation: detector probe, screen distance, slit separation ──
  var detY=null,dragWhat=null,hasDragged=false;
  function _dn(e){
    var p=simPointerXY(canvas,dpr,e),c=calc();
    var dy0=detY===null?cy-c.DyPx:detY;
    if(Math.abs(p.x-(c.scrX+16))<22&&Math.abs(p.y-dy0)<20)dragWhat='det';
    else if(Math.abs(p.x-c.scrX)<14)dragWhat='screen';
    else if(Math.abs(p.x-slitX)<18&&Math.abs(Math.abs(p.y-cy)-c.dScale)<18)dragWhat='slit';
    if(dragWhat){hasDragged=true;canvas.style.cursor='grabbing';e.preventDefault();}
  }
  function _mv(e){
    var p=simPointerXY(canvas,dpr,e);
    if(dragWhat==='det'){detY=Math.max(12,Math.min(H-12,p.y));e.preventDefault();}
    else if(dragWhat==='screen'){simSyncSlider('ys-L',XtoL(p.x),2);e.preventDefault();}
    else if(dragWhat==='slit'){simSyncSlider('ys-d',Math.abs(p.y-cy)/88,2);e.preventDefault();}
    else{
      var c=calc();var dy0=detY===null?cy-c.DyPx:detY;
      canvas.style.cursor=((Math.abs(p.x-(c.scrX+16))<22&&Math.abs(p.y-dy0)<20)||Math.abs(p.x-c.scrX)<14||(Math.abs(p.x-slitX)<18&&Math.abs(Math.abs(p.y-cy)-c.dScale)<18))?'grab':'';
    }
  }
  function _up(){dragWhat=null;canvas.style.cursor='';}
  canvas.addEventListener('mousedown',_dn);canvas.addEventListener('touchstart',_dn,{passive:false});
  canvas.addEventListener('mousemove',_mv);canvas.addEventListener('touchmove',_mv,{passive:false});
  canvas.addEventListener('mouseup',_up);canvas.addEventListener('touchend',_up);
  function draw(){
    if(_simStop[id])return;
    animT+=0.04;
    var c=calc(),v=c.v;
    var scrX=c.scrX,DyPx=c.DyPx,dScale=c.dScale;
    if(detY===null)detY=cy-DyPx;
    var col=wavelengthToHex(v.lambda);
    var bgG=ctx.createLinearGradient(0,0,0,H);bgG.addColorStop(0,'#020810');bgG.addColorStop(1,'#030d1a');
    ctx.fillStyle=bgG;ctx.fillRect(0,0,W,H);
    var s1y=cy-dScale,s2y=cy+dScale;
    // Source
    ctx.save();ctx.fillStyle=col;optGlow(ctx,col,20);
    ctx.beginPath();ctx.arc(24,cy,8,0,Math.PI*2);ctx.fill();optNoGlow(ctx);ctx.restore();
    optLabel(ctx,'מקור',24,cy+22,'#64748b',9);
    // Source→slit rays + photons
    var sp=(animT*0.45)%1;
    [s1y,s2y].forEach(function(sy){
      ctx.save();ctx.strokeStyle=col;ctx.lineWidth=1;ctx.globalAlpha=0.35;
      ctx.beginPath();ctx.moveTo(24,cy);ctx.lineTo(slitX-4,sy);ctx.stroke();
      ctx.globalAlpha=1;ctx.fillStyle=col;optGlow(ctx,col,8);
      ctx.beginPath();ctx.arc(24+(slitX-28)*sp,cy+(sy-cy)*sp,2.5,0,Math.PI*2);ctx.fill();
      optNoGlow(ctx);ctx.restore();
    });
    // Barrier with two slits (draggable separation)
    var slitH=8;
    ctx.save();ctx.fillStyle='rgba(15,28,46,.95)';ctx.strokeStyle='rgba(71,85,105,.4)';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(slitX-4,10,8,s1y-slitH-10,2);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.roundRect(slitX-4,s1y+slitH,8,s2y-s1y-slitH*2,2);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.roundRect(slitX-4,s2y+slitH,8,H-s2y-slitH-10,2);ctx.fill();ctx.stroke();
    ctx.restore();
    optLabel(ctx,'d='+v.d.toFixed(2)+'mm ↕',slitX+26,cy,col,9);
    optLabel(ctx,'S₁',slitX-14,s1y,'#94a3b8',8);
    optLabel(ctx,'S₂',slitX-14,s2y,'#94a3b8',8);
    // Huygens wavelets from both slits
    for(var w=1;w<=4;w++){
      var rr=(w*24+(animT*30)%24);
      [s1y,s2y].forEach(function(sy){
        ctx.save();ctx.strokeStyle=col;ctx.globalAlpha=0.10*(5-w)/4;ctx.lineWidth=1;
        ctx.beginPath();ctx.arc(slitX,sy,rr,-Math.PI/2,Math.PI/2);ctx.stroke();ctx.restore();
      });
    }
    // Screen: BRIGHT wide fringes (cos² profile)
    var fadeIn=Math.min(1,animT*0.25);
    ctx.save();
    for(var yy=6;yy<H-6;yy++){
      var I=Math.pow(Math.cos(Math.PI*(yy-cy)/DyPx),2);
      if(I<0.02)continue;
      ctx.fillStyle=col;ctx.globalAlpha=I*fadeIn;
      ctx.fillRect(scrX-8,yy,16,1);
    }
    ctx.restore();
    // Intensity curve I(y) beside the screen
    ctx.save();ctx.strokeStyle=col;ctx.lineWidth=1.6;ctx.globalAlpha=0.8;
    ctx.beginPath();
    for(var yy2=6;yy2<H-6;yy2+=2){
      var I2=Math.pow(Math.cos(Math.PI*(yy2-cy)/DyPx),2);
      var xx=scrX-12-I2*52;
      yy2===6?ctx.moveTo(xx,yy2):ctx.lineTo(xx,yy2);
    }
    ctx.stroke();ctx.restore();
    optLabel(ctx,'I(y)',scrX-56,16,'#64748b',8);
    // Screen frame (draggable → L)
    ctx.save();ctx.strokeStyle='rgba(148,163,184,.5)';ctx.lineWidth=1.5;
    ctx.strokeRect(scrX-8,6,16,H-12);ctx.restore();
    optLabel(ctx,'מסך ↔ L='+v.L.toFixed(2)+'m',scrX,H-10,'#94a3b8',9);
    // Δy bracket
    if(DyPx>12){
      ctx.save();ctx.strokeStyle='#fbbf24';ctx.lineWidth=1;ctx.setLineDash([3,4]);
      ctx.beginPath();ctx.moveTo(scrX-64,cy);ctx.lineTo(scrX-64,cy-DyPx);ctx.stroke();
      ctx.setLineDash([]);ctx.restore();
      optLabel(ctx,'Δy='+(c.Dy_m*1000).toFixed(2)+'mm',scrX-64,cy-DyPx-10,'#fbbf24',8.5);
    }
    // ── DETECTOR: the path-difference probe (exact geometry) ──
    var y_m=(detY-cy)/c.S;
    var r1=Math.sqrt(c.L_m*c.L_m+(y_m-c.d_m/2)*(y_m-c.d_m/2));
    var r2=Math.sqrt(c.L_m*c.L_m+(y_m+c.d_m/2)*(y_m+c.d_m/2));
    var dPath=Math.abs(r2-r1);
    var mVal=dPath/c.lam_m;
    var mR=Math.round(mVal);
    var toInt=Math.abs(mVal-mR);
    var toHalf=Math.abs(mVal-(Math.floor(mVal)+0.5));
    var kind=toInt<0.08?'max':toHalf<0.08?'min':'mid';
    var kCol=kind==='max'?'#34d399':kind==='min'?'#f87171':'#e2e8f0';
    // r1, r2 rays from the slits to the detector
    ctx.save();ctx.setLineDash([5,5]);ctx.lineWidth=1.4;
    ctx.strokeStyle='rgba(251,191,36,.75)';
    ctx.beginPath();ctx.moveTo(slitX,s1y);ctx.lineTo(scrX-8,detY);ctx.stroke();
    ctx.strokeStyle='rgba(34,211,238,.75)';
    ctx.beginPath();ctx.moveTo(slitX,s2y);ctx.lineTo(scrX-8,detY);ctx.stroke();
    ctx.setLineDash([]);ctx.restore();
    optLabel(ctx,'r₁',slitX+(scrX-slitX)*0.45,s1y+(detY-s1y)*0.45-10,'#fbbf24',9);
    optLabel(ctx,'r₂',slitX+(scrX-slitX)*0.45,s2y+(detY-s2y)*0.45+12,'#22d3ee',9);
    // detector marker
    ctx.save();ctx.fillStyle=kCol;optGlow(ctx,kCol,14);
    ctx.beginPath();ctx.arc(scrX+16,detY,8,0,Math.PI*2);ctx.fill();optNoGlow(ctx);
    ctx.fillStyle='#0b1220';ctx.beginPath();ctx.arc(scrX+16,detY,3.5,0,Math.PI*2);ctx.fill();ctx.restore();
    if(!hasDragged&&animT<9){
      optLabel(ctx,'✋ גרור את הגלאי',scrX-40,detY-22+Math.sin(animT*4)*3,'#fbbf24',10);
    }
    // verdict panel
    ctx.save();ctx.fillStyle='rgba(4,9,20,.9)';ctx.strokeStyle=kCol;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.roundRect(8,H-78,238,70,7);ctx.fill();ctx.stroke();ctx.restore();
    optLabel(ctx,'גלאי: y='+(y_m*1000).toFixed(2)+'mm',127,H-62,'#e2e8f0',10);
    optLabel(ctx,'Δ = r₂−r₁ = '+mVal.toFixed(2)+'λ',127,H-45,kCol,11);
    optLabel(ctx,kind==='max'?'התאבכות בונה — פס בהיר (m='+mR+')':kind==='min'?'התאבכות הורסת — פס כהה':'בין מקסימום למינימום',127,H-26,kCol,9.5);
    optInfoBox(ctx,8,8,176,['λ='+v.lambda+'nm','d='+v.d.toFixed(2)+'mm  (גרור סדק)','L='+v.L.toFixed(2)+'m  (גרור מסך)','Δy=λL/d='+(c.Dy_m*1000).toFixed(2)+'mm']);
    requestAnimationFrame(draw);
  }
  function poll(){if(_simStop[id])return;requestAnimationFrame(draw);}poll();
}

// ─── DIFFRACTION — Enhanced ───────────────────────────────────────
function simOptDiffraction(canvas){
  const H=440;const{ctx,W,dpr}=setupCanvas(canvas,H);

    if(Math.abs(p.x-(W-52))<28){dragProbe=true;probeTouched=true;probeY=Math.max(10,Math.min(H-10,p.y));canvas.style.cursor='grabbing';e.preventDefault();}}
  function _pMv(e){var p=simPointerXY(canvas,dpr,e);
    if(dragProbe){probeY=Math.max(10,Math.min(H-10,p.y));e.preventDefault();}
    else canvas.style.cursor=Math.abs(p.x-(W-52))<28?'grab':'';}
  function _pUp(){dragProbe=false;canvas.style.cursor='';}
  canvas.addEventListener('mousedown',_pDn);canvas.addEventListener('touchstart',_pDn,{passive:false});
  canvas.addEventListener('mousemove',_pMv);canvas.addEventListener('touchmove',_pMv,{passive:false});
  canvas.addEventListener('mouseup',_pUp);canvas.addEventListener('touchend',_pUp);
  function draw(){
    if(_simStop[id])return;
    animT+=0.04;
    var v=getVals();
    var a_m=v.a*1e-3,lam_m=v.lambda*1e-9;
    var col=wavelengthToHex(v.lambda);
    var bgG=ctx.createLinearGradient(0,0,0,H);bgG.addColorStop(0,'#020810');bgG.addColorStop(1,'#030d1a');
    ctx.fillStyle=bgG;ctx.fillRect(0,0,W,H);
    var slitX=82,scrX=W-52,cy=H/2;
    var slitHalf=Math.max(5,Math.min(52,Math.round(5+v.a*47)));// dynamic: a=0.05mm→7px, a=1mm→52px
    // Barrier with slit
    ctx.save();ctx.fillStyle='rgba(15,28,46,.95)';ctx.strokeStyle='rgba(71,85,105,.4)';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(slitX-4,8,8,cy-slitHalf-8,2);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.roundRect(slitX-4,cy+slitHalf,8,H-cy-slitHalf-8,2);ctx.fill();ctx.stroke();
    ctx.restore();
    optLabel(ctx,'a='+v.a+'mm',slitX+14,cy,col,9);
    // Incoming plane wave (animated wavefronts)
    var wavePhase=(animT*28)%40;
    for(var wi=0;wi<4;wi++){
      var wx=slitX-16-wi*22+wavePhase;if(wx<6)continue;
      ctx.save();ctx.strokeStyle=col;ctx.lineWidth=1;ctx.globalAlpha=0.3;
      ctx.beginPath();ctx.moveTo(wx,8);ctx.lineTo(wx,H-8);ctx.stroke();
      ctx.restore();
    }
    // Huygens wavelets from slit
    var nWav=6;
    for(var w=1;w<=nWav;w++){
      var rr=(w*16+(animT*26)%(16));if(rr<4)continue;
      ctx.save();ctx.strokeStyle=col;ctx.lineWidth=0.8;ctx.globalAlpha=(nWav-w+1)/nWav*0.25;
      [-slitHalf*0.5,0,slitHalf*0.5].forEach(function(off){
        ctx.beginPath();ctx.arc(slitX,cy+off,rr,-Math.PI/2,Math.PI/2);ctx.stroke();
      });
      ctx.restore();
    }
    // DIFFRACTION PATTERN: use normalized scale so first minimum is always visible
    // theta_min = arcsin(lambda/a)
    var ratio=lam_m/a_m;
    var theta_min=(ratio>=1)?Math.PI/2:Math.asin(ratio);
    // Scale: first minimum appears at H*0.28 from center
    var L_eff=(H*0.28)/Math.tan(theta_min); // effective screen distance in px
    // Draw intensity profile
    ctx.save();ctx.strokeStyle=col;ctx.lineWidth=2.5;optGlow(ctx,col,10);
    ctx.beginPath();
    var nPts=150;
    for(var yi=0;yi<=nPts;yi++){
      var y=(yi/nPts-0.5)*(H*0.92);
      var theta=Math.atan2(y,L_eff);
      var sarg=Math.PI*a_m*Math.sin(theta)/lam_m;
      var I=Math.abs(sarg)<1e-6?1:Math.pow(Math.sin(sarg)/sarg,2);
      var xp=scrX-4-I*32;
      var yp=cy+y;
      yi===0?ctx.moveTo(xp,yp):ctx.lineTo(xp,yp);
    }
    ctx.stroke();optNoGlow(ctx);ctx.restore();
    // Filled intensity area
    var rgb=wavelengthToRGB(v.lambda).match(/[\d.]+/g);
    ctx.save();ctx.fillStyle='rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',.12)';
    ctx.beginPath();ctx.moveTo(scrX-4,cy-H*0.46);
    for(var yi=0;yi<=nPts;yi++){
      var y=(yi/nPts-0.5)*(H*0.92);
      var theta=Math.atan2(y,L_eff);
      var sarg=Math.PI*a_m*Math.sin(theta)/lam_m;
      var I=Math.abs(sarg)<1e-6?1:Math.pow(Math.sin(sarg)/sarg,2);
      ctx.lineTo(scrX-4-I*32,cy+y);
    }
    ctx.lineTo(scrX-4,cy+H*0.46);ctx.closePath();ctx.fill();ctx.restore();
    // Minimum markers
    for(var m=1;m<=4;m++){
      if(ratio*m>1)break;
      var thMin=Math.asin(ratio*m);
      var ymPos=Math.tan(thMin)*L_eff;
      [ymPos,-ymPos].forEach(function(ym){
        ctx.save();ctx.strokeStyle='rgba(248,113,113,.55)';ctx.lineWidth=1;ctx.setLineDash([3,4]);
        ctx.beginPath();ctx.moveTo(scrX-4,cy+ym);ctx.lineTo(scrX+20,cy+ym);ctx.stroke();ctx.setLineDash([]);ctx.restore();
        optLabel(ctx,'m='+m,scrX+30,cy+ym,'rgba(248,113,113,.7)',8);
      });
    }
    // Screen column
    ctx.save();ctx.fillStyle='rgba(20,35,60,.9)';ctx.beginPath();ctx.roundRect(scrX-4,8,8,H-16,3);ctx.fill();ctx.restore();
    // Rays
    [-slitHalf/2,0,slitHalf/2].forEach(function(off){
      ctx.save();ctx.strokeStyle=col;ctx.lineWidth=0.8;ctx.globalAlpha=0.12;ctx.setLineDash([4,8]);
      ctx.beginPath();ctx.moveTo(slitX,cy+off);ctx.lineTo(scrX,cy);ctx.stroke();ctx.setLineDash([]);ctx.restore();
    });
    var th1=(ratio<1?(Math.asin(ratio)*180/Math.PI):90).toFixed(1);
    // ── Probe: find the minima with your own hands ──
    if(probeY===null)probeY=cy+H*0.15;
    var thP=Math.atan((probeY-cy)/L_eff);
    var mP=a_m*Math.sin(Math.abs(thP))/lam_m;
    var mPR=Math.round(mP);
    var isMinP=mPR>0&&Math.abs(mP-mPR)<0.06;
    var pCol=isMinP?'#f87171':mP<0.5?'#34d399':'#e2e8f0';
    ctx.save();ctx.setLineDash([4,6]);ctx.strokeStyle='rgba(148,163,184,.5)';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(slitX,cy);ctx.lineTo(scrX-4,probeY);ctx.stroke();ctx.setLineDash([]);ctx.restore();
    ctx.save();ctx.fillStyle=pCol;optGlow(ctx,pCol,12);
    ctx.beginPath();ctx.arc(scrX+10,probeY,7,0,Math.PI*2);ctx.fill();optNoGlow(ctx);
    ctx.fillStyle='#0b1220';ctx.beginPath();ctx.arc(scrX+10,probeY,3,0,Math.PI*2);ctx.fill();ctx.restore();
    if(!probeTouched&&animT<9)optLabel(ctx,'✋ גרור את הגלאי',scrX-56,probeY-18+Math.sin(animT*4)*3,'#fbbf24',10);
    ctx.save();ctx.fillStyle='rgba(4,9,20,.9)';ctx.strokeStyle=pCol;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.roundRect(8,H-64,230,56,7);ctx.fill();ctx.stroke();ctx.restore();
    optLabel(ctx,'גלאי: a·sinθ = '+mP.toFixed(2)+'λ  (θ='+(thP*180/Math.PI).toFixed(1)+'°)',123,H-46,pCol,9.5);
    optLabel(ctx,isMinP?'מינימום עקיפה! a·sinθ = '+mPR+'λ':mP<0.5?'בתוך הפס המרכזי הבהיר':'בין מינימומים',123,H-25,pCol,9.5);
    optInfoBox(ctx,8,8,164,['a='+v.a+'mm','λ='+v.lambda+'nm','θ_min₁='+th1+'°','סדק צר → פיזור רחב']);
    requestAnimationFrame(draw);
  }
  function poll(){if(_simStop[id])return;requestAnimationFrame(draw);}poll();
}





// ─────────────────────────────────────────────────────────────
// EM SPECTRUM sim
// ─────────────────────────────────────────────────────────────
function simOptEMSpectrum(canvas,id){
  var _g=(_simGen[id]=(_simGen[id]||0)+1);
  var R=setupCanvas(canvas,480);var ctx=R.ctx,W=R.W,H=R.H;
  var animT=0,last=null;
  // TRUE band boundaries in log10(frequency/Hz) — one scale for gradient, labels, detection and marker
  var bands=[
    {name:'גלי רדיו',icon:'📻',col:'#6366f1',lo:3,hi:9,app:'שידורים, WiFi'},
    {name:'מיקרוגל',icon:'📡',col:'#8b5cf6',lo:9,hi:11.5,app:'תנור, רדאר'},
    {name:'IR',icon:'♨',col:'#f97316',lo:11.5,hi:14.63,app:'חום, שלט'},
    {name:'נראה',icon:'👁',col:'#facc15',lo:14.63,hi:14.9,app:'ראייה'},
    {name:'UV',icon:'☀',col:'#a78bfa',lo:14.9,hi:16.5,app:'שיזוף, UV-C'},
    {name:'רנטגן',icon:'🔬',col:'#60a5fa',lo:16.5,hi:19,app:'הדמיה רפואית'},
    {name:'גמא',icon:'⚡',col:'#f87171',lo:19,hi:22,app:'גרעין, PET'},
  ];
  function getPos(){var e=document.getElementById('inp-ems-pos');return e?parseFloat(e.value)/100:0.45;}
  // ── Direct manipulation: click/drag anywhere on the spectrum bar ──
  var dragBar=false;
  function _barHit(p){return p.x>=8&&p.x<=R.W-8&&p.y>=16&&p.y<=84;}
  function _sSet(p){simSyncSlider('ems-pos',(p.x-20)/(R.W-40)*100,0);}
  function _sDn(e){var p=simPointerXY(canvas,R.dpr,e);
    if(_barHit(p)){dragBar=true;_sSet(p);canvas.style.cursor='ew-resize';e.preventDefault();}}
  function _sMv(e){var p=simPointerXY(canvas,R.dpr,e);
    if(dragBar){_sSet(p);e.preventDefault();}
    else canvas.style.cursor=_barHit(p)?'ew-resize':'';}
  function _sUp(){dragBar=false;canvas.style.cursor='';}
  canvas.addEventListener('mousedown',_sDn);canvas.addEventListener('touchstart',_sDn,{passive:false});
  canvas.addEventListener('mousemove',_sMv);canvas.addEventListener('touchmove',_sMv,{passive:false});
  canvas.addEventListener('mouseup',_sUp);canvas.addEventListener('touchend',_sUp);
  function logToMeters(log10_f){
    // f in Hz → λ=c/f
    var f=Math.pow(10,log10_f+3); // slider 0-100 maps log10(f/Hz) 3..22
    return 3e8/f;
  }
  function formatLambda(m){
    if(m>=1e3)return (m/1e3).toFixed(1)+' km';
    if(m>=1)return m.toFixed(2)+' m';
    if(m>=1e-2)return (m*100).toFixed(1)+' cm';
    if(m>=1e-3)return (m*1e3).toFixed(1)+' mm';
    if(m>=1e-6)return (m*1e6).toFixed(1)+' μm';
    if(m>=1e-9)return (m*1e9).toFixed(1)+' nm';
    if(m>=1e-12)return (m*1e12).toFixed(1)+' pm';
    return m.toExponential(2)+' m';
  }
  function formatFreq(hz){
    if(hz>=1e18)return (hz/1e18).toFixed(1)+' EHz';
    if(hz>=1e15)return (hz/1e15).toFixed(1)+' PHz';
    if(hz>=1e12)return (hz/1e12).toFixed(1)+' THz';
    if(hz>=1e9)return (hz/1e9).toFixed(1)+' GHz';
    if(hz>=1e6)return (hz/1e6).toFixed(1)+' MHz';
    if(hz>=1e3)return (hz/1e3).toFixed(1)+' kHz';
    return hz.toFixed(0)+' Hz';
  }
  function formatEnergy(hz){
    var eV=6.626e-34*hz/1.6e-19;
    if(eV>=1e6)return (eV/1e6).toFixed(2)+' MeV';
    if(eV>=1e3)return (eV/1e3).toFixed(1)+' keV';
    if(eV>=1)return eV.toFixed(3)+' eV';
    if(eV>=1e-3)return (eV*1e3).toFixed(2)+' meV';
    if(eV>=1e-6)return (eV*1e6).toFixed(2)+' μeV';
    return (eV*1e9).toFixed(2)+' neV';
  }
  function draw(ts){
    if(_simGen[id]!==_g)return;
    if(_simStop[id])return;
    var dt=last?Math.min((ts-last)/1000,0.05):0.016;last=ts;animT+=dt;
    var pos=getPos(); // 0..1
    // Map pos to log10(f): range 3Hz (radio AM) to 22Hz (ultra-gamma)
    var logF=3+pos*19; // log10 of freq in Hz
    var freq=Math.pow(10,logF);
    var lambda=3e8/freq;
    ctx.fillStyle='#0f172a';ctx.fillRect(0,0,W,H);
    // Spectrum bar
    var barY=30,barH=36,barX=20,barW=W-40;
    // Gradient
    var l2p=function(lg){return Math.max(0,Math.min(1,(lg-3)/19));};
    var grad=ctx.createLinearGradient(barX,0,barX+barW,0);
    grad.addColorStop(0,'#6366f1');
    grad.addColorStop(l2p(9),'#8b5cf6');
    grad.addColorStop(l2p(11.5),'#f97316');
    // visible rainbow at its TRUE position: log f = 14.63–14.9
    grad.addColorStop(l2p(14.6),'#f97316');
    grad.addColorStop(l2p(14.64),'#ff0000');
    grad.addColorStop(l2p(14.71),'#ffaa00');
    grad.addColorStop(l2p(14.78),'#00ee00');
    grad.addColorStop(l2p(14.86),'#4444ff');
    grad.addColorStop(l2p(14.9),'#a78bfa');
    grad.addColorStop(l2p(16.5),'#60a5fa');
    grad.addColorStop(l2p(19),'#f87171');
    grad.addColorStop(1,'#f87171');
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.roundRect(barX,barY,barW,barH,6);ctx.fill();
    // Band labels above — centered at each band's true log-f position (visible is too narrow; its gold bracket labels it below)
    for(var bi=0;bi<bands.length;bi++){
      if(bands[bi].hi-bands[bi].lo<0.6)continue;
      var bx=barX+barW*l2p((bands[bi].lo+bands[bi].hi)/2);
      ctx.fillStyle=bands[bi].col;ctx.font='bold 9px sans-serif';ctx.textAlign='center';
      ctx.fillText(bands[bi].icon+' '+bands[bi].name,bx,barY-6);
    }
    // Cursor line
    var cx=barX+pos*barW;
    ctx.save();ctx.strokeStyle='#fff';ctx.lineWidth=2;
    ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(cx,barY-2);ctx.lineTo(cx,barY+barH+2);ctx.stroke();
    ctx.setLineDash([]);ctx.restore();
    // Cursor triangle
    ctx.fillStyle='#fff';ctx.beginPath();
    ctx.moveTo(cx,barY+barH+2);ctx.lineTo(cx-6,barY+barH+14);ctx.lineTo(cx+6,barY+barH+14);ctx.closePath();ctx.fill();
    // Determine current band from the shared log-f boundaries
    var curBand=bands[bands.length-1];
    for(var bi2=0;bi2<bands.length;bi2++){
      if(logF>=bands[bi2].lo&&logF<bands[bi2].hi){curBand=bands[bi2];break;}
    }
    // Wave visualization
    var waveY=H/2+10,waveH=80;
    var waveCycles=Math.max(1,Math.min(40,pos*50)); // # cycles to draw
    ctx.save();
    var wCol=curBand.col;
    if(logF>=14.63&&logF<=14.9){
      // visible: true wavelength color (λ = c/f)
      var visNm=3e8/Math.pow(10,logF)*1e9;
      wCol=wavelengthToHex(Math.max(380,Math.min(700,visNm)));
    }
    ctx.strokeStyle=wCol;ctx.lineWidth=2.5;
    optGlow(ctx,wCol,8);
    ctx.beginPath();
    var npts=300;
    for(var xi=0;xi<=npts;xi++){
      var xp=20+xi*(W-40)/npts;
      var phase=xi/npts*Math.PI*2*waveCycles+animT*2;
      var amp=waveH/2*0.8;
      var yp=waveY+Math.sin(phase)*amp;
      xi===0?ctx.moveTo(xp,yp):ctx.lineTo(xp,yp);
    }
    ctx.stroke();optNoGlow(ctx);ctx.restore();
    // Labels
    ctx.font='bold 13px sans-serif';ctx.fillStyle=curBand.col;ctx.textAlign='right';
    ctx.fillText(curBand.icon+' '+curBand.name,W-20,waveY-waveH/2-8);
    // Info box
    var infoLines=['λ = '+formatLambda(lambda),'f = '+formatFreq(freq),'E = '+formatEnergy(freq),'שימוש: '+curBand.app];
    optInfoBox(ctx,20,H-90,W-40,infoLines);
    // Visible window marker at its true log-f position
    var visX1=barX+barW*l2p(14.63);
    var visX2=barX+barW*l2p(14.9);
    ctx.save();ctx.strokeStyle='#fbbf24';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(visX1,barY+barH+22);ctx.lineTo(visX1,barY+barH+30);ctx.lineTo(visX2,barY+barH+30);ctx.lineTo(visX2,barY+barH+22);ctx.stroke();
    ctx.fillStyle='#fbbf24';ctx.font='8px sans-serif';ctx.textAlign='center';
    ctx.fillText('אור נראה',(visX1+visX2)/2,barY+barH+40);ctx.restore();
    requestAnimationFrame(draw);
  }
  function poll(){if(_simStop[id])return;requestAnimationFrame(draw);}poll();
}

// ─────────────────────────────────────────────────────────────
// POLARIZATION sim

function simOptPolarization(canvas,id){
  var _g=(_simGen[id]=(_simGen[id]||0)+1);
  var R=setupCanvas(canvas,480);var ctx=R.ctx,W=R.W,H=R.H;
  var animT=0,last=null;
  function getAngle(){var e=document.getElementById('inp-pol-angle');return e?parseFloat(e.value):45;}
  function getI0(){var e=document.getElementById('inp-pol-i0');return e?parseFloat(e.value)/100:0.8;}
  // ── Direct manipulation: rotate the analyzer disc ──
  var dragPol=false,hasDraggedPol=false;
  function _discC(){return {x:R.W*0.62,y:R.H*0.42};}
  function _pDn(e){var p=simPointerXY(canvas,R.dpr,e);var c=_discC();
    if(Math.hypot(p.x-c.x,p.y-c.y)<34){dragPol=true;hasDraggedPol=true;canvas.style.cursor='grabbing';e.preventDefault();}}
  function _pMv(e){var p=simPointerXY(canvas,R.dpr,e);var c=_discC();
    if(dragPol){
      var deg=Math.atan2(p.y-c.y,p.x-c.x)*180/Math.PI;
      deg=((deg%180)+180)%180;
      simSyncSlider('pol-angle',deg,0);e.preventDefault();
    } else canvas.style.cursor=Math.hypot(p.x-c.x,p.y-c.y)<34?'grab':'';}
  function _pUp(){dragPol=false;canvas.style.cursor='';}
  canvas.addEventListener('mousedown',_pDn);canvas.addEventListener('touchstart',_pDn,{passive:false});
  canvas.addEventListener('mousemove',_pMv);canvas.addEventListener('touchmove',_pMv,{passive:false});
  canvas.addEventListener('mouseup',_pUp);canvas.addEventListener('touchend',_pUp);
  function draw(ts){
    if(_simGen[id]!==_g)return;if(_simStop[id])return;
    var dt=last?Math.min((ts-last)/1000,0.05):0.016;last=ts;animT+=dt;
    var theta=getAngle()*Math.PI/180;
    var I0=getI0();                       // unpolarized source intensity
    var I1=I0/2;                          // after 1st polarizer: ⟨cos²⟩=½ over random orientations
    var mal=Math.cos(theta)*Math.cos(theta); // Malus factor cos²θ
    var I=I1*mal;                         // after analyzer: I = (I₀/2)·cos²θ
    ctx.fillStyle='#0f172a';ctx.fillRect(0,0,W,H);
    var beamY=H*0.42;
    var srcX=30,pol1X=W*0.28,pol2X=W*0.62,eyeX=W-30;
    var beamCol='#fbbf24';
    // Source: unpolarized — spinning arrows
    ctx.save();
    var nArrows=8;
    for(var i=0;i<nArrows;i++){
      var ang=i*Math.PI/nArrows+animT*1.5;
      var len=18;
      ctx.strokeStyle='rgba(251,191,36,0.6)';ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.moveTo(srcX+Math.cos(ang+Math.PI)*len*0.4,beamY+Math.sin(ang+Math.PI)*len*0.4);
      ctx.lineTo(srcX+Math.cos(ang)*len,beamY+Math.sin(ang)*len);
      ctx.stroke();
    }
    ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(srcX,beamY,8,0,Math.PI*2);ctx.fill();
    ctx.restore();
    // Beam srcX->pol1X: wide (unpolarized, many arrows)
    ctx.save();ctx.strokeStyle='rgba(251,191,36,0.3)';ctx.lineWidth=10;
    ctx.beginPath();ctx.moveTo(srcX+10,beamY);ctx.lineTo(pol1X-15,beamY);ctx.stroke();
    ctx.restore();
    // Polarizer disc 1 (vertical)
    ctx.save();
    ctx.strokeStyle='#94a3b8';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(pol1X,beamY,22,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle='#22d3ee';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(pol1X,beamY-18);ctx.lineTo(pol1X,beamY+18);ctx.stroke();
    ctx.fillStyle='#94a3b8';ctx.font='9px sans-serif';ctx.textAlign='center';
    ctx.fillText('קוטב',pol1X,beamY+34);
    ctx.fillStyle='#22d3ee';ctx.font='bold 9px Heebo';
    ctx.fillText('I₁ = I₀/2',pol1X,beamY+46);
    ctx.fillText('(חצי בדיוק!)',pol1X,beamY+57);ctx.restore();
    // Beam pol1->pol2: single vertical arrow oscillating
    var amp1=16*Math.sqrt(I1/0.5);
    var phase1=animT*4;
    ctx.save();ctx.strokeStyle='rgba(251,191,36,0.7)';ctx.lineWidth=7;
    ctx.beginPath();ctx.moveTo(pol1X+24,beamY);ctx.lineTo(pol2X-20,beamY);ctx.stroke();
    // vertical oscillation arrows
    for(var xi=0;xi<5;xi++){
      var xp=pol1X+30+xi*(pol2X-pol1X-50)/4;
      var osc=Math.sin(phase1+xi*0.8)*amp1;
      ctx.strokeStyle='rgba(251,191,36,0.9)';ctx.lineWidth=1.5;
      arrow(ctx,xp,beamY-Math.abs(osc),xp,beamY+Math.abs(osc),'rgba(251,191,36,0.9)',1.5,6);
    }
    ctx.restore();
    // Analyzer disc 2 (rotatable)
    ctx.save();
    ctx.strokeStyle='#94a3b8';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(pol2X,beamY,22,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle='#f472b6';ctx.lineWidth=2.5;
    ctx.beginPath();
    ctx.moveTo(pol2X+Math.cos(theta+Math.PI/2)*18,beamY+Math.sin(theta+Math.PI/2)*18);
    ctx.lineTo(pol2X+Math.cos(theta-Math.PI/2)*18,beamY+Math.sin(theta-Math.PI/2)*18);
    ctx.stroke();
    // angle arc
    ctx.strokeStyle='rgba(244,114,182,0.5)';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(pol2X,beamY,14,Math.PI*3/2,Math.PI*3/2+theta);ctx.stroke();
    ctx.fillStyle='#f472b6';ctx.font='8px sans-serif';ctx.textAlign='left';
    ctx.fillText('θ='+getAngle()+'°',pol2X+16,beamY-14);
    ctx.fillStyle='#94a3b8';ctx.font='9px sans-serif';ctx.textAlign='center';
    ctx.fillText('מנתח',pol2X,beamY+34);ctx.restore();
    // Rotate hint until first drag
    if(!hasDraggedPol&&animT<8){
      var hw2=Math.sin(animT*3)*0.2;
      ctx.save();ctx.strokeStyle='#fbbf24';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(pol2X,beamY,30,-0.6+hw2,0.9+hw2);ctx.stroke();
      var aA=0.9+hw2;
      ctx.fillStyle='#fbbf24';
      ctx.beginPath();
      ctx.moveTo(pol2X+Math.cos(aA+0.16)*30,beamY+Math.sin(aA+0.16)*30);
      ctx.lineTo(pol2X+Math.cos(aA-0.14)*37,beamY+Math.sin(aA-0.14)*37);
      ctx.lineTo(pol2X+Math.cos(aA-0.14)*23,beamY+Math.sin(aA-0.14)*23);
      ctx.closePath();ctx.fill();
      ctx.font='9px Heebo';ctx.textAlign='center';
      ctx.fillText('✋ גרור לסיבוב',pol2X,beamY+52);
      ctx.restore();
    }
    // Transmitted beam pol2->eye
    var amp2=16*Math.sqrt(I);
    if(I>0.01){
      ctx.save();ctx.strokeStyle='rgba(251,191,36,'+Math.min(1,mal+0.2).toFixed(2)+')';ctx.lineWidth=Math.max(1,9*I);
      ctx.beginPath();ctx.moveTo(pol2X+24,beamY);ctx.lineTo(eyeX-14,beamY);ctx.stroke();ctx.restore();
    } else {
      ctx.save();ctx.fillStyle='#ef4444';ctx.font='bold 12px sans-serif';ctx.textAlign='center';
      ctx.fillText('כיבוי מלא!',pol2X+(eyeX-pol2X)/2,beamY-20);ctx.restore();
    }
    // Eye
    ctx.save();ctx.font='22px sans-serif';ctx.textAlign='center';
    ctx.globalAlpha=0.3+mal*0.7;
    ctx.fillText('👁',eyeX,beamY+8);ctx.restore();
    // RIGHT: cos²θ graph
    var gx=W*0.72,gy=40,gw=W*0.26,gh=H*0.55;
    ctx.save();ctx.strokeStyle='rgba(100,116,139,0.4)';ctx.lineWidth=1;
    ctx.strokeRect(gx,gy,gw,gh);
    // Axis labels
    ctx.fillStyle='#64748b';ctx.font='8px sans-serif';ctx.textAlign='center';
    ctx.fillText('0°',gx,gy+gh+10);ctx.fillText('90°',gx+gw/2,gy+gh+10);ctx.fillText('180°',gx+gw,gy+gh+10);
    ctx.save();ctx.translate(gx-8,gy+gh/2);ctx.rotate(-Math.PI/2);ctx.textAlign='center';
    ctx.fillText('I₂/I₁',0,0);ctx.restore();
    // cos²θ curve
    ctx.strokeStyle='rgba(34,211,238,0.35)';ctx.lineWidth=1.5;ctx.beginPath();
    for(var di=0;di<=180;di++){
      var a=di*Math.PI/180;var iv=Math.cos(a)*Math.cos(a);
      var px=gx+di/180*gw;var py=gy+gh-iv*gh;
      di===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
    }
    ctx.stroke();
    // Current point
    var curX=gx+(getAngle()/180)*gw;
    var curY=gy+gh-mal*gh;
    ctx.strokeStyle='rgba(251,191,36,0.3)';ctx.lineWidth=1;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(curX,gy+gh);ctx.lineTo(curX,curY);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(curX,curY,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#e2e8f0';ctx.font='bold 10px sans-serif';ctx.textAlign='center';
    ctx.fillText('I₂/I₁='+mal.toFixed(2),curX,gy+gh+22);
    ctx.restore();
    // Info box
    var degStr=getAngle()+'°';
    optInfoBox(ctx,20,H-124,W*0.62-30,[
      'I₀ = '+Math.round(I0*100)+'%  (אור טבעי, לא מקוטב)',
      'I₁ = I₀/2 = '+Math.round(I1*100)+'%  (אחרי הקוטב)',
      'I₂ = I₁·cos²θ = '+Math.round(I*100)+'%  (θ='+degStr+')',
      'סה״כ מהמקור: '+Math.round(I/Math.max(I0,1e-6)*100)+'%']);
    requestAnimationFrame(draw);
  }
  function poll(){if(_simStop[id])return;requestAnimationFrame(draw);}poll();
}

// ─────────────────────────────────────────────────────────────
// DOPPLER sim
// ─────────────────────────────────────────────────────────────
function simOptDoppler(canvas,id){
  var _g=(_simGen[id]=(_simGen[id]||0)+1);
  var R=setupCanvas(canvas,480);var ctx=R.ctx,W=R.W,H=R.H;
  var animT=0,last=null;
  var emissions=[];
  var lastEmit=-1;
  var stars=[];for(var _si=0;_si<44;_si++){stars.push({x:Math.random(),y:Math.random(),r:0.6+Math.random()*1.3,tw:1+Math.random()*3});}
  // ── Direct manipulation: drag the star — your hand speed sets β ──
  var dragStar=false,dragX=null,_lpx=null,_lpt=null,curSrcX=null;
  function _sDn(e){var p=simPointerXY(canvas,R.dpr,e);
    if(curSrcX!==null&&Math.hypot(p.x-curSrcX,p.y-R.H/2)<36){
      dragStar=true;dragX=p.x;_lpx=p.x;_lpt=performance.now();canvas.style.cursor='grabbing';e.preventDefault();}}
  function _sMv(e){var p=simPointerXY(canvas,R.dpr,e);
    if(dragStar){
      dragX=Math.max(R.W*0.12,Math.min(R.W*0.88,p.x));
      var now=performance.now();
      if(_lpt!==null&&now-_lpt>40){
        var vpx=Math.abs(dragX-_lpx)/((now-_lpt)/1000);
        simSyncSlider('dop-v',Math.min(80,vpx/130*100),0);
        _lpx=dragX;_lpt=now;
      }
      e.preventDefault();
    } else canvas.style.cursor=(curSrcX!==null&&Math.hypot(p.x-curSrcX,p.y-R.H/2)<36)?'grab':'';}
  function _sUp(){dragStar=false;dragX=null;canvas.style.cursor='';}
  canvas.addEventListener('mousedown',_sDn);canvas.addEventListener('touchstart',_sDn,{passive:false});
  canvas.addEventListener('mousemove',_sMv);canvas.addEventListener('touchmove',_sMv,{passive:false});
  canvas.addEventListener('mouseup',_sUp);canvas.addEventListener('touchend',_sUp);
  function getV(){var e=document.getElementById('inp-dop-v');return e?parseFloat(e.value)/100:0.2;}
  function getWL(){var e=document.getElementById('inp-dop-wl');return e?parseFloat(e.value):550;}
  function dopplerShift(beta,receding){
    if(receding) return Math.sqrt((1+beta)/(1-beta));
    else return Math.sqrt((1-beta)/(1+beta));
  }
  function draw(ts){
    if(_simGen[id]!==_g)return;if(_simStop[id])return;
    var dt=last?Math.min((ts-last)/1000,0.05):0.016;last=ts;animT+=dt;
    var beta=getV();
    var lambda0=getWL();
    // Source oscillates left-right
    var period=6;
    // Source amplitude chosen so v_max = β·c_wave — the DRAWN wavefront bunching is now
    // quantitatively correct (it used to be constant regardless of the slider)
    var srcAmp=Math.min(W*0.3,beta*130*period/(2*Math.PI));
    var srcX=(dragStar&&dragX!==null)?dragX:W/2+Math.sin(animT*Math.PI*2/period)*srcAmp;
    curSrcX=srcX;
    var srcY=H/2;
    var waveSpeed=130; // px/sec
    // Emit wavefront periodically
    var emitInterval=0.4;
    if(animT-lastEmit>emitInterval){
      emissions.push({x:srcX,y:srcY,t:animT});
      lastEmit=animT;
      if(emissions.length>30)emissions.shift();
    }
    ctx.fillStyle='#0f172a';ctx.fillRect(0,0,W,H);
    // Twinkling starfield backdrop
    ctx.save();ctx.fillStyle='#e2e8f0';
    for(var _si2=0;_si2<stars.length;_si2++){
      var st=stars[_si2];
      ctx.globalAlpha=0.12+0.26*Math.abs(Math.sin(animT*st.tw+st.x*9));
      ctx.beginPath();ctx.arc(st.x*W,st.y*H,st.r,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
    var srcCol=wavelengthToHex(lambda0);
    var srcRGB=wavelengthToRGB(lambda0).match(/\d+/g);
    // Draw wavefronts
    for(var ei=0;ei<emissions.length;ei++){
      var em=emissions[ei];
      var age=animT-em.t;
      var r=age*waveSpeed;
      if(r>W*1.5)continue;
      var alpha=Math.max(0,0.7-age*0.18);
      ctx.save();ctx.strokeStyle='rgba('+srcRGB[0]+','+srcRGB[1]+','+srcRGB[2]+','+alpha.toFixed(2)+')';
      ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(em.x,em.y,r,0,Math.PI*2);ctx.stroke();ctx.restore();
    }
    if(animT<8&&!dragStar)optLabel(ctx,'✋ גרור את הכוכב — מהירות היד קובעת את β!',srcX,srcY-42,'#fbbf24',10);
    // Source star
    ctx.save();
    optGlow(ctx,srcCol,20);
    ctx.fillStyle=srcCol;ctx.beginPath();ctx.arc(srcX,srcY,12,0,Math.PI*2);ctx.fill();
    optNoGlow(ctx);
    // Corona
    for(var ci=0;ci<6;ci++){
      var ca=ci*Math.PI/3+animT;
      ctx.strokeStyle='rgba('+srcRGB[0]+','+srcRGB[1]+','+srcRGB[2]+',.4)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(srcX+Math.cos(ca)*12,srcY+Math.sin(ca)*12);
      ctx.lineTo(srcX+Math.cos(ca)*20,srcY+Math.sin(ca)*20);ctx.stroke();
    }
    ctx.restore();
    // Motion arrow
    var vSign=Math.cos(animT*Math.PI*2/period)>0?1:-1;
    ctx.save();ctx.strokeStyle='#94a3b8';ctx.lineWidth=2;
    arrow(ctx,srcX,srcY-22,srcX+vSign*30,srcY-22,'#94a3b8',2,8);
    ctx.restore();
    // Left observer
    var leftX=18,rightX=W-18;
    ctx.save();ctx.font='20px sans-serif';ctx.textAlign='center';
    ctx.fillText('👤',leftX,srcY+30);ctx.fillText('👤',rightX,srcY+30);ctx.restore();
    // Compute Doppler shifts for left and right
    var srcMovingRight=vSign>0;
    var lambdaLeft,lambdaRight;
    // Left observer: if source moves right -> receding from left -> redshift
    if(srcMovingRight){
      lambdaLeft=lambda0*dopplerShift(beta,true);
      lambdaRight=lambda0*dopplerShift(beta,false);
    } else {
      lambdaLeft=lambda0*dopplerShift(beta,false);
      lambdaRight=lambda0*dopplerShift(beta,true);
    }
    lambdaLeft=Math.max(200,Math.min(1000,lambdaLeft));
    lambdaRight=Math.max(200,Math.min(1000,lambdaRight));
    var colLeft=wavelengthToHex(Math.max(380,Math.min(700,lambdaLeft)));
    var colRight=wavelengthToHex(Math.max(380,Math.min(700,lambdaRight)));
    // Color swatches for observers
    ctx.save();
    ctx.fillStyle=colLeft;ctx.beginPath();ctx.roundRect(leftX-14,srcY-50,28,16,4);ctx.fill();
    ctx.fillStyle='#e2e8f0';ctx.font='8px sans-serif';ctx.textAlign='center';
    ctx.fillText(lambdaLeft.toFixed(0)+'nm',leftX,srcY-58);
    ctx.fillStyle=colRight;ctx.beginPath();ctx.roundRect(rightX-14,srcY-50,28,16,4);ctx.fill();
    ctx.fillStyle='#e2e8f0';ctx.textAlign='center';
    ctx.fillText(lambdaRight.toFixed(0)+'nm',rightX,srcY-58);
    ctx.restore();
    // Labels
    optLabel(ctx,'כחלול / אדמדום',W/2,H-90,'#94a3b8',9);
    var zLeft=((lambdaLeft-lambda0)/lambda0).toFixed(3);
    var zRight=((lambdaRight-lambda0)/lambda0).toFixed(3);
    optInfoBox(ctx,20,H-68,W-40,['β = v/c = '+beta.toFixed(2),'λ₀ = '+lambda0+'nm','שמאל: λ='+lambdaLeft.toFixed(0)+'nm (z='+zLeft+')','ימין: λ='+lambdaRight.toFixed(0)+'nm (z='+zRight+')']);
    requestAnimationFrame(draw);
  }
  function poll(){if(_simStop[id])return;requestAnimationFrame(draw);}poll();
}

// ─────────────────────────────────────────────────────────────
// LASER sim
// ─────────────────────────────────────────────────────────────
function simOptLaser(canvas,id){
  var _g=(_simGen[id]=(_simGen[id]||0)+1);
  var R=setupCanvas(canvas,480);var ctx=R.ctx,W=R.W,H=R.H;
  var animT=0,last=null;
  var photons=[];
  function getPump(){var e=document.getElementById('inp-laser-pump');return e?parseFloat(e.value)/100:0.6;}
  function getType(){var e=document.getElementById('inp-laser-type');return e?parseInt(e.value):633;}
  function draw(ts){
    if(_simGen[id]!==_g)return;if(_simStop[id])return;
    var dt=last?Math.min((ts-last)/1000,0.05):0.016;last=ts;animT+=dt;
    var pump=getPump();
    var wl=getType();
    var lCol=wavelengthToHex(wl);
    var lRGB=wavelengthToRGB(wl).match(/\d+/g);
    var threshold=0.45;
    var aboveThresh=pump>threshold;
    ctx.fillStyle='#0f172a';ctx.fillRect(0,0,W,H);
    var cavL=W*0.12,cavR=W*0.8,cavY=H*0.38,cavH=H*0.22;
    // Active medium
    var medGrad=ctx.createLinearGradient(cavL,0,cavR,0);
    var alpha=Math.min(1,pump*1.5);
    medGrad.addColorStop(0,'rgba('+lRGB[0]+','+lRGB[1]+','+lRGB[2]+','+(alpha*0.15)+')');
    medGrad.addColorStop(0.5,'rgba('+lRGB[0]+','+lRGB[1]+','+lRGB[2]+','+(alpha*0.4)+')');
    medGrad.addColorStop(1,'rgba('+lRGB[0]+','+lRGB[1]+','+lRGB[2]+','+(alpha*0.15)+')');
    ctx.fillStyle=medGrad;
    ctx.beginPath();ctx.roundRect(cavL,cavY,cavR-cavL,cavH,4);ctx.fill();
    ctx.strokeStyle='rgba('+lRGB[0]+','+lRGB[1]+','+lRGB[2]+',.5)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.roundRect(cavL,cavY,cavR-cavL,cavH,4);ctx.stroke();
    // Mirror left (total reflector)
    ctx.save();ctx.fillStyle='#e2e8f0';ctx.fillRect(cavL-5,cavY-6,6,cavH+12);
    ctx.fillStyle='#64748b';ctx.font='8px sans-serif';ctx.textAlign='center';
    ctx.fillText('מראה',cavL-2,cavY-12);ctx.fillText('100%',cavL-2,cavY-4);ctx.restore();
    // Mirror right (partial reflector)
    ctx.save();
    var mrGrad=ctx.createLinearGradient(cavR-3,0,cavR+3,0);
    mrGrad.addColorStop(0,'rgba(226,232,240,0.9)');mrGrad.addColorStop(1,'rgba(226,232,240,0.3)');
    ctx.fillStyle=mrGrad;ctx.fillRect(cavR-1,cavY-6,5,cavH+12);
    ctx.fillStyle='#64748b';ctx.font='8px sans-serif';ctx.textAlign='center';
    ctx.fillText('מראה חלקית',cavR+2,cavY-12);ctx.fillText('~30%',cavR+2,cavY-4);ctx.restore();
    // Pump arrows (top)
    var nPump=Math.round(pump*8);
    for(var pi=0;pi<nPump;pi++){
      var px=cavL+20+pi*(cavR-cavL-40)/(nPump+1);
      ctx.save();ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1;
      arrow(ctx,px,cavY-30,px,cavY,'rgba(255,255,255,0.5)',1,6);ctx.restore();
    }
    ctx.fillStyle='#94a3b8';ctx.font='9px sans-serif';ctx.textAlign='center';
    ctx.fillText('שאיבה (pump)',W*0.46,cavY-35);
    // Energy level atoms in cavity
    var nAtoms=12;
    for(var ai=0;ai<nAtoms;ai++){
      var ax=cavL+20+ai*(cavR-cavL-30)/nAtoms;
      var ay=cavY+cavH/2;
      // Excited fraction = pump
      var excited=Math.sin(animT*3+ai*0.7)>1-2*pump;
      var atomCol=excited?'rgba('+lRGB[0]+','+lRGB[1]+','+lRGB[2]+',.9)':'rgba(148,163,184,.5)';
      ctx.save();ctx.fillStyle=atomCol;ctx.beginPath();ctx.arc(ax,ay,4,0,Math.PI*2);ctx.fill();
      if(excited){
        optGlow(ctx,lCol,6);ctx.fillStyle=lCol;ctx.beginPath();ctx.arc(ax,ay,4,0,Math.PI*2);ctx.fill();optNoGlow(ctx);
      }
      ctx.restore();
    }
    // Bouncing photons inside cavity
    if(aboveThresh){
      // Spawn photons
      if(animT>0.1&&photons.length<8){
        photons.push({x:cavL,y:cavY+cavH/2,vx:200,vy:(Math.random()-0.5)*30,t:animT});
      }
      for(var phi=photons.length-1;phi>=0;phi--){
        var ph=photons[phi];
        ph.x+=ph.vx*dt;ph.y+=ph.vy*dt;
        if(ph.x>=cavR-2){
          if(Math.random()<0.3){photons.splice(phi,1);continue;} // exits through partial mirror
          ph.vx=-Math.abs(ph.vx);
        }
        if(ph.x<=cavL+2)ph.vx=Math.abs(ph.vx);
        if(ph.y<cavY||ph.y>cavY+cavH)ph.vy*=-1;
        ctx.save();optGlow(ctx,lCol,10);
        ctx.strokeStyle=lCol;ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(ph.x-8,ph.y);ctx.lineTo(ph.x+8,ph.y);ctx.stroke();
        // Arrowhead
        ctx.fillStyle=lCol;ctx.beginPath();
        var ax2=ph.vx>0?ph.x+8:ph.x-8;
        ctx.moveTo(ax2,ph.y);ctx.lineTo(ax2-(ph.vx>0?1:-1)*8,ph.y-4);ctx.lineTo(ax2-(ph.vx>0?1:-1)*8,ph.y+4);ctx.closePath();ctx.fill();
        optNoGlow(ctx);ctx.restore();
      }
      // Output beam
      ctx.save();optGlow(ctx,lCol,15);
      ctx.strokeStyle=lCol;ctx.lineWidth=4;
      ctx.beginPath();ctx.moveTo(cavR+4,cavY+cavH/2);ctx.lineTo(W-10,cavY+cavH/2);ctx.stroke();
      optNoGlow(ctx);ctx.restore();
      // Beam label
      ctx.fillStyle=lCol;ctx.font='bold 11px sans-serif';ctx.textAlign='left';
      ctx.fillText('קרן לייזר '+wl+'nm',cavR+8,cavY+cavH/2-10);
    } else {
      // Below threshold: random spontaneous emission
      var nSpon=Math.round(pump*6);
      for(var si=0;si<nSpon;si++){
        var phase2=animT*5+si*2.1;
        var sx=cavL+30+(cavR-cavL-60)*((si+0.5)/nSpon);
        var sAng=phase2;
        var sLen=20;
        ctx.save();ctx.strokeStyle='rgba('+lRGB[0]+','+lRGB[1]+','+lRGB[2]+',.5)';ctx.lineWidth=1;
        arrow(ctx,sx,cavY+cavH/2,sx+Math.cos(sAng)*sLen,cavY+cavH/2+Math.sin(sAng)*sLen,'rgba('+lRGB[0]+','+lRGB[1]+','+lRGB[2]+',.5)',1,5);
        ctx.restore();
      }
      ctx.fillStyle='#ef4444';ctx.font='bold 10px sans-serif';ctx.textAlign='center';
      ctx.fillText('מתחת לסף — פליטה ספונטנית',W/2,cavY+cavH+22);
    }
    // Population inversion meter
    var meterX=W*0.87,meterY=cavY+cavH,meterH=cavH*1.2;
    ctx.fillStyle='rgba(30,41,59,.8)';ctx.beginPath();ctx.roundRect(meterX-14,meterY-meterH,28,meterH,4);ctx.fill();
    ctx.strokeStyle='#475569';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(meterX-14,meterY-meterH,28,meterH,4);ctx.stroke();
    var fillH=pump*meterH;
    var meterCol=aboveThresh?'#22c55e':'#ef4444';
    ctx.fillStyle=meterCol;ctx.beginPath();ctx.roundRect(meterX-12,meterY-fillH+2,24,fillH-4,3);ctx.fill();
    ctx.fillStyle='#e2e8f0';ctx.font='8px sans-serif';ctx.textAlign='center';
    ctx.fillText('היפוך',meterX,meterY+12);
    ctx.fillText(aboveThresh?'✓':'✗',meterX,meterY-meterH-8);
    // Threshold line
    ctx.save();ctx.strokeStyle='#fbbf24';ctx.lineWidth=1;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(meterX-14,meterY-threshold*meterH);ctx.lineTo(meterX+14,meterY-threshold*meterH);ctx.stroke();ctx.setLineDash([]);ctx.restore();
    // Info box
    optInfoBox(ctx,20,H-70,W*0.82-20,['שאיבה: '+Math.round(pump*100)+'%','סוג: '+wl+'nm','מצב: '+(aboveThresh?'★ לייזר פעיל!':'מתחת לסף')]);
    requestAnimationFrame(draw);
  }
  function poll(){if(_simStop[id])return;requestAnimationFrame(draw);}poll();
}


// ─────────────────────────────────────────────────────────────
// COLOR MIXING sim — Additive RGB spotlights
// ─────────────────────────────────────────────────────────────
function simOptColorMix(canvas,id){
  var _g=(_simGen[id]=(_simGen[id]||0)+1);
  var R=setupCanvas(canvas,460);var ctx=R.ctx,W=R.W,H=R.H;
  function gR(){var e=document.getElementById('inp-cm-red');return e?parseFloat(e.value)/100:0.8;}

  function gB(){var e=document.getElementById('inp-cm-blue');return e?parseFloat(e.value)/100:0.8;}
  // ── Direct manipulation: drag each spotlight around ──
  var cOff={r:{x:0,y:0},g:{x:0,y:0},b:{x:0,y:0}},dragC=null,touchedC=false,cPos={};
  function _cDn(e){var p=simPointerXY(canvas,R.dpr,e);
    var hit=null;['r','g','b'].forEach(function(k){if(cPos[k]&&Math.hypot(p.x-cPos[k].x,p.y-cPos[k].y)<cPos[k].r*0.5)hit=k;});

  function _cMv(e){var p=simPointerXY(canvas,R.dpr,e);
    if(dragC&&cPos[dragC]){
      cOff[dragC].x=Math.max(-W*0.32,Math.min(W*0.32,cOff[dragC].x+p.x-cPos[dragC].x));
      cOff[dragC].y=Math.max(-H*0.22,Math.min(H*0.3,cOff[dragC].y+p.y-cPos[dragC].y));
      e.preventDefault();
    } else {
      var hov=false;['r','g','b'].forEach(function(k){if(cPos[k]&&Math.hypot(p.x-cPos[k].x,p.y-cPos[k].y)<cPos[k].r*0.5)hov=true;});
      canvas.style.cursor=hov?'grab':'';
    }}
  function _cUp(){dragC=null;canvas.style.cursor='';}
  canvas.addEventListener('mousedown',_cDn);canvas.addEventListener('touchstart',_cDn,{passive:false});
  canvas.addEventListener('mousemove',_cMv);canvas.addEventListener('touchmove',_cMv,{passive:false});
  canvas.addEventListener('mouseup',_cUp);canvas.addEventListener('touchend',_cUp);
  function draw(ts){
    if(_simGen[id]!==_g)return;if(_simStop[id])return;
    var animT=ts/1000||0;
    var pulse=1+0.07*Math.sin(animT*1.8);// gentle breathing ±7%
    var drift=Math.sin(animT*0.65)*2.5;// slow 2.5px oscillation
    var rv=gR(),gv=gG(),bv=gB();
    ctx.fillStyle='#060c18';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#475569';ctx.font='bold 10px Heebo';ctx.textAlign='center';
    ctx.fillText('ערבוב חיבורי — אור (R+G+B)',W/2,14);
    var cy=H*0.41,rr=Math.min(W,H)*0.22;
    var rX=W*0.35+drift+cOff.r.x,rY=cy+rr*0.4+cOff.r.y;
    var gX=W*0.65-drift+cOff.g.x,gY=cy+rr*0.4+cOff.g.y;
    var bX=W*0.5+cOff.b.x, bY=cy-rr*0.48+cOff.b.y;
    var cr=rr*0.92;
    cPos.r={x:rX,y:rY,r:cr};cPos.g={x:gX,y:gY,r:cr};cPos.b={x:bX,y:bY,r:cr};
    if(!touchedC&&animT<9){
      ctx.save();ctx.fillStyle='#fbbf24';ctx.font='bold 10px Heebo';ctx.textAlign='center';
      ctx.fillText('✋ גרור את העיגולים — צור חפיפות חדשות!',W/2,H*0.8);ctx.restore();
    }
    ctx.save();ctx.globalCompositeOperation='lighter';
    // Red
    var ri=Math.round(rv*255);
    var gRed=ctx.createRadialGradient(rX,rY,0,rX,rY,cr);
    gRed.addColorStop(0,'rgba('+ri+',0,0,'+Math.min(1,rv+0.1).toFixed(2)+')');
    gRed.addColorStop(0.65,'rgba('+ri+',0,0,'+(rv*0.25).toFixed(2)+')');
    gRed.addColorStop(1,'rgba('+ri+',0,0,0)');
    ctx.beginPath();ctx.arc(rX,rY,cr,0,Math.PI*2);ctx.fillStyle=gRed;ctx.fill();
    // Green
    var gi=Math.round(gv*255);
    var gGrn=ctx.createRadialGradient(gX,gY,0,gX,gY,cr);
    gGrn.addColorStop(0,'rgba(0,'+gi+',0,'+Math.min(1,gv+0.1).toFixed(2)+')');
    gGrn.addColorStop(0.65,'rgba(0,'+gi+',0,'+(gv*0.25).toFixed(2)+')');
    gGrn.addColorStop(1,'rgba(0,'+gi+',0,0)');
    ctx.beginPath();ctx.arc(gX,gY,cr,0,Math.PI*2);ctx.fillStyle=gGrn;ctx.fill();
    // Blue
    var bi=Math.round(bv*255);
    var gBlu=ctx.createRadialGradient(bX,bY,0,bX,bY,cr);
    gBlu.addColorStop(0,'rgba(0,0,'+bi+','+Math.min(1,bv+0.1).toFixed(2)+')');
    gBlu.addColorStop(0.65,'rgba(0,0,'+bi+',' +(bv*0.25).toFixed(2)+')');
    gBlu.addColorStop(1,'rgba(0,0,'+bi+',0)');
    ctx.beginPath();ctx.arc(bX,bY,cr,0,Math.PI*2);ctx.fillStyle=gBlu;ctx.fill();
    ctx.restore();
    // Spotlight source dots (above circles)
    ctx.save();
    var sY=H*0.05;
    [[rX,'#ff4444','אדום'],[gX,'#44ff44','ירוק'],[bX,'#4488ff','כחול']].forEach(function(arr){
      var sx=arr[0],col=arr[1],lbl=arr[2];
      ctx.fillStyle=col;ctx.beginPath();ctx.arc(sx,sY,7*pulse,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#334155';ctx.lineWidth=0.5;
      ctx.beginPath();ctx.moveTo(sx,sY+7);ctx.lineTo(sx,H*0.18);ctx.stroke();
      ctx.fillStyle=col;ctx.font='bold 10px Heebo';ctx.textAlign='center';

    });
    ctx.restore();
