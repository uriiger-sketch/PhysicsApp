<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מכניקה ניוטונית — משחק למידה</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Rubik:wght@300;400;500;700;900&display=swap');
:root,[data-theme='dark']{
  --bg:#07101f;--panel:#0f1c2e;--panel2:#162236;--accent:#3b82f6;--accent2:#06b6d4;
  --gold:#f59e0b;--green:#10b981;--red:#ef4444;--purple:#8b5cf6;--text:#dde6f0;
  --muted:#546e8a;--border:#1a2d45;--enrich:#0d2818;--enrich-border:#1a5c35;
  --sim-bg:#04090f;
}
[data-theme='light']{
  --bg:#f0f4f8;--panel:#ffffff;--panel2:#e8edf4;--accent:#2563eb;--accent2:#0891b2;
  --gold:#d97706;--green:#059669;--red:#dc2626;--purple:#7c3aed;--text:#1e293b;
  --muted:#64748b;--border:#cbd5e1;--enrich:#ecfdf5;--enrich-border:#6ee7b7;
  --sim-bg:#0a0f1a;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 40%,rgba(59,130,246,.06) 0%,transparent 55%),radial-gradient(ellipse at 85% 15%,rgba(139,92,246,.05) 0%,transparent 55%);pointer-events:none;z-index:0;}
#app{position:relative;z-index:1;}

/* HEADER */
.header{background:linear-gradient(135deg,#071426,#0f1c2e);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:62px;position:sticky;top:0;z-index:200;box-shadow:0 4px 28px rgba(0,0,0,.5);}
.header-title{font-family:'Rubik',sans-serif;font-weight:900;font-size:1.35rem;background:linear-gradient(135deg,#60a5fa,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.header-xp{display:flex;align-items:center;gap:10px;font-size:.88rem;}
.xp-badge{background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.3);color:var(--gold);padding:4px 14px;border-radius:20px;font-weight:700;}
.done-badge{color:var(--muted);font-size:.78rem;}

/* LAYOUT */
.layout{display:flex;min-height:calc(100vh - 62px);}

/* SIDEBAR */
.sidebar{width:272px;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;position:sticky;top:62px;height:calc(100vh - 62px);flex-shrink:0;transition:transform .3s ease;}
.sidebar-chapter{padding:14px 14px 6px;font-size:.68rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;border-top:1px solid var(--border);margin-top:6px;}
.sidebar-chapter:first-child{margin-top:0;border-top:none;}
/* sec-btn defined below */
.sec-btn:hover{color:var(--text);background:var(--panel2);}
.sec-btn.active{color:var(--accent2);background:rgba(6,182,212,.1);font-weight:700;}
.sec-dot{width:7px;height:7px;border-radius:50%;background:var(--border);border:1.5px solid var(--muted);flex-shrink:0;transition:all .2s;}
.sec-dot.done{background:var(--green);border-color:var(--green);}
.sec-dot.active{background:var(--accent);border-color:var(--accent);}

/* MAIN */
.main{flex:1;padding:28px 32px;max-width:920px;overflow-y:auto;}

/* SECTION HEADER */
.sec-header{margin-bottom:26px;}
.sec-header--sim{margin-bottom:8px;}
.sec-header--sim .sec-title,.sec-header--sim .sec-desc{display:none;}
.sec-badge{display:inline-block;padding:3px 12px;border-radius:20px;font-size:.72rem;font-weight:700;letter-spacing:.5px;margin-bottom:8px;}
.badge-theory{background:rgba(139,92,246,.2);color:#c4b5fd;border:1px solid rgba(139,92,246,.3);}
.badge-sim{background:rgba(6,182,212,.2);color:var(--accent2);border:1px solid rgba(6,182,212,.3);}
.badge-quiz{background:rgba(245,158,11,.2);color:var(--gold);border:1px solid rgba(245,158,11,.3);}
.badge-problem{background:rgba(16,185,129,.2);color:var(--green);border:1px solid rgba(16,185,129,.3);}
.sec-title{font-family:'Rubik',sans-serif;font-weight:800;font-size:1.7rem;line-height:1.2;margin-bottom:6px;}
.sec-desc{color:var(--muted);font-size:.93rem;line-height:1.6;}

/* TABS */
.tabs{display:flex;gap:3px;margin-bottom:24px;background:var(--panel);border-radius:12px;padding:4px;border:1px solid var(--border);}
.tab{flex:1;padding:9px 12px;border:none;background:none;color:var(--muted);cursor:pointer;font-family:'Heebo',sans-serif;font-size:.84rem;font-weight:600;border-radius:8px;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:5px;}
.tab:hover{color:var(--text);background:var(--panel2);}
.tab.active{background:var(--accent);color:#fff;}
.tab.locked{cursor:not-allowed;opacity:.38;}

/* THEORY */
.theory-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:26px;margin-bottom:18px;}
.theory-card h3{font-weight:700;font-size:1.1rem;margin-bottom:12px;color:var(--accent2);}
.theory-card p{font-size:.93rem;line-height:1.85;color:#b8cfe0;margin-bottom:12px;}

/* FORMULA BOX — KaTeX rendered */
.formula-box{
  direction:ltr;text-align:center;
  background:linear-gradient(135deg,rgba(59,130,246,.07),rgba(6,182,212,.05));
  border:1.5px solid rgba(59,130,246,.35);
  border-radius:12px;padding:18px 28px;margin:18px 0;
  position:relative;box-shadow:0 0 24px rgba(59,130,246,.08);
}
.formula-box .katex{font-size:1.5rem;}
.formula-box .katex-display{margin:0 !important;}
.formula-name{direction:rtl;font-size:.75rem;color:var(--muted);margin-top:8px;text-align:center;font-style:italic;}
/* Inline math — always LTR inside RTL text */
.math-ltr{direction:ltr;display:inline-flex;align-items:center;vertical-align:middle;margin:0 3px;font-size:1.05em;}
.enrich-formula{direction:ltr;}
/* Responsive equation sizing */
@media(max-width:600px){
  .formula-box .katex{font-size:1.25rem;}
  .formula-box{padding:14px 16px;}
  .math-ltr{font-size:1em;}
}

/* PARAM TOOLTIP */
.param-wrap{position:relative;display:inline-block;}
.param-val{cursor:help;color:#7dd3fc;font-weight:700;border-bottom:1.5px dashed rgba(125,211,252,.4);transition:color .15s;}
.param-val:hover{color:#bae6fd;}
.param-tip{display:none;position:absolute;bottom:calc(100% + 8px);right:50%;transform:translateX(50%);background:#0f1c2e;border:1px solid rgba(59,130,246,.4);border-radius:8px;padding:9px 13px;font-size:.8rem;color:#dde6f0;white-space:nowrap;z-index:999;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.4);min-width:160px;text-align:right;}
.param-tip::after{content:'';position:absolute;top:100%;right:50%;transform:translateX(50%);border:6px solid transparent;border-top-color:rgba(59,130,246,.4);}
.param-wrap:hover .param-tip{display:block;}
.param-tip strong{color:var(--accent2);display:block;margin-bottom:3px;}

/* DEF BLOCK */
.def-block{background:rgba(59,130,246,.07);border:1px solid rgba(59,130,246,.2);border-radius:10px;padding:14px 18px;margin:14px 0;}
.def-block .def-title{font-weight:700;color:#60a5fa;margin-bottom:6px;font-size:.95rem;}
.def-block p{font-size:.9rem;color:#b8cfe0;line-height:1.75;margin:0;}

/* INFO GRID */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.info-item{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:12px;}
.info-item .il{font-size:.7rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
.info-item .iv{font-size:.9rem;color:var(--text);font-weight:500;}

/* ENRICHMENT SECTION */
.enrich-card{background:var(--enrich);border:1px solid var(--enrich-border);border-radius:14px;padding:22px 26px;margin-top:20px;position:relative;overflow:hidden;}
.enrich-card::before{content:'✨ העשרה';position:absolute;top:14px;left:18px;font-size:.7rem;font-weight:800;color:#34d399;letter-spacing:.8px;text-transform:uppercase;background:rgba(16,185,129,.15);padding:3px 10px;border-radius:12px;border:1px solid rgba(16,185,129,.25);}
.enrich-card .enrich-title{font-weight:700;font-size:1rem;color:#34d399;margin-bottom:10px;margin-top:28px;}
.enrich-card p{font-size:.9rem;color:#9ecfb5;line-height:1.8;margin-bottom:10px;}
.enrich-formula{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.25);border-radius:8px;padding:12px 20px;text-align:center;margin:12px 0;}
.enrich-formula .katex{font-size:1.2rem;}

/* THEORY MINI-ANIM with controls */
.theory-anim{background:var(--bg);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin:18px 0;}
.theory-anim canvas{display:block;width:100%;}
.theory-anim-label{padding:6px 16px;font-size:.78rem;color:var(--muted);text-align:center;border-top:1px solid var(--border);}
.anim-ctrl{display:flex;align-items:center;gap:8px;padding:7px 14px;background:rgba(255,255,255,.02);border-top:1px solid var(--border);}
.anim-ctrl button{padding:3px 13px;border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:6px;cursor:pointer;font-family:'Heebo',sans-serif;font-size:.77rem;transition:all .15s;line-height:1.5;}
.anim-ctrl button:hover{background:var(--accent);border-color:var(--accent);color:#fff;}
.anim-ctrl .ac-lbl{font-size:.74rem;color:var(--muted);margin-right:auto;}

/* SIM */
.sim-container{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.sim-canvas-wrap{position:relative;background:#04090f;}
.sim-canvas-wrap canvas{display:block;width:100%;}
.sim-controls{padding:16px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.sim-stat{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:9px 14px;min-width:100px;}
.sim-stat .slab{font-size:.7rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
.sim-stat .sval{font-size:1.05rem;font-weight:700;color:var(--accent2);font-family:'Courier New',monospace;}
.range-wrap{display:flex;align-items:center;gap:8px;font-size:.85rem;}
.range-wrap label{color:var(--muted);font-size:.8rem;white-space:nowrap;}
.range-wrap span{color:var(--accent2);font-family:'Courier New',monospace;font-size:.85rem;min-width:38px;}
input[type=range]{accent-color:var(--accent);cursor:pointer;}

/* BUTTONS */
.btn{padding:8px 18px;border:none;border-radius:8px;cursor:pointer;font-family:'Heebo',sans-serif;font-weight:700;font-size:.85rem;transition:all .18s;}
.btn-primary{background:var(--accent);color:#fff;} .btn-primary:hover{background:#2563eb;transform:translateY(-1px);}
.btn-secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border);} .btn-secondary:hover{background:var(--border);}
.btn-green{background:var(--green);color:#fff;} .btn-green:hover{background:#059669;}
.btn-gold{background:var(--gold);color:#000;} .btn-gold:hover{background:#d97706;}

/* QUIZ */
.quiz-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:26px;margin-bottom:14px;}
.quiz-progress{display:flex;gap:5px;margin-bottom:20px;}
.qp-dot{flex:1;height:5px;border-radius:3px;background:var(--border);transition:all .25s;}
.qp-dot.done{background:var(--green);}
.qp-dot.active{background:var(--accent);}
.qp-dot.wrong{background:var(--red);}
.quiz-q{font-size:1rem;font-weight:600;line-height:1.65;margin-bottom:18px;color:var(--text);}
.quiz-q-num{display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;border-radius:50%;width:26px;height:26px;font-size:.8rem;font-weight:800;margin-left:8px;flex-shrink:0;}
.quiz-opts{display:flex;flex-direction:column;gap:9px;}
.quiz-opt{width:100%;text-align:right;padding:13px 16px;background:var(--bg);border:2px solid var(--border);border-radius:9px;cursor:pointer;font-family:'Heebo',sans-serif;font-size:.9rem;color:var(--text);transition:all .18s;display:flex;align-items:center;gap:10px;}
.quiz-opt:hover:not(:disabled){border-color:var(--accent);background:rgba(59,130,246,.05);}
.quiz-opt.correct{border-color:var(--green);background:rgba(16,185,129,.1);color:#a7f3d0;}
.quiz-opt.wrong{border-color:var(--red);background:rgba(239,68,68,.1);color:#fca5a5;}
.quiz-opt-letter{width:26px;height:26px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;flex-shrink:0;opacity:.7;}
.quiz-feedback{margin-top:12px;padding:13px 16px;border-radius:9px;font-size:.88rem;line-height:1.65;}
.fb-ok{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:#a7f3d0;}
.fb-err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5;}

/* PROBLEM */
.problem-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:26px;margin-bottom:14px;}
.problem-text{font-size:.97rem;line-height:1.85;color:var(--text);margin-bottom:22px;border-right:3px solid var(--gold);padding-right:15px;}
.problem-steps{display:flex;flex-direction:column;gap:12px;}
.step-card{background:var(--bg);border:1px solid var(--border);border-radius:11px;padding:16px;}
.step-card.locked-step{opacity:.38;pointer-events:none;}
.step-card.solved{border-color:var(--green);}
.step-hdr{display:flex;align-items:flex-start;gap:10px;margin-bottom:11px;}
.step-num{width:26px;height:26px;border-radius:50%;background:var(--panel2);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;color:var(--accent);flex-shrink:0;}
.step-num.done{background:var(--green);border-color:var(--green);color:#fff;}
.step-q{font-size:.9rem;font-weight:600;color:var(--text);line-height:1.55;}
.step-inp-row{display:flex;gap:8px;align-items:center;margin-top:9px;}
.step-inp{flex:1;padding:9px 13px;background:var(--panel);border:1.5px solid var(--border);border-radius:7px;color:var(--text);font-family:'Heebo',sans-serif;font-size:.93rem;outline:none;text-align:right;transition:border-color .18s;}
.step-inp:focus{border-color:var(--accent);}
.step-inp.ok{border-color:var(--green);background:rgba(16,185,129,.04);}
.step-inp.err{border-color:var(--red);background:rgba(239,68,68,.04);}
.unit-lbl{color:var(--muted);font-size:.88rem;white-space:nowrap;}
.hint-btn{padding:7px 13px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);border-radius:7px;color:var(--gold);cursor:pointer;font-family:'Heebo',sans-serif;font-size:.78rem;font-weight:700;transition:all .18s;white-space:nowrap;}
.hint-btn:hover{background:rgba(245,158,11,.2);}
.hint-box{margin-top:9px;padding:11px 14px;background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.22);border-radius:8px;font-size:.86rem;color:#fde68a;line-height:1.6;}
.step-fb{margin-top:9px;padding:9px 13px;border-radius:7px;font-size:.86rem;line-height:1.5;}
.step-fb.ok{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.25);color:#a7f3d0;}
.step-fb.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#fca5a5;}

/* COMPLETED BANNER */
.done-banner{background:linear-gradient(135deg,rgba(16,185,129,.18),rgba(6,182,212,.15));border:1px solid rgba(16,185,129,.35);border-radius:14px;padding:30px;text-align:center;margin:16px 0;}
.done-banner .big-icon{font-size:3.2rem;margin-bottom:10px;}
.done-banner h2{font-size:1.4rem;font-weight:800;color:var(--green);margin-bottom:7px;}
.done-banner p{color:var(--muted);font-size:.92rem;}

/* LOCKED SECTION */
.locked-sec{background:var(--panel);border:1px dashed var(--border);border-radius:14px;padding:44px 28px;text-align:center;color:var(--muted);}
.locked-sec .lock-icon{font-size:2.3rem;margin-bottom:10px;}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--muted);}

@keyframes troppy{0%{transform:scale(0) rotate(-20deg);opacity:0}60%{transform:scale(1.15) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.trophy-anim{animation:troppy .55s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease;}


.anim-note{font-size:.85rem;color:var(--muted);line-height:1.5;margin:.4rem 0 .2rem;padding:.3rem .5rem;border-right:2px solid var(--blue);background:rgba(14,52,90,.18);border-radius:3px;}
.anim-note b{color:var(--text);}

/* ══ LOGIN SCREEN ══════════════════════════════════ */
#login-screen{
  position:fixed;inset:0;z-index:9999;
  background:linear-gradient(135deg,#020b18 0%,#051525 50%,#020b18 100%);
  display:flex;align-items:center;justify-content:center;
  font-family:inherit;direction:rtl;
}
.login-card{
  background:rgba(6,18,40,.95);border:1px solid rgba(30,64,95,.7);
  border-radius:18px;padding:40px 44px;min-width:360px;max-width:420px;
  box-shadow:0 24px 80px rgba(0,0,0,.6),0 0 0 1px rgba(14,52,90,.4);
  text-align:center;
}
.login-logo{font-size:2.8rem;margin-bottom:4px;}
.login-title{
  font-size:1.45rem;font-weight:800;color:#e2e8f0;margin-bottom:4px;
  letter-spacing:-.5px;
}
.login-sub{font-size:.85rem;color:#64748b;margin-bottom:28px;}
.login-field{margin-bottom:16px;text-align:right;}
.login-field label{display:block;font-size:.8rem;color:#94a3b8;margin-bottom:5px;font-weight:600;}
.login-field input{
  width:100%;box-sizing:border-box;
  background:#0a1c30;border:1.5px solid #1e3a52;border-radius:8px;
  color:#e2e8f0;font-size:.95rem;padding:10px 14px;
  outline:none;transition:border .2s;direction:ltr;
}
.login-field input:focus{border-color:#3b82f6;}
.login-toggle{
  display:flex;align-items:center;gap:10px;
  margin-bottom:22px;cursor:pointer;user-select:none;
  justify-content:flex-end;
}
.login-toggle-track{
  width:40px;height:22px;border-radius:11px;
  background:#1e3a52;border:1.5px solid #2d5275;
  position:relative;transition:background .2s;flex-shrink:0;
}
.login-toggle-track.on{background:#3b82f6;border-color:#60a5fa;}
.login-toggle-thumb{
  position:absolute;top:2px;right:2px;width:16px;height:16px;
  border-radius:50%;background:#64748b;transition:all .2s;
}
.login-toggle-track.on .login-toggle-thumb{right:auto;left:2px;background:#fff;}
.login-toggle-label{font-size:.85rem;color:#94a3b8;}
.login-btn{
  width:100%;padding:12px;border:none;border-radius:10px;
  background:linear-gradient(135deg,#3b82f6,#2563eb);
  color:#fff;font-size:1rem;font-weight:700;cursor:pointer;
  transition:opacity .15s,transform .1s;margin-top:4px;
}
.login-btn:hover{opacity:.9;}
.login-btn:active{transform:scale(.98);}
.login-error{
  color:#f87171;font-size:.82rem;margin-top:10px;min-height:18px;
  background:rgba(239,68,68,.08);border-radius:6px;
  padding:6px 10px;display:none;
}
.login-error.show{display:block;}
.login-success{
  color:#34d399;font-size:.85rem;margin-top:10px;display:none;
}
.login-success.show{display:block;}

/* ── Game Experience Improvements ─────────────────────── */

/* Sim canvas: full width, rounded, proper sizing */
.sim-canvas-wrap {
  width: 100%;
  border-radius: 12px;
  overflow: hidden;
  background: #04090f;
  display: block;
}
.sim-canvas-wrap canvas {
  display: block;
  width: 100% !important;
  max-width: 100%;
}

/* Section badge always visible */
.sec-badge {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 20px;
  font-size: .78rem;
  font-weight: 700;
  margin-bottom: 6px;
  letter-spacing: .03em;
}
.badge-theory { background: rgba(99,102,241,.18); color: #818cf8; border: 1px solid rgba(99,102,241,.3); }
.badge-sim    { background: rgba(34,211,153,.15); color: #34d399; border: 1px solid rgba(34,211,153,.3); }
.badge-quiz   { background: rgba(251,191,36,.15); color: #fbbf24; border: 1px solid rgba(251,191,36,.3); }

<div id="app"></div>

<script>
// ── roundRect polyfill (for older browsers/renderers) ──────────────
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(r===undefined)r=0;
    var rr=Math.min(r,w/2,h/2);
    this.moveTo(x+rr,y);
    this.lineTo(x+w-rr,y);
    this.quadraticCurveTo(x+w,y,x+w,y+rr);
    this.lineTo(x+w,y+h-rr);
    this.quadraticCurveTo(x+w,y+h,x+w-rr,y+h);
    this.lineTo(x+rr,y+h);
    this.quadraticCurveTo(x,y+h,x,y+h-rr);
    this.lineTo(x,y+rr);
    this.quadraticCurveTo(x,y,x+rr,y);
    this.closePath();
  };
}

// ═══════════════════════════════════════════════
// KaTeX / Math helpers
// ═══════════════════════════════════════════════
function tex(str, display){
  if(display===undefined)display=false;
  try{ return katex.renderToString(str,{throwOnError:false,displayMode:display,output:'html'}); }
  catch(e){ return str; }
}
// M() — inline math, always LTR, embeds correctly in RTL paragraphs
function M(str){ return `<span class="math-ltr">${tex(str,false)}</span>`; }

function P(symbol, name, desc){
  return `<span class="param-wrap"><span class="param-val math-ltr">${tex(symbol)}</span><span class="param-tip"><strong>${name}</strong>${desc}</span></span>`;
}

function fBox(latexStr, name, params){
  if(name===undefined)name=''; if(params===undefined)params=[];
  let html = `<div class="formula-box">${tex(latexStr, true)}`;
  if(name) html += `<div class="formula-name">${name}</div>`;
  html += `</div>`;
  if(params.length){
    html += `<div style="direction:rtl;display:flex;flex-wrap:wrap;gap:8px;margin:-8px 0 16px;justify-content:center">`;
    params.forEach(([sym,nm,desc])=>{
      html += `<div class="param-wrap" style="background:rgba(59,130,246,.07);border:1px solid rgba(59,130,246,.15);border-radius:7px;padding:5px 12px;font-size:.8rem;display:flex;align-items:center;gap:5px;cursor:help">
        <span class="math-ltr">${tex(sym)}</span> <span style="color:var(--muted)">— ${nm}</span>
        <span class="param-tip"><strong>${nm}</strong>${desc}</span>
      </div>`;
    });
    html += `</div>`;
  }
  return html;
}

// ─────────────────────────────────────────────
// Animation widget — canvas + Start/Stop/Reset
// ─────────────────────────────────────────────
const _anim = {};   // id → {t, paused, fn, raf}

function animCanvas(id, h, label){
  if(h===undefined)h=140; if(label===undefined)label='';
  return `<div class="theory-anim">
    <canvas id="${id}" height="${h}" style="height:${h}px"></canvas>
    <div class="anim-ctrl">
      <button id="abtn_${id}" onclick="animToggle('${id}')">⏸ עצור</button>
      <button onclick="animReset('${id}')">↺ אתחל</button>
      ${label ? `<span class="ac-lbl">${label}</span>` : ''}
    </div>
  </div>`;
}

function runAnim(id, fn){
  if(_anim[id]) cancelAnimationFrame(_anim[id].raf);
  const s = {t:0, paused:false, fn, raf:null, prev:null};
  _anim[id] = s;
  const cv = document.getElementById(id);
  if(!cv) return;
  // Set up DPR-correct canvas dimensions
  const dpr = window.devicePixelRatio || 1;
  const cssW = cv.offsetWidth || 680;
  const cssH = cv.offsetHeight || parseInt(cv.getAttribute('height')) || 140;
  cv.width  = Math.round(cssW * dpr);
  cv.height = Math.round(cssH * dpr);
  cv.style.width  = cssW + 'px';
  cv.style.height = cssH + 'px';
  const animCtx = cv.getContext('2d');
  animCtx.scale(dpr, dpr);
  function tick(ts){
    if(_anim[id] !== s) return;
    if(!s.paused){
      if(s.prev !== null){ const dt = Math.min((ts - s.prev)/1000, .05); s.t += dt; }
      s.prev = ts;
      // Pass CSS pixel dimensions (W, H) so draw fns use CSS coords, not raw pixels
      fn(cv, animCtx, cssW, cssH, s.t);
    }
    s.raf = requestAnimationFrame(tick);
  }
  s.raf = requestAnimationFrame(tick);
}

window.animToggle = function(id){
  const s = _anim[id]; if(!s) return;
  s.paused = !s.paused;
  s.prev = null;
  const btn = document.getElementById('abtn_' + id);
  if(btn) btn.textContent = s.paused ? '▶ הפעל' : '⏸ עצור';
};
window.animReset = function(id){
  const s = _anim[id]; if(!s) return;
  s.t = 0; s.prev = null; s.paused = false;
  const btn = document.getElementById('abtn_' + id);
  if(btn) btn.textContent = '⏸ עצור';
};

function stopAllAnims(){ Object.values(_anim).forEach(s=>s.paused=true); }


// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
// ── Persistence ─────────────────────────────────────────────────
const SAVE_KEY='phys_game_state_v2';
function saveState(){
  try{
    localStorage.setItem(SAVE_KEY,JSON.stringify({
      subject:state.subject,
      chapter:state.chapter, section:state.section,
      xp:state.xp, completed:state.completed,
      quizState:state.quizState, problemState:state.problemState,
      theme:state.theme,
      difficulty:state.difficulty
    }));
  }catch(e){}
}
function loadState(){
  try{
    var raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return;
    var saved=JSON.parse(raw);
    if(saved.subject)state.subject=saved.subject;
    if(saved.chapter)state.chapter=saved.chapter;
    if(saved.section)state.section=saved.section;
    if(saved.xp)state.xp=saved.xp||0;
    if(saved.completed)state.completed=saved.completed||{};
    if(saved.quizState)state.quizState=saved.quizState||{};
    if(saved.problemState)state.problemState=saved.problemState||{};
    if(saved.theme)state.theme=saved.theme||'dark';
    if(saved.difficulty)state.difficulty=saved.difficulty||'normal';
    applyTheme(state.theme);
  }catch(e){}
}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  state.theme=t;
  saveState();
}

const state={
  subject:'mechanics',
  chapter:'kinematics', section:'distance-time', tab:'theory',
  xp:0, completed:{}, quizState:{}, problemState:{}, simState:{},
  theme:'dark', difficulty:'normal'  // 'easy'|'normal'|'hard'
};
function isCompleted(c,s,t){return !!state.completed[`${c}.${s}.${t}`];}
function markCompleted(c,s,t,xp){
  if(xp===undefined)xp=50;
  const k=`${c}.${s}.${t}`;
  var wasNew=!state.completed[k];
  if(!state.completed[k]){
    state.completed[k]=true;state.xp+=xp;saveState();playXPSound();
    // Celebration flash for quiz completion
    if(t==='quiz') setTimeout(function(){celebrateSection();},200);
  }
  render();
  if(wasNew&&xp>0){
    // Animate XP badge
    setTimeout(function(){
      var el=document.getElementById('xp-badge-el');
      if(el){el.classList.remove('xp-pop');void el.offsetWidth;el.classList.add('xp-pop');}
    },60);
  }
}

    }
  },

'kinematics.avg-instant-vel':{
  theory:{
    title:'מהירות ממוצעת ורגעית',
    html:`
      <div class="def-block"><div class="def-title">מהירות ממוצעת ${P('\\bar{v}','מהירות ממוצעת','ממוצע ה"תנועה" על פרק זמן שלם')}</div>

      </div>
      ${fBox('\\bar{v} = \\dfrac{\\Delta x}{\\Delta t} = \\dfrac{x_2 - x_1}{t_2 - t_1}','מהירות ממוצעת',[

        <p>הגבול כאשר ${tex('\\Delta t \\to 0')}:</p>
      </div>
      ${fBox('v(t) = \\lim_{\\Delta t \\to 0} \\dfrac{\\Delta x}{\\Delta t} = \\dfrac{dx}{dt}','מהירות רגעית — נגזרת',[

      </div>

      <div class="enrich-formula">${tex('v = \\dot{x} = \\dfrac{dx}{dt}', true)}</div>`
    }
  },
  sim:{type:'avg-instant',title:'ממוצע מול רגעית',desc:'עקוב אחרי מיתר מתכווץ לעבר המשיק — כך נוצרת המהירות הרגעית.'},

  quiz:[

    {q:'גוף נוסע 100 ק"מ בשעה, עוצר שעה, נוסע 60 ק"מ בשעה שלישית. מהירות ממוצעת ל-3 שעות?',
     opts:[tex('53.3\\,\\text{km/h}'),tex('80\\,\\text{km/h}'),tex('0'),tex('160\\,\\text{km/h}')],correct:0,

  problem:{

    text:'גוף נע לפי '+tex('x = t^2')+'(מ׳, ש). חשב מהירויות ממוצעות המתכנסות לרגעית ב-t=1.',
    steps:[

      {q:'מהירות רגעית ב-t=1 (השתמש ב-'+tex('v=dx/dt=2t')+'):',hint:tex('v(1) = 2 \\cdot 1'),answer:'2',unit:'מ/ש',tolerance:0,
       explain:tex('v(1) = 2\\,\\text{m/s}')+'הממוצעות (3, 2.5...) מתקרבות ל-2!'},
    ]
  }
},

'kinematics.acceleration':{
  theory:{
    title:'תנועה שוות-תאוצה',
    html:`
      <div class="def-block"><div class="def-title">תאוצה ${P('a','תאוצה','שיעור שינוי המהירות בזמן — m/s²')}</div>
        <p>קצב שינוי המהירות: ${P('a','תאוצה','m/s²')} ${tex('= \\Delta v / \\Delta t')}. יכולה להיות חיובית (האצה) או שלילית (האטה).</p>
      </div>
      ${fBox('a = \\dfrac{\\Delta v}{\\Delta t} = \\dfrac{v - v_0}{t - t_0}','הגדרת תאוצה ממוצעת',[
        ['a','תאוצה','m/s² — שינוי מהירות בשנייה'],
        ['v','מהירות סופית','בסוף פרק הזמן'],
        ['v_0','מהירות ראשונית','בתחילת פרק הזמן'],
      ])}
      <p>⚠️ <b>מוטעית נפוצה:</b> תאוצה שלילית לא תמיד = האטה! אם v שלילי ו-a שלילי → הגוף <em>מאיץ</em> לכיוון השלילי.</p>
      ${animCanvas('anim-accel',174)}
      <p><b>נוסחאות תנועה שוות-תאוצה (הנוסחאות הקינמטיות):</b></p>
      ${fBox('v = v_0 + a t','מהירות כפונקציה של זמן',[['v_0','מהירות ראשונית',''],['a','תאוצה','קבועה'],['t','זמן','מרגע ההתחלה']])}
      ${fBox('x = x_0 + v_0 t + \\tfrac{1}{2}at^2','מיקום כפונקציה של זמן',[['x_0','מיקום ראשוני',''],['v_0','מהירות ראשונית',''],['a','תאוצה','קבועה']])}
      ${fBox('v^2 = v_0^2 + 2a\\,\\Delta x','קשר מהירות-מרחק (ללא t)',[['v^2','ריבוע המהירות הסופית',''],['v_0^2','ריבוע המהירות הראשונית',''],['a','תאוצה',''],['\\Delta x','העתק','']])}
      <p><b>בגרף v(t):</b> קו ישר, שיפועו = תאוצה. <b>השטח מתחת לגרף</b> = העתק.</p>
    `,
    enrich:{
      title:'האצה ואינרטיה — מה מגביל מכוניות ספורט?',
      html:`<p>מכונית ספורט מודרנית יכולה להאיץ 0-100 קמ"ש ב-3 שניות. מהי התאוצה הממוצעת?</p>
      <div class="enrich-formula">${tex('a = \\frac{\\Delta v}{\\Delta t} = \\frac{27.8}{3} \\approx 9.3\\,\\text{m/s}^2 \\approx 0.95g', true)}</div>
      <p>כלומר כמעט 1g! הגבול הפיזיקלי הוא חיכוך הצמיגים עם הכביש — גבוה יותר מזה, הגלגלים מסתובבים במקום. מכוניות F1 מגיעות ל-5g בבלימה!</p>`
    }
  },
  sim:{type:'acceleration',title:'תאוצה אינטראקטיבית',desc:'גרור בשדה העליון לשנות תאוצה. גרף v(t) מצטייר. לחץ פעמיים לאיפוס.'},
  example:{title:'תאוצה קבועה',text:'גוף מתחיל ממנוחה ומגיע ל-20 מ/ש תוך 4 שניות.',steps:[{q:'מה התאוצה?',a:'a = Δv/Δt = (20−0)/4 = 5 מ/ש²'},{q:'מה המרחק?',a:'x = ½at² = ½×5×16 = 40 מ\''}]},

'kinematics.freefall':{
  theory:{
    title:'נפילה חופשית',
    html:`
      <div class="def-block"><div class="def-title">נפילה חופשית</div>
        <p>תנועה תחת כוח הכבידה <b>בלבד</b> (ללא חיכוך אוויר). כל הגופים — קל וכבד — נופלים באותה תאוצה!</p>

'newton2.n2-atwood':{
  theory:{
    title:'מכונת אטווד — שתי מסות על גלגלת',
    html:`
      <p>מכונת אטווד משמשת <b>למדידת g</b> בדיוק גבוה: שתי מסות כמעט שוות "מאטות" את הכבידה כך שניתן למדוד תאוצה קטנה בדיוק.</p>
      <div class="def-block"><div class="def-title">הגדרת המערכת</div>
        <p>m₁ ו-m₂ תלויות על גלגלת חסרת-חיכוך. חוט דיל מסה. אם m₂ > m₁ — m₂ יורד, m₁ עולה.</p>
      </div>
      ${fBox('a = \\dfrac{(m_2-m_1)\\,g}{m_1+m_2}','תאוצת מכונת אטווד',[
        ['m_1,m_2','שתי המסות','ק"ג'],['g','תאוצת כבידה','9.8 מ/ש²'],
        ['a','תאוצה','מ/ש² — זהה לשתי המסות בגודל'],
      ])}
      ${fBox('T = \\dfrac{2m_1 m_2\\,g}{m_1+m_2}','מתיחות החוט',[
        ['T','מתיחות','N — זהה בשני צידי החוט'],
      ])}
      <p class="anim-note">כשm₁=m₂: a=0, T=m₁g=m₂g — שיווי משקל. כשm₂≫m₁: a→g, T→0 — נפילה חופשית כמעט.</p>
      ${animCanvas('anim-n2apps2',214,'מכונת אטווד — מסות נעות')}
    `,
    enrich:{
      title:'מכונת אטווד ומדידת g',
      html:`<p>ג׳ורג׳ אטווד (1784) המציא מכונה למדידת g מדויקת: m₁≈m₂ "מאטים" את הכבידה. ${M('g=a(m_1+m_2)/(m_1-m_2)')}. כיום משתמשים בנפילה חופשית + צילום מהיר.</p>`
    }
  },
  sim:{type:'atwood',title:'מכונת אטווד',desc:'שנה m₁ ו-m₂ — ראה תאוצה, מתיחות T, וכיוון תנועה בזמן אמת.'},

  theory:{

          <li><b>מחזור T</b> — זמן לתנודה מלאה [שניות]</li>
          <li><b>תדירות f</b> — מספר תנודות בשנייה [Hz = 1/s]</li>
          <li><b>תדירות זוויתית ω</b> — [rad/s]</li>
        </ul>
      </div>
      ${fBox('T = \\dfrac{1}{f}\;,\\quad f = \\dfrac{1}{T}','קשר מחזור-תדירות',[
        ['T','מחזור','שניות'],
        ['f','תדירות','הרץ (Hz)'],
      ])}
      ${fBox('\\omega = 2\\pi f = \\dfrac{2\\pi}{T}','תדירות זוויתית',[

'opt-light.light-nature':{
  theory:{
    title:'האור — קרניים, צל ושאלת המהות',
    html:`
      <p>כבר מעל לאלפיים שנים אנשים שמו לב לתכונה אחת של אור: הוא נע ב<b>קו ישר</b>. צל של עץ חד בשמש, קרן לייזר ישרה בערפל, פתח קטן שמאיר נקודה מדויקת — כולם מעידים על אותה עובדה. מכאן נולד <b>מודל הקרן</b>: האור מיוצג כקו ישר בכיוון ההתפשטות.</p>
      <div class="def-block"><div class="def-title">מודל הקרן — אופטיקה גיאומטרית</div>
        <p>ב<b>אופטיקה גיאומטרית</b> מתארים את האור כקרניות — קווים ישרים הנושאים אנרגיה. המודל מדויק כל עוד שהאור אינו עובר דרך פתחים קטנים יחסית לאורך הגל שלו. רוב תופעות האור היומיומיות — מראות, עדשות, קמרה — מוסברות בו.</p>
      </div>
      <div class="enrich-card"><div class="enrich-title">היסטוריה: מי הוא אבי האופטיקה?</div>
        <p>המדענים היוונים (אוקלידס, ~300 לפנה"ס) היו ראשונים לנסח גיאומטריה של אור — אך טעו בנקודה אחת מהותית: הם חשבו שהעין <em>פולטת</em> קרניות לעולם ("תיאוריית הפליטה"). <br><br>
        <b>אבן אל-הית'ם (אלחאזן), 965–1040 לספירה</b> — מדען ערבי מבגדד שכתב את "ספר האופטיקה" (Kitab al-Manazir, ~1011) — הוא הראשון שהוכיח בניסויים שהאור <em>נכנס</em> לעין מהסביבה, לא יוצא ממנה. המציא את מצלמת הפינהול (Camera obscura) ותיאר נכון כיצד היא יוצרת תמונה הפוכה. ספרו תורגם ללטינית ב-1270 והיה בסיס לאופטיקה האירופאית.</p>
      </div>
      <p><b>מצלמת פינהול (Camera obscura):</b> חדר חשוך עם פתח קטן בקיר — האור מהחוץ יוצר תמונה <em>הפוכה ומוקטנת</em> של הנוף על הקיר הנגדי. עקרון זה הוביל להמצאת המצלמה הצילומית (1839).</p>
      <div class="def-block"><div class="def-title">ספקטרום האור הנראה — תצפית</div>
        <p>האור "הלבן" של השמש אינו טהור — הוא כולל את כל צבעי הקשת. ניוטון הראה זאת ב-1666 עם פריזמה (ראה פרק ג’). הצבעים שהעין מזהה מתאימים לאורכי גל שונים, מ-380nm (סגול) עד 700nm (אדום).</p>
      </div>
      <div class="info-grid">
        <div class="info-item"><div class="il">אדום</div><div class="iv">620–700 nm</div></div>
        <div class="info-item"><div class="il">כתום</div><div class="iv">590–620 nm</div></div>
        <div class="info-item"><div class="il">צהוב</div><div class="iv">570–590 nm</div></div>
        <div class="info-item"><div class="il">ירוק</div><div class="iv">495–570 nm</div></div>
        <div class="info-item"><div class="il">כחול</div><div class="iv">450–495 nm</div></div>
        <div class="info-item"><div class="il">סגול</div><div class="iv">380–450 nm</div></div>
      </div>
      <p><b>שאלה עמוקה:</b> מה בדיוק הוא האור? חלקיק? גל? שנייהם? שאלה זו העסיקה את הגדולים שבפיזיקאים — ניוטון, הויגנס, יאנג, מקסוול, אינשטיין — ותתגלה לנו בהדרגה לאורך הפרק כולו.</p>
      <div class="theory-anim">${animCanvas('anim-em-spectrum',148,'ספקטרום האור הנראה — קשת הצבעים')}</div>`,

'opt-light.light-speed':{
  theory:{
    title:'מהירות האור — מדידה שלקחה אלפי שנים',
    html:`
      <p>האם אור נע מיידית, או שמא יש לו מהירות סופית? גלילאו ניסה למדוד את מהירות האור עם פנסים על גבעות (1638) — ונכשל: האור היה מהיר מדי לשיטה ידנית.</p>
      <div class="def-block"><div class="def-title">תולדות מדידת c</div>
        <ul style="padding-right:20px;color:#b8cfe0;font-size:.9rem;line-height:2">
          <li><b>אולה רומר (1676)</b> — אסטרונום דני שמדד את מסלול ירח הצדק (איו). שם לב שמחזור ההסתרה קצר כשהארץ מתקרבת לצדק וארוך כשמתרחקת — כי האור עובר מרחק שונה. חישב c≈220,000 ק"מ/ש (26% שגוי בגלל מרחק לצדק לא מדויק) — אך הוכיח ש-c סופי!</li>
          <li><b>ארמן פיזו (1849)</b> — ניסוי מעבדה ראשון: גלגל שיניים מסתובב חוסם קרן אור. כויל מהירות הגלגל עד שהאור חזר בדיוק בפתח הבא. c≈313,000 ק"מ/ש (שגיאה 4.7% בלבד).</li>
          <li><b>אלברט מייקלסון (1879–1926)</b> — שיפר את הניסוי שוב ושוב. מדידת 1926: c=299,796 ק"מ/ש. זכה בפרס נובל (1907).</li>
          <li><b>ערך מודרני (1983)</b> — c <em>מוגדר</em> כ-299,792,458 מ/ש בדיוק. כיום המטר מוגדר על בסיס c!</li>
        </ul>
      </div>
      ${fBox('n = \\dfrac{c}{v}','מדד השבירה — יחס המהירויות',[
        ['n','מדד שבירה','תמיד n\\geq 1'],
        ['c','מהירות בחלל','299{,}792{,}458 \\text{ m/s} בדיוק'],
        ['v','מהירות בחומר','v=c/n — תמיד v\\leq c']
      ])}
      <div class="info-grid">
        <div class="info-item"><div class="il">חלל ריק</div><div class="iv">n = 1.000</div></div>
        <div class="info-item"><div class="il">אוויר</div><div class="iv">n ≈ 1.0003</div></div>
        <div class="info-item"><div class="il">מים</div><div class="iv">n ≈ 1.333</div></div>
        <div class="info-item"><div class="il">זכוכית</div><div class="iv">n ≈ 1.5</div></div>
        <div class="info-item"><div class="il">יהלום</div><div class="iv">n ≈ 2.42</div></div>
        <div class="info-item"><div class="il">מי מלח</div><div class="iv">n ≈ 1.38</div></div>
      </div>
      <div class="enrich-card"><div class="enrich-title">האור מגיע מהשמש ב-8 דקות</div>
        <p>השמש רחוקה ~150 מיליון ק"מ. 1.5×10¹¹ m / 3×10⁸ m/s ≈ 500 שניות = <b>8.3 דקות</b>. כשמסתכלים על השמש, רואים אותה כפי שהיתה לפני 8 דקות. כוכב הצפון נמצא 432 שנות אור.</p>
      </div>
      <div class="theory-anim">${animCanvas('anim-refr-speed',138,'האור מאט בחומר — n=c/v')}</div>`,
  },

  example:{title:'מהירות אור בזכוכית',text:'מדד השבירה של זכוכית n=1.5. מהי מהירות האור בזכוכית?',

'opt-reflection.refl-laws':{
  theory:{
    title:'חוקי ההחזרה',
    html:`
      <p>כשקרן אור פוגעת במשטח חלק, חלק מהאנרגיה מוחזרת. תופעה זו נקראת <b>החזרה</b> (Reflection). שני חוקים פשוטים שולטים בה לחלוטין.</p>
      <div class="def-block"><div class="def-title">חוק ההחזרה הראשון</div>
        <p>זווית הפגיעה שווה לזווית ההחזרה: <b>θᵢ = θᵣ</b>. שתי הזוויות נמדדות מ<b>הנורמל</b> — הקו המאונך למשטח בנקודת הפגיעה.</p>
      </div>
      <div class="def-block"><div class="def-title">חוק ההחזרה השני</div>
        <p>קרן הפגיעה, הנורמל וקרן ההחזרה נמצאים <b>באותו מישור</b>.</p>
      </div>
      ${fBox('\\theta_i = \\theta_r','חוק ההחזרה',[
        ['\\theta_i','זווית פגיעה','מהנורמל לקרן הנכנסת'],
        ['\\theta_r','זווית החזרה','מהנורמל לקרן המוחזרת']
      ])}
      <div class="enrich-card"><div class="enrich-title">הרון מאלכסנדריה ועקרון פרמה</div>
        <p><b>הרון מאלכסנדריה (ca. 60 לספירה)</b> הוכיח כבר לפני ~2000 שנה שחוק ההחזרה נובע מעקרון גיאומטרי פשוט: האור עובר בדרך ה<em>קצרה ביותר</em> בין שתי נקודות דרך המשטח. מכאן θᵢ=θᵣ מתחייב מגיאומטריה טהורה.<br><br>
        <b>עקרון פרמה (1662):</b> פייר דה פרמה הרחיב — האור עובר תמיד ב<em>מסלול הזמן הקצר ביותר</em>. עקרון זה מסביר בצורה מאוחדת ואלגנטית גם החזרה וגם שבירה.</p>
      </div>
      <p><b>החזרה ספקולרית</b> (Specular): משטח חלק — מראה. <b>החזרה דיפוזית</b> (Diffuse): משטח מחוספס — קרניים מוחזרות לכל הכיוונים. זו הסיבה שאנחנו רואים עצמים שאינם מקור אור.</p>
      <div class="theory-anim">${animCanvas('anim-refl-law',140,'חוק ההחזרה: θᵢ = θᵣ')}</div>`,
  },
  sim:{type:'opt-reflection',desc:'גרור את קרן האור ושנה את זווית הפגיעה. שים לב שזווית ההחזרה תמיד שווה לזווית הפגיעה — הנמדדות מהנורמל.'},
  example:{title:'יישום חוק ההחזרה',text:'קרן פוגעת במראה בזווית 40° מהמשטח. מהי זווית ההחזרה מהנורמל?',
    steps:[
      {q:'זווית מהמשטח=40°, מהנורמל?',a:'θᵢ=90°−40°=50° מהנורמל'},
      {q:'לפי חוק ההחזרה, θᵣ=?',a:'θᵣ=θᵢ=50° מהנורמל'},

  quiz:[
    {q:'קרן פוגעת במראה בזווית 35° מהנורמל. מה זווית ההחזרה?',opts:['55°','35°','70°','45°'],correct:1,explain:'חוק ההחזרה: θᵣ=θᵢ=35°. פשוט — שתי הזוויות נמדדות מהנורמל ותמיד שוות.',hint:'θᵢ=θᵣ'},
    {q:'מה הנורמל למשטח?',opts:['קו המשיק למשטח','קו מאונך למשטח','קרן הפגיעה','ציר x'],correct:1,explain:'הנורמל הוא הקו המאונך (ניצב) למשטח בנקודת הפגיעה. זוויות ההחזרה נמדדות ממנו.'},
    {q:'אם קרן פוגעת בנורמל (θᵢ=0°), לאן הקרן המוחזרת?',opts:['ניצבת למשטח','מקבילה למשטח','לא מוחזרת','בזווית 45°'],correct:0,explain:'θᵣ=θᵢ=0° — הקרן חוזרת ישירות על עצמה, בניצב למשטח.'},
    {q:'הסיבה שאנחנו רואים דף נייר לבן (שאינו מנורה) היא:',opts:['החזרה ספקולרית','קרינה עצמית','החזרה דיפוזית','שבירת האור'],correct:2,explain:'נייר הוא משטח מחוספס — מפזר אור לכל הכיוונים (החזרה דיפוזית). לכן ניתן לראותו מכל זווית.'},
  ],

      {q:'הזווית שהקרן עושה עם מראה B (מהמשטח, לא הנורמל)?',unit:'°',answer:'50',tolerance:1,explain:'שני המראות ניצבות → הזווית עם המשטח של B שווה לזווית עם הנורמל של A = 50°',hint:'בשתי מראות ניצבות: סכום הזוויות עם הנורמלים = 90°'},

    ]}

'opt-reflection.plane-mirror':{
  theory:{
    title:'מראה מישורית',
    html:`
      <p>המראה המישורית יוצרת <b>תמונה מדומה</b>: נראית כאילו היא מאחורי המראה, אך האור לא עובר שם ממש.</p>
      <div class="enrich-card"><div class="enrich-title">תולדות המראה</div>
        <p>מראות ראשונות: <b>ברונזה מלוטשת</b> במצרים ובמסופוטמיה (~4000 לפנה"ס). הרומאים ייצרו מראות זכוכית עם ציפוי מתכתי. המראה המודרנית (זכוכית + כסף כימי) הומצאה ב-<b>1835 על ידי יוסטוס פון ליביג</b>.</p>
      </div>
      <div class="def-block"><div class="def-title">תכונות תמונת המראה המישורית</div>
        <ul style="padding-right:20px;color:#b8cfe0;font-size:.9rem;line-height:2">
          <li><b>מדומה</b> — לא ניתן להקרין על מסך</li>
          <li><b>ישרה</b> — לא הפוכה מעלה-מטה</li>
          <li><b>שווה גודל</b> — |m|=1</li>
          <li><b>מרחק שווה</b> — dᵢ = dₒ (אחורי המראה)</li>
          <li><b>היפוך עומק</b> — קדמי הופך לאחורי (לא ימין-שמאל!)</li>
        </ul>
      </div>
      ${fBox('d_i = d_o','מיקום התמונה',[
        ['d_o','מרחק עצם','מרחק העצם מהמראה'],
        ['d_i','מרחק תמונה','שווה ל-d_o, מאחורי המראה']
      ])}
      <div class="def-block"><div class="def-title">פרדוקס: למה המראה מחליפה ימין-שמאל?</div>

'opt-reflection.concave-mirror':{
  theory:{
    title:'מראה קעורה',
    html:`
      <p>מראה קעורה מרכזת קרניים מקבילות לנקודה אחת — <b>מוקד F</b>. היא יכולה לייצר תמונות ממשיות ומדומות בהתאם למיקום העצם.</p>
      <div class="enrich-card"><div class="enrich-title">ארכימדס ומראות השריפה (212 לפנה"ס — אגדה?)</div>
        <p>האגדה: ארכימדס השתמש בקבוצת מראות כדי לשרוף ספינות רומאיות. ניסויים מודרניים הוכיחו שזה <em>אפשרי</em> — מראות קעורות גדולות מספיקות לשרוף עץ. מתקני <b>אנרגיה סולארית</b> (Ivanpah, קליפורניה) עושים בדיוק זאת: אלפי מראות מכוונות אל מגדל לייצור חשמל. <b>טלסקופ ניוטון (1668)</b> השתמש במראה קעורה במקום עדשה — פתר בעיית עיוות כרומטי.</p>
      </div>
      <div class="def-block"><div class="def-title">מושגי מפתח</div>
        <ul style="padding-right:20px;color:#b8cfe0;font-size:.9rem;line-height:1.9">
          <li><b>ציר ראשי</b> (= <b>ציר אופטי</b>) — קו הסימטריה המרכזי של המראה. שני השמות זהים בספרות.</li>
          <li><b>מרכז עקמומיות C</b> — במרחק R על הציר הראשי. קרן דרך C מוחזרת על עצמה.</li>
          <li><b>מוקד F</b> — קרניים מקבילות לציר הראשי מתכנסות כאן. f = R/2.</li>
        </ul>
      </div>
      ${fBox('\\dfrac{1}{f}=\\dfrac{1}{d_o}+\\dfrac{1}{d_i}','משוואת המראה',[
        ['f','אורך מוקדי','f=R/2, חיובי למראה קעורה'],
        ['d_o','מרחק עצם','חיובי תמיד'],
        ['d_i','מרחק תמונה','חיובי=ממשית, שלילי=מדומה']
      ])}
      ${fBox('m = -\\dfrac{d_i}{d_o}','הגדלה',[['m','הגדלה','m>0: ישרה; m<0: הפוכה; |m|>1: מוגדלת']])}
      <div class="info-grid">
        <div class="info-item"><div class="il">dₒ &gt; 2f</div><div class="iv">ממשית, הפוכה, מוקטנת</div></div>
        <div class="info-item"><div class="il">dₒ = 2f</div><div class="iv">ממשית, הפוכה, שווה גודל</div></div>
        <div class="info-item"><div class="il">f &lt; dₒ &lt; 2f</div><div class="iv">ממשית, הפוכה, מוגדלת</div></div>
        <div class="info-item"><div class="il">dₒ = f</div><div class="iv">תמונה ב-∞ (קרניות מקבילות)</div></div>
        <div class="info-item"><div class="il">dₒ &lt; f</div><div class="iv">מדומה, ישרה, מוגדלת</div></div>
      </div>
      <div class="theory-anim">${animCanvas('anim-concave-mirror-t',190,'יצירת תמונה — מראה קעורה')}</div>`,
  },
  sim:{type:'opt-concave-mirror',desc:'גרור את העצם לאורך הציר הראשי. ראה כיצד התמונה משתנה — ממשית/מדומה, גדולה/קטנה, הפוכה/ישרה — בהתאם למיקום העצם ביחס למוקד.'},
  example:{title:'חישוב מיקום תמונה',text:'מראה קעורה עם f=15 cm. עצם ב-dₒ=45 cm. מצא dᵢ ו-m.',
    steps:[
      {q:'1/dᵢ = 1/f − 1/dₒ = 1/15 − 1/45 = ?',a:'3/45−1/45=2/45 → dᵢ=22.5 cm'},
      {q:'m = −dᵢ/dₒ = −22.5/45 = ?',a:'m=−0.5 (הפוכה, מוקטנת)'},

  quiz:[
    {q:'מה הקשר בין f ל-R במראה כדורית?',opts:['f=R','f=2R','f=R/2','f=R²'],correct:2,explain:'f=R/2. אורך המוקד הוא חצי מרדיוס העקמומיות — נובע מגיאומטריה של הקרניים.',formula:'f=R/2'},
    {q:'מראה קעורה f=10 cm, dₒ=30 cm. מהו dᵢ?',opts:['15 cm','20 cm','10 cm','5 cm'],correct:0,explain:'1/dᵢ=1/10−1/30=3/30−1/30=2/30 → dᵢ=15 cm. ממשית (חיובי).',formula:'1/f=1/dₒ+1/dᵢ'},
    {q:'dᵢ שלילי מסמן:',opts:['תמונה ממשית','שגיאת חישוב','תמונה מדומה','תמונה הפוכה'],correct:2,explain:'dᵢ<0 → התמונה מדומה (מאחורי המראה), כמו כשהעצם בין המוקד למראה.'},
    {q:'מה ההגדלה כשהעצם בדיוק במרכז העקמומיות (dₒ=2f)?',opts:['m=+2','m=−1','m=−2','m=+0.5'],correct:1,explain:'dₒ=2f → 1/dᵢ=1/f−1/2f=1/2f → dᵢ=2f. m=−2f/2f=−1. הפוכה, שווה גודל.'},
  ],
  problem:{title:'טלסקופ השתקפות',text:'מראה קעורה עם R=60 cm. עצם ב-dₒ=25 cm ממנה.',
    steps:[
      {q:'f=R/2 = ? (cm)',unit:'cm',answer:'30',tolerance:0,explain:'f=60/2=30 cm',hint:'f=R/2'},
      {q:'1/dᵢ=1/30−1/25. חשב dᵢ (cm). הכנס ערך שלילי אם מדומה.',unit:'cm',answer:'-150',tolerance:2,explain:'1/dᵢ=5/150−6/150=−1/150 → dᵢ=−150 cm (מדומה!). dₒ<f לכן מדומה.',hint:'כשdₒ<f, התמונה מדומה ו-dᵢ שלילי'},
      {q:'m=−dᵢ/dₒ=?',unit:'',answer:'6',tolerance:0.1,explain:'m=−(−150)/25=+6. ישרה (m חיובי), מוגדלת פי 6 — כמו מראת איפור!',hint:'m=−dᵢ/dₒ, שים לב לסימנים'},
    ]}
},

'opt-reflection.convex-mirror':{

        <p>ללא קשר למיקום העצם, מראה קמורה תמיד יוצרת תמונה מדומה (dᵢ&lt;0), ישרה (m&gt;0) ומוקטנת (|m|&lt;1). משתמשים בה כשרוצים שדה ראייה רחב.</p>

      ${fBox('\\dfrac{1}{f}=\\dfrac{1}{d_o}+\\dfrac{1}{d_i},\\quad f<0','משוואת מראה קמורה',[])}

      <div class="info-grid">
        <div class="info-item"><div class="il">אורך מוקדי</div><div class="iv">f &lt; 0 (מדומה)</div></div>

        <div class="info-item"><div class="il">הגדלה m</div><div class="iv">0 &lt; m &lt; 1 (מוקטנת, ישרה)</div></div>
        <div class="info-item"><div class="il">שדה ראייה</div><div class="iv">רחב — יתרון!</div></div>
      </div>
      <div class="theory-anim">${animCanvas('anim-convex-mirror-t',175,'מראה קמורה — תמונה מדומה')}</div>`,

'opt-refraction.snell-law':{
  theory:{
    title:'חוק סנל — שבירת אור',
    html:`
      <p>כשאור עובר מחומר אחד לאחר, הוא משנה כיוון — תופעה הנקראת <b>שבירה</b> (Refraction). הסיבה: מהירות האור שונה בחומרים שונים.</p>
      <div class="enrich-card"><div class="enrich-title">תולדות חוק השבירה — גולוי שקרה פעמים רבות</div>
        <p>
        <b>תומס הריוט (1601)</b> — גילה את החוק המדויק אך מעולם לא פרסם.<br>
        <b>וילברורד סנל (1621)</b> — גילה באופן עצמאי, כתב בכתב יד; מת ב-1626 לפני פרסום.<br>
        <b>רנה דקארט (1637)</b> — פרסם ראשון ב-"La Dioptrique" — לכן בצרפת נקרא "חוק דקארט".<br>
        <b>פייר דה פרמה (1662)</b> — הוכיח את החוק מ<em>עקרון הזמן המינימלי</em>: האור עובר בנתיב שבו הזמן קצר ביותר. מהירות שונה בשני חומרים — הנתיב האופטימלי מקיים בדיוק את n₁sinθ₁=n₂sinθ₂.
        </p>
      </div>
      ${fBox('n_1 \\sin\\theta_1 = n_2 \\sin\\theta_2','חוק סנל',[
        ['n_1,\\, n_2','מדדי שבירה','של החומר הראשון והשני'],
        ['\\theta_1','זווית פגיעה','מהנורמל, בחומר 1'],
        ['\\theta_2','זווית שבירה','מהנורמל, בחומר 2']
      ])}
      <p><b>כלל אצבע:</b> חומר צפוף יותר (n₂&gt;n₁) — האור <em>מתקרב לנורמל</em> (θ₂&lt;θ₁). חומר דליל יותר — <em>מתרחק</em>.</p>
      <div class="def-block"><div class="def-title">עומק נדמה (Apparent Depth)</div>
        <p>חפץ בעומק d מתחת למים (n=1.33), צופה באוויר — נראה קרוב יותר:</p>
        ${fBox("d' = \\dfrac{d}{n}",'עומק נדמה',[
          ["d'",'עומק נדמה','מה הצופה רואה'],
          ['d','עומק ממשי',''],
          ['n','מדד שבירה','n≈1.33 → עומק נדמה ≈ 0.75d']
        ])}
      </div>
      <div class="theory-anim">${animCanvas('anim-snell',140,'שבירה: האור מתכופף כשעובר בין מדיומים')}</div>`,
  },
  sim:{type:'opt-snell',desc:'גרור את הקרן ושנה את זווית הפגיעה. שנה גם את מדדי השבירה n₁ ו-n₂. שים לב כיצד הקרן מתכופפת לפי חוק סנל.'},
  example:{title:'אור ממים לאוויר',text:'קרן עוברת ממים (n=1.33) לאוויר (n=1), θ₁=30°. מצא θ₂.',
    steps:[
      {q:'n₁sinθ₁=n₂sinθ₂ → 1.33·sin30°=1·sinθ₂',a:'1.33·0.5=0.665'},
      {q:'θ₂=arcsin(0.665)=?',a:'θ₂≈41.7° (מתרחק מהנורמל כי יוצא לחומר דליל)'},
    ]},
  quiz:[
    {q:'קרן עוברת מאוויר (n=1) לזכוכית (n=1.5) בזווית 30° מהנורמל. מה sinθ₂?',opts:['0.333','0.5','0.75','1'],correct:0,explain:'n₁sinθ₁=n₂sinθ₂ → 1·sin30°=1.5·sinθ₂ → sinθ₂=0.5/1.5=0.333 → θ₂≈19.5°',formula:'n₁sinθ₁=n₂sinθ₂'},

'opt-refraction.tir':{
  theory:{
    title:'החזרה פנימית מלאה',
    html:`
      <p>כשאור עובר מחומר <em>צפוף</em> לחומר <em>דליל</em> (n₁&gt;n₂), הזווית המשוברת גדולה מזווית הפגיעה. בזווית פגיעה מסוימת — <b>הזווית הקריטית</b> — הקרן השבורה תהיה בדיוק ב-90°. מעל זווית זו: <b>כל האור מוחזר</b> — אפס שבירה!</p>
      ${fBox('\\sin\\theta_c = \\dfrac{n_2}{n_1}','הזווית הקריטית (n₁>n₂)',[
        ['\\theta_c','זווית קריטית','זווית המינימום להחזרה מלאה'],
        ['n_1','מדד החומר הצפוף','n₁>n₂ תמיד'],
        ['n_2','מדד החומר הדליל','לעיתים n₂=1 (אוויר)']
      ])}
      <div class="def-block"><div class="def-title">סיבי אופטיקה (Optical Fibers)</div>
        <p>סיב אופטי הוא חוט זכוכית דק בקוטר מיקרומטרים. האור נכנס מהקצה ומוחזר שוב ושוב פנימה (HRI מלאה) ואינו יכול לצאת מהדפנות — מוליך אות אופטי ללא אובדן לאורך ק"מ. בסיסון התקשורת המודרנית.</p>
      </div>
      <p>יישומים נוספים: יהלומים (n=2.42 → θ_c=24° → ברק רב), פריזמות בטלסקופים וביוקולרים, אנדוסקופ רפואי.</p>
      <div class="theory-anim">${animCanvas('anim-tir-theory',148,'החזרה פנימית מוחלטת — θ > θ_c')}</div>`,
  },
  sim:{type:'opt-tir',desc:'הגבר את זווית הפגיעה עד לזווית הקריטית — וראה כיצד כל האור מוחזר ואינו עובר. שנה את מדדי השבירה לשינוי הזווית הקריטית.'},
  example:{title:'זווית קריטית של זכוכית',text:'זכוכית n₁=1.5, אוויר n₂=1. מצא את הזווית הקריטית.',
    steps:[

  quiz:[
    {q:'מתי מתרחשת החזרה פנימית מלאה?',opts:['תמיד כשאור פוגע בזכוכית','כשאור עובר מחומר דליל לצפוף','כשאור עובר מחומר צפוף לדליל בזווית גדולה מהקריטית','כשהאור פוגע בניצב'],correct:2,explain:'שני תנאים: 1) מחומר צפוף לדליל (n₁>n₂). 2) זווית פגיעה > זווית קריטית. שניהם נדרשים!'},
    {q:'מים n=1.33, אוויר n=1. מה sinθ_c?',opts:['1.33','0.75','0.5','1'],correct:1,explain:'sinθ_c=n₂/n₁=1/1.33=0.75 → θ_c=arcsin(0.75)≈48.6°',formula:'sinθ_c=n₂/n₁'},
    {q:'מדוע יהלום נוצץ כל-כך?',opts:['כי הוא שקוף','כי n גדול → θ_c קטן → רוב האור מוחזר פנימה שוב ושוב','כי הוא מחזיר כל האור','כי הוא פולט אור עצמי'],correct:1,explain:'n_יהלום=2.42 → θ_c=arcsin(1/2.42)≈24.4°. זווית קריטית קטנה מאוד → רוב קרניות האור שנכנסות חוות HRI מלאה פנימית → ניצוץ!'},
    {q:'סיב אופטי מנצל:',opts:['שבירה מלאה','החזרה מלאה','הקפצה חשמלית','לחץ קרינה'],correct:1,explain:'סיב אופטי: ליבת זכוכית (n גבוה) בתוך ציפוי (n נמוך). כל אור שפוגע בדפנות בזווית מעל קריטית — מוחזר. מוליך אורחות ללא אובדן.'},
  ],
  problem:{title:'עיצוב סיב אופטי',text:'סיב אופטי עם ליבה n₁=1.48 וציפוי n₂=1.44.',
    steps:[
      {q:'sinθ_c=n₂/n₁. חשב את sinθ_c',unit:'',answer:'0.973',tolerance:0.002,explain:'sinθ_c=1.44/1.48=0.9730',hint:'sinθ_c=n₂/n₁'},
      {q:'θ_c=arcsin(sinθ_c)≈?(°)',unit:'°',answer:'76.7',tolerance:0.5,explain:'θ_c=arcsin(0.973)≈76.7°. זווית גבוהה — הסיב מקבל אור בטווח זוויות רחב.',hint:'arcsin(0.973)'},
    ]}
},

'opt-refraction.prism':{
  theory:{
    title:'פריזמה ופיזור אור',
    html:`
      <p>פריזמה שוברת אור <b>פעמיים</b> — בכניסה וביציאה. מכיוון שהמשטחים אינם מקבילים, הקרן יוצאת בזווית שונה. כשהאור לבן, כל צבע נשבר בזווית שונה — <b>פיזור</b> (Dispersion).</p>
      <div class="enrich-card"><div class="enrich-title">ניוטון, המגיפה והפריזמה — 1666</div>
        <p>ב-1665 פרצה המגיפה (Black Death) באנגליה וקיימברידג' נסגרה. ניוטון בן ה-23 חזר לוולסת'ורפ — ובשנתיים אלו גילה אינפיניטסימל, חוק הכבידה, <b>וניסוי הפריזמה</b>.<br><br>
        השאלה שעסקה אותו: האם הפריזמה <em>מוסיפה</em> צבע לאור לבן, או <em>מפרידה</em> צבעים שכבר היו בו? הוכחתו: שחרר רק אור סגול מהספקטרום ועבר דרך פריזמה שנייה — הסגול נשאר סגול. הפריזמה מפרידה — לא יוצרת. <b>אור לבן = שילוב של כל הצבעים</b>.</p>
      </div>
      <div class="def-block"><div class="def-title">פיזור — מדוע?</div>
        <p>מדד השבירה תלוי באורך הגל: n_סגול &gt; n_אדום. נוסחת קושי: ${M('n(\\lambda)\\approx A+B/\\lambda^2')} (A,B קבועי חומר). לכן <b>סגול מתכופף יותר, אדום פחות</b>.</p>
      </div>
      <p><b>קשת בענן:</b> טיפות גשם כדוריות — שבירה + החזרה פנימית + שבירה שנית. ~42° לאדום, ~40° לסגול. <b>אדום בחוץ (למעלה), סגול בפנים (למטה)</b>.</p>
      <div class="theory-anim">${animCanvas('anim-prism',160,'פיזור אור לבן — סגול מתכופף יותר מאדום')}</div>`,
  },
  sim:{type:'opt-prism',desc:'אור לבן עובר דרך פריזמה ומתפצל לצבעי הקשת. שנה את זווית הפריזמה ואת מדד השבירה לראות כיצד זה משפיע על הפיזור.'},
  example:{title:'זווית סטייה בפריזמה',text:'פריזמה שווה-צלעות (60°) עם n=1.5. קרן עוברת בה בסימטריה. הסטייה המינימלית δ_min נתונה על ידי: sin((A+δ)/2)=n·sin(A/2).',
    steps:[
      {q:'A=60°, n=1.5: sin((60+δ)/2)=1.5·sin30°=0.75',a:'(60+δ)/2=arcsin(0.75)=48.6°'},
      {q:'60+δ=97.2° → δ=?',a:'δ=37.2°'},
    ]},
  quiz:[
    {q:'מדוע פריזמה מפצלת אור לבן לצבעים?',opts:['האור מוחזר בדפנות','מדד השבירה שונה לאורכי גל שונים','הפריזמה סופגת צבעים מסוימים','האור מאיץ בפריזמה'],correct:1,explain:'n=n(λ) — מדד השבירה תלוי באורך הגל. n_סגול>n_אדום → סגול מתכופף יותר → פיזור.',hint:'חשוב על חוק סנל: אם n שונה, θ₂ שונה'},
    {q:'איזה צבע מתכופף הכי הרבה בפריזמה?',opts:['אדום','ירוק','כחול','סגול'],correct:3,explain:'לסגול מדד שבירה גבוה ביותר (n_סגול>n_אדום) → הכי הרבה שבירה. אדום — הכי מעט.'},
    {q:'בקשת בענן, איזה צבע נמצא בחלק החיצוני (עליון)?',opts:['סגול','כחול','אדום','ירוק'],correct:2,explain:'אדום בחוץ (למעלה), סגול בפנים (למטה). זאת כי טיפות גשם מחזירות: אדום בזווית 42°, סגול 40° — אדום מגיע מגובה נמוך יותר ונראה למעלה.'},
    {q:'מה יקרה אם נעביר את הספקטרום מהפריזמה הראשונה דרך פריזמה הפוכה?',opts:['יחמיר הפיזור','יווצרו יותר צבעים','נקבל חזרה אור לבן','הצבעים יתחלפו'],correct:2,explain:'ניסוי ניוטון: פריזמה שנייה הפוכה מחזירה את כל הצבעים לאור לבן — מוכיחה שהצבעים היו בתוך האור לבן מלכתחילה.'},
  ],
  problem:{title:'פיזור בפריזמה',text:'פריזמה עם n_אדום=1.51, n_סגול=1.53. קרן נכנסת בזווית θ₁=40° ממשטח שזווית הפריזמה 30°.',
    steps:[
      {q:'לפריזמה דקה זווית הסטייה היא δ=(n−1)A, ולכן הפיזור הזוויתי הוא Δδ=(n_סגול−n_אדום)·A. עם A=30°, חשב Δδ (°)',unit:'°',answer:'0.6',tolerance:0.05,explain:'Δδ=(1.53−1.51)×30°=0.02×30°=0.6°. הקו הסגול והאדום מופרדים ב-0.6° בלבד — ולכן צריך מסך רחוק (או פריזמה גדולה) כדי לראות ספקטרום רחב.',hint:'גזור את δ=(n−1)A לפי n: Δδ=Δn·A'},
    ]}
},

'opt-lenses.convex-lens':{
  theory:{
    title:'עדשה מרכזת (קמורה)',
    html:`
      <p>עדשה מרכזת <b>מכופפת קרניים לכיוון הציר הראשי</b>. קרניים מקבילות מתכנסות במוקד F. f&gt;0 תמיד.</p>
      <div class="enrich-card"><div class="enrich-title">תולדות העדשה — מהמשקפיים לחלל</div>
        <ul style="padding-right:20px;color:#b8cfe0;font-size:.9rem;line-height:1.9">
          <li><b>~1290, איטליה</b> — <b>משקפיים</b> הומצאו (סלווינו ד'ארמאטי?). מהפכה: אנשים מבוגרים עם ראייה ארוכה יכלו לקרוא.</li>
          <li><b>1608, ליפרשיי</b> — המציא את הטלסקופ בהולנד.</li>
          <li><b>1609, גלילאו</b> — שיפר (הגדלה x20), כיוון לשמשים, גילה ירחי צדק והרי הירח.</li>
          <li><b>~1674, לוונהוק</b> — עדשות קטנות (x270) גילו מיקרואורגניזמים — מהפכה בביולוגיה!</li>
        </ul>
      </div>
      ${fBox('\\dfrac{1}{f}=\\dfrac{1}{d_o}+\\dfrac{1}{d_i}','משוואת העדשה הדקה',[
        ['f','אורך מוקדי','חיובי לעדשה מרכזת'],
        ['d_o','מרחק עצם','חיובי תמיד'],
        ['d_i','מרחק תמונה','חיובי=ממשית, שלילי=מדומה']
      ])}
      ${fBox('m = -\\dfrac{d_i}{d_o}','הגדלה',[])}
      <div class="info-grid">
        <div class="info-item"><div class="il">dₒ &gt; 2f</div><div class="iv">ממשית, הפוכה, מוקטנת</div></div>
        <div class="info-item"><div class="il">dₒ = 2f</div><div class="iv">ממשית, הפוכה, שווה גודל</div></div>
        <div class="info-item"><div class="il">f &lt; dₒ &lt; 2f</div><div class="iv">ממשית, הפוכה, מוגדלת</div></div>
        <div class="info-item"><div class="il">dₒ &lt; f</div><div class="iv">מדומה, ישרה, מוגדלת</div></div>
      </div>
      <p><b>שיטת 3 הקרניות לבניית תמונה:</b> (1) קרן מקבילה לציר הראשי → דרך מוקד F. (2) קרן דרך המרכז האופטי → ישר ללא שבירה. (3) קרן דרך מוקד F → יוצאת מקבילה לציר.</p>
      <div class="theory-anim">${animCanvas('anim-convex-lens-t',190,'עדשה מרכזת — יצירת תמונה')}</div>`,
  },
  sim:{type:'opt-convex-lens',desc:'גרור את העצם לאורך הציר. ראה כיצד גודל ומיקום התמונה משתנים. שים לב מה קורה כשהעצם חוצה את המוקד!'},
  example:{title:'מצלמה פשוטה',text:'עדשה f=50 mm. עצם ב-dₒ=200 mm. מצא dᵢ ו-m.',

    {q:'זכוכית מגדלת עובדת כי:',opts:['dₒ>2f','dₒ=2f','dₒ<f','dₒ=f'],correct:2,explain:'בזכוכית מגדלת העצם בין המוקד לעדשה (dₒ<f). תוצאה: תמונה מדומה, ישרה, מוגדלת מאחורי העצם.'},

      {q:'הגדלה m₁=−dᵢ/dₒ=−30/6=?',unit:'',answer:'-5',tolerance:0.1,explain:'m₁=−5. הפוכה, מוגדלת פי 5. זוהי תמונת הביניים.',hint:'m=−dᵢ/dₒ'},

'opt-lenses.concave-lens':{
  theory:{
    title:'עדשה מפזרת (קעורה)',
    html:`

        <p>בניגוד לעדשה מרכזת, עדשה מפזרת תמיד יוצרת תמונה מדומה (dᵢ&lt;0), ישרה (m&gt;0) ומוקטנת (0&lt;m&lt;1). לא משנה איפה העצם.</p>

'opt-lenses.lens-eye':{
  theory:{
    title:'העין האנושית',
    html:`
      <p>העין האנושית — מצלמה ביולוגית עם עדשה משתנה אוטומטית, פותחת (אישון) הנשלטת לפי האור, ו"סרט" (רשתית) עם 120 מיליון קולטנים.</p>

        <p>יוהנס קפלר (Ad Vitellionem Paralipomena, 1604) הסביר לראשונה נכון: הקרנית והעדשה יוצרות תמונה <em>הפוכה ומוקטנת</em> על הרשתית. מדוע אנחנו רואים ישר? כי המוח מפרש את האותות ומהפך אותם. אבן אל-הית'ם ידע שאור נכנס לעין — קפלר הסביר מה קורה בתוכה.</p>
      </div>
      <div class="def-block"><div class="def-title">מרכיבי העין</div>
        <ul style="padding-right:20px;color:#b8cfe0;font-size:.9rem;line-height:1.8">
          <li><b>קרנית (Cornea)</b> — ~67% מכוח השבירה (~43 דיופטר). קבועה.</li>
          <li><b>עדשה (Lens)</b> — מוסיפה ~20 דיופטר, <em>משתנה</em> (אקומודציה)</li>
          <li><b>אישון</b> — נפתח 2–8 מ"מ (שינוי שטח פי 16)</li>
          <li><b>רשתית</b> — 6M קונוסים (צבע ביום) + 120M מוטות (חשכה)</li>

        <div class="info-item"><div class="il">נקודה קרובה תקינה</div><div class="iv">~25 cm</div></div>
        <div class="info-item"><div class="il">אורך עין</div><div class="iv">~25 mm</div></div>
        <div class="info-item"><div class="il">כוח שבירה כולל</div><div class="iv">~60 דיופטר</div></div>

      <p><b>ליקויי ראייה:</b><br>

      • <b>פרסביופיה</b> (גיל +45) — אקומודציה מתמעטת, נקודה קרובה מתרחקת → משקפי קריאה.</p>
      <div class="theory-anim">${animCanvas('anim-eye-focus-t',180,'ראייה תקינה, קצרת ורחוקת-ראייה')}</div>`,
  },
  sim:{type:'opt-eye',desc:'גרור את העצם קרוב ורחוק — צפה באקומודציה של העדשה. עבור בין ראייה תקינה, קוצר ורוחק ראייה, והוסף משקפיים מתקנים. התיבה משמאל מראה מה העין רואה!'},

'opt-waves.interference':{
  theory:{
    title:'הפרעה — ומה הוא האור?',
    html:`
      <p>עד כאן למדנו את <em>מה שהאור עושה</em> — נע בקווים ישרים, מוחזר, נשבר. אך מהו האור עצמו? שאלה זו יצרה מחלוקת מדעית של 200 שנה.</p>
      <div class="enrich-card"><div class="enrich-title">המאבק הגדול: ניוטון מול הויגנס</div>
        <p><b>כריסטיאן הויגנס (Traite de la Lumiere, 1678)</b> — אור הוא <em>גל</em>. הסביר שבירה והחזרה בצורה פשוטה.<br><br>
        <b>יצחק ניוטון (Opticks, 1704)</b> — אור הוא <em>זרם חלקיקים</em> ("קורפוסקולים"). סמכותו העצומה גרמה לרוב המדענים לדחות את תיאורית הגל.<br><br>
        כך עמדו הדברים ~100 שנה — עד שתומס יאנג ניפץ את הקונסנזוס ב-1801 (ראה נושא הבא).</p>
      </div>
      <p>כשגלי אור מרובים מגיעים לאותה נקודה, הם מתחברים (<b>סופרפוזיציה</b>). התוצאה תלויה בהפרש הדרכים.</p>
      <div class="def-block"><div class="def-title">הפרעה בונה (Constructive)</div>
        <p>פסגה + פסגה (in phase). <b>הפרש דרכים = mλ</b>. עצמה מרבית.</p>
      </div>
      <div class="def-block"><div class="def-title">הפרעה מהרסת (Destructive)</div>
        <p>פסגה + שוקת (out of phase). <b>הפרש דרכים = (m+½)λ</b>. עצמה אפס.</p>
      </div>
      ${fBox('\\Delta d = m\\lambda \;(\\text{בונה}),\\quad \\Delta d=(m+\\tfrac{1}{2})\\lambda \;(\\text{מהרסת})','תנאי הפרעה',[
        ['\\Delta d','הפרש דרכים','הפרש מרחקים משני המקורות לנקודה'],
        ['m','מספר סדר','0,\\pm1,\\pm2,\\ldots'],
        ['\\lambda','אורך גל','']
      ])}
      <p><b>תנאי לאינטרפרנציה:</b> מקורות <em>קוהרנטיים</em> — אותה תדירות ויחס פאזה קבוע.</p>
      <div class="theory-anim">${animCanvas('anim-interference-t',148,'הפרעה בונה ומהרסת')}</div>`,
  },
  sim:{type:'opt-interference',desc:'שני מקורות גל קוהרנטיים. עיגולים כחולים = פסגות, אפלה = שוקות. ראה כיצד נוצרות נקודות הפרעה בונה ומהרסת.'},
  example:{title:'הפרעה בין שני מקורות',text:'שני מקורות גל, λ=500nm. נקודה P רחוקה 120nm ממקור 1 ו-620nm ממקור 2.',
    steps:[
      {q:'Δd=620−120=500nm=λ → סוג הפרעה?',a:'Δd=1·λ → הפרעה בונה (m=1)! נקודה בהירה'},

  quiz:[
    {q:'הפרעה בונה מתרחשת כשהפרש הדרכים הוא:',opts:['λ/2','(m+½)λ','mλ','2λ+1'],correct:2,explain:'הפרעה בונה: Δd=mλ (m שלם). הגלים ב-phase — פסגה עם פסגה, שוקת עם שוקת.',formula:'Δd=mλ'},
    {q:'הפרש דרכים 1.5λ גורם ל:',opts:['הפרעה בונה','הפרעה מהרסת','ביטול חלקי','חיזוק מלא'],correct:1,explain:'1.5λ=(1+½)λ → מהרסת. פסגה פוגשת שוקת → אמפליטודות מבטלות → חושך.'},
    {q:'מהו תנאי הכרחי לאינטרפרנציה?',opts:['אמפליטודות שוות','מקורות קוהרנטיים (אותה תדירות ופאזה קבועה)','אור מונוכרומטי','פגיעה בזווית 90°'],correct:1,explain:'קוהרנטיות — אותה תדירות ויחס פאזה קבוע. ללא קוהרנטיות, הפסגות ממוצעות ואין דפוס הפרעה.'},
    {q:'הפרעה מהרסת בין שני גלים שווים אמפליטודה גורמת ל:',opts:['עצמה כפולה','עצמה מחצית','עצמה אפס','עצמה רבע'],correct:2,explain:'שני גלים שווים בהפרעה מהרסת מלאה: E₁+E₂=A−A=0. עצמה אפס!'},
  ],
  problem:{title:'הפרעה בסרט דק',text:'סרט דק (כמו בועת סבון) עם עובי d=300nm, n=1.33. אורך גל האור בחלל λ₀=800nm.',
    steps:[

'opt-waves.youngs-slits':{
  theory:{
    title:'ניסוי יאנג — הוכחת הטבע הגלי',
    html:`
      <p>ב-1801 ביצע <b>תומס יאנג</b> ניסוי שנפץ 100 שנה של קונסנזוס ניוטוני: אור שעובר דרך שני סדקים יוצר דפוס פסים — משהו שחלקיקים לא יכולים לעשות!</p>
      <div class="enrich-card"><div class="enrich-title">יאנג נגד ניוטון — המאבק על נפש המדע</div>
        <p>יאנג פרסם ב-1802. <b>הנרי ברוהם</b> (Edinburgh Review, 1803) תקף בחריפות: "מחקר זה הוא שיא הביזיון האקדמי." הממסד הבריטי לא יכול לקבל תקיפה של ניוטון.<br><br>
        <b>אוגוסטן פרנל (1818)</b> — פיתח תיאוריה מתמטית שלמה. כשסימון פואסון ניסה להפריך ("צל של כדור יהיה בהיר במרכזו?!"), ארגו בדק — ומצא <b>נקודה בהירה בדיוק במרכז הצל</b>! "נקודת פואסון" — אחד הניסויים המוכיחים הדרמטיים בהיסטוריה.</p>
      </div>
      ${fBox('d \\sin\\theta = m\\lambda','פסים בהירים',[
        ['d','מרחק בין הסדקים',''],
        ['\\theta','זווית מהציר',''],
        ['m','מספר הסדר','0,\\pm1,\\pm2,\\ldots']
      ])}
      ${fBox('\\Delta y = \\dfrac{\\lambda L}{d}','מרווח בין פסים',[
        ['\\Delta y','מרווח פסים',''],
        ['L','מרחק מסך',''],
        ['d','מרחק הסדקים','']

'opt-waves.diffraction':{
  theory:{
    title:'עקיפה ואופטיקה גלית — סיכום',
    html:`
      <p><b>עקיפה</b> (Diffraction) היא התפשטות גלי אור סביב פינות ומכשולים. תופעה זו אינה ניתנת להסבר בתיאורית חלקיקים — הוכחה נוספת לטבע הגלי.</p>
      <div class="enrich-card"><div class="enrich-title">גרימלדי — המגלה הנשכח (1665)</div>
        <p>פרנצ'סקו גרימלדי, כהן ישועי איטלקי, תיאר ב-1665 (פוסטומית) כיצד אור העובר דרך פתח צר מתפשט הרחק מעבר לצל הגיאומטרי. הוא קרא לתופעה "Diffractio". ניוטון ידע על עקיפה — ניסה להסבירה בתיאורית חלקיקים ולא הצליח לחלוטין.</p>
      </div>
      <div class="def-block"><div class="def-title">עקרון הויגנס-פרנל</div>
        <p>כל נקודה על חזית גל היא מקור גל כדורי משני. סכום כל הגלים המשניים = חזית חדשה. מסביר שבירה, החזרה, ועקיפה.</p>
      </div>
      ${fBox('a \\sin\\theta = m\\lambda','מינימות בסדק יחיד',[
        ['a','רוחב הסדק',''],
        ['\\theta','זווית מינימום',''],
        ['m','סדר','\\pm1,\\pm2,\\ldots (לא 0!)']
      ])}
      <p><b>גבול ריילי:</b> ${M('\\theta_{\\min}=1.22\\lambda/D')} — בשל עקיפה, שתי נקודות קרובות אינן ניתנות להפרדה מתחת לגבול זה. לכן מיקרוסקופ אלקטרוני (λ~0.001 nm) מפריד פי 500,000 יותר ממיקרוסקופ אור.</p>
      <div class="enrich-card"><div class="enrich-title">סיכום: מהו האור?</div>
        <p>
        <b>מודל הקרן:</b> תקף לתאורה, עדשות, מראות.<br>
        <b>גל (יאנג, פרנל, 1801–1818):</b> הפרעה ועקיפה מוכיחות שאור הוא גל.<br>
        <b>גל אלקטרומגנטי (מקסוול, 1865):</b> c = 1/√(ε₀μ₀) — ניבוי מדויק מתורת החשמל!<br>
        <b>פוטון (אינשטיין, 1905):</b> E=hf. הסביר פוטואפקט. פרס נובל 1921.<br>
        <b>דואליות גל-חלקיק:</b> האור הוא גם גל וגם חלקיק — מכניקה קוונטית מאחדת.
        </p>
      </div>
      <div class="theory-anim">${animCanvas('anim-diffraction-t',138,'עקיפה — פיזור סביב קצה')}</div>`,

'opt-modern.polarization':{
  theory:{
    title:'קיטוב האור — חוק מאלוס',
    html:`
      <p>גל EM הוא <b>גל רוחבי</b> — שדה E מתנדנד בניצב לכיוון ההתפשטות. כיוון ההתנדנדות נקרא <b>כיוון הקיטוב</b>. באור טבעי, כל כיווני הקיטוב קיימים בו-זמנית — אור <em>בלתי מקוטב</em>. מסנן קיטוב (פולרואיד) מעביר רק כיוון אחד.</p>
      ${fBox('I = I_0 \\cos^2\\theta','חוק מאלוס (1809)',[['I_0','עוצמה לאחר קוטב ראשון','W/m²'],['\\theta','זווית בין ציר הקוטב למנתח','°'],['I','עוצמה לאחר מנתח','W/m²']])}
      <div class="info-grid">
        <div class="info-item"><div class="il">θ=0°</div><div class="iv">I = I₀ — מלא</div></div>
        <div class="info-item"><div class="il">θ=45°</div><div class="iv">I = I₀/2</div></div>
        <div class="info-item"><div class="il">θ=90°</div><div class="iv">I = 0 — כיבוי!</div></div>
        <div class="info-item"><div class="il">אור טבעי→קוטב</div><div class="iv">I = I₀/2</div></div>
      </div>
      <div class="def-block"><div class="def-title">זווית ברוסטר</div>
        <p>כאשר אור פוגע במשטח בזווית ${M('\\theta_B = \\arctan(n_2/n_1)')} — האור המוחזר מקוטב לינארית לחלוטין. זו <b>זווית ברוסטר</b>. לזכוכית (n=1.5): θ_B = arctan(1.5) ≈ 56°. עדשות מצלמה עם פילטר CP מנצלות עיקרון זה.</p>
      </div>
      <div class="enrich-card"><div class="enrich-title">מסכי LCD — קיטוב בפעולה</div>
        <p>בכל מסך LCD: שני פולרואידים ניצבים (90° זה לזה) ← <em>אמורים לחסום כל אור</em>. בין ביהם: גביש נוזלי שמסובב את כיוון הקיטוב. מתח חשמלי → שינוי זווית הגביש → שליטה בכמות האור שעוברת = בהירות פיקסל.</p>
      </div>
      <div class="enrich-card"><div class="enrich-title">משקפי שמש ו-3D קולנוע</div>
        <p><b>משקפי שמש מקוטבים</b>: מסנן קיטוב אופקי חוסם השתקפויות אופקיות מדרכים ומים (אור מוחזר מקוטב אופקית). <b>קולנוע תלת-מימד</b>: העין הימנית רואה קיטוב שמאלי-סיבובי, השמאלית — ימני. כל עין קולטת תמונה אחרת → תלת-מימד.</p>
      </div>
      <div class="theory-anim">${animCanvas('anim-polar-t',148,'קיטוב וחוק מאלוס')}</div>`,
  },
  sim:{type:'opt-polarization',desc:'גרור את דיסקת המנתח לסיבוב. אור טבעי מאבד חצי מעוצמתו בקוטב הראשון (I₁=I₀/2), ורק אז חל חוק מאלוס: I₂=I₁cos²θ. עקוב אחר שרשרת העוצמות והגרף בזמן אמת.'},

'opt-modern.doppler':{
  theory:{
    title:'אפקט דופלר לאור',
    html:`
      <p>כמו לקול — גם לאור יש אפקט דופלר. כשמקור אור מתקרב, האור נדחס לאורכי גל קצרים יותר (<b>כחלול</b>). כשמתרחק — נמתח (<b>אדמדום</b>). ההבדל: לאור נצרך לחשבון רלטיביסטי.</p>
      ${fBox('\\lambda_{obs} = \\lambda_0 \\sqrt{\\dfrac{1+\\beta}{1-\\beta}}','דופלר רלטיביסטי (מתרחק)',[['\\beta','v/c','מהירות יחסית לאור'],['\\lambda_0','אורך גל במקור','nm'],['\\lambda_{obs}','אורך גל נצפה','nm']])}
      <div class="def-block"><div class="def-title">הסחה אדומה (Redshift) z</div>
        <p>${M('z = \\dfrac{\\lambda_{obs}-\\lambda_0}{\\lambda_0}')} — אם z&gt;0: מתרחק (אדמדום). אם z&lt;0: מתקרב (כחלול). לβ קטן: z≈β=v/c.</p>
      </div>
      <div class="enrich-card"><div class="enrich-title">האבל (1929) — היקום מתרחב</div>
        <p>אדווין האבל מדד הסחות אדומות של 24 גלקסיות. גילה שכולן מתרחקות, ומהירות ההתרחקות פרופורציונלית למרחק: v=H₀·d. זה הוכיח שהיקום <em>מתרחב</em>. H₀ ≈ 70 km/s/Mpc. פרס נובל 2011 לגלאי ההאצה (אנרגיה אפלה).</p>
      </div>
      <div class="enrich-card"><div class="enrich-title">מד מהירות מכוניות ורדאר מזג אוויר</div>
        <p>מד מהירות שוטרים: פולט גל מיקרוגל (10 GHz), מודד תדירות ההחזר. הסחה לתדירות גבוהה יותר = מתקרב = מהירות. Δf/f₀=β=v/c → v=c·Δf/f₀. גם רדאר מזג האוויר עובד כך — מודד סחיפת גשם.</p>
      </div>
      <div class="theory-anim">${animCanvas('anim-doppler-t',148,'אפקט דופלר לאור')}</div>`,
  },

  example:{title:'גלקסיה מתרחקת — z=0.1',text:'גלקסיה מראה הסחה אדומה z=0.1. חשב את מהירות ההתרחקות.',

    {q:'גילוי האבל הראה שגלקסיות:',opts:['ניצבות','מתרחקות בעיקר — היקום מתרחב','מתקרבות','אקראיות'],correct:1,explain:'האבל 1929: כל הגלקסיות (חוץ מקבוצה מקומית) מתרחקות. מהירות ∝ מרחק (חוק האבל). עדות ישירה להתרחבות היקום.',formula:'v=H₀d'},

'opt-modern.lasers':{

      </div>
      ${fBox('E_2 - E_1 = hf','אנרגיית פוטון לייזר',[['E_2-E_1','הפרש אנרגיה בין מצבים','J'],['h','קבוע פלאנק','6.626×10⁻³⁴ J·s'],['f','תדירות הלייזר','Hz']])}
      <p><b>היפוך אוכלוסין</b>: תנאי הכרחי ללייזר — יותר אלקטרונים במצב עירור מאשר במצב יסוד. מושג על ידי "שאיבה" (pumping) — אנרגיה חיצונית. בלי היפוך אוכלוסין — בליעה שולטת, לא גבור.</p>
      <p><b>הרכיבים:</b> מקור שאיבה → מדיום פעיל (גז/גביש/סיב) → חלל תהודה (שני מראות) → קרן יוצאת דרך מראה דחוף.</p>
      <div class="enrich-card"><div class="enrich-title">הלייזר הראשון — 1960</div>
        <p>תיאודור מיימן (1960) — לייזר רובי (Cr:Al₂O₃), λ=694nm, פעפוע. אינשטיין (1917) ניבא תיאורטית. ניק בסוב וחבריו זכו בנובל 1964. מיימן לא זכה — מחלוקת.</p>
      </div>
      <div class="enrich-card"><div class="enrich-title">יישומים</div>
        <p>📦 ברקוד (650nm) | 💿 DVD (650nm) / Blu-ray (405nm) | 👁 לייזיק (193nm UV ArF) | ✂ חיתוך CO₂ (10.6μm) | 📡 סיבים אופטיים | 🔬 LiDAR / ניפוח גרעיני (NIF)</p>
      </div>
      <div class="theory-anim">${animCanvas('anim-laser-t',148,'לייזר — פליטה מעוררת')}</div>`,
  },
  sim:{type:'opt-laser',desc:'שנה את עוצמת השאיבה ובחר סוג לייזר. ראה את מדד היפוך האוכלוסין, מפל הפליטה המעוררת ויצירת הקרן.'},
  example:{title:'אנרגיית פוטון לייזר He-Ne',text:'לייזר He-Ne פולט λ=633 nm. חשב אנרגיית פוטון ב-J וב-eV.',
    steps:[
      {q:'E=hc/λ=(6.626×10⁻³⁴×3×10⁸)/(633×10⁻⁹)',a:'E=1.988×10⁻²⁵/6.33×10⁻⁷=3.14×10⁻¹⁹ J'},
      {q:'המר ל-eV: E÷1.6×10⁻¹⁹',a:'E≈1.96 eV'},
    ]},
  quiz:[
    {q:'מה מייחד לייזר לעומת נורה רגילה?',opts:['הספק גבוה יותר','פליטה מעוררת → קוהרנטי, חד-צבעי, מכוון','UV בלבד','אין הבדל, רק יעיל יותר'],correct:1,explain:'לייזר: כל הפוטונים זהים (אותה תדירות, פאזה, כיוון) — קוהרנטי. נורה: פליטה ספונטנית — פוטונים אקראיים לכל כיוון.',formula:''},
    {q:'היפוך אוכלוסין פירושו:',opts:['מספר שווה במצב יסוד ועירור','יותר אלקטרונים במצב עירור מאשר יסוד','אלקטרונים יורדים בלבד','ספיגה עולה על גבור'],correct:1,explain:'בלי היפוך אוכלוסין: בליעה > פליטה מעוררת → אין גבור. עם היפוך: פליטה מעוררת > בליעה → הגבור. זה הלב של הלייזר.',formula:''},
    {q:'ניתוח לייזיק עיניים משתמש ב-λ=193nm (UV). מדוע לא אור אדום?',opts:['אדום מסוכן יותר','UV קצר יותר → מוקד קטן יותר + פוטונים אנרגטיים חותכים רקמה מדויק','אדום לא עובד על רקמה','UV זול יותר'],correct:1,explain:'שתי סיבות: 1) מוקד λ קטן = נקודה קטנה יותר → דיוק. 2) E=hf — UV אנרגטי יותר, שובר קשרים מולקולריים מדויק בלי חום מקרי.',formula:'E=hf'},

  ],

    ]}
},


'opt-light.color-mixing':{
  theory:{
    title:'ערבוב צבעים — חיבורי וחיסורי',
    html:`
      <p>האור הלבן הוא <b>תערובת של כל צבעי הקשת</b>. ניוטון הראה ב-1666 שפריזמה מפרידה את הצבעים — וצירופם מחדש מחזיר את הלבן.</p>
      <div class="def-block"><div class="def-title">ערבוב חיבורי — אור (Additive)</div>
        <p>שלושה קרני אור צבעוניות על מסך שחור. הצבעים <b>מתחברים</b>:</p>
        <div class="info-grid">
          <div class="info-item"><div class="il">אדום + ירוק</div><div class="iv">= צהוב</div></div>
          <div class="info-item"><div class="il">ירוק + כחול</div><div class="iv">= ציאן</div></div>
          <div class="info-item"><div class="il">אדום + כחול</div><div class="iv">= ורוד (מגנטה)</div></div>
          <div class="info-item"><div class="il">אדום + ירוק + כחול</div><div class="iv">= לבן</div></div>
        </div>
        <p>שימוש: מסכי LCD/OLED, פרויקטורים, תאורת LED. כל פיקסל = R+G+B בעוצמות שונות.</p>
      </div>
      <div class="def-block"><div class="def-title">ערבוב חיסורי — פיגמנטים (Subtractive)</div>
        <p>צבעים <b>בולעים</b> חלק מהספקטרום ומשקפים את הנותר:</p>
        <div class="info-grid">
          <div class="info-item"><div class="il">ציאן + מגנטה</div><div class="iv">= כחול</div></div>
          <div class="info-item"><div class="il">מגנטה + צהוב</div><div class="iv">= אדום</div></div>
          <div class="info-item"><div class="il">ציאן + צהוב</div><div class="iv">= ירוק</div></div>
          <div class="info-item"><div class="il">C + M + Y</div><div class="iv">= שחור</div></div>
        </div>
        <p>שימוש: דפוס (CMYK), ציור, צבעי מים.</p>
      </div>
      <div class="enrich-card"><div class="enrich-title">מדוע השמיים כחולים?</div>
        <p>פיזור ריילי: אור כחול (λ קצר) מתפזר פי 4 יותר מאדום. בשקיעה, האור עובר מסלול ארוך — כחול כבר מפוזר → נראה כתום-אדום.</p>
      </div>
      <div class="theory-anim">${animCanvas('anim-color-mix-t',148,'ערבוב צבעים חיבורי')}</div>`,
  },
  sim:{type:'opt-color-mix',desc:'שנה עוצמות אדום/ירוק/כחול וראה ערבוב חיבורי. צהוב = R+G, ציאן = G+B, ורוד = R+B, לבן = R+G+B.'},
  example:{title:'ערבוב RGB',text:'עוצמות: R=100%, G=60%, B=0%. מה הצבע המעורב?',
    steps:[
      {q:'R=255, G=153, B=0 (RGB ערכי)',a:'כתום — ערבוב חיבורי של אדום מלא + ירוק חלקי'},
      {q:'בקוד hex: rgb(255,153,0)',a:'#FF9900 — כתום רווי. כמו בלוגו אמזון!'},
    ]},
  quiz:[
    {q:'אור ירוק + אור כחול = ?',opts:['צהוב','ורוד','ציאן','לבן'],correct:2,explain:'ערבוב חיבורי: G+B=ציאן (כחול-ירקרק). R+G=צהוב, R+B=מגנטה.',formula:''},
    {q:'מדוע עלה ירוק נראה ירוק?',opts:['פולט אור ירוק','בולע אדום+כחול, משקף ירוק','משקף את כל הצבעים חוץ מירוק','מכיל פיגמנט ניאון'],correct:1,explain:'ערבוב חיסורי: הכלורופיל בולע אדום וכחול (לפוטוסינתזה) ומשקף ירוק — לכן אנחנו רואים ירוק.',formula:''},
    {q:'בדפוס CMYK, מה ה-K?',opts:['כחול (Blue)','כרום (Chrome)','שחור (Key/Black)','קינמון'],correct:2,explain:'K=Key=שחור. נוסף כי C+M+Y בפועל לא נותן שחור מושלם, ושחור צבעי יקר. שחור K אחיד ועמוק.',formula:''},
    {q:'מסך טלוויזיה משתמש ב:',opts:['CMY','RGB חיבורי','פיגמנטים חיסוריים','קשת ניוטון'],correct:1,explain:'כל פיקסל: שלוש תתי-נקודות (R,G,B) מוארות. מרחוק — עין ממצעת ורואה צבע מעורב. זה ערבוב חיבורי.',formula:''},
  ],
  problem:{title:'ספקטרום RGB',text:'מסך מציג "צהוב טהור" (R=255, G=255, B=0). מהו אורך הגל של צהוב בספקטרום הרציף? מדוע המסך לא מציג אורך גל אחד?',
    steps:[
      {q:'צהוב ספקטרלי: λ≈570nm (בין אדום 700nm לירוק 530nm)',unit:'nm',answer:'570',tolerance:15,explain:'צהוב "אמיתי" הוא אורך גל יחיד ~570-590nm. פיזיקה של פיגמנט/לייזר.',hint:'הסתכל על ספקטרום הקשת — צהוב בין ירוק לאדום'},
      {q:'מסך: R=255+G=255 → מפעיל שני LED → עין מרגישה כ"צהוב" אך זה לא אורך גל אחד.',unit:'nm',answer:'570',tolerance:30,explain:'Metamerism (מטמריות): שתי גירויים שונים יוצרים אותה תחושת צבע. מסך יוצר "צהוב" מ-R+G אף שאין פוטון 570nm. העין רגישה ל-3 צבעים בסיס.',hint:'עין = 3 סוגי קונוסים (L,M,S)'},
    ]}
},

'opt-refraction.fiber-optics':{
  theory:{
    title:'סיבים אופטיים — אור בכבל',
    html:`
      <p>סיב אופטי מוליך אור על ידי <b>החזרה פנימית מלאה חוזרת</b>. הסיב הוא ליבה (core) בעלת ${ "n_1" } גבוה עטופה במעטה (cladding) עם ${"n_2 < n_1" }.</p>
      ${fBox('\\theta_c = \\arcsin\\!\\left(\\dfrac{n_2}{n_1}\\right)','זווית קריטית',[['n_1','מדד שבירה ליבה','≈1.48'],['n_2','מדד שבירה מעטה','≈1.46'],['\\theta_c','זווית קריטית','~80°']])}
      ${fBox('\\mathrm{NA} = \\sqrt{n_1^2 - n_2^2}','פתח מספרי (Numerical Aperture)',[['\\mathrm{NA}','פתח מספרי — כמה אור נכנס','טיפי 0.1-0.5']])}
      <p><b>כלל ה-TIR בסיב:</b> קרן הנכנסת לסיב תישאר בו כל עוד זוויתה הפנימית גדולה מ-θ_c. פעולה מצוינת גם בסיבים כפופים — האור עוקב אחרי הכיפוף.</p>
      <div class="def-block"><div class="def-title">יתרונות על חוט נחושת</div>
        <div class="info-grid">
          <div class="info-item"><div class="il">רוחב פס</div><div class="iv">THz — אינסוף ערוצים</div></div>
          <div class="info-item"><div class="il">הנחתה</div><div class="iv">0.2 dB/km (SiO₂ טהור)</div></div>
          <div class="info-item"><div class="il">הפרעות EM</div><div class="iv">אין — אור לא מושפע</div></div>
          <div class="info-item"><div class="il">משקל</div><div class="iv">קל מאוד</div></div>
        </div>
      </div>
      <div class="enrich-card"><div class="enrich-title">כבל תת-ימי — Atlantic Crossing</div>
        <p>כבל TAT-14 (2001): 3,000 km בין ארה"ב לאירופה. מעביר >10 Tb/s. מגבר אופטי כל 50-80km (EDFA — erbium-doped fiber amplifier). קצב שגיאות: 10⁻¹².</p>
      </div>
      <div class="theory-anim">${animCanvas('anim-fiber-t',148,'סיב אופטי — TIR רצוף')}</div>`,
  },
  sim:{type:'opt-fiber',desc:'שנה את מדד השבירה של הליבה וראה כיצד האור מוחזר מחזור אחרי מחזור בתוך הסיב. זיהוי זווית קריטית בזמן אמת.'},
  example:{title:'זווית קריטית בסיב',text:'ליבה n₁=1.50, מעטה n₂=1.46. מהי זווית הקריטית?',
    steps:[
      {q:'sinθ_c = n₂/n₁ = 1.46/1.50',a:'sinθ_c = 0.9733'},
      {q:'θ_c = arcsin(0.9733)',a:'θ_c ≈ 76.7°'},
      {q:'NA = √(n₁²-n₂²) = √(2.25-2.1316)',a:'NA = √0.1184 ≈ 0.344'},
    ]},
  quiz:[
    {q:'סיב אופטי מוליך אור בגלל:',opts:['השתקפות חיצונית','הפרעה בנייה','החזרה פנימית מלאה','עקיפה'],correct:2,explain:'TIR: האור פוגע בממשק ליבה-מעטה בזווית גדולה מהקריטית ומוחזר 100% ללא הפסד. כל קרן עושה מאות אלפי זינוקים בכל ק"מ.',formula:'θ_c=arcsin(n₂/n₁)'},
    {q:'מה קורה כש-n₁ קטן יותר (ליבה פחות צפופה)?',opts:['זווית קריטית גדלה','זווית קריטית קטנה','NA גדל','אין שינוי'],correct:0,explain:'θ_c=arcsin(n₂/n₁): כש-n₁ קטן, n₂/n₁ גדל → arcsin גדל → θ_c גדל. ה"חלון" TIR מצטמצם → פחות קרניים מוחזרות.',formula:'θ_c=arcsin(n₂/n₁)'},
    {q:'NA (פתח מספרי) קובע:',opts:['מהירות הפצה','כמה אור נאסף לסיב','צבע האור','חוזק הסיב'],correct:1,explain:'NA=sin(θ_קבלה_מקס)=√(n₁²-n₂²). ה-NA גדול → הסיב מקבל טווח זוויות גדול יותר של קרניים נכנסות.',formula:'NA=√(n₁²-n₂²)'},
    {q:'למה סיבים אופטיים עדיפים על נחושת לאינטרנט?',opts:['זולים יותר','גמישים יותר','רוחב פס גבוה בהרבה + הנחתה נמוכה','מוליכים חשמל'],correct:2,explain:'SiO₂ טהור: הנחתה 0.2 dB/km לעומת ~20 dB/km בנחושת. THz bandwidth לעומת GHz. אין רעש EM. הסיבה לאינטרנט מודרני.',formula:''},
  ],
  problem:{title:'עיצוב סיב',text:'ליבה n₁=1.62, מעטה n₂=1.52. (א) חשב θ_c. (ב) מה מקסימום זווית כניסה לאור ייקלט?',
    steps:[
      {q:'sinθ_c = n₂/n₁ = 1.52/1.62',unit:'',answer:'0.938',tolerance:0.005,explain:'sinθ_c = 0.9383 → θ_c = arcsin(0.9383) ≈ 69.6°. כל קרן הפוגעת בזווית גדולה מזו תוחזר.',hint:'sinθ_c = n₂/n₁'},
      {q:'NA = √(1.62²-1.52²) = √(2.6244-2.3104)',unit:'',answer:'0.56',tolerance:0.03,explain:'NA = √0.314 ≈ 0.560. זווית קבלה מקסימלית: arcsin(0.560) ≈ 34°.',hint:'NA=√(n₁²-n₂²)'},
    ]}
},

'opt-lenses.telescope':{
  theory:{
    title:'מכשירים אופטיים — טלסקופ ומיקרוסקופ',
    html:`
      <p>שני המכשירים משתמשים ב<b>שתי עדשות</b>: עדשה אובייקטיב (objective) יוצרת תמונה ביניים, ועדשת עין (eyepiece) מגדילה אותה.</p>
      <div class="def-block"><div class="def-title">טלסקופ אסטרונומי</div>
        ${fBox('M_{\\text{tel}} = -\\dfrac{f_o}{f_e}','הגדלה טלסקופ',[['f_o','מוקד אובייקטיב','ארוך, 100-2000mm'],['f_e','מוקד עדשת עין','קצר, 10-40mm'],['M','הגדלה זוויתית','']])}
        <p>תמונה: הפוכה (M שלילי), מוגדלת. הפרדה זוויתית: θ_min = 1.22λ/D (קריטריון ריילי).</p>
      </div>
      <div class="def-block"><div class="def-title">מיקרוסקופ</div>
        ${fBox('M_{\\text{mic}} = \\dfrac{d}{f_o} \\cdot \\dfrac{25\\,\\mathrm{cm}}{f_e}','הגדלה מיקרוסקופ',[['d','אורך הצינור (tube length)','≈160mm'],['f_o','מוקד אובייקטיב','קצר, 2-40mm'],['f_e','מוקד עדשת עין','10-25mm']])}
        <p>דרישה: עצם ממש מחוץ למוקד האובייקטיב → תמונה ממשית מוגדלת → הגדלה נוספת ע"י עדשת עין.</p>
      </div>
      <div class="enrich-card"><div class="enrich-title">גלילאו ורשת הגלקסיה</div>

function getPS(c,s){const k=`${c}.${s}`;if(!state.problemState[k])state.problemState[k]={idx:0,inputs:[],solved:[],hints:[],feedback:[],done:false,attempts:0};return state.problemState[k];}
