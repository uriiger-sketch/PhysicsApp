    friction:{on:false, label:'חיכוך (f)',       color:'#f87171', formula:'f = μN = '+(mu*m*g).toFixed(1)+'N', dir:'left'},
    tension: {on:false, label:'מתיחות (T)',      color:'#22d3ee', formula:'T = ?', dir:'upper-right'},
    spring:  {on:false, label:'כוח אלסטי (Fs)',   color:'#fb923c', formula:'Fs = kx', dir:'upper-left'},
  };
  var forceKeys=Object.keys(forces);

  // Applied force slider
  function getF(){var e=document.getElementById('inp-ft-F'); return e?parseFloat(e.value):20;}
  function getX(){var e=document.getElementById('inp-ft-x'); return e?parseFloat(e.value):0.08;}

  // Block
  const BLK_CX=W*0.50, BLK_CY=H*0.50, BLK_S=56;
  const FLOOR_Y=BLK_CY+BLK_S/2;

  // Toggle buttons (drawn on canvas, clickable)
  var btnH=26, btnW=Math.min((W-20)/3-4, 110);
  var btnsPerRow=3;
  var btnStartY=H-btnsPerRow*btnH-8;

  function getBtnRect(i){
    var row=Math.floor(i/btnsPerRow), col=i%btnsPerRow;
    var totalW=btnsPerRow*(btnW+4)-4;
    var startX=(W-totalW)/2;
    return {x:startX+col*(btnW+4), y:btnStartY+row*(btnH+3), w:btnW, h:btnH};
  }

  function onClick(e){
    e.preventDefault();
    var r=canvas.getBoundingClientRect();
    var scl=(canvas.width/dpr)/r.width;
    var cx=((e.touches?e.touches[0].clientX:e.clientX)-r.left)*scl;
    var cy=((e.touches?e.touches[0].clientY:e.clientY)-r.top)*scl;
    forceKeys.forEach(function(k2,i){
      var b=getBtnRect(i);
      if(cx>=b.x&&cx<=b.x+b.w&&cy>=b.y&&cy<=b.y+b.h){
        // gravity and normal always on together
        if(k2==='gravity'||k2==='normal'){
          forces.gravity.on=!forces.gravity.on;
          forces.normal.on=forces.gravity.on;
        } else {
          forces[k2].on=!forces[k2].on;
        }
      }
    });
  }
  canvas.addEventListener('click',onClick);
  canvas.addEventListener('touchend',function(e){onClick(e);e.preventDefault();},{passive:false});

  function draw(ts){
    if(_simStop[id])return;
    if(!pT)pT=ts; const dt=Math.min((ts-pT)/1000,.04); pT=ts;
    t+=dt;
    var F_app=getF(), x_spring=getX();

    // Update formulas dynamically
    forces.applied.formula='F = '+F_app.toFixed(0)+' N';
    forces.spring.formula='Fs = k·x = '+k+'\u00d7'+x_spring.toFixed(2)+' = '+(k*x_spring).toFixed(1)+' N';
    forces.tension.formula='T = m·g = '+( m*g).toFixed(0)+' N (תלוי)';

    simBg(ctx,W,H);

    // ── Floor ─────────────────────────────────────────────
    ctx.save(); ctx.fillStyle='#0f2035'; ctx.fillRect(W*0.12,FLOOR_Y,W*0.76,12); ctx.restore();
    ctx.save(); ctx.strokeStyle='#2d5275'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(W*0.12,FLOOR_Y); ctx.lineTo(W*0.88,FLOOR_Y); ctx.stroke(); ctx.restore();
    for(var xi=W*0.12;xi<W*0.88;xi+=16){
      ctx.save(); ctx.strokeStyle='rgba(30,58,82,.5)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(xi,FLOOR_Y); ctx.lineTo(xi-8,FLOOR_Y+8); ctx.stroke(); ctx.restore();
    }

    // Wall (for tension rope)
    if(forces.tension.on){
      ctx.save(); ctx.fillStyle='#1e3a52'; ctx.fillRect(W*0.83,FLOOR_Y-80,14,80); ctx.restore();
      // Rope to block
      ctx.save(); ctx.strokeStyle='#22d3ee'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(W*0.83,FLOOR_Y-40); ctx.lineTo(BLK_CX+BLK_S/2+2,BLK_CY); ctx.stroke(); ctx.restore();
    }
    // Wall (for spring)
    if(forces.spring.on){
      ctx.save(); ctx.fillStyle='#1e3a52'; ctx.fillRect(W*0.10,FLOOR_Y-70,14,70); ctx.restore();
      // Spring to block
      var sx1=W*0.12+14, sx2=BLK_CX-BLK_S/2-2;
      var sy=BLK_CY;
      var coils=8, coilW=10;
      ctx.save(); ctx.strokeStyle='#fb923c'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(sx1,sy);
      for(var ci=0;ci<coils;ci++){
        var fx=(sx1+(sx2-sx1)*(ci+0.5)/coils);
        var fx2=(sx1+(sx2-sx1)*(ci+1)/coils);
        ctx.lineTo(fx,sy+(ci%2===0?coilW:-coilW));
        ctx.lineTo(fx2,sy);
      }
      ctx.stroke(); ctx.restore();
    }

    // ── Block ─────────────────────────────────────────────
    var bGrad=ctx.createLinearGradient(BLK_CX-BLK_S/2,BLK_CY-BLK_S/2,BLK_CX-BLK_S/2,BLK_CY+BLK_S/2);
    bGrad.addColorStop(0,'rgba(99,102,241,.85)'); bGrad.addColorStop(1,'rgba(55,48,163,.6)');
    ctx.save(); ctx.fillStyle=bGrad; ctx.strokeStyle='#818cf8'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.roundRect(BLK_CX-BLK_S/2,BLK_CY-BLK_S/2,BLK_S,BLK_S,5); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'m='+m+'kg',BLK_CX,BLK_CY+4,'#e0e7ff',9.5,undefined,true);

    // ── Force arrows ──────────────────────────────────────
    var arScale=2.0;
    var activeForces=[];

    if(forces.gravity.on){
      var len=Math.min(60,m*g*arScale);
      simArrow(ctx,BLK_CX-8,BLK_CY,BLK_CX-8,BLK_CY+len,'#fbbf24',3,11);
      simText(ctx,'W',BLK_CX-8-14,BLK_CY+len/2,'#fbbf24',10,undefined,true);
      activeForces.push({name:'W',val:m*g,col:'#fbbf24'});
    }
    if(forces.normal.on){
      var len2=Math.min(60,m*g*arScale);
      simArrow(ctx,BLK_CX+8,BLK_CY,BLK_CX+8,BLK_CY-len2,'#a78bfa',3,11);
      simText(ctx,'N',BLK_CX+8+14,BLK_CY-len2/2,'#a78bfa',10,undefined,true);
      activeForces.push({name:'N',val:m*g,col:'#a78bfa'});
    }
    if(forces.applied.on){
      var Fa=F_app;
      var len3=Math.min(75,Fa*arScale);
      simArrow(ctx,BLK_CX-BLK_S/2-4,BLK_CY-8,BLK_CX-BLK_S/2-4-len3,BLK_CY-8,'#34d399',3,11);
      simText(ctx,'F',BLK_CX-BLK_S/2-len3/2-4,BLK_CY-20,'#34d399',10,undefined,true);
      activeForces.push({name:'F',val:Fa,col:'#34d399'});
    }
    if(forces.friction.on){
      var ff=mu*m*g;
      var len4=Math.min(65,ff*arScale);
      simArrow(ctx,BLK_CX+BLK_S/2+4,BLK_CY-8,BLK_CX+BLK_S/2+4+len4,BLK_CY-8,'#f87171',3,11);
      simText(ctx,'f',BLK_CX+BLK_S/2+len4/2+4,BLK_CY-20,'#f87171',10,undefined,true);
      activeForces.push({name:'f',val:ff,col:'#f87171'});
    }
    if(forces.tension.on){
      var lt=Math.min(65,m*g*arScale);
      var tx2=BLK_CX+BLK_S/2+4+lt*Math.cos(-0.4);
      var ty2=BLK_CY-lt*Math.sin(-0.4);
      simArrow(ctx,BLK_CX+BLK_S/2+4,BLK_CY,tx2,ty2,'#22d3ee',3,11);
      simText(ctx,'T',tx2+8,ty2,'#22d3ee',10,'left');
      activeForces.push({name:'T',val:m*g,col:'#22d3ee'});
    }
    if(forces.spring.on){
      var fs=k*x_spring;
      var ls=Math.min(65,fs*arScale*2);
      simArrow(ctx,BLK_CX-BLK_S/2-4,BLK_CY+8,BLK_CX-BLK_S/2-4+ls,BLK_CY+8,'#fb923c',3,11);
      simText(ctx,'Fs',BLK_CX-BLK_S/2+ls/2-4,BLK_CY+20,'#fb923c',10,undefined,true);
      activeForces.push({name:'Fs',val:fs,col:'#fb923c'});
    }

    // ── Toggle buttons ─────────────────────────────────────
    forceKeys.forEach(function(fk2,i){
      var b=getBtnRect(i);
      var fo=forces[fk2];
      ctx.save();
      ctx.fillStyle=fo.on?fo.color+'33':'rgba(15,32,53,.7)';
      ctx.strokeStyle=fo.on?fo.color:'rgba(30,58,82,.6)';
      ctx.lineWidth=fo.on?2:1;
      ctx.beginPath(); ctx.roundRect(b.x,b.y,b.w,b.h,4); ctx.fill(); ctx.stroke(); ctx.restore();
      simText(ctx,(fo.on?'✓ ':'○ ')+fo.label,b.x+b.w/2,b.y+b.h/2+4,fo.on?fo.color:'#475569',7.5,undefined,true);
    });

    // ── Active forces panel ────────────────────────────────
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.9)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(8,6,W-16,50,6); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'סוגי כוחות — לחץ על הלחצנים להפעיל/כבות',W/2,18,'#22d3ee',10,undefined,true);
    if(activeForces.length>0){
      var fStr=activeForces.map(function(af){return af.name+'='+af.val.toFixed(0)+'N';}).join(' | ');
      simText(ctx,fStr,W/2,34,'#94a3b8',8.5,undefined,true);
      // Net force
      var netFx=0,netFy=0;
      activeForces.forEach(function(af){
        if(af.name==='W')netFy+=m*g;
        else if(af.name==='N')netFy-=m*g;
        else if(af.name==='F')netFx-=af.val;
        else if(af.name==='f')netFx+=af.val;
        else if(af.name==='T')netFx+=af.val*Math.cos(0.4);
        else if(af.name==='Fs')netFx-=af.val;
      });
      simText(ctx,'ΣF: x='+netFx.toFixed(1)+'N  y='+netFy.toFixed(1)+'N',W/2,47,'#fbbf24',9,undefined,true);
    } else {
      simText(ctx,'לחץ לחצן להציג כוח',W/2,38,'#64748b',9,undefined,true);
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}

function simGravityForce(canvas){
  // SECTION: forces2.gravity-force — כוח הכובד
  // PEDAGOGY: Same person/object on 6 different planets. W=mg changes because g changes,
  // not because mass changes. Student sets mass, sees W vary by planet. Spring scale shown.
  // Key insight: mass is constant, weight depends on gravitational field.
  const H=490; const {ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;
  let pT=null, t=0;
  var scaleReadings={};

  var PLANETS=[
    {name:'מרקורי',   g:3.7,  col:'#94a3b8', emoji:'⚫', bg:'#1a1412'},
    {name:'ונוס',     g:8.87, col:'#d97706', emoji:'🟡', bg:'#1a1208'},
    {name:'כדה"א',   g:9.81, col:'#2563eb', emoji:'🌍', bg:'#071428'},
    {name:'מאדים',   g:3.72, col:'#ef4444', emoji:'🔴', bg:'#1a0808'},
    {name:'צדק',     g:24.8, col:'#f59e0b', emoji:'🟠', bg:'#1a1008'},
    {name:'ירח',     g:1.62, col:'#e2e8f0', emoji:'🌕', bg:'#10101a'},
  ];

  function getMass(){var e=document.getElementById('inp-gf-m'); return e?parseFloat(e.value):70;}

  var colW=Math.floor(W/PLANETS.length);

  function draw(ts){
    if(_simStop[id])return;
    if(!pT)pT=ts; var dt=Math.min((ts-pT)/1000,.04); pT=ts;
    t+=dt;
    var m=getMass();

    simBg(ctx,W,H);

    // Top banner
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.92)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(8,6,W-16,38,6); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'כוח הכובד: W = m × g  (מסה = '+m+' ק"ג)',W/2,20,'#22d3ee',11,undefined,true);
    simText(ctx,'המסה קבועה — המשקל משתנה עם כוח הכבידה!',W/2,34,'#94a3b8',9,undefined,true);

    PLANETS.forEach(function(pl,i){
      var W_force=m*pl.g;
      var cx=colW*i+colW/2;
      var PY=50;

      // Animate scale reading
      var target=W_force;
      if(!scaleReadings[pl.name]) scaleReadings[pl.name]=0;
      scaleReadings[pl.name]+=(target-scaleReadings[pl.name])*Math.min(1,dt*3);
      var reading=scaleReadings[pl.name];

      // Planet background strip
      ctx.save(); ctx.fillStyle=pl.bg; ctx.fillRect(colW*i,PY,colW,H-PY-4); ctx.restore();
      // Column separator
      if(i>0){
        ctx.save(); ctx.strokeStyle='rgba(30,58,82,.4)'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(colW*i,PY); ctx.lineTo(colW*i,H-4); ctx.stroke(); ctx.restore();
      }
      // Planet header
      ctx.save(); ctx.fillStyle=pl.col+'22'; ctx.fillRect(colW*i,PY,colW,22); ctx.restore();
      simText(ctx,pl.emoji+' '+pl.name,cx,PY+12,pl.col,8,undefined,true);
      simText(ctx,'g='+pl.g+' m/s²',cx,PY+24,'#64748b',7.5,undefined,true);

      // Spring scale
      var scaleCY=PY+100;
      var scaleW2=Math.min(colW-8,28), scaleH2=72;
      var maxF=Math.max(1200,PLANETS.reduce(function(acc,p){return Math.max(acc,m*p.g);},0));
      var fillH=(Math.min(reading,maxF)/maxF)*scaleH2*0.9;
      // Scale body
      ctx.save(); ctx.fillStyle='rgba(15,28,48,.85)'; ctx.strokeStyle=pl.col+'55'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.roundRect(cx-scaleW2/2,scaleCY-scaleH2/2,scaleW2,scaleH2,4); ctx.fill(); ctx.stroke(); ctx.restore();
      // Fill bar
      ctx.save(); ctx.fillStyle=pl.col+'66';
      ctx.beginPath(); ctx.roundRect(cx-scaleW2/2+2,scaleCY+scaleH2/2-4-fillH,scaleW2-4,fillH,2); ctx.fill(); ctx.restore();
      // Needle
      var needleY=scaleCY+scaleH2/2-4-fillH;
      ctx.save(); ctx.strokeStyle=pl.col; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(cx-scaleW2/2+2,needleY); ctx.lineTo(cx+scaleW2/2-2,needleY); ctx.stroke(); ctx.restore();
      // Ceiling hook
      ctx.save(); ctx.fillStyle='#1e3a52'; ctx.fillRect(cx-12,PY+46,24,8); ctx.restore();
      // Thin wire
      ctx.save(); ctx.strokeStyle='#64748b'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(cx,PY+54); ctx.lineTo(cx,scaleCY-scaleH2/2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx,scaleCY+scaleH2/2); ctx.lineTo(cx,scaleCY+scaleH2/2+12); ctx.stroke(); ctx.restore();

      // Person figure (simple stick figure, scale with g)
      var figY=scaleCY+scaleH2/2+12;
      var headR=8;
      var squeeze=Math.min(1.5,pl.g/9.81); // taller/flatter with gravity
      ctx.save(); ctx.strokeStyle=pl.col; ctx.lineWidth=2;
      // Head
      ctx.beginPath(); ctx.arc(cx,figY+headR,headR,0,Math.PI*2); ctx.stroke();
      // Body (squished under high G)
      var bodyH=18/Math.max(0.5,Math.sqrt(squeeze));
      ctx.beginPath(); ctx.moveTo(cx,figY+headR*2); ctx.lineTo(cx,figY+headR*2+bodyH); ctx.stroke();
      // Legs
      ctx.beginPath(); ctx.moveTo(cx,figY+headR*2+bodyH);
      ctx.lineTo(cx-8,figY+headR*2+bodyH+14/Math.max(0.5,Math.sqrt(squeeze)));
      ctx.moveTo(cx,figY+headR*2+bodyH);
      ctx.lineTo(cx+8,figY+headR*2+bodyH+14/Math.max(0.5,Math.sqrt(squeeze)));
      ctx.stroke();
      // Arms (droop under high G)
      var armDrop=Math.min(8,pl.g*0.3);
      ctx.beginPath();
      ctx.moveTo(cx-8,figY+headR*2+6); ctx.lineTo(cx-14,figY+headR*2+6+armDrop);
      ctx.moveTo(cx+8,figY+headR*2+6); ctx.lineTo(cx+14,figY+headR*2+6+armDrop);
      ctx.stroke(); ctx.restore();

      // Weight value (bold, colored)
      simText(ctx,W_force.toFixed(0)+' N',cx,H-46,pl.col,10,undefined,true);
      simText(ctx,'W=m·g',cx,H-33,'#64748b',7.5,undefined,true);
    });

    // Earth highlight pulse
    var earthIdx=2, ex=colW*earthIdx+colW/2;
    if(Math.floor(t*1)%3===0){
      ctx.save(); ctx.strokeStyle='rgba(37,99,235,.3)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.roundRect(colW*earthIdx+1,52,colW-2,H-60,3); ctx.stroke(); ctx.restore();
    }

    // Mass constant reminder
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.88)'; ctx.strokeStyle='rgba(34,211,153,.3)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(8,H-24,W-16,20,5); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'מסה (m='+m+' kg) — קבועה בכל מקום! | משקל (W=mg) — משתנה עם g',W/2,H-14,'#34d399',9,undefined,true);

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}

function simStaticFriction(canvas){
  // SECTION: forces2.static-friction — חיכוך סטטי
  // PEDAGOGY: Gradually increase applied force with a slider. Student watches friction force
  // MATCH the applied force perfectly until threshold. At breakaway, both forces shown.
  // The live F vs fs graph reveals the key concept: static friction is NOT constant.
  const H=490; const {ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;
  const g=9.8;
  let pT=null, t=0;
  var mu_s=0.55, m=5, F=0;
  var vel=0, pos=null, state='static';
  var graphData=[]; // {F_applied, fs_actual}
  var FLOOR_Y=H*0.52;

  function getF(){var e=document.getElementById('inp-sft-F'); return e?parseFloat(e.value):F;}
  function getMu(){var e=document.getElementById('inp-sft-mu'); return e?parseFloat(e.value):mu_s;}
  function getM(){var e=document.getElementById('inp-sft-mass'); return e?parseFloat(e.value):m;}

  var resetBtn=document.getElementById('btn-sft-reset');
  if(resetBtn)resetBtn.addEventListener('click',function(){vel=0;pos=null;state='static';graphData=[];
    var fe=document.getElementById('inp-sft-F');if(fe){fe.value=0;var rv=document.getElementById('rv-sft-F');if(rv)rv.textContent='0';}});

  function draw(ts){
    if(_simStop[id])return;
    if(!pT)pT=ts; var dt=Math.min((ts-pT)/1000,.04); pT=ts;
    t+=dt;
    F=getF(); mu_s=getMu(); m=getM();
    if(pos===null)pos=W*0.40;

    var N=m*g, fs_max=mu_s*N, mu_k=mu_s*0.72, fk=mu_k*N;

    if(state==='static'){
      if(F>fs_max){state='sliding';vel=0;}
    } else {
      vel=Math.max(0,vel+(F-fk)/m*dt);
      if(vel<0.01&&F<=fk){vel=0;state='static';}
      pos+=vel*dt*60;
      if(pos>W-72){pos=W-72;vel=0;state='static';}
    }
    var fs_actual=state==='static'?Math.min(F,fs_max):(fk*Math.sign(vel||1));
    graphData.push({x:F,y:fs_actual});
    if(graphData.length>300)graphData.shift();

    simBg(ctx,W,H);

    // ── FLOOR ─────────────────────────────────────────────
    ctx.save(); ctx.fillStyle='#0f2035'; ctx.fillRect(0,FLOOR_Y,W,H*0.30); ctx.restore();
    ctx.save(); ctx.strokeStyle='#2d5275'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,FLOOR_Y); ctx.lineTo(W,FLOOR_Y); ctx.stroke(); ctx.restore();
    // Roughness texture
    for(var xi=0;xi<W;xi+=14){
      ctx.save(); ctx.strokeStyle='rgba(100,116,139,'+(mu_s*0.5)+')'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(xi,FLOOR_Y); ctx.lineTo(xi-7,FLOOR_Y+7); ctx.stroke(); ctx.restore();
    }
    simText(ctx,'μs = '+mu_s.toFixed(2)+' | μk = '+(mu_s*0.72).toFixed(2),W/2,FLOOR_Y+14,'#2d5275',8,undefined,true);

    // ── BLOCK ──────────────────────────────────────────────
    var bW=62, bH=52;
    var bX=pos-bW/2, bY=FLOOR_Y-bH;
    var isSliding=(state==='sliding');
    var bCol=isSliding?'#ef4444':'#3b82f6';
    var bG=ctx.createLinearGradient(bX,bY,bX,bY+bH);
    bG.addColorStop(0,bCol+'cc'); bG.addColorStop(1,bCol+'55');
    ctx.save(); ctx.shadowColor=bCol; ctx.shadowBlur=isSliding?16:0;
    ctx.fillStyle=bG; ctx.strokeStyle=bCol; ctx.lineWidth=2;
    ctx.beginPath(); ctx.roundRect(bX,bY,bW,bH,5); ctx.fill(); ctx.stroke(); ctx.shadowBlur=0; ctx.restore();
    simText(ctx,m.toFixed(0)+' kg',pos,bY+bH/2+3,isSliding?'#fca5a5':'#bfdbfe',10,undefined,true);
    simText(ctx,isSliding?'⚡ מחליק':'✓ נייח',pos,bY+bH/2+16,isSliding?'#f87171':'#34d399',8.5,undefined,true);

    // Heat sparks when sliding
    if(isSliding&&vel>0.1){
      for(var pi=0;pi<5;pi++){
        var px2=pos+(-bW/2+Math.random()*bW);
        ctx.save(); ctx.fillStyle='rgba(251,191,36,'+( 0.4+Math.random()*0.5)+')';
        ctx.beginPath(); ctx.arc(px2,FLOOR_Y-1+Math.random()*4,1+Math.random()*2,0,Math.PI*2); ctx.fill(); ctx.restore();
      }
    }

    // Applied force arrow
    if(F>0.3){
      var arLen=Math.min(80,F*0.8);
      simArrow(ctx,bX-4-arLen,bY+bH/2,bX-4,bY+bH/2,'#fbbf24',3,12);
      simText(ctx,'F='+F.toFixed(0)+'N',bX-arLen/2-4,bY+bH/2-13,'#fbbf24',9.5,undefined,true);
    }
    // Friction force arrow
    if(fs_actual>0.3){
      var fLen=Math.min(70,fs_actual*0.8);
      var fsCol=isSliding?'#f87171':'#34d399';
      var fsName=isSliding?'fk':'fs';
      simArrow(ctx,bX+bW+4,bY+bH/2,bX+bW+4-fLen,bY+bH/2,fsCol,3,12);
      // Actually friction opposes motion (opposes F which goes left), so goes right... wait
      // F pushes to the LEFT (negative x), friction opposes → friction points RIGHT (positive x)
      // Arrow: right-pointing from right edge
      simText(ctx,fsName+'='+fs_actual.toFixed(0)+'N',bX+bW+fLen/2+4,bY+bH/2-13,fsCol,9,undefined,true);
    }
    // N up, W down
    simArrow(ctx,pos,bY,pos,bY-28,'#a78bfa',2,8);
    simText(ctx,'N='+N.toFixed(0),pos+4,bY-14,'#a78bfa',7.5,'left');
    simArrow(ctx,pos,bY+bH,pos,bY+bH+28,'#fbbf24',2,8);

    // ── TOP PANEL ──────────────────────────────────────────
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.92)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(8,6,W-16,54,6); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'חיכוך סטטי: f_s ≤ μs × N',W/2,19,'#22d3ee',11,undefined,true);
    simText(ctx,'f_s(max) = μs × N = '+mu_s.toFixed(2)+'×'+N.toFixed(0)+' = '+fs_max.toFixed(1)+' N',W/2,33,'#a78bfa',9.5,undefined,true);
    // Progress bar F vs threshold
    var barX=40, barW2=W-80, barY2=44;
    ctx.save(); ctx.fillStyle='#0f2035'; ctx.strokeStyle='#1e3a52'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.roundRect(barX,barY2,barW2,12,3); ctx.fill(); ctx.stroke(); ctx.restore();
    // Max marker
    var maxPx=barX+(fs_max/(fs_max*1.4))*barW2;
    ctx.save(); ctx.strokeStyle='rgba(239,68,68,.7)'; ctx.lineWidth=2; ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.moveTo(maxPx,barY2-4); ctx.lineTo(maxPx,barY2+16); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
    simText(ctx,'fs_max',maxPx,barY2-6,'#ef4444',7.5,undefined,true);
    // F bar
    var Fpx=Math.min(barW2, (F/(fs_max*1.4))*barW2);
    ctx.save(); ctx.fillStyle=isSliding?'rgba(239,68,68,.8)':'rgba(251,191,36,.8)';
    ctx.beginPath(); ctx.roundRect(barX,barY2,Fpx,12,3); ctx.fill(); ctx.restore();
    // fs bar (thinner, on top)
    var fspx=Math.min(barW2, (fs_actual/(fs_max*1.4))*barW2);
    ctx.save(); ctx.fillStyle=isSliding?'rgba(239,68,68,.5)':'rgba(34,211,153,.7)';
    ctx.beginPath(); ctx.roundRect(barX,barY2+4,fspx,5,2); ctx.fill(); ctx.restore();

    // ── F(x) GRAPH ─────────────────────────────────────────
    var GX=8, GY=FLOOR_Y+H*0.30+6, GW=W-16, GH=H-GY-8;
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.88)'; ctx.strokeStyle='#1e3a52'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.roundRect(GX,GY,GW,GH,4); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'f_s כפונקציה של F המופעל',GX+GW/2,GY+9,'#64748b',8,undefined,true);
    simText(ctx,'F_מופעל (N) →',GX+GW-6,GY+GH-4,'#64748b',7,'right');
    simText(ctx,'f_s (N) ↑',gAX+4,gAY-gAH+4,'#3b82f6',7,'left');
    // Axes
    var gAX=GX+8, gAY=GY+GH-18, gAW=GW-16, gAH=GH-22;
    ctx.save(); ctx.strokeStyle='#1e3a52'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(gAX,gAY-gAH); ctx.lineTo(gAX,gAY); ctx.lineTo(gAX+gAW,gAY); ctx.stroke(); ctx.restore();
    // Max F scale
    var fScaleMax=fs_max*1.6;
    // Theoretical line: f=F up to max, then flat (kinetic)
    ctx.save(); ctx.strokeStyle='rgba(100,116,139,.3)'; ctx.lineWidth=1; ctx.setLineDash([3,4]);
    // y=x slope until fs_max
    var bp=fs_max/fScaleMax;
    ctx.beginPath();
    ctx.moveTo(gAX,gAY);
    ctx.lineTo(gAX+bp*gAW,gAY-bp*gAH);
    ctx.lineTo(gAX+gAW,gAY-bp*gAH*(mu_s*0.72/mu_s));
    ctx.stroke(); ctx.setLineDash([]); ctx.restore();
    // Data
    if(graphData.length>2){
      ctx.save(); ctx.strokeStyle='#22d3ee'; ctx.lineWidth=2;
      ctx.beginPath();
      graphData.forEach(function(dp,i){
        var px2=gAX+(dp.x/fScaleMax)*gAW;
        var py2=gAY-(dp.y/fScaleMax)*gAH;
        px2=Math.max(gAX,Math.min(gAX+gAW,px2));
        py2=Math.max(gAY-gAH,Math.min(gAY,py2));
        i===0?ctx.moveTo(px2,py2):ctx.lineTo(px2,py2);
      });
      ctx.stroke(); ctx.restore();
    }
    // Current point
    var cpx3=gAX+(F/fScaleMax)*gAW;
    var cpy3=gAY-(fs_actual/fScaleMax)*gAH;
    cpx3=Math.max(gAX,Math.min(gAX+gAW,cpx3));
    cpy3=Math.max(gAY-gAH,Math.min(gAY,cpy3));
    ctx.save(); ctx.fillStyle=isSliding?'#f87171':'#34d399'; ctx.strokeStyle='#030c15'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(cpx3,cpy3,5,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.restore();
    // fs_max dashed horizontal
    var fmY=gAY-(fs_max/fScaleMax)*gAH;
    ctx.save(); ctx.strokeStyle='rgba(239,68,68,.5)'; ctx.lineWidth=1; ctx.setLineDash([3,4]);
    ctx.beginPath(); ctx.moveTo(gAX,fmY); ctx.lineTo(gAX+gAW,fmY); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
    simText(ctx,'fs_max='+fs_max.toFixed(0)+'N',gAX+gAW-2,fmY-4,'#ef4444',7.5,'right');

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}

function simKineticFriction(canvas){
  // SECTION: forces2.kinetic-friction — חיכוך קינטי
  // PEDAGOGY: Show that fk = μk*N is CONSTANT regardless of speed.
  // Student launches block, watches constant deceleration, sees v(t) is perfectly linear.
  // Compare two blocks with different mu_k — steeper slope = more friction.
  // Key: a = -μk*g = constant. Stopping distance d = v0²/(2μk*g).
  const H=480; const {ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;
  const g=9.8;
  let pT=null, t=0;
  var mu_k=0.35, m=4, v0=8;
  var vel=0, pos=80, dist=0;
  var running=false, launched=false;
  var vData=[], aData=[], tData=[], tClock=0;
  var FLOOR_Y=H*0.45;

  function getMu(){var e=document.getElementById('inp-kf-mu'); return e?parseFloat(e.value):mu_k;}
  function getM(){var e=document.getElementById('inp-kf-mass'); return e?parseFloat(e.value):m;}
  function getV0(){var e=document.getElementById('inp-kf-v0'); return e?parseFloat(e.value):v0;}

  var launchBtn=document.getElementById('btn-kf-launch');
  var resetBtn=document.getElementById('btn-kf-reset');
  function launch(){mu_k=getMu();m=getM();v0=getV0();vel=v0;pos=80;dist=0;running=true;launched=true;vData=[];aData=[];tData=[];tClock=0;}
  function reset2(){vel=0;pos=80;dist=0;running=false;launched=false;vData=[];aData=[];tData=[];tClock=0;}
  if(launchBtn)launchBtn.addEventListener('click',launch);
  if(resetBtn)resetBtn.addEventListener('click',reset2);

  function draw(ts){
    if(_simStop[id])return;
    if(!pT)pT=ts; var dt=Math.min((ts-pT)/1000,.04); pT=ts;
    t+=dt;
    mu_k=getMu(); m=getM(); v0=getV0();
    var N=m*g, fk=mu_k*N;
    var a=-mu_k*g;
    var dTheory=v0*v0/(2*mu_k*g);

    if(running){
      tClock+=dt;
      vel+=a*dt; if(vel<0){vel=0;running=false;}
      var dx=vel*dt;
      dist+=dx; pos+=dx*55;
      if(pos>W-72){pos=W-72;vel=0;running=false;}
      vData.push(vel); aData.push(running?a:0); tData.push(tClock);
      if(vData.length>200)vData.shift();
      if(aData.length>200)aData.shift();
      if(tData.length>200)tData.shift();
    }

    simBg(ctx,W,H);

    // ── FLOOR ─────────────────────────────────────────────
    ctx.save(); ctx.fillStyle='#0f2035'; ctx.fillRect(0,FLOOR_Y,W,H*0.22); ctx.restore();
    ctx.save(); ctx.strokeStyle='#2d5275'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,FLOOR_Y); ctx.lineTo(W,FLOOR_Y); ctx.stroke(); ctx.restore();
    var texD=Math.max(6,Math.round(6+mu_k*20));
    for(var xi=0;xi<W;xi+=texD){
      ctx.save(); ctx.strokeStyle='rgba('+Math.round(30+mu_k*80)+',58,82,0.5)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(xi,FLOOR_Y); ctx.lineTo(xi-texD*0.4,FLOOR_Y+texD*0.5); ctx.stroke(); ctx.restore();
    }
    simText(ctx,'μk = '+mu_k.toFixed(2),W/2,FLOOR_Y+12,'#2d5275',8,undefined,true);

    // Predicted stop line
    var stopX=80+dTheory*55;
    if(stopX<W-10&&stopX>80){
      ctx.save(); ctx.strokeStyle='rgba(34,211,153,.3)'; ctx.lineWidth=1.5; ctx.setLineDash([4,6]);
      ctx.beginPath(); ctx.moveTo(stopX,FLOOR_Y-4); ctx.lineTo(stopX,FLOOR_Y+4); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
      simText(ctx,'d='+dTheory.toFixed(1)+'m',stopX,FLOOR_Y-8,'#22d3ee',7.5,undefined,true);
    }

    // Heat sparks while moving
    if(running&&vel>0.1){
      for(var pi=0;pi<4;pi++){
        ctx.save(); ctx.fillStyle='rgba(251,191,36,'+( 0.3+Math.random()*0.5)+')';
        ctx.beginPath(); ctx.arc(pos+(-25+Math.random()*50),FLOOR_Y-1+Math.random()*4,1+Math.random()*2,0,Math.PI*2); ctx.fill(); ctx.restore();
      }
    }

    // ── BLOCK ──────────────────────────────────────────────
    var bW=56,bH=46;
    var bX=pos-bW/2, bY=FLOOR_Y-bH;
    var bCol=running?'#f59e0b':'#475569';
    var bG=ctx.createLinearGradient(bX,bY,bX,bY+bH);
    bG.addColorStop(0,bCol+'cc'); bG.addColorStop(1,bCol+'44');
    ctx.save(); ctx.shadowColor=running?bCol:'transparent'; ctx.shadowBlur=running?14:0;
    ctx.fillStyle=bG; ctx.strokeStyle=bCol; ctx.lineWidth=2;
    ctx.beginPath(); ctx.roundRect(bX,bY,bW,bH,5); ctx.fill(); ctx.stroke(); ctx.shadowBlur=0; ctx.restore();
    simText(ctx,m.toFixed(0)+' kg',pos,bY+bH/2+4,'#fff',10,undefined,true);

    // Velocity arrow
    if(vel>0.1){
      var vLen=Math.min(80,vel*8);
      simArrow(ctx,pos+bW/2+2,bY+bH/2,pos+bW/2+2+vLen,bY+bH/2,'#34d399',2.5,10);
      simText(ctx,'v='+vel.toFixed(1)+'m/s',pos+bW/2+vLen+5,bY+bH/2-8,'#34d399',8.5,'left');
    }
    // fk arrow (LEFT, opposing motion)
    if(running&&vel>0.1){
      var fkLen=Math.min(65, fk*0.9);
      simArrow(ctx,bX-2,bY+bH*0.65,bX-2-fkLen,bY+bH*0.65,'#f87171',2.5,10);
      simText(ctx,'fk='+fk.toFixed(0)+'N (קבוע!)',bX-fkLen/2-2,bY+bH*0.65-11,'#f87171',8.5,undefined,true);
    }
    // a arrow
    if(running){
      simArrow(ctx,pos,bY-8,pos+Math.sign(a)*Math.min(50,Math.abs(a)*8),bY-8,'#ef4444',2,8);
      simText(ctx,'a='+a.toFixed(2)+'m/s²',pos,bY-18,'#ef4444',8.5,undefined,true);
    }

    // ── TOP PANEL ──────────────────────────────────────────
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.92)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(8,6,W-16,52,6); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'חיכוך קינטי: fk = μk × N = '+fk.toFixed(1)+' N (קבוע בכל מהירות!)',W/2,18,'#22d3ee',10,undefined,true);
    simText(ctx,'a = −μk × g = '+a.toFixed(2)+' m/s²  |  d_stop = v₀²/(2μkg) = '+dTheory.toFixed(2)+' m',W/2,32,'#94a3b8',9,undefined,true);
    if(launched&&!running&&vel===0){
      simText(ctx,'✓ עצר! d_בפועל = '+dist.toFixed(2)+' m ≈ '+dTheory.toFixed(2)+' m תיאורטי',W/2,46,'#34d399',9,undefined,true);
    } else if(launched){
      simText(ctx,'v = '+vel.toFixed(2)+' m/s  |  d = '+dist.toFixed(2)+' m',W/2,46,'#fbbf24',9,undefined,true);
    } else {
      simText(ctx,'לחץ "▶ שגר!" לראות האטה קבועה',W/2,46,'#64748b',9,undefined,true);
    }

    // ── v(t) GRAPH ──────────────────────────────────────────
    var GX=8, GY=FLOOR_Y+H*0.22+6, GW=W/2-12, GH=H-GY-10;
    if(vData.length>2){
      ctx.save(); ctx.fillStyle='rgba(6,14,28,.88)'; ctx.strokeStyle='#1e3a52'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.roundRect(GX,GY,GW,GH,4); ctx.fill(); ctx.stroke(); ctx.restore();
      simText(ctx,'v(t) — קו ישר! (a קבוע)',GX+GW/2,GY+9,'#64748b',8,undefined,true);
      // Axes
      ctx.save(); ctx.strokeStyle='#1e3a52'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(GX+6,GY+GH-14); ctx.lineTo(GX+GW-6,GY+GH-14); ctx.stroke(); ctx.restore();
      var vMax=v0, tMax=Math.max(tClock,v0/Math.abs(a));
      ctx.save(); ctx.strokeStyle='#34d399'; ctx.lineWidth=2;
      ctx.beginPath();
      vData.forEach(function(v2,i){
        var px2=GX+6+(tData[i]/tMax)*(GW-12);
        var py2=GY+GH-14-(v2/vMax)*(GH-20);
        i===0?ctx.moveTo(px2,py2):ctx.lineTo(px2,py2);
      });
      ctx.stroke(); ctx.restore();
      simText(ctx,'t (s) →',GX+GW-6,GY+GH-4,'#4a7090',7,'right');
    simText(ctx,'v (m/s) ↑',GX+8,GY+6,'#34d399',7,'left');
      simText(ctx,'v₀='+v0.toFixed(0),GX+8,GY+GH-14-(v0/vMax)*(GH-20),'#34d399',7,'left');
    } else {
      ctx.save(); ctx.fillStyle='rgba(6,14,28,.5)'; ctx.strokeStyle='#1e3a52'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.roundRect(GX,GY,GW,GH,4); ctx.fill(); ctx.stroke(); ctx.restore();
      simText(ctx,'גרף v(t) יופיע',GX+GW/2,GY+GH/2,'#1e3a52',8.5,undefined,true);
      simText(ctx,'לאחר שיגור',GX+GW/2,GY+GH/2+12,'#1e3a52',8,undefined,true);
    }

    // ── a(t) GRAPH ──────────────────────────────────────────
    var GX2=W/2+4, GW2=W/2-12;
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.88)'; ctx.strokeStyle='#1e3a52'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.roundRect(GX2,GY,GW2,GH,4); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'a(t) — קו אופקי! (קבוע)',GX2+GW2/2,GY+9,'#64748b',8,undefined,true);
    simText(ctx,'t (s) →',GX2+GW2-6,GY+GH-4,'#4a7090',7,'right');
    simText(ctx,'a (m/s²) ↑',GX2+8,GY+6,'#ef4444',7,'left');
    if(aData.length>2){
      var tMax2=Math.max(tClock,v0/Math.abs(a));
      ctx.save(); ctx.strokeStyle='#ef4444'; ctx.lineWidth=2;
      ctx.beginPath();
      aData.forEach(function(av,i){
        var px2=GX2+6+(tData[i]/tMax2)*(GW2-12);
        var py2=GY+GH/2-av/(Math.abs(a)*2)*(GH-20);
        i===0?ctx.moveTo(px2,py2):ctx.lineTo(px2,py2);
      });
      ctx.stroke(); ctx.restore();
      ctx.save(); ctx.strokeStyle='rgba(30,58,82,.4)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(GX2+6,GY+GH/2); ctx.lineTo(GX2+GW2-6,GY+GH/2); ctx.stroke(); ctx.restore();
      simText(ctx,'a='+a.toFixed(2),GX2+GW2-8,GY+GH/2-Math.abs(a)/(Math.abs(a)*2)*(GH-20)-4,'#ef4444',7,'right');
    } else {
      simText(ctx,'גרף a(t)',GX2+GW2/2,GY+GH/2,'#1e3a52',8.5,undefined,true);
      simText(ctx,'יופיע לאחר שיגור',GX2+GW2/2,GY+GH/2+12,'#1e3a52',8,undefined,true);
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}

function simFrictionCombined(canvas){
  // SECTION: forces2.friction-combined — חיכוך — בעיה משולבת
  // PEDAGOGY: Complete problem solving on incline. Student sets angle, mu, mass, F_push.
  // All forces computed and shown. Student must predict: will it slide? up or down?
  // Live judgment: "static equilibrium", "slides down", "slides up" with color coding.
  // Shows full FBD with numerical values — mirrors exam problems.
  const H=500; const {ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;
  const g=9.8;
  let pT=null, t=0;
  var theta=25, m=5, F_push=0, mu=0.45;
  var sPos=0, sVel=0;
  var theta_prev=-1;

  function getTheta(){var e=document.getElementById('inp-fc-theta'); return e?parseFloat(e.value):theta;}
  function getM(){var e=document.getElementById('inp-fc-m'); return e?parseFloat(e.value):m;}
  function getF(){var e=document.getElementById('inp-fc-F'); return e?parseFloat(e.value):F_push;}
  function getMu(){var e=document.getElementById('inp-fc-mu'); return e?parseFloat(e.value):mu;}

  var resetBtn=document.getElementById('btn-fc-reset');
  if(resetBtn)resetBtn.addEventListener('click',function(){sPos=0;sVel=0;});

  var INCL=Math.min(W*0.70,295);
  var BASE_X=W*0.10, BASE_Y=H-48;

  function draw(ts){
    if(_simStop[id])return;
    if(!pT)pT=ts; var dt=Math.min((ts-pT)/1000,.04); pT=ts;
    t+=dt;
    theta=getTheta(); m=getM(); F_push=getF(); mu=getMu();
    if(Math.abs(theta-theta_prev)>0.5){sPos=0;sVel=0;theta_prev=theta;}
    var th=theta*Math.PI/180, cosT=Math.cos(th), sinT=Math.sin(th);

    // All forces
    var W_grav=m*g;
    var N=m*g*cosT;
    var W_par=m*g*sinT; // down slope
    var fs_max=mu*N;
    var mu_k=mu*0.75;
    var fk=mu_k*N;

    // Net force without friction
    var F_net_nofric=F_push-W_par; // positive = up slope tendency

    // Determine state
    var state, net_accel=0, fs_applied=0;
    if(Math.abs(F_net_nofric)<=fs_max){
      state='static';
      fs_applied=-F_net_nofric; // friction exactly balances net tendency
      net_accel=0;
    } else if(F_net_nofric>0){
      state='slides_up';
      fs_applied=-fk; // kinetic friction opposes upward motion
      net_accel=(F_push-W_par-fk)/m;
    } else {
      state='slides_down';
      fs_applied=+fk; // kinetic friction opposes downward motion
      net_accel=(F_push-W_par+fk)/m;
    }

    if(state!=='static'){
      sVel+=net_accel*dt; sPos+=sVel*dt;
      if(sPos>INCL*0.88){sPos=INCL*0.88;sVel=Math.abs(sVel)>0.5?-sVel*0.3:0;}
      if(sPos<0){sPos=0;sVel=Math.max(0,sVel);}
    } else {sVel*=0.8;}

    var topX=BASE_X+INCL*cosT, topY=BASE_Y-INCL*sinT;
    var bS=34;
    var bCX=BASE_X+(sPos+bS/2)*cosT, bCY=BASE_Y-(sPos+bS/2)*sinT;

    var stateCol=state==='static'?'#34d399':state==='slides_up'?'#3b82f6':'#ef4444';
    var stateLabel=state==='static'?'✓ שיווי משקל':state==='slides_up'?'↑ מחליק למעלה':'↓ מחליק למטה';

    simBg(ctx,W,H);

    // Ground
    ctx.save(); ctx.fillStyle='#060d1a'; ctx.fillRect(0,BASE_Y,W,H-BASE_Y); ctx.restore();
    ctx.save(); ctx.strokeStyle='#2d5275'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,BASE_Y); ctx.lineTo(W,BASE_Y); ctx.stroke(); ctx.restore();

    // Incline
    ctx.save(); ctx.fillStyle='rgba(15,32,53,.85)';
    ctx.beginPath(); ctx.moveTo(BASE_X,BASE_Y); ctx.lineTo(topX,topY); ctx.lineTo(BASE_X,BASE_Y); ctx.closePath(); ctx.fill(); ctx.restore();
    ctx.save(); ctx.strokeStyle='#3d6480'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(BASE_X,BASE_Y); ctx.lineTo(topX,topY); ctx.stroke(); ctx.restore();
    // Texture based on mu
    for(var si=18;si<INCL;si+=Math.max(8,Math.round(20*(1-mu)))){
      ctx.save(); ctx.strokeStyle='rgba(45,82,'+Math.round(117+mu*60)+',0.4)'; ctx.lineWidth=1;
      var tx2=BASE_X+si*cosT, ty2=BASE_Y-si*sinT;
      ctx.beginPath(); ctx.moveTo(tx2,ty2); ctx.lineTo(tx2-sinT*4,ty2-cosT*4); ctx.stroke(); ctx.restore();
    }
    // Angle arc
    ctx.save(); ctx.strokeStyle='#fbbf24'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(BASE_X,BASE_Y,44,Math.PI,Math.PI+th); ctx.stroke(); ctx.restore();
    simText(ctx,theta.toFixed(0)+'°',BASE_X+28,BASE_Y-10,'#fbbf24',9,undefined,true);

    // Block (rotated)
    ctx.save(); ctx.translate(bCX,bCY); ctx.rotate(-th);
    var bG=ctx.createLinearGradient(-bS/2,-bS/2,-bS/2,bS/2);
    bG.addColorStop(0,stateCol+'cc'); bG.addColorStop(1,stateCol+'44');
    ctx.fillStyle=bG; ctx.strokeStyle=stateCol; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.roundRect(-bS/2,-bS/2,bS,bS,4); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,m+'kg',bCX,bCY+4,'#fff',8.5,undefined,true);

    // ── FORCE ARROWS FROM BLOCK CENTER ────────────────────
    var arSc=1.8;
    // Gravity (down)
    var wLen=Math.min(62,W_grav*arSc);
    simArrow(ctx,bCX,bCY,bCX,bCY+wLen,'#fbbf24',2.5,10);
    simText(ctx,'W='+W_grav.toFixed(1)+'N',bCX+5,bCY+wLen+4,'#fbbf24',8,'left');
    // W_par dashed (along slope down)
    var wpLen=Math.min(48,W_par*arSc);
    ctx.save(); ctx.strokeStyle='rgba(251,191,36,.4)'; ctx.lineWidth=1.5; ctx.setLineDash([3,4]);
    ctx.beginPath(); ctx.moveTo(bCX,bCY+wLen); ctx.lineTo(bCX+cosT*wpLen,bCY+wLen-sinT*wpLen); ctx.stroke(); ctx.setLineDash([]); ctx.restore();

    // Normal (perpendicular, out)
    var nnx2=sinT, nny2=-cosT;
    var nLen=Math.min(58,N*arSc);
    simArrow(ctx,bCX,bCY,bCX+nnx2*nLen,bCY+nny2*nLen,'#a78bfa',2.5,10);
    simText(ctx,'N='+N.toFixed(1)+'N',bCX+nnx2*(nLen+4),bCY+nny2*(nLen+4),'#a78bfa',8.5,'center');

    // Applied force (up slope)
    if(F_push>0.5){
      var fLen=Math.min(55,F_push*arSc);
      simArrow(ctx,bCX,bCY,bCX+cosT*fLen,bCY-sinT*fLen,'#34d399',2.5,10);
      simText(ctx,'F='+F_push.toFixed(0)+'N',bCX+cosT*fLen+4,bCY-sinT*fLen-4,'#34d399',8.5,'left');
    }

    // Friction (fs or fk, direction based on state)
    if(Math.abs(fs_applied)>0.3){
      var fsDir=Math.sign(fs_applied); // positive = up slope
      var fsLen=Math.min(54,Math.abs(fs_applied)*arSc);
      var fsCol=state==='static'?'#22d3ee':'#f87171';
      var fsName=state==='static'?'fs':'fk';
      simArrow(ctx,bCX,bCY,bCX+cosT*fsDir*fsLen,bCY-sinT*fsDir*fsLen,fsCol,2.5,10);
      simText(ctx,fsName+'='+Math.abs(fs_applied).toFixed(1)+'N',bCX+cosT*fsDir*fsLen/2,bCY-sinT*fsDir*fsLen/2-14,fsCol,8,undefined,true);
    }

    // Net force arrow (white, offset)
    if(Math.abs(net_accel)>0.05){
      var naLen=Math.min(46,Math.abs(net_accel)*10);
      var naDir=Math.sign(net_accel);
      var naCX=bCX-nnx2*26, naCY=bCY-nny2*26;
      simArrow(ctx,naCX,naCY,naCX+cosT*naDir*naLen,naCY-sinT*naDir*naLen,'#fff',3,11);
      simText(ctx,'a='+net_accel.toFixed(2),naCX+cosT*naDir*(naLen+4),naCY-sinT*naDir*(naLen+4),'#fff',8,'center');
    }

    // ── RIGHT PANEL ────────────────────────────────────────
    var PX=topX+12, PW=W-PX-10, PY=8;
    if(PW<82){PX=W*0.67;PW=W-PX-8;}
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.93)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(PX,PY,PW,H-PY-8,6); ctx.fill(); ctx.stroke(); ctx.restore();
    var PC=PX+PW/2;
    simText(ctx,'ניתוח כוחות',PC,PY+12,'#22d3ee',10,undefined,true);
    ctx.save(); ctx.strokeStyle='#1e4060'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(PX+5,PY+17); ctx.lineTo(PX+PW-5,PY+17); ctx.stroke(); ctx.restore();
    simText(ctx,'N=mgcosθ',PC,PY+29,'#a78bfa',8.5,undefined,true);
    simText(ctx,N.toFixed(2)+' N',PC,PY+42,'#a78bfa',10,undefined,true);
    simText(ctx,'W∥=mgsinθ',PC,PY+56,'#fbbf24',8.5,undefined,true);
    simText(ctx,W_par.toFixed(2)+' N',PC,PY+69,'#fbbf24',10,undefined,true);
    simText(ctx,'fs_max=μN',PC,PY+83,'#22d3ee',8.5,undefined,true);
    simText(ctx,fs_max.toFixed(2)+' N',PC,PY+96,'#22d3ee',10,undefined,true);
    ctx.save(); ctx.strokeStyle='#1e4060'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(PX+5,PY+103); ctx.lineTo(PX+PW-5,PY+103); ctx.stroke(); ctx.restore();
    // State
    ctx.save(); ctx.fillStyle=stateCol+'22'; ctx.strokeStyle=stateCol+'66'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(PX+5,PY+108,PW-10,28,4); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,stateLabel,PC,PY+126,stateCol,9.5,undefined,true);
    ctx.save(); ctx.strokeStyle='#1e4060'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(PX+5,PY+140); ctx.lineTo(PX+PW-5,PY+140); ctx.stroke(); ctx.restore();
    simText(ctx,'פתרון:',PC,PY+151,'#94a3b8',8,undefined,true);
    var cond1=state==='static'?'|F-W∥|≤fs_max':'|F-W∥|>fs_max';
    simText(ctx,cond1,PC,PY+163,'#64748b',7.5,undefined,true);
    simText(ctx,'a='+net_accel.toFixed(2)+' m/s²',PC,PY+176,stateCol,9,undefined,true);
    simText(ctx,'v='+sVel.toFixed(1)+' m/s',PC,PY+189,'#64748b',8,undefined,true);

    // Top banner
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.92)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(8,6,topX-14,38,6); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'בעיה: גוף על מדרון + חיכוך',BASE_X+(topX-BASE_X)/2,18,'#22d3ee',9.5,undefined,true);
    simText(ctx,stateLabel,BASE_X+(topX-BASE_X)/2,32,stateCol,9,undefined,true);

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}

function simNewton3(canvas){
  // SECTION: forces.n3-law — חוק ניוטון השלישי: פעולה ותגובה
  // PEDAGOGY: Two scenarios. Top: Two skaters push off each other — equal forces, unequal acceleration.
  // Bottom: Live force meter needle shows BOTH forces simultaneously.
  // Key insight: forces are equal/opposite AND on DIFFERENT objects → different accelerations if m differs.
  const H=500; const {ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;
  const g=9.8;
  let pT=null, t=0;
  var mA=60, mB=30; // kg (people)
  var posA=W/2-30, posB=W/2+30, velA=0, velB=0;
  var pushed=false, contactForce=0, pushPhase=0; // 0=resting, 1=contact(push), 2=separating
  var histA=[], histB=[];

  function getMA(){var e=document.getElementById('inp-n3-mA'); return e?parseFloat(e.value):mA;}
  function getMB(){var e=document.getElementById('inp-n3-mB'); return e?parseFloat(e.value):mB;}
  function getForce(){var e=document.getElementById('inp-n3-F'); return e?parseFloat(e.value):300;}

  var pushBtn=document.getElementById('btn-n3-push');
  var resetBtn=document.getElementById('btn-n3-reset');

  function reset(){
    mA=getMA(); mB=getMB();
    var totW=Math.max(30,mA*0.45)+Math.max(30,mB*0.45);
    posA=W/2-totW/2-4; posB=W/2+totW/2+4;
    velA=0; velB=0; histA=[]; histB=[]; pushed=false; pushPhase=0; contactForce=0;
    if(pushBtn)pushBtn.textContent='▶ דחוף!';
  }
  reset();

  if(pushBtn)pushBtn.addEventListener('click',function(){
    if(pushPhase===0){
      pushed=true; pushPhase=1;
      pushBtn.textContent='⏹ אפס';
    } else { reset(); }
  });
  if(resetBtn)resetBtn.addEventListener('click',reset);

  var FLOOR_Y=H*0.60;
  var pushDuration=0.3; // seconds of push
  var pushTimer=0;

  function draw(ts){
    if(_simStop[id])return;
    if(!pT)pT=ts; var dt=Math.min((ts-pT)/1000,.04); pT=ts;
    t+=dt;
    mA=getMA(); mB=getMB();
    var F=getForce();

    // Physics
    if(pushPhase===1){
      pushTimer+=dt;
      // Impulsive force during contact
      contactForce=F;
      velA-=(F/mA)*dt; // A goes left
      velB+=(F/mB)*dt; // B goes right
      posA+=velA*dt*55; posB+=velB*dt*55;
      if(pushTimer>=pushDuration){pushPhase=2; contactForce=0;}
    } else if(pushPhase===2){
      contactForce=0;
      // Coast with no friction
      posA+=velA*dt*55; posB+=velB*dt*55;
      // Wall bounce
      var widA=Math.max(30,mA*0.45);
      var widB=Math.max(30,mB*0.45);
      if(posA-widA/2<10){posA=10+widA/2;velA=Math.abs(velA)*0.5;}
      if(posB+widB/2>W-10){posB=W-10-widB/2;velB=-Math.abs(velB)*0.5;}
    }
    histA.push(posA); if(histA.length>60)histA.shift();
    histB.push(posB); if(histB.length>60)histB.shift();

    simBg(ctx,W,H);

    // Floor
    ctx.save(); ctx.fillStyle='#0f2035'; ctx.fillRect(0,FLOOR_Y,W,H*0.25); ctx.restore();
    ctx.save(); ctx.strokeStyle='#2d5275'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,FLOOR_Y); ctx.lineTo(W,FLOOR_Y); ctx.stroke(); ctx.restore();
    for(var xi=0;xi<W;xi+=20){
      ctx.save(); ctx.strokeStyle='rgba(30,58,82,.3)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(xi,FLOOR_Y); ctx.lineTo(xi-10,FLOOR_Y+10); ctx.stroke(); ctx.restore();
    }

    // Trails
    for(var i=1;i<histA.length;i+=2){
      ctx.save(); ctx.globalAlpha=(i/histA.length)*0.2; ctx.fillStyle='#ef4444';
      ctx.fillRect(histA[i]-4,FLOOR_Y-12,8,4); ctx.restore();
    }
    for(var i2=1;i2<histB.length;i2+=2){
      ctx.save(); ctx.globalAlpha=(i2/histB.length)*0.2; ctx.fillStyle='#3b82f6';
      ctx.fillRect(histB[i2]-4,FLOOR_Y-12,8,4); ctx.restore();
    }

    // ── Draw skaters ──────────────────────────────────────
    function drawPerson(cx,cy,col,label,mass,vel2,forceArrow,faDir){
      var bw=Math.max(30,mass*0.45), bh=54;
      // Body
      ctx.save(); ctx.shadowColor=col; ctx.shadowBlur=pushPhase===1?14:0;
      ctx.fillStyle=col+'cc'; ctx.strokeStyle=col; ctx.lineWidth=2;
      ctx.beginPath(); ctx.roundRect(cx-bw/2,cy-bh,bw,bh,6); ctx.fill(); ctx.stroke();
      ctx.shadowBlur=0; ctx.restore();
      // Head
      ctx.save(); ctx.fillStyle=col+'99'; ctx.strokeStyle=col; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(cx,cy-bh-12,12,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.restore();
      // Label
      simText(ctx,label,cx,cy-bh/2+4,'#fff',9.5,undefined,true);
      simText(ctx,mass+'kg',cx,cy-bh/2+16,'rgba(255,255,255,.7)',8.5,undefined,true);
      // Velocity
      if(Math.abs(vel2)>0.2){
        var vLen=Math.min(70,Math.abs(vel2)*5);
        var vDir=Math.sign(vel2);
        simArrow(ctx,cx,cy-bh-30,cx+vDir*vLen,cy-bh-30,'#22d3ee',2,9);
        simText(ctx,'v='+vel2.toFixed(1)+'m/s',cx+vDir*(vLen+4),cy-bh-36,
                '#22d3ee',8,vel2>0?'left':'right');
      }
      // Force arrow (during push)
      if(forceArrow>0){
        var fLen=Math.min(60,forceArrow*0.15);
        simArrow(ctx,cx+faDir*(bw/2+2),cy-bh/2,cx+faDir*(bw/2+2+fLen),cy-bh/2,col,3.5,12);
        simText(ctx,'F='+forceArrow.toFixed(0)+'N',cx+faDir*(bw/2+fLen/2+2),cy-bh/2-12,col,8.5,undefined,true);
      }
    }

    drawPerson(posA,FLOOR_Y,'#ef4444','A',mA,velA,pushPhase===1?contactForce:0,-1);
    drawPerson(posB,FLOOR_Y,'#3b82f6','B',mB,velB,pushPhase===1?contactForce:0,1);

    // Push zone indicator
    if(pushPhase===1){
      var cx2=(posA+posB)/2;
      ctx.save(); ctx.strokeStyle='#fbbf24'; ctx.lineWidth=2; ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.moveTo(cx2,FLOOR_Y-64); ctx.lineTo(cx2,FLOOR_Y-4); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
      simText(ctx,'מגע!',cx2,FLOOR_Y-70,'#fbbf24',9.5,undefined,true);
    }

    // ── Force gauge (bottom strip) ────────────────────────
    var GX=20, GY=FLOOR_Y+H*0.25+10, GW=W-40, GH=60;
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.88)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(GX,GY,GW,GH,5); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'מד-כוח A (אדום) ← → מד-כוח B (כחול)',GX+GW/2,GY+12,'#64748b',8.5,undefined,true);
    // Gauge A (left)
    var gAW=(GW/2-20), gAX=GX+6;
    ctx.save(); ctx.fillStyle='rgba(15,28,48,.8)'; ctx.strokeStyle='#1e3a52'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.roundRect(gAX,GY+18,gAW,22,3); ctx.fill(); ctx.stroke(); ctx.restore();
    var fillA=contactForce>0?(contactForce/getForce())*gAW:0;
    ctx.save(); ctx.fillStyle='rgba(239,68,68,.7)';
    ctx.beginPath(); ctx.roundRect(gAX+gAW-fillA,GY+20,fillA,18,2); ctx.fill(); ctx.restore();
    simText(ctx,'A: '+contactForce.toFixed(0)+' N',gAX+gAW/2,GY+32,'#fca5a5',9,undefined,true);
    // Gauge B (right)
    var gBX=GX+GW/2+14;
    ctx.save(); ctx.fillStyle='rgba(15,28,48,.8)'; ctx.strokeStyle='#1e3a52'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.roundRect(gBX,GY+18,gAW,22,3); ctx.fill(); ctx.stroke(); ctx.restore();
    var fillB=contactForce>0?(contactForce/getForce())*gAW:0;
    ctx.save(); ctx.fillStyle='rgba(59,130,246,.7)';
    ctx.beginPath(); ctx.roundRect(gBX,GY+20,fillB,18,2); ctx.fill(); ctx.restore();
    simText(ctx,'B: '+contactForce.toFixed(0)+' N',gBX+gAW/2,GY+32,'#93c5fd',9,undefined,true);
    simText(ctx,'|F_AB| = |F_BA|',GX+GW/2,GY+54,'#fbbf24',9,undefined,true);

    // ── Top info panel ─────────────────────────────────────
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.92)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(8,6,W-16,52,6); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'חוק שלישי: F_AB = −F_BA',W/2,18,'#fbbf24',11,undefined,true);
    if(pushPhase===0){
      simText(ctx,'לחץ "דחוף!" לראות פעולה ותגובה',W/2,32,'#64748b',9,undefined,true);
      simText(ctx,'שים לב: שנה מסות! כוח שווה → תאוצות שונות!',W/2,46,'#94a3b8',8.5,undefined,true);
    } else if(pushPhase===1){
      simText(ctx,'כוח זהה על שניהם! F='+contactForce.toFixed(0)+'N',W/2,32,'#fbbf24',9.5,undefined,true);
      var aA2=contactForce/mA, aB2=contactForce/mB;
      simText(ctx,'aA=F/mA='+aA2.toFixed(1)+' m/s² ≠ aB=F/mB='+aB2.toFixed(1)+' m/s²',W/2,46,'#22d3ee',8.5,undefined,true);
    } else {
      simText(ctx,'לאחר הדחיפה: A→'+velA.toFixed(1)+' m/s  B→'+velB.toFixed(1)+' m/s',W/2,32,'#22d3ee',9,undefined,true);
      simText(ctx,'מסה קטנה → תאוצה גדולה יותר! (אותו כוח)',W/2,46,'#34d399',8.5,undefined,true);
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}


function simPendulum(canvas){
  // SECTION: shm.pendulum — מטוטלת פשוטה
  // PEDAGOGY: Period T=2π√(L/g), angle vs time graph, energy exchange.
  // Interactive: drag the bob to any angle, release. Change L and g.
  const H=490; const {ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;
  let pT=null, t=0;
  var L=1.0, g=9.8;       // length (m), gravity
  var theta=0.4, omega=0; // angle from vertical (rad), angular velocity
  var b=0.02;              // damping
  var dragging=false, dragStartY=0, dragStartTheta=0;
  var thetaHist=[], timeHist=[], clock=0;
  var maxHist=300;

  // Pivot position
  var PIV_X=W*0.38, PIV_Y=72;
  var PX_PER_M=Math.min(W*0.5,210); // pixels per meter of L

  function getL(){var e=document.getElementById('inp-pend-L'); return e?parseFloat(e.value):L;}
  function getG(){var e=document.getElementById('inp-pend-g'); return e?parseFloat(e.value):g;}
  function getB(){var e=document.getElementById('inp-pend-damp'); return e?parseFloat(e.value):b;}

  function bobX(){return PIV_X+Math.sin(theta)*L*PX_PER_M;}
  function bobY(){return PIV_Y+Math.cos(theta)*L*PX_PER_M;}

  function getCanvasXY(evt){
    var r=canvas.getBoundingClientRect();
    var scl=(canvas.width/dpr)/r.width;
    return {
      x:((evt.touches?evt.touches[0].clientX:evt.clientX)-r.left)*scl,
      y:((evt.touches?evt.touches[0].clientY:evt.clientY)-r.top)*scl
    };
  }
  function onDown(e){
    e.preventDefault();
    var p=getCanvasXY(e);
    var bx=bobX(), by=bobY();
    if(Math.abs(p.x-bx)<28&&Math.abs(p.y-by)<28){
      dragging=true; omega=0;
      thetaHist=[]; timeHist=[]; clock=0;
    }
  }
  function onMove(e){
    if(!dragging)return; e.preventDefault();
    var p=getCanvasXY(e);
    theta=Math.atan2(p.x-PIV_X, p.y-PIV_Y);
    theta=Math.max(-1.4,Math.min(1.4,theta));
    omega=0;
  }
  function onUp(){dragging=false;}
  canvas.addEventListener('mousedown',onDown); canvas.addEventListener('touchstart',onDown,{passive:false});
  canvas.addEventListener('mousemove',onMove); canvas.addEventListener('touchmove',onMove,{passive:false});
  canvas.addEventListener('mouseup',onUp); canvas.addEventListener('touchend',onUp);

  var resetBtn=document.getElementById('btn-pend-reset');
  var trailP=[];
  if(resetBtn)resetBtn.addEventListener('click',function(){theta=0.5;omega=0;thetaHist=[];timeHist=[];clock=0;trailP=[];});

  function draw(ts){
    if(_simStop[id])return;
    if(!pT)pT=ts; var dt=Math.min((ts-pT)/1000,0.04); pT=ts;
    t+=dt;
    L=getL(); g=getG(); b=getB();

    if(!dragging){
      // Pendulum ODE: θ'' = -(g/L)sinθ - b*θ'
      var alpha=-(g/L)*Math.sin(theta)-b*omega;
      omega+=alpha*dt;
      theta+=omega*dt;
      clock+=dt;
      thetaHist.push(theta*180/Math.PI);
      timeHist.push(clock);
      if(thetaHist.length>maxHist){thetaHist.shift();timeHist.shift();}
    }

    var T=2*Math.PI*Math.sqrt(L/g);
    var bx=bobX(), by=bobY();
    if(!dragging){trailP.push({x:bx,y:by});if(trailP.length>70)trailP.shift();}else{trailP=[];}
    var speed=Math.abs(omega)*L*PX_PER_M;
    // Energy
    var h=L*(1-Math.cos(theta));
    var KE=0.5*(L*L*omega*omega)*1; // proportional (mass=1)
    var PE=g*L*(1-Math.cos(theta));
    var E0=g*L*(1-Math.cos(0.5)); // reference max PE

    simBg(ctx,W,H);

    // ── Motion trail ──────────────────────────────────
    for(var ti2=1;ti2<trailP.length;ti2++){
      var fr2=ti2/trailP.length;
      ctx.save();ctx.globalAlpha=fr2*fr2*0.45;
      ctx.strokeStyle='#60a5fa';ctx.lineWidth=1+fr2*2.5;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(trailP[ti2-1].x,trailP[ti2-1].y);ctx.lineTo(trailP[ti2].x,trailP[ti2].y);ctx.stroke();
      ctx.restore();
    }

    // ── Pendulum rope and bob ─────────────────────────
    // Pivot mount
    ctx.save(); ctx.fillStyle='#1e3a52'; ctx.fillRect(PIV_X-30,PIV_Y-14,60,14); ctx.restore();
    for(var xi=PIV_X-30;xi<PIV_X+30;xi+=10){
      ctx.save(); ctx.strokeStyle='#0f2035'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(xi,PIV_Y-14); ctx.lineTo(xi-7,PIV_Y-22); ctx.stroke(); ctx.restore();
    }
    // Rope
    var ropeGrad=ctx.createLinearGradient(PIV_X,PIV_Y,bx,by);
    ropeGrad.addColorStop(0,'#94a3b8'); ropeGrad.addColorStop(1,'#60a5fa');
    ctx.save(); ctx.strokeStyle=ropeGrad; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(PIV_X,PIV_Y); ctx.lineTo(bx,by); ctx.stroke(); ctx.restore();
    // Pivot dot
    ctx.save(); ctx.fillStyle='#334155'; ctx.strokeStyle='#60a5fa'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(PIV_X,PIV_Y,7,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.restore();
    // Length label
    ctx.save(); ctx.strokeStyle='rgba(96,165,250,.25)'; ctx.lineWidth=1; ctx.setLineDash([3,5]);
    ctx.beginPath(); ctx.moveTo(PIV_X+4,PIV_Y); ctx.lineTo(PIV_X+4,by-20); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
    simText(ctx,'L='+L.toFixed(1)+'m',PIV_X+18,(PIV_Y+by)/2,'#334155',8,'left');
    // Angle arc
    if(Math.abs(theta)>0.03){
      ctx.save(); ctx.strokeStyle='rgba(251,191,36,.5)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(PIV_X,PIV_Y,40,Math.PI/2,Math.PI/2+theta,theta<0); ctx.stroke(); ctx.restore();
      simText(ctx,(theta*180/Math.PI).toFixed(0)+'°',PIV_X+Math.sin(theta)*50,PIV_Y+Math.cos(theta)*50-8,'#fbbf24',8.5,undefined,true);
    }
    // Bob
    var bobR=16+Math.min(8,Math.abs(omega)*3);
    var vFrac=Math.min(1,Math.abs(omega)*L/3);
    var bobCol='rgba('+Math.round(59+196*vFrac)+','+Math.round(130-50*vFrac)+','+Math.round(246-196*vFrac)+',0.9)';
    ctx.save(); ctx.shadowColor=bobCol; ctx.shadowBlur=14+vFrac*10;
    ctx.fillStyle=bobCol; ctx.strokeStyle='#93c5fd'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(bx,by,bobR,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.shadowBlur=0; ctx.restore();
    simText(ctx,'m',bx,by+4,'#fff',9,undefined,true);
    // Velocity arrow
    if(Math.abs(omega)>0.05&&!dragging){
      var vDir=Math.sign(omega);
      var vLen=Math.min(60,Math.abs(omega)*L*PX_PER_M*0.4);
      // velocity is tangential = perpendicular to rope
      var tx=Math.cos(theta)*vDir, ty=-Math.sin(theta)*vDir;
      simArrow(ctx,bx,by,bx+tx*vLen,by+ty*vLen,'#22d3ee',2.5,9);
      simText(ctx,'v='+(Math.abs(omega)*L).toFixed(2)+'m/s',bx+tx*vLen+8,by+ty*vLen,'#22d3ee',8,'left');
    }
    // Drag hint
    if(t<4||dragging){
      simText(ctx,dragging?'שחרר!':'← גרור לזווית!',bx+26,by,'#fbbf24',9,'left');
    }

    // ── Energy bars ──────────────────────────────────
    var EBX=W*0.68, EBY=80, EBW=22, EBH=160;
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.88)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(EBX-16,EBY-24,EBW*2+56,EBH+64,6); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'אנרגיה',EBX+EBW/2+14,EBY-10,'#22d3ee',9,undefined,true);
    // KE bar
    var keH=Math.min(EBH, (KE/E0)*EBH);
    ctx.save(); ctx.fillStyle='rgba(34,211,153,.8)';
    ctx.beginPath(); ctx.roundRect(EBX,EBY+EBH-keH,EBW,keH,3); ctx.fill(); ctx.restore();
    ctx.save(); ctx.strokeStyle='#22d3ee'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(EBX,EBY,EBW,EBH,3); ctx.stroke(); ctx.restore();
    simText(ctx,'KE',EBX+EBW/2,EBY+EBH+12,'#34d399',8,undefined,true);
    simText(ctx,(KE).toFixed(2)+'J',EBX+EBW/2,EBY+EBH+22,'#34d399',7.5,undefined,true);
    // PE bar
    var peH=Math.min(EBH,(PE/E0)*EBH);
    ctx.save(); ctx.fillStyle='rgba(251,191,36,.8)';
    ctx.beginPath(); ctx.roundRect(EBX+EBW+12,EBY+EBH-peH,EBW,peH,3); ctx.fill(); ctx.restore();
    ctx.save(); ctx.strokeStyle='#fbbf24'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(EBX+EBW+12,EBY,EBW,EBH,3); ctx.stroke(); ctx.restore();
    simText(ctx,'PE',EBX+EBW+12+EBW/2,EBY+EBH+12,'#fbbf24',8,undefined,true);
    simText(ctx,(PE).toFixed(2)+'J',EBX+EBW+12+EBW/2,EBY+EBH+22,'#fbbf24',7.5,undefined,true);
    simText(ctx,'KE+PE='+(KE+PE).toFixed(2),EBX+EBW/2+6,EBY+EBH+36,'#94a3b8',7.5,undefined,true);

    // ── Formula panel ─────────────────────────────────
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.92)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(8,6,W*0.60,44,6); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'מטוטלת פשוטה: T = 2π√(L/g)',W*0.30,18,'#22d3ee',11,undefined,true);
    simText(ctx,'T = '+T.toFixed(3)+' s  |  f = '+(1/T).toFixed(3)+' Hz  |  θ = '+(theta*180/Math.PI).toFixed(1)+'°',W*0.30,34,'#94a3b8',9,undefined,true);

    // ── θ(t) graph ────────────────────────────────────
    var GX=8, GY=H-110, GW=W*0.60, GH=96;
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.88)'; ctx.strokeStyle='#1e3a52'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.roundRect(GX,GY,GW,GH,4); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'θ(t) — זווית מול זמן',GX+GW/2,GY+9,'#64748b',8,undefined,true);
    simText(ctx,'t (s) →',GX+GW-8,GY+GH-4,'#3d6480',7,'right');
    simText(ctx,'θ (rad) ↑',GX+8,GY+18,'#a78bfa',7,'left');
    var gMY=GY+GH/2+6;
    ctx.save(); ctx.strokeStyle='#1e3a52'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(GX+6,gMY); ctx.lineTo(GX+GW-6,gMY); ctx.stroke(); ctx.restore();
    if(thetaHist.length>2){
      var tSpan=Math.max(timeHist[timeHist.length-1]-timeHist[0],0.1);
      var tScale=(GW-14)/tSpan;
      var thMax=Math.max(45,Math.abs(theta)*180/Math.PI+5);
      ctx.save(); ctx.strokeStyle='#60a5fa'; ctx.lineWidth=1.8;
      ctx.beginPath();
      for(var i=0;i<thetaHist.length;i++){
        var px=GX+6+(timeHist[i]-timeHist[0])*tScale;
        var py=gMY-thetaHist[i]/thMax*(GH/2-10);
        i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
      }
      ctx.stroke(); ctx.restore();
    } else {
      simText(ctx,'שחרר את המטוטלת לראות גרף',GX+GW/2,GY+GH/2+4,'#1e3a52',8.5,undefined,true);
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}

function simProjectile(canvas){
  // SECTION: planar.projectile — תנועה בליסטית
  // PEDAGOGY: Projectile motion. v0 and angle controls. Shows x(t) and y(t) are independent.
  // Live trajectory trace, range calculation, max height. Pause at peak.
  const H=490; const {ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;
  const g=9.8;
  let pT=null, t=0;
  var v0=15, angle=45;
  var x=0, y=0, vx=0, vy=0;
  var running=false, launched=false;
  var trail=[];
  var landT=-1, aiming=false;
  var targetX=-1,hits=0,feedbackMsg='',feedbackT=-1,hitFxT=-1,hitFxX=0;
  function newTarget(){targetX=15+Math.random()*55;}
  newTarget();
  var peakH=0, range=0, tFlight=0;

  // Ground level
  var GND_Y=H-52, LAUNCH_X=50;

  function getV0(){var e=document.getElementById('inp-proj-v0'); return e?parseFloat(e.value):v0;}
  function getAngle(){var e=document.getElementById('inp-proj-angle'); return e?parseFloat(e.value):angle;}

  var launchBtn=document.getElementById('btn-proj-launch');
  var resetBtn=document.getElementById('btn-proj-reset');

  function launch(){
    v0=getV0(); angle=getAngle();
    var rad=angle*Math.PI/180;
    vx=v0*Math.cos(rad); vy=v0*Math.sin(rad);
    x=0; y=0; running=true; launched=true; trail=[]; landT=-1;
    peakH=0; range=0; tFlight=0;
    // Theoretical
    tFlight=2*v0*Math.sin(rad)/g;
    range=v0*v0*Math.sin(2*rad)/g;
    peakH=v0*v0*Math.sin(rad)*Math.sin(rad)/(2*g);
  }
  function resetSim(){x=0;y=0;vx=0;vy=0;running=false;launched=false;trail=[];peakH=0;range=0;landT=-1;}
  if(launchBtn)launchBtn.addEventListener('click',launch);
  if(resetBtn)resetBtn.addEventListener('click',resetSim);

  // ── Drag-to-aim: pull from the cannon, release to fire ──
  function _aDn(e){if(running)return;var p=simPointerXY(canvas,dpr,e);
    if(Math.hypot(p.x-LAUNCH_X,p.y-GND_Y)<90){aiming=true;canvas.style.cursor='grabbing';e.preventDefault();}}
  function _aMv(e){var p=simPointerXY(canvas,dpr,e);
    if(aiming){
      var dx2=p.x-LAUNCH_X,dy2=GND_Y-p.y;
      if(dx2>4&&dy2>0){
        simSyncSlider('proj-angle',Math.atan2(dy2,dx2)*180/Math.PI,0);
        simSyncSlider('proj-v0',Math.hypot(dx2,dy2)/6,0);
      }
      e.preventDefault();
    } else if(!running){
      canvas.style.cursor=Math.hypot(p.x-LAUNCH_X,p.y-GND_Y)<90?'grab':'';
    }
  }
  function _aUp(){if(aiming){aiming=false;canvas.style.cursor='';
    var b=document.getElementById('btn-proj-launch');if(b)b.click();}}
  canvas.addEventListener('mousedown',_aDn);canvas.addEventListener('touchstart',_aDn,{passive:false});
  canvas.addEventListener('mousemove',_aMv);canvas.addEventListener('touchmove',_aMv,{passive:false});
  canvas.addEventListener('mouseup',_aUp);canvas.addEventListener('touchend',_aUp);

  // Scale: pixels per meter
  var SCALE=Math.min(18, (W-80)/Math.max(1,v0*v0*Math.sin(2*45*Math.PI/180)/g));

  function draw(ts){
    if(_simStop[id])return;
    if(!pT)pT=ts; var dt=Math.min((ts-pT)/1000,0.04); pT=ts;
    t+=dt;
    v0=getV0(); angle=getAngle();

    // Recompute scale based on current settings
    var rad2=angle*Math.PI/180;
    var maxRange=v0*v0*Math.sin(2*rad2)/g;
    SCALE=Math.min(22,Math.max(4,(W-80)/Math.max(1,maxRange)));
    var maxH2=v0*v0*Math.sin(rad2)*Math.sin(rad2)/(2*g);
    var scaleY=Math.min(22,Math.max(4,(GND_Y-60)/Math.max(1,maxH2)));
    SCALE=Math.min(SCALE,scaleY);

    if(running){
      vy-=g*dt;
      x+=vx*dt; y+=vy*dt;
      trail.push({x:x,y:y,vx:vx,vy:vy});
      if(trail.length>400)trail.shift();
      var py=GND_Y-y*SCALE;
      if(py>=GND_Y){
        running=false; x=Math.max(x-vx*dt,0); y=0; landT=t;
        if(targetX>0){
          var miss=x-targetX;
          if(Math.abs(miss)<3){
            hits++;feedbackMsg='🎯 פגיעה מדויקת! נחיתה ב-'+x.toFixed(1)+'m';
            hitFxT=t;hitFxX=targetX;newTarget();
          } else {
            feedbackMsg='החטאה ב-'+Math.abs(miss).toFixed(1)+'m — '+(miss<0?'הגדל טווח: העלה v₀ או קרב את θ ל-45°':'הקטן טווח: הורד v₀ או הרחק את θ מ-45°');
          }
          feedbackT=t;
        }
      }
    }

    simBg(ctx,W,H);

    // ── Ground ────────────────────────────────────────
    ctx.save(); ctx.fillStyle='#0f2035'; ctx.fillRect(0,GND_Y,W,H-GND_Y); ctx.restore();
    ctx.save(); ctx.strokeStyle='#2d5275'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,GND_Y); ctx.lineTo(W,GND_Y); ctx.stroke(); ctx.restore();
    // Grid lines
    for(var xi=0;xi<W;xi+=60){
      ctx.save(); ctx.strokeStyle='rgba(30,58,82,.2)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(LAUNCH_X+xi,GND_Y-4); ctx.lineTo(LAUNCH_X+xi,GND_Y+4); ctx.stroke();
      simText(ctx,(xi/SCALE).toFixed(0)+'m',LAUNCH_X+xi,GND_Y+14,'#1e3a52',7,undefined,true);
      ctx.restore();
    }
    for(var yi=0;yi<GND_Y-60;yi+=50){
      ctx.save(); ctx.strokeStyle='rgba(30,58,82,.15)'; ctx.lineWidth=1; ctx.setLineDash([2,6]);
      ctx.beginPath(); ctx.moveTo(LAUNCH_X-10,GND_Y-yi); ctx.lineTo(W-10,GND_Y-yi); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
      if(yi>0) simText(ctx,(yi/SCALE).toFixed(0)+'m',LAUNCH_X-12,GND_Y-yi+4,'#1e3a52',7,'right');
    }

    // ── Theoretical parabola (dashed) ─────────────────
    if(launched||true){
      var rad3=angle*Math.PI/180;
      var vx0=v0*Math.cos(rad3), vy0=v0*Math.sin(rad3);
      var tf=2*vy0/g;
      ctx.save(); ctx.strokeStyle='rgba(100,116,139,.25)'; ctx.lineWidth=1.5; ctx.setLineDash([4,6]);
      ctx.beginPath();
      for(var ti=0;ti<=tf;ti+=tf/60){
        var px=LAUNCH_X+(vx0*ti)*SCALE;
        var py=GND_Y-(vy0*ti-0.5*g*ti*ti)*SCALE;
        ti===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
      }
      ctx.stroke(); ctx.setLineDash([]); ctx.restore();
      // Range marker
      var rx=LAUNCH_X+(vx0*tf)*SCALE;
      if(rx<W-20){
        ctx.save(); ctx.strokeStyle='rgba(34,211,153,.4)'; ctx.lineWidth=1.5; ctx.setLineDash([3,4]);
        ctx.beginPath(); ctx.moveTo(rx,GND_Y-4); ctx.lineTo(rx,GND_Y+4); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
        simText(ctx,'R='+(vx0*tf).toFixed(1)+'m',rx,GND_Y+16,'#22d3ee',8,undefined,true);
      }
      // Peak marker
      var tpk=vy0/g, pkX=LAUNCH_X+(vx0*tpk)*SCALE, pkY=GND_Y-(vy0*tpk-0.5*g*tpk*tpk)*SCALE;
      ctx.save(); ctx.strokeStyle='rgba(167,139,250,.4)'; ctx.lineWidth=1; ctx.setLineDash([2,4]);
      ctx.beginPath(); ctx.moveTo(pkX,GND_Y); ctx.lineTo(pkX,pkY); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
      simText(ctx,'H='+(vy0*tpk-0.5*g*tpk*tpk).toFixed(1)+'m',pkX+4,pkY-4,'#a78bfa',8,'left');
    }

    // ── Trail + strobe ghosts (vx constant, vy changing) ──
    for(var i=1;i<trail.length;i++){
      var alpha=(i/trail.length)*0.6;
      ctx.save(); ctx.globalAlpha=alpha;
      ctx.fillStyle='#60a5fa';
      ctx.beginPath(); ctx.arc(LAUNCH_X+trail[i].x*SCALE,GND_Y-trail[i].y*SCALE,2,0,Math.PI*2); ctx.fill(); ctx.restore();
    }
    for(var i=12;i<trail.length-6;i+=12){
      var tp=trail[i];
      var gx2=LAUNCH_X+tp.x*SCALE,gy2=GND_Y-tp.y*SCALE;
      ctx.save();ctx.globalAlpha=0.32;ctx.fillStyle='#60a5fa';
      ctx.beginPath();ctx.arc(gx2,gy2,7,0,Math.PI*2);ctx.fill();ctx.restore();
      var sc2=2.2;
      simArrow(ctx,gx2,gy2,gx2+tp.vx*sc2,gy2,'rgba(52,211,153,.7)',1.6,7);
      if(Math.abs(tp.vy)>0.8)simArrow(ctx,gx2,gy2,gx2,gy2-tp.vy*sc2,'rgba(248,113,113,.7)',1.6,7);
    }
    // Landing dust puff
    if(launched&&!running&&landT>0&&t-landT<0.5){
      var pu=(t-landT)/0.5,lx2=LAUNCH_X+x*SCALE;
      ctx.save();ctx.globalAlpha=1-pu;ctx.fillStyle='#94a3b8';
      for(var di=0;di<6;di++){
        var da=Math.PI*(1+di/5),dr=8+pu*26;
        ctx.beginPath();ctx.arc(lx2+Math.cos(da)*dr,GND_Y-4+Math.sin(da)*dr*0.6,2.6-pu*1.6,0,Math.PI*2);ctx.fill();
      }
      ctx.restore();
    }
    // Aim arrow while dragging / idle hint
    if(aiming&&!running){
      var ar3=angle*Math.PI/180,al3=Math.min(200,v0*6);
      simArrow(ctx,LAUNCH_X,GND_Y,LAUNCH_X+Math.cos(ar3)*al3,GND_Y-Math.sin(ar3)*al3,'#fbbf24',3.5,14);
      simText(ctx,'שחרר לשיגור!',LAUNCH_X+Math.cos(ar3)*al3+12,GND_Y-Math.sin(ar3)*al3-10,'#fbbf24',10,'left');
    } else if(!launched){
      simText(ctx,'✋ גרור מהתותח כדי לכוון — שחרר לירי',LAUNCH_X+6,GND_Y-74+Math.sin(t*3)*3,'#fbbf24',9,'left');
    }
    // ── Target challenge ──────────────────────────────
    if(targetX>0){
      var tgx=LAUNCH_X+targetX*SCALE;
      if(tgx<W-16){
        ctx.save();
        [[14,'#ef4444'],[9,'#f8fafc'],[4,'#ef4444']].forEach(function(cc){
          ctx.fillStyle=cc[1];ctx.beginPath();ctx.arc(tgx,GND_Y,cc[0],Math.PI,0);ctx.fill();
        });
        ctx.strokeStyle='#94a3b8';ctx.lineWidth=1.5;
        ctx.beginPath();ctx.moveTo(tgx,GND_Y-14);ctx.lineTo(tgx,GND_Y-34);ctx.stroke();
        ctx.fillStyle='#ef4444';
        ctx.beginPath();ctx.moveTo(tgx,GND_Y-34);ctx.lineTo(tgx+16,GND_Y-29);ctx.lineTo(tgx,GND_Y-24);ctx.closePath();ctx.fill();
        ctx.restore();
        simText(ctx,'מטרה: '+targetX.toFixed(0)+'m',tgx,GND_Y+26,'#f87171',8.5,'center');
      } else {
        simText(ctx,'🎯 המטרה ב-'+targetX.toFixed(0)+'m — מחוץ למסך, הגדל טווח!',W-16,68,'#f87171',8.5,'right');
      }
      simText(ctx,'🎯 פגיעות: '+hits,W-16,GND_Y+40,'#fbbf24',10,'right');
      if(feedbackT>0&&t-feedbackT<2.8&&!running){
        var goodHit=feedbackMsg.indexOf('🎯')===0;
        ctx.save();ctx.fillStyle='rgba(4,9,20,.9)';ctx.strokeStyle=goodHit?'#34d399':'#f59e0b';ctx.lineWidth=1.5;
        ctx.beginPath();ctx.roundRect(W/2-200,62,400,26,6);ctx.fill();ctx.stroke();ctx.restore();
        simText(ctx,feedbackMsg,W/2,78,goodHit?'#34d399':'#fbbf24',9.5,'center');
      }
      if(hitFxT>0&&t-hitFxT<1){
        var fxp=t-hitFxT;
        var fxx=LAUNCH_X+hitFxX*SCALE;
        ctx.save();ctx.globalAlpha=1-fxp;
        var cols=['#f87171','#34d399','#fbbf24','#60a5fa'];
        for(var ci=0;ci<12;ci++){
          var ca=ci*Math.PI/6,cr=fxp*70;
          ctx.fillStyle=cols[ci%4];
          ctx.beginPath();ctx.arc(fxx+Math.cos(ca)*cr,GND_Y-14-Math.abs(Math.sin(ca))*cr+fxp*fxp*60,3,0,Math.PI*2);ctx.fill();
        }
        ctx.restore();
      }
    }

    // ── Projectile ──────────────────────────────────────
    var projX=LAUNCH_X+x*SCALE, projY=GND_Y-y*SCALE;
    var spd=Math.sqrt(vx*vx+vy*vy);
    ctx.save(); ctx.shadowColor='#60a5fa'; ctx.shadowBlur=running?14:4;
    ctx.fillStyle=running?'#60a5fa':'#475569'; ctx.strokeStyle='#93c5fd'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(projX,projY,12,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.shadowBlur=0; ctx.restore();

    // Velocity components
    if(running&&spd>0.1){
      var scV=2.5;
      simArrow(ctx,projX,projY,projX+vx*scV,projY,'#34d399',2,8);
      simText(ctx,'vx='+vx.toFixed(1),projX+vx*scV+4,projY,'#34d399',8,'left');
      simArrow(ctx,projX,projY,projX,projY-vy*scV,'#f87171',2,8);
      simText(ctx,'vy='+vy.toFixed(1),projX+4,projY-vy*scV,'#f87171',8,'left');
    }

    // Launch angle indicator
    if(!launched){
      var rad4=angle*Math.PI/180;
      var arLen=50;
      simArrow(ctx,LAUNCH_X,GND_Y,LAUNCH_X+Math.cos(rad4)*arLen,GND_Y-Math.sin(rad4)*arLen,'#fbbf24',2.5,10);
      ctx.save(); ctx.strokeStyle='rgba(251,191,36,.4)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(LAUNCH_X,GND_Y,24,Math.PI,Math.PI+rad4,false); ctx.stroke(); ctx.restore();
      simText(ctx,angle+'°',LAUNCH_X+28,GND_Y-12,'#fbbf24',9,'left');
      simText(ctx,'v₀='+v0+'m/s',LAUNCH_X+Math.cos(rad4)*arLen+6,GND_Y-Math.sin(rad4)*arLen,'#fbbf24',8,'left');
    }

    // ── Top info panel ─────────────────────────────────
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.92)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(8,6,W-16,50,6); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'תנועה בליסטית: x ו-y בלתי תלויים!',W/2,18,'#22d3ee',11,undefined,true);
    simText(ctx,'x(t) = v₀cosθ·t   |   y(t) = v₀sinθ·t − ½gt²',W/2,32,'#94a3b8',9.5,undefined,true);
    if(launched){
      var R=(getV0()*getV0()*Math.sin(2*getAngle()*Math.PI/180)/g);
      var Hmax=(getV0()*Math.sin(getAngle()*Math.PI/180)); Hmax=Hmax*Hmax/(2*g);
      simText(ctx,'R='+R.toFixed(1)+'m | H='+Hmax.toFixed(1)+'m | T='+( 2*getV0()*Math.sin(getAngle()*Math.PI/180)/g).toFixed(2)+'s | v='+spd.toFixed(1)+'m/s',W/2,46,'#fbbf24',8.5,undefined,true);
    } else {
      simText(ctx,'הגדר v₀ וזווית, לחץ ▶ שגר!',W/2,46,'#64748b',9,undefined,true);
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}

function simCircular(canvas){
  // SECTION: planar.circular — תנועה מעגלית
  // PEDAGOGY: Uniform circular motion. Shows centripetal acceleration a=v²/r pointing inward.
  // Velocity tangential, acceleration centripetal. Period T=2πr/v. Student changes r and v.
  const H=490; const {ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;
  let pT=null, t=0;
  var r=1.2, v=4.0; // radius (m), speed (m/s)
  var theta=0; // current angle
  var trail=[];
  var paused=false;

  // Center of circle on canvas
  var CX=W*0.42, CY=H*0.50;
  var PX_PER_M=Math.min(CX-50,CY-50)/2.5; // pixels per meter

  function getR(){var e=document.getElementById('inp-circ-r'); return e?parseFloat(e.value):r;}
  function getV(){var e=document.getElementById('inp-circ-v'); return e?parseFloat(e.value):v;}

  var pauseBtn=document.getElementById('btn-circ-pause');
  if(pauseBtn)pauseBtn.addEventListener('click',function(){paused=!paused;pauseBtn.textContent=paused?'▶ המשך':'⏸ עצור';});

  // ── Direct manipulation: drag the bob to set the radius ──
  var dragBob=false;
  function _bPos(){return {x:CX+Math.cos(theta)*r*PX_PER_M,y:CY+Math.sin(theta)*r*PX_PER_M};}
  function _cDn(e){var p=simPointerXY(canvas,dpr,e);var b=_bPos();
    if(Math.hypot(p.x-b.x,p.y-b.y)<28){dragBob=true;canvas.style.cursor='grabbing';e.preventDefault();}}
  function _cMv(e){var p=simPointerXY(canvas,dpr,e);
    if(dragBob){
      theta=Math.atan2(p.y-CY,p.x-CX);
      simSyncSlider('circ-r',Math.hypot(p.x-CX,p.y-CY)/PX_PER_M,2);
      trail=[];
      e.preventDefault();
    } else {
      var b2=_bPos();
      canvas.style.cursor=Math.hypot(p.x-b2.x,p.y-b2.y)<28?'grab':'';
    }
  }
  function _cUp(){dragBob=false;canvas.style.cursor='';}
  canvas.addEventListener('mousedown',_cDn);canvas.addEventListener('touchstart',_cDn,{passive:false});
  canvas.addEventListener('mousemove',_cMv);canvas.addEventListener('touchmove',_cMv,{passive:false});
  canvas.addEventListener('mouseup',_cUp);canvas.addEventListener('touchend',_cUp);

  function draw(ts){
    if(_simStop[id])return;
    if(!pT)pT=ts; var dt=Math.min((ts-pT)/1000,0.04); pT=ts;
    t+=dt;
    r=getR(); v=getV();
    var omega=v/r; // angular velocity rad/s
    var T=2*Math.PI*r/v; // period
    var ac=v*v/r; // centripetal acceleration

    if(!paused&&!dragBob) theta+=omega*dt;

    var px=CX+Math.cos(theta)*r*PX_PER_M;
    var py=CY+Math.sin(theta)*r*PX_PER_M;

    // Velocity direction (tangential = perpendicular to radius, CCW)
    var vx_dir=-Math.sin(theta), vy_dir=Math.cos(theta);
    // Centripetal acceleration direction (toward center)
    var ax_dir=Math.cos(theta+Math.PI), ay_dir=Math.sin(theta+Math.PI);

    trail.push({x:px,y:py});
    if(trail.length>Math.ceil(2*Math.PI/Math.max(omega*dt,0.001))+5) trail.shift();

    simBg(ctx,W,H);

    // ── Circle path ───────────────────────────────────
    ctx.save(); ctx.strokeStyle='rgba(30,58,82,.5)'; ctx.lineWidth=1.5; ctx.setLineDash([4,6]);
    ctx.beginPath(); ctx.arc(CX,CY,r*PX_PER_M,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
    // Center dot
    ctx.save(); ctx.fillStyle='#1e3a52';
    ctx.beginPath(); ctx.arc(CX,CY,5,0,Math.PI*2); ctx.fill(); ctx.restore();
    // Radius line
    ctx.save(); ctx.strokeStyle='rgba(100,116,139,.25)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(CX,CY); ctx.lineTo(px,py); ctx.stroke(); ctx.restore();
    simText(ctx,'r='+r.toFixed(1)+'m',(CX+px)/2+6,(CY+py)/2-8,'#334155',8,'left');

    // ── Comet tail ────────────────────────────────────
    for(var i=1;i<trail.length;i++){
      var fr=i/trail.length;
      ctx.save(); ctx.globalAlpha=fr*fr*0.55;
      ctx.strokeStyle='#60a5fa'; ctx.lineWidth=1+fr*3.5; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(trail[i-1].x,trail[i-1].y); ctx.lineTo(trail[i].x,trail[i].y); ctx.stroke();
      ctx.restore();
    }

    // ── Object ────────────────────────────────────────
    ctx.save(); ctx.shadowColor='#60a5fa'; ctx.shadowBlur=16;
    ctx.fillStyle='#3b82f6'; ctx.strokeStyle='#93c5fd'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(px,py,15,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.shadowBlur=0; ctx.restore();

    // ── Velocity vector (tangential) ──────────────────
    var vscale=12;
    var ve=Math.min(100,v*vscale);
    simArrow(ctx,px,py,px+vx_dir*ve,py+vy_dir*ve,'#34d399',3,11);
    simText(ctx,'v='+v.toFixed(1)+'m/s',px+vx_dir*ve+vx_dir*8,py+vy_dir*ve+vy_dir*8,'#34d399',9,undefined,true);

    // ── Centripetal acceleration (toward center) ──────
    var ascale=8;
    var ae=Math.min(80,ac*ascale);
    simArrow(ctx,px,py,px+ax_dir*ae,py+ay_dir*ae,'#f87171',3,11);
    simText(ctx,'ac='+ac.toFixed(1)+'m/s²',px+ax_dir*(ae+8),py+ay_dir*(ae+8),'#f87171',9,undefined,true);

    // ── Right panel ───────────────────────────────────
    var PX2=W*0.70, PW2=W-PX2-10, PY2=10;
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.92)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(PX2,PY2,PW2,H-PY2-10,6); ctx.fill(); ctx.stroke(); ctx.restore();
    var PC=PX2+PW2/2;
    simText(ctx,'תנועה מעגלית',PC,PY2+14,'#22d3ee',10.5,undefined,true);
    ctx.save(); ctx.strokeStyle='#1e4060'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(PX2+6,PY2+20); ctx.lineTo(PX2+PW2-6,PY2+20); ctx.stroke(); ctx.restore();
    simText(ctx,'r = '+r.toFixed(1)+' m',PC,PY2+32,'#60a5fa',9.5,undefined,true);
    simText(ctx,'v = '+v.toFixed(1)+' m/s',PC,PY2+46,'#34d399',9.5,undefined,true);
    simText(ctx,'ω = '+omega.toFixed(2)+' rad/s',PC,PY2+60,'#a78bfa',9,undefined,true);
    simText(ctx,'T = '+T.toFixed(2)+' s',PC,PY2+74,'#fbbf24',9,undefined,true);
    ctx.save(); ctx.strokeStyle='#1e4060'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(PX2+6,PY2+80); ctx.lineTo(PX2+PW2-6,PY2+80); ctx.stroke(); ctx.restore();
    simText(ctx,'תאוצה צנטריפטלית:',PC,PY2+92,'#22d3ee',9,undefined,true);
    simText(ctx,'ac = v²/r',PC,PY2+106,'#f87171',10,undefined,true);
    simText(ctx,'= '+v.toFixed(1)+'²/'+r.toFixed(1),PC,PY2+120,'#94a3b8',8.5,undefined,true);
    simText(ctx,'= '+ac.toFixed(2)+' m/s²',PC,PY2+134,'#f87171',11,undefined,true);
    ctx.save(); ctx.strokeStyle='#1e4060'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(PX2+6,PY2+142); ctx.lineTo(PX2+PW2-6,PY2+142); ctx.stroke(); ctx.restore();
    simText(ctx,'כוח צנטריפטלי:',PC,PY2+154,'#22d3ee',9,undefined,true);
    simText(ctx,'Fc = m·ac',PC,PY2+168,'#a78bfa',10,undefined,true);
    simText(ctx,'כיוון: למרכז',PC,PY2+182,'#64748b',8.5,undefined,true);
    ctx.save(); ctx.strokeStyle='#1e4060'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(PX2+6,PY2+190); ctx.lineTo(PX2+PW2-6,PY2+190); ctx.stroke(); ctx.restore();
    simText(ctx,'θ = '+(theta%(2*Math.PI)*180/Math.PI).toFixed(0)+'°',PC,PY2+202,'#64748b',8.5,undefined,true);
    simText(ctx,'ω = v/r',PC,PY2+216,'#64748b',8,undefined,true);
    simText(ctx,'T = 2πr/v',PC,PY2+230,'#64748b',8,undefined,true);

    // Legend: v vs ac direction
    simText(ctx,'ירוק: מהירות (משיק)',PC,PY2+248,'#34d399',8,undefined,true);
    simText(ctx,'אדום: תאוצה (מרכז)',PC,PY2+260,'#f87171',8,undefined,true);
    simText(ctx,'90° זה לזה תמיד!',PC,PY2+272,'#fbbf24',8.5,undefined,true);

    // ── Top banner ────────────────────────────────────
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.92)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(8,6,W*0.62,44,6); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'תנועה מעגלית אחידה — ac = v²/r',W*0.31,20,'#22d3ee',11,undefined,true);
    simText(ctx,'המהירות תמיד משיקה למעגל | התאוצה תמיד מכוונת למרכז',W*0.31,36,'#94a3b8',8.5,undefined,true);

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}

// ─────────────────────────────────────────────────────────────
// ATWOOD MACHINE — standalone, physically correct
// m1 on left, m2 on right. If m2>m1: m2 goes down, m1 goes up.
// Physics: a=(m2-m1)g/(m1+m2), T=2m1m2g/(m1+m2)
// ─────────────────────────────────────────────────────────────
function simAtwood(canvas){
  const H=540; const {ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;
  const g=9.8;
  const PX=W*0.50, CEIL_Y=32, PR=18;
  var maxY=H-100;
  var y1=CEIL_Y+PR+8, y2=CEIL_Y+PR+8;  // TOP of each mass box
  var vel=0, pT=null;
  var running=false, started=false;

  function getM1(){var e=document.getElementById('inp-atw-m1'); return e?parseFloat(e.value):3;}
  function getM2(){var e=document.getElementById('inp-atw-m2'); return e?parseFloat(e.value):5;}

  function reset(){
    var m1=getM1(), m2=getM2();
    var heavier=Math.max(m1,m2);
    var bH=Math.max(36,heavier*6);
    // Start: both masses at top, just below pulley
