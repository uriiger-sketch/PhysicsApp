    y1=CEIL_Y+PR+6; y2=CEIL_Y+PR+6;
    vel=0; pT=null; running=false; started=false;
  }

  var resetBtn=document.getElementById('btn-atw-reset');
  if(resetBtn)resetBtn.addEventListener('click',function(){reset();});
  var launchBtn=document.getElementById('btn-atw-launch');
  if(launchBtn)launchBtn.addEventListener('click',function(){running=true;started=true;pT=null;});

  reset();

  function draw(ts){
    if(_simStop[id])return;
    var m1=getM1(), m2=getM2();
    var a=(m2-m1)*g/(m1+m2);   // positive → m2 goes down, m1 goes up
    var T=2*m1*m2*g/(m1+m2);

    // Box sizes proportional to mass
    var bW1=Math.max(46,m1*10), bH1=Math.max(36,m1*7);
    var bW2=Math.max(46,m2*10), bH2=Math.max(36,m2*7);

    if(running && pT!==null){
      var dt=Math.min((ts-pT)/1000,0.04);
      vel+=a*dt;
      // a>0: m2 heavier → y2 increases (down), y1 decreases (up)
      // a<0: m1 heavier → y1 increases (down), y2 decreases (up)
      y2+=vel*dt*50;
      y1-=vel*dt*50;

      // Clamp and bounce/reset at limits
      var topLimit=CEIL_Y+PR+4;
      var botLimit1=maxY-bH1, botLimit2=maxY-bH2;
      if(y2>=botLimit2 || y1>=botLimit1 || y1<=topLimit || y2<=topLimit){
        running=false;
      }
    }
    if(pT===null && running) pT=ts; else if(running) pT=ts;

    simBg(ctx,W,H);

    // Ceiling fixture
    ctx.save(); ctx.fillStyle='rgba(14,30,55,.95)'; ctx.strokeStyle='#3d6480'; ctx.lineWidth=1.5;
    ctx.fillRect(PX-62,0,124,CEIL_Y);
    for(var xi=PX-58;xi<PX+58;xi+=12){
      ctx.beginPath(); ctx.moveTo(xi,0); ctx.lineTo(xi-8,CEIL_Y); ctx.stroke();
    }
    ctx.restore();

    // Pulley
    ctx.save();
    ctx.strokeStyle='#60a5fa'; ctx.lineWidth=3.5;
    ctx.beginPath(); ctx.arc(PX,CEIL_Y+PR-4,PR,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle='#3b82f6'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(PX,CEIL_Y+PR-4,PR*0.5,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='#1e3a52';
    ctx.beginPath(); ctx.arc(PX,CEIL_Y+PR-4,5,0,Math.PI*2); ctx.fill();
    ctx.restore();

    var rope1X=PX-PR+4, rope2X=PX+PR-4;

    // Ropes from pulley down to top of each mass
    ctx.save(); ctx.strokeStyle='#94a3b8'; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(rope1X,CEIL_Y+PR+6); ctx.lineTo(rope1X,y1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(rope2X,CEIL_Y+PR+6); ctx.lineTo(rope2X,y2); ctx.stroke();
    ctx.restore();

    // Mass 1 (left)
    var x1L=rope1X-bW1/2;
    var grd1=ctx.createLinearGradient(x1L,y1,x1L,y1+bH1);
    grd1.addColorStop(0,'rgba(37,99,235,.92)'); grd1.addColorStop(1,'rgba(29,78,216,.65)');
    ctx.save(); ctx.shadowColor='rgba(59,130,246,.5)'; ctx.shadowBlur=14;
    drawBox(ctx,x1L,y1,bW1,bH1,grd1,'#60a5fa',2.5,6); ctx.restore();
    simText(ctx,'m\u2081',rope1X,y1+bH1/2-4,'#bfdbfe',13,undefined,true);
    simText(ctx,m1.toFixed(1)+' kg',rope1X,y1+bH1/2+13,'#93c5fd',10,undefined,true);

    // Mass 2 (right)
    var x2L=rope2X-bW2/2;
    var grd2=ctx.createLinearGradient(x2L,y2,x2L,y2+bH2);
    grd2.addColorStop(0,'rgba(185,28,28,.92)'); grd2.addColorStop(1,'rgba(153,27,27,.65)');
    ctx.save(); ctx.shadowColor='rgba(239,68,68,.5)'; ctx.shadowBlur=14;
    drawBox(ctx,x2L,y2,bW2,bH2,grd2,'#ef4444',2.5,6); ctx.restore();
    simText(ctx,'m\u2082',rope2X,y2+bH2/2-4,'#fecaca',13,undefined,true);
    simText(ctx,m2.toFixed(1)+' kg',rope2X,y2+bH2/2+13,'#fca5a5',10,undefined,true);

    // Force arrows: T (up) and W (down) on each mass
    var sc=0.55;
    var T_len=Math.min(T*sc,75);
    var W1_len=Math.min(m1*g*sc,75);
    var W2_len=Math.min(m2*g*sc,75);

    // T arrows (up from top of each mass)
    simArrow(ctx,rope1X,y1,rope1X,Math.max(CEIL_Y+PR+10,y1-T_len),'#34d399',2.5,11);
    simText(ctx,'T='+T.toFixed(1)+'N',x1L-6,y1-T_len-8,'#34d399',9,'right');
    simArrow(ctx,rope2X,y2,rope2X,Math.max(CEIL_Y+PR+10,y2-T_len),'#34d399',2.5,11);
    simText(ctx,'T='+T.toFixed(1)+'N',x2L+bW2+6,y2-T_len-8,'#34d399',9,'left');

    // W arrows (down from bottom of each mass)
    var w1bot=Math.min(y1+bH1+W1_len, H-6);
    var w2bot=Math.min(y2+bH2+W2_len, H-6);
    simArrow(ctx,rope1X,y1+bH1,rope1X,w1bot,'#ef4444',2.5,10);
    simText(ctx,'W\u2081='+(m1*g).toFixed(0)+'N',x1L-6,w1bot+10,'#fca5a5',9,'right');
    simArrow(ctx,rope2X,y2+bH2,rope2X,w2bot,'#ef4444',2.5,10);
    simText(ctx,'W\u2082='+(m2*g).toFixed(0)+'N',x2L+bW2+6,w2bot+10,'#fca5a5',9,'left');

    // Acceleration arrows on the sides
    if(Math.abs(a)>0.05 && running){
      var aLen=Math.min(Math.abs(a)*18,50);
      // m1 side: if a>0 (m2 heavier) m1 goes UP → arrow up (negative y dir)
      var dir1=a>0?-1:1;
      var dir2=-dir1;
      simArrow(ctx,x1L-22,y1+bH1/2,x1L-22,y1+bH1/2+dir1*aLen,'#22d3ee',2.5,10);
      simText(ctx,'a='+Math.abs(a).toFixed(2)+' m/s\u00b2',x1L-24,y1+bH1/2+dir1*(aLen+14),'#22d3ee',8.5,'right');
      simArrow(ctx,x2L+bW2+22,y2+bH2/2,x2L+bW2+22,y2+bH2/2+dir2*aLen,'#22d3ee',2.5,10);
      simText(ctx,'a='+Math.abs(a).toFixed(2)+' m/s\u00b2',x2L+bW2+24,y2+bH2/2+dir2*(aLen+14),'#22d3ee',8.5,'left');
    }

    // Info panel at bottom
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.93)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(W/2-168,H-118,336,108,8); ctx.fill(); ctx.stroke(); ctx.restore();

    simText(ctx,'a = (m\u2082\u2212m\u2081)g / (m\u2081+m\u2082)',W/2,H-104,'#94a3b8',9.5,undefined,true);
    var a_sign=a>=0?'+':'';
    simText(ctx,'= ('+m2.toFixed(1)+'\u2212'+m1.toFixed(1)+')\u00d79.8 / ('+m1.toFixed(1)+'+'+m2.toFixed(1)+') = '+a_sign+a.toFixed(3)+' m/s\u00b2',W/2,H-86,'#fbbf24',10.5,undefined,true);
    simText(ctx,'T = 2m\u2081m\u2082g/(m\u2081+m\u2082) = '+T.toFixed(2)+' N',W/2,H-64,'#34d399',11.5,undefined,true);
    var dir_str=a>0.02?'m\u2082 \u05d9\u05d5\u05e8\u05d3  \u2192  m\u2081 \u05e2\u05d5\u05dc\u05d4':a<-0.02?'m\u2081 \u05d9\u05d5\u05e8\u05d3  \u2192  m\u2082 \u05e2\u05d5\u05dc\u05d4':'\u05e9\u05d9\u05d5\u05d5\u05d9 \u05de\u05e9\u05e7\u05dc \u2014 m\u2081=m\u2082';
    simText(ctx,dir_str,W/2,H-42,Math.abs(a)>0.02?'#fbbf24':'#34d399',11.5,undefined,true);
    var status=!started?'לחץ ▶ שחרר! כדי להתחיל':running?'שנה m₁,m₂ — לחץ אפס לחזרה':'הסימולציה הסתיימה — לחץ אפס';
    simText(ctx,status,W/2,H-22,!started?'#fbbf24':running?'#334e68':'#ef4444',8.5,undefined,false);

    requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);
}




function simEnergyKinetic(canvas){
  // PEDAGOGY: Work-Energy Theorem — W = F·d = ΔKE
  // Block pushed by F over distance d. Student sees:
  //  - KE building: ½mv² growing
  //  - W = area under F(d) = rectangle (F=const)
  //  - KE(d) graph — parabola: KE = ½m*(2F/m*d) = F*d ✓
  //  - At the end (wall) block stops and energy panel shows final values
  const H=510; const {ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;
  var pT=null;
  var m=2, F_val=10;
  var FLOOR_Y=H*0.46;
  var WALL_X=W-30; // right wall
  var BLOCK_W=56, BLOCK_H=44;
  var START_X=50+BLOCK_W/2;
  var PX_PER_M=60; // 1 m = 60 px
  // Block state
  var bx=START_X; // center x
  var vel=0;
  var launched=false, stopped=false;
  // Record data
  var keArr=[], dArr=[], wArr=[];
  var MAX_D=(WALL_X-20-BLOCK_W/2-START_X)/PX_PER_M; // max metres before wall

  function getF(){var e=document.getElementById('inp-ek-F'); return e?parseFloat(e.value):F_val;}
  function getM(){var e=document.getElementById('inp-ek-m'); return e?parseFloat(e.value):m;}

  var F_locked=F_val, m_locked=m; // locked at launch time
  function doLaunch(){
    F_locked=getF(); m_locked=getM();
    F_val=F_locked; m=m_locked;
    bx=START_X;vel=0;launched=true;stopped=false;keArr=[];dArr=[];wArr=[];
  }
  function doReset(){bx=START_X;vel=0;launched=false;stopped=false;keArr=[];dArr=[];wArr=[];pT=null;}

  var launchBtn=document.getElementById('btn-ek-launch');
  var resetBtn=document.getElementById('btn-ek-reset');
  if(launchBtn)launchBtn.addEventListener('click',doLaunch);
  if(resetBtn)resetBtn.addEventListener('click',doReset);

  function draw(ts){
    if(_simStop[id])return;
    if(!pT)pT=ts;
    var dt=Math.min((ts-pT)/1000,0.04); pT=ts;
    // Only update F/m when not actively running (prevents mid-run corruption)
    if(!launched || stopped){ F_val=getF(); m=getM(); }
    else { F_val=F_locked; m=m_locked; }

    if(launched && !stopped){
      // F = const, a = F/m, frictionless
      var a=F_val/m;
      vel+=a*dt;
      bx+=vel*dt*PX_PER_M;
      var d=(bx-START_X)/PX_PER_M;
      var KE_now=0.5*m*vel*vel;
      var W_now=F_val*d;
      keArr.push(KE_now); dArr.push(d); wArr.push(W_now);
      if(keArr.length>400){keArr.shift();dArr.shift();wArr.shift();}
      // Hit wall
      if(bx+BLOCK_W/2>=WALL_X-8){
        bx=WALL_X-8-BLOCK_W/2;
        vel=0; stopped=true;
      }
    }

    var d_cur=(bx-START_X)/PX_PER_M;
    var KE_cur=0.5*m*vel*vel;
    var W_cur=F_val*d_cur;

    simBg(ctx,W,H);

    // ── Floor
    ctx.save();ctx.fillStyle='#0a1c2e';ctx.fillRect(0,FLOOR_Y,W,16);ctx.restore();
    ctx.save();ctx.strokeStyle='#22d3ee';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(0,FLOOR_Y);ctx.lineTo(W,FLOOR_Y);ctx.stroke();ctx.restore();

    // ── Right wall
    ctx.save();ctx.fillStyle='rgba(30,64,95,.9)';ctx.strokeStyle='#3d6480';ctx.lineWidth=2;
    ctx.fillRect(WALL_X,FLOOR_Y-80,20,80); ctx.strokeRect(WALL_X,FLOOR_Y-80,20,80);
    ctx.restore();

    // ── Distance ruler ticks on floor
    for(var xi=0;xi*PX_PER_M<W-60;xi++){
      var rx=START_X+xi*PX_PER_M;
      if(rx>WALL_X)break;
      ctx.save();ctx.strokeStyle='rgba(30,58,82,.6)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(rx,FLOOR_Y);ctx.lineTo(rx,FLOOR_Y+9);ctx.stroke();
      simText(ctx,xi+'m',rx,FLOOR_Y+18,'#1e3a52',7,undefined,true);
      ctx.restore();
    }

    // ── Work area shading (under the applied force = rectangle)
    if(launched){
      ctx.save();ctx.fillStyle='rgba(34,211,153,.07)';
      ctx.fillRect(START_X,FLOOR_Y-BLOCK_H-8,bx-BLOCK_W/2-START_X,BLOCK_H+8);ctx.restore();
      // Work rectangle border
      ctx.save();ctx.strokeStyle='rgba(34,211,153,.25)';ctx.lineWidth=1;ctx.setLineDash([3,5]);
      ctx.beginPath();ctx.moveTo(START_X,FLOOR_Y-BLOCK_H/2-10);ctx.lineTo(bx-BLOCK_W/2,FLOOR_Y-BLOCK_H/2-10);ctx.stroke();
      ctx.setLineDash([]);ctx.restore();
    }

    // ── Block
    var bY=FLOOR_Y-BLOCK_H;
    var spd=Math.abs(vel);
    var bCol=stopped?'#475569':spd>0.1?'#f59e0b':'#475569';
    ctx.save();ctx.shadowColor=bCol;ctx.shadowBlur=spd>0.1&&!stopped?12:4;
    ctx.fillStyle=bCol+'cc';ctx.strokeStyle=bCol;ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(bx-BLOCK_W/2,bY,BLOCK_W,BLOCK_H,5);ctx.fill();ctx.stroke();
    ctx.shadowBlur=0;ctx.restore();
    simText(ctx,m.toFixed(1)+' kg',bx,bY+BLOCK_H/2+4,'#fff',9.5,undefined,true);

    // ── Force arrow (applied from behind block)
    if(launched && !stopped){
      var arLen=Math.min(65,F_val*2.2);
      simArrow(ctx,bx-BLOCK_W/2-6-arLen,bY+BLOCK_H/2,bx-BLOCK_W/2-6,bY+BLOCK_H/2,'#34d399',3,12);
      simText(ctx,'F='+F_val.toFixed(0)+'N',bx-BLOCK_W/2-6-arLen/2,bY+BLOCK_H/2-14,'#34d399',9,undefined,true);
    }
    // ── Velocity arrow
    if(spd>0.05 && !stopped){
      var vLen=Math.min(75,spd*15);
      simArrow(ctx,bx+BLOCK_W/2+4,bY+BLOCK_H/2,bx+BLOCK_W/2+4+vLen,bY+BLOCK_H/2,'#22d3ee',2.5,10);
      simText(ctx,'v='+vel.toFixed(2)+'m/s',bx+BLOCK_W/2+vLen+8,bY+BLOCK_H/2-8,'#22d3ee',8.5,'left');
    }

    // ── Top formula panel
    ctx.save();ctx.fillStyle='rgba(6,14,28,.92)';ctx.strokeStyle='#1e4060';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.roundRect(8,6,W-16,52,6);ctx.fill();ctx.stroke();ctx.restore();
    simText(ctx,'משפט עבודה-אנרגיה:  W = F·d = ΔKE',W/2,20,'#22d3ee',11,undefined,true);
    simText(ctx,'W = '+F_val.toFixed(0)+'×'+d_cur.toFixed(2)+'m = '+W_cur.toFixed(2)+' J',W/2,34,'#34d399',9.5,undefined,true);
    simText(ctx,'KE = ½mv² = ½×'+m.toFixed(1)+'×'+vel.toFixed(2)+'² = '+KE_cur.toFixed(2)+' J  | ΔKE = '+KE_cur.toFixed(2)+' J',W/2,48,'#fbbf24',9,undefined,true);

    // ── KE(d) graph
    var GX=8,GY=FLOOR_Y+24,GW=W-16,GH=H-GY-10;
    ctx.save();ctx.fillStyle='rgba(6,14,28,.88)';ctx.strokeStyle='#1e3a52';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(GX,GY,GW,GH,4);ctx.fill();ctx.stroke();ctx.restore();
    simText(ctx,'KE כפונקציה של מרחק d — שיפוע הגרף = כוח F (W=F·d)',GX+GW/2,GY+10,'#64748b',8,undefined,true);

    if(keArr.length>2){
      var xMax=Math.max(MAX_D,0.5);
      var kMax=Math.max(F_val*MAX_D*1.05,1);
      var gAX=GX+30,gAY=GY+GH-18,gW2=GW-40,gH2=GH-28;
      // Axes
      ctx.save();ctx.strokeStyle='#1e3a52';ctx.lineWidth=1.2;
      ctx.beginPath();ctx.moveTo(gAX,gAY-gH2);ctx.lineTo(gAX,gAY);ctx.lineTo(gAX+gW2,gAY);ctx.stroke();
      // Arrow heads
      simArrow(ctx,gAX,gAY-gH2+2,gAX,gAY-gH2-4,'#334155',1,6);
      simArrow(ctx,gAX+gW2-2,gAY,gAX+gW2+6,gAY,'#334155',1,6);
      simText(ctx,'d (m)',gAX+gW2+8,gAY+3,'#334155',7,'left');
      simText(ctx,'KE (J)',gAX-4,gAY-gH2-6,'#334155',7,'right');
      ctx.restore();
      // Axis labels
      for(var di=0;di<=Math.floor(xMax);di++){
        var lx=gAX+di/xMax*gW2;
        simText(ctx,di,lx,gAY+10,'#1e3a52',6.5,undefined,true);
      }
      // Theoretical line KE = F*d  (linear, slope=F)
      ctx.save();ctx.strokeStyle='rgba(34,211,153,.3)';ctx.lineWidth=1.5;ctx.setLineDash([4,5]);
      ctx.beginPath();ctx.moveTo(gAX,gAY);
      ctx.lineTo(gAX+xMax/xMax*gW2,gAY-(F_val*xMax/kMax)*gH2);
      ctx.stroke();ctx.setLineDash([]);ctx.restore();
      simText(ctx,'W=F·d',gAX+gW2-4,gAY-(F_val*xMax/kMax)*gH2-5,'rgba(52,211,153,.5)',7,'right');
      // Actual data
      ctx.save();ctx.strokeStyle='#fbbf24';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.beginPath();
      for(var i=0;i<dArr.length;i++){
        var px=gAX+dArr[i]/xMax*gW2;
        var py=gAY-(keArr[i]/kMax)*gH2;
        py=Math.max(gAY-gH2,py);
        i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
      }
      ctx.stroke();ctx.restore();
      // Current point dot
      if(d_cur>0.01){
        var dpx=gAX+d_cur/xMax*gW2;
        var dpy=Math.max(gAY-gH2,gAY-(KE_cur/kMax)*gH2);
        ctx.save();ctx.fillStyle='#fbbf24';ctx.strokeStyle='#fff';ctx.lineWidth=1.5;
        ctx.beginPath();ctx.arc(dpx,dpy,5,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();
        simText(ctx,'('+d_cur.toFixed(1)+','+KE_cur.toFixed(1)+')',dpx+8,dpy-4,'#fbbf24',7.5,'left');
      }
    } else {
      simText(ctx,'לחץ ▶ הפעל להתחלת הסימולציה',GX+GW/2,GY+GH/2,'#1e3a52',9.5,undefined,true);
    }

    // Stopped banner
    if(stopped){
      ctx.save();ctx.fillStyle='rgba(99,102,241,.15)';ctx.strokeStyle='#818cf8';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.roundRect(W/2-120,bY-14,240,26,5);ctx.fill();ctx.stroke();ctx.restore();
      simText(ctx,'עצר! W_כולל = '+W_cur.toFixed(2)+' J = KE_סופי ✅',W/2,bY-1,'#a78bfa',9,undefined,true);
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}

function simEnergyPotential(canvas){
  const H=510; const {ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;
  let pT=null;
  var m=2, g=9.8;
  var GROUND_Y=H-52;
  var BALL_R=22;
  var FLOOR_POS=GROUND_Y-BALL_R; // y of ball center when touching floor
  var PX_PER_M=62;
  var objY=H*0.22; // ball center Y
  var vel=0;       // canvas pixels/s, downward = positive
  var dragging=false;
  // Show elastic PE bar toggle
  var showElasticBar=false;
  // Brief contact animation: when ball hits floor, compress for ~60ms visually
  var contactTimer=0; // seconds since contact started, 0 = no contact
  var contactVelOut=0; // velocity magnitude going back up
  var CONTACT_DUR=0.06; // visual duration of elastic compression

  function getM(){var e=document.getElementById('inp-ep-m'); return e?parseFloat(e.value):m;}
  function getG(){var e=document.getElementById('inp-ep-g'); return e?parseFloat(e.value):g;}

  function getCanvasY(ev){
    var r=canvas.getBoundingClientRect();
    return ((ev.touches?ev.touches[0].clientY:ev.clientY)-r.top)*(canvas.height/dpr/r.height);
  }
  function onDown(ev){ev.preventDefault(); var cy=getCanvasY(ev); if(Math.abs(cy-objY)<BALL_R+10){dragging=true;vel=0;contactTimer=0;}}
  function onMove(ev){if(!dragging)return;ev.preventDefault();objY=Math.max(BALL_R+8,Math.min(FLOOR_POS-2,getCanvasY(ev)));vel=0;}
  function onUp(){dragging=false;}
  canvas.addEventListener('mousedown',onDown);canvas.addEventListener('touchstart',onDown,{passive:false});
  canvas.addEventListener('mousemove',onMove);canvas.addEventListener('touchmove',onMove,{passive:false});
  canvas.addEventListener('mouseup',onUp);canvas.addEventListener('touchend',onUp);

  var elasticBtn=document.getElementById('btn-ep-elastic');
  if(elasticBtn){
    elasticBtn.textContent='🟢 הצג אנרגיה אלסטית';
    elasticBtn.addEventListener('click',function(){
      showElasticBar=!showElasticBar;
      elasticBtn.textContent=showElasticBar?'🔴 הסתר אנרגיה אלסטית':'🟢 הצג אנרגיה אלסטית';
    });
  }
  var resetBtn=document.getElementById('btn-ep-reset');
  if(resetBtn) resetBtn.addEventListener('click',function(){objY=H*0.22;vel=0;contactTimer=0;});

  function draw(ts){
    if(_simStop[id])return;
    if(!pT)pT=ts;
    var dt=Math.min((ts-pT)/1000,0.025); pT=ts;
    m=getM(); g=getG();

    if(!dragging){
      if(contactTimer<=0){
        // Free motion (gravity only)
        vel+=g*PX_PER_M*dt;
        objY+=vel*dt;
        // Hit floor
        if(objY>=FLOOR_POS){
          objY=FLOOR_POS;
          contactVelOut=Math.abs(vel); // store for elastic rebound
          vel=0;
          contactTimer=dt; // start contact phase
        }
      } else {
        // Contact phase: animate a quick compression + rebound
        contactTimer+=dt;
        if(contactTimer>=CONTACT_DUR){
          // Rebound: perfectly elastic, same speed upward
          vel=-contactVelOut;
          objY=FLOOR_POS;
          contactTimer=0;
        }
      }
      if(objY<BALL_R+4)objY=BALL_R+4;
    }

    // Energies
    var h_px=Math.max(0,FLOOR_POS-objY);
    var h=h_px/PX_PER_M;
    var vel_ms=vel/PX_PER_M;
    var PE=m*g*h;
    var KE=0.5*m*vel_ms*vel_ms;
    // Elastic PE: during contact phase, treat as energy stored in floor spring
    // E_elastic = total_E - PE - KE at contact start = total mechanical energy
    // We fake it cleanly: contact fraction goes from 0→1→0 as a cosine
    var totalE=m*g*Math.max(0,FLOOR_POS-(H*0.22))/PX_PER_M; // conserved total
    // Better: E_elastic = kinetic energy transferred to floor spring (goes from KE_impact→0→KE_impact)
    var contactFrac=contactTimer>0?Math.sin(Math.PI*contactTimer/CONTACT_DUR):0;
    var E_elastic=contactTimer>0?0.5*m*Math.pow(contactVelOut/PX_PER_M,2)*contactFrac*contactFrac:0;
    var E_tot_display=PE+KE+E_elastic;

    simBg(ctx,W,H);

    // Ground
    ctx.save();ctx.fillStyle='#0f2035';ctx.fillRect(0,GROUND_Y,W,H-GROUND_Y);ctx.restore();
    ctx.save();ctx.strokeStyle='#2d5275';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,GROUND_Y);ctx.lineTo(W,GROUND_Y);ctx.stroke();ctx.restore();
    simText(ctx,'h=0 (אפס פוטנציאל)',W/2,GROUND_Y+12,'#1e3a52',8,undefined,true);

    // Visual floor compression during contact
    if(contactTimer>0){
      var comprPx=Math.round(6*contactFrac);
      ctx.save();ctx.strokeStyle='#34d399';ctx.lineWidth=2;ctx.setLineDash([2,3]);
      for(var xi3=W*0.25;xi3<W*0.55;xi3+=14){
        ctx.beginPath();ctx.moveTo(xi3,GROUND_Y);ctx.lineTo(xi3+comprPx,GROUND_Y+comprPx+2);ctx.stroke();
      }
      ctx.setLineDash([]);ctx.restore();
    }

    // Height ruler
    var RX=32;
    ctx.save();ctx.strokeStyle='#1e3a52';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(RX,GROUND_Y);ctx.lineTo(RX,44);ctx.stroke();ctx.restore();
    for(var yi=0;yi<=5;yi++){
      var ry=GROUND_Y-yi*PX_PER_M;
      if(ry<42)break;
      ctx.save();ctx.strokeStyle='#1e3a52';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(RX-5,ry);ctx.lineTo(RX+5,ry);ctx.stroke();
      simText(ctx,yi+'m',RX-10,ry+3,'#334155',7.5,'right');ctx.restore();
    }

    // h arrow
    if(h>0.04){
      ctx.save();ctx.strokeStyle='rgba(251,191,36,.3)';ctx.lineWidth=1;ctx.setLineDash([3,5]);
      ctx.beginPath();ctx.moveTo(RX+10,objY);ctx.lineTo(W*0.55,objY);ctx.stroke();ctx.setLineDash([]);ctx.restore();
      simArrow(ctx,RX+10,FLOOR_POS,RX+10,objY,'rgba(251,191,36,.5)',1.5,6);
      simText(ctx,'h='+h.toFixed(2)+'m',RX+20,(FLOOR_POS+objY)/2,'#fbbf24',8.5,'left');
    }

    // Ball — slightly squash during contact
    var ballX=W*0.38;
    var scaleY=contactTimer>0?(1-0.25*contactFrac):1;
    var scaleX=contactTimer>0?(1+0.18*contactFrac):1;
    var spd2=Math.abs(vel_ms);
    var ballCol=contactTimer>0?'#34d399':dragging?'#a78bfa':spd2>1?'#ef4444':'#3b82f6';
    ctx.save();ctx.translate(ballX,objY);ctx.scale(scaleX,scaleY);
    ctx.shadowColor=ballCol;ctx.shadowBlur=dragging?18:6;
    ctx.fillStyle=ballCol+'cc';ctx.strokeStyle=ballCol;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(0,0,BALL_R,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.shadowBlur=0;ctx.restore();
    simText(ctx,m.toFixed(1)+' kg',ballX,objY+4,'#fff',9,undefined,true);

    // v arrow
    if(spd2>0.1&&!dragging&&contactTimer<=0){
      var vDir2=vel>0?1:-1;
      simArrow(ctx,ballX+BALL_R+4,objY,ballX+BALL_R+4,objY+vDir2*Math.min(46,spd2*18),'#22d3ee',2,8);
    }

    // ── Energy bars
    var BX=W*0.63, BY=58, BW=24, BH=190;
    // determine how many bars
    var numBars=showElasticBar?3:2;
    var totalBarW=BW*numBars+(numBars-1)*10;
    var panW=totalBarW+50;
    ctx.save();ctx.fillStyle='rgba(6,14,28,.92)';ctx.strokeStyle='#1e4060';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.roundRect(BX-14,BY-32,panW,BH+72,7);ctx.fill();ctx.stroke();ctx.restore();
    simText(ctx,'אנרגיה (J)',BX+panW/2-14,BY-18,'#22d3ee',9,undefined,true);

    // Emax: use initial drop height energy
    var h_max=(FLOOR_POS-(BALL_R+8))/PX_PER_M;
    var Emax=Math.max(m*g*h_max,E_tot_display,0.1);

    function drawBar2(x,E,col,lbl){
      var bh=Math.min(BH,Math.max(0,(E/Emax)*BH));
      ctx.save();ctx.fillStyle=col+'aa';
      ctx.beginPath();ctx.roundRect(x,BY+BH-bh,BW,bh,3);ctx.fill();
      ctx.strokeStyle=col;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.roundRect(x,BY,BW,BH,3);ctx.stroke();ctx.restore();
      simText(ctx,lbl,x+BW/2,BY+BH+14,col,8,undefined,true);
      simText(ctx,E.toFixed(2),x+BW/2,BY+BH+26,col,7.5,undefined,true);
    }

    drawBar2(BX,PE,'#fbbf24','EP');
    drawBar2(BX+BW+10,KE,'#34d399','EK');
    if(showElasticBar) drawBar2(BX+(BW+10)*2,E_elastic,'#a78bfa','Eאל');

    // E_total line
    var etH=Math.min(BH,(E_tot_display/Emax)*BH);
    ctx.save();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(BX-4,BY+BH-etH);ctx.lineTo(BX+panW-28,BY+BH-etH);ctx.stroke();
    ctx.setLineDash([]);ctx.restore();
    simText(ctx,'E='+E_tot_display.toFixed(2)+'J',BX+panW/2-14,BY+BH-etH-7,'#fff',7.5,undefined,true);

    // Formula panel
    ctx.save();ctx.fillStyle='rgba(6,14,28,.92)';ctx.strokeStyle='#1e4060';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.roundRect(8,6,W*0.55,54,6);ctx.fill();ctx.stroke();ctx.restore();
    simText(ctx,'EP = mgh = '+m.toFixed(1)+'×'+g.toFixed(1)+'×'+h.toFixed(2)+' = '+PE.toFixed(2)+' J',W*0.275,20,'#fbbf24',9.5,undefined,true);
    simText(ctx,'EK = ½mv² = ½×'+m.toFixed(1)+'×'+spd2.toFixed(2)+'² = '+KE.toFixed(2)+' J',W*0.275,34,'#34d399',9.5,undefined,true);
    simText(ctx,showElasticBar?'Eאל='+E_elastic.toFixed(2)+' J  |  E=EP+EK+Eאל='+E_tot_display.toFixed(2)+' J':'E = EP + EK = '+E_tot_display.toFixed(2)+' J  (שמור)',W*0.275,48,'#94a3b8',8,undefined,true);

    if(dragging) simText(ctx,'שחרר לנפילה',ballX,objY-BALL_R-14,'#fbbf24',8.5,undefined,true);

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}

function simSHMDef(canvas){
  // SECTION: shm.shm-def — תנודות ומחזוריות
  // PEDAGOGY: Core SHM concepts: amplitude A, period T, frequency f=1/T, angular frequency ω.
  // Interactive oscillating dot on a sinusoidal path, live x(t) trace building.
  // Student changes A and T. Shows the pure mathematical wave.
  const H=490; const {ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;
  let pT=null, t=0;
  var A=80, T=2.0; // amplitude (px on screen), period (seconds)
  var phase=0;
  var xHist=[], tHist=[], maxHist=500;

  function getA(){var e=document.getElementById('inp-shm-A'); return e?parseFloat(e.value):A;}
  function getT(){var e=document.getElementById('inp-shm-T'); return e?parseFloat(e.value):T;}

  var resetBtn=document.getElementById('btn-shm-reset');
  if(resetBtn)resetBtn.addEventListener('click',function(){phase=0;xHist=[];tHist=[];t=0;});

  var CY=H*0.38; // center y of oscillation display
  var DOT_X=W*0.32; // x position of oscillating dot

  function draw(ts){
    if(_simStop[id])return;
    if(!pT)pT=ts; var dt=Math.min((ts-pT)/1000,0.04); pT=ts;
    t+=dt; A=getA(); T=getT();
    var omega=2*Math.PI/T;
    var x_m=A*Math.sin(omega*t); // displacement in screen px
    var v_m=A*omega*Math.cos(omega*t);
    var a_m=-A*omega*omega*Math.sin(omega*t);
    xHist.push(x_m); tHist.push(t);
    if(xHist.length>maxHist){xHist.shift();tHist.shift();}

    simBg(ctx,W,H);

    // ── Equilibrium and amplitude markers ─────────────
    ctx.save(); ctx.strokeStyle='rgba(34,211,153,.3)'; ctx.lineWidth=1; ctx.setLineDash([4,6]);
    ctx.beginPath(); ctx.moveTo(40,CY); ctx.lineTo(W*0.48,CY); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
    simText(ctx,'שיווי משקל',44,CY-6,'rgba(34,211,153,.5)',7.5,'left');
    // Amplitude lines
    ctx.save(); ctx.strokeStyle='rgba(251,191,36,.2)'; ctx.lineWidth=1; ctx.setLineDash([2,5]);
    ctx.beginPath(); ctx.moveTo(40,CY-A); ctx.lineTo(W*0.48,CY-A); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(40,CY+A); ctx.lineTo(W*0.48,CY+A); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
    // A arrows
    simArrow(ctx,26,CY,26,CY-A,'#fbbf24',2,8);
    simArrow(ctx,26,CY,26,CY+A,'#fbbf24',2,8);
    simText(ctx,'A',18,CY-A/2,'#fbbf24',9,'center');
    simText(ctx,'A',18,CY+A/2,'#fbbf24',9,'center');
    // Track line
    ctx.save(); ctx.strokeStyle='rgba(30,58,82,.5)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(DOT_X,CY-A-14); ctx.lineTo(DOT_X,CY+A+14); ctx.stroke(); ctx.restore();
    // Ceiling mount + spring down to the mass (the restoring force made visible)
    var mountY=Math.max(14,CY-A-34);
    ctx.save(); ctx.fillStyle='#1e3a52'; ctx.fillRect(DOT_X-26,mountY-10,52,10);
    ctx.strokeStyle='#0f2035';ctx.lineWidth=1.5;
    for(var hi=DOT_X-24;hi<DOT_X+24;hi+=8){ctx.beginPath();ctx.moveTo(hi,mountY-10);ctx.lineTo(hi+6,mountY-16);ctx.stroke();}
    ctx.restore();
    var sprEnd=CY+x_m-20;
    var sprCol=x_m>4?'#f87171':x_m<-4?'#60a5fa':'#a78bfa';
    ctx.save(); ctx.strokeStyle=sprCol; ctx.lineWidth=2; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(DOT_X,mountY);
    var coils=10,sLen=Math.max(10,sprEnd-mountY);
    for(var ci3=0;ci3<coils;ci3++){
      ctx.lineTo(DOT_X+(ci3%2?11:-11),mountY+sLen*(ci3+0.5)/coils);
    }
    ctx.lineTo(DOT_X,sprEnd); ctx.stroke(); ctx.restore();

    // Moving dot
    var dotY=CY+x_m;
    var vFrac=Math.abs(v_m)/(A*omega);
    var dotCol='rgba('+Math.round(59+196*vFrac)+','+Math.round(130-30*vFrac)+','+Math.round(246-150*vFrac)+',0.9)';
    ctx.save(); ctx.shadowColor=dotCol; ctx.shadowBlur=14;
    ctx.fillStyle=dotCol; ctx.strokeStyle='#93c5fd'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(DOT_X,dotY,20,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.shadowBlur=0; ctx.restore();
    simText(ctx,'m',DOT_X,dotY+4,'#fff',9,undefined,true);
    // Ghost outlines at the two extremes (where v=0)
    [CY-A,CY+A].forEach(function(ey){
      ctx.save();ctx.globalAlpha=0.2;ctx.strokeStyle='#fbbf24';ctx.lineWidth=1.5;ctx.setLineDash([3,4]);
      ctx.beginPath();ctx.arc(DOT_X,ey,20,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.restore();
    });
    // Flash ring at the turning points (v→0, |a| max)
    if(Math.abs(x_m)>A*0.96){
      ctx.save();ctx.globalAlpha=0.55;ctx.strokeStyle='#fbbf24';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(DOT_X,dotY,26+(Math.abs(x_m)-A*0.96)*2,0,Math.PI*2);ctx.stroke();ctx.restore();
      simText(ctx,'v=0, |a| מקסימלי!',DOT_X+34,dotY,'#fbbf24',8.5,'left');
    }

    // Velocity arrow
    if(Math.abs(v_m)>2){
      var vDir=Math.sign(v_m);
      var vLen=Math.min(55,Math.abs(v_m)*0.4);
      simArrow(ctx,DOT_X+26,dotY,DOT_X+26,dotY+vDir*vLen,'#22d3ee',2.5,9);
      simText(ctx,'v',DOT_X+38,dotY+vDir*vLen/2,'#22d3ee',8.5,'left');
    }
    // Acceleration arrow  
    if(Math.abs(a_m)>2){
      var aDir=Math.sign(a_m);
      var aLen=Math.min(45,Math.abs(a_m)*0.12);
      simArrow(ctx,DOT_X-28,dotY,DOT_X-28,dotY+aDir*aLen,'#f87171',2.5,9);
      simText(ctx,'a',DOT_X-42,dotY+aDir*aLen/2,'#f87171',8.5,'right');
    }

    // ── x(t) sine wave graph ──────────────────────────
    var GX=W*0.50, GY=30, GW=W-GX-12, GH=H*0.54;
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.9)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(GX,GY,GW,GH,6); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'x(t) = A·sin(ωt)',GX+GW/2,GY+12,'#22d3ee',9.5,undefined,true);
    var gCY=GY+GH/2+6, gAX=GX+6, gAW=GW-12;
    ctx.save(); ctx.strokeStyle='#1e3a52'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(gAX,gCY); ctx.lineTo(gAX+gAW,gCY); ctx.stroke(); ctx.restore();
    // Draw sine trace
    var tSpan=T*2.5; var tStart=Math.max(0,t-tSpan);
    if(tHist.length>2){
      ctx.save(); ctx.strokeStyle='#60a5fa'; ctx.lineWidth=2;
      ctx.beginPath();
      for(var i=0;i<xHist.length;i++){
        var tAge=tHist[i]-tStart;
        if(tAge<0)continue;
        var px=gAX+gAW*(tAge/tSpan);
        var py=gCY-(xHist[i]/Math.max(A,1))*(GH/2-16);
        py=Math.max(GY+14,Math.min(GY+GH-6,py));
        i===0||tHist[i-1]<tStart?ctx.moveTo(px,py):ctx.lineTo(px,py);
      }
      ctx.stroke(); ctx.restore();
      // Current point dot
      var cpx=gAX+gAW*(Math.min(t-tStart,tSpan)/tSpan);
      ctx.save(); ctx.fillStyle='#fbbf24'; ctx.strokeStyle='#030c15'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(Math.min(gAX+gAW,cpx),gCY-(x_m/Math.max(A,1))*(GH/2-16),5,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.restore();
    }
    simText(ctx,'t (s) →',gAX+gAW-2,gCY+10,'#3d6480',7,'right');
    simText(ctx,'x ↑',gAX+2,gCY-GH/2+8,'#a78bfa',7,'center');
    // T markers
    for(var ti=1;ti*T<=tSpan;ti++){
      var tp=gAX+(ti*T/tSpan)*gAW;
      ctx.save(); ctx.strokeStyle='rgba(167,139,250,.4)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(tp,gCY-4); ctx.lineTo(tp,gCY+4); ctx.stroke(); ctx.restore();
      simText(ctx,ti+'T',tp,gCY+14,'rgba(167,139,250,.5)',7.5,undefined,true);
    }

    // Info panel
    var PY=GY+GH+8, PH=H-PY-8;
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.92)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(GX,PY,GW,PH,6); ctx.fill(); ctx.stroke(); ctx.restore();
    var PC=GX+GW/2;
    simText(ctx,'A = '+A.toFixed(0)+' (אמפליטודה)',PC,PY+13,'#fbbf24',9,undefined,true);
    simText(ctx,'T = '+T.toFixed(2)+' s (מחזור)',PC,PY+27,'#a78bfa',9,undefined,true);
    simText(ctx,'f = '+(1/T).toFixed(2)+' Hz (תדירות)',PC,PY+41,'#22d3ee',9,undefined,true);
    simText(ctx,'ω = '+(2*Math.PI/T).toFixed(2)+' rad/s',PC,PY+55,'#34d399',9,undefined,true);

    // Left info panel
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.92)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(8,6,W*0.46,H-14,6); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'תנועה הרמונית פשוטה',W*0.23,20,'#22d3ee',10.5,undefined,true);
    simText(ctx,'x(t) = A·sin(ωt)',W*0.23,36,'#fbbf24',10,undefined,true);
    simText(ctx,'x = '+(x_m/50).toFixed(2)+' (יחסי)',W*0.23,52,'#60a5fa',8.5,undefined,true);
    simText(ctx,'v = '+(v_m/50).toFixed(2)+'·A·ω',W*0.23,66,'#22d3ee',8.5,undefined,true);
    simText(ctx,'a = '+(a_m/50).toFixed(2)+'·Aω²',W*0.23,80,'#f87171',8.5,undefined,true);
    ctx.save(); ctx.strokeStyle='#1e4060'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(16,86); ctx.lineTo(W*0.46-8,86); ctx.stroke(); ctx.restore();
    simText(ctx,'במקסימום (x=±A):',W*0.23,99,'#94a3b8',8.5,undefined,true);
    simText(ctx,'v=0, |a|=מקסימלית',W*0.23,113,'#94a3b8',8,undefined,true);
    simText(ctx,'במרכז (x=0):',W*0.23,128,'#94a3b8',8.5,undefined,true);
    simText(ctx,'|v|=מקסימלית, a=0',W*0.23,142,'#94a3b8',8,undefined,true);

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}

function simVecOps(canvas){
  // SECTION: vectors.vec-ops — פעולות על וקטורים
  // PEDAGOGY: Vector subtraction A-B, scalar multiplication c·A, dot product A·B.
  // Three tabs switchable. Interactive draggable vectors.
  const H=490; const {ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;
  let pT=null, t=0;
  var op='sub'; // 'sub' | 'scalar' | 'dot'
  var CX=W*0.38, CY=H*0.50;
  var vA={x:90,y:-40}, vB={x:50,y:60};
  var scalar=2.0;
  var dragging=null, dragStart={x:0,y:0}, vecStart={x:0,y:0};

  function getScalar(){var e=document.getElementById('inp-vo-scalar'); return e?parseFloat(e.value):scalar;}

  // Op buttons
  ['btn-vo-sub','btn-vo-scalar','btn-vo-dot'].forEach(function(bid){
    var btn=document.getElementById(bid);
    if(btn) btn.addEventListener('click',function(){
      op=bid.replace('btn-vo-','');
    });
  });

  function getXY(evt){
    var r=canvas.getBoundingClientRect();
    var scl=(canvas.width/dpr)/r.width;
    return {x:((evt.touches?evt.touches[0].clientX:evt.clientX)-r.left)*scl,
            y:((evt.touches?evt.touches[0].clientY:evt.clientY)-r.top)*scl};
  }
  function onDown(e){
    e.preventDefault();
    var p=getXY(e);
    if(Math.abs(p.x-(CX+vA.x))<16&&Math.abs(p.y-(CY+vA.y))<16){dragging='A';dragStart=p;vecStart={x:vA.x,y:vA.y};}
    else if(Math.abs(p.x-(CX+vB.x))<16&&Math.abs(p.y-(CY+vB.y))<16){dragging='B';dragStart=p;vecStart={x:vB.x,y:vB.y};}
  }
  function onMove(e){
    if(!dragging)return; e.preventDefault();
    var p=getXY(e);
    var dx=p.x-dragStart.x, dy=p.y-dragStart.y;
    if(dragging==='A'){vA.x=vecStart.x+dx;vA.y=vecStart.y+dy;}
    else{vB.x=vecStart.x+dx;vB.y=vecStart.y+dy;}
  }
  function onUp(){dragging=null;}
  canvas.addEventListener('mousedown',onDown); canvas.addEventListener('touchstart',onDown,{passive:false});
  canvas.addEventListener('mousemove',onMove); canvas.addEventListener('touchmove',onMove,{passive:false});
  canvas.addEventListener('mouseup',onUp); canvas.addEventListener('touchend',onUp);

  function draw(ts){
    if(_simStop[id])return;
    if(!pT)pT=ts; var dt=Math.min((ts-pT)/1000,0.04); pT=ts;
    t+=dt; scalar=getScalar();
    var magA=Math.sqrt(vA.x*vA.x+vA.y*vA.y);
    var magB=Math.sqrt(vB.x*vB.x+vB.y*vB.y);
    var angA=Math.atan2(-vA.y,vA.x)*180/Math.PI;
    var angB=Math.atan2(-vB.y,vB.x)*180/Math.PI;

    simBg(ctx,W,H);

    // Grid
    for(var gx=CX%40;gx<W;gx+=40){
      ctx.save(); ctx.strokeStyle='rgba(255,255,255,.03)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,H); ctx.stroke(); ctx.restore();
    }
    for(var gy=CY%40;gy<H;gy+=40){
      ctx.save(); ctx.strokeStyle='rgba(255,255,255,.03)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke(); ctx.restore();
    }
    // Origin
    ctx.save(); ctx.fillStyle='#334155';
    ctx.beginPath(); ctx.arc(CX,CY,5,0,Math.PI*2); ctx.fill(); ctx.restore();

    if(op==='sub'){
      // A - B = A + (-B)
      var negB={x:-vB.x,y:-vB.y};
      var R={x:vA.x+negB.x,y:vA.y+negB.y};
      // -B dashed
      ctx.save(); ctx.strokeStyle='rgba(59,130,246,.5)'; ctx.lineWidth=2; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(CX,CY); ctx.lineTo(CX+negB.x,CY+negB.y); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
      simText(ctx,'-B',CX+negB.x/2+10,CY+negB.y/2,'rgba(59,130,246,.6)',8.5,'left');
      // Parallelogram fill
      ctx.save(); ctx.fillStyle='rgba(167,139,250,.08)';
      ctx.beginPath(); ctx.moveTo(CX,CY); ctx.lineTo(CX+vA.x,CY+vA.y); ctx.lineTo(CX+R.x,CY+R.y); ctx.lineTo(CX+negB.x,CY+negB.y); ctx.closePath(); ctx.fill(); ctx.restore();
      simArrow(ctx,CX,CY,CX+vA.x,CY+vA.y,'#ef4444',2.5,11);
      simText(ctx,'A',CX+vA.x+10,CY+vA.y,'#ef4444',10,'left');
      simArrow(ctx,CX,CY,CX+vB.x,CY+vB.y,'#3b82f6',2.5,11);
      simText(ctx,'B',CX+vB.x+10,CY+vB.y,'#3b82f6',10,'left');
      simArrow(ctx,CX,CY,CX+R.x,CY+R.y,'#a78bfa',3,13);
      simText(ctx,'A−B',CX+R.x+10,CY+R.y,'#a78bfa',10,'left');
      // Result panel
      ctx.save(); ctx.fillStyle='rgba(6,14,28,.92)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.roundRect(8,6,W-16,54,6); ctx.fill(); ctx.stroke(); ctx.restore();
      simText(ctx,'חיסור וקטורים: A − B = A + (−B)',W/2,18,'#22d3ee',10.5,undefined,true);
      simText(ctx,'A = ('+vA.x.toFixed(0)+', '+(-vA.y).toFixed(0)+')',W/3,34,'#ef4444',9,undefined,true);
      simText(ctx,'B = ('+vB.x.toFixed(0)+', '+(-vB.y).toFixed(0)+')',W*2/3,34,'#3b82f6',9,undefined,true);
      simText(ctx,'A−B = ('+R.x.toFixed(0)+', '+(-R.y).toFixed(0)+')  |R|='+Math.sqrt(R.x*R.x+R.y*R.y).toFixed(1),W/2,48,'#a78bfa',9,undefined,true);
    } else if(op==='scalar'){
      // c·A
      var cA={x:scalar*vA.x,y:scalar*vA.y};
      ctx.save(); ctx.strokeStyle='rgba(239,68,68,.25)'; ctx.lineWidth=1.5; ctx.setLineDash([3,5]);
      ctx.beginPath(); ctx.moveTo(CX,CY); ctx.lineTo(CX+vA.x,CY+vA.y); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
      simArrow(ctx,CX,CY,CX+vA.x,CY+vA.y,'#ef4444',2,10);
      simText(ctx,'A',CX+vA.x+10,CY+vA.y,'#ef4444',9,'left');
      simArrow(ctx,CX,CY,CX+cA.x,CY+cA.y,'#f97316',3,13);
      simText(ctx,scalar.toFixed(1)+'A',CX+cA.x+10,CY+cA.y,'#f97316',10,'left');
      ctx.save(); ctx.fillStyle='rgba(6,14,28,.92)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.roundRect(8,6,W-16,54,6); ctx.fill(); ctx.stroke(); ctx.restore();
      simText(ctx,'כפל סקלרי: c·A',W/2,18,'#22d3ee',10.5,undefined,true);
      simText(ctx,'A = ('+vA.x.toFixed(0)+', '+(-vA.y).toFixed(0)+')  |A| = '+magA.toFixed(1),W/2,32,'#ef4444',9,undefined,true);
      simText(ctx,scalar.toFixed(1)+'·A = ('+cA.x.toFixed(0)+', '+(-cA.y).toFixed(0)+')  |c·A| = '+(scalar*magA).toFixed(1)+' [כיוון '+(scalar>=0?'נשמר':'מתהפך')+']',W/2,46,'#f97316',9,undefined,true);
    } else { // dot product
      var dot=vA.x*vB.x+vA.y*vB.y; // screen y: need to negate y components
      var dot_physics=vA.x*vB.x+(-vA.y)*(-vB.y);
      var cosAB=dot_physics/(magA*magB||1);
      var angBetween=Math.acos(Math.max(-1,Math.min(1,cosAB)))*180/Math.PI;
      simArrow(ctx,CX,CY,CX+vA.x,CY+vA.y,'#ef4444',2.5,11);
      simText(ctx,'A',CX+vA.x+10,CY+vA.y,'#ef4444',10,'left');
      simArrow(ctx,CX,CY,CX+vB.x,CY+vB.y,'#3b82f6',2.5,11);
      simText(ctx,'B',CX+vB.x+10,CY+vB.y,'#3b82f6',10,'left');
      // Angle arc
      ctx.save(); ctx.strokeStyle='rgba(251,191,36,.5)'; ctx.lineWidth=1.5;
      var angA2=Math.atan2(vA.y,vA.x), angB2=Math.atan2(vB.y,vB.x);
      ctx.beginPath(); ctx.arc(CX,CY,38,Math.min(angA2,angB2),Math.max(angA2,angB2)); ctx.stroke(); ctx.restore();
      simText(ctx,angBetween.toFixed(0)+'°',CX+48*Math.cos((angA2+angB2)/2),CY+48*Math.sin((angA2+angB2)/2),'#fbbf24',9,undefined,true);
      // Projection line
      if(magA>5&&magB>5){
        var projLen=dot_physics/magB;
        var uBx=vB.x/magB, uBy=-vB.y/magB;
        var projX=CX+projLen*uBx, projY=CY-projLen*uBy;
        ctx.save(); ctx.strokeStyle='rgba(239,68,68,.4)'; ctx.lineWidth=1.5; ctx.setLineDash([3,4]);
        ctx.beginPath(); ctx.moveTo(CX+vA.x,CY+vA.y); ctx.lineTo(projX,projY); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
        ctx.save(); ctx.fillStyle='rgba(239,68,68,.5)';
        ctx.beginPath(); ctx.arc(projX,projY,5,0,Math.PI*2); ctx.fill(); ctx.restore();
      }
      ctx.save(); ctx.fillStyle='rgba(6,14,28,.92)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.roundRect(8,6,W-16,62,6); ctx.fill(); ctx.stroke(); ctx.restore();
      simText(ctx,'מכפלה סקלרית (דוט): A·B = |A||B|cosθ',W/2,18,'#22d3ee',10.5,undefined,true);
      simText(ctx,'|A|='+magA.toFixed(1)+'  |B|='+magB.toFixed(1)+'  θ='+angBetween.toFixed(1)+'°',W/2,32,'#94a3b8',9,undefined,true);
      simText(ctx,'A·B = '+magA.toFixed(1)+'×'+magB.toFixed(1)+'×cos'+angBetween.toFixed(0)+'° = '+dot_physics.toFixed(1),W/2,46,'#fbbf24',10,undefined,true);
      simText(ctx,dot_physics>0?'A·B > 0 (זווית חדה)':dot_physics<0?'A·B < 0 (זווית קהה)':'A·B = 0 (ניצבים!)',W/2,60,dot_physics===0?'#34d399':dot_physics>0?'#22d3ee':'#f87171',9,undefined,true);
    }

    // Op hint
    simText(ctx,'גרור את החצים!',CX,H-18,'#334155',8.5,undefined,true);
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}

function simVecComponents(canvas){
  // SECTION: vectors.vec-components — רכיבים קרטזיים
  // PEDAGOGY: A = (Ax, Ay), Ax = A·cosθ, Ay = A·sinθ.
  // Draggable vector shows decomposition live. Unit circle inset.
  // Student drags tip, reads Ax/Ay components and angle instantly.
  const H=490; const {ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;
  let pT=null, t=0;
  var CX=W*0.36, CY=H*0.55;
  var vx=110, vy=-70; // vector tip relative to origin (screen coords)
  var dragging=false;

  function getXY(evt){
    var r=canvas.getBoundingClientRect();
    var scl=(canvas.width/dpr)/r.width;
    return {x:((evt.touches?evt.touches[0].clientX:evt.clientX)-r.left)*scl,
            y:((evt.touches?evt.touches[0].clientY:evt.clientY)-r.top)*scl};
  }
  function onDown(e){
    e.preventDefault();
    var p=getXY(e);
    if(Math.abs(p.x-CX-vx)<18&&Math.abs(p.y-CY-vy)<18){dragging=true;}
  }
  function onMove(e){
    if(!dragging)return; e.preventDefault();
    var p=getXY(e);
    vx=p.x-CX; vy=p.y-CY;
    var mag=Math.sqrt(vx*vx+vy*vy);
    if(mag>160){vx=vx/mag*160; vy=vy/mag*160;}
    if(mag<20){vx=vx/mag*20; vy=vy/mag*20;}
  }
  function onUp(){dragging=false;}
  canvas.addEventListener('mousedown',onDown); canvas.addEventListener('touchstart',onDown,{passive:false});
  canvas.addEventListener('mousemove',onMove); canvas.addEventListener('touchmove',onMove,{passive:false});
  canvas.addEventListener('mouseup',onUp); canvas.addEventListener('touchend',onUp);

  function draw(ts){
    if(_simStop[id])return;
    if(!pT)pT=ts; var dt=Math.min((ts-pT)/1000,0.04); pT=ts;
    t+=dt;
    var mag=Math.sqrt(vx*vx+vy*vy);
    var Ax=vx, Ay=-vy; // physics coords (y up)
    var mag_phys=Math.sqrt(Ax*Ax+Ay*Ay);
    var theta=Math.atan2(Ay,Ax)*180/Math.PI;
    if(theta<0) theta+=360;
    var cosT=Ax/mag_phys, sinT=Ay/mag_phys;

    simBg(ctx,W,H);

    // ── Axes ──────────────────────────────────────────
    ctx.save(); ctx.strokeStyle='#1e3a52'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(CX-160,CY); ctx.lineTo(CX+170,CY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(CX,CY+160); ctx.lineTo(CX,CY-150); ctx.stroke(); ctx.restore();
    simArrow(ctx,CX+155,CY,CX+172,CY,'#2d5275',1.5,8);
    simArrow(ctx,CX,CY-135,CX,CY-152,'#2d5275',1.5,8);
    simText(ctx,'x',CX+175,CY+3,'#334155',9,'left');
    simText(ctx,'y',CX+5,CY-155,'#334155',9,'left');
    // Grid ticks
    for(var i=-3;i<=3;i++){
      if(i===0)continue;
      ctx.save(); ctx.strokeStyle='rgba(30,58,82,.4)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(CX+i*40,CY-3); ctx.lineTo(CX+i*40,CY+3); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(CX-3,CY+i*40); ctx.lineTo(CX+3,CY+i*40); ctx.stroke(); ctx.restore();
    }

    // ── Component projections ─────────────────────────
    // Ax component (horizontal dashed line to tip)
    ctx.save(); ctx.strokeStyle='rgba(34,211,153,.5)'; ctx.lineWidth=2; ctx.setLineDash([4,5]);
    ctx.beginPath(); ctx.moveTo(CX,CY+vy); ctx.lineTo(CX+vx,CY+vy); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
    // Ay component (vertical dashed line to tip)
    ctx.save(); ctx.strokeStyle='rgba(251,191,36,.5)'; ctx.lineWidth=2; ctx.setLineDash([4,5]);
    ctx.beginPath(); ctx.moveTo(CX+vx,CY); ctx.lineTo(CX+vx,CY+vy); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
    // Ax arrow (x-axis)
    simArrow(ctx,CX,CY,CX+vx,CY,'#34d399',3,11);
    simText(ctx,'Ax='+Ax.toFixed(0),CX+vx/2,CY+16,'#34d399',9.5,undefined,true);
    // Ay arrow (y-axis)
    simArrow(ctx,CX,CY,CX,CY+vy,'#fbbf24',3,11);
    simText(ctx,'Ay='+Ay.toFixed(0),CX+14,CY+vy/2,'#fbbf24',9.5,'left');
    // Corner square
    ctx.save(); ctx.strokeStyle='rgba(100,116,139,.5)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(CX+vx-Math.sign(vx)*10,CY); ctx.lineTo(CX+vx-Math.sign(vx)*10,CY+vy); ctx.lineTo(CX+vx,CY+vy); ctx.stroke(); ctx.restore();

    // ── Main vector ───────────────────────────────────
    simArrow(ctx,CX,CY,CX+vx,CY+vy,'#60a5fa',3.5,13);
    // Tip handle
    ctx.save(); ctx.fillStyle=dragging?'#fbbf24':'#60a5fa'; ctx.strokeStyle='#fff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(CX+vx,CY+vy,10,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'A',CX+vx+14,CY+vy,'#60a5fa',11,'left');
    simText(ctx,dragging?'↖':'← גרור',CX+vx+14,CY+vy+14,'#334155',7.5,'left');

    // Angle arc
    if(mag>25){
      ctx.save(); ctx.strokeStyle='rgba(167,139,250,.6)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(CX,CY,44,0,Math.atan2(vy,vx),vy>0); ctx.stroke(); ctx.restore();
      simText(ctx,theta.toFixed(0)+'°',CX+52*Math.cos(Math.atan2(vy,vx)/2),CY+52*Math.sin(Math.atan2(vy,vx)/2),'#a78bfa',8.5,undefined,true);
    }

    // ── Right panel ───────────────────────────────────
    var PX=W*0.65, PW=W-PX-10, PY=10;
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.92)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(PX,PY,PW,H-PY-10,6); ctx.fill(); ctx.stroke(); ctx.restore();
    var PC=PX+PW/2;
    simText(ctx,'רכיבים',PC,PY+14,'#22d3ee',10.5,undefined,true);
    ctx.save(); ctx.strokeStyle='#1e4060'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(PX+6,PY+20); ctx.lineTo(PX+PW-6,PY+20); ctx.stroke(); ctx.restore();
    simText(ctx,'|A| = '+mag_phys.toFixed(1),PC,PY+33,'#60a5fa',10,undefined,true);
    simText(ctx,'θ = '+theta.toFixed(1)+'°',PC,PY+47,'#a78bfa',10,undefined,true);
    ctx.save(); ctx.strokeStyle='#1e4060'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(PX+6,PY+54); ctx.lineTo(PX+PW-6,PY+54); ctx.stroke(); ctx.restore();
    simText(ctx,'Ax = A·cosθ',PC,PY+67,'#34d399',9,undefined,true);
    simText(ctx,'= '+Ax.toFixed(1),PC,PY+82,'#34d399',11,undefined,true);
    simText(ctx,'Ay = A·sinθ',PC,PY+97,'#fbbf24',9,undefined,true);
    simText(ctx,'= '+Ay.toFixed(1),PC,PY+112,'#fbbf24',11,undefined,true);
    ctx.save(); ctx.strokeStyle='#1e4060'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(PX+6,PY+120); ctx.lineTo(PX+PW-6,PY+120); ctx.stroke(); ctx.restore();
    simText(ctx,'בדיקה:',PC,PY+133,'#94a3b8',8.5,undefined,true);
    simText(ctx,'√(Ax²+Ay²)',PC,PY+147,'#94a3b8',8,undefined,true);
    simText(ctx,'= '+Math.sqrt(Ax*Ax+Ay*Ay).toFixed(1)+' ✓',PC,PY+161,'#34d399',9,undefined,true);
    // Mini unit circle
    var UCX=PC, UCY=PY+230, UCR=52;
    ctx.save(); ctx.strokeStyle='rgba(30,58,82,.6)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(UCX,UCY,UCR,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(UCX-UCR-6,UCY); ctx.lineTo(UCX+UCR+6,UCY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(UCX,UCY-UCR-6); ctx.lineTo(UCX,UCY+UCR+6); ctx.stroke(); ctx.restore();
    simText(ctx,'מעגל יחידה',UCX,PY+175,'#64748b',8,undefined,true);
    // Point on unit circle
    var ucAng=Math.atan2(-vy,vx);
    var ucX=UCX+UCR*Math.cos(ucAng), ucY=UCY-UCR*Math.sin(ucAng);
    ctx.save(); ctx.strokeStyle='rgba(96,165,250,.4)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(UCX,UCY); ctx.lineTo(ucX,ucY); ctx.stroke(); ctx.restore();
    ctx.save(); ctx.strokeStyle='rgba(34,211,153,.5)'; ctx.lineWidth=1.5; ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.moveTo(ucX,UCY); ctx.lineTo(ucX,ucY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(UCX,ucY); ctx.lineTo(ucX,ucY); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
    ctx.save(); ctx.fillStyle='#fbbf24';
    ctx.beginPath(); ctx.arc(ucX,ucY,5,0,Math.PI*2); ctx.fill(); ctx.restore();
    simText(ctx,'cos='+cosT.toFixed(2),UCX+UCR+8,UCY+2,'#34d399',7.5,'left');
    simText(ctx,'sin='+sinT.toFixed(2),UCX,UCY-UCR-10,'#fbbf24',7.5,undefined,true);

    // Top banner
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.92)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(8,6,W*0.58,50,6); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'רכיבים קרטזיים: Ax = A·cosθ, Ay = A·sinθ',W*0.29+8,19,'#22d3ee',10,undefined,true);
    simText(ctx,'A = ('+Ax.toFixed(1)+', '+Ay.toFixed(1)+')  |A| = '+mag_phys.toFixed(1)+'  θ = '+theta.toFixed(1)+'°',W*0.29+8,36,'#94a3b8',9.5,undefined,true);
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}

function wavelengthToRGB(wl){
  var r,g,b;
  if(wl>=380&&wl<440){r=(440-wl)/60;g=0;b=1;}
  else if(wl<490){r=0;g=(wl-440)/50;b=1;}
  else if(wl<510){r=0;g=1;b=(510-wl)/20;}
  else if(wl<580){r=(wl-510)/70;g=1;b=0;}
  else if(wl<645){r=1;g=(645-wl)/65;b=0;}
  else{r=1;g=0;b=0;}
  var a=(wl<420)?0.3+(0.7*(wl-380)/40):(wl>700)?0.3+(0.7*(780-wl)/80):1;
  return'rgba('+Math.round(r*255)+','+Math.round(g*255)+','+Math.round(b*255)+','+a.toFixed(2)+')';
}
function wavelengthToHex(wl){
  var r,g,b;
  if(wl>=380&&wl<440){r=(440-wl)/60;g=0;b=1;}
  else if(wl<490){r=0;g=(wl-440)/50;b=1;}
  else if(wl<510){r=0;g=1;b=(510-wl)/20;}
  else if(wl<580){r=(wl-510)/70;g=1;b=0;}
  else if(wl<645){r=1;g=(645-wl)/65;b=0;}
  else{r=1;g=0;b=0;}
  return'#'+[r,g,b].map(function(v){return Math.round(v*255).toString(16).padStart(2,'0');}).join('');
}
function optGlow(ctx,col,blur){ctx.shadowColor=col;ctx.shadowBlur=blur||12;}
function optNoGlow(ctx){ctx.shadowColor='transparent';ctx.shadowBlur=0;}
function optRay(ctx,x1,y1,x2,y2,col,lw,arrowHead){
  lw=lw||2;ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw;
  optGlow(ctx,col,8);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  if(arrowHead!==false){
    var a=Math.atan2(y2-y1,x2-x1),hs=lw*4+4;
    ctx.fillStyle=col;ctx.beginPath();
    ctx.moveTo(x2,y2);ctx.lineTo(x2-hs*Math.cos(a-0.38),y2-hs*Math.sin(a-0.38));
    ctx.lineTo(x2-hs*Math.cos(a+0.38),y2-hs*Math.sin(a+0.38));ctx.closePath();ctx.fill();
  }
  optNoGlow(ctx);ctx.restore();
}
function optDash(ctx,x1,y1,x2,y2,col,op){
  ctx.save();ctx.strokeStyle=col||'#475569';ctx.lineWidth=1;ctx.globalAlpha=op||0.5;
  ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  ctx.setLineDash([]);ctx.restore();
}
function optLabel(ctx,txt,x,y,col,sz,align){
  ctx.save();ctx.fillStyle=col||'#94a3b8';ctx.font=(sz||11)+'px Heebo,sans-serif';
  ctx.textAlign=align||'center';ctx.textBaseline='middle';
  ctx.shadowColor='rgba(0,0,0,.7)';ctx.shadowBlur=4;
  ctx.fillText(txt,x,y);ctx.restore();
}
function optInfoBox(ctx,x,y,w,lines){
  ctx.save();ctx.fillStyle='rgba(4,9,20,.88)';ctx.strokeStyle='rgba(59,130,246,.35)';ctx.lineWidth=1;
  var lh=16,pad=10,h=lines.length*lh+pad;
  ctx.beginPath();ctx.roundRect(x,y,w,h,6);ctx.fill();ctx.stroke();
  lines.forEach(function(l,i){optLabel(ctx,l,x+w/2,y+pad/2+lh/2+i*lh,l[0]==='='?'#22d3ee':'#94a3b8',9);});
  ctx.restore();
}
function optAngleArc(ctx,cx,cy,r,a1,a2,col){
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.globalAlpha=0.8;
  optGlow(ctx,col,4);
  ctx.beginPath();ctx.arc(cx,cy,r,a1,a2);ctx.stroke();
  optNoGlow(ctx);ctx.restore();
}
function optMirrorSurface(ctx,x1,y1,x2,y2){
  // Reflective blue line with hatching
  ctx.save();
  var grad=ctx.createLinearGradient(x1,y1,x2,y2);
  grad.addColorStop(0,'rgba(96,165,250,.9)');grad.addColorStop(0.5,'rgba(147,197,253,1)');grad.addColorStop(1,'rgba(96,165,250,.9)');
  ctx.strokeStyle=grad;ctx.lineWidth=3;
  optGlow(ctx,'#60a5fa',8);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  optNoGlow(ctx);

  var dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);
  var nx=-dy/len,ny=dx/len;
  ctx.strokeStyle='rgba(30,58,95,.7)';ctx.lineWidth=1;
  for(var i=0;i<len;i+=14){
    var px=x1+i*dx/len,py=y1+i*dy/len;
    ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+nx*10,py+ny*10);ctx.stroke();
  }
  ctx.restore();
}
function optLensShape(ctx,lx,cy,fw,fh,col,fill){
  // Biconvex lens
  ctx.save();ctx.strokeStyle=col||'#3b82f6';ctx.lineWidth=2.5;
  if(fill){ctx.fillStyle=fill;}
  var r=fh*fh/(4*fw)+fw/4;
  ctx.beginPath();
  ctx.arc(lx-r+fw/2,cy,r,Math.acos((r-fw/2)/r)*-1,Math.acos((r-fw/2)/r));
  ctx.arc(lx+r-fw/2,cy,r,Math.PI-Math.acos((r-fw/2)/r),Math.PI+Math.acos((r-fw/2)/r));
  ctx.closePath();
  if(fill){optGlow(ctx,col||'#3b82f6',6);ctx.fill();}
  ctx.stroke();optNoGlow(ctx);ctx.restore();
}
function optDivLensShape(ctx,lx,cy,fw,fh,col,fill){
  // Biconcave lens shape
  ctx.save();ctx.strokeStyle=col||'#8b5cf6';ctx.lineWidth=2.5;
  if(fill)ctx.fillStyle=fill;
  var r=fh*fh/(4*fw)+fw/4;
  ctx.beginPath();
  ctx.moveTo(lx-fw/2,cy-fh/2);
  ctx.quadraticCurveTo(lx,cy-fh/3,lx-fw/2,cy);
  ctx.quadraticCurveTo(lx,cy+fh/3,lx-fw/2,cy+fh/2);
  ctx.lineTo(lx+fw/2,cy+fh/2);
  ctx.quadraticCurveTo(lx,cy+fh/3,lx+fw/2,cy);
  ctx.quadraticCurveTo(lx,cy-fh/3,lx+fw/2,cy-fh/2);
  ctx.closePath();
  if(fill){optGlow(ctx,col||'#8b5cf6',6);ctx.fill();}
  ctx.stroke();optNoGlow(ctx);ctx.restore();
}

// ─── EM WAVE — Enhanced ────────────────────────────────────────────
function simOptEmWave(canvas){
  const H=420;const{ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;
  // Oblique (cavalier) projection: z-axis (B direction) drawn up-right on screen
  var ZX=0.55,ZY=-0.38;
  function getWl(){var e=document.getElementById('inp-emw-wl');return e?parseFloat(e.value):500;}
  function draw(ts){
    if(_simStop[id])return;
    var t=(ts||0)/1000,lam=getWl();
    var hex=wavelengthToHex(lam);
    var bgG=ctx.createLinearGradient(0,0,W,H);
    bgG.addColorStop(0,'#020810');bgG.addColorStop(1,'#04111f');
    ctx.fillStyle=bgG;ctx.fillRect(0,0,W,H);
    var cy=H/2+16,amp=62,bamp=52;
    var lambdaScale=60+(lam-380)/(700-380)*160;
    var kx=2*Math.PI/lambdaScale;
    var omega=kx*55;
    var N=200,X0=30,X1=W-34;
    function fld(x){return Math.sin(kx*(x-X0)-omega*t);}
    // ── B-field (horizontal, in the z-plane — drawn skewed, behind E) ────────
    var bPts=[];
    for(var i=0;i<=N;i++){
      var x=X0+(X1-X0)*i/N;var b=bamp*fld(x);
      bPts.push({x:x+b*ZX,y:cy+b*ZY,ax:x,b:b});
    }
    // B-plane ribbon
    ctx.save();ctx.beginPath();ctx.moveTo(X0,cy);
    bPts.forEach(function(p){ctx.lineTo(p.x,p.y);});
    ctx.lineTo(X1,cy);ctx.closePath();
    ctx.fillStyle='rgba(232,121,249,.10)';ctx.fill();ctx.restore();
    // B vector arrows (skewed into the z-plane)
    var step=Math.max(1,Math.round(N/22));
    for(var i=0;i<=N;i+=step){
      var p=bPts[i];if(!p||Math.abs(p.b)<3)continue;
      ctx.save();ctx.strokeStyle='rgba(232,121,249,.55)';ctx.lineWidth=1.4;
      ctx.beginPath();ctx.moveTo(p.ax,cy);ctx.lineTo(p.x,p.y);ctx.stroke();
      var angA=Math.atan2(p.y-cy,p.x-p.ax);
      ctx.fillStyle='rgba(232,121,249,.75)';
      ctx.beginPath();ctx.moveTo(p.x,p.y);
      ctx.lineTo(p.x-6*Math.cos(angA-0.4),p.y-6*Math.sin(angA-0.4));
      ctx.lineTo(p.x-6*Math.cos(angA+0.4),p.y-6*Math.sin(angA+0.4));
      ctx.closePath();ctx.fill();ctx.restore();
    }
    // B curve
    ctx.save();ctx.strokeStyle='#e879f9';ctx.lineWidth=2.2;optGlow(ctx,'#e879f9',10);
    ctx.beginPath();bPts.forEach(function(p,i){i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);});
    ctx.stroke();optNoGlow(ctx);ctx.restore();
    // ── Propagation axis + coordinate tripod ─────────────────────────────────
    ctx.save();ctx.strokeStyle='rgba(71,85,105,.6)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(X0-12,cy);ctx.lineTo(X1+14,cy);ctx.stroke();ctx.restore();
    optRay(ctx,X1-4,cy,X1+18,cy,'rgba(148,163,184,.8)',1.2,true);
    optLabel(ctx,'c →',X1+2,cy+16,'#94a3b8',9);
    var axX=X0-8;
    optRay(ctx,axX,cy,axX,cy-36,'rgba(148,163,184,.7)',1,true);
    optRay(ctx,axX,cy,axX+34*ZX,cy+34*ZY,'rgba(232,121,249,.8)',1,true);
    optLabel(ctx,'E',axX-9,cy-32,hex,9);
    optLabel(ctx,'B',axX+34*ZX+10,cy+34*ZY,'#e879f9',9);
    // ── E-field (vertical, in phase with B, drawn on top) ────────────────────
    var ePts=[];
    for(var i=0;i<=N;i++){
      var x=X0+(X1-X0)*i/N;var e=amp*fld(x);
      ePts.push({x:x,y:cy-e,e:e});
    }
    ctx.save();ctx.beginPath();ctx.moveTo(X0,cy);
    ePts.forEach(function(p){ctx.lineTo(p.x,p.y);});
    ctx.lineTo(X1,cy);ctx.closePath();
    var rg=ctx.createLinearGradient(0,cy-amp,0,cy+amp);
    rg.addColorStop(0,hex+'22');rg.addColorStop(0.5,hex+'44');rg.addColorStop(1,hex+'22');
    ctx.fillStyle=rg;ctx.fill();ctx.restore();
    // E vector arrows
    for(var i=0;i<=N;i+=step){
      var p=ePts[i];if(!p||Math.abs(p.e)<3)continue;
      ctx.save();ctx.strokeStyle=hex;ctx.globalAlpha=0.6;ctx.lineWidth=1.4;
      ctx.beginPath();ctx.moveTo(p.x,cy);ctx.lineTo(p.x,p.y);ctx.stroke();
      var dir=p.e>0?-1:1;
      ctx.globalAlpha=0.85;ctx.fillStyle=hex;
      ctx.beginPath();ctx.moveTo(p.x,p.y);
      ctx.lineTo(p.x-3.5,p.y-dir*6);ctx.lineTo(p.x+3.5,p.y-dir*6);
      ctx.closePath();ctx.fill();ctx.restore();
    }
    // E curve
    ctx.save();ctx.strokeStyle=hex;ctx.lineWidth=2.5;optGlow(ctx,hex,12);
    ctx.beginPath();ePts.forEach(function(p,i){i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);});
    ctx.stroke();optNoGlow(ctx);ctx.restore();
    // ── Photon riding a crest at the phase velocity ──────────────────────────
    var vph=omega/kx;
    var px=X0+((vph*t)%(X1-X0));
    var pyE=cy-amp*fld(px);
    ctx.save();ctx.fillStyle='#ffffff';optGlow(ctx,'#ffffff',18);
    ctx.beginPath();ctx.arc(px,pyE,3.5,0,Math.PI*2);ctx.fill();optNoGlow(ctx);ctx.restore();
    // ── λ bracket ────────────────────────────────────────────────────────────
    var bx1=X0+8,bx2=bx1+lambdaScale;
    if(bx2>W-24)bx2=W-24;
    ctx.save();ctx.strokeStyle='#fbbf24';ctx.lineWidth=1;ctx.globalAlpha=0.85;
    ctx.setLineDash([3,4]);
    ctx.beginPath();ctx.moveTo(bx1,cy-amp-24);ctx.lineTo(bx1,cy-amp-8);ctx.stroke();
    ctx.beginPath();ctx.moveTo(bx2,cy-amp-24);ctx.lineTo(bx2,cy-amp-8);ctx.stroke();
    ctx.beginPath();ctx.moveTo(bx1,cy-amp-16);ctx.lineTo(bx2,cy-amp-16);ctx.stroke();
    ctx.setLineDash([]);ctx.restore();
    optLabel(ctx,'λ='+(lam|0)+'nm',(bx1+bx2)/2,cy-amp-30,'#fbbf24',10);
    // ── Color swatch ─────────────────────────────────────────────────────────
    ctx.save();ctx.fillStyle=hex;optGlow(ctx,hex,18);
    ctx.beginPath();ctx.arc(W-26,28,15,0,Math.PI*2);ctx.fill();optNoGlow(ctx);ctx.restore();
    var cn=lam<430?'UV/סגול':lam<470?'סגול':lam<500?'כחול':lam<560?'ירוק':lam<590?'צהוב':lam<625?'כתום':'אדום';
    optLabel(ctx,cn,W-26,50,'#94a3b8',9);
    // ── Labels ───────────────────────────────────────────────────────────────
    optLabel(ctx,'E — שדה חשמלי (אנכי)',108,cy-amp-6,hex,10);
    optLabel(ctx,'B — שדה מגנטי (אופקי, בפאזה)',126,cy+amp*0.72,'#e879f9',10);
    var freq=(3e8/(lam*1e-9)/1e14).toFixed(2);
    optInfoBox(ctx,8,8,176,['λ='+(lam|0)+' nm','f='+freq+' ×10¹⁴ Hz','c = λ·f','E ⊥ B ⊥ c — בפאזה']);
    requestAnimationFrame(draw);
  }requestAnimationFrame(draw);
}

// ─── REFRACTION INDEX — Enhanced ──────────────────────────────────
function simOptRefrIndex(canvas){
  const H=360;const{ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;
  var media=[{name:'חלל',n:1.0,col:'#60a5fa'},{name:'אוויר',n:1.0003,col:'#7dd3fc'},{name:'מים',n:1.33,col:'#22d3ee'},{name:'זכוכית',n:1.50,col:'#a78bfa'},{name:'יהלום',n:2.42,col:'#f9a8d4'}];
  var animT=0;
  function getN(){var e=document.getElementById('inp-ri-n');return e?parseFloat(e.value):1.5;}
  function draw(){
    if(_simStop[id])return;
    animT+=0.04;
    var bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#020810');bg.addColorStop(1,'#030d1a');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    var bw=48,bh=160,by=55,gap=(W-40-media.length*(bw+8))/4+2,bx=20;
    var n=getN();
    var ci=0;media.forEach(function(m,i){if(Math.abs(m.n-n)<Math.abs(media[ci].n-n))ci=i;});
    media.forEach(function(m,i){
      var x=bx+i*(bw+gap);
      // Medium block with gradient
      var mg=ctx.createLinearGradient(x,by,x+bw,by);
      var hr=parseInt(m.col.slice(1,3),16),hg=parseInt(m.col.slice(3,5),16),hb=parseInt(m.col.slice(5,7),16);
      mg.addColorStop(0,'rgba('+hr+','+hg+','+hb+',0.12)');
      mg.addColorStop(1,'rgba('+hr+','+hg+','+hb+',0.06)');
      ctx.save();ctx.fillStyle=mg;ctx.strokeStyle=m.col;ctx.lineWidth=1;ctx.globalAlpha=0.7;
      ctx.beginPath();ctx.roundRect(x,by,bw,bh,6);ctx.fill();ctx.stroke();ctx.restore();
      if(i===ci){
        ctx.save();ctx.strokeStyle='#fbbf24';ctx.lineWidth=2;optGlow(ctx,'#fbbf24',10);
        ctx.beginPath();ctx.roundRect(x-3,by-3,bw+6,bh+6,8);ctx.stroke();optNoGlow(ctx);ctx.restore();
      }
      // Speed bar (proportional to v=c/n)
      var spd=1/m.n;var barH=Math.round(bh*spd*0.85+bh*0.1);
      var barG=ctx.createLinearGradient(0,by+bh-barH,0,by+bh);
      barG.addColorStop(0,m.col);barG.addColorStop(1,m.col+'88');
      ctx.save();ctx.fillStyle=barG;optGlow(ctx,m.col,8);
      ctx.beginPath();ctx.roundRect(x+8,by+bh-barH,bw-16,barH,4);ctx.fill();
      optNoGlow(ctx);ctx.restore();
      // Animated photon inside bar
      var ph=animT*1.5/m.n;
      var py2=by+bh-((ph%1)*barH);
      ctx.save();ctx.fillStyle='#ffffff';optGlow(ctx,'#ffffff',10);
      ctx.beginPath();ctx.arc(x+bw/2,py2,3,0,Math.PI*2);ctx.fill();optNoGlow(ctx);ctx.restore();
      optLabel(ctx,m.name,x+bw/2,by+bh+15,m.col,10);
      optLabel(ctx,'n='+m.n,x+bw/2,by+bh+30,'#64748b',9);
      optLabel(ctx,'v='+(3e8/m.n/1e8).toFixed(2),x+bw/2,by+bh+45,'#475569',8);
    });
    // Your slider n highlight
    var slidN=n,bary=H-24,bx1=20,bx2=W-20;
    var frac=Math.min(1,(slidN-1)/1.5);
    ctx.save();ctx.lineCap='round';
    ctx.strokeStyle='#1e3a5f';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(bx1,bary);ctx.lineTo(bx2,bary);ctx.stroke();
    var barCol=frac<0.25?'#60a5fa':frac<0.6?'#a78bfa':'#f9a8d4';
    ctx.strokeStyle=barCol;optGlow(ctx,barCol,8);
    ctx.beginPath();ctx.moveTo(bx1,bary);ctx.lineTo(bx1+(bx2-bx1)*frac,bary);ctx.stroke();
    ctx.fillStyle=barCol;ctx.beginPath();ctx.arc(bx1+(bx2-bx1)*frac,bary,7,0,Math.PI*2);ctx.fill();
    // Photon racing along the bar at v = c/n — slower for higher n
    var rpx=bx1+((animT*95/slidN)%(bx2-bx1));
    ctx.fillStyle='#ffffff';optGlow(ctx,'#ffffff',10);
    ctx.beginPath();ctx.arc(rpx,bary,3,0,Math.PI*2);ctx.fill();
    optNoGlow(ctx);ctx.restore();
    optLabel(ctx,'n='+slidN.toFixed(2)+'  →  v='+(3e8/slidN/1e8).toFixed(3)+'×10⁸ m/s',W/2,bary-14,'#e2e8f0',11);
    requestAnimationFrame(draw);
  }
  function poll(){if(_simStop[id])return;requestAnimationFrame(draw);}poll();
}

// ─── REFLECTION LAW — Enhanced ────────────────────────────────────
function simOptReflection(canvas){
  const H=400;const{ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;var animT=0;
  function getAngle(){var e=document.getElementById('inp-ref-angle');return e?parseFloat(e.value):40;}
  function getWl(){var e=document.getElementById('inp-ref-wl');return e?parseFloat(e.value):550;}
  function draw(){
    if(_simStop[id])return;
    animT+=0.025;
    var angle=getAngle(),th=angle*Math.PI/180;
    var wl=getWl(),wlHex=wavelengthToHex(wl);
    var _rgb=wavelengthToRGB(wl).match(/\d+/g);
    function wlA(a){return 'rgba('+_rgb[0]+','+_rgb[1]+','+_rgb[2]+','+a+')';}
    var bgG=ctx.createLinearGradient(0,0,0,H);bgG.addColorStop(0,'#020810');bgG.addColorStop(1,'#030d1a');
    ctx.fillStyle=bgG;ctx.fillRect(0,0,W,H);
    var MY=H-90,cx=W/2;
    // Mirror surface glow
    var fg=ctx.createLinearGradient(0,MY-15,0,MY+30);
    fg.addColorStop(0,'rgba(59,130,246,.07)');fg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=fg;ctx.fillRect(0,MY-15,W,45);
    optMirrorSurface(ctx,30,MY,W-30,MY);
    // Normal
    optDash(ctx,cx,MY-170,cx,MY+30,'#334155',0.6);
    optLabel(ctx,'נורמל',cx+22,MY-148,'#475569',9);
    var L=188,offsets=[-20,0,20];
    // Split animation: 0→0.5 incident moves, 0.5→1.0 reflected moves
    var phase=(animT*0.65)%1;
    var incSeg=Math.min(1,phase*2);   // 0→1 during first half
    var refSeg=Math.max(0,phase*2-1); // 0→1 during second half
    offsets.forEach(function(off,oi){
      var alpha=0.3+0.45*(oi===1?1:0.55);
      var startX=cx-L*Math.sin(th)+off*Math.cos(th);
      var startY=MY-L*Math.cos(th)-off*Math.sin(th);
      var hitX=cx+off*Math.cos(th),hitY=MY-off*Math.sin(th);
      // Incident ray
      ctx.save();ctx.strokeStyle=wlA(alpha);
      ctx.lineWidth=oi===1?2.5:1.5;optGlow(ctx,wlHex,oi===1?9:3);
      ctx.beginPath();ctx.moveTo(startX,startY);ctx.lineTo(hitX,hitY);ctx.stroke();
      optNoGlow(ctx);ctx.restore();
      // Reflected ray (same wavelength)
      var refX=cx+L*Math.sin(th)+off*Math.cos(th);
      var refY=MY-L*Math.cos(th)+off*Math.sin(th);
      ctx.save();ctx.strokeStyle=wlA(alpha*0.75);
      ctx.lineWidth=oi===1?2.5:1.5;optGlow(ctx,wlHex,oi===1?7:2);
      ctx.beginPath();ctx.moveTo(hitX,hitY);ctx.lineTo(refX,refY);ctx.stroke();
      optNoGlow(ctx);ctx.restore();
      // Photon on central ray only
      if(oi===1){
        // Incident photon: travels startX→hitX
        var ipx=startX+(hitX-startX)*incSeg;
        var ipy=startY+(hitY-startY)*incSeg;
        ctx.save();ctx.fillStyle='#ffffff';optGlow(ctx,wlHex,16);
        ctx.beginPath();ctx.arc(ipx,ipy,4,0,Math.PI*2);ctx.fill();
        optNoGlow(ctx);ctx.restore();
        // Reflected photon: travels hitX→refX (correct direction: away from mirror)
        var rpx=hitX+(refX-hitX)*refSeg;
        var rpy=hitY+(refY-hitY)*refSeg;
        ctx.save();ctx.fillStyle='#ffffff';optGlow(ctx,wlHex,16);
        ctx.beginPath();ctx.arc(rpx,rpy,4,0,Math.PI*2);ctx.fill();
        optNoGlow(ctx);ctx.restore();
      }
    });
    // Angle arcs (keep distinct colors for clarity)
    optAngleArc(ctx,cx,MY,54,-(Math.PI/2+th),-(Math.PI/2),wlHex);

// ─── PLANE MIRROR — Enhanced ──────────────────────────────────────

    ctx.fillStyle='#93c5fd';

    optNoGlow(ctx);ctx.restore();

    var doPx=MX-objX;

    ctx.setLineDash([]);optNoGlow(ctx);ctx.restore();

    optLabel(ctx,'dᵢ='+dist.toFixed(1)+' u',imgX-doPx/2,cy-arrowH/2-20,'#fbbf24',10);

// ─── CONCAVE MIRROR — Enhanced ────────────────────────────────────
function simOptConcaveMirror(canvas){
  const H=440;const{ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;

  function getObj(){var e=document.getElementById('inp-cm-do');return e?parseFloat(e.value):2.5;}
  function getWl(){var e=document.getElementById('inp-cm-wl');return e?parseFloat(e.value):550;}

  function _dn(e){var p=simPointerXY(canvas,dpr,e);if(_hit(p)){dragObj=true;hasDragged=true;canvas.style.cursor='grabbing';e.preventDefault();}}
  function _mv(e){var p=simPointerXY(canvas,dpr,e);
    if(dragObj){simSyncSlider('cm-do',(mx-p.x)/f,2);e.preventDefault();}
    else canvas.style.cursor=_hit(p)?'grab':'';}
  function _up(){dragObj=false;canvas.style.cursor='';}
  canvas.addEventListener('mousedown',_dn);canvas.addEventListener('touchstart',_dn,{passive:false});
  canvas.addEventListener('mousemove',_mv);canvas.addEventListener('touchmove',_mv,{passive:false});
  canvas.addEventListener('mouseup',_up);canvas.addEventListener('touchend',_up);
  function draw(){
    if(_simStop[id])return;
    animT+=0.025;
    f=getF();var doMult=getObj(),doPx=doMult*f;
    var wl=getWl(),wlHex=wavelengthToHex(wl);
    var _cr=wavelengthToRGB(wl).match(/\d+/g);
    function wlA(a){return 'rgba('+_cr[0]+','+_cr[1]+','+_cr[2]+','+a+')';}
    // 1/di = 1/f - 1/do  →  di = f*do/(do-f)
    var diVal=(doPx===f)?1e9:(f*doPx/(doPx-f));
    var bgG=ctx.createLinearGradient(0,0,0,H);bgG.addColorStop(0,'#020810');bgG.addColorStop(1,'#030d1a');
    ctx.fillStyle=bgG;ctx.fillRect(0,0,W,H);
    // Mirror arc: concave, vertex at (mx,cy), center of curvature at (mx-2f, cy)
    ctx.save();
    var mG=ctx.createLinearGradient(mx-12,0,mx+4,0);
    mG.addColorStop(0,'rgba(96,165,250,.0)');mG.addColorStop(0.5,'rgba(147,197,253,.35)');mG.addColorStop(1,'rgba(96,165,250,.0)');
    ctx.beginPath();ctx.arc(mx-2*f,cy,2*f,Math.PI*(-0.65),Math.PI*0.65);
    ctx.strokeStyle=mG;ctx.lineWidth=5;optGlow(ctx,'#93c5fd',12);ctx.stroke();optNoGlow(ctx);
    // Mirror hatching
    for(var ang=-0.6;ang<0.6;ang+=0.1){
      var ax=mx-2*f+(2*f)*Math.cos(ang),ay=cy+(2*f)*Math.sin(ang);
      var nx=Math.cos(ang),ny=Math.sin(ang);
      ctx.strokeStyle='rgba(30,58,95,.55)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(ax+nx*11,ay+ny*11);ctx.stroke();
    }
    ctx.restore();
    // Optical axis
    optDash(ctx,14,cy,W-8,cy,'#1e3a5f',0.5);
    // F and C markers
    var Fx=mx-f,Cx=mx-2*f;
    [{x:Fx,l:'F',c:'#f59e0b'},{x:Cx,l:'C',c:'#94a3b8'}].forEach(function(p){
      ctx.save();ctx.strokeStyle=p.c;ctx.lineWidth=2;optGlow(ctx,p.c,6);
      ctx.beginPath();ctx.moveTo(p.x,cy-9);ctx.lineTo(p.x,cy+9);ctx.stroke();optNoGlow(ctx);ctx.restore();
      ctx.save();ctx.fillStyle='rgba(4,9,20,.75)';ctx.beginPath();ctx.roundRect(p.x-10,cy+12,20,16,3);ctx.fill();ctx.restore();
      optLabel(ctx,p.l,p.x,cy+20,p.c,10);
    });
    // Object arrow
    var objX=mx-doPx,objH=60;
    // Keep object visible on screen
    objX=Math.max(16,objX);
    ctx.save();ctx.strokeStyle='#60a5fa';ctx.lineWidth=3;optGlow(ctx,'#60a5fa',10);
    ctx.beginPath();ctx.moveTo(objX,cy);ctx.lineTo(objX,cy-objH);ctx.stroke();
    ctx.fillStyle='#93c5fd';ctx.beginPath();ctx.moveTo(objX,cy-objH);ctx.lineTo(objX-8,cy-objH+15);ctx.lineTo(objX+8,cy-objH+15);ctx.closePath();ctx.fill();
    optNoGlow(ctx);ctx.restore();
    optLabel(ctx,'עצם',objX,cy+14,'#60a5fa',10);
    if(!hasDragged&&animT<7){
      optLabel(ctx,'✋ גרור את העצם',objX,cy-objH-24+Math.sin(animT*4)*3,'#fbbf24',10);
    }
    // Image computation
    var isVirt=diVal<0;
    var imgX=mx-diVal; // real: left of mx, virtual: right of mx (behind)
    var imgH_m=-diVal/doPx; // magnification (negative = inverted)
    var imgTipY=cy-imgH_m*objH; // image tip y in screen coords
    // Draw image if in reasonable range and not at infinity
    var showImg=isFinite(diVal)&&Math.abs(diVal)>8&&imgX>10&&imgX<W-10;
    if(showImg){
      ctx.save();var _ig2=ctx.createRadialGradient(imgX,(cy+imgTipY)/2,2,imgX,(cy+imgTipY)/2,Math.max(46,Math.abs(cy-imgTipY)));
      _ig2.addColorStop(0,isVirt?'rgba(52,211,153,.16)':'rgba(248,113,113,.15)');_ig2.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=_ig2;ctx.beginPath();ctx.arc(imgX,(cy+imgTipY)/2,Math.max(46,Math.abs(cy-imgTipY)),0,Math.PI*2);ctx.fill();ctx.restore();
      ctx.save();ctx.strokeStyle=isVirt?'#34d399':'#f87171';ctx.lineWidth=4;
      if(isVirt)ctx.setLineDash([6,4]);
      optGlow(ctx,isVirt?'#34d399':'#f87171',14);
      ctx.beginPath();ctx.moveTo(imgX,cy);ctx.lineTo(imgX,imgTipY);ctx.stroke();
      var arrowDir=imgTipY<cy?1:-1;
      ctx.fillStyle=isVirt?'rgba(52,211,153,.5)':'rgba(248,113,113,.5)';
      ctx.beginPath();ctx.moveTo(imgX,imgTipY);
      ctx.lineTo(imgX-7,imgTipY+arrowDir*14);ctx.lineTo(imgX+7,imgTipY+arrowDir*14);
      ctx.closePath();ctx.fill();
      ctx.setLineDash([]);optNoGlow(ctx);ctx.restore();
      optLabel(ctx,isVirt?'מדומה':'ממשית',imgX,Math.min(imgTipY,cy)-20,isVirt?'#34d399':'#f87171',9);
    }
    // ── 3 canonical rays ────────────────────────────────────────────────────
    if(isFinite(diVal)&&Math.abs(diVal)>8){
      var objTipX=objX,objTipY=cy-objH;

      // RAY 1: parallel to axis → hits mirror at (mx, cy-objH) → reflects through F
      // Slope of reflected ray: from (mx, cy-objH) through F=(Fx, cy)
      // slope = (cy-(cy-objH))/(Fx-mx) = objH/(Fx-mx) = objH/(-f) = -objH/f
      var r1slope=-objH/f; // negative: going upward-left or downward depending on sign
      // For real image: reflected ray from (mx, cy-objH) with slope r1slope goes left toward image
      // The exit ray from mx with slope r1slope: y = (cy-objH) + r1slope*(x-mx)
      // At x=imgX: y = (cy-objH)+r1slope*(imgX-mx) = (cy-objH)+(-objH/f)*(-diVal) = cy-objH+objH*diVal/f
      // Since diVal = f*doPx/(doPx-f): objH*diVal/f = objH*doPx/(doPx-f) = imgH_m*(-1)*objH... let me just draw to imgTipY
      var Rarc=2*f,mArcC=mx-2*f;
      function mHitX(yy){var dyv=yy-cy;var s2=Rarc*Rarc-dyv*dyv;return s2>0?mArcC+Math.sqrt(s2):mx;}
      var h1x=mHitX(objTipY);
      ctx.save();ctx.strokeStyle='rgba(251,191,36,.7)';ctx.lineWidth=2;
      // Incident: horizontal to the actual arc surface
      optRay(ctx,Math.max(10,objTipX-10),objTipY,h1x,objTipY,'rgba(251,191,36,.7)',1.8,false);
      if(!isVirt&&showImg){
        optRay(ctx,h1x,objTipY,imgX,imgTipY,'rgba(251,191,36,.7)',1.8,true);
      } else {
        var r1exitX=14;
        var r1exitY=(cy-objH)+r1slope*(r1exitX-mx);
        optRay(ctx,h1x,objTipY,r1exitX,r1exitY,'rgba(251,191,36,.7)',1.8,true);
        if(showImg)optDash(ctx,h1x,objTipY,imgX,imgTipY,'rgba(251,191,36,.4)');
      }
      ctx.restore();

      // RAY 2: toward C=(mx-2f,cy) → hits mirror, retroreflects (through C)
      // Slope from objTip to C: (cy-objTipY)/(Cx-objTipX) = objH/(Cx-objTipX)
      var r2slope=objH/(Cx-objTipX);
      // Hit point on mirror: the mirror arc (circle: center=(mx-2f,cy), r=2f)
      // The line: y = objTipY + r2slope*(x-objTipX), parametric at x=mx... 
      // Approximation: use mirror vertex x=mx (accurate enough for rays not at edge)
      var r2hitY=objTipY+r2slope*(mx-objTipX);
      var h2x=mHitX(r2hitY);
      ctx.save();
      optRay(ctx,objTipX,objTipY,h2x,r2hitY,'rgba(52,211,153,.65)',1.8,false);
      if(!isVirt&&showImg){
        optRay(ctx,h2x,r2hitY,imgX,imgTipY,'rgba(52,211,153,.65)',1.8,true);
      } else if(showImg){
        var r2exitX=14;
        var r2exitY=r2hitY-r2slope*(mx-r2exitX);
        optRay(ctx,h2x,r2hitY,r2exitX,r2exitY,'rgba(52,211,153,.65)',1.8,true);
        optDash(ctx,h2x,r2hitY,imgX,imgTipY,'rgba(52,211,153,.35)');
      }
      ctx.restore();

      // RAY 3: through F=(Fx,cy) → hits mirror → exits parallel to axis
      // Slope from objTip to F: (cy-objTipY)/(Fx-objTipX) = objH/(Fx-objTipX)
      var r3slope=objH/(Fx-objTipX);
      var r3hitY=objTipY+r3slope*(mx-objTipX);
      var h3x=mHitX(r3hitY);
      ctx.save();
      optRay(ctx,objTipX,objTipY,h3x,r3hitY,'rgba(167,139,250,.65)',1.8,false);
      var r3exitX=14;
      optRay(ctx,h3x,r3hitY,r3exitX,r3hitY,'rgba(167,139,250,.65)',1.8,true);
      ctx.restore();
    } else if(!isFinite(diVal)){
      // Object at focal point: image at infinity, rays exit parallel
      optLabel(ctx,'תמונה באינסוף',W/2,cy-80,'#f59e0b',11);
    }
    // Info box
    var diS=isFinite(diVal)?Math.round(diVal)+'px':'∞';
    var mS=isFinite(diVal)?(-diVal/doPx).toFixed(2):'∞';
    var _cn2=wl<430?'UV':wl<470?'סגול':wl<500?'כחול':wl<560?'ירוק':wl<590?'צהוב':wl<625?'כתום':'אדום';
    ctx.save();ctx.fillStyle=wlHex;optGlow(ctx,wlHex,8);ctx.beginPath();ctx.arc(W-20,H-20,8,0,Math.PI*2);ctx.fill();optNoGlow(ctx);ctx.restore();
    optInfoBox(ctx,8,8,172,['f='+f+'px','dₒ='+Math.round(doPx)+'px','dᵢ='+diS,'הגדלה m='+mS,'λ='+Math.round(wl)+'nm '+_cn2]);
    if(dragObj){
      var _mm=Math.abs(doPx-f)<7?'dₒ = f — הקרניים יוצאות מקבילות: אין תמונה!':Math.abs(doPx-2*f)<9?'dₒ = 2f (במרכז העקמומיות C) — תמונה הפוכה בגודל שווה!':doPx<f?'dₒ < f — מראת איפור: מדומה, ישרה ומוגדלת':'';
      if(_mm){ctx.save();ctx.fillStyle='rgba(4,9,20,.88)';ctx.strokeStyle='#fbbf24';ctx.lineWidth=1;
        ctx.beginPath();ctx.roundRect(W/2-160,H-34,320,24,6);ctx.fill();ctx.stroke();ctx.restore();
        optLabel(ctx,_mm,W/2,H-21,'#fbbf24',10);}
    }
    // Animated photon along ray 1 (horizontal incident, toward mirror)
    var _ph=(animT*0.35)%1;
    var _pSX=Math.max(16,objX),_pEX=mx;
    ctx.save();ctx.fillStyle=wlHex;optGlow(ctx,wlHex,14);
    ctx.beginPath();ctx.arc(_pSX+(_pEX-_pSX)*_ph,cy-objH,3.5,0,Math.PI*2);ctx.fill();
    optNoGlow(ctx);ctx.restore();
    requestAnimationFrame(draw);
  }
  function poll(){if(_simStop[id])return;requestAnimationFrame(draw);}poll();
}

        ctx.beginPath();ctx.roundRect(W/2-160,H-34,320,24,6);ctx.fill();ctx.stroke();ctx.restore();

    optNoGlow(ctx);ctx.restore();

  }

}

// ─── PRISM — Enhanced ─────────────────────────────────────────────

  function _prMv(e){var p=simPointerXY(canvas,(window.devicePixelRatio||1),e);
    if(dragBeam){var en=_entPt();

  function _prUp(){dragBeam=false;canvas.style.cursor='';}

  canvas.addEventListener('mousemove',_prMv);canvas.addEventListener('touchmove',_prMv,{passive:false});

    pg.addColorStop(0,'rgba(99,102,241,.15)');pg.addColorStop(0.5,'rgba(147,197,253,.07)');pg.addColorStop(1,'rgba(99,102,241,.12)');
    ctx.save();ctx.fillStyle=pg;
    ctx.beginPath();ctx.moveTo(pw[0],ph[0]);ctx.lineTo(pw[1],ph[1]);ctx.lineTo(pw[2],ph[2]);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(147,197,253,.55)';ctx.lineWidth=2;optGlow(ctx,'#93c5fd',8);ctx.stroke();optNoGlow(ctx);
    ctx.restore();
    optLabel(ctx,'n≈1.52',W/2,H*0.62,'rgba(147,197,253,.45)',9);
    // Entry point on left face
    // Left face: from (pw[0],ph[0]) to (pw[2],ph[2])
    // Entry ~60% up the left face
    var et=0.52;
    var entX=pw[0]+(pw[2]-pw[0])*et,entY=ph[0]+(ph[2]-ph[0])*et;
    // Incident angle from the slider (measured from the face normal)

    // Inward normal of the left face → beam direction that makes exactly θᵢ with it

    // Incident white beam

    optNoGlow(ctx);ctx.restore();

    optLabel(ctx,'θ='+Math.round(theta_i*180/Math.PI)+'°',entX-40,entY-24,'#fbbf24',9);

    // Entry: ray comes horizontally (dx=1, dy=0), face normal is (nOutX, nOutY)
    // Angle of incidence = angle between ray direction and inward normal
    // Inward normal: (-nOutX, -nOutY)
    // For computation: we already have theta_i defined = 0.4 rad from face normal
    // Inside ray direction: rotate inward normal by r1 toward the ray side
    // Right face: from (pw[1],ph[1]) to (pw[2],ph[2])
    var rfDx=pw[2]-pw[1],rfDy=ph[2]-ph[1];

      // Direction inside prism: angled by r1 from the inward left-face normal
      var inNx=-nOutX,inNy=-nOutY; // inward normal of left face

      // Parametric intersection: entX+t*insRayX, entY+t*insRayY = pw[1]+s*(pw[2]-pw[1]), ph[1]+s*(ph[2]-ph[1])

  }requestAnimationFrame(draw);
}
