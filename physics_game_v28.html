// ─────────────────────────────────────────────────────────────
// FBD: block on surface, all forces shown

// ═══════════════════════════════════════════════════════════════
// CH2 SIM 5: FBD — block on surface, draggable applied force
// ═══════════════════════════════════════════════════════════════
function simFBD(canvas){
  // SECTION: forces.force-intro — כוח ומדידתו
  // PEDAGOGY: Force is measured with a spring scale (dynamometer). Student drags real
  // objects onto the hanging scale and watches the needle deflect, reading W=mg live.
  // Then can apply an additional push force to see net force concept.
  const H=500; const {ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;
  const g=9.8;
  let pT=null, t=0;
  let scaleReading=0, scaleTarget=0;
  let activeObj=null;

  const OBJ=[
    {label:'קוביה',    m:0.5, col:'#d97706', emoji:'🟫', ox:W*0.09, oy:H*0.53},
    {label:'אבן',      m:2.0, col:'#64748b', emoji:'🪨', ox:W*0.09, oy:H*0.68},
    {label:'ספר',      m:1.0, col:'#2563eb', emoji:'📘', ox:W*0.09, oy:H*0.83},
  ];
  OBJ.forEach(o=>{o.x=o.ox; o.y=o.oy; o.onScale=false;});
  let dragObj=null, dragOX=0, dragOY=0;

  const SCALE_X=W*0.50, SCALE_TOP=72, SCALE_H=130, SCALE_W=48;
  const SCALE_CY=SCALE_TOP+90;

  function getXY(evt){
    const r=canvas.getBoundingClientRect();
    const scl=(canvas.width/dpr)/r.width;
    return {
      x:((evt.touches?evt.touches[0].clientX:evt.clientX)-r.left)*scl,
      y:((evt.touches?evt.touches[0].clientY:evt.clientY)-r.top)*scl
    };
  }
  function onDown(e){
    e.preventDefault();
    const {x,y}=getXY(e);
    for(let i=OBJ.length-1;i>=0;i--){
      if(Math.abs(x-OBJ[i].x)<28&&Math.abs(y-OBJ[i].y)<28){
        dragObj=OBJ[i]; dragOX=x-OBJ[i].x; dragOY=y-OBJ[i].y;
        OBJ[i].onScale=false; if(activeObj===OBJ[i]){activeObj=null;scaleTarget=0;}
        break;
      }
    }
  }
  function onMove(e){
    if(!dragObj)return; e.preventDefault();
    const {x,y}=getXY(e); dragObj.x=x-dragOX; dragObj.y=y-dragOY;
  }
  function onUp(){
    if(!dragObj)return;
    if(Math.abs(dragObj.x-SCALE_X)<65&&dragObj.y>SCALE_CY&&dragObj.y<H-40){
      dragObj.onScale=true; dragObj.x=SCALE_X; dragObj.y=SCALE_CY+SCALE_H/2+50;
      if(activeObj&&activeObj!==dragObj){activeObj.onScale=false;activeObj.x=activeObj.ox;activeObj.y=activeObj.oy;}
      activeObj=dragObj; scaleTarget=activeObj.m*g;
    }
    dragObj=null;
  }
  canvas.addEventListener('mousedown',onDown); canvas.addEventListener('touchstart',onDown,{passive:false});
  canvas.addEventListener('mousemove',onMove); canvas.addEventListener('touchmove',onMove,{passive:false});
  canvas.addEventListener('mouseup',onUp); canvas.addEventListener('touchend',onUp);

  const resetBtn=document.getElementById('btn-fbd-reset');
  if(resetBtn)resetBtn.addEventListener('click',()=>{
    OBJ.forEach(o=>{o.x=o.ox;o.y=o.oy;o.onScale=false;});
    activeObj=null; scaleTarget=0; scaleReading=0;
  });

  function drawSpring(x1,y1,x2,y2,coils,cw,col,lw){
    const dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);
    const ux=dx/len,uy=dy/len,px=-uy,py=ux;
    ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=lw;
    ctx.beginPath(); ctx.moveTo(x1,y1);
    for(var ci=0;ci<coils;ci++){
      var frac=(ci+0.5)/coils, fm=(ci+1)/coils;
      ctx.lineTo(x1+ux*len*frac+px*cw,y1+uy*len*frac+py*cw);
      ctx.lineTo(x1+ux*len*fm,y1+uy*len*fm);
    }
    ctx.stroke(); ctx.restore();
  }

  function draw(ts){
    if(_simStop[id])return;
    if(!pT)pT=ts; const dt=Math.min((ts-pT)/1000,.04); pT=ts;
    t+=dt;
    scaleReading+=(scaleTarget-scaleReading)*Math.min(1,dt*5);

    simBg(ctx,W,H);

    // Background shelf guide
    ctx.save(); ctx.strokeStyle='rgba(30,58,82,.4)'; ctx.lineWidth=1; ctx.setLineDash([4,8]);
    ctx.beginPath(); ctx.moveTo(W*0.03,H*0.47); ctx.lineTo(W*0.25,H*0.47); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W*0.03,H*0.90); ctx.lineTo(W*0.25,H*0.90); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
    simText(ctx,'גופים לשקילה',W*0.14,H*0.44,'#1e3a52',8,undefined,true);

    // ── SPRING SCALE ──────────────────────────────────────────
    const scaleMaxN=30, extMax=88;
    const ext=(Math.min(scaleReading,scaleMaxN)/scaleMaxN)*extMax;

    // Ceiling anchor
    ctx.save(); ctx.fillStyle='#1e3a52'; ctx.fillRect(SCALE_X-36,SCALE_TOP-14,72,14); ctx.restore();
    for(var xi=SCALE_X-36;xi<SCALE_X+36;xi+=10){
      ctx.save(); ctx.strokeStyle='#0f2035'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(xi,SCALE_TOP-14); ctx.lineTo(xi-8,SCALE_TOP-22); ctx.stroke(); ctx.restore();
    }
    // Top hook
    ctx.save(); ctx.strokeStyle='#94a3b8'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(SCALE_X,SCALE_TOP); ctx.lineTo(SCALE_X,SCALE_TOP+16); ctx.stroke(); ctx.restore();

    // Spring (inside scale — stretch visible)
    drawSpring(SCALE_X,SCALE_TOP+16,SCALE_X,SCALE_CY-SCALE_H/2,10,12,'#60a5fa',2);

    // Scale body
    const bY=SCALE_CY-SCALE_H/2;
    ctx.save(); ctx.fillStyle='rgba(15,32,53,.9)'; ctx.strokeStyle='#3d6480'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.roundRect(SCALE_X-SCALE_W/2,bY,SCALE_W,SCALE_H+ext,9); ctx.fill(); ctx.stroke(); ctx.restore();
    // Scale face markings
    for(var fi=0;fi<=scaleMaxN;fi+=5){
      var ty=bY+8+(SCALE_H-16)*(1-fi/scaleMaxN);
      var isMain=(fi%10===0);
      ctx.save(); ctx.strokeStyle=isMain?'#94a3b8':'#2d5275'; ctx.lineWidth=isMain?1.5:1;
      ctx.beginPath(); ctx.moveTo(SCALE_X-SCALE_W/2+4,ty); ctx.lineTo(SCALE_X-SCALE_W/2+(isMain?16:8),ty); ctx.stroke(); ctx.restore();
      if(isMain) simText(ctx,fi+'',SCALE_X-SCALE_W/2+20,ty+3,'#475569',7,'left');
    }
    // Needle
    var needleY=bY+8+(SCALE_H-16)*(1-Math.min(scaleReading,scaleMaxN)/scaleMaxN);
    ctx.save(); ctx.strokeStyle='#ef4444'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(SCALE_X-SCALE_W/2+4,needleY); ctx.lineTo(SCALE_X+SCALE_W/2-4,needleY); ctx.stroke(); ctx.restore();
    // Reading display
    ctx.save(); ctx.fillStyle='rgba(0,0,0,.85)'; ctx.strokeStyle='#ef4444'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.roundRect(SCALE_X-24,needleY-11,48,15,3); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,scaleReading.toFixed(2)+' N',SCALE_X,needleY-1,'#ef4444',9,undefined,true);
    // Scale title
    simText(ctx,'N',SCALE_X,bY+SCALE_H+ext-6,'#64748b',8,undefined,true);

    // Bottom wire
    var wireBot=bY+SCALE_H+ext;
    ctx.save(); ctx.strokeStyle='#94a3b8'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(SCALE_X,wireBot); ctx.lineTo(SCALE_X,wireBot+18); ctx.stroke(); ctx.restore();
    // Bottom hook
    ctx.save(); ctx.strokeStyle='#94a3b8'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(SCALE_X,wireBot+22,4,Math.PI,0); ctx.stroke(); ctx.restore();

    // ── Object on scale ────────────────────────────────────
    if(activeObj){
      activeObj.x=SCALE_X;
      activeObj.y=wireBot+42;
      var bS=46;
      ctx.save(); ctx.shadowColor=activeObj.col; ctx.shadowBlur=16;
      ctx.fillStyle=activeObj.col+'cc'; ctx.strokeStyle=activeObj.col; ctx.lineWidth=2;
      ctx.beginPath(); ctx.roundRect(SCALE_X-bS/2,activeObj.y-bS/2,bS,bS,7); ctx.fill(); ctx.stroke();
      ctx.shadowBlur=0; ctx.restore();
      ctx.save(); ctx.font='18px serif'; ctx.textAlign='center';
      ctx.fillText(activeObj.emoji,SCALE_X,activeObj.y+6); ctx.restore();
      // Weight arrow down
      var wLen=Math.min(54,activeObj.m*g*2);
      simArrow(ctx,SCALE_X,activeObj.y+bS/2+2,SCALE_X,activeObj.y+bS/2+2+wLen,'#fbbf24',2.5,10);
      simText(ctx,'W=mg='+( activeObj.m*g).toFixed(1)+'N',SCALE_X+7,activeObj.y+bS/2+wLen/2+2,'#fbbf24',8.5,'left');
      // Tension arrow up
      simArrow(ctx,SCALE_X,activeObj.y-bS/2-2,SCALE_X,activeObj.y-bS/2-34,'#22d3ee',2.5,9);
      simText(ctx,'T='+scaleReading.toFixed(1)+'N',SCALE_X+7,activeObj.y-bS/2-20,'#22d3ee',8.5,'left');
      // Object label
      simText(ctx,activeObj.label+' | '+activeObj.m+' kg',SCALE_X,activeObj.y+bS/2+wLen+14,activeObj.col,8,undefined,true);
    }

    // ── Draggable shelf objects ─────────────────────────────
    OBJ.forEach(function(obj){
      if(obj===dragObj||obj.onScale)return;
      ctx.save(); ctx.shadowColor=obj.col; ctx.shadowBlur=6;
      ctx.fillStyle=obj.col+'bb'; ctx.strokeStyle=obj.col; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.roundRect(obj.x-22,obj.y-22,44,44,6); ctx.fill(); ctx.stroke();
      ctx.shadowBlur=0; ctx.restore();
      ctx.save(); ctx.font='16px serif'; ctx.textAlign='center';
      ctx.fillText(obj.emoji,obj.x,obj.y+5); ctx.restore();
      simText(ctx,obj.label,obj.x,obj.y+28,obj.col,7.5,undefined,true);
      simText(ctx,obj.m+' kg',obj.x,obj.y+38,'#64748b',7.5,undefined,true);
    });
    if(dragObj){
      ctx.save(); ctx.globalAlpha=0.8; ctx.shadowColor=dragObj.col; ctx.shadowBlur=18;
      ctx.fillStyle=dragObj.col+'cc'; ctx.strokeStyle=dragObj.col; ctx.lineWidth=2;
      ctx.beginPath(); ctx.roundRect(dragObj.x-22,dragObj.y-22,44,44,6); ctx.fill(); ctx.stroke();
      ctx.shadowBlur=0; ctx.restore();
      ctx.save(); ctx.font='16px serif'; ctx.textAlign='center';
      ctx.fillText(dragObj.emoji,dragObj.x,dragObj.y+5); ctx.restore();
    }

    // ── Right panel ─────────────────────────────────────────
    var PX=W*0.73, PW=W-PX-10, PY=46;
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.92)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(PX,PY,PW,H-PY-8,6); ctx.fill(); ctx.stroke(); ctx.restore();
    var PC=PX+PW/2;
    simText(ctx,'נוסחה',PC,PY+14,'#22d3ee',10,undefined,true);
    simText(ctx,'W = m × g',PC,PY+30,'#fbbf24',11,undefined,true);
    ctx.save(); ctx.strokeStyle='#1e4060'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(PX+6,PY+36); ctx.lineTo(PX+PW-6,PY+36); ctx.stroke(); ctx.restore();
    simText(ctx,'g = 9.8 m/s²',PC,PY+48,'#64748b',8.5,undefined,true);
    if(activeObj){
      simText(ctx,'m='+activeObj.m+' kg',PC,PY+62,'#60a5fa',9,undefined,true);
      simText(ctx,'W=',PC,PY+76,'#94a3b8',9,undefined,true);
      simText(ctx,( activeObj.m*g).toFixed(2)+' N',PC,PY+92,'#fbbf24',12,undefined,true);
      simText(ctx,'מד קורא:',PC,PY+108,'#94a3b8',8,undefined,true);
      simText(ctx,scaleReading.toFixed(2)+' N',PC,PY+122,'#ef4444',11,undefined,true);
    } else {
      simText(ctx,'גרור גוף',PC,PY+68,'#fbbf24',9.5,undefined,true);
      simText(ctx,'→ מד-כוח',PC,PY+82,'#fbbf24',9.5,undefined,true);
    }
    ctx.save(); ctx.strokeStyle='#1e4060'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(PX+6,PY+130); ctx.lineTo(PX+PW-6,PY+130); ctx.stroke(); ctx.restore();
    simText(ctx,'כוח = וקטור',PC,PY+143,'#a78bfa',8.5,undefined,true);
    simText(ctx,'יחידה: נ׳ (N)',PC,PY+156,'#a78bfa',8.5,undefined,true);
    simText(ctx,'1N=1kg·m/s²',PC,PY+169,'#64748b',8,undefined,true);

    // Drop zone pulsing hint
    if(!activeObj&&t<6){
      var pulse=0.4+0.4*Math.sin(t*2.5);
      ctx.save(); ctx.globalAlpha=pulse; ctx.strokeStyle='#fbbf24'; ctx.lineWidth=2; ctx.setLineDash([5,5]);
      ctx.beginPath(); ctx.roundRect(SCALE_X-55,SCALE_CY+40,110,H-SCALE_CY-56,8); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}

// ─────────────────────────────────────────────────────────────
// MOMENTUM DISPLAY: p = mv, drag slider
// ─────────────────────────────────────────────────────────────
function simMomentumDisplay(canvas){
  var H=460; var setup=setupCanvas(canvas,H); var ctx=setup.ctx; var W=setup.W;
  var id=canvas.id;
  var mass=2, vel=4, pos=W*0.3, pT=null;
  var pHistory=[], vHistory=[];

  function readSliders(){
    var mS=document.getElementById('inp-mom-mass');
    var vS=document.getElementById('inp-mom-vel');
    if(mS){mass=parseFloat(mS.value);var l=document.getElementById('lbl-mom-mass');if(l)l.textContent=mass+' kg';}
    if(vS){vel=parseFloat(vS.value);var l2=document.getElementById('lbl-mom-vel');if(l2)l2.textContent=vel+' m/s';}
  }
  ['inp-mom-mass','inp-mom-vel'].forEach(function(sid){
    var el=document.getElementById(sid);
    if(el) el.addEventListener('input',readSliders);
  });
  readSliders();

  var GND=H-70;
  var GRAPH_TOP=GND+14, GRAPH_H=H-GRAPH_TOP-8;

  function draw(ts){
    if(_simStop[id]) return;
    if(!pT) pT=ts;
    var dt=Math.min((ts-pT)/1000, 0.04); pT=ts;
    readSliders();

    // Physics: ball bounces
    pos += vel*dt*26;
    var r=Math.max(16, mass*5.5);
    if(pos>W-r){pos=W-r; vel=-Math.abs(vel);}
    if(pos<r){pos=r; vel=Math.abs(vel);}

    var p=mass*Math.abs(vel);
    pHistory.push(p); vHistory.push(Math.abs(vel));
    if(pHistory.length>180){pHistory.shift(); vHistory.shift();}

    simBg(ctx,W,H);

    // ── Ground + hatching
    simGround(ctx,W,GND);

    // ── Ball with radial gradient glow
    var g=ctx.createRadialGradient(pos-r*0.35,GND-r-r*0.35,r*0.05,pos,GND-r,r);
    g.addColorStop(0,'#bfdbfe'); g.addColorStop(0.6,'#2563eb'); g.addColorStop(1,'rgba(15,30,80,.7)');
    simCircle(ctx,pos,GND-r,r,g,'#60a5fa',2);
    simText(ctx,mass+' kg',pos,GND-r+5,'#fff',Math.min(11,r*0.65),undefined,true);

    // ── Velocity arrow above ball
    var arrowLen=vel*10;
    if(Math.abs(vel)>0.1){
      simArrow(ctx,pos,GND-r*2-8,pos+arrowLen,GND-r*2-8,vel>=0?'#34d399':'#f87171',2.5,10);
      simText(ctx,'v='+Math.abs(vel).toFixed(1)+' m/s',pos+arrowLen+(arrowLen>0?6:-6),GND-r*2-8,vel>=0?'#6ee7b7':'#fca5a5',9,undefined,false);
    }

    // ── Big info panel
    ctx.save();ctx.fillStyle='rgba(6,14,28,.92)';ctx.strokeStyle='#1e3a52';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(10,8,W-20,64,6);ctx.fill();ctx.stroke();ctx.restore();

    simText(ctx,'p = m × v',W/2,22,'#64748b',9,'center',true);
    simText(ctx,'p = '+mass+' × '+Math.abs(vel).toFixed(1)+' = '+p.toFixed(1)+' kg·m/s',W/2,38,'#22d3ee',13,'center',true);

    // Decomposition display
    var barY=50, barTotal=W-40;
    // mass bar segment
    var mFrac=Math.min(mass/10,1);
    var vFrac=Math.min(Math.abs(vel)/12,1);
    ctx.save();ctx.fillStyle='rgba(15,30,55,.7)';ctx.beginPath();ctx.roundRect(20,barY,barTotal,10,3);ctx.fill();ctx.restore();
    ctx.save();ctx.fillStyle='#3b82f6cc';ctx.beginPath();ctx.roundRect(20,barY,barTotal*mFrac,10,3);ctx.fill();ctx.restore();
    ctx.save();ctx.fillStyle='#34d399cc';ctx.beginPath();ctx.roundRect(20+barTotal*mFrac,barY,barTotal*vFrac*(1-mFrac),10,3);ctx.fill();ctx.restore();
    simText(ctx,'m='+mass+'kg',22,barY+8,'#93c5fd',7.5,undefined,false);
    simText(ctx,'v='+Math.abs(vel).toFixed(1)+' m/s',W-22,barY+8,'#6ee7b7',7.5,'right',false);

    // ── p graph (bottom)
    ctx.save();ctx.fillStyle='rgba(6,14,28,.75)';ctx.strokeStyle='#1e3a52';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(12,GRAPH_TOP,W-24,GRAPH_H,4);ctx.fill();ctx.stroke();ctx.restore();
    simText(ctx,'תנע p לאורך זמן',W/2,GRAPH_TOP+10,'#334e68',7.5,'center');

    if(pHistory.length>2){
      var maxP=Math.max.apply(null,pHistory)*1.1||1;
      // Zero line
      ctx.save();ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=1;ctx.setLineDash([3,5]);
      ctx.beginPath();ctx.moveTo(18,GRAPH_TOP+GRAPH_H-6);ctx.lineTo(W-18,GRAPH_TOP+GRAPH_H-6);ctx.stroke();ctx.setLineDash([]);ctx.restore();
      // p curve
      ctx.save();ctx.strokeStyle='#22d3ee';ctx.lineWidth=2;ctx.beginPath();
      pHistory.forEach(function(pv,i){
        var px2=18+(W-36)*i/(pHistory.length-1);
        var py2=GRAPH_TOP+GRAPH_H-6-(pv/maxP)*(GRAPH_H-14);
        i===0?ctx.moveTo(px2,py2):ctx.lineTo(px2,py2);
      });
      ctx.stroke();ctx.restore();
      simText(ctx,'p='+p.toFixed(1)+' kg·m/s',W-18,GRAPH_TOP+14,'#22d3ee',8,'right',true);
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}


// ─────────────────────────────────────────────────────────────
// MOMENTUM CONSERVATION: two balls collide
// ─────────────────────────────────────────────────────────────
function simMomentumCons(canvas){
  var H=480; var setup=setupCanvas(canvas,H); var ctx=setup.ctx; var W=setup.W;
  var id=canvas.id;
  var m1=3, m2=2, v1i=5, v2i=-2;
  var pT=null, state='before', collTimer=0;
  var x1, x2, v1, v2;
  var p_trace=[];

  function reset(){
    x1=W*0.22; x2=W*0.78;
    v1=v1i; v2=v2i;
    state='before'; collTimer=0; p_trace=[];
  }
  reset();

  function readSliders(){
    var m1S=document.getElementById('inp-mc-m1');
    var m2S=document.getElementById('inp-mc-m2');
    var v1S=document.getElementById('inp-mc-v1');
    var v2S=document.getElementById('inp-mc-v2');
    var changed=false;
    if(m1S){var nv=parseFloat(m1S.value);if(nv!==m1){m1=nv;changed=true;} var l=document.getElementById('lbl-mc-m1');if(l)l.textContent=m1+' kg';}
    if(m2S){var nv2=parseFloat(m2S.value);if(nv2!==m2){m2=nv2;changed=true;} var l2=document.getElementById('lbl-mc-m2');if(l2)l2.textContent=m2+' kg';}
    if(v1S){var nv3=parseFloat(v1S.value);if(nv3!==v1i){v1i=nv3;changed=true;} var l3=document.getElementById('lbl-mc-v1');if(l3)l3.textContent=v1i+' m/s';}
    if(v2S){var nv4=parseFloat(v2S.value);if(nv4!==v2i){v2i=nv4;changed=true;} var l4=document.getElementById('lbl-mc-v2');if(l4)l4.textContent=v2i+' m/s';}
    if(changed) reset();
  }
  ['inp-mc-m1','inp-mc-m2','inp-mc-v1','inp-mc-v2'].forEach(function(sid){
    var el=document.getElementById(sid);
    if(el) el.addEventListener('input',readSliders);
  });
  var resetBtn=document.getElementById('btn-mc-reset');
  if(resetBtn) resetBtn.addEventListener('click',function(){readSliders(); reset();});
  readSliders();

  var GND=H-80;
  var GRAPH_TOP=GND+14, GRAPH_H=H-GRAPH_TOP-8;

  function getElastic(m1v,m2v,v1in,v2in){
    return {
      v1f:((m1v-m2v)*v1in+2*m2v*v2in)/(m1v+m2v),
      v2f:(2*m1v*v1in+(m2v-m1v)*v2in)/(m1v+m2v)
    };
  }

  function draw(ts){
    if(_simStop[id]) return;
    if(!pT) pT=ts;
    var dt=Math.min((ts-pT)/1000, 0.04); pT=ts;
    readSliders();

    var r1=Math.max(16,m1*4.5);
    var r2=Math.max(14,m2*4.5);

    x1+=v1*dt*28; x2+=v2*dt*28;

    // Collision detection
    if(x1+r1>=x2-r2 && state==='before'){
      var res=getElastic(m1,m2,v1,v2);
      v1=res.v1f; v2=res.v2f;
      state='after'; collTimer=0;
    }
    collTimer+=dt;

    // Wall bounces
    if(x1<=r1+8){x1=r1+8; v1=Math.abs(v1);}
    if(x1>=W-r1-8){x1=W-r1-8; v1=-Math.abs(v1);}
    if(x2<=r2+8){x2=r2+8; v2=Math.abs(v2);}
    if(x2>=W-r2-8){x2=W-r2-8; v2=-Math.abs(v2);}

    var p_before=m1*v1i+m2*v2i;
    var p_now=m1*v1+m2*v2;
    p_trace.push({before:p_before, now:p_now});
    if(p_trace.length>160) p_trace.shift();

    simBg(ctx,W,H);
    simGround(ctx,W,GND);

    // ── Info banner
    ctx.save();ctx.fillStyle='rgba(6,14,28,.92)';ctx.strokeStyle='#1e3a52';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(10,8,W-20,52,6);ctx.fill();ctx.stroke();ctx.restore();
    simText(ctx,'שימור תנע: p_לפני = p_אחרי',W/2,21,'#64748b',9,'center');
    simText(ctx,'p_לפני = '+p_before.toFixed(2)+' kg·m/s',W/2,35,'#fbbf24',10,'center',true);
    simText(ctx,'p_כעת = '+p_now.toFixed(2)+' kg·m/s   '+(Math.abs(p_before-p_now)<0.15?'✅ שמור!':''),W/2,50,'#22d3ee',10,'center',true);

    // ── Ball 1
    var g1=ctx.createRadialGradient(x1-r1*0.3,GND-r1-r1*0.3,r1*0.08,x1,GND-r1,r1);
    g1.addColorStop(0,'#bfdbfe'); g1.addColorStop(1,'rgba(29,78,216,.85)');
    simCircle(ctx,x1,GND-r1,r1,g1,'#60a5fa',2);
    simText(ctx,m1+'kg',x1,GND-r1+5,state==='after'?'#22d3ee':'#fff',9,undefined,true);
    simText(ctx,'v₁='+v1.toFixed(1),x1,GND-r1*2-14,'#93c5fd',8.5,undefined,true);
    if(Math.abs(v1)>0.2){
      simArrow(ctx,x1,GND-r1*2-5,x1+v1*12,GND-r1*2-5,v1>=0?'#60a5fa':'#818cf8',2.5,9);
    }

    // ── Ball 2
    var g2=ctx.createRadialGradient(x2-r2*0.3,GND-r2-r2*0.3,r2*0.08,x2,GND-r2,r2);
    g2.addColorStop(0,'#fecaca'); g2.addColorStop(1,'rgba(185,28,28,.85)');
    simCircle(ctx,x2,GND-r2,r2,g2,'#f87171',2);
    simText(ctx,m2+'kg',x2,GND-r2+5,state==='after'?'#22d3ee':'#fff',9,undefined,true);
    simText(ctx,'v₂='+v2.toFixed(1),x2,GND-r2*2-14,'#fca5a5',8.5,undefined,true);
    if(Math.abs(v2)>0.2){
      simArrow(ctx,x2,GND-r2*2-5,x2+v2*12,GND-r2*2-5,v2>=0?'#f87171':'#fbbf24',2.5,9);
    }

    // Collision flash
    if(state==='after'&&collTimer<0.4){
      var alpha=(0.4-collTimer)/0.4;
      ctx.save();ctx.globalAlpha=alpha*0.6;
      var gf=ctx.createRadialGradient((x1+x2)/2,GND-r1,0,(x1+x2)/2,GND-r1,26);
      gf.addColorStop(0,'#fbbf24');gf.addColorStop(1,'transparent');
      ctx.fillStyle=gf;ctx.beginPath();ctx.arc((x1+x2)/2,GND-r1,26,0,Math.PI*2);ctx.fill();ctx.restore();
    }

    // ── p trace graph
    ctx.save();ctx.fillStyle='rgba(6,14,28,.78)';ctx.strokeStyle='#1e3a52';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(12,GRAPH_TOP,W-24,GRAPH_H,4);ctx.fill();ctx.stroke();ctx.restore();
    simText(ctx,'תנע כולל לאורך זמן',W/2,GRAPH_TOP+10,'#334e68',7.5,'center');

    if(p_trace.length>2){
      var pMax=Math.max.apply(null,p_trace.map(function(p){return Math.abs(p.before)*1.2;}))||1;
      // Before line (gold, flat)
      ctx.save();ctx.strokeStyle='rgba(251,191,36,.6)';ctx.lineWidth=1.5;ctx.setLineDash([4,5]);
      ctx.beginPath();
      var refY=GRAPH_TOP+GRAPH_H-6-(p_before/pMax)*(GRAPH_H-14);
      ctx.moveTo(18,refY);ctx.lineTo(W-18,refY);
      ctx.stroke();ctx.setLineDash([]);ctx.restore();
      simText(ctx,'p_לפני=const',W-20,refY-4,'#fbbf24',7,'right');

      // Now line
      ctx.save();ctx.strokeStyle='#22d3ee';ctx.lineWidth=2;ctx.beginPath();
      p_trace.forEach(function(pt,i){
        var px2=18+(W-36)*i/(p_trace.length-1);
        var py2=GRAPH_TOP+GRAPH_H-6-(pt.now/pMax)*(GRAPH_H-14);
        i===0?ctx.moveTo(px2,py2):ctx.lineTo(px2,py2);
      });
      ctx.stroke();ctx.restore();
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}


// ─────────────────────────────────────────────────────────────
// COLLISION: elastic vs inelastic, e coefficient
// ─────────────────────────────────────────────────────────────
function simCollision(canvas){
  var H=520; var setup=setupCanvas(canvas,H); var ctx=setup.ctx; var W=setup.W;
  var id=canvas.id;
  var m1=3, m2=2, v1i=4, v2i=-2, e=1;
  var pT=null, state='before', collTimer=0;
  var x1, x2, v1, v2;
  var p1Hist=[], p2Hist=[], pTotHist=[];
  var MAX_HIST=240;
  var stopped=false;
  // px-per-(m/s)-per-second: controls visual speed
  var PPS=18; // pixels per second per m/s

  function reset(){
    var r1=Math.max(16,m1*4.5), r2=Math.max(14,m2*4.5);
    // Place balls so they approach each other but don't start overlapping
    if(v1i>v2i){
      // m1 on left approaching right, m2 on right
      x1=W*0.18; x2=W*0.78;
    } else {
      // Both moving right (m2 faster) or m2 negative
      x1=W*0.20; x2=W*0.72;
    }
    v1=v1i; v2=v2i;
    state='before'; collTimer=0;
    p1Hist=[]; p2Hist=[]; pTotHist=[];
    stopped=false;
  }
  reset();

  function readSliders(){
    var eS=document.getElementById('inp-col-e');
    var m1S=document.getElementById('inp-col-m1');
    var m2S=document.getElementById('inp-col-m2');
    var v1S=document.getElementById('inp-col-v1');
    var v2S=document.getElementById('inp-col-v2');
    var changed=false;
    if(eS){var nv=parseFloat(eS.value);if(nv!==e){e=nv;changed=true;}
      var lb=document.getElementById('lbl-col-e');if(lb)lb.textContent=nv.toFixed(2);}
    if(m1S){var nv2=parseFloat(m1S.value);if(nv2!==m1){m1=nv2;changed=true;}}
    if(m2S){var nv3=parseFloat(m2S.value);if(nv3!==m2){m2=nv3;changed=true;}}
    if(v1S){var nv4=parseFloat(v1S.value);if(nv4!==v1i){v1i=nv4;changed=true;}}
    if(v2S){var nv5=parseFloat(v2S.value);if(nv5!==v2i){v2i=nv5;changed=true;}}
    if(changed) reset();
  }
  ['inp-col-e','inp-col-m1','inp-col-m2','inp-col-v1','inp-col-v2'].forEach(function(sid){
    var el=document.getElementById(sid);
    if(el) el.addEventListener('input',readSliders);
  });
  var resetBtn=document.getElementById('btn-col-reset');
  if(resetBtn) resetBtn.addEventListener('click',function(){readSliders(); reset();});
  readSliders();

  var GND=H-160;
  var GRAPH_TOP=GND+18, GRAPH_H=H-GRAPH_TOP-10;

  function draw(ts){
    if(_simStop[id]) return;
    if(!pT) pT=ts;
    var dt=Math.min((ts-pT)/1000, 0.04); pT=ts;
    readSliders();

    var r1=Math.max(16,m1*4.5);
    var r2=Math.max(14,m2*4.5);

    if(!stopped){
      // Sub-stepped integration prevents pass-through at high speeds
      var _subN=4, _subDt=dt/_subN;
      for(var _si2=0;_si2<_subN;_si2++){
        x1+=v1*_subDt*PPS; x2+=v2*_subDt*PPS;
        if(state==='before'&&x1+r1>=x2-r2){
          if(v1>v2){
            var v1f=((m1-e*m2)*v1+(1+e)*m2*v2)/(m1+m2);
            var v2f=((m2-e*m1)*v2+(1+e)*m1*v1)/(m1+m2);
            v1=v1f; v2=v2f; state='after'; collTimer=0;
          }
          var _ov=x1+r1-(x2-r2);
          if(_ov>0){ x1-=_ov*0.5; x2+=_ov*0.5; }
        }
      }
      collTimer+=dt;
      // Wall collisions → STOP
      if(x1<=r1+6 || x1>=W-r1-6 || x2<=r2+6 || x2>=W-r2-6){
        stopped=true;
      }
    }

    var p1_now=m1*v1, p2_now=m2*v2, pTot=p1_now+p2_now;
    var ek_now=0.5*m1*v1*v1+0.5*m2*v2*v2;
    var ek_before=0.5*m1*v1i*v1i+0.5*m2*v2i*v2i;
    var p_before=m1*v1i+m2*v2i;

    if(!stopped){
      p1Hist.push(p1_now); p2Hist.push(p2_now); pTotHist.push(pTot);
      if(p1Hist.length>MAX_HIST){p1Hist.shift();p2Hist.shift();pTotHist.shift();}
    }

    simBg(ctx,W,H);
    simGround(ctx,W,GND);

    // Type label banner
    var typeLbl=e>=0.99?'התנגשות אלסטית מושלמת (e=1)':e<=0.01?'התנגשות אי-אלסטית — מתאחדים (e=0)':'התנגשות חצי-אלסטית (e='+e.toFixed(2)+')';
    var typeCol=e>=0.99?'#34d399':e<=0.01?'#f87171':'#f59e0b';
    ctx.save();ctx.fillStyle='rgba(6,14,28,.92)';ctx.strokeStyle=typeCol+'55';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.roundRect(10,8,W-20,54,6);ctx.fill();ctx.stroke();ctx.restore();
    simText(ctx,typeLbl,W/2,24,typeCol,10.5,'center',true);
    simText(ctx,'p_לפני = '+p_before.toFixed(2)+'  p_עכשיו = '+pTot.toFixed(2)+' kg·m/s  '+(Math.abs(p_before-pTot)<0.3?'✅ שמור':'⚠'),W/2,39,'#22d3ee',9,'center',true);
    simText(ctx,'Ek: '+ek_before.toFixed(1)+' → '+ek_now.toFixed(1)+' J  '+(e>=0.99?'✅ שמורה':'↓ '+(100*(1-ek_now/Math.max(ek_before,0.01))).toFixed(0)+'% אובד'),W/2,53,e>=0.99?'#34d399':'#f59e0b',8.5,'center',false);

    // Ball 1
    var g1=ctx.createRadialGradient(x1-r1*0.3,GND-r1-r1*0.3,r1*0.08,x1,GND-r1,r1);
    g1.addColorStop(0,'#bfdbfe');g1.addColorStop(1,'rgba(29,78,216,.85)');
    simCircle(ctx,x1,GND-r1,r1,g1,'#60a5fa',2);
    simText(ctx,m1+'kg',x1,GND-r1+5,'#fff',9,undefined,true);
    if(Math.abs(v1)>0.05){
      var arLen1=v1*PPS*0.6;
      simArrow(ctx,x1,GND-r1*2-10,x1+arLen1,GND-r1*2-10,'#60a5fa',2.5,9);
    }
    simText(ctx,'v₁='+v1.toFixed(2)+' m/s',x1,GND-r1*2-22,'#93c5fd',8,undefined,false);
    simText(ctx,'p₁='+p1_now.toFixed(2),x1,GND-r1*2-34,'#60a5fa',7.5,undefined,false);

    // Ball 2 (or merged)
    if(e<=0.01&&state==='after'){
      var mx2=(x1+x2)/2;
      ctx.save();ctx.fillStyle='rgba(120,15,30,.75)';ctx.strokeStyle='#f87171';ctx.lineWidth=2;
      ctx.beginPath();ctx.roundRect(mx2-r1-r2+4,GND-r1*2,r1*2+r2*2-8,r1*2,5);ctx.fill();ctx.stroke();ctx.restore();
      simText(ctx,(m1+m2)+'kg',mx2,GND-r1+4,'#fff',9,undefined,true);
      if(Math.abs(v1)>0.05){
        var arLen0=v1*PPS*0.6;
        simArrow(ctx,mx2,GND-r1*2-10,mx2+arLen0,GND-r1*2-10,'#f87171',2.5,9);
      }
    } else {
      var g2=ctx.createRadialGradient(x2-r2*0.3,GND-r2-r2*0.3,r2*0.08,x2,GND-r2,r2);
      g2.addColorStop(0,'#fecaca');g2.addColorStop(1,'rgba(185,28,28,.85)');
      simCircle(ctx,x2,GND-r2,r2,g2,'#f87171',2);
      simText(ctx,m2+'kg',x2,GND-r2+5,'#fff',9,undefined,true);
      if(Math.abs(v2)>0.05){
        var arLen2=v2*PPS*0.6;
        simArrow(ctx,x2,GND-r2*2-10,x2+arLen2,GND-r2*2-10,'#f87171',2.5,9);
      }
      simText(ctx,'v₂='+v2.toFixed(2)+' m/s',x2,GND-r2*2-22,'#fca5a5',8,undefined,false);
      simText(ctx,'p₂='+p2_now.toFixed(2),x2,GND-r2*2-34,'#f87171',7.5,undefined,false);
    }

    // Collision flash: core glow + expanding ring + radial sparks
    if(state==='after'&&collTimer<0.35){
      var alpha2=(0.35-collTimer)/0.35;
      var fx2=(x1+x2)/2,fy2=GND-r1;
      ctx.save();ctx.globalAlpha=alpha2*0.65;
      var gf=ctx.createRadialGradient(fx2,fy2,0,fx2,fy2,32);
      gf.addColorStop(0,'#fbbf24');gf.addColorStop(1,'transparent');
      ctx.fillStyle=gf;ctx.beginPath();ctx.arc(fx2,fy2,32,0,Math.PI*2);ctx.fill();ctx.restore();
      var ringR=10+collTimer*160;
      ctx.save();ctx.globalAlpha=alpha2*0.8;
      ctx.strokeStyle='#fde68a';ctx.lineWidth=Math.max(0.5,2.5*alpha2);
      ctx.beginPath();ctx.arc(fx2,fy2,ringR,0,Math.PI*2);ctx.stroke();
      ctx.strokeStyle='#fbbf24';ctx.lineWidth=1.6;
      for(var si2=0;si2<8;si2++){
        var sa=si2*Math.PI/4+0.4;
        var sr1=12+collTimer*90,sr2=sr1+10+alpha2*14;
        ctx.beginPath();ctx.moveTo(fx2+Math.cos(sa)*sr1,fy2+Math.sin(sa)*sr1);
        ctx.lineTo(fx2+Math.cos(sa)*sr2,fy2+Math.sin(sa)*sr2);ctx.stroke();
      }
      ctx.restore();
    }

    // STOPPED banner
    if(stopped){
      ctx.save();ctx.fillStyle='rgba(239,68,68,.18)';ctx.strokeStyle='#f87171';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.roundRect(W/2-110,GND-58,220,30,5);ctx.fill();ctx.stroke();ctx.restore();
      simText(ctx,'פגיעה בקיר — לחץ ↺ אפס להמשך',W/2,GND-38,'#f87171',9.5,undefined,true);
    }

    // Momentum graph: p1 (blue), p2 (red), pTotal (yellow dashed)
    var n=p1Hist.length;
    if(n>1){
      ctx.save();ctx.fillStyle='rgba(6,14,28,.82)';ctx.strokeStyle='#1e3a52';ctx.lineWidth=1;
      ctx.beginPath();ctx.roundRect(12,GRAPH_TOP,W-24,GRAPH_H,4);ctx.fill();ctx.stroke();ctx.restore();
      simText(ctx,'תנע — p₁(כחול), p₂(אדום), p∑(צהוב קו מקווקו) — p∑=קבוע!',W/2,GRAPH_TOP+10,'#64748b',7.5,undefined,true);

      // Compute y-scale to show all values including negative
      var allVals=p1Hist.concat(p2Hist).concat(pTotHist);
      var pMin2=Math.min.apply(null,allVals), pMax2=Math.max.apply(null,allVals);
      var pRange2=Math.max(Math.abs(pMin2),Math.abs(pMax2),1)*2.4;
      var midY=GRAPH_TOP+GRAPH_H/2;
      // Zero line
      ctx.save();ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(14,midY);ctx.lineTo(W-14,midY);ctx.stroke();ctx.restore();
      simText(ctx,'0',14,midY+3,'#334155',6.5,'left');
      simText(ctx,pMax2.toFixed(1),14,GRAPH_TOP+18,'#334155',6.5,'left');
      simText(ctx,pMin2.toFixed(1),14,GRAPH_TOP+GRAPH_H-6,'#334155',6.5,'left');

      function plotMomentum(hist,col,dash){
        ctx.save();ctx.strokeStyle=col;ctx.lineWidth=2;
        if(dash)ctx.setLineDash([5,4]);
        ctx.beginPath();
        for(var i=0;i<hist.length;i++){
          var px3=14+(W-28)*i/(MAX_HIST-1);
          var py3=midY-hist[i]/pRange2*(GRAPH_H-28);
          i===0?ctx.moveTo(px3,py3):ctx.lineTo(px3,py3);
        }
        ctx.stroke();ctx.setLineDash([]);ctx.restore();
      }
      plotMomentum(p1Hist,'#60a5fa',false);
      plotMomentum(p2Hist,'#f87171',false);
      plotMomentum(pTotHist,'#fbbf24',true);

      // Live legend
      var LX=W-18,LY=GRAPH_TOP+18;
      ctx.save();ctx.fillStyle='rgba(6,14,28,.8)';
      ctx.beginPath();ctx.roundRect(LX-86,LY-11,88,56,3);ctx.fill();ctx.restore();
      simText(ctx,'p₁ ='+p1_now.toFixed(2),LX-4,LY,'#60a5fa',7.5,'right');
      simText(ctx,'p₂ ='+p2_now.toFixed(2),LX-4,LY+16,'#f87171',7.5,'right');
      simText(ctx,'p∑='+pTot.toFixed(2),LX-4,LY+32,'#fbbf24',7.5,'right');
    } else {
      ctx.save();ctx.fillStyle='rgba(6,14,28,.82)';ctx.strokeStyle='#1e3a52';ctx.lineWidth=1;
      ctx.beginPath();ctx.roundRect(12,GRAPH_TOP,W-24,GRAPH_H,4);ctx.fill();ctx.stroke();ctx.restore();
      simText(ctx,'גרף תנע יופיע כשהגופים זעים',W/2,GRAPH_TOP+GRAPH_H/2,'#1e3a52',9,undefined,true);
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}


// ─────────────────────────────────────────────────────────────
// ENERGY: roller coaster track
// ─────────────────────────────────────────────────────────────
function simEnergy(canvas){
  // ── Canvas: taller to give room for track + graph + formula ──────
  const H=580; const {ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;
  const g=9.8;
  var m=1.0;

  // ── Layout zones ──────────────────────────────────────────────────
  // Zone 1: track scene   (top)    y: 0        .. SCENE_BOT
  // Zone 2: formula strip (middle) y: SCENE_BOT .. FORMULA_BOT
  // Zone 3: graph         (bottom) y: FORMULA_BOT .. H
  const SCENE_BOT  = 340;   // track scene bottom
  const FORMULA_BOT= 372;   // formula strip bottom
  const FLOOR_Y    = SCENE_BOT; // ground line = scene bottom

  // ── Track profile (fits inside scene zone) ────────────────────────
  const TRACK_TOP  = 18;    // highest track point y
  const TRACK_AMP  = FLOOR_Y - TRACK_TOP;  // ~322 px amplitude
  const PX_PER_M   = 55;   // pixels per metre

  function trackY(xf){
    return FLOOR_Y - TRACK_AMP*(
      0.52*Math.pow(Math.sin(xf*Math.PI),     2) +
      0.28*Math.pow(Math.sin(xf*Math.PI*2),   2) +
      0.14*Math.pow(Math.sin(xf*Math.PI*3.1), 2)
    );
  }

  const N=600;
  var TRACK=[];
  for(var ti=0;ti<N;ti++){
    var xf=ti/(N-1);
    TRACK.push({x:xf*W, y:trackY(xf)});
  }
  var minTrackY=Infinity;
  for(var ti=0;ti<N;ti++) if(TRACK[ti].y<minTrackY) minTrackY=TRACK[ti].y;

  // Arc-length table for speed↔dbt/dt conversion
  var arcLen=[0];
  for(var ai=1;ai<N;ai++){
    var adx=TRACK[ai].x-TRACK[ai-1].x, ady=TRACK[ai].y-TRACK[ai-1].y;
    arcLen.push(arcLen[ai-1]+Math.sqrt(adx*adx+ady*ady));
  }
  var totalArc=arcLen[N-1]; // total px

  // ── Physics state ─────────────────────────────────────────────────
  var bt=0.80;      // position along track [0..1]
  var trackVel=0;   // SIGNED speed in px/s along track (+bt = rightward)
  var pT=null;
  var dragging=false;
  var E_total=null; // conserved total energy in Joules, set on release
  var graphPE=[], graphKE=[], graphBT=[]; // PE, KE, position
  var MAX_G=320;

  function getMass(){
    var e=document.getElementById('inp-energy-m');
    return e ? Math.max(0.1, parseFloat(e.value)) : m;
  }

  // ── Geometry helpers ──────────────────────────────────────────────
  function ballPos(bv){
    bv=Math.max(0,Math.min(1,bv));
    var idx=Math.min(Math.floor(bv*(N-1)),N-2);
    var frac=bv*(N-1)-idx;
    return {
      x: TRACK[idx].x*(1-frac)+TRACK[idx+1].x*frac,
      y: TRACK[idx].y*(1-frac)+TRACK[idx+1].y*frac
    };
  }
  function heightAt(bv){
    return Math.max(0,(FLOOR_Y - ballPos(bv).y) / PX_PER_M);
  }
  // Slope angle in radians: positive = track rises going rightward (+bt)
  function slopeAt(bv){
    var idx=Math.min(Math.floor(bv*(N-1)),N-2);
    var sdx=TRACK[idx+1].x-TRACK[idx].x;
    var sdy=TRACK[idx+1].y-TRACK[idx].y; // screen y: positive = downward
    return Math.atan2(-sdy, sdx);
  }
  // Arc-length rate at bt: d(arc_px)/d(bt)
  function arcRateAt(bv){
    var idx=Math.min(Math.floor(bv*(N-1)),N-2);
    return Math.max(1, arcLen[idx+1]-arcLen[idx]);
  }

  // ── Drag interaction ──────────────────────────────────────────────
  function canvasXY(ev){
    var r=canvas.getBoundingClientRect();
    var scl=(canvas.width/dpr)/r.width;
    return {
      x:((ev.touches?ev.touches[0].clientX:ev.clientX)-r.left)*scl,
      y:((ev.touches?ev.touches[0].clientY:ev.clientY)-r.top)*scl
    };
  }
  function closestBt(cx,cy){
    var best=bt, bestD=Infinity;
    for(var ci=0;ci<N;ci++){
      var d=Math.hypot(TRACK[ci].x-cx,TRACK[ci].y-cy);
      if(d<bestD){bestD=d;best=ci/(N-1);}
    }
    return {bt:best,dist:bestD};
  }
  function onDown(ev){
    ev.preventDefault();
    var p=canvasXY(ev);
    if(p.y > FLOOR_Y+6) return; // ignore clicks in formula/graph zones
    var c=closestBt(p.x,p.y);
    if(c.dist<36){
      dragging=true; bt=c.bt; trackVel=0;
      E_total=null; graphPE=[]; graphKE=[];
    }
  }
  function onMove(ev){
    if(!dragging) return;
    ev.preventDefault();
    var p=canvasXY(ev);
    var c=closestBt(p.x,p.y);
    bt=c.bt; trackVel=0;
  }
  function onUp(){
    if(!dragging) return;
    dragging=false;
    m=getMass();
    E_total=m*g*heightAt(bt);
    trackVel=0; graphPE=[]; graphKE=[];
  }
  canvas.addEventListener('mousedown',onDown);
  canvas.addEventListener('touchstart',onDown,{passive:false});
  canvas.addEventListener('mousemove',onMove);
  canvas.addEventListener('touchmove',onMove,{passive:false});
  canvas.addEventListener('mouseup',onUp);
  canvas.addEventListener('touchend',onUp);

  // Reset button
  var resetBtn=document.getElementById('btn-energy-reset');
  if(resetBtn) resetBtn.addEventListener('click',function(){
    bt=0.80; trackVel=0; E_total=null; pT=null; graphPE=[]; graphKE=[];
    m=getMass(); E_total=m*g*heightAt(bt);
  });

  // Initialise
  m=getMass();
  E_total=m*g*heightAt(bt);

  // ── Physics update ────────────────────────────────────────────────
  // Proper constrained-track dynamics:
  //   a_tangential = -g * sin(slope)       [m/s²]
  //   trackVel is SIGNED speed in px/s along track
  //   dbt/dt  = trackVel / arcRateAt(bt)   [bt/s]
  // After each step: clamp |trackVel| to energy-conserved value,
  //   preserving sign — this makes the simulation numerically stable
  //   while keeping correct physics.

  function physicsStep(dt){
    if(dragging || E_total===null) return;

    var m_new=getMass();
    if(Math.abs(m_new-m)>0.001){
      // Mass changed: rescale E_total to match new PE at current height
      var h_now=heightAt(bt);
      var KE_frac = E_total>0 ? Math.max(0,(E_total-m*9.8*h_now)/E_total) : 0;
      E_total = m_new*9.8*h_now/(1-Math.min(0.99,KE_frac));
      if(!isFinite(E_total)||E_total<0) E_total=m_new*9.8*h_now;
    }
    m=m_new;

    var slope   = slopeAt(bt);
    var a_tang  = -g * Math.sin(slope) * PX_PER_M; // px/s² (along track)
    trackVel   += a_tang * dt;

    // Move along track
    var arcR = arcRateAt(bt);
    bt += (trackVel / arcR) * dt;

    // Boundary reflection
    if(bt <= 0){ bt=0.001; trackVel = Math.abs(trackVel)*0.98; }
    if(bt >= 1){ bt=0.999; trackVel = -Math.abs(trackVel)*0.98; }

    // Energy conservation correction: keep |trackVel| consistent with KE
    var PE_now = m * g * heightAt(bt);
    var KE_target = Math.max(0, E_total - PE_now);
    var v_target = Math.sqrt(2 * KE_target / m) * PX_PER_M; // px/s magnitude
    // Minimum nudge to prevent numerical sticking at hilltops
    if(v_target<0.8&&KE_target<0.01&&Math.abs(slopeAt(bt))>0.05) v_target=1.2;

    // Energy-corrected velocity — 100% conserved
    if(v_target > 0){
      // Correct speed to conserved value, preserve direction
      trackVel = Math.sign(trackVel || 1) * v_target;
    } else {
      // Turning point: PE >= E_total, reverse direction without energy loss
      trackVel = -Math.sign(trackVel || 1) * 0.01; // tiny reverse; next frame corrects
    }
  }

  // ── Draw ──────────────────────────────────────────────────────────
  function draw(ts){
    if(_simStop[id]) return;
    if(!pT) pT=ts;
    var dt=Math.min((ts-pT)/1000, 0.025); pT=ts;

    physicsStep(dt);

    m=getMass();
    var h   = heightAt(bt);
    var PE  = m*g*h;
    var KE  = E_total!==null ? Math.max(0,E_total-PE) : 0;
    var Etot= E_total!==null ? E_total : PE;

    // Record graph
    if(!dragging && E_total!==null){
      graphPE.push(PE); graphKE.push(KE); graphBT.push(bt);
      if(graphPE.length>MAX_G){ graphPE.shift(); graphKE.shift(); graphBT.shift(); }
    }

    var Emax = Math.max(Etot, 0.1);
    simBg(ctx,W,H);

    // ── Zone 1: Track scene ─────────────────────────────────────────
    // Terrain fill clipped to scene zone
    ctx.save();
    ctx.beginPath(); ctx.rect(0,0,W,FLOOR_Y+2); ctx.clip();
    var tgrad=ctx.createLinearGradient(0,minTrackY,0,FLOOR_Y);
    tgrad.addColorStop(0,'rgba(6,55,18,.8)'); tgrad.addColorStop(1,'rgba(4,28,10,.95)');
    ctx.beginPath();
    for(var ti=0;ti<N;ti++){
      ti===0?ctx.moveTo(TRACK[ti].x,TRACK[ti].y):ctx.lineTo(TRACK[ti].x,TRACK[ti].y);
    }
    ctx.lineTo(W,FLOOR_Y); ctx.lineTo(0,FLOOR_Y); ctx.closePath();
    ctx.fillStyle=tgrad; ctx.fill();
    ctx.strokeStyle='#22c55e'; ctx.lineWidth=2.5; ctx.stroke();
    ctx.restore();

    // Ground line
    ctx.save(); ctx.strokeStyle='#166534'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(0,FLOOR_Y); ctx.lineTo(W,FLOOR_Y); ctx.stroke();
    ctx.restore();

    // Height dashed line
    var bp=ballPos(bt);
    if(h > 0.05){
      ctx.save(); ctx.strokeStyle='rgba(251,191,36,.35)'; ctx.lineWidth=1; ctx.setLineDash([2,4]);
      ctx.beginPath(); ctx.moveTo(bp.x,bp.y); ctx.lineTo(bp.x,FLOOR_Y); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();
      var hx = bp.x<W*0.55 ? bp.x+9 : bp.x-9;
      var ha = bp.x<W*0.55 ? 'left' : 'right';
      simText(ctx,'h='+h.toFixed(2)+'m', hx, bp.y+14, '#fbbf24', 8.5, ha);
    }

    // Ball
    var bR=15;
    var bg3=ctx.createRadialGradient(bp.x-5,bp.y-6,2,bp.x,bp.y,bR);
    bg3.addColorStop(0,'#fde68a'); bg3.addColorStop(1,dragging?'#7c3aed':'#d97706');
    ctx.save(); ctx.shadowColor=dragging?'#a78bfa':'#fbbf24'; ctx.shadowBlur=dragging?18:10;
    simCircle(ctx,bp.x,bp.y,bR,bg3,'#fbbf24',2.5);
    ctx.restore();
    if(dragging) simText(ctx,'גרור ושחרר',bp.x,bp.y-bR-18,'#a78bfa',8.5,undefined,true);

    // Velocity arrow (tangent to track)
    var spd_ms = Math.sqrt(2*KE/Math.max(m,0.01));
    if(spd_ms>0.08 && !dragging && E_total!==null){
      var sl2  = slopeAt(bt);
      var vdir = trackVel>=0 ? 1 : -1;
      var vLen = Math.min(58, spd_ms*10);
      simArrow(ctx,bp.x,bp.y,
               bp.x+vdir*Math.cos(sl2)*vLen,
               bp.y-vdir*Math.sin(sl2)*vLen, '#22d3ee',2.5,10);
    }

    // ── Energy bars: right side of scene, clear of track peak ────────
    // Bars sit in a panel on the right, vertically within scene zone
    var BW=28, BH=FLOOR_Y-30, BY_b=12, barGap=10;
    var BX_ep=W-BW*2-barGap-16;  // EP bar left edge
    var BX_ek=BX_ep+BW+barGap;   // EK bar left edge

    // Background panel
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.90)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(BX_ep-12,BY_b-6,BW*2+barGap+24,BH+40,7);
    ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'אנרגיה (J)', BX_ep+BW+barGap/2, BY_b+8, '#22d3ee', 8.5, undefined, true);

    // EP bar (purple)
    var peH=Math.min(BH-20,(PE/Emax)*(BH-20));
    ctx.save(); ctx.fillStyle='rgba(99,102,241,.85)';
    ctx.beginPath(); ctx.roundRect(BX_ep, BY_b+20+BH-20-peH, BW, peH, 3); ctx.fill();
    ctx.strokeStyle='#818cf8'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(BX_ep, BY_b+20, BW, BH-20, 3); ctx.stroke(); ctx.restore();
    simText(ctx,'EP',  BX_ep+BW/2, BY_b+20+BH-20+13, '#818cf8', 8, undefined, true);
    simText(ctx,PE.toFixed(1)+'J', BX_ep+BW/2, BY_b+20+BH-20+24, '#818cf8', 7.5, undefined, true);

    // EK bar (yellow)
    var keH=Math.min(BH-20,(KE/Emax)*(BH-20));
    ctx.save(); ctx.fillStyle='rgba(251,191,36,.85)';
    ctx.beginPath(); ctx.roundRect(BX_ek, BY_b+20+BH-20-keH, BW, keH, 3); ctx.fill();
    ctx.strokeStyle='#fbbf24'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(BX_ek, BY_b+20, BW, BH-20, 3); ctx.stroke(); ctx.restore();
    simText(ctx,'EK',  BX_ek+BW/2, BY_b+20+BH-20+13, '#fbbf24', 8, undefined, true);
    simText(ctx,KE.toFixed(1)+'J', BX_ek+BW/2, BY_b+20+BH-20+24, '#fbbf24', 7.5, undefined, true);

    // E_total horizontal line across both bars
    var etH2=Math.min(BH-20,(Etot/Emax)*(BH-20));
    var etLineY=BY_b+20+BH-20-etH2;
    ctx.save(); ctx.strokeStyle='#34d399'; ctx.lineWidth=2; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(BX_ep-4, etLineY); ctx.lineTo(BX_ek+BW+4, etLineY);
    ctx.stroke(); ctx.setLineDash([]); ctx.restore();
    simText(ctx,'E='+Etot.toFixed(1), BX_ep+BW+barGap/2, etLineY-7, '#34d399', 7.5, undefined, true);

    // ── Zone 2: Formula strip ──────────────────────────────────────
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.92)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(6, FLOOR_Y+3, W-12, FORMULA_BOT-FLOOR_Y-5, 5);
    ctx.fill(); ctx.stroke(); ctx.restore();
    var fmid=FLOOR_Y+(FORMULA_BOT-FLOOR_Y)/2;
    simText(ctx,
      'EP = mgh = '+m.toFixed(1)+'×9.8×'+h.toFixed(2)+' = '+PE.toFixed(2)+' J',
      W/2, fmid-7, '#818cf8', 9, undefined, true);
    simText(ctx,
      'EK = ½mv² = '+KE.toFixed(2)+' J   |   E_כולל = '+Etot.toFixed(2)+' J = קבוע',
      W/2, fmid+8, '#34d399', 9, undefined, true);

    // ── Zone 3: EP+EK vs position graph ──────────────────────────────
    // x-axis = position along track (shows where ball is)
    // y-axis = energy. EP curve traces the potential energy landscape.
    // EP+EK = constant line shows conservation.
    var GX=6, GY=FORMULA_BOT+2, GW=W-12, GH=H-GY-6;
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.90)'; ctx.strokeStyle='#1e3a52'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.roundRect(GX,GY,GW,GH,5); ctx.fill(); ctx.stroke(); ctx.restore();

    if(graphPE.length > 4){
      var gAX=GX+10, gAY=GY+GH-12, gW2=GW-18, gH2=GH-24;
      var emax2=Math.max(Etot*1.05,0.1);

      // Draw axis lines
      ctx.save(); ctx.strokeStyle='#1e3a52'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.moveTo(gAX,GY+4); ctx.lineTo(gAX,gAY); ctx.lineTo(gAX+gW2,gAY); ctx.stroke();
      ctx.restore();

      // E_total flat reference line
      var etRefY=gAY-(Etot/emax2)*gH2;
      ctx.save(); ctx.strokeStyle='rgba(52,211,153,.45)'; ctx.lineWidth=1.8; ctx.setLineDash([5,4]);
      ctx.beginPath(); ctx.moveTo(gAX,etRefY); ctx.lineTo(gAX+gW2,etRefY); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();
      simText(ctx,'E='+Etot.toFixed(1)+'J (קבוע)',gAX+gW2-4,etRefY-5,'#34d399',7,'right');

      // EP scatter plot vs position (purple dots) — builds up the potential energy landscape
      ctx.save(); ctx.fillStyle='rgba(129,140,248,.7)';
      for(var gi=0;gi<graphBT.length;gi+=2){
        var gx=gAX+graphBT[gi]*gW2;
        var gy=Math.max(GY+4, gAY-(graphPE[gi]/emax2)*gH2);
        ctx.beginPath(); ctx.arc(gx,gy,1.8,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();

      // EK scatter plot vs position (yellow dots)
      ctx.save(); ctx.fillStyle='rgba(251,191,36,.7)';
      for(var gi=0;gi<graphBT.length;gi+=2){
        var gx=gAX+graphBT[gi]*gW2;
        var gy=Math.max(GY+4, gAY-(graphKE[gi]/emax2)*gH2);
        ctx.beginPath(); ctx.arc(gx,gy,1.8,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();

      // Current dot — EP (purple, larger)
      var curGX=gAX+bt*gW2;
      var curGY_pe=Math.max(GY+4,gAY-(PE/emax2)*gH2);
      ctx.save(); ctx.fillStyle='#818cf8'; ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(curGX,curGY_pe,5,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.restore();

      // Current dot — EK (yellow, larger)
      var curGY_ke=Math.max(GY+4,gAY-(KE/emax2)*gH2);
      ctx.save(); ctx.fillStyle='#fbbf24'; ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(curGX,curGY_ke,5,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.restore();

      // Legend
      simText(ctx,'● EP (J)',GX+14,GY+13,'#818cf8',7.5,'left');
      simText(ctx,'● EK (J)',GX+60,GY+13,'#fbbf24',7.5,'left');
      simText(ctx,'מיקום לאורך המסלול →',gAX+gW2,gAY+10,'#3d6480',7,'right');
      simText(ctx,'E (J) ↑',gAX+2,GY+22,'#64748b',7,'left');
      // EP and EK current values
      simText(ctx,'EP='+PE.toFixed(2)+'J  EK='+KE.toFixed(2)+'J',GX+GW-10,GY+13,'#94a3b8',7,'right');

    } else {
      simText(ctx,
        E_total!==null ? 'רץ — ממתין לנתונים...' : 'גרור כדור למיקום גבוה ושחרר → הגרף יתמלא',
        GX+GW/2, GY+GH/2, '#1e3a52', 9.5, undefined, true);
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}

// ─────────────────────────────────────────────────────────────
// SPRING: interactive drag, T slider
// ─────────────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════
// CH5 SIM 1: SPRING — SHM with draggable mass, k/m sliders, energy bars
// ═══════════════════════════════════════════════════════════════
function simSpring(canvas){
  const H=520; const {ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;
  // Layout constants — spring scene occupies top 55% of canvas
  const WX=20;          // wall right edge
  const MY=H*0.28;      // vertical centre of spring/mass
  const EQ=W*0.62;      // equilibrium x position of mass centre
  const MR=22;          // mass radius px
  // k range 0.1–25, default 2 → T≈3s for m=0.5
  let k=2, mass=0.5, theta=0, drag=false, pT=null;
  let amp=90;           // amplitude in px (max 110, min 8)
  let xHist=[], vHist=[];

  function readSliders(){
    const kS=document.getElementById('inp-spring-k');
    const mS=document.getElementById('inp-spring-m');
    if(kS){k=Math.max(0.1,parseFloat(kS.value));}
    if(mS){mass=Math.max(0.05,parseFloat(mS.value));}
  }
  ['inp-spring-k','inp-spring-m'].forEach(function(id2){
    const el=document.getElementById(id2);
    if(el)el.addEventListener('input',function(){readSliders();theta=0;xHist=[];vHist=[];});
  });
  readSliders();

  // Keep max history proportional to ~2.5 periods
  function maxHist(omega){ return Math.min(600,Math.round(2.5*2*Math.PI/omega/0.025)); }

  function draw(ts){
    if(_simStop[id])return;
    if(!pT)pT=ts;
    const dt=Math.min((ts-pT)/1000,0.025); pT=ts;
    readSliders();
    const omega=Math.sqrt(k/mass);
    if(!drag) theta+=omega*dt;
    const x=amp*Math.cos(theta);           // px displacement from EQ
    const vel=-amp*omega*Math.sin(theta);  // px/s
    const x_m=x/100;                       // metres
    const v_ms=vel/100;                    // m/s
    const T=2*Math.PI/omega;
    const mx=EQ+x;

    xHist.push(x_m);
    vHist.push(v_ms);
    const mh=maxHist(omega);
    while(xHist.length>mh){xHist.shift();vHist.shift();}

    simBg(ctx,W,H);

    // ── Wall
    ctx.save();ctx.fillStyle='#162236';ctx.fillRect(0,MY-90,WX,180);
    ctx.strokeStyle='#2d5275';ctx.lineWidth=1.5;
    for(let y=MY-84;y<MY+85;y+=14){ctx.beginPath();ctx.moveTo(WX,y);ctx.lineTo(WX-9,y+8);ctx.stroke();}
    ctx.restore();

    // ── Equilibrium dashed line
    ctx.save();ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=1;ctx.setLineDash([4,5]);
    ctx.beginPath();ctx.moveTo(EQ,MY-92);ctx.lineTo(EQ,MY+56);ctx.stroke();ctx.setLineDash([]);ctx.restore();
    simText(ctx,'מנוחה',EQ,MY-96,'#1e3a52',7.5,undefined,true);

    // ── Spring coil
    const stretch=x/Math.max(amp,1);
    const sc=stretch>0?'rgba(239,68,68,'+(0.45+0.55*Math.abs(stretch))+')':
                       'rgba(52,211,153,'+(0.45+0.55*Math.abs(stretch))+')';
    const segs=18, sLen=Math.max(10,mx-WX-MR-8), dxS=sLen/segs;
    const coilH=Math.min(18,16);
    ctx.save();ctx.strokeStyle=sc;ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(WX,MY);
    for(let i=0;i<segs;i++) ctx.lineTo(WX+(i+0.5)*dxS,MY+(i%2===0?coilH:-coilH));
    ctx.lineTo(mx-MR,MY);ctx.stroke();ctx.restore();

    // ── Mass
    const mg2=ctx.createRadialGradient(mx-MR*0.3,MY-MR*0.3,MR*0.1,mx,MY,MR);
    mg2.addColorStop(0,'#fde68a');mg2.addColorStop(0.6,'#d97706');mg2.addColorStop(1,'#92400e');
    ctx.save();ctx.shadowColor='rgba(251,191,36,.5)';ctx.shadowBlur=14;
    simCircle(ctx,mx,MY,MR,mg2,'#fbbf24',2.5);ctx.restore();
    simText(ctx,mass.toFixed(2)+'kg',mx,MY+5,'#1a0a00',9.5,undefined,true);

    // ── Force arrow (from mass edge)
    const F_val=-k*x_m;
    if(Math.abs(F_val)>0.001){
      const fCol=F_val>0?'#34d399':'#ef4444';
      // Cap arrow length so it never overlaps wall or leaves canvas
      const rawLen=F_val*4;
      const maxR=F_val>0?(W-mx-MR-8):-(mx-MR-WX-8);
      const fLen=Math.max(-80,Math.min(80,rawLen));
      if(Math.abs(fLen)>4){
        simArrow(ctx,mx+MR+3,MY,mx+MR+3+fLen,MY,fCol,2.5,10);
        simText(ctx,'F='+F_val.toFixed(3)+'N',mx+MR+3+fLen+(fLen>0?7:-7),MY-13,fCol,8.5,fLen>0?'left':'right',true);
      }
    }

    // ── x displacement arrow (below mass, only if space)
    if(Math.abs(x)>4){
      const col2=x>0?'#a78bfa':'#22d3ee';
      simArrow(ctx,EQ,MY+MR+12,mx,MY+MR+12,col2,1.8,7);
      simText(ctx,'x='+x_m.toFixed(4)+'m',(EQ+mx)/2,MY+MR+24,col2,8,undefined,true);
    }

    // ── Info panel — BELOW the spring zone, above energy bars
    const IP_Y=MY+MR+42;  // top of info panel
    const IP_H=62;
    ctx.save();ctx.fillStyle='rgba(6,14,28,.88)';ctx.strokeStyle='#1e4060';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(8,IP_Y,W-16,IP_H,5);ctx.fill();ctx.stroke();ctx.restore();
    // Two columns
    const col1x=24, col2x=W*0.5+10;
    simText(ctx,'T = 2π√(m/k) = '+T.toFixed(3)+' s',col1x,IP_Y+13,'#22d3ee',8.5,'left',true);
    simText(ctx,'ω = '+omega.toFixed(3)+' rad/s',col1x,IP_Y+27,'#22d3ee',8,'left',true);
    simText(ctx,'A = '+(amp/100).toFixed(3)+' m  (גרור מסה)',col1x,IP_Y+41,'#a78bfa',8,'left',true);
    simText(ctx,'x = '+x_m.toFixed(4)+' m',col2x,IP_Y+13,'#f59e0b',8.5,'left',true);
    simText(ctx,'v = '+v_ms.toFixed(4)+' m/s',col2x,IP_Y+27,'#22d3ee',8,'left',true);
    simText(ctx,'k='+k+' N/m  m='+mass.toFixed(2)+' kg',col2x,IP_Y+41,'#94a3b8',8,'left',true);

    // ── Energy bars — compact horizontal strip below info panel
    const Ek=0.5*mass*v_ms*v_ms;
    const Ep=0.5*k*x_m*x_m;
    const Etot=Math.max(0.5*k*Math.pow(amp/100,2),0.0001);
    const EB_Y=IP_Y+IP_H+8, EB_H=18;
    ctx.save();ctx.fillStyle='rgba(6,14,28,.85)';ctx.strokeStyle='#1e4060';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(8,EB_Y,W-16,EB_H+24,4);ctx.fill();ctx.stroke();ctx.restore();
    const barW=W-40, barX=20;
    // Ek bar (cyan, top)
    ctx.save();ctx.fillStyle='rgba(34,211,153,.8)';
    ctx.beginPath();ctx.roundRect(barX,EB_Y+3,Math.max(0,barW*(Ek/Etot)),8,2);ctx.fill();ctx.restore();
    ctx.save();ctx.strokeStyle='#22d3ee';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(barX,EB_Y+3,barW,8,2);ctx.stroke();ctx.restore();
    simText(ctx,'EK='+Ek.toFixed(4)+'J',barX+barW+6,EB_Y+10,'#22d3ee',7.5,'left');
    // Ep bar (yellow, bottom)
    ctx.save();ctx.fillStyle='rgba(245,158,11,.8)';
    ctx.beginPath();ctx.roundRect(barX,EB_Y+14,Math.max(0,barW*(Ep/Etot)),8,2);ctx.fill();ctx.restore();
    ctx.save();ctx.strokeStyle='#f59e0b';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(barX,EB_Y+14,barW,8,2);ctx.stroke();ctx.restore();
    simText(ctx,'EP='+Ep.toFixed(4)+'J  E_כולל='+Etot.toFixed(4)+'J',barX+barW+6,EB_Y+21,'#f59e0b',7.5,'left');

    // ── Combined x(t)+v(t) graph — bottom section
    const gL=8, gR=W-8, gTTop=EB_Y+EB_H+28, gBot=H-6;
    const gH=gBot-gTTop, gW=gR-gL;
    ctx.save();ctx.fillStyle='rgba(6,14,28,.88)';ctx.strokeStyle='#1e4060';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(gL,gTTop,gW,gH,5);ctx.fill();ctx.stroke();ctx.restore();
    const midG=gTTop+gH/2;
    ctx.save();ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=0.8;ctx.setLineDash([2,4]);
    ctx.beginPath();ctx.moveTo(gL+4,midG);ctx.lineTo(gR-4,midG);ctx.stroke();ctx.setLineDash([]);ctx.restore();
    simText(ctx,'x(t) ═ כתום   v(t) ═ כחול   —   90° הפרש פאזה (x שיא = v=0)',gL+gW/2,gTTop+10,'#64748b',7.5,undefined,true);
    simText(ctx,'t (s) →',gL+gW-6,gTTop+gH-4,'#3d6480',7,'right');
    simText(ctx,'x (m) / v (m/s) ↑',gL+6,gTTop+22,'#f59e0b',7,'left');

    if(xHist.length>3){
      const n=xHist.length;
      const tS=gW/n;
      const ampX=amp/100;
      const ampV=Math.max(ampX*omega,0.0001);
      // x(t) — orange
      ctx.save();ctx.strokeStyle='#f59e0b';ctx.lineWidth=2;ctx.beginPath();
      for(let i=0;i<n;i++){
        const px=gL+4+i*tS;
        const py=midG-xHist[i]/ampX*(gH*0.42);
        i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
      }
      ctx.stroke();ctx.restore();
      // v(t) — cyan
      ctx.save();ctx.strokeStyle='#22d3ee';ctx.lineWidth=2;ctx.beginPath();
      for(let i=0;i<n;i++){
        const px=gL+4+i*tS;
        const py=midG-vHist[i]/ampV*(gH*0.42);
        i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
      }
      ctx.stroke();ctx.restore();
      // Current dots
      const curPx=gL+4+(n-1)*tS;
      ctx.save();ctx.fillStyle='#f59e0b';ctx.strokeStyle='#fff';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(curPx,midG-x_m/ampX*(gH*0.42),4.5,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();
      ctx.save();ctx.fillStyle='#22d3ee';ctx.strokeStyle='#fff';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(curPx,midG-v_ms/ampV*(gH*0.42),4.5,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();
    } else {
      simText(ctx,'גרור את המסה כדי להתחיל',gL+gW/2,gTTop+gH/2,'#1e3a52',9,undefined,true);
    }

    requestAnimationFrame(draw);
  }

  // Drag to set amplitude
  function getCanvasX(e){
    const r=canvas.getBoundingClientRect();
    const scl=(canvas.width/dpr)/r.width;
    return ((e.touches?e.touches[0].clientX:e.clientX)-r.left)*scl;
  }
  function getCanvasY(e){
    const r=canvas.getBoundingClientRect();
    const scl=(canvas.height/dpr)/r.height;
    return ((e.touches?e.touches[0].clientY:e.clientY)-r.top)*scl;
  }
  canvas.addEventListener('mousedown',function(e){
    const cx=getCanvasX(e), cy=getCanvasY(e);
    const curMX=EQ+amp*Math.cos(theta);
    if(Math.hypot(cx-curMX,cy-MY)<MR+8) drag=true;
  });
  canvas.addEventListener('mousemove',function(e){
    if(!drag)return;
    amp=Math.max(8,Math.min(110,Math.abs(getCanvasX(e)-EQ)));
    theta=0; xHist=[]; vHist=[];
  });
  canvas.addEventListener('mouseup',function(){drag=false;});
  canvas.addEventListener('touchstart',function(e){
    const cx=getCanvasX(e), cy=getCanvasY(e);
    const curMX=EQ+amp*Math.cos(theta);
    if(Math.hypot(cx-curMX,cy-MY)<MR+12){drag=true;e.preventDefault();}
  },{passive:false});
  canvas.addEventListener('touchmove',function(e){
    if(!drag)return;
    amp=Math.max(8,Math.min(110,Math.abs(getCanvasX(e)-EQ)));
    theta=0; xHist=[]; vHist=[]; e.preventDefault();
  },{passive:false});
  canvas.addEventListener('touchend',function(){drag=false;});

  requestAnimationFrame(draw);
}

// ═══════════════════════════════════════════════════════════════
// CH5 SIM 2: SPRING-FORCE — Hooke's law F=-kx, F(x) graph, energy, damping
// ═══════════════════════════════════════════════════════════════
function simSpringForce(canvas){
  // SECTION: forces2.spring-force — כוח הקפיץ / חוק הוק
  // PEDAGOGY: Pure lab experiment. Horizontal spring, student drags the end.
  // Graph of F vs x builds up in real time → student discovers the linear relationship.
  // Shows: compression vs extension, force direction reversal, restoring force concept.
  const H=510; const {ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;
  let pT=null, t=0;
  var k=40, x=0, vel=0, b=0.8, m=0.4;
  var dragging=false, dragStartMouseX=0, dragStartX=0;
  var dataPoints=[]; // {x, F} pairs recorded live

  function getK(){var e=document.getElementById('inp-sf-k'); return e?parseFloat(e.value):k;}
  function getM(){var e=document.getElementById('inp-sf-m'); return e?parseFloat(e.value):m;}
  function getB(){var e=document.getElementById('inp-sf-damp'); return e?parseFloat(e.value):b;}

  var resetBtn=document.getElementById('btn-sf-reset');
  if(resetBtn)resetBtn.addEventListener('click',function(){x=0;vel=0;dataPoints=[];});
  var fmodeBtn=document.getElementById('btn-sf-fmode');
  if(fmodeBtn) fmodeBtn.addEventListener('click',function(){
    window._springForceModeAbs=!window._springForceModeAbs;
    fmodeBtn.textContent=window._springForceModeAbs?'📐 הצג |F|=k|x|':'📐 הצג F=-kx';
  });

  // Spring anchor on left wall
  var WALL_X=W*0.12, SPRING_Y=H*0.42;
  var EQ_X=WALL_X+W*0.35; // equilibrium position of mass
  var MASS_R=20;
  var PX_PER_M=200; // pixels per meter of displacement

  function getMouseX(evt){
    var r=canvas.getBoundingClientRect();
    var scl=(canvas.width/dpr)/r.width;
    return ((evt.touches?evt.touches[0].clientX:evt.clientX)-r.left)*scl;
  }
  function onDown(e){
    e.preventDefault();
    var mx=getMouseX(e);
    var massPx=EQ_X+x*PX_PER_M;
    if(Math.abs(mx-massPx)<30){dragging=true;dragStartMouseX=mx;dragStartX=x;vel=0;}
  }
  function onMove(e){
    if(!dragging)return; e.preventDefault();
    var mx=getMouseX(e);
    x=dragStartX+(mx-dragStartMouseX)/PX_PER_M;
    x=Math.max(-0.22,Math.min(0.22,x));
    vel=0;
  }
  function onUp(){dragging=false;}
  canvas.addEventListener('mousedown',onDown); canvas.addEventListener('touchstart',onDown,{passive:false});
  canvas.addEventListener('mousemove',onMove); canvas.addEventListener('touchmove',onMove,{passive:false});
  canvas.addEventListener('mouseup',onUp); canvas.addEventListener('touchend',onUp);

  function draw(ts){
    if(_simStop[id])return;
    if(!pT)pT=ts; var dt=Math.min((ts-pT)/1000,.04); pT=ts;
    t+=dt;
    k=getK(); m=getM(); b=getB();
    if(!dragging){
      // SHM: m*x'' = -k*x - b*x'
      var a2=(-k*x-b*vel)/m;
      vel+=a2*dt; x+=vel*dt;
    }
    var F=-k*x;
    // Record data point every 3 frames
    if(dataPoints.length===0||Math.abs(x-(dataPoints[dataPoints.length-1]||{x:999}).x)>0.005){
      dataPoints.push({x:x,F:F});
      if(dataPoints.length>150)dataPoints.shift();
    }

    var massPx=EQ_X+x*PX_PER_M;
    simBg(ctx,W,H);

    // ── WALL ─────────────────────────────────────────────
    ctx.save(); ctx.fillStyle='#1e3a52'; ctx.fillRect(WALL_X-16,SPRING_Y-60,16,120); ctx.restore();
    for(var yi=SPRING_Y-60;yi<SPRING_Y+60;yi+=14){
      ctx.save(); ctx.strokeStyle='#0f2035'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(WALL_X-16,yi); ctx.lineTo(WALL_X-28,yi+10); ctx.stroke(); ctx.restore();
    }
    // Floor guide line
    ctx.save(); ctx.strokeStyle='rgba(30,58,82,.3)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(WALL_X,SPRING_Y+MASS_R+4); ctx.lineTo(W*0.85,SPRING_Y+MASS_R+4); ctx.stroke(); ctx.restore();

    // ── SPRING ─────────────────────────────────────────────
    var sx1=WALL_X, sy=SPRING_Y;
    var sx2=massPx-MASS_R;
    var springLen=sx2-sx1; var coils=12;
    var coilH=springLen/coils;
    var compressed=x<-0.005, stretched=x>0.005;
    var springCol=compressed?'#60a5fa':stretched?'#f87171':'#a78bfa';
    ctx.save(); ctx.strokeStyle=springCol; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(sx1,sy);
    for(var ci=0;ci<coils;ci++){
      var fy=sy+(ci%2===0?14:-14);
      var fx=sx1+coilH*(ci+0.5);
      var fx2=sx1+coilH*(ci+1);
      ctx.quadraticCurveTo(fx,fy,fx2,sy);
    }
    ctx.stroke(); ctx.restore();

    // ── EQUILIBRIUM MARKER ─────────────────────────────────
    ctx.save(); ctx.strokeStyle='rgba(34,211,153,.4)'; ctx.lineWidth=1; ctx.setLineDash([4,5]);
    ctx.beginPath(); ctx.moveTo(EQ_X,SPRING_Y-50); ctx.lineTo(EQ_X,SPRING_Y+50); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
    simText(ctx,'x=0',EQ_X,SPRING_Y-52,'rgba(34,211,153,.6)',8,undefined,true);

    // Displacement indicator
    if(Math.abs(x)>0.005){
      ctx.save(); ctx.strokeStyle='rgba(251,191,36,.6)'; ctx.lineWidth=1.5; ctx.setLineDash([3,4]);
      ctx.beginPath(); ctx.moveTo(EQ_X,SPRING_Y-30); ctx.lineTo(massPx,SPRING_Y-30); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
      simArrow(ctx,EQ_X,SPRING_Y-30,massPx,SPRING_Y-30,'#fbbf24',1.5,7);
      simText(ctx,(x>=0?'+':'')+(x*100).toFixed(1)+' cm',(EQ_X+massPx)/2,SPRING_Y-40,'#fbbf24',8.5,undefined,true);
    }

    // x labels
    for(var xi2=-20;xi2<=20;xi2+=5){
      if(xi2===0)continue;
      var xpx=EQ_X+xi2*0.01*PX_PER_M;
      if(xpx<WALL_X+10||xpx>W*0.85)continue;
      ctx.save(); ctx.strokeStyle='rgba(30,58,82,.4)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(xpx,SPRING_Y+MASS_R+4); ctx.lineTo(xpx,SPRING_Y+MASS_R+10); ctx.stroke(); ctx.restore();
      simText(ctx,xi2+'',xpx,SPRING_Y+MASS_R+20,'#2d5275',7,undefined,true);
    }
    simText(ctx,'cm',EQ_X+22*0.01*PX_PER_M,SPRING_Y+MASS_R+20,'#2d5275',7,'left');

    // ── MASS ─────────────────────────────────────────────
    var mGrad=ctx.createRadialGradient(massPx,sy,4,massPx,sy,MASS_R);
    mGrad.addColorStop(0,springCol+'ff');
    mGrad.addColorStop(1,springCol+'44');
    ctx.save(); ctx.shadowColor=springCol; ctx.shadowBlur=dragging?18:10;
    ctx.fillStyle=mGrad; ctx.strokeStyle=springCol; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(massPx,sy,MASS_R,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.shadowBlur=0; ctx.restore();
    simText(ctx,m.toFixed(1)+'kg',massPx,sy+MASS_R+13,springCol,8,undefined,true);
    if(dragging) simText(ctx,'מושך...',massPx,sy-MASS_R-10,'#fbbf24',8.5,undefined,true);
    else if(t<4) simText(ctx,'← גרור',massPx,sy-MASS_R-10,'#fbbf24',8.5,undefined,true);

    // ── FORCE ARROW ──────────────────────────────────────
    if(Math.abs(F)>0.5){
      var fDir=Math.sign(F); // positive = rightward (toward eq)
      var fLen=Math.min(80,Math.abs(F)*1.2);
      simArrow(ctx,massPx,sy,massPx+fDir*fLen,sy,springCol,3,12);
      simText(ctx,'F='+F.toFixed(1)+'N',massPx+fDir*(fLen+4),sy-10,springCol,9.5,fDir>0?'left':'right');
    }

    // ── TOP FORMULA PANEL ─────────────────────────────────
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.92)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(8,6,W-16,50,6); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'חוק הוק: F = −kx',W/2,18,'#22d3ee',12,undefined,true);
    simText(ctx,'k = '+k+' N/m  |  x = '+(x*100).toFixed(1)+' cm  |  F = '+F.toFixed(2)+' N',W/2,32,'#94a3b8',9,undefined,true);
    var state=compressed?'דחיסה (F כיוון חיובי ← מחזיר)':stretched?'מתיחה (F כיוון שלילי ← מחזיר)':'שיווי משקל';
    simText(ctx,state,W/2,46,compressed?'#60a5fa':stretched?'#f87171':'#34d399',8.5,undefined,true);

    // ── F(x) GRAPH — Hooke's law: |F|=k|x| (default) or signed F=−kx (toggle) ──
    var signedMode=!!window._springForceModeAbs;
    var GX=W*0.64, GY=SPRING_Y-20, GW=W-GX-12, GH=H-GY-12;
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.9)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(GX,GY,GW,GH,5); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,signedMode?'F = −kx  (חוק הוק)':'|F| = k|x|  (חוק הוק)',GX+GW/2,GY+11,'#22d3ee',8,undefined,true);
    if(signedMode){
      // Four-quadrant signed graph: origin at panel center, line F=−kx
      var xRangeS=0.22, cOX=GX+GW/2, cOY=GY+14+(GH-24)/2;
      var sXsc=(GW-24)/(2*xRangeS), sFsc=(GH-28)/(2*k*xRangeS);
      ctx.save(); ctx.strokeStyle='#2d5275'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(cOX,GY+16); ctx.lineTo(cOX,GY+GH-8); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(GX+8,cOY); ctx.lineTo(GX+GW-6,cOY); ctx.stroke();
      ctx.restore();
      simText(ctx,'x →',GX+GW-8,cOY+9,'#2d5275',7,'right');
      simText(ctx,'F ↑',cOX+4,GY+22,'#2d5275',7,'left');
      ctx.save(); ctx.strokeStyle='rgba(34,211,153,.4)'; ctx.lineWidth=1.5; ctx.setLineDash([3,4]);
      ctx.beginPath();
      ctx.moveTo(cOX-xRangeS*sXsc, cOY-k*xRangeS*sFsc);
      ctx.lineTo(cOX+xRangeS*sXsc, cOY+k*xRangeS*sFsc);
      ctx.stroke(); ctx.setLineDash([]); ctx.restore();
      label(ctx,'F=−kx',cOX+26,cOY-22,'#22d3ee',7.5,'left');
      var spx=Math.max(GX+8,Math.min(GX+GW-6,cOX+x*sXsc));
      var spy=Math.max(GY+16,Math.min(GY+GH-8,cOY-F*sFsc));
      ctx.save(); ctx.fillStyle=springCol; ctx.strokeStyle='#030c15'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(spx,spy,5.5,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.restore();
      simText(ctx,'('+(x*100).toFixed(0)+'cm, '+F.toFixed(1)+'N)',spx+6,spy-6,springCol,7.5,'left');
      simText(ctx,'שיפוע = −k = −'+k+' N/m',GX+GW/2,GY+GH-2,'#64748b',7.5,undefined,true);
    } else {
    // Origin at bottom-left of data area
    var gOX=GX+10, gOY=GY+GH-10;
    var gDW=GW-18, gDH=GH-24;
    // Axes
    ctx.save(); ctx.strokeStyle='#2d5275'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(gOX,GY+14); ctx.lineTo(gOX,gOY); ctx.stroke(); // |F| up
    ctx.beginPath(); ctx.moveTo(gOX,gOY); ctx.lineTo(GX+GW-6,gOY); ctx.stroke(); // |x| right
    ctx.restore();
    simText(ctx,'|x| (m) →',GX+GW-8,gOY+9,'#2d5275',7,'right');
    simText(ctx,'|F| (N) ↑',gOX+4,GY+18,'#2d5275',7,'left');
    // Scale
    var xRange=0.22, fRange=k*xRange;
    var xSc=gDW/xRange, fSc=gDH/fRange;
    // Reference line |F|=k|x|: from origin (0,0) to (xRange, fRange)
    ctx.save(); ctx.strokeStyle='rgba(34,211,153,.4)'; ctx.lineWidth=1.5; ctx.setLineDash([3,4]);
    ctx.beginPath();
    ctx.moveTo(gOX, gOY);               // origin: |x|=0, |F|=0
    ctx.lineTo(gOX+xRange*xSc, gOY-fRange*fSc); // max: |x|=xRange, |F|=fRange
    ctx.stroke(); ctx.setLineDash([]); ctx.restore();
    label(ctx,'|F|=k|x|',gOX+gDW*0.55,gOY-gDH*0.6,'#22d3ee',7.5,'left');
    // Recorded data points using |x| and |F|
    if(dataPoints.length>2){
      ctx.save(); ctx.strokeStyle='#fbbf24'; ctx.lineWidth=2;
      ctx.beginPath();
      var pts=[]; // collect unique (|x|,|F|) points, sorted by |x|
      dataPoints.forEach(function(dp){
        pts.push({ax:Math.abs(dp.x), aF:Math.abs(dp.F)});
      });
      pts.sort(function(a,b){return a.ax-b.ax;});
      pts.forEach(function(dp,i){
        var px2=Math.min(gOX+dp.ax*xSc, GX+GW-6);
        var py2=Math.max(GY+14, gOY-dp.aF*fSc);
        i===0?ctx.moveTo(px2,py2):ctx.lineTo(px2,py2);
      });
      ctx.stroke(); ctx.restore();
    }
    // Current dot at (|x|, |F|)
    var cabsX=Math.abs(x), cabsF=Math.abs(F);
    var cpx2=Math.min(gOX+cabsX*xSc, GX+GW-6);
    var cpy2=Math.max(GY+14, gOY-cabsF*fSc);
    ctx.save(); ctx.fillStyle=springCol; ctx.strokeStyle='#030c15'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(cpx2,cpy2,5.5,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'('+Math.abs(x*100).toFixed(0)+'cm, '+cabsF.toFixed(1)+'N)',cpx2+6,cpy2-5,springCol,7.5,'left');
    simText(ctx,'שיפוע = k = '+k+' N/m',GX+GW/2,GY+GH-2,'#64748b',7.5,undefined,true);
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}

function simNormalForce(canvas){
  // SECTION: forces.normal-force — כוח נורמלי
  // PEDAGOGY: Focus is on WHY normal force exists (surface pushes back) and how it changes
  // with angle. Student rotates the incline and watches N decrease. Block slides when N insufficient.
  // Key visual: weight decomposition arrows W_perp and W_par shown as components.
  const H=500; const {ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;
  const g=9.8;
  let pT=null, t=0;
  var sPos=0, sVel=0;
  var theta_prev=-1;

  function getTheta(){var e=document.getElementById('inp-nf-theta'); return e?parseFloat(e.value):0;}
  function getMass(){var e=document.getElementById('inp-nf-mass'); return e?parseFloat(e.value):4;}
  function getMu(){var e=document.getElementById('inp-nf-mu'); return e?parseFloat(e.value):0;}

  var resetBtn=document.getElementById('btn-nf-reset');
  if(resetBtn)resetBtn.addEventListener('click',function(){sPos=0;sVel=0;});

  const BASE_X=W*0.08, BASE_Y=H-46;
  const INCL=Math.min(W*0.74,320);
  // ── Direct manipulation: grab the surface and tilt it ──
  var dragRamp=false;
  function _rampHit(p){var d=Math.hypot(p.x-BASE_X,p.y-BASE_Y);var a=Math.atan2(BASE_Y-p.y,p.x-BASE_X)*180/Math.PI;
    return d>26&&d<INCL+28&&a>-6&&a<80;}
  function _rDn(e){var p=simPointerXY(canvas,(window.devicePixelRatio||1),e);
    if(_rampHit(p)){dragRamp=true;canvas.style.cursor='grabbing';e.preventDefault();}}
  function _rMv(e){var p=simPointerXY(canvas,(window.devicePixelRatio||1),e);
    if(dragRamp){
      simSyncSlider('nf-theta',Math.atan2(BASE_Y-p.y,p.x-BASE_X)*180/Math.PI,0);e.preventDefault();
    } else canvas.style.cursor=_rampHit(p)?'grab':'';}
  function _rUp(){dragRamp=false;canvas.style.cursor='';}
  canvas.addEventListener('mousedown',_rDn);canvas.addEventListener('touchstart',_rDn,{passive:false});
  canvas.addEventListener('mousemove',_rMv);canvas.addEventListener('touchmove',_rMv,{passive:false});
  canvas.addEventListener('mouseup',_rUp);canvas.addEventListener('touchend',_rUp);

  function draw(ts){
    if(_simStop[id])return;
    if(!pT)pT=ts; var dt=Math.min((ts-pT)/1000,.04); pT=ts;
    t+=dt;
    var theta=getTheta(), m=getMass(), mu=getMu();
    // Reset sPos if angle changed
    if(Math.abs(theta-theta_prev)>0.5){sPos=0;sVel=0;theta_prev=theta;}
    var th=theta*Math.PI/180, cosT=Math.cos(th), sinT=Math.sin(th);

    var N=m*g*cosT;
    var W_par=m*g*sinT;
    var W_grav=m*g;
    var fk=mu*N;
    var a_net=W_par/m-mu*g*cosT;

    if(theta>0.5){
      sVel+=a_net*dt; sPos+=sVel*dt;
      if(sPos>INCL*0.88){sPos=INCL*0.88;sVel*=-0.2;}
      if(sPos<0){sPos=0;sVel=0;}
    } else {sPos=0;sVel=0;}

    var topX=BASE_X+INCL*cosT, topY=BASE_Y-INCL*sinT;
    var bS=34;
    var bCX=BASE_X+(sPos+bS/2)*cosT, bCY=BASE_Y-(sPos+bS/2)*sinT;

    simBg(ctx,W,H);

    // Ground base
    ctx.save(); ctx.fillStyle='#060d1a'; ctx.fillRect(0,BASE_Y,W,H-BASE_Y); ctx.restore();
    ctx.save(); ctx.strokeStyle='#2d5275'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,BASE_Y); ctx.lineTo(W,BASE_Y); ctx.stroke(); ctx.restore();

    // Incline fill
    ctx.save(); ctx.fillStyle='rgba(15,32,53,.85)';
    ctx.beginPath(); ctx.moveTo(BASE_X,BASE_Y); ctx.lineTo(topX,topY); ctx.lineTo(BASE_X,BASE_Y); ctx.closePath(); ctx.fill(); ctx.restore();
    ctx.save(); ctx.strokeStyle='#3d6480'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(BASE_X,BASE_Y); ctx.lineTo(topX,topY); ctx.stroke(); ctx.restore();
    // Surface micro-texture
    for(var si=16;si<INCL;si+=14){
      ctx.save(); ctx.strokeStyle='rgba(45,82,117,0.4)'; ctx.lineWidth=1;
      var tx=BASE_X+si*cosT,ty=BASE_Y-si*sinT;
      ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(tx-sinT*4,ty-cosT*4); ctx.stroke(); ctx.restore();
    }
    // Theta arc
    ctx.save(); ctx.strokeStyle='#fbbf24'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(BASE_X,BASE_Y,42,Math.PI,Math.PI+th); ctx.stroke(); ctx.restore();
    simText(ctx,theta.toFixed(0)+'°',BASE_X+26,BASE_Y-9,'#fbbf24',9.5,undefined,true);

    // Block (rotated)
    ctx.save(); ctx.translate(bCX,bCY); ctx.rotate(-th);
    var bG=ctx.createLinearGradient(-bS/2,-bS/2,-bS/2,bS/2);
    bG.addColorStop(0,'rgba(59,130,246,.9)'); bG.addColorStop(1,'rgba(29,78,216,.65)');
    ctx.fillStyle=bG; ctx.strokeStyle='#60a5fa'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.roundRect(-bS/2,-bS/2,bS,bS,4); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,m+'kg',bCX,bCY+4,'#bfdbfe',8.5,undefined,true);

    // ── FORCE VECTORS ─────────────────────────────────────
    var arSc=2.2;
    // W_total (gravity, straight down)
    var wLen=Math.min(64,W_grav*arSc);
    simArrow(ctx,bCX,bCY,bCX,bCY+wLen,'#fbbf24',2.5,10);
    simText(ctx,'W='+W_grav.toFixed(0)+'N',bCX+6,bCY+wLen+4,'#fbbf24',8,'left');

    // W decomposition: dashed components
    // W_par: along slope downward = (cosT, -sinT) direction
    var wpLen=Math.min(52,W_par*arSc);
    ctx.save(); ctx.strokeStyle='rgba(251,191,36,.45)'; ctx.lineWidth=1.5; ctx.setLineDash([3,4]);
    ctx.beginPath(); ctx.moveTo(bCX,bCY+wLen); ctx.lineTo(bCX-cosT*wpLen,bCY+wLen+sinT*wpLen); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
    ctx.save(); ctx.strokeStyle='rgba(251,191,36,.45)'; ctx.lineWidth=1.5; ctx.setLineDash([3,4]);
    var wnpLen=Math.min(52,N*arSc);
    ctx.beginPath(); ctx.moveTo(bCX,bCY+wLen); ctx.lineTo(bCX-sinT*wnpLen,bCY+wLen-cosT*wnpLen); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
    simText(ctx,'W∥='+W_par.toFixed(1)+'N',bCX-cosT*wpLen/2+8,bCY+wLen+sinT*wpLen/2+4,'rgba(251,191,36,.65)',7.5,'left');

    // Normal force (perpendicular OUT from surface)
    var nnx=-sinT, nny=-cosT;
    var nLen=Math.min(62,N*arSc);
    simArrow(ctx,bCX,bCY,bCX+nnx*nLen,bCY+nny*nLen,'#a78bfa',2.5,10);
    simText(ctx,'N='+N.toFixed(1)+'N',bCX+nnx*(nLen+5),bCY+nny*(nLen+5),'#a78bfa',9.5,'center');

    // Friction if any (up slope)
    if(mu>0.01&&sVel>0.04){
      var fLen=Math.min(46,fk*arSc);
      simArrow(ctx,bCX,bCY,bCX+cosT*fLen,bCY-sinT*fLen,'#f87171',2,8);
      simText(ctx,'fk='+fk.toFixed(1)+'N',bCX+cosT*fLen/2+6,bCY-sinT*fLen/2-8,'#f87171',7.5,undefined,true);
    }

    // ── Right panel ────────────────────────────────────────
    var PX=topX+12, PW=W-PX-10, PY=8;
    if(PW<85){PX=W*0.68;PW=W-PX-8;}
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.93)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(PX,PY,PW,H-PY-8,6); ctx.fill(); ctx.stroke(); ctx.restore();
    var PC=PX+PW/2;
    simText(ctx,'כוח נורמלי',PC,PY+13,'#22d3ee',10,undefined,true);
    simText(ctx,'N = mgcosθ',PC,PY+27,'#a78bfa',10,undefined,true);
    ctx.save(); ctx.strokeStyle='#1e4060'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(PX+5,PY+33); ctx.lineTo(PX+PW-5,PY+33); ctx.stroke(); ctx.restore();
    simText(ctx,'θ='+theta.toFixed(0)+'°',PC,PY+44,'#fbbf24',9,undefined,true);
    simText(ctx,'m='+m+' kg',PC,PY+57,'#60a5fa',9,undefined,true);
    simText(ctx,'cosθ='+cosT.toFixed(3),PC,PY+70,'#64748b',8.5,undefined,true);
    simText(ctx,'N='+N.toFixed(2)+'N',PC,PY+84,'#a78bfa',11,undefined,true);
    simText(ctx,'W∥='+W_par.toFixed(1)+'N',PC,PY+98,'#fbbf24',8.5,undefined,true);
    ctx.save(); ctx.strokeStyle='#1e4060'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(PX+5,PY+104); ctx.lineTo(PX+PW-5,PY+104); ctx.stroke(); ctx.restore();
    // Insight labels
    simText(ctx,'θ=0°: N=mg',PC,PY+115,'#64748b',8,undefined,true);
    simText(ctx,'θ=90°: N=0',PC,PY+127,'#64748b',8,undefined,true);
    simText(ctx,'מדרון תלול →',PC,PY+140,'#64748b',8,undefined,true);
    simText(ctx,'N קטנה!',PC,PY+152,'#f87171',8.5,undefined,true);

    // N(θ) mini graph
    var GY=PY+160, GH=78;
    ctx.save(); ctx.fillStyle='rgba(3,12,21,.8)'; ctx.strokeStyle='#1e3a52'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.roundRect(PX+3,GY,PW-6,GH,3); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'N(θ) — ניצב כפונקציה של זווית',PX+3+PW/2,GY+10,'#64748b',7.5,undefined,true);
    simText(ctx,'N (N) ↑',PX+5,GY+18,'#a78bfa',7,'left');
    simText(ctx,'θ (°) →',PX+PW-3,GY+GH-3,'#64748b',7,'right');
    ctx.save(); ctx.strokeStyle='rgba(167,139,250,.6)'; ctx.lineWidth=1.5;
    ctx.beginPath();
    for(var dth=0;dth<=90;dth+=2){
      var dthr=dth*Math.PI/180;
      var px2=PX+5+(dth/90)*(PW-10);
      var py2=GY+GH-6-Math.cos(dthr)*(GH-16);
      dth===0?ctx.moveTo(px2,py2):ctx.lineTo(px2,py2);
    }
    ctx.stroke(); ctx.restore();
    // Current point
    var cpx=PX+5+(theta/90)*(PW-10);
    var cpy=GY+GH-6-cosT*(GH-16);
    ctx.save(); ctx.fillStyle='#fbbf24'; ctx.strokeStyle='#030c15'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(Math.max(PX+5,Math.min(PX+PW-5,cpx)),Math.max(GY+8,Math.min(GY+GH-6,cpy)),5,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'0',PX+4,GY+GH-2,'#64748b',7,'left');
    simText(ctx,'90°',PX+PW-3,GY+GH-2,'#64748b',7,'right');

    // Top banner
    ctx.save(); ctx.fillStyle='rgba(6,14,28,.92)'; ctx.strokeStyle='#1e4060'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(8,6,topX-14,36,6); ctx.fill(); ctx.stroke(); ctx.restore();
    simText(ctx,'N = mg·cosθ = '+N.toFixed(1)+' N',BASE_X+(topX-BASE_X)/2,22,'#a78bfa',10,undefined,true);
    simText(ctx,'כוח הנורמל = רכיב כבידה ניצב למשטח',BASE_X+(topX-BASE_X)/2,34,'#64748b',8,undefined,true);

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}

function simForceTypes(canvas){
  // SECTION: forces.force-types — סוגי כוחות נפוצים
  // PEDAGOGY: Student clicks to toggle each force type ON/OFF on a block sitting on a surface.
  // Shows all 6 forces: gravity(W), normal(N), tension(T), friction(f), spring(F_spring), applied(F).
  // Goal: understand each force's direction, cause, and formula.
  const H=490; const {ctx,W,dpr}=setupCanvas(canvas,H);
  const id=canvas.id;
  const g=9.8;
  let pT=null, t=0;
  const m=4.0, k=25, mu=0.4;

  // Active forces (student can toggle each)
  var forces={
    gravity: {on:true,  label:'כוח כבידה (W)',  color:'#fbbf24', formula:'W = mg = '+( m*g).toFixed(0)+'N', dir:'down'},
    normal:  {on:true,  label:'כוח נורמלי (N)', color:'#a78bfa', formula:'N = mg = '+( m*g).toFixed(0)+'N', dir:'up'},
    applied: {on:false, label:'כוח מופעל (F)',  color:'#34d399', formula:'F = החלקה', dir:'right'},
